name: tayvoriq-editorial

services:
  ollama:
    image: ollama/ollama:0.40.18@sha256:4e0d5daa6c5cd91e27011977031466844c5ea4ba2393b35e78068835edec040b
    platform: linux/amd64
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    cpus: 6.0
    mem_limit: 18g
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - model_weights:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  model_weights:
