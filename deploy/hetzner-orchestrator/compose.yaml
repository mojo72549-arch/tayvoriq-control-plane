# FUTURE / SHADOW ONLY. No production controller, dispatch, Telegram sender or publisher.
# Prepare a pinned .env before using: cp .env.example .env; chmod 600 .env
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set a reviewed and pinned PostgreSQL image version}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      TZ: Europe/Berlin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      options: {max-size: "10m", max-file: "3"}

  n8n:
    image: ${N8N_IMAGE:?Set a reviewed and pinned n8n image version}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback only: NO public n8n editor or inbound webhook by default.
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?required}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?required}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "1000"
      N8N_LOG_LEVEL: "info"
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    logging:
      options: {max-size: "10m", max-file: "3"}

volumes:
  postgres_data:
  n8n_data:
