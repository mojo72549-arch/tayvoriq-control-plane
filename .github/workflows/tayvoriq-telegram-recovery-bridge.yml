name: TAYVORIQ Telegram Recovery Bridge

on:
  workflow_run:
    workflows:
      - TAYVORIQ Delivery Watch
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - .github/run-now/tayvoriq-telegram-status-probe.json

permissions:
  contents: read

concurrency:
  group: tayvoriq-telegram-recovery-bridge
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout current control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build truthful Telegram status
        id: status
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys
          import uuid
          from pathlib import Path

          output = Path(sys.argv[1])
          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          send = False
          message = ''

          if event_name == 'push':
              send = True
              message = (
                  '✅ TAYVORIQ · Telegram-Statuskanal aktiv\n\n'
                  'Recovery und Produktion bleiben autonom. Ab jetzt bekommst du wieder Meldungen bei echten Zustandsänderungen – ohne neues Go und ohne künstliche Prozentangaben.'
              )
          else:
              state_path = Path('.github/run-now/latest-delivery-run.json')
              if state_path.is_file():
                  try:
                      state = json.loads(state_path.read_text(encoding='utf-8'))
                  except Exception:
                      state = {}

                  recovery_state = str(state.get('recovery_state') or '').upper()
                  run_id = str(state.get('run_id') or '').strip()
                  run_attempt = int(state.get('run_attempt') or 1)
                  recovery_run_id = str(state.get('recovery_run_id') or '').strip()
                  request_id = str(state.get('request_id') or '').strip()
                  request_file = str(state.get('request_file') or '').strip()
                  topic = ''

                  if request_file:
                      request_path = Path(request_file)
                      if request_path.is_file():
                          try:
                              request = json.loads(request_path.read_text(encoding='utf-8'))
                              topic = str(request.get('topic') or '').strip()
                          except Exception:
                              pass

                  label = topic or request_id or 'freigegebener Auftrag'

                  if recovery_state == 'AUTO_RECOVERY_QUEUED':
                      send = True
                      message = (
                          f'🔧 TAYVORIQ · Recovery läuft\n\n'
                          f'Thema: {label}\n'
                          f'Run: {run_id} · nächster Reparaturversuch: {run_attempt + 1}/3\n\n'
                          '✅ Deine Trendfreigabe bleibt gültig.\n'
                          '➡️ Derselbe Produktionslauf wird automatisch weiter repariert und erneut geprüft.\n'
                          'Für dich: ✅ Keine Aktion nötig.'
                      )
                  elif recovery_state in {'REQUEST_BOUND_RECOVERY_REQUIRED', 'REQUEST_BOUND_RECOVERY_QUEUED', 'REQUEST_BOUND_RECOVERY_RUNNING'}:
                      send = True
                      next_run = f'\nNeuer Recovery-Run: {recovery_run_id}' if recovery_run_id.isdigit() else ''
                      message = (
                          f'🛠️ TAYVORIQ · Lokale Reparatur läuft weiter\n\n'
                          f'Thema: {label}\n'
                          f'Ausgangs-Run: {run_id}{next_run}\n\n'
                          '✅ Freigabe, Quellen und vorhandene Produktionsdaten bleiben erhalten.\n'
                          '➡️ Nur der blockierende Prüfpunkt wird erneut bearbeitet.\n'
                          'Für dich: ✅ Keine Aktion nötig.'
                      )
                  elif recovery_state in {'TECHNICAL_FAILURE', 'AUTONOMOUS_TECHNICAL_ESCALATION'}:
                      send = True
                      message = (
                          f'⚠️ TAYVORIQ · Technischer Stop erkannt\n\n'
                          f'Thema: {label}\n'
                          f'Run: {run_id}\n\n'
                          'Es wurde nichts veröffentlicht und keine neue Trendfreigabe erzeugt. Der bestehende Auftrag bleibt eindeutig erhalten.'
                      )
                  # EXTERNAL_ACTION_REQUIRED and AUTONOMOUS_RECOVERY_EXHAUSTED already
                  # have dedicated messages in Delivery Watch. SUCCESS is handled by the
                  # normal review/publish path. Skipping them here prevents duplicates.

          token = f'TAYVORIQ_{uuid.uuid4().hex}'
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f"send={'true' if send else 'false'}\n")
              handle.write(f'text<<{token}\n{message}\n{token}\n')
          print({'event': event_name, 'send': send})
          PY

      - name: Send Telegram recovery status
        if: steps.status.outputs.send == 'true'
        env:
          MESSAGE: ${{ steps.status.outputs.text }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")
          python - "$response" <<'PY'
          import json
          import sys
          payload = json.loads(sys.argv[1])
          if payload.get('ok') is not True:
              raise SystemExit('TELEGRAM_SEND_NOT_CONFIRMED')
          result = payload.get('result') or {}
          print(f"TELEGRAM_SEND_CONFIRMED message_id={result.get('message_id')}")
          PY

      - name: Record intentional no-op
        if: steps.status.outputs.send != 'true'
        run: echo "No additional recovery Telegram message required for this verified state."
