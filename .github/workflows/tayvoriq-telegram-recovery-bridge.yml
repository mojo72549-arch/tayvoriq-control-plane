name: TAYVORIQ Telegram Recovery Bridge

on:
  workflow_run:
    workflows:
      - TAYVORIQ Delivery Watch
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - .github/run-now/tayvoriq-telegram-status-probe.json

permissions:
  contents: write

concurrency:
  group: tayvoriq-telegram-recovery-bridge
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout current control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build truthful Telegram status
        id: status
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys
          import uuid
          from pathlib import Path

          output = Path(sys.argv[1])
          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          send = False
          mode = 'text'
          video_url = ''
          delivery_nonce = ''
          source_run_id = ''
          message = ''

          if event_name == 'push':
              delivery_path = Path('.github/run-now/tayvoriq-send-existing-video.json')
              receipt_path = Path('.github/run-now/tayvoriq-telegram-bridge-receipt.json')
              delivery = {}
              receipt = {}
              if delivery_path.is_file():
                  try:
                      delivery = json.loads(delivery_path.read_text(encoding='utf-8'))
                  except Exception:
                      delivery = {}
              if receipt_path.is_file():
                  try:
                      receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
                  except Exception:
                      receipt = {}

              delivery_nonce = str(delivery.get('delivery_nonce') or '').strip()
              source_run_id = str(delivery.get('source_run_id') or '').strip()
              video_url = str(delivery.get('video_url') or '').strip()
              topic = str(delivery.get('topic') or '').strip()
              already_confirmed = (
                  delivery_nonce
                  and str(receipt.get('delivery_nonce') or '') == delivery_nonce
                  and receipt.get('status') == 'TELEGRAM_VIDEO_SEND_CONFIRMED'
              )

              if (
                  not already_confirmed
                  and source_run_id == '32122612482'
                  and delivery_nonce
                  and video_url.startswith('https://')
                  and 'short_tiktok.mp4' in video_url
              ):
                  send = True
                  mode = 'video'
                  message = (
                      '🎬 TAYVORIQ · EM-Leichtathletik\n\n'
                      f'{topic}\n\n'
                      '✅ Publishability und finales Quality-Gate bestanden.\n'
                      '➡️ Hier ist die fertige MP4 zur Review/Freigabe.'
                  )
              elif not delivery_nonce:
                  send = True
                  message = (
                      '✅ TAYVORIQ · Telegram-Statuskanal aktiv\n\n'
                      'Recovery und Produktion bleiben autonom. Ab jetzt bekommst du wieder Meldungen bei echten Zustandsänderungen – ohne neues Go und ohne künstliche Prozentangaben.'
                  )
          else:
              # Golden Path owns production progress and concrete failure messages.
              # Delivery Watch must recover silently; this bridge must not duplicate
              # AUTO_RECOVERY_QUEUED / REQUEST_BOUND_* / TECHNICAL_FAILURE Telegram spam.
              send = False

          token = f'TAYVORIQ_{uuid.uuid4().hex}'
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f"send={'true' if send else 'false'}\n")
              handle.write(f'mode={mode}\n')
              handle.write(f'video_url={video_url}\n')
              handle.write(f'delivery_nonce={delivery_nonce}\n')
              handle.write(f'source_run_id={source_run_id}\n')
              handle.write(f'text<<{token}\n{message}\n{token}\n')
          print({'event': event_name, 'send': send, 'mode': mode, 'source_run_id': source_run_id})
          PY

      - name: Send Telegram recovery status
        id: telegram
        if: steps.status.outputs.send == 'true'
        env:
          MESSAGE: ${{ steps.status.outputs.text }}
          MODE: ${{ steps.status.outputs.mode }}
          VIDEO_URL: ${{ steps.status.outputs.video_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          if [ "$MODE" = "video" ]; then
            test -n "$VIDEO_URL"
            curl -fL --retry 3 --retry-all-errors "$VIDEO_URL" -o /tmp/tayvoriq-review.mp4
            bytes=$(stat -c%s /tmp/tayvoriq-review.mp4)
            test "$bytes" -ge 1000000 || { echo "TELEGRAM_VIDEO_DOWNLOAD_TOO_SMALL:$bytes"; exit 1; }
            response=$(curl -fsS --retry 3 --retry-all-errors -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "video=@/tmp/tayvoriq-review.mp4" \
              -F "supports_streaming=true" \
              -F "caption=${MESSAGE}")
          else
            response=$(curl -fsS --retry 3 --retry-all-errors -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}")
          fi
          parsed=$(MODE="$MODE" python - "$response" <<'PY'
          import json
          import os
          import sys
          payload = json.loads(sys.argv[1])
          if payload.get('ok') is not True:
              raise SystemExit('TELEGRAM_SEND_NOT_CONFIRMED')
          result = payload.get('result') or {}
          message_id = result.get('message_id')
          if not isinstance(message_id, int):
              raise SystemExit('TELEGRAM_MESSAGE_ID_MISSING')
          mode = os.environ.get('MODE')
          video = result.get('video') if isinstance(result.get('video'), dict) else {}
          if mode == 'video' and not video.get('file_id'):
              raise SystemExit('TELEGRAM_VIDEO_FILE_ID_MISSING')
          print(f"{message_id}|{video.get('file_size') or ''}")
          PY
          )
          message_id=${parsed%%|*}
          file_size=${parsed#*|}
          echo "message_id=$message_id" >> "$GITHUB_OUTPUT"
          echo "media_type=$MODE" >> "$GITHUB_OUTPUT"
          echo "file_size=$file_size" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "video" ]; then
            echo "TELEGRAM_SENDVIDEO_CONFIRMED message_id=$message_id file_size=$file_size"
          else
            echo "TELEGRAM_SEND_CONFIRMED message_id=$message_id"
          fi

      - name: Persist confirmed Telegram receipt
        if: steps.status.outputs.send == 'true' && steps.telegram.outputs.message_id != ''
        env:
          TELEGRAM_MESSAGE_ID: ${{ steps.telegram.outputs.message_id }}
          TELEGRAM_MEDIA_TYPE: ${{ steps.telegram.outputs.media_type }}
          TELEGRAM_FILE_SIZE: ${{ steps.telegram.outputs.file_size }}
          DELIVERY_NONCE: ${{ steps.status.outputs.delivery_nonce }}
          SOURCE_RUN_ID: ${{ steps.status.outputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .github/run-now
            python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          media_type = os.environ.get('TELEGRAM_MEDIA_TYPE') or 'text'
          payload = {
              'schema_version': 'v2',
              'status': 'TELEGRAM_VIDEO_SEND_CONFIRMED' if media_type == 'video' else 'TELEGRAM_SEND_CONFIRMED',
              'message_id': int(os.environ['TELEGRAM_MESSAGE_ID']),
              'media_type': media_type,
              'file_size': int(os.environ['TELEGRAM_FILE_SIZE']) if str(os.environ.get('TELEGRAM_FILE_SIZE') or '').isdigit() else None,
              'delivery_nonce': os.environ.get('DELIVERY_NONCE') or '',
              'source_run_id': os.environ.get('SOURCE_RUN_ID') or '',
              'event_name': os.environ.get('GITHUB_EVENT_NAME'),
              'workflow_run_id': int(os.environ.get('GITHUB_RUN_ID') or 0),
              'confirmed_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          Path('.github/run-now/tayvoriq-telegram-bridge-receipt.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(payload)
          PY
            git add .github/run-now/tayvoriq-telegram-bridge-receipt.json
            git commit -m "ops(tayvoriq): record confirmed Telegram media delivery" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Record intentional no-op
        if: steps.status.outputs.send != 'true'
        run: echo "No additional recovery Telegram message required for this verified state."
