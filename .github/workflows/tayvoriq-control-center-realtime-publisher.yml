name: TAYVORIQ Control Center Realtime Publisher

on:
  workflow_run:
    workflows:
      - TAYVORIQ-X Golden Path
      - TAYVORIQ Agent Orchestrator V2
      - TAYVORIQ Production Green Promoter
      - TAYVORIQ Deterministic Codefix Continuity
      - TAYVORIQ Delivery Watch
      - TAYVORIQ Request Continuity Watchdog
      - TAYVORIQ Ops Health
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing control-plane run id to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: tayvoriq-control-center-realtime-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout current control plane
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve authoritative run
        id: run
        shell: bash
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          run_id="${EVENT_RUN_ID:-${INPUT_RUN_ID:-}}"
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid run id: $run_id" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Suppress retired production request telemetry
        id: retired
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          run_id = int(os.environ['RUN_ID'])
          path = Path('.github/state/tayvoriq-retired-production-requests.json')
          suppressed = False
          request_id = ''
          if path.is_file():
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  data = {}
              requests = data.get('requests') if isinstance(data.get('requests'), dict) else {}
              for rid, item in requests.items():
                  if not isinstance(item, dict):
                      continue
                  blocked = item.get('blocked_run_ids') if isinstance(item.get('blocked_run_ids'), list) else []
                  blocked_ids = set()
                  for value in blocked:
                      try:
                          blocked_ids.add(int(value))
                      except (TypeError, ValueError):
                          pass
                  if run_id in blocked_ids and item.get('allow_notifications') is False:
                      suppressed = True
                      request_id = str(rid)
                      break
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"suppressed={'true' if suppressed else 'false'}\n")
              handle.write(f"request_id={request_id}\n")
          print({'run_id': run_id, 'suppressed': suppressed, 'request_id': request_id or None})
          PY

      - name: Record retired telemetry suppression
        if: steps.retired.outputs.suppressed == 'true'
        run: echo "Retired request telemetry suppressed for run ${{ steps.run.outputs.run_id }} (${{ steps.retired.outputs.request_id }})."

      - name: Publish verified telemetry signal
        if: steps.retired.outputs.suppressed != 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          ENDPOINT: https://hlsnvfdjhmnulphosghd.supabase.co/functions/v1/tayvoriq-ingest
        run: |
          set -euo pipefail
          body=$(printf '{"repo":"%s","run_id":%s}' "$GITHUB_REPOSITORY" "$RUN_ID")
          response=$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 8 --max-time 25 \
            -H 'Content-Type: application/json' \
            -X POST "$ENDPOINT" \
            --data-binary "$body")
          echo "$response"
