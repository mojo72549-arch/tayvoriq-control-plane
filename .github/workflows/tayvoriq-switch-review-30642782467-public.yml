name: TAYVORIQ Switch Approved Review To Public

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-switch-review-30642782467-public.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch-public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Change approved recovery workflow to public
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path=Path('.github/workflows/tayvoriq-manual-approved-publish-30642782467.yml')
          text=path.read_text(encoding='utf-8')
          rules=[
              ('YOUTUBE_PRIVACY: "private"','YOUTUBE_PRIVACY: "public"'),
              ('test "$YOUTUBE_PRIVACY" = "private"','test "$YOUTUBE_PRIVACY" = "public"'),
              ('Publish approved YouTube video privately','Publish approved YouTube video publicly'),
              ("'status':'PUBLISHED_PRIVATE'","'status':'PUBLISHED_PUBLIC'"),
              ("'approval_source':'explicit_user_telegram_approval_recovery'","'approval_source':'explicit_user_public_correction'"),
              ("'Sichtbarkeit: privat\\n\\n'","'Sichtbarkeit: öffentlich\\n\\n'"),
          ]
          for old,new in rules:
              if old not in text:
                  raise SystemExit(f'Migration token missing: {old}')
              text=text.replace(old,new)
          path.write_text(text,encoding='utf-8')
          PY

      - name: Verify public upload contract
        run: |
          set -euo pipefail
          grep -F 'YOUTUBE_PRIVACY: "public"' .github/workflows/tayvoriq-manual-approved-publish-30642782467.yml
          grep -F 'test "$YOUTUBE_PRIVACY" = "public"' .github/workflows/tayvoriq-manual-approved-publish-30642782467.yml
          grep -F "'status':'PUBLISHED_PUBLIC'" .github/workflows/tayvoriq-manual-approved-publish-30642782467.yml
          grep -F 'Sichtbarkeit: öffentlich' .github/workflows/tayvoriq-manual-approved-publish-30642782467.yml

      - name: Trigger public upload
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tayvoriq-manual-approved-publish-30642782467.yml
          git commit -m "ops(tayvoriq): publish approved review 30642782467 publicly"
          git pull --rebase origin main
          git push origin main
