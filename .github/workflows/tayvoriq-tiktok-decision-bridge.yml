name: TAYVORIQ TikTok Telegram Decision Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-tiktok-decision-bridge.yml
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: tayvoriq-tiktok-decisions
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  process-tiktok-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Process TikTok approval callbacks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token=os.environ.get('TELEGRAM_BOT_TOKEN','').strip()
          expected_chat=os.environ.get('TELEGRAM_CHAT_ID','').strip()
          if not token or not expected_chat:
              raise SystemExit('Telegram configuration missing')

          state_path=Path('.automation/tayvoriq-tiktok-decision-state.json')
          state={'next_update_id':0,'decisions':{}}
          if state_path.is_file():
              try:
                  loaded=json.loads(state_path.read_text(encoding='utf-8'))
                  if isinstance(loaded,dict): state.update(loaded)
              except Exception:
                  pass
          state.setdefault('decisions',{})

          def telegram(method,payload):
              req=urllib.request.Request(
                  f'https://api.telegram.org/bot{token}/{method}',
                  data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),
                  headers={'Content-Type':'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req,timeout=35) as response:
                  value=json.loads(response.read().decode('utf-8'))
              if not value.get('ok'):
                  raise RuntimeError(value)
              return value.get('result')

          pattern=re.compile(r'^tayvoriqtiktok:(approve|reject):(\d{6,})$')
          handled=0
          for _ in range(10):
              updates=telegram('getUpdates',{
                  'offset':int(state.get('next_update_id') or 0),
                  'limit':100,
                  'timeout':0,
                  'allowed_updates':['callback_query'],
              }) or []
              if not updates:
                  break
              for update in updates:
                  update_id=int(update.get('update_id') or 0)
                  state['next_update_id']=max(int(state.get('next_update_id') or 0),update_id+1)
                  callback=update.get('callback_query') if isinstance(update.get('callback_query'),dict) else {}
                  callback_id=str(callback.get('id') or '').strip()
                  match=pattern.fullmatch(str(callback.get('data') or '').strip())
                  if not callback_id or not match:
                      continue
                  action,review_id=match.groups()
                  message=callback.get('message') if isinstance(callback.get('message'),dict) else {}
                  chat=message.get('chat') if isinstance(message.get('chat'),dict) else {}
                  chat_id=str(chat.get('id') or '').strip()
                  message_id=int(message.get('message_id') or 0)
                  if chat_id != expected_chat:
                      telegram('answerCallbackQuery',{
                          'callback_query_id':callback_id,
                          'text':'Nicht autorisierter Chat.',
                          'show_alert':True,
                      })
                      continue

                  review_path=Path(f'.automation/tayvoriq-tiktok-reviews/{review_id}.json')
                  try:
                      review=json.loads(review_path.read_text(encoding='utf-8'))
                  except Exception:
                      telegram('answerCallbackQuery',{
                          'callback_query_id':callback_id,
                          'text':'TikTok-Reviewdaten fehlen.',
                          'show_alert':True,
                      })
                      continue

                  previous=str(review.get('status') or '').upper()
                  if previous in {'APPROVED','REJECTED'}:
                      telegram('answerCallbackQuery',{
                          'callback_query_id':callback_id,
                          'text':'Diese TikTok-Review wurde bereits verarbeitet.',
                      })
                      continue

                  status='APPROVED' if action=='approve' else 'REJECTED'
                  review.update({
                      'status':status,
                      'processed_at':datetime.now(timezone.utc).isoformat(),
                      'source':'telegram_callback',
                      'telegram_message_id':message_id,
                      'tiktok_upload_mode':'manual',
                  })
                  review_path.write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  state['decisions'][review_id]=review

                  telegram('answerCallbackQuery',{
                      'callback_query_id':callback_id,
                      'text':'TikTok-Freigabe gespeichert.' if status=='APPROVED' else 'TikTok-Review abgelehnt.',
                  })
                  if message_id:
                      telegram('editMessageReplyMarkup',{
                          'chat_id':chat_id,
                          'message_id':message_id,
                          'reply_markup':{'inline_keyboard':[]},
                      })

                  if status=='APPROVED':
                      caption=str(review.get('tiktok_caption') or '').strip()
                      text=(
                          '✅ TikTok-Freigabe gespeichert\n\n'
                          'Das Video aus der vorherigen Telegram-Nachricht speichern und in TikTok hochladen.\n\n'
                          'Caption zum Kopieren:\n'+caption
                      )
                  else:
                      text='❌ TikTok-Video abgelehnt. Es wird nicht für TikTok verwendet.'
                  telegram('sendMessage',{
                      'chat_id':expected_chat,
                      'text':text,
                      'disable_web_page_preview':True,
                  })
                  handled+=1

          state['last_checked_at']=datetime.now(timezone.utc).isoformat()
          state['last_handled_count']=handled
          state_path.parent.mkdir(parents=True,exist_ok=True)
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print({'handled':handled,'next_update_id':state.get('next_update_id')})
          PY

      - name: Persist TikTok decisions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/tayvoriq-tiktok-decision-state.json \
                  .automation/tayvoriq-tiktok-reviews 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record TAYVORIQ TikTok decision"
          git pull --rebase origin main
          git push origin main
