name: Project Lumen Release Hardening

on:
  pull_request:
    paths:
      - 'lumen138/**'
      - 'docs/project-lumen-release/**'
      - '.github/workflows/lumen-android-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reject embedded keys and credentials
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files 'lumen138/**/*.jks' 'lumen138/**/*.keystore' | grep -q .; then
            echo "Tracked signing key detected." >&2
            exit 1
          fi
          if rg -n -F 'LumenPilot137!' lumen138 .github/workflows/lumen-android-relay.yml; then
            echo "Retired pilot credential detected." >&2
            exit 1
          fi
          if rg -n '(BEGIN (RSA |EC )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})' lumen138; then
            echo "Possible embedded secret detected." >&2
            exit 1
          fi

      - name: Unit tests lint debug APK and unsigned release AAB
        working-directory: lumen138
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          gradle --no-daemon testDebugUnitTest lintDebug lintRelease assembleDebug bundleRelease             2>&1 | tee ../dist/android-build.log
          cp app/build/outputs/apk/debug/app-debug.apk             ../dist/Project_Lumen_13.2.0_RC1_Internal_Debug.apk
          cp app/build/outputs/bundle/release/app-release.aab             ../dist/Project_Lumen_13.2.0_RC1_UNSIGNED_DO_NOT_UPLOAD.aab
          sha256sum ../dist/Project_Lumen_13.2.0_RC1_Internal_Debug.apk             ../dist/Project_Lumen_13.2.0_RC1_UNSIGNED_DO_NOT_UPLOAD.aab             > ../dist/SHA256SUMS.txt
          if [ -d app/build/reports/tests ]; then cp -R app/build/reports/tests ../dist/test-reports; fi
          if [ -d app/build/reports/lint-results-debug.html ]; then
            cp app/build/reports/lint-results-debug.html ../dist/
          fi
          if [ -f app/build/reports/lint-results-release.html ]; then
            cp app/build/reports/lint-results-release.html ../dist/
          fi
          printf '%s\n'             'NOT STORE READY: release AAB is intentionally unsigned.'             'Production signing requires all four LUMEN_RELEASE_* environment values.'             > ../dist/UNSIGNED_RELEASE_NOTICE.txt

      - name: Verify package version manifest and debug signature
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/Project_Lumen_13.2.0_RC1_Internal_Debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify             --verbose --print-certs "$APK" | tee dist/apk-signature.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK"             | tee dist/apk-badging.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump xmltree "$APK"             AndroidManifest.xml | tee dist/apk-manifest.txt
          grep -q "package: name='com.projectlumen.pilot.robust'" dist/apk-badging.txt
          grep -q "versionCode='1320001'" dist/apk-badging.txt
          grep -q "versionName='13.2.0-rc1-release-hardening'" dist/apk-badging.txt
          grep -q 'com.projectlumen.pilot.robust.LumenApplication' dist/apk-manifest.txt
          grep -q 'com.projectlumen.pilot.robust.ParentalControlActivity' dist/apk-manifest.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'             dist/apk-signature.txt

      - name: Upload auditable internal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-lumen-13-2-0-rc1-audit-${{ github.sha }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14
