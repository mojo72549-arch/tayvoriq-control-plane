name: Project Lumen Android Relay

on:
  pull_request:
    paths:
      - 'lumen138/**'
      - '.github/workflows/lumen-android-relay.yml'

permissions:
  contents: read

jobs:
  build-lumen-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout readable source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore verified closed-pilot signing key
        shell: bash
        run: |
          set -euo pipefail
          OLD_COMMIT=28b0ea71876712ec2638e5cd2ecb6093ee98a637
          git fetch --no-tags --depth=1 origin "$OLD_COMMIT"
          mkdir -p /tmp/lumen-old /tmp/lumen-parts lumen138/ci/keys
          for part in 00 01 02 03 04; do
            git show "$OLD_COMMIT:relay/lumen-build-relay.tar.xz.b64.part$part" > "/tmp/lumen-parts/part$part"
          done
          cat /tmp/lumen-parts/part* | base64 --decode > /tmp/lumen-old/source.tar.xz
          echo "c617e95631564c3eb15ee6e6c26554fcc23a1d761c44e8bebf4e7a10c9954d7a  /tmp/lumen-old/source.tar.xz" | sha256sum --check
          tar -xJf /tmp/lumen-old/source.tar.xz -C /tmp/lumen-old
          base64 --decode /tmp/lumen-old/lumen-build-relay/ci/keys/lumen-pilot-v1.jks.b64 > lumen138/ci/keys/lumen-pilot-v1.jks
          echo "764e0c501b8c13fb1eae852bcaddd16aab0c31109cf17de97bde5d15327a8817  lumen138/ci/keys/lumen-pilot-v1.jks" | sha256sum --check

      - name: Test provider languages swipe groups parental protection and Media3
        working-directory: lumen138
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug 2>&1 | tee ../dist/android-build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Project_Lumen_v13.1.47_P0_Provider_Languages.apk
          sha256sum ../dist/Project_Lumen_v13.1.47_P0_Provider_Languages.apk > ../dist/Project_Lumen_v13.1.47_P0_Provider_Languages.apk.sha256
          if [ -d app/build/reports/tests ]; then cp -R app/build/reports/tests ../dist/test-reports; fi
          if [ -f app/build/reports/lint-results-debug.html ]; then cp app/build/reports/lint-results-debug.html ../dist/; fi

      - name: Verify package signature branding and dynamic language rail
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/Project_Lumen_v13.1.47_P0_Provider_Languages.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/apk-signature.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee dist/apk-badging.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | tee dist/apk-manifest.txt
          grep -q "package: name='com.projectlumen.pilot.robust'" dist/apk-badging.txt
          grep -q "versionCode='1314700'" dist/apk-badging.txt
          grep -q "versionName='13.1.47-p0-provider-languages'" dist/apk-badging.txt
          grep -q "application-label:'Project Lumen Premium'" dist/apk-badging.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" dist/apk-signature.txt
          grep -q "Signer #1 certificate SHA-256 digest: 90ef91b7294414e49a92dbb8e6d58c51aa3603d1aab73715c4d9318854d1e9ce" dist/apk-signature.txt
          grep -q "HorizontalScrollView" lumen138/app/src/main/java/com/projectlumen/pilot/robust/MainActivity.java
          grep -q "ProviderLanguage" lumen138/app/src/main/java/com/projectlumen/pilot/robust/MainActivity.java
          if grep -q 'languageButton("Weitere"' lumen138/app/src/main/java/com/projectlumen/pilot/robust/MainActivity.java; then exit 1; fi
          unzip -l "$APK" | grep -q 'classes.dex'

      - name: Upload APK and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-lumen-v13-1-47-provider-languages-${{ github.sha }}
          path: dist/
          if-no-files-found: warn
          retention-days: 30
