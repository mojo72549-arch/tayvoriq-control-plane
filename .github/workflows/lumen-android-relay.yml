name: Project Lumen Android Relay

on:
  pull_request:
    paths:
      - 'relay/lumen-build-relay.tar.xz.b64.part*'
      - 'relay/rebuild-*'
      - '.github/workflows/lumen-android-relay.yml'

permissions:
  contents: read

jobs:
  build-lumen-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout relay input
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore verified source package
        shell: bash
        run: |
          set -euo pipefail
          cat relay/lumen-build-relay.tar.xz.b64.part* > /tmp/lumen-build-relay.tar.xz.b64
          base64 --decode /tmp/lumen-build-relay.tar.xz.b64 > /tmp/lumen-build-relay.tar.xz
          echo "c617e95631564c3eb15ee6e6c26554fcc23a1d761c44e8bebf4e7a10c9954d7a  /tmp/lumen-build-relay.tar.xz" | sha256sum --check
          tar -xJf /tmp/lumen-build-relay.tar.xz
          base64 --decode lumen-build-relay/ci/keys/lumen-pilot-v1.jks.b64 > lumen-build-relay/ci/keys/lumen-pilot-v1.jks
          echo "764e0c501b8c13fb1eae852bcaddd16aab0c31109cf17de97bde5d15327a8817  lumen-build-relay/ci/keys/lumen-pilot-v1.jks" | sha256sum --check

      - name: Compile, lint and assemble signed APK
        working-directory: lumen-build-relay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          gradle --no-daemon lintDebug assembleDebug 2>&1 | tee ../dist/android-build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Project_Lumen_v13.1.37_P0_Robust.apk
          sha256sum ../dist/Project_Lumen_v13.1.37_P0_Robust.apk > ../dist/Project_Lumen_v13.1.37_P0_Robust.apk.sha256

      - name: Verify package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/Project_Lumen_v13.1.37_P0_Robust.apk 2>&1 | tee dist/apk-signature.txt
          "$BUILD_TOOLS/aapt" dump badging dist/Project_Lumen_v13.1.37_P0_Robust.apk 2>&1 | tee dist/apk-badging.txt
          grep -q "package: name='com.projectlumen.pilot.robust'" dist/apk-badging.txt
          grep -q "versionName='13.1.37-p0-robust.1'" dist/apk-badging.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" dist/apk-signature.txt

      - name: Upload APK and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-lumen-v13-1-37-p0-robust-${{ github.sha }}
          path: dist/
          if-no-files-found: warn
          retention-days: 30
