name: Project Lumen 13.1.32 RC1 Cumulative Orchestration Build

on:
  pull_request:
    branches: [ lumen-13-1-28-r3-epg-search-favorites ]
    paths:
      - '.github/workflows/lumen-13-1-32-rc1-cumulative.yml'
      - 'lumen-public-preview/r4-src/**'
      - 'lumen-public-preview/rc1-src/**'
      - 'lumen-public-preview/apply-r4-profile-integration.py'
      - 'lumen-public-preview/apply-rc1-cumulative-integration.py'
      - 'lumen-public-preview/RC1_ORCHESTRATION_AND_GO_NO_GO.md'
      - 'lumen-public-preview/project-lumen-pilot-debug.jks.b64'

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-13-1-32-rc1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-rc1:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified R3 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r3-source
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${{ github.repository }}/actions/artifacts/8607677153/zip > /tmp/r3-source.zip
          unzip -q /tmp/r3-source.zip -d /tmp/r3-source
          echo '9970752a9ca0c6b85bdd69509d8d4c0f655db091153a2ac9ca2fe5479766782f  /tmp/r3-source/project-lumen-13.1.28-r3-generated-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/r3-source/project-lumen-13.1.28-r3-generated-source.tar.gz
          grep -q 'text("v13.1.28"' project-lumen-preview/app/src/main/java/com/projectlumen/publicpreview/MainActivity.java

      - name: Apply R4 and cumulative RC1 integrations
        shell: bash
        run: |
          set -euo pipefail
          python3 lumen-public-preview/apply-r4-profile-integration.py project-lumen-preview
          python3 lumen-public-preview/apply-rc1-cumulative-integration.py project-lumen-preview

      - name: Verify functional and security gates
        shell: bash
        run: |
          set -euo pipefail
          BASE=project-lumen-preview/app/src/main/java/com/projectlumen/publicpreview
          MAIN=$BASE/MainActivity.java
          MANIFEST=project-lumen-preview/app/src/main/AndroidManifest.xml
          GRADLE=project-lumen-preview/app/build.gradle
          grep -q 'text("v13.1.32 RC1"' "$MAIN"
          grep -q 'openPremiumMedia' "$MAIN"
          grep -q 'continueWatchingChannels' "$MAIN"
          grep -q 'ProfileStore.favoriteNamespace' "$MAIN"
          grep -q 'ParentalPolicy.filter' "$MAIN"
          grep -q 'ActivationActivity.class' "$MAIN"
          grep -q 'versionCode 134200' "$GRADLE"
          grep -q "versionName '13.1.32-rc1-r2-r4-r5-foundation-r6-readiness'" "$GRADLE"
          for file in ProfileStore ProfilesActivity ParentalPolicy SecureBlobStore PlaybackStore PlaybackActivity MediaDetailActivity SeriesSelectionStore SeriesActivity LicenseFoundation ActivationActivity; do
            test -s "$BASE/$file.java"
          done
          grep -q 'AndroidKeyStore' "$BASE/ProfileStore.java"
          grep -q 'PBKDF2WithHmacSHA256' "$BASE/ProfileStore.java"
          grep -q 'Series -> season -> episode' "$BASE/SeriesActivity.java"
          grep -q 'BILLING-NOT-CONFIGURED' "$BASE/LicenseFoundation.java"
          grep -q 'serverseitiger Prüfung des Store-Belegs' "$BASE/ActivationActivity.java"
          for activity in ProfilesActivity ActivationActivity MediaDetailActivity SeriesActivity PlaybackActivity; do
            grep -q ".${activity}" "$MANIFEST"
          done
          if grep -R -nE 'HostnameVerifier|setHostnameVerifier|new Proxy\(' "$BASE"; then
            echo 'Unexpected transport security bypass' >&2; exit 1
          fi
          if grep -R -nE 'https?://[^" ]+get\.php\?username=|password=[^&" ]+' "$BASE"; then
            echo 'Hard-coded playlist credential or URL' >&2; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        working-directory: project-lumen-preview
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleDebug 2>&1 | tee ../android-build-13.1.32-rc1.log

      - name: Sign and verify stable pilot APK
        shell: bash
        run: |
          set -euo pipefail
          base64 -d lumen-public-preview/project-lumen-pilot-debug.jks.b64 > /tmp/lumen-pilot.jks
          echo '09d67cdecac40a4e03edcfd09047377ed4a9e9c01c5bc23140e1f15b0b2cbef8  /tmp/lumen-pilot.jks' | sha256sum -c -
          mkdir -p dist
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          INPUT=project-lumen-preview/app/build/outputs/apk/debug/app-debug.apk
          OUTPUT=dist/Project_Lumen_13.1.32_RC1_Cumulative_Orchestration_Stable_Pilot.apk
          "$APKSIGNER" sign --ks /tmp/lumen-pilot.jks --ks-key-alias lumenPilot \
            --ks-pass pass:projectlumenpilot --key-pass pass:projectlumenpilot \
            --out "$OUTPUT" "$INPUT"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT" | tee dist/pilot-certificate.txt
          grep -qi 'Project Lumen Pilot' dist/pilot-certificate.txt
          grep -qi '2550241518d5d562d75ee5e271a4cff530b2bacf86d18eee5642d2c20daf9e96' dist/pilot-certificate.txt
          sha256sum "$OUTPUT" > dist/Project_Lumen_13.1.32_RC1_Cumulative_Orchestration_Stable_Pilot.sha256

      - name: Prepare evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p dist
          [ -f android-build-13.1.32-rc1.log ] && cp android-build-13.1.32-rc1.log dist/ || true
          cp lumen-public-preview/RC1_ORCHESTRATION_AND_GO_NO_GO.md dist/ || true
          cat > dist/RELEASE_BOUNDARY.txt <<'TXT'
          Project Lumen 13.1.32 RC1 cumulative orchestration pilot.
          R2 is technically backfilled. R4 is integrated. R5 is a client and contract foundation only.
          Real Play/Amazon billing, backend receipt verification, legal clearance and physical-device acceptance remain mandatory.
          Public sale and store submission remain NO-GO.
          TXT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-lumen-13-1-32-rc1-cumulative-orchestration-pilot
          path: dist/
          if-no-files-found: error
          retention-days: 30
