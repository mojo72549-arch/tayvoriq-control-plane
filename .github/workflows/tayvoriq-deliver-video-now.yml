name: TAYVORIQ-X Golden Path
run-name: ${{ inputs.review_repair_of && format('TAYVORIQ review correction {0}', inputs.review_repair_of) || inputs.source_request_id && format('TAYVORIQ request {0}', inputs.source_request_id) || github.event.head_commit.message || github.workflow }}

on:
  workflow_call:
    inputs:
      source_request_id:
        required: true
        type: string
      control_run_id:
        required: false
        type: string
      compute_only:
        required: true
        type: boolean
      checkpoint_release:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      topic:
        description: Freigegebenes Thema
        required: false
        type: string
      trend_id:
        description: Freigegebene Trend-ID
        required: false
        type: string
      source_request_id:
        description: Exakt gebundene freigegebene Request-ID
        required: false
        type: string
      recovery_generation:
        description: Gebundene Recovery-Generation f√ºr Fortschritts- und Replay-Wahrheit
        required: false
        type: string
      review_repair_of:
        description: Vom Orchestrator gebundener abgelehnter Review
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: tayvoriq-x-golden-path
  queue: max
  cancel-in-progress: false

env:
  TAYVORIQ_PRODUCTION_RUN_ID: ${{ inputs.control_run_id || github.run_id }}
  PYTHONUTF8: "1"
  TAYVORIQ_PROGRESS_JOURNAL: ${{ github.workspace }}/out/progress/${{ github.run_id }}-${{ github.run_attempt }}.jsonl
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
  TAYVORIQ_CONTROL_PLANE_SCHEMA: "x-v3"
  TAYVORIQ_EXECUTION_BACKEND: ${{ inputs.compute_only && 'contabo_private_runner' || 'github_hosted_public' }}
  TAYVORIQ_CLOUD_MODE: "true"
  TAYVORIQ_RENDER_SIZE: "1080x1920"
  TAYVORIQ_REQUIRE_REAL_VIDEO_SCENES: "true"
  TAYVORIQ_TTS_PROVIDER: "chatterbox_v3"
  TAYVORIQ_CHATTERBOX_ENABLED: "true"
  TAYVORIQ_CHATTERBOX_REQUIRED: "true"
  TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
  TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
  TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "240"
  TAYVORIQ_CHATTERBOX_MAX_CHUNKS: "2"
  TAYVORIQ_CHATTERBOX_MAX_CHARS: "520"
  TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
  TAYVORIQ_CHATTERBOX_EXAGGERATION: "0.42"
  TAYVORIQ_CHATTERBOX_CFG_WEIGHT: "0.36"
  TAYVORIQ_CHATTERBOX_PAUSE_MS: "360"
  TAYVORIQ_NATURAL_VOICE_WPM: "132"
  TAYVORIQ_NARRATOR_PITCH_FACTOR: "1.0"
  TAYVORIQ_NARRATOR_TONE_REQUIRED: "false"
  TAYVORIQ_RENDER_TIMEOUT_SECONDS: "600"
  TAYVORIQ_EDGE_RECOVERY_TIMEOUT_SECONDS: "480"
  TAYVORIQ_AUDIT_TIMEOUT_SECONDS: "120"
  TAYVORIQ_AUDIT_RETRY_DELAYS: "0,8"
  TAYVORIQ_CONTROLLER_TIMEOUT_SECONDS: "1500"
  TAYVORIQ_VISUAL_REPAIR_TIMEOUT_SECONDS: "900"
  TAYVORIQ_VOICE_REPAIR_TIMEOUT_SECONDS: "600"
  TAYVORIQ_LOCAL_QUALITY_REPAIR_ATTEMPTS: "1"
  TAYVORIQ_LOCAL_REPAIR_WALL_TIMEOUT_SECONDS: "1500"
  TAYVORIQ_APPROVED_TREND_PINNED: "true"
  TAYVORIQ_TELEGRAM_PROGRESS: "true"
  TAYVORIQ_TARGET_REVIEW_READY_SECONDS: "1800"
  TAYVORIQ_END_TO_END_SLO_SECONDS: "3600"
  TAYVORIQ_SOURCE_CONTEXT_FILE: ${{ github.workspace }}/tayvoriq-source-context.json
  HF_HOME: ${{ inputs.compute_only && '/var/cache/tayvoriq/huggingface' || format('{0}/.cache/huggingface', github.workspace) }}
  TORCH_HOME: ${{ inputs.compute_only && '/var/cache/tayvoriq/torch' || format('{0}/.cache/torch', github.workspace) }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}
  TREND_ID: ${{ github.event.inputs.trend_id || github.event.client_payload.trend_id || '' }}
  SOURCE_REQUEST_ID_PIN: ${{ inputs.source_request_id || github.event.inputs.source_request_id || github.event.client_payload.source_request_id || '' }}
  TAYVORIQ_RECOVERY_GENERATION: ${{ github.event.inputs.recovery_generation || github.event.client_payload.recovery_generation || '0' }}
  REVIEW_REPAIR_OF: ${{ inputs.review_repair_of || '' }}

jobs:
  contabo-controller:
    if: ${{ !inputs.compute_only }}
    uses: ./.github/workflows/tayvoriq-contabo-controller.yml
    with:
      source_request_id: ${{ inputs.source_request_id || github.event.inputs.source_request_id || '' }}
    secrets: inherit
  orchestrate:
    if: inputs.compute_only
    runs-on: ${{ inputs.compute_only && fromJSON('["self-hosted","Linux","X64","tayvoriq-studio-contabo"]') || 'ubuntu-latest' }}
    # Performance SLO: target review-ready in ~30 minutes, hard stop at 60.
    # Strict gates stay unchanged; only bounded retries/timeouts are reduced.
    timeout-minutes: 60
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/tayvoriq-control-plane
          ref: main
          persist-credentials: ${{ !inputs.compute_only }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Verify exact Contabo handoff before processing
        if: inputs.compute_only
        env:
          EXPECTED_REQUEST: ${{ inputs.source_request_id }}
        run: |
          for poll in $(seq 1 30); do
            git pull --ff-only origin main --quiet
            if python3 - <<'PYGUARD'
          import json,os
          from pathlib import Path
          p=json.loads(Path('.github/state/tayvoriq-active-production-request.json').read_text())
          assert p['request_id']==os.environ['EXPECTED_REQUEST']
          assert p['execution_repository']=='mojo72549-arch/shorts-agent-studio'
          assert str(p['golden_path_run_id'])==(os.environ.get('TAYVORIQ_PRODUCTION_RUN_ID') or os.environ['GITHUB_RUN_ID'])
          assert str(p['execution_run_id'])==os.environ['GITHUB_RUN_ID']
          assert p['execution_backend']=='contabo_private_runner'
          PYGUARD
            then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Reuse persistent Contabo environment
        if: inputs.compute_only
        run: |
          test -x /var/cache/tayvoriq/venv/bin/python
          if [ ! -e .venv ]; then ln -s /var/cache/tayvoriq/venv .venv; fi
          /var/cache/tayvoriq/venv/bin/python --version
          echo /var/cache/tayvoriq/venv/bin >> "$GITHUB_PATH"


      - name: Verify Orchestrator review correction authorization
        if: env.REVIEW_REPAIR_OF != ''
        run: |
          set -euo pipefail
          for poll in $(seq 1 15); do
            git pull --ff-only origin main --quiet
            if plan=$(python -S tools/tayvoriq_rejected_review_repair.py --guard "$REVIEW_REPAIR_OF" "$TAYVORIQ_PRODUCTION_RUN_ID" "$SOURCE_REQUEST_ID_PIN" 2>/dev/null); then
              python -S - "$plan" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          plan = json.loads(sys.argv[1])
          print("REVIEW_REPAIR_CACHE=" + plan["repair_cache_key"])
          print("REVIEW_REPAIR_STAGE=" + plan["repair_stage"])
          PY
              exit 0
            fi
            sleep 2
          done
          echo 'Review correction authorization could not be verified.'
          exit 1

      - name: Resolve approved X request
        id: resolve_request
        shell: bash
        env:
          EVENT_TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}
          EVENT_TREND_ID: ${{ github.event.inputs.trend_id || github.event.client_payload.trend_id || '' }}
          EVENT_SOURCE_REQUEST_ID: ${{ inputs.source_request_id || github.event.inputs.source_request_id || github.event.client_payload.source_request_id || '' }}
          EVENT_RECOVERY_GENERATION: ${{ github.event.inputs.recovery_generation || github.event.client_payload.recovery_generation || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request_path = Path(".github/run-now/tayvoriq-x-request.json")
          if not request_path.is_file():
              raise SystemExit("CONTROL_PLANE_REQUEST_MISSING")
          request = json.loads(request_path.read_text(encoding="utf-8"))
          topic = str(os.environ.get("EVENT_TOPIC") or request.get("topic") or "").strip()
          trend_id = str(os.environ.get("EVENT_TREND_ID") or request.get("trend_id") or "").strip()
          source_request_id = str(
              os.environ.get("EVENT_SOURCE_REQUEST_ID")
              or request.get("source_request_id")
              or ""
          ).strip()
          if os.environ.get('TAYVORIQ_EXECUTION_BACKEND') == 'contabo_private_runner':
              canonical=json.loads((Path('requests')/(source_request_id+'.json')).read_text())
              if canonical['request_id'] != source_request_id:
                  raise SystemExit('CONTABO_REQUEST_IDENTITY_FAILED')
              topic=str(canonical['topic']).strip()
              trend_id=str(canonical['trend_id']).strip()

          # A workflow_dispatch pin owns its recovery generation, including zero.
          # The run-now file may belong to a different request and must never
          # contribute its generation to this exact-request replay.
          event_generation = os.environ.get("EVENT_RECOVERY_GENERATION")
          durable_generation = None
          if source_request_id:
              durable = Path("requests") / f"{source_request_id}.json"
              if durable.is_file():
                  try:
                      durable_request = json.loads(durable.read_text(encoding="utf-8"))
                  except Exception:
                      durable_request = {}
                  if durable_request.get("request_id") == source_request_id:
                      durable_generation = durable_request.get("recovery_generation")
          request_generation = (
              request.get("recovery_generation")
              if request.get("source_request_id") == source_request_id else None
          )
          value = next(
              (candidate for candidate in
               (event_generation, durable_generation, request_generation, 0)
               if candidate not in (None, "")),
              0,
          )
          try:
              recovery_generation = int(value)
          except (TypeError, ValueError):
              raise SystemExit("CONTROL_PLANE_RECOVERY_GENERATION_INVALID")
          if recovery_generation < 0:
              raise SystemExit("CONTROL_PLANE_RECOVERY_GENERATION_INVALID")
          if not topic or any(char in topic for char in "\r\n"):
              raise SystemExit("CONTROL_PLANE_TOPIC_RESOLUTION_FAILED")
          if not trend_id or any(char in trend_id for char in "\r\n"):
              raise SystemExit("CONTROL_PLANE_TREND_RESOLUTION_FAILED")
          if source_request_id and (
              any(char in source_request_id for char in "\r\n/\\")
              or source_request_id in {".", ".."}
          ):
              raise SystemExit("CONTROL_PLANE_SOURCE_REQUEST_ID_INVALID")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"TOPIC={topic}\n")
              handle.write(f"TREND_ID={trend_id}\n")
              handle.write(f"SOURCE_REQUEST_ID_PIN={source_request_id}\n")
              handle.write(f"TAYVORIQ_RECOVERY_GENERATION={recovery_generation}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"trend_id={trend_id}\n")
              handle.write(f"source_request_id={source_request_id}\n")
              handle.write(f"recovery_generation={recovery_generation}\n")
          print(json.dumps({
              "request_resolution": "approved-x-request",
              "topic": topic,
              "trend_id": trend_id,
              "source_request_id": source_request_id or None,
              "source_request_pinned": bool(source_request_id),
              "recovery_generation": recovery_generation,
              "event_topic_override": bool(os.environ.get("EVENT_TOPIC")),
              "quality_gates_weakened": False,
          }, ensure_ascii=False))
          PY


      - name: Validate hosted execution contract
        shell: bash
        env:
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          if [ "$TAYVORIQ_EXECUTION_BACKEND" = "contabo_private_runner" ]; then
            test "$RUNNER_ENVIRONMENT_VALUE" = "self-hosted"
          else
            test "$RUNNER_ENVIRONMENT_VALUE" = "github-hosted"
          fi
          test "$RUNNER_OS_VALUE" = "Linux" || { echo "RUNNER_CONTRACT_FAILED: Linux required"; exit 1; }
          test "$RUNNER_ARCH_VALUE" = "X64" || { echo "RUNNER_CONTRACT_FAILED: X64 required"; exit 1; }
          for command in python git curl; do
            command -v "$command" >/dev/null || { echo "RUNNER_CONTRACT_FAILED: missing $command"; exit 1; }
          done
          python - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 11):
              raise SystemExit(f"RUNNER_CONTRACT_FAILED: Python 3.11 required, got {sys.version}")
          PY
          mkdir -p "$HF_HOME" "$TORCH_HOME"
          df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 { if ($4 < 12582912) { print "RUNNER_CONTRACT_FAILED: less than 12 GiB free"; exit 1 } }'

      - name: Validate single X control-plane request contract
        shell: bash
        env:
          EVENT_NAME: ${{ inputs.compute_only && 'workflow_call' || github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          workflow = ".github/workflows/tayvoriq-deliver-video-now.yml"
          workflow_files = list(Path('.github/workflows').glob('*.yml')) + list(Path('.github/workflows').glob('*.yaml'))
          x_owners = []
          for path in workflow_files:
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'name: TAYVORIQ-X Golden Path' in text:
                  x_owners.append(str(path))
          if x_owners != [workflow]:
              raise SystemExit(f"CONTROL_PLANE_SINGLE_OWNER_FAILED: expected={[workflow]!r} actual={x_owners!r}")

          if os.environ.get('EVENT_NAME') == 'push':
              path = Path('.github/run-now/tayvoriq-x-request.json')
              if not path.is_file():
                  raise SystemExit('CONTROL_PLANE_REQUEST_MISSING')
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('request') != 'tayvoriq-x-production':
                  raise SystemExit('CONTROL_PLANE_REQUEST_TYPE_FAILED')
              if data.get('workflow') != workflow:
                  raise SystemExit('CONTROL_PLANE_WORKFLOW_BINDING_FAILED')
              if data.get('approved_trend_pinned') is not True:
                  raise SystemExit('CONTROL_PLANE_APPROVAL_PIN_FAILED')
              if str(data.get('topic') or '').strip() != str(os.environ.get('TOPIC') or '').strip():
                  raise SystemExit('CONTROL_PLANE_TOPIC_BINDING_FAILED')
              if str(data.get('trend_id') or '').strip() != str(os.environ.get('TREND_ID') or '').strip():
                  raise SystemExit('CONTROL_PLANE_TREND_BINDING_FAILED')
              request_pin = str(data.get('source_request_id') or '').strip()
              env_pin = str(os.environ.get('SOURCE_REQUEST_ID_PIN') or '').strip()
              if request_pin and request_pin != env_pin:
                  raise SystemExit('CONTROL_PLANE_SOURCE_REQUEST_BINDING_FAILED')
              hardening = data.get('hardening')
              required = (
                  'checkpoint_source_context_required',
                  'platform_specific_cta_required',
                  'platform_specific_voice_repair_required',
                  'validated_voice_candidate_required',
                  'premium_voice_required',
                  'concrete_failure_state_required',
              )
              if not isinstance(hardening, dict) or any(hardening.get(key) is not True for key in required):
                  raise SystemExit('CONTROL_PLANE_HARDENING_CONTRACT_FAILED')
              if hardening.get('quality_gates_weakened') is not False:
                  raise SystemExit('CONTROL_PLANE_QUALITY_GATE_INTEGRITY_FAILED')
              nonce = str(data.get('request_nonce') or '').strip()
              if len(nonce) < 12:
                  raise SystemExit('CONTROL_PLANE_REQUEST_NONCE_FAILED')
          print('TAYVORIQ_X_CONTROL_PLANE_CONTRACT_PASSED')
          PY

      - name: Materialize immutable verified source context
        id: source_context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          trend_id = str(os.environ.get("TREND_ID") or "").strip()
          topic = str(os.environ.get("TOPIC") or "").strip()
          source_request_id_pin = str(os.environ.get("SOURCE_REQUEST_ID_PIN") or "").strip()
          if not trend_id:
              raise SystemExit("SOURCE_CONTEXT_MISSING: approved trend id is empty")
          if not topic:
              raise SystemExit("SOURCE_CONTEXT_MISSING: approved topic is empty")

          candidates = []
          if source_request_id_pin:
              request_path = Path("requests") / f"{source_request_id_pin}.json"
              if not request_path.is_file():
                  raise SystemExit(
