name: TAYVORIQ X Workflow

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Freigegebenes Thema
        required: false
        type: string
      trend_id:
        description: Freigegebene Trend-ID
        required: false
        type: string
  repository_dispatch:
    types: [tayvoriq_trend_approved]

permissions:
  contents: write
  actions: write

concurrency:
  group: tayvoriq-x-workflow
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
  TAYVORIQ_CLOUD_MODE: "true"
  TAYVORIQ_RENDER_SIZE: "1080x1920"
  TAYVORIQ_TTS_PROVIDER: "chatterbox_v3"
  TAYVORIQ_CHATTERBOX_ENABLED: "true"
  TAYVORIQ_CHATTERBOX_REQUIRED: "true"
  TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
  TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
  TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "360"
  TAYVORIQ_CHATTERBOX_MAX_CHUNKS: "2"
  TAYVORIQ_CHATTERBOX_MAX_CHARS: "520"
  TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
  TAYVORIQ_CHATTERBOX_EXAGGERATION: "0.42"
  TAYVORIQ_CHATTERBOX_CFG_WEIGHT: "0.36"
  TAYVORIQ_CHATTERBOX_PAUSE_MS: "360"
  TAYVORIQ_NATURAL_VOICE_WPM: "132"
  TAYVORIQ_NARRATOR_PITCH_FACTOR: "0.90"
  TAYVORIQ_NARRATOR_TONE_REQUIRED: "true"
  TAYVORIQ_RENDER_TIMEOUT_SECONDS: "900"
  TAYVORIQ_CONTROLLER_TIMEOUT_SECONDS: "2700"
  TAYVORIQ_TELEGRAM_PROGRESS: "true"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}
  TREND_ID: ${{ github.event.inputs.trend_id || github.event.client_payload.trend_id || '' }}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Validate secrets and notify 10 percent
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID PEXELS_API_KEY GROQ_API_KEY GEMINI_API_KEY; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done
          send() {
            local text="$1"
            response=$(curl -fsS --retry 3 --retry-all-errors \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${text}")
            python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") and d.get("result",{}).get("message_id"), d; print(d["result"]["message_id"])' "$response"
          }
          send "🚀 TAYVORIQ 10 %\nTrendfreigabe empfangen.\nThema: ${TOPIC:-Trend ${TREND_ID:-unbekannt}}\nRun: ${GITHUB_RUN_ID}\nNächster Schritt: Repository und Abhängigkeiten"

      - name: Checkout implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Install dependencies and notify 20 percent
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rsync git
          python -m pip install --upgrade pip -q
          python -m pip install -r implementation/requirements.txt pytest -q
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0" -q
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948" -q
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=⚙️ TAYVORIQ 20 %\nAbhängigkeiten installiert.\nRun: ${GITHUB_RUN_ID}\nNächster Schritt: Preflight")
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") and d.get("result",{}).get("message_id"), d' "$response"

      - name: Preflight and notify 30 percent
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m compileall -q tools src
          python tools/tayvoriq_preflight_check.py --report-out out/control-plane/preflight.json
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=✅ TAYVORIQ 30 %\nPreflight erfolgreich.\nRun: ${GITHUB_RUN_ID}\nNächster Schritt: Produktion mit Self-Heal")
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") and d.get("result",{}).get("message_id"), d' "$response"

      - name: Produce with automatic self-heal
        id: production
        working-directory: implementation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/tayvoriq-self-heal
          final_state=TECHNICAL_FAILURE
          final_exit=1
          for attempt in 1 2 3; do
            progress=$((35 + attempt * 10))
            curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=🛠 TAYVORIQ ${progress} %\nProduktionsversuch ${attempt}/3 gestartet.\nRun: ${GITHUB_RUN_ID}\nSelf-Heal-Tiefe: $((attempt-1))" >/dev/null
            set +e
            python tools/tayvoriq_autonomous_entrypoint.py \
              --trend-mode approved_trend \
              --trend-scope auto_scope \
              --topic "${TOPIC}" \
              --language Deutsch \
              --platform youtube_tiktok \
              --target-duration 35 \
              --llm-provider auto \
              --outdir out/tayvoriq-youtube-tiktok \
              --site-root site/tayvoriq \
              --run-id "${GITHUB_RUN_ID}" \
              --state-out out/tayvoriq-review-state.json \
              --report-out out/tayvoriq-self-heal/report.json \
              --request-out out/tayvoriq-self-heal/request.json \
              --self-heal-depth "$((attempt-1))" \
              --target-branch feature/multi-platform-distribution-package \
              2>&1 | tee "out/tayvoriq-self-heal/controller-console-${attempt}.log"
            final_exit=${PIPESTATUS[0]}
            set -e
            final_state=$(python -c 'import json,pathlib; p=pathlib.Path("out/tayvoriq-self-heal/report.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get("state") or "TECHNICAL_FAILURE")')
            if [ "$final_state" = "SUCCESS" ] && [ "$final_exit" -eq 0 ]; then
              echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
              break
            fi
            reason=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/tayvoriq-self-heal/report.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          print(str(d.get('error') or d.get('reason') or d.get('state') or 'Unbekannter Produktionsfehler')[:800])
          PY
            )
            curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ TAYVORIQ ${progress} %\nVersuch ${attempt}/3 fehlgeschlagen.\nFehler: ${reason}\nSelf-Heal wird automatisch fortgesetzt.\nRun: ${GITHUB_RUN_ID}" >/dev/null
          done
          echo "state=$final_state" >> "$GITHUB_OUTPUT"
          echo "process_exit=$final_exit" >> "$GITHUB_OUTPUT"
          test "$final_state" = "SUCCESS" && test "$final_exit" -eq 0

      - name: Notify 75 percent
        if: steps.production.outcome == 'success'
        run: |
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=🎬 TAYVORIQ 75 %\nSkript, Voice und Szenen erzeugt.\nRun: ${GITHUB_RUN_ID}\nNächster Schritt: Qualitätsprüfung")
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") and d.get("result",{}).get("message_id"), d' "$response"

      - name: Validate publication quality
        id: publication_gate
        if: steps.production.outcome == 'success'
        working-directory: implementation
        run: |
          set -euo pipefail
          JOB_DIR=$(python -c 'import json,pathlib; d=json.loads(pathlib.Path("out/tayvoriq-review-state.json").read_text()); print(d.get("job_dir") or "")')
          test -n "$JOB_DIR" && test -d "$JOB_DIR"
          python tools/tayvoriq_publication_quality_gate_v2.py --job-dir "$JOB_DIR" --targets youtube_tiktok

      - name: Notify 90 percent
        if: steps.publication_gate.outcome == 'success'
        run: |
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=🔍 TAYVORIQ 90 %\nQualitätsprüfung bestanden.\nRun: ${GITHUB_RUN_ID}\nNächster Schritt: Review veröffentlichen")
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") and d.get("result",{}).get("message_id"), d' "$response"

      - name: Publish review page
        id: publish_review
        if: steps.publication_gate.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf pages-worktree/tayvoriq
          mkdir -p pages-worktree/tayvoriq
          rsync -a implementation/site/tayvoriq/ pages-worktree/tayvoriq/
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish TAYVORIQ review ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Send final Telegram review and verify 100 percent
        id: telegram_final
        if: steps.publish_review.outcome == 'success'
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --review-id "${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=✅ TAYVORIQ 100 %\nVideo-Review erfolgreich ausgeliefert.\nRun: ${GITHUB_RUN_ID}")
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") and d.get("result",{}).get("message_id"), d; print("telegram_message_id",d["result"]["message_id"])' "$response"

      - name: Notify final failure
        if: failure()
        working-directory: implementation
        run: |
          reason=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/tayvoriq-self-heal/report.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          print(str(d.get('error') or d.get('reason') or d.get('state') or 'Workflow-Schritt fehlgeschlagen')[:1000])
          PY
          )
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ TAYVORIQ FEHLER\nAlle automatischen Reparaturversuche ausgeschöpft.\nFehler: ${reason}\nLetzter erfolgreicher Schritt: siehe vorherigen Prozentstand.\nRun: ${GITHUB_RUN_ID}\n${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-x-workflow-${{ github.run_id }}
          path: |
            implementation/out/**
            implementation/site/tayvoriq/**
          if-no-files-found: warn
          retention-days: 30
