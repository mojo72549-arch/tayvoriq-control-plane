name: TAYVORIQ-X Golden Path

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Freigegebenes Thema
        required: false
        type: string
      trend_id:
        description: Freigegebene Trend-ID
        required: false
        type: string
      source_request_id:
        description: Exakt gebundene freigegebene Request-ID
        required: false
        type: string
      recovery_generation:
        description: Gebundene Recovery-Generation für Fortschritts- und Replay-Wahrheit
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/run-now/tayvoriq-x-request.json

permissions:
  contents: write
  actions: write

concurrency:
  group: tayvoriq-x-golden-path
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
  TAYVORIQ_CONTROL_PLANE_SCHEMA: "x-v3"
  TAYVORIQ_EXECUTION_BACKEND: "github_hosted_public"
  TAYVORIQ_CLOUD_MODE: "true"
  TAYVORIQ_RENDER_SIZE: "1080x1920"
  TAYVORIQ_TTS_PROVIDER: "chatterbox_v3"
  TAYVORIQ_CHATTERBOX_ENABLED: "true"
  TAYVORIQ_CHATTERBOX_REQUIRED: "true"
  TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
  TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
  TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "300"
  TAYVORIQ_CHATTERBOX_MAX_CHUNKS: "2"
  TAYVORIQ_CHATTERBOX_MAX_CHARS: "520"
  TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
  TAYVORIQ_CHATTERBOX_EXAGGERATION: "0.42"
  TAYVORIQ_CHATTERBOX_CFG_WEIGHT: "0.36"
  TAYVORIQ_CHATTERBOX_PAUSE_MS: "360"
  TAYVORIQ_NATURAL_VOICE_WPM: "132"
  TAYVORIQ_NARRATOR_PITCH_FACTOR: "1.0"
  TAYVORIQ_NARRATOR_TONE_REQUIRED: "false"
  TAYVORIQ_RENDER_TIMEOUT_SECONDS: "900"
  TAYVORIQ_EDGE_RECOVERY_TIMEOUT_SECONDS: "900"
  TAYVORIQ_AUDIT_TIMEOUT_SECONDS: "210"
  TAYVORIQ_AUDIT_RETRY_DELAYS: "0,12,30"
  TAYVORIQ_CONTROLLER_TIMEOUT_SECONDS: "1800"
  TAYVORIQ_VISUAL_REPAIR_TIMEOUT_SECONDS: "900"
  TAYVORIQ_VOICE_REPAIR_TIMEOUT_SECONDS: "1200"
  TAYVORIQ_LOCAL_QUALITY_REPAIR_ATTEMPTS: "2"
  TAYVORIQ_LOCAL_REPAIR_WALL_TIMEOUT_SECONDS: "1500"
  TAYVORIQ_APPROVED_TREND_PINNED: "true"
  TAYVORIQ_TELEGRAM_PROGRESS: "true"
  TAYVORIQ_SOURCE_CONTEXT_FILE: ${{ github.workspace }}/tayvoriq-source-context.json
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}
  TREND_ID: ${{ github.event.inputs.trend_id || github.event.client_payload.trend_id || '' }}
  SOURCE_REQUEST_ID_PIN: ${{ github.event.inputs.source_request_id || github.event.client_payload.source_request_id || '' }}
  TAYVORIQ_RECOVERY_GENERATION: ${{ github.event.inputs.recovery_generation || github.event.client_payload.recovery_generation || '0' }}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Resolve approved X request
        id: resolve_request
        shell: bash
        env:
          EVENT_TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}
          EVENT_TREND_ID: ${{ github.event.inputs.trend_id || github.event.client_payload.trend_id || '' }}
          EVENT_SOURCE_REQUEST_ID: ${{ github.event.inputs.source_request_id || github.event.client_payload.source_request_id || '' }}
          EVENT_RECOVERY_GENERATION: ${{ github.event.inputs.recovery_generation || github.event.client_payload.recovery_generation || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request_path = Path(".github/run-now/tayvoriq-x-request.json")
          if not request_path.is_file():
              raise SystemExit("CONTROL_PLANE_REQUEST_MISSING")
          request = json.loads(request_path.read_text(encoding="utf-8"))
          topic = str(os.environ.get("EVENT_TOPIC") or request.get("topic") or "").strip()
          trend_id = str(os.environ.get("EVENT_TREND_ID") or request.get("trend_id") or "").strip()
          source_request_id = str(
              os.environ.get("EVENT_SOURCE_REQUEST_ID")
              or request.get("source_request_id")
              or ""
          ).strip()
          generation_candidates = [
              os.environ.get("EVENT_RECOVERY_GENERATION"),
              request.get("recovery_generation"),
          ]
          if source_request_id:
              durable = Path("requests") / f"{source_request_id}.json"
              if durable.is_file():
                  try:
                      durable_request = json.loads(durable.read_text(encoding="utf-8"))
                  except Exception:
                      durable_request = {}
                  generation_candidates.append(durable_request.get("recovery_generation"))
          recovery_generation = 0
          for value in generation_candidates:
              if value in (None, ""):
                  continue
              try:
                  recovery_generation = max(recovery_generation, int(value))
              except (TypeError, ValueError):
                  raise SystemExit("CONTROL_PLANE_RECOVERY_GENERATION_INVALID")
          if recovery_generation < 0:
              raise SystemExit("CONTROL_PLANE_RECOVERY_GENERATION_INVALID")
          if not topic or any(char in topic for char in "\r\n"):
              raise SystemExit("CONTROL_PLANE_TOPIC_RESOLUTION_FAILED")
          if not trend_id or any(char in trend_id for char in "\r\n"):
              raise SystemExit("CONTROL_PLANE_TREND_RESOLUTION_FAILED")
          if source_request_id and (
              any(char in source_request_id for char in "\r\n/\\")
              or source_request_id in {".", ".."}
          ):
              raise SystemExit("CONTROL_PLANE_SOURCE_REQUEST_ID_INVALID")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"TOPIC={topic}\n")
              handle.write(f"TREND_ID={trend_id}\n")
              handle.write(f"SOURCE_REQUEST_ID_PIN={source_request_id}\n")
              handle.write(f"TAYVORIQ_RECOVERY_GENERATION={recovery_generation}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"trend_id={trend_id}\n")
              handle.write(f"source_request_id={source_request_id}\n")
              handle.write(f"recovery_generation={recovery_generation}\n")
          print(json.dumps({
              "request_resolution": "approved-x-request",
              "topic": topic,
              "trend_id": trend_id,
              "source_request_id": source_request_id or None,
              "source_request_pinned": bool(source_request_id),
              "recovery_generation": recovery_generation,
              "event_topic_override": bool(os.environ.get("EVENT_TOPIC")),
              "quality_gates_weakened": False,
          }, ensure_ascii=False))
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate hosted execution contract
        shell: bash
        env:
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT_VALUE" = "github-hosted" || { echo "RUNNER_CONTRACT_FAILED: GitHub-hosted runner required"; exit 1; }
          test "$RUNNER_OS_VALUE" = "Linux" || { echo "RUNNER_CONTRACT_FAILED: Linux required"; exit 1; }
          test "$RUNNER_ARCH_VALUE" = "X64" || { echo "RUNNER_CONTRACT_FAILED: X64 required"; exit 1; }
          for command in python git curl; do
            command -v "$command" >/dev/null || { echo "RUNNER_CONTRACT_FAILED: missing $command"; exit 1; }
          done
          python - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 11):
              raise SystemExit(f"RUNNER_CONTRACT_FAILED: Python 3.11 required, got {sys.version}")
          PY
          mkdir -p "$HF_HOME" "$TORCH_HOME"
          df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 { if ($4 < 12582912) { print "RUNNER_CONTRACT_FAILED: less than 12 GiB free"; exit 1 } }'

      - name: Validate single X control-plane request contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          workflow = ".github/workflows/tayvoriq-deliver-video-now.yml"
          workflow_files = list(Path('.github/workflows').glob('*.yml')) + list(Path('.github/workflows').glob('*.yaml'))
          x_owners = []
          for path in workflow_files:
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'name: TAYVORIQ-X Golden Path' in text:
                  x_owners.append(str(path))
          if x_owners != [workflow]:
              raise SystemExit(f"CONTROL_PLANE_SINGLE_OWNER_FAILED: expected={[workflow]!r} actual={x_owners!r}")

          if os.environ.get('EVENT_NAME') == 'push':
              path = Path('.github/run-now/tayvoriq-x-request.json')
              if not path.is_file():
                  raise SystemExit('CONTROL_PLANE_REQUEST_MISSING')
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('request') != 'tayvoriq-x-production':
                  raise SystemExit('CONTROL_PLANE_REQUEST_TYPE_FAILED')
              if data.get('workflow') != workflow:
                  raise SystemExit('CONTROL_PLANE_WORKFLOW_BINDING_FAILED')
              if data.get('approved_trend_pinned') is not True:
                  raise SystemExit('CONTROL_PLANE_APPROVAL_PIN_FAILED')
              if str(data.get('topic') or '').strip() != str(os.environ.get('TOPIC') or '').strip():
                  raise SystemExit('CONTROL_PLANE_TOPIC_BINDING_FAILED')
              if str(data.get('trend_id') or '').strip() != str(os.environ.get('TREND_ID') or '').strip():
                  raise SystemExit('CONTROL_PLANE_TREND_BINDING_FAILED')
              request_pin = str(data.get('source_request_id') or '').strip()
              env_pin = str(os.environ.get('SOURCE_REQUEST_ID_PIN') or '').strip()
              if request_pin and request_pin != env_pin:
                  raise SystemExit('CONTROL_PLANE_SOURCE_REQUEST_BINDING_FAILED')
              hardening = data.get('hardening')
              required = (
                  'checkpoint_source_context_required',
                  'platform_specific_cta_required',
                  'platform_specific_voice_repair_required',
                  'validated_voice_candidate_required',
                  'premium_voice_required',
                  'concrete_failure_state_required',
              )
              if not isinstance(hardening, dict) or any(hardening.get(key) is not True for key in required):
                  raise SystemExit('CONTROL_PLANE_HARDENING_CONTRACT_FAILED')
              if hardening.get('quality_gates_weakened') is not False:
                  raise SystemExit('CONTROL_PLANE_QUALITY_GATE_INTEGRITY_FAILED')
              nonce = str(data.get('request_nonce') or '').strip()
              if len(nonce) < 12:
                  raise SystemExit('CONTROL_PLANE_REQUEST_NONCE_FAILED')
          print('TAYVORIQ_X_CONTROL_PLANE_CONTRACT_PASSED')
          PY

      - name: Materialize immutable verified source context
        id: source_context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          trend_id = str(os.environ.get("TREND_ID") or "").strip()
          topic = str(os.environ.get("TOPIC") or "").strip()
          source_request_id_pin = str(os.environ.get("SOURCE_REQUEST_ID_PIN") or "").strip()
          if not trend_id:
              raise SystemExit("SOURCE_CONTEXT_MISSING: approved trend id is empty")
          if not topic:
              raise SystemExit("SOURCE_CONTEXT_MISSING: approved topic is empty")

          candidates = []
          if source_request_id_pin:
              request_path = Path("requests") / f"{source_request_id_pin}.json"
              if not request_path.is_file():
                  raise SystemExit(
                      f"SOURCE_CONTEXT_PIN_MISSING: exact request {source_request_id_pin!r} does not exist"
                  )
              try:
                  data = json.loads(request_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(
                      f"SOURCE_CONTEXT_PIN_INVALID: cannot read {source_request_id_pin!r}: {exc}"
                  ) from exc
              if str(data.get("request_id") or "").strip() != source_request_id_pin:
                  raise SystemExit("SOURCE_CONTEXT_PIN_IDENTITY_FAILED")
              if str(data.get("trend_id") or "").strip() != trend_id:
                  raise SystemExit("SOURCE_CONTEXT_PIN_TREND_FAILED")
              if str(data.get("topic") or "").strip() != topic:
                  raise SystemExit("SOURCE_CONTEXT_PIN_TOPIC_FAILED")
              if str(data.get("mode") or "").strip() != "full":
                  raise SystemExit("SOURCE_CONTEXT_PIN_MODE_FAILED")
              if str(data.get("status") or "").upper() not in {"APPROVED", "DISPATCHING", "DISPATCHED"}:
                  raise SystemExit("SOURCE_CONTEXT_PIN_STATE_FAILED")
              source = data.get("source_context")
              if not isinstance(source, dict) or not source:
                  raise SystemExit("SOURCE_CONTEXT_PIN_EMPTY")
              approved = str(data.get("approved_at") or "")
              try:
                  stamp = datetime.fromisoformat(approved.replace("Z", "+00:00")).timestamp()
              except Exception:
                  stamp = 0.0
              candidates.append((stamp, request_path, data, source))
          else:
              for path in Path("requests").glob("*.json"):
                  try:
                      data = json.loads(path.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  if str(data.get("trend_id") or "").strip() != trend_id:
                      continue
                  if str(data.get("topic") or "").strip() != topic:
                      continue
                  if str(data.get("mode") or "").strip() != "full":
                      continue
                  if str(data.get("status") or "").upper() not in {"DISPATCHING", "DISPATCHED"}:
                      continue
                  source = data.get("source_context")
                  if not isinstance(source, dict) or not source:
                      continue
                  approved = str(data.get("approved_at") or "")
                  try:
                      stamp = datetime.fromisoformat(approved.replace("Z", "+00:00")).timestamp()
                  except Exception:
                      stamp = 0.0
                  candidates.append((stamp, path, data, source))

          if not candidates:
              raise SystemExit(
                  "SOURCE_CONTEXT_MISSING: no verified full request exists for "
                  f"trend_id={trend_id} topic={topic!r}"
              )

          _, request_path, data, source = max(candidates, key=lambda item: item[0])
          if source_request_id_pin and str(data.get("request_id") or "").strip() != source_request_id_pin:
              raise SystemExit("SOURCE_CONTEXT_PIN_RESOLUTION_FAILED")
          raw = json.dumps(source, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          digest = hashlib.sha256(raw).hexdigest()
          expected = str(data.get("source_context_sha256") or "").strip()
          if not expected or digest != expected:
              raise SystemExit(f"SOURCE_CONTEXT_INTEGRITY_FAILED: expected={expected!r} actual={digest}")

          sources = source.get("sources")
          answers = source.get("fallback_editorial_answers")
          required_answers = ("what_happened","why_happening","who_is_affected","personal_impact","action_now")
          if not isinstance(sources, list) or len(sources) < 2:
              raise SystemExit("SOURCE_CONTEXT_QUALITY_FAILED: at least two sources are required")
          if int(source.get("independent_news_count") or 0) < 2:
              raise SystemExit("SOURCE_CONTEXT_QUALITY_FAILED: independent_news_count must be >= 2")
          if not isinstance(answers, dict) or any(not str(answers.get(key) or "").strip() for key in required_answers):
              raise SystemExit("SOURCE_CONTEXT_QUALITY_FAILED: complete five-answer evidence is required")
          for index, item in enumerate(sources, start=1):
              if not isinstance(item, dict):
                  raise SystemExit(f"SOURCE_CONTEXT_QUALITY_FAILED: source {index} is not structured")
              if not str(item.get("publisher") or "").strip():
                  raise SystemExit(f"SOURCE_CONTEXT_QUALITY_FAILED: source {index} has no publisher")
              if not str(item.get("url") or "").strip().startswith(("https://", "http://")):
                  raise SystemExit(f"SOURCE_CONTEXT_QUALITY_FAILED: source {index} has no valid URL")
              if not str(item.get("supports") or "").strip():
                  raise SystemExit(f"SOURCE_CONTEXT_QUALITY_FAILED: source {index} has no claim support")

          target = Path(os.environ["TAYVORIQ_SOURCE_CONTEXT_FILE"])
          target.write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"SOURCE_CONTEXT_SHA256={digest}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"sha256={digest}\n")
              handle.write(f"trend_id={trend_id}\n")
              handle.write(f"request_id={data.get('request_id')}\n")
              handle.write(f"request_file={request_path}\n")
              handle.write(f"source_request_pinned={'true' if source_request_id_pin else 'false'}\n")
          print(json.dumps({
              "source_context": "verified-and-materialized",
              "request_id": data.get("request_id"),
              "request_file": str(request_path),
              "trend_id": trend_id,
              "source_request_pinned": bool(source_request_id_pin),
              "source_count": len(sources),
              "independent_news_count": source.get("independent_news_count"),
              "sha256": digest,
              "quality_gates_weakened": False,
          }, ensure_ascii=False))
          PY

      - name: Block global duplicate content before production
        id: duplicate_gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/tayvoriq_global_duplicate_gate_v1.py \
            --requests-dir requests \
            --source-request-id "${{ steps.source_context.outputs.request_id }}" \
            --topic "$TOPIC" \
            --source-context "$TAYVORIQ_SOURCE_CONTEXT_FILE" \
            --report-out out/control-plane/global-duplicate-gate.json

      - name: Telegram progress - sources locked
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/tayvoriq_telegram_progress_v1.py \
            --stage sources_locked \
            --topic "$TOPIC" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Validate secrets and notify production start
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID PEXELS_API_KEY GROQ_API_KEY GEMINI_API_KEY; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo "Production-start Telegram suppressed for same-run recovery attempt ${GITHUB_RUN_ATTEMPT}."
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "Verified production-start Telegram is owned by the request dispatcher."
            exit 0
          fi
          suppress_start=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            suppress_start=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.github/run-now/tayvoriq-x-request.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          print('true' if data.get('suppress_start_notification') is True else 'false')
          PY
            )
          fi
          if [ "$suppress_start" = "true" ]; then
            echo "Production-start Telegram suppressed for an already announced approved request."
            exit 0
          fi
          message=$(printf '🟣 TAYVORIQ Produktion gestartet\n\nThema: %s\n\nFür dich: ✅ Keine Aktion nötig.' "$TOPIC")
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${message}")
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") and d.get("result",{}).get("message_id"), d' "$response"

      - name: Resolve immutable Production Green implementation
        id: production_green
        shell: bash
        run: |
          set -euo pipefail
          python tools/tayvoriq_resolve_production_green_v1.py

      - name: Validate immutable implementation policy
        shell: bash
        run: |
          set -euo pipefail
          python tools/tayvoriq_harden_golden_path_v1.py --check

      - name: Checkout implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: ${{ steps.production_green.outputs.implementation_sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Verify immutable implementation checkout
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C implementation rev-parse HEAD)
          expected="${{ steps.production_green.outputs.implementation_sha }}"
          test "$actual" = "$expected" || { echo "IMMUTABLE_IMPLEMENTATION_CHECKOUT_FAILED: expected=$expected actual=$actual"; exit 1; }
          echo "Immutable implementation verified: $actual"

      - name: Apply exact verified autonomous codefix overlay
        id: autocodefix_overlay
        shell: bash
        env:
          EXPECTED_IMPLEMENTATION_SHA: ${{ steps.production_green.outputs.implementation_sha }}
        run: |
          set -euo pipefail
          meta=".github/state/tayvoriq-autocodefix-candidate.json"
          patch=".github/state/tayvoriq-autocodefix-candidate.patch"
          if [ -z "${SOURCE_REQUEST_ID_PIN:-}" ] || [ ! -f "$meta" ] || [ ! -f "$patch" ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "AUTOCODEFIX_OVERLAY_NOT_PRESENT_OR_UNPINNED"
            exit 0
          fi

          set +e
          python - "$meta" "$patch" "$SOURCE_REQUEST_ID_PIN" "$EXPECTED_IMPLEMENTATION_SHA" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          meta_path=Path(sys.argv[1]); patch_path=Path(sys.argv[2])
          request_id=sys.argv[3]; expected_impl=sys.argv[4]
          meta=json.loads(meta_path.read_text(encoding='utf-8'))
          if meta.get('schema')!='tayvoriq-autocodefix-handoff-v1':
              raise SystemExit('AUTOCODEFIX_OVERLAY_SCHEMA_INVALID')
          state=str(meta.get('state') or '')
          if state in {'REJECTED_CONTRACT_REGRESSION','REJECTED','SUPERSEDED'}:
              print(f'AUTOCODEFIX_OVERLAY_REJECTED_SAFE_SKIP:{state}')
              raise SystemExit(2)
          if state!='PATCH_VERIFIED_PENDING_STUDIO_APPLY':
              raise SystemExit('AUTOCODEFIX_OVERLAY_STATE_INVALID')
          if str(meta.get('request_id') or '')!=request_id:
              print('AUTOCODEFIX_OVERLAY_DIFFERENT_REQUEST')
              raise SystemExit(2)
          if meta.get('implementation_repository')!='mojo72549-arch/shorts-agent-studio':
              raise SystemExit('AUTOCODEFIX_OVERLAY_REPOSITORY_MISMATCH')
          if meta.get('quality_gates_weakened') is not False:
              raise SystemExit('AUTOCODEFIX_OVERLAY_QUALITY_GATE_INTEGRITY_FAILED')
          request_path=Path('requests')/f'{request_id}.json'
          if not request_path.is_file():
              raise SystemExit('AUTOCODEFIX_OVERLAY_REQUEST_MISSING')
          request=json.loads(request_path.read_text(encoding='utf-8'))
          codefix=request.get('codefix_recovery') if isinstance(request.get('codefix_recovery'),dict) else {}
          if str(request.get('request_id') or '')!=request_id or str(request.get('status') or '')!='DISPATCHED':
              raise SystemExit('AUTOCODEFIX_OVERLAY_REQUEST_NOT_DISPATCHED')
          if str(codefix.get('status') or '') not in {'ARMED','REPLAY_DISPATCHED'}:
              raise SystemExit('AUTOCODEFIX_OVERLAY_REQUEST_NOT_CODEFIX_BOUND')

          # A handoff is request-bound, not globally sticky. Once a newer
          # Production Green is promoted, deterministic continuity may replay
          # the same request without needing the older overlay at all. In that
          # case the stale handoff must be a safe no-op rather than blocking the
          # newer verified implementation before preflight.
          expected=str(meta.get('patch_sha256') or '')
          bound_patch=str(codefix.get('verified_overlay_patch_sha256') or '')
          if not bound_patch:
              print('AUTOCODEFIX_OVERLAY_NOT_BOUND_TO_CURRENT_REPLAY')
              raise SystemExit(2)
          if bound_patch!=expected:
              print(
                  f'AUTOCODEFIX_OVERLAY_STALE_HANDOFF:{expected}:{bound_patch}'
              )
              raise SystemExit(2)

          if str(meta.get('base_sha') or '')!=expected_impl:
              raise SystemExit(
                  f"AUTOCODEFIX_OVERLAY_BASE_MISMATCH:{meta.get('base_sha')}:{expected_impl}"
              )
          if int(codefix.get('failed_run_id') or 0)!=int(meta.get('failed_run_id') or 0):
              raise SystemExit('AUTOCODEFIX_OVERLAY_FAILED_RUN_MISMATCH')
          if str(codefix.get('failure_signature') or '')!=str(meta.get('failure_signature') or ''):
              raise SystemExit('AUTOCODEFIX_OVERLAY_FAILURE_SIGNATURE_MISMATCH')
          actual=hashlib.sha256(patch_path.read_bytes()).hexdigest()
          if actual!=expected:
              raise SystemExit(f'AUTOCODEFIX_OVERLAY_PATCH_HASH_MISMATCH:{actual}:{expected}')
          print(json.dumps({
              'request_id':request_id,
              'base_sha':expected_impl,
              'patch_sha256':actual,
              'quality_gates_weakened':False,
          },ensure_ascii=False))
          PY
          verify_rc=$?
          set -e
          if [ "$verify_rc" = "2" ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$verify_rc" = "0" ] || exit "$verify_rc"

          git -C implementation apply --check --recount --whitespace=fix "$GITHUB_WORKSPACE/$patch"
          git -C implementation apply --recount --whitespace=fix "$GITHUB_WORKSPACE/$patch"
          git -C implementation diff --check
          git -C implementation diff --name-only > /tmp/tayvoriq-autocodefix-overlay-files.txt
          python - /tmp/tayvoriq-autocodefix-overlay-files.txt <<'PY'
          import sys
          paths=[line.strip() for line in open(sys.argv[1],encoding='utf-8') if line.strip()]
          allowed_prefixes=(
              'tools/tayvoriq_',
              'runtime_patches/tayvoriq_',
              'src/runtime_hotfixes/tayvoriq_',
              'tests/test_tayvoriq_',
          )
          if not paths:
              raise SystemExit('AUTOCODEFIX_OVERLAY_EMPTY_AFTER_APPLY')
          rejected=[path for path in paths if not path.startswith(allowed_prefixes)]
          if rejected:
              raise SystemExit('AUTOCODEFIX_OVERLAY_PATH_NOT_ALLOWLISTED:'+','.join(rejected))
          print({'autocodefix_overlay_paths':paths,'quality_gates_weakened':False})
          PY
          patch_sha=$(sha256sum "$patch" | awk '{print $1}')
          echo "TAYVORIQ_AUTOCODEFIX_PATCH_SHA256=$patch_sha" >> "$GITHUB_ENV"
          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "patch_sha256=$patch_sha" >> "$GITHUB_OUTPUT"
          echo "AUTOCODEFIX_OVERLAY_APPLIED:$SOURCE_REQUEST_ID_PIN:$patch_sha"

      - name: Lightweight contract preflight
        id: lightweight_preflight
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m compileall -q tools src runtime_patches tests
          python tools/tayvoriq_lightweight_preflight.py

      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Restore production dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: tayvoriq-pip-${{ runner.os }}-py311-${{ hashFiles('implementation/requirements.txt') }}-torch260-chatterbox-65b18437
          restore-keys: |
            tayvoriq-pip-${{ runner.os }}-py311-

      - name: Restore prebuilt production virtualenv
        id: production_venv_cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: tayvoriq-venv-v1-${{ runner.os }}-py311-${{ hashFiles('implementation/requirements.txt') }}-torch260-chatterbox-65b18437

      - name: Check production workspace capacity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/pip
          df -h "$GITHUB_WORKSPACE"

      - name: Restore lean production checkpoint
        id: restore_recovery_cache
        uses: actions/cache/restore@v4
        with:
          path: implementation/out/recovery-checkpoint
          key: tayvoriq-recovery-v1-${{ runner.os }}-${{ steps.source_context.outputs.trend_id }}-${{ steps.source_context.outputs.sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tayvoriq-recovery-v1-${{ runner.os }}-${{ steps.source_context.outputs.trend_id }}-${{ steps.source_context.outputs.sha256 }}-

      - name: Hydrate previous verified checkpoint
        id: hydrate_recovery
        working-directory: implementation
        run: |
          set -euo pipefail
          restored=false
          if [ -f out/recovery-checkpoint/meta.json ]; then
            if python tools/tayvoriq_recovery_checkpoint_v1.py hydrate \
              --checkpoint out/recovery-checkpoint \
              --output-root out \
              --trend-id "$TREND_ID" \
              --source-sha256 "$SOURCE_CONTEXT_SHA256"; then
              restored=true
              echo "Lean production checkpoint restored; full trend/script/render restart will be skipped."
            else
              echo "Restored cache failed identity/integrity checks; discard and produce fresh."
              rm -rf out/recovery-checkpoint
            fi
          fi
          echo "restored=$restored" >> "$GITHUB_OUTPUT"

      - name: Record immutable production manifest
        run: |
          set -euo pipefail
          mkdir -p implementation/out/control-plane
          CONTROL_SHA=$(git rev-parse HEAD)
          IMPLEMENTATION_SHA=$(git -C implementation rev-parse HEAD)
          PAGES_SHA=$(git -C pages-worktree rev-parse HEAD)
          SOURCE_SHA="${SOURCE_CONTEXT_SHA256:?canonical source context hash missing}"
          SOURCE_REQUEST_ID="${{ steps.source_context.outputs.request_id }}"
          DUPLICATE_REPORT=out/control-plane/global-duplicate-gate.json
          test -f "$DUPLICATE_REPORT"
          DUPLICATE_SHA=$(sha256sum "$DUPLICATE_REPORT" | awk '{print $1}')
          cp "$DUPLICATE_REPORT" implementation/out/control-plane/global-duplicate-gate.json
          REQUEST_NONCE=$(env -u PYTHONPATH python -I -c 'import json,pathlib; p=pathlib.Path(".github/run-now/tayvoriq-x-request.json"); print((json.loads(p.read_text()).get("request_nonce") if p.exists() else "") or "")')
          env -u PYTHONPATH python -I - "$CONTROL_SHA" "$IMPLEMENTATION_SHA" "$PAGES_SHA" "$SOURCE_SHA" "$REQUEST_NONCE" "$SOURCE_REQUEST_ID" "$DUPLICATE_SHA" <<'PY'
          import json, os, pathlib, sys
          payload = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "topic": os.environ.get("TOPIC"),
              "trend_id": os.environ.get("TREND_ID"),
              "control_plane_schema": os.environ.get("TAYVORIQ_CONTROL_PLANE_SCHEMA"),
              "control_plane_sha": sys.argv[1],
              "implementation_sha": sys.argv[2],
              "review_pages_sha": sys.argv[3],
              "source_context_sha256": sys.argv[4],
              "request_nonce": sys.argv[5],
              "source_request_id": sys.argv[6],
              "global_duplicate_gate_report_sha256": sys.argv[7],
              "implementation_ref": sys.argv[2],
              "implementation_binding": (
                  "production-green-sha+verified-request-codefix-overlay"
                  if os.environ.get("TAYVORIQ_AUTOCODEFIX_PATCH_SHA256")
                  else "production-green-immutable-sha"
              ),
              "autocodefix_overlay_applied": bool(os.environ.get("TAYVORIQ_AUTOCODEFIX_PATCH_SHA256")),
              "autocodefix_patch_sha256": os.environ.get("TAYVORIQ_AUTOCODEFIX_PATCH_SHA256") or None,
              "execution_backend": os.environ.get("TAYVORIQ_EXECUTION_BACKEND"),
              "approved_trend_pinned": True,
              "source_context_bound": True,
              "source_request_pinned": os.environ.get("SOURCE_REQUEST_ID_PIN", "") == sys.argv[6] and bool(sys.argv[6]),
              "global_duplicate_gate_passed": True,
              "single_x_owner": True,
              "restored_recovery_checkpoint": os.environ.get("RESTORED_CHECKPOINT") == "true",
              "lightweight_preflight_passed": True,
              "quality_gates_weakened": False,
          }
          pathlib.Path("implementation/out/control-plane/production-manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False))
          PY
        env:
          RESTORED_CHECKPOINT: ${{ steps.hydrate_recovery.outputs.restored }}

      - name: Early recovery binding gate
        id: early_recovery_binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_REQUEST_ID_PIN" || {
            echo "EARLY_RECOVERY_BIND_SOURCE_REQUEST_PIN_MISSING"
            exit 1
          }

          runtime_request="$RUNNER_TEMP/tayvoriq-early-bind-${GITHUB_RUN_ID}.json"
          bound=false
          for poll in $(seq 1 10); do
            git fetch origin main --quiet
            if git show "origin/main:requests/${SOURCE_REQUEST_ID_PIN}.json" > "$runtime_request" 2>/dev/null; then
              if python -S - "$runtime_request" "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          run_id=int(sys.argv[2])
          previous=list(data.get('previous_golden_path_run_ids') or [])
          generation=max(0,int(data.get('recovery_generation') or 0))
          if not previous and generation <= 0:
              raise SystemExit(0)
          codefix=data.get('codefix_recovery') if isinstance(data.get('codefix_recovery'),dict) else {}
          request_bound=(
              str(data.get('status') or '')=='DISPATCHED'
              and int(data.get('golden_path_run_id') or 0)==run_id
          )
          deterministic_bound=(
              codefix.get('status')=='REPLAY_DISPATCHED'
              and codefix.get('request_substate')=='DISPATCHED'
              and int(codefix.get('replay_run_id') or 0)==run_id
          )
          fresh_bound=(
              codefix.get('status')=='FRESH_RECOVERY_DISPATCHED'
              and codefix.get('request_substate')=='DISPATCHED'
              and int(codefix.get('fresh_recovery_run_id') or 0)==run_id
              and str(data.get('replacement_reason') or '')=='BOUNDED_REQUEST_RECOVERY'
          )
          if request_bound and (deterministic_bound or fresh_bound):
              raise SystemExit(0)
          raise SystemExit(1)
          PY
              then
                bound=true
                break
              fi
            fi
            sleep 2
          done
          [ "$bound" = "true" ] || {
            echo "EARLY_RECOVERY_BIND_TIMEOUT:$SOURCE_REQUEST_ID_PIN:$GITHUB_RUN_ID"
            exit 1
          }
          echo "EARLY_RECOVERY_BIND_VERIFIED:$SOURCE_REQUEST_ID_PIN:$GITHUB_RUN_ID"

      - name: Telegram progress - environment active
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/tayvoriq_telegram_progress_v1.py \
            --stage environment_active \
            --topic "$TOPIC" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Install or reuse production dependencies
        id: production_dependencies
        env:
          VENV_CACHE_HIT: ${{ steps.production_venv_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          missing=()
          for command in ffmpeg ffprobe rsync git; do
            command -v "$command" >/dev/null || missing+=("$command")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg rsync git
          fi

          VENV="$GITHUB_WORKSPACE/.venv"
          export PIP_DISABLE_PIP_VERSION_CHECK=1

          venv_valid=false
          if [ -x "$VENV/bin/python" ]; then
            if "$VENV/bin/python" - <<'PY'
          import requests
          import torch
          from PIL import Image
          version=str(torch.__version__).split('+',1)[0]
          if version != '2.6.0':
              raise SystemExit(1)
          if torch.cuda.is_available():
              raise SystemExit(1)
          print('TAYVORIQ_PRODUCTION_VENV_VALID')
          PY
            then
              venv_valid=true
            fi
          fi

          if [ "$venv_valid" != "true" ]; then
            echo "TAYVORIQ_PRODUCTION_VENV_REBUILD cache_hit=${VENV_CACHE_HIT:-false}"
            rm -rf "$VENV"
            python -m venv "$VENV"
            "$VENV/bin/python" -m pip install --upgrade pip -q

            "$VENV/bin/python" - <<'PY'
          from pathlib import Path
          source = Path('implementation/requirements.txt')
          target = Path('/tmp/tayvoriq-production-requirements.txt')
          lines = source.read_text(encoding='utf-8').splitlines()
          filtered = [line for line in lines if 'chatterbox' not in line.casefold()]
          if len(filtered) == len(lines):
              raise SystemExit('DEPENDENCY_POLICY_FAILED: pinned Chatterbox dependency was not found')
          target.write_text('\n'.join(filtered) + '\n', encoding='utf-8')
          if 'chatterbox' in target.read_text(encoding='utf-8').casefold():
              raise SystemExit('DEPENDENCY_POLICY_FAILED: Chatterbox remained in filtered requirements')
          PY

            install_dependencies() {
              "$VENV/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0" -q &&
              "$VENV/bin/python" -m pip install -r /tmp/tayvoriq-production-requirements.txt pytest -q &&
              "$VENV/bin/python" -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948" -q
            }
            if ! install_dependencies; then
              echo "TAYVORIQ_DEPENDENCY_CACHE_RETRY_AFTER_PURGE"
              rm -rf ~/.cache/pip
              mkdir -p ~/.cache/pip
              install_dependencies
            fi
          else
            echo "TAYVORIQ_PRODUCTION_VENV_CACHE_REUSED"
          fi

          echo "$VENV/bin" >> "$GITHUB_PATH"
          export PATH="$VENV/bin:$PATH"
          python - <<'PY'
          import requests
          import torch
          from PIL import Image
          version = str(torch.__version__)
          if version.split('+', 1)[0] != '2.6.0':
              raise SystemExit(f'DEPENDENCY_POLICY_FAILED: unexpected torch {version}')
          if torch.cuda.is_available():
              raise SystemExit('DEPENDENCY_POLICY_FAILED: CUDA runtime unexpectedly active on CPU production runner')
          print(f'TAYVORIQ_CPU_TORCH_VERIFIED:{version}')
          print('TAYVORIQ_RUNTIME_IMPORTS_VERIFIED:requests,PIL')
          PY

      - name: Preflight
        id: preflight
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m compileall -q tools src runtime_patches
          python tools/tayvoriq_preflight_check.py --report-out out/control-plane/preflight.json

      - name: Exact-request replay readiness gate
        id: replay_readiness
        if: steps.preflight.outcome == 'success'
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_REQUEST_ID_PIN" || {
            echo "REPLAY_READINESS_SOURCE_REQUEST_PIN_MISSING"
            exit 1
          }

          runtime_request="$RUNNER_TEMP/tayvoriq-replay-request-${GITHUB_RUN_ID}.json"
          bound=false
          for poll in $(seq 1 5); do
            git -C .. fetch origin main --quiet
            if git -C .. show "origin/main:requests/${SOURCE_REQUEST_ID_PIN}.json" > "$runtime_request" 2>/dev/null; then
              if python - "$runtime_request" "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          run_id=int(sys.argv[2])
          codefix=data.get('codefix_recovery') if isinstance(data.get('codefix_recovery'),dict) else {}
          repeated=bool(data.get('previous_golden_path_run_ids'))
          if not repeated:
              raise SystemExit(0)
          request_bound=(
              str(data.get('status') or '')=='DISPATCHED'
              and int(data.get('golden_path_run_id') or 0)==run_id
          )
          deterministic_bound=(
              codefix.get('status')=='REPLAY_DISPATCHED'
              and codefix.get('request_substate')=='DISPATCHED'
              and int(codefix.get('replay_run_id') or 0)==run_id
          )
          fresh_bound=(
              codefix.get('status')=='FRESH_RECOVERY_DISPATCHED'
              and codefix.get('request_substate')=='DISPATCHED'
              and int(codefix.get('fresh_recovery_run_id') or 0)==run_id
              and str(data.get('replacement_reason') or '')=='BOUNDED_REQUEST_RECOVERY'
          )
          if request_bound and (deterministic_bound or fresh_bound):
              raise SystemExit(0)
          raise SystemExit(1)
          PY
              then
                bound=true
                break
              fi
            fi
            sleep 1
          done
          [ "$bound" = "true" ] || {
            echo "REPLAY_READINESS_CANONICAL_BIND_TIMEOUT:$SOURCE_REQUEST_ID_PIN:$GITHUB_RUN_ID"
            exit 1
          }

          echo "REPLAY_READINESS_CANONICAL_REQUEST_BOUND:$SOURCE_REQUEST_ID_PIN:$GITHUB_RUN_ID"

          # A bounded Delivery-Watch recovery is already a verified continuation
          # of the exact request. It needs no Studio code mutation when the full
          # preflight passed and the immutable Production Green binding is intact.
          if python - "$runtime_request" "out/control-plane/production-manifest.json" <<'PY'
          import json,sys
          from pathlib import Path
          request=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          manifest=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          codefix=request.get('codefix_recovery') if isinstance(request.get('codefix_recovery'),dict) else {}
          request_id=str(request.get('request_id') or '').strip()
          current_request=str(manifest.get('source_request_id') or '').strip()
          current_run=int(manifest.get('run_id') or 0)
          passed=all((
              str(request.get('status') or '')=='DISPATCHED',
              int(request.get('golden_path_run_id') or 0)==current_run,
              str(request.get('replacement_reason') or '')=='BOUNDED_REQUEST_RECOVERY',
              int(request.get('retry_of_run_id') or 0)>0,
              codefix.get('status')=='FRESH_RECOVERY_DISPATCHED',
              codefix.get('request_substate')=='DISPATCHED',
              int(codefix.get('fresh_recovery_run_id') or 0)==current_run,
              current_request==request_id and bool(request_id),
              manifest.get('implementation_binding')=='production-green-immutable-sha',
              manifest.get('lightweight_preflight_passed') is True,
              manifest.get('autocodefix_overlay_applied') is False,
              manifest.get('quality_gates_weakened') is False,
          ))
          if not passed:
              raise SystemExit(1)
          report={
              'schema':'tayvoriq-replay-readiness-v1',
              'request_id':request_id,
              'topic':str(request.get('topic') or ''),
              'passed':True,
              'supported_topic':'bounded-request-recovery',
              'issues':[],
              'reason':'Delivery Watch rebound the exact approved request to this run; full preflight passed and immutable Production Green remains intact.',
              'quality_gates_weakened':False,
          }
          target=Path('out/control-plane/replay-readiness.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY
          then
            echo "REPLAY_READINESS_VERIFIED_BOUNDED_RECOVERY:$SOURCE_REQUEST_ID_PIN:$GITHUB_RUN_ID"
            exit 0
          fi

          # A deterministic failure that happened in the control plane before
          # implementation checkout must be proven by a control-plane revision,
          # not by inventing a Studio overlay. Keep the immutable Production
          # Green implementation and all quality gates unchanged.
          if python - "$runtime_request" "out/control-plane/production-manifest.json" <<'PY'
          import json,re,sys
          from pathlib import Path
          request=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          manifest=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          codefix=request.get('codefix_recovery') if isinstance(request.get('codefix_recovery'),dict) else {}
          failed_control=str(codefix.get('failed_control_plane_sha') or '').strip().lower()
          failed_impl=str(codefix.get('failed_implementation_sha') or '').strip().lower()
          replay_control=str(codefix.get('replay_control_plane_sha') or '').strip().lower()
          replay_impl=str(codefix.get('replay_implementation_sha') or '').strip().lower()
          current_control=str(manifest.get('control_plane_sha') or '').strip().lower()
          current_impl=str(manifest.get('implementation_sha') or '').strip().lower()
          request_id=str(request.get('request_id') or '').strip()
          current_request=str(manifest.get('source_request_id') or '').strip()
          status=str(codefix.get('status') or '')
          substate=str(codefix.get('request_substate') or '')
          replay_run=int(codefix.get('replay_run_id') or 0)
          current_run=int(manifest.get('run_id') or 0)
          valid_sha=lambda value: bool(re.fullmatch(r'[0-9a-f]{40}', value))
          passed=all((
              status=='REPLAY_DISPATCHED',
              substate=='DISPATCHED',
              replay_run==current_run,
              valid_sha(failed_control),
              (not failed_impl) or (valid_sha(failed_impl) and failed_impl==current_impl),
              valid_sha(replay_control),
              replay_control==current_control,
              replay_control!=failed_control,
              valid_sha(replay_impl),
              replay_impl==current_impl,
              current_request==request_id and bool(request_id),
              manifest.get('implementation_binding')=='production-green-immutable-sha',
              manifest.get('autocodefix_overlay_applied') is False,
              manifest.get('quality_gates_weakened') is False,
          ))
          if not passed:
              raise SystemExit(1)
          report={
              'schema':'tayvoriq-replay-readiness-v1',
              'request_id':request_id,
              'topic':str(request.get('topic') or ''),
              'passed':True,
              'supported_topic':'verified-control-plane-codefix',
              'issues':[],
              'reason':'current replay proves a changed bound control-plane SHA while the immutable Production Green implementation SHA remains unchanged; a recorded failed implementation SHA is valid when it equals that unchanged Production Green SHA',
              'failed_control_plane_sha':failed_control,
              'replay_control_plane_sha':replay_control,
              'implementation_sha':current_impl,
              'quality_gates_weakened':False,
          }
          target=Path('out/control-plane/replay-readiness.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY
          then
            echo "REPLAY_READINESS_VERIFIED_CONTROL_PLANE_CODEFIX:$SOURCE_REQUEST_ID_PIN:$GITHUB_RUN_ID"
            exit 0
          fi

          # A verified Production Green implementation revision is itself the
          # codefix proof. Do not require a request-specific overlay when the
          # previous failed implementation changed to a different immutable
          # Production Green SHA and the current full preflight has passed.
          if python - "$runtime_request" "out/control-plane/production-manifest.json" <<'PY'
          import json,re,sys
          from pathlib import Path
          request=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          manifest=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          codefix=request.get('codefix_recovery') if isinstance(request.get('codefix_recovery'),dict) else {}
          failed_impl=str(codefix.get('failed_implementation_sha') or '').strip().lower()
          replay_impl=str(codefix.get('replay_implementation_sha') or '').strip().lower()
          replay_control=str(codefix.get('replay_control_plane_sha') or '').strip().lower()
          current_impl=str(manifest.get('implementation_sha') or '').strip().lower()
          current_control=str(manifest.get('control_plane_sha') or '').strip().lower()
          request_id=str(request.get('request_id') or '').strip()
          current_request=str(manifest.get('source_request_id') or '').strip()
          status=str(codefix.get('status') or '')
          substate=str(codefix.get('request_substate') or '')
          replay_run=int(codefix.get('replay_run_id') or 0)
          current_run=int(manifest.get('run_id') or 0)
          reason=str(codefix.get('codefix_detection_reason') or '')
          valid_sha=lambda value: bool(re.fullmatch(r'[0-9a-f]{40}', value))
          passed=all((
              status=='REPLAY_DISPATCHED',
              substate=='DISPATCHED',
              replay_run==current_run,
              reason=='production-green-implementation-changed',
              valid_sha(failed_impl),
              valid_sha(replay_impl),
              replay_impl==current_impl,
              replay_impl!=failed_impl,
              valid_sha(replay_control),
              replay_control==current_control,
              current_request==request_id and bool(request_id),
              manifest.get('implementation_binding')=='production-green-immutable-sha',
              manifest.get('autocodefix_overlay_applied') is False,
              manifest.get('lightweight_preflight_passed') is True,
              manifest.get('quality_gates_weakened') is False,
          ))
          if not passed:
              raise SystemExit(1)
          report={
              'schema':'tayvoriq-replay-readiness-v1',
              'request_id':request_id,
              'topic':str(request.get('topic') or ''),
              'passed':True,
              'supported_topic':'verified-production-green-implementation-codefix',
              'issues':[],
              'reason':'replay is bound to a different immutable Production Green implementation SHA than the failed run; current preflight passed and no request overlay is applied',
              'failed_implementation_sha':failed_impl,
              'replay_implementation_sha':replay_impl,
              'control_plane_sha':current_control,
              'quality_gates_weakened':False,
          }
          target=Path('out/control-plane/replay-readiness.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY
          then
            echo "REPLAY_READINESS_VERIFIED_PRODUCTION_GREEN_CODEFIX:$SOURCE_REQUEST_ID_PIN:$GITHUB_RUN_ID"
            exit 0
          fi

          python tools/tayvoriq_replay_readiness_gate_v1.py \
            --request "$runtime_request" \
            --production-manifest out/control-plane/production-manifest.json \
            --report-out out/control-plane/replay-readiness.json

      - name: Telegram progress - production active
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/tayvoriq_telegram_progress_v1.py \
            --stage production_active \
            --topic "$TOPIC" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Restore production model cache
        if: steps.preflight.outcome == 'success' && steps.replay_readiness.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.HF_HOME }}
            ${{ env.TORCH_HOME }}
          key: tayvoriq-models-v3-${{ runner.os }}-py311-torch260-chatterbox-65b18437
          restore-keys: |
            tayvoriq-models-v3-${{ runner.os }}-py311-

      - name: Produce approved master or reuse checkpoint
        id: controller
        if: steps.preflight.outcome == 'success' && steps.replay_readiness.outcome == 'success'
        working-directory: implementation
        shell: bash
        env:
          RESTORED_CHECKPOINT: ${{ steps.hydrate_recovery.outputs.restored }}
        run: |
          set -uo pipefail
          mkdir -p out/tayvoriq-self-heal

          if [ "$RESTORED_CHECKPOINT" = "true" ]; then
            echo "Controller bypassed: verified lean checkpoint is already hydrated."
            echo "state=PUBLISHABLE_OUTPUT_RETRY_REQUIRED" >> "$GITHUB_OUTPUT"
            echo "process_exit=1" >> "$GITHUB_OUTPUT"
            echo "reusable_master=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          heartbeat_stop="${RUNNER_TEMP}/tayvoriq-render-heartbeat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.stop"
          rm -f "$heartbeat_stop"
          (
            heartbeat_started=$(date +%s)
            while true; do
              sleep 180
              [ -f "$heartbeat_stop" ] && exit 0
              elapsed_minutes=$(( ( $(date +%s) - heartbeat_started ) / 60 ))
              python ../tools/tayvoriq_telegram_progress_v1.py \
                --stage render_heartbeat \
                --topic "$TOPIC" \
                --run-id "$GITHUB_RUN_ID" \
                --run-attempt "$GITHUB_RUN_ATTEMPT" \
                --elapsed-minutes "$elapsed_minutes" \
                --policy ../state/tayvoriq-notification-policy.json || true
            done
          ) &
          heartbeat_pid=$!
          stop_heartbeat() {
            touch "$heartbeat_stop"
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
          }
          trap stop_heartbeat EXIT

          set +e
          python tools/tayvoriq_autonomous_entrypoint.py \
            --trend-mode approved_trend \
            --trend-scope auto_scope \
            --topic "${TOPIC}" \
            --language Deutsch \
            --platform youtube_tiktok \
            --target-duration 35 \
            --llm-provider auto \
            --outdir out/tayvoriq-youtube-tiktok \
            --site-root site/tayvoriq \
            --run-id "${GITHUB_RUN_ID}" \
            --state-out out/tayvoriq-review-state.json \
            --report-out out/tayvoriq-self-heal/report.json \
            --request-out out/tayvoriq-self-heal/request.json \
            --max-runtime-attempts 1 \
            --self-heal-depth 0 \
            --target-branch feature/multi-platform-distribution-package \
            2>&1 | tee out/tayvoriq-self-heal/controller-console.log
          process_exit=${PIPESTATUS[0]}
          set -e
          state=$(python -c 'import json,pathlib; p=pathlib.Path("out/tayvoriq-self-heal/report.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get("state") or "TECHNICAL_FAILURE")')
          reusable_master=$(python - <<'PY'
          from pathlib import Path
          import tayvoriq_resume_existing_render as resume
          print('true' if resume.rendered_candidates(Path('out/tayvoriq-youtube-tiktok')) else 'false')
          PY
          )
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "process_exit=$process_exit" >> "$GITHUB_OUTPUT"
          echo "reusable_master=$reusable_master" >> "$GITHUB_OUTPUT"
          echo "Controller handoff: state=$state reusable_master=$reusable_master process_exit=$process_exit"
          stop_heartbeat
          trap - EXIT
          exit 0

      - name: Prepare lean durable recovery checkpoint
        id: prepare_checkpoint
        if: steps.controller.outputs.reusable_master == 'true'
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_recovery_checkpoint_v1.py prepare \
            --outdir out/tayvoriq-youtube-tiktok \
            --checkpoint out/recovery-checkpoint \
            --trend-id "$TREND_ID" \
            --source-sha256 "$SOURCE_CONTEXT_SHA256" \
            --controller-state "${{ steps.controller.outputs.state }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Persist lean recovery checkpoint immediately
        if: steps.prepare_checkpoint.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: implementation/out/recovery-checkpoint
          key: tayvoriq-recovery-v1-${{ runner.os }}-${{ steps.source_context.outputs.trend_id }}-${{ steps.source_context.outputs.sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Telegram progress - checkpoint repair
        if: steps.controller.outputs.state != 'SUCCESS' && steps.controller.outputs.reusable_master == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/tayvoriq_telegram_progress_v1.py \
            --stage checkpoint_repair \
            --topic "$TOPIC" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Repair only failed local checkpoints
        id: checkpoint_recovery
        if: steps.controller.outputs.state != 'SUCCESS' && steps.controller.outputs.reusable_master == 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -uo pipefail
          echo "=== X checkpoint recovery: preserve render, source evidence and platform variants ==="

          # Never spend another long local-repair cycle on an implementation that
          # has already been superseded by a fully verified Production Green SHA.
          # Hand the exact request back to Delivery Watch so it can replay the
          # checkpoint on the newer immutable implementation.
          git -C .. fetch origin main --quiet || true
          if git -C .. show origin/main:.github/state/tayvoriq-production-green.json > /tmp/tayvoriq-latest-green.json 2>/dev/null; then
            if python - "out/control-plane/production-manifest.json" /tmp/tayvoriq-latest-green.json <<'PY'
          import json,sys
          from pathlib import Path
          manifest=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          green=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          current=str(manifest.get('implementation_sha') or '').strip().lower()
          latest=str(green.get('implementation_sha') or '').strip().lower()
          valid=lambda value: len(value)==40 and all(c in '0123456789abcdef' for c in value)
          advanced=(
              valid(current) and valid(latest) and current != latest
              and green.get('full_preflight_passed') is True
              and green.get('quality_gates_weakened') is False
          )
          raise SystemExit(0 if advanced else 1)
          PY
            then
              python - "out/control-plane/production-manifest.json" /tmp/tayvoriq-latest-green.json <<'PY'
          import json,sys
          from pathlib import Path
          manifest=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          green=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          payload={
              'schema_version':2,
              'state':'PRODUCTION_GREEN_ADVANCED_REPLAY_REQUIRED',
              'action':'replay_on_advanced_production_green',
              'reason':'A newer fully verified Production Green implementation became available before local checkpoint repair.',
              'repair_target_stages':['CHECKPOINT_REPLAY'],
              'checkpoint_job_dir':'',
              'repair_history':[],
              'failed_implementation_sha':manifest.get('implementation_sha'),
              'current_production_green_sha':green.get('implementation_sha'),
              'full_pipeline_restarted':False,
              'quality_gates_weakened':False,
              'user_notification_allowed':False,
          }
          target=Path('out/tayvoriq-self-heal/report.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False))
          PY
              echo "state=PRODUCTION_GREEN_ADVANCED_REPLAY_REQUIRED" >> "$GITHUB_OUTPUT"
              echo "process_exit=75" >> "$GITHUB_OUTPUT"
              echo "Checkpoint handoff: state=PRODUCTION_GREEN_ADVANCED_REPLAY_REQUIRED process_exit=75"
              exit 0
            fi
          fi

          repair_heartbeat_stop="${RUNNER_TEMP}/tayvoriq-repair-heartbeat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.stop"
          rm -f "$repair_heartbeat_stop"
          (
            repair_started=$(date +%s)
            while true; do
              sleep 180
              [ -f "$repair_heartbeat_stop" ] && exit 0
              elapsed_minutes=$(( ( $(date +%s) - repair_started ) / 60 ))
              python ../tools/tayvoriq_telegram_progress_v1.py \
                --stage checkpoint_heartbeat \
                --topic "$TOPIC" \
                --run-id "$GITHUB_RUN_ID" \
                --run-attempt "$GITHUB_RUN_ATTEMPT" \
                --elapsed-minutes "$elapsed_minutes" \
                --policy ../state/tayvoriq-notification-policy.json || true
            done
          ) &
          repair_heartbeat_pid=$!
          stop_repair_heartbeat() {
            touch "$repair_heartbeat_stop"
            kill "$repair_heartbeat_pid" 2>/dev/null || true
            wait "$repair_heartbeat_pid" 2>/dev/null || true
          }
          trap stop_repair_heartbeat EXIT

          set +e
          timeout --signal=TERM --kill-after=30s "${TAYVORIQ_LOCAL_REPAIR_WALL_TIMEOUT_SECONDS}s" \
            python tools/tayvoriq_resume_existing_render_v2.py \
              --outdir out/tayvoriq-youtube-tiktok \
              --site-root site/tayvoriq \
              --run-id "${GITHUB_RUN_ID}" \
              --state-out out/tayvoriq-review-state.json \
              --report-out out/tayvoriq-self-heal/report.json \
              2>&1 | tee out/tayvoriq-self-heal/checkpoint-resume-console.log
          resume_exit=${PIPESTATUS[0]}
          set -e
          if [ "$resume_exit" = "124" ] || [ "$resume_exit" = "137" ]; then
            echo "LOCAL_REPAIR_WALL_TIMEOUT:${TAYVORIQ_LOCAL_REPAIR_WALL_TIMEOUT_SECONDS}s"
          fi
          state=$(python -c 'import json,pathlib; p=pathlib.Path("out/tayvoriq-self-heal/report.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get("state") or "PUBLISHABLE_OUTPUT_RETRY_REQUIRED")')
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "process_exit=$resume_exit" >> "$GITHUB_OUTPUT"
          echo "Checkpoint handoff: state=$state process_exit=$resume_exit"
          stop_repair_heartbeat
          trap - EXIT
          exit 0

      - name: Refresh lean recovery checkpoint after local repair
        id: refresh_recovery_checkpoint
        if: steps.checkpoint_recovery.outcome == 'success' && steps.controller.outputs.reusable_master == 'true'
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_recovery_checkpoint_v1.py prepare \
            --outdir out/tayvoriq-youtube-tiktok \
            --checkpoint out/recovery-checkpoint \
            --trend-id "$TREND_ID" \
            --source-sha256 "$SOURCE_CONTEXT_SHA256" \
            --controller-state "${{ steps.checkpoint_recovery.outputs.state }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Persist refreshed post-repair checkpoint
        if: steps.refresh_recovery_checkpoint.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: implementation/out/recovery-checkpoint
          key: tayvoriq-recovery-v1-${{ runner.os }}-${{ steps.source_context.outputs.trend_id }}-${{ steps.source_context.outputs.sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}-post-local-repair

      - name: Assert publishable production output
        id: production
        if: always()
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          REPLAY_READINESS_OUTCOME: ${{ steps.replay_readiness.outcome }}
          CONTROLLER_STATE: ${{ steps.controller.outputs.state }}
          CONTROLLER_EXIT: ${{ steps.controller.outputs.process_exit }}
          RECOVERY_STATE: ${{ steps.checkpoint_recovery.outputs.state }}
          RECOVERY_EXIT: ${{ steps.checkpoint_recovery.outputs.process_exit }}
        run: |
          set -euo pipefail
          if [ "$PREFLIGHT_OUTCOME" != "success" ]; then
            echo "Production blocked before render: preflight outcome=$PREFLIGHT_OUTCOME"
            exit 1
          fi
          if [ "$REPLAY_READINESS_OUTCOME" != "success" ]; then
            echo "Production blocked before render: repeated-failure request is not replay-ready ($REPLAY_READINESS_OUTCOME)"
            exit 1
          fi
          if [ "$CONTROLLER_STATE" = "SUCCESS" ] && [ "${CONTROLLER_EXIT:-1}" = "0" ]; then
            echo "Production completed directly by controller."
            exit 0
          fi
          if [ "$RECOVERY_STATE" = "SUCCESS" ] && [ "${RECOVERY_EXIT:-1}" = "0" ]; then
            echo "Production completed through localized checkpoint recovery."
            exit 0
          fi
          echo "Production is not publishable: controller=$CONTROLLER_STATE/$CONTROLLER_EXIT recovery=$RECOVERY_STATE/$RECOVERY_EXIT"
          exit 1

      - name: Telegram progress - master ready
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/tayvoriq_telegram_progress_v1.py \
            --stage master_ready \
            --topic "$TOPIC" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Validate publication quality initial
        id: publication_gate_initial
        if: steps.production.outcome == 'success'
        continue-on-error: true
        working-directory: implementation
        run: |
          set -euo pipefail
          JOB_DIR=$(python -c 'import json,pathlib; d=json.loads(pathlib.Path("out/tayvoriq-review-state.json").read_text()); print(d.get("job_dir") or "")')
          test -n "$JOB_DIR" && test -d "$JOB_DIR"
          python tools/tayvoriq_publication_quality_gate_v2.py --job-dir "$JOB_DIR" --targets youtube_tiktok

      - name: Repair final publication voice proof only
        id: final_publication_voice_recovery
        if: steps.production.outcome == 'success' && steps.publication_gate_initial.outcome == 'failure'
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          echo "Final publication gate failed after a publishable master; reuse the exact master and invoke bounded final voice/postmux recovery."
          python tools/tayvoriq_resume_existing_render_v2.py \
            --outdir out/tayvoriq-youtube-tiktok \
            --site-root site/tayvoriq \
            --run-id "$GITHUB_RUN_ID" \
            --state-out out/tayvoriq-review-state.json \
            --report-out out/tayvoriq-self-heal/report.json

      - name: Validate publication quality
        id: publication_gate
        if: steps.production.outcome == 'success' && (steps.publication_gate_initial.outcome == 'success' || steps.final_publication_voice_recovery.outcome == 'success')
        working-directory: implementation
        run: |
          set -euo pipefail
          JOB_DIR=$(python -c 'import json,pathlib; d=json.loads(pathlib.Path("out/tayvoriq-review-state.json").read_text()); print(d.get("job_dir") or "")')
          test -n "$JOB_DIR" && test -d "$JOB_DIR"
          python tools/tayvoriq_publication_quality_gate_v2.py --job-dir "$JOB_DIR" --targets youtube_tiktok

      - name: Telegram progress - quality passed
        if: steps.publication_gate.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/tayvoriq_telegram_progress_v1.py \
            --stage quality_passed \
            --topic "$TOPIC" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Publish review page
        id: publish_review
        if: steps.publication_gate.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p pages-worktree/tayvoriq
          rsync -a implementation/site/tayvoriq/ pages-worktree/tayvoriq/
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish TAYVORIQ review ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Send Telegram review
        id: telegram_final
        if: steps.publish_review.outcome == 'success'
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "" \
            --dashboard-url "" \
            --review-id "${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"

      - name: Finalize active production ownership
        if: steps.telegram_final.outcome == 'success' && env.SOURCE_REQUEST_ID_PIN != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REQUEST_ID_PIN" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "ACTIVE_POINTER_FINALIZE_REQUEST_ID_INVALID"
            exit 1
          fi
          REQUEST_FILE="requests/${SOURCE_REQUEST_ID_PIN}.json"
          ACTIVE_POINTER=".github/state/tayvoriq-active-production-request.json"
          git fetch origin main --quiet
          git reset --hard origin/main
          if [ ! -f "$REQUEST_FILE" ] || [ ! -f "$ACTIVE_POINTER" ]; then
            echo "ACTIVE_POINTER_FINALIZE_NO_OWNER_FILES"
            exit 0
          fi
          python -S - "$REQUEST_FILE" "$ACTIVE_POINTER" "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          request_path=Path(sys.argv[1]); pointer_path=Path(sys.argv[2]); run_id=int(sys.argv[3])
          request=json.loads(request_path.read_text(encoding='utf-8'))
          pointer=json.loads(pointer_path.read_text(encoding='utf-8'))
          request_id=str(request.get('request_id') or '')
          if str(pointer.get('request_id') or '')!=request_id or int(pointer.get('golden_path_run_id') or 0)!=run_id:
              print('ACTIVE_POINTER_FINALIZE_OWNER_CHANGED')
              raise SystemExit(0)
          if pointer.get('state')!='ACTIVE':
              print('ACTIVE_POINTER_FINALIZE_ALREADY_TERMINAL')
              raise SystemExit(0)
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          pointer['state']='COMPLETED'
          pointer['reason']='golden-path-review-ready'
          pointer['completed_at']=now
          pointer['updated_at']=now
          request['production_completion']={
              'state':'REVIEW_READY',
              'golden_path_run_id':run_id,
              'completed_at':now,
              'quality_gates_weakened':False,
          }
          request_path.write_text(json.dumps(request,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pointer_path.write_text(json.dumps(pointer,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'ACTIVE_POINTER_FINALIZED:{request_id}:{run_id}')
          PY
          python -S tools/tayvoriq_orchestration_contract.py validate "$REQUEST_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REQUEST_FILE" "$ACTIVE_POINTER"
          if git diff --cached --quiet; then
            echo "ACTIVE_POINTER_FINALIZE_NO_CHANGE"
            exit 0
          fi
          git commit -m "ops(tayvoriq): finalize active production ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt*2))
            git pull --rebase origin main
          done
          echo "ACTIVE_POINTER_FINALIZE_PUSH_FAILED"
          exit 1
      - name: Record internal failure for Delivery Watch
        if: failure()
        continue-on-error: true
        env:
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          REPLAY_READINESS_OUTCOME: ${{ steps.replay_readiness.outcome }}
          PUBLICATION_INITIAL_OUTCOME: ${{ steps.publication_gate_initial.outcome }}
          FINAL_VOICE_RECOVERY_OUTCOME: ${{ steps.final_publication_voice_recovery.outcome }}
        run: |
          set +e
          mkdir -p implementation/out/control-plane
          python - <<'PY'
          import json
          from pathlib import Path
          report_path = Path("implementation/out/tayvoriq-self-heal/report.json")
          preflight_path = Path("implementation/out/control-plane/preflight.json")
          duplicate_path = Path("out/control-plane/global-duplicate-gate.json")
          report = {}
          preflight = {}
          duplicate = {}
          if report_path.exists():
              try: report = json.loads(report_path.read_text(encoding="utf-8"))
              except Exception: report = {}
          if preflight_path.exists():
              try: preflight = json.loads(preflight_path.read_text(encoding="utf-8"))
              except Exception: preflight = {}
          if duplicate_path.exists():
              try: duplicate = json.loads(duplicate_path.read_text(encoding="utf-8"))
              except Exception: duplicate = {}
          state = str(
              (duplicate.get("state") if duplicate.get("passed") is False else "")
              or report.get("state")
              or preflight.get("state")
              or "TECHNICAL_FAILURE"
          )
          repair_targets = {
              str(item or "").strip().upper()
              for item in (report.get("repair_target_stages") or [])
              if str(item or "").strip()
          }
          local_visual_failure = (
              state == "PUBLISHABLE_OUTPUT_RETRY_REQUIRED"
              and "VISUALS" in repair_targets
          )
          late_voice_failure = (
              __import__("os").environ.get("PRODUCTION_OUTCOME") == "success"
              and __import__("os").environ.get("PUBLICATION_INITIAL_OUTCOME") == "failure"
              and __import__("os").environ.get("FINAL_VOICE_RECOVERY_OUTCOME") == "failure"
              and not local_visual_failure
          )
          local_voice_failure = (
              state == "PUBLISHABLE_OUTPUT_RETRY_REQUIRED"
              and repair_targets
              and repair_targets <= {"VOICE"}
          )
          control_plane_binding_failure = (
              __import__("os").environ.get("PREFLIGHT_OUTCOME") == "success"
              and __import__("os").environ.get("REPLAY_READINESS_OUTCOME") == "failure"
          )
          if control_plane_binding_failure:
              state = "CONTROL_PLANE_BINDING_FAILURE"
          elif local_visual_failure:
              # A reusable master exists and the strict audit localized the
              # remaining defect to visuals. Keep the exact request/checkpoint.
              state = "LOCAL_VISUAL_REPAIR_REQUIRED"
          elif late_voice_failure or local_voice_failure:
              # A publishable master already exists. This is stochastic/local
              # narrator-postmux output variance, never a repository-codefix signal.
              state = "TRANSIENT_AUDIO_FAILURE"
          if state == "LOCAL_VISUAL_REPAIR_REQUIRED":
              failure_class = "LOCAL_VISUAL"
          elif state == "TRANSIENT_AUDIO_FAILURE":
              failure_class = "LOCAL_VOICE"
          elif state == "CONTROL_PLANE_BINDING_FAILURE":
              failure_class = "CONTROL_PLANE_BINDING"
          elif state.endswith("CODEFIX_REQUIRED") or state == "CODE_REPAIR_REQUIRED":
              failure_class = "DETERMINISTIC_CODE"
          elif state == "DUPLICATE_CONTENT_BLOCKED":
              failure_class = "DUPLICATE"
          elif state == "EXTERNAL_ACTION_REQUIRED":
              failure_class = "EXTERNAL"
          else:
              failure_class = "INTERNAL_UNCLASSIFIED"

          local_checkpoint = failure_class in {"LOCAL_VISUAL", "LOCAL_VOICE"}
          payload = {
              "schema": "tayvoriq-failure-contract-v2",
              "state": state,
              "failure_class": failure_class,
              "repair_target_stages": sorted(repair_targets),
              "same_request_required": True,
              "master_reusable": bool(local_checkpoint or report.get("checkpoint_job_dir")),
              "full_regeneration_allowed": False if local_checkpoint else None,
              "notification_owner": "tayvoriq-x-golden-path",
              "recovery_owner": "tayvoriq-delivery-watch",
              "telegram_technical_failure_expected": True,
              "internal_recovery_expected": state != "EXTERNAL_ACTION_REQUIRED",
              "quality_gates_weakened": False,
          }
          target = Path("implementation/out/control-plane/failure-notification-policy.json")
          target.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          if duplicate:
              Path("implementation/out/control-plane/global-duplicate-gate.json").write_text(
                  json.dumps(duplicate, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          print(payload)
          PY
          echo "Failure state retained for immediate Telegram status and Delivery Watch recovery."

      - name: Telegram immediate verified stop
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          readarray -t status_fields < <(python -S - <<'PY'
          import json
          from pathlib import Path

          policy_path = Path("implementation/out/control-plane/failure-notification-policy.json")
          duplicate_path = Path("out/control-plane/global-duplicate-gate.json")
          policy = json.loads(policy_path.read_text(encoding="utf-8")) if policy_path.is_file() else {}
          duplicate = json.loads(duplicate_path.read_text(encoding="utf-8")) if duplicate_path.is_file() else {}
          state = str(policy.get("state") or "TECHNICAL_FAILURE")
          stage = "technical_stop"
          detail = "Delivery Watch übernimmt den gebundenen Request; der konkrete Fehler wird gesichert und der Recovery-Run danach neu gebunden."
          if state == "TRANSIENT_AUDIO_FAILURE":
              stage = "audio_recovery"
              detail = "Die Sprachprüfung hat den natürlichen Sprechervertrag noch nicht erfüllt; künstliches Pitch-Down bleibt deaktiviert."
          elif state == "LOCAL_VISUAL_REPAIR_REQUIRED":
              stage = "checkpoint_repair"
              detail = "Der Master bleibt erhalten; nur die vom strikten Audit beanstandeten Visuals werden lokal ersetzt und erneut geprüft."
          elif state == "DUPLICATE_CONTENT_BLOCKED":
              stage = "duplicate_blocked"
              nearest = duplicate.get("nearest_prior") if isinstance(duplicate.get("nearest_prior"), dict) else {}
              detail = "Ähnlich zu: " + str(nearest.get("topic") or "einer früheren Produktion")
          print(stage)
          print(state)
          print(" ".join(detail.split())[:180])
          PY
          )
          notification_stage="${status_fields[0]:-technical_stop}"
          failure_state="${status_fields[1]:-TECHNICAL_FAILURE}"
          notification_detail="${status_fields[2]:-Delivery Watch übernimmt den gebundenen Request und startet den Recovery-Pfad neu.}"
          python tools/tayvoriq_telegram_progress_v1.py \
            --stage "$notification_stage" \
            --topic "$TOPIC" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --failure-state "$failure_state" \
            --detail "$notification_detail" \
            --receipt-out implementation/out/control-plane/telegram-failure-receipt.json

      - name: Build lean diagnostics bundle
        if: always()
        continue-on-error: true
        working-directory: implementation
        run: |
          set +e
          rm -rf out/diagnostics-bundle
          mkdir -p out/diagnostics-bundle/control-plane out/diagnostics-bundle/self-heal out/diagnostics-bundle/job
          cp -f out/control-plane/*.json out/diagnostics-bundle/control-plane/ 2>/dev/null || true
          cp -f out/tayvoriq-self-heal/*.json out/tayvoriq-self-heal/*.log out/diagnostics-bundle/self-heal/ 2>/dev/null || true
          cp -f out/tayvoriq-review-state.json out/diagnostics-bundle/ 2>/dev/null || true
          cp -f out/recovery-checkpoint/meta.json out/diagnostics-bundle/recovery-checkpoint-meta.json 2>/dev/null || true
          python - <<'PY'
          import shutil
          from pathlib import Path
          try:
              import tayvoriq_resume_existing_render as resume
              candidates = resume.rendered_candidates(Path('out/tayvoriq-youtube-tiktok'))
          except Exception:
              candidates = []
          if candidates:
              job_dir, _ = candidates[0]
              target = Path('out/diagnostics-bundle/job')
              for path in job_dir.iterdir():
                  if path.is_file() and path.suffix.casefold() == '.json':
                      shutil.copy2(path, target / path.name)
              for platform in ('youtube_shorts', 'tiktok'):
                  source = job_dir / platform
                  if not source.is_dir():
                      continue
                  platform_target = target / platform
                  platform_target.mkdir(parents=True, exist_ok=True)
                  for path in source.iterdir():
                      if path.is_file() and path.suffix.casefold() == '.json':
                          shutil.copy2(path, platform_target / path.name)
          PY

      - name: Upload lean diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-x-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: implementation/out/diagnostics-bundle/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Verify failure handoff for canonical Delivery Watch
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          failure_state="$(python -S - <<'PY'
          import json
          from pathlib import Path
          path=Path("implementation/out/control-plane/failure-notification-policy.json")
          data=json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}
          print(str(data.get("state") or "TECHNICAL_FAILURE"))
          PY
          )"
          if [ "$failure_state" = "TRANSIENT_AUDIO_FAILURE" ]; then
            echo "CODEFIX_FINALIZER_SKIPPED_LOCAL_VOICE_FAILURE"
            echo "Delivery Watch exclusively owns bounded same-run voice/postmux retry."
            exit 0
          fi
          if [ "$failure_state" = "LOCAL_VISUAL_REPAIR_REQUIRED" ]; then
            echo "CODEFIX_FINALIZER_SKIPPED_LOCAL_VISUAL_FAILURE"
            echo "Delivery Watch exclusively owns bounded same-run visual checkpoint retry."
            exit 0
          fi
          if [ "$failure_state" = "CONTROL_PLANE_BINDING_FAILURE" ]; then
            echo "CODEFIX_FINALIZER_SKIPPED_CONTROL_PLANE_BINDING_FAILURE"
            echo "Delivery Watch exclusively owns bounded binding retry; no Studio codefix provider is called."
            exit 0
          fi
          if [ -z "$SOURCE_REQUEST_ID_PIN" ]; then
            echo 'CODEFIX_FINALIZER_SKIPPED_UNPINNED_REQUEST'
            exit 0
          fi
          if [[ ! "$SOURCE_REQUEST_ID_PIN" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo 'CODEFIX_FINALIZER_REQUEST_ID_INVALID'
            exit 1
          fi
          request_rel="requests/${SOURCE_REQUEST_ID_PIN}.json"
          owner_dir="${RUNNER_TEMP}/tayvoriq-finalizer-owner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$owner_dir"
          git fetch --no-tags --prune origin main --quiet
          git show origin/main:.github/state/tayvoriq-active-production-request.json > "$owner_dir/active.json"
          git show "origin/main:${request_rel}" > "$owner_dir/request.json"
          python - "$SOURCE_REQUEST_ID_PIN" "$GITHUB_RUN_ID" "$owner_dir/active.json" "$owner_dir/request.json" <<'PY'
          import json,sys
          from pathlib import Path
          request_id=sys.argv[1]; run_id=int(sys.argv[2])
          pointer_path=Path(sys.argv[3]); request_path=Path(sys.argv[4])
          if not pointer_path.is_file() or not request_path.is_file():
              raise SystemExit('CODEFIX_FINALIZER_OWNER_FILES_MISSING')
          pointer=json.loads(pointer_path.read_text(encoding='utf-8'))
          request=json.loads(request_path.read_text(encoding='utf-8'))
          if pointer.get('schema')!='tayvoriq-active-production-request-v1' or pointer.get('state')!='ACTIVE':
              raise SystemExit('CODEFIX_FINALIZER_ACTIVE_POINTER_INVALID')
          if str(pointer.get('request_id') or '')!=request_id or int(pointer.get('golden_path_run_id') or 0)!=run_id:
              raise SystemExit('CODEFIX_FINALIZER_ACTIVE_OWNER_CHANGED')
          if str(request.get('request_id') or '')!=request_id or int(request.get('golden_path_run_id') or 0)!=run_id:
              raise SystemExit('CODEFIX_FINALIZER_REQUEST_OWNER_CHANGED')
          for field in ('approval_key','source_context_sha256','contract_sha256'):
              pv=str(pointer.get(field) or '').strip(); rv=str(request.get(field) or '').strip()
              if pv and pv!=rv: raise SystemExit(f'CODEFIX_FINALIZER_{field.upper()}_MISMATCH')
          print(f'CODEFIX_FINALIZER_DISPATCH_OWNER_VERIFIED:{request_id}:{run_id}')
          PY
          echo "DELIVERY_WATCH_HANDOFF_VERIFIED:$SOURCE_REQUEST_ID_PIN:$GITHUB_RUN_ID"
          echo "The completed Golden Path workflow_run event is the single recovery trigger; no duplicate continuity dispatch is issued here."
