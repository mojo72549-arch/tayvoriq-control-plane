name: TAYVORIQ-X Golden Path

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Freigegebenes Thema
        required: false
        type: string
      trend_id:
        description: Freigegebene Trend-ID
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/run-now/tayvoriq-x-request.json

permissions:
  contents: write
  actions: write

concurrency:
  group: tayvoriq-x-golden-path
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
  TAYVORIQ_CONTROL_PLANE_SCHEMA: "x-v3"
  TAYVORIQ_EXECUTION_BACKEND: "github_hosted_public"
  TAYVORIQ_CLOUD_MODE: "true"
  TAYVORIQ_RENDER_SIZE: "1080x1920"
  TAYVORIQ_TTS_PROVIDER: "chatterbox_v3"
  TAYVORIQ_CHATTERBOX_ENABLED: "true"
  TAYVORIQ_CHATTERBOX_REQUIRED: "true"
  TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
  TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
  TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "300"
  TAYVORIQ_CHATTERBOX_MAX_CHUNKS: "2"
  TAYVORIQ_CHATTERBOX_MAX_CHARS: "520"
  TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
  TAYVORIQ_CHATTERBOX_EXAGGERATION: "0.42"
  TAYVORIQ_CHATTERBOX_CFG_WEIGHT: "0.36"
  TAYVORIQ_CHATTERBOX_PAUSE_MS: "360"
  TAYVORIQ_NATURAL_VOICE_WPM: "132"
  TAYVORIQ_NARRATOR_PITCH_FACTOR: "0.90"
  TAYVORIQ_NARRATOR_TONE_REQUIRED: "true"
  TAYVORIQ_RENDER_TIMEOUT_SECONDS: "900"
  TAYVORIQ_EDGE_RECOVERY_TIMEOUT_SECONDS: "900"
  TAYVORIQ_AUDIT_TIMEOUT_SECONDS: "210"
  TAYVORIQ_AUDIT_RETRY_DELAYS: "0,12,30"
  TAYVORIQ_CONTROLLER_TIMEOUT_SECONDS: "1800"
  TAYVORIQ_VISUAL_REPAIR_TIMEOUT_SECONDS: "900"
  TAYVORIQ_VOICE_REPAIR_TIMEOUT_SECONDS: "1200"
  TAYVORIQ_LOCAL_QUALITY_REPAIR_ATTEMPTS: "2"
  TAYVORIQ_APPROVED_TREND_PINNED: "true"
  TAYVORIQ_TELEGRAM_PROGRESS: "false"
  TAYVORIQ_SOURCE_CONTEXT_FILE: ${{ github.workspace }}/tayvoriq-source-context.json
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}
  TREND_ID: ${{ github.event.inputs.trend_id || github.event.client_payload.trend_id || '' }}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Resolve approved X request
        id: resolve_request
        shell: bash
        env:
          EVENT_TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}
          EVENT_TREND_ID: ${{ github.event.inputs.trend_id || github.event.client_payload.trend_id || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request_path = Path(".github/run-now/tayvoriq-x-request.json")
          if not request_path.is_file():
              raise SystemExit("CONTROL_PLANE_REQUEST_MISSING")
          request = json.loads(request_path.read_text(encoding="utf-8"))
          topic = str(os.environ.get("EVENT_TOPIC") or request.get("topic") or "").strip()
          trend_id = str(os.environ.get("EVENT_TREND_ID") or request.get("trend_id") or "").strip()
          if not topic or any(char in topic for char in "\r\n"):
              raise SystemExit("CONTROL_PLANE_TOPIC_RESOLUTION_FAILED")
          if not trend_id or any(char in trend_id for char in "\r\n"):
              raise SystemExit("CONTROL_PLANE_TREND_RESOLUTION_FAILED")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"TOPIC={topic}\n")
              handle.write(f"TREND_ID={trend_id}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"trend_id={trend_id}\n")
          print(json.dumps({
              "request_resolution": "approved-x-request",
              "topic": topic,
              "trend_id": trend_id,
              "event_topic_override": bool(os.environ.get("EVENT_TOPIC")),
              "quality_gates_weakened": False,
          }, ensure_ascii=False))
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate hosted execution contract
        shell: bash
        env:
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT_VALUE" = "github-hosted" || { echo "RUNNER_CONTRACT_FAILED: GitHub-hosted runner required"; exit 1; }
          test "$RUNNER_OS_VALUE" = "Linux" || { echo "RUNNER_CONTRACT_FAILED: Linux required"; exit 1; }
          test "$RUNNER_ARCH_VALUE" = "X64" || { echo "RUNNER_CONTRACT_FAILED: X64 required"; exit 1; }
          for command in python git curl; do
            command -v "$command" >/dev/null || { echo "RUNNER_CONTRACT_FAILED: missing $command"; exit 1; }
          done
          python - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 11):
              raise SystemExit(f"RUNNER_CONTRACT_FAILED: Python 3.11 required, got {sys.version}")
          PY
          mkdir -p "$HF_HOME" "$TORCH_HOME"
          df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 { if ($4 < 12582912) { print "RUNNER_CONTRACT_FAILED: less than 12 GiB free"; exit 1 } }'

      - name: Validate single X control-plane request contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          workflow = ".github/workflows/tayvoriq-deliver-video-now.yml"
          workflow_files = list(Path('.github/workflows').glob('*.yml')) + list(Path('.github/workflows').glob('*.yaml'))
          x_owners = []
          for path in workflow_files:
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'name: TAYVORIQ-X Golden Path' in text:
                  x_owners.append(str(path))
          if x_owners != [workflow]:
              raise SystemExit(f"CONTROL_PLANE_SINGLE_OWNER_FAILED: expected={[workflow]!r} actual={x_owners!r}")

          if os.environ.get('EVENT_NAME') == 'push':
              path = Path('.github/run-now/tayvoriq-x-request.json')
              if not path.is_file():
                  raise SystemExit('CONTROL_PLANE_REQUEST_MISSING')
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('request') != 'tayvoriq-x-production':
                  raise SystemExit('CONTROL_PLANE_REQUEST_TYPE_FAILED')
              if data.get('workflow') != workflow:
                  raise SystemExit('CONTROL_PLANE_WORKFLOW_BINDING_FAILED')
              if data.get('approved_trend_pinned') is not True:
                  raise SystemExit('CONTROL_PLANE_APPROVAL_PIN_FAILED')
              if str(data.get('topic') or '').strip() != str(os.environ.get('TOPIC') or '').strip():
                  raise SystemExit('CONTROL_PLANE_TOPIC_BINDING_FAILED')
              if str(data.get('trend_id') or '').strip() != str(os.environ.get('TREND_ID') or '').strip():
                  raise SystemExit('CONTROL_PLANE_TREND_BINDING_FAILED')
              hardening = data.get('hardening')
              required = (
                  'checkpoint_source_context_required',
                  'platform_specific_cta_required',
                  'platform_specific_voice_repair_required',
                  'validated_voice_candidate_required',
                  'premium_voice_required',
                  'concrete_failure_state_required',
              )
              if not isinstance(hardening, dict) or any(hardening.get(key) is not True for key in required):
                  raise SystemExit('CONTROL_PLANE_HARDENING_CONTRACT_FAILED')
              if hardening.get('quality_gates_weakened') is not False:
                  raise SystemExit('CONTROL_PLANE_QUALITY_GATE_INTEGRITY_FAILED')
              nonce = str(data.get('request_nonce') or '').strip()
              if len(nonce) < 12:
                  raise SystemExit('CONTROL_PLANE_REQUEST_NONCE_FAILED')
          print('TAYVORIQ_X_CONTROL_PLANE_CONTRACT_PASSED')
          PY

      - name: Materialize immutable verified source context
        id: source_context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          trend_id = str(os.environ.get("TREND_ID") or "").strip()
          topic = str(os.environ.get("TOPIC") or "").strip()
          if not trend_id:
              raise SystemExit("SOURCE_CONTEXT_MISSING: approved trend id is empty")
          if not topic:
              raise SystemExit("SOURCE_CONTEXT_MISSING: approved topic is empty")

          candidates = []
          for path in Path("requests").glob("*.json"):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if str(data.get("trend_id") or "").strip() != trend_id:
                  continue
              if str(data.get("topic") or "").strip() != topic:
                  continue
              if str(data.get("mode") or "").strip() != "full":
                  continue
              if str(data.get("status") or "").upper() not in {"DISPATCHING", "DISPATCHED"}:
                  continue
              source = data.get("source_context")
              if not isinstance(source, dict) or not source:
                  continue
              approved = str(data.get("approved_at") or "")
              try:
                  stamp = datetime.fromisoformat(approved.replace("Z", "+00:00")).timestamp()
              except Exception:
                  stamp = 0.0
              candidates.append((stamp, path, data, source))

          if not candidates:
              raise SystemExit(
                  "SOURCE_CONTEXT_MISSING: no verified full request exists for "
                  f"trend_id={trend_id} topic={topic!r}"
              )

          _, request_path, data, source = max(candidates, key=lambda item: item[0])
          raw = json.dumps(source, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          digest = hashlib.sha256(raw).hexdigest()
          expected = str(data.get("source_context_sha256") or "").strip()
          if not expected or digest != expected:
              raise SystemExit(f"SOURCE_CONTEXT_INTEGRITY_FAILED: expected={expected!r} actual={digest}")

          sources = source.get("sources")
          answers = source.get("fallback_editorial_answers")
          required_answers = ("what_happened","why_happening","who_is_affected","personal_impact","action_now")
          if not isinstance(sources, list) or len(sources) < 2:
              raise SystemExit("SOURCE_CONTEXT_QUALITY_FAILED: at least two sources are required")
          if int(source.get("independent_news_count") or 0) < 2:
              raise SystemExit("SOURCE_CONTEXT_QUALITY_FAILED: independent_news_count must be >= 2")
          if not isinstance(answers, dict) or any(not str(answers.get(key) or "").strip() for key in required_answers):
              raise SystemExit("SOURCE_CONTEXT_QUALITY_FAILED: complete five-answer evidence is required")
          for index, item in enumerate(sources, start=1):
              if not isinstance(item, dict):
                  raise SystemExit(f"SOURCE_CONTEXT_QUALITY_FAILED: source {index} is not structured")
              if not str(item.get("publisher") or "").strip():
                  raise SystemExit(f"SOURCE_CONTEXT_QUALITY_FAILED: source {index} has no publisher")
              if not str(item.get("url") or "").strip().startswith(("https://", "http://")):
                  raise SystemExit(f"SOURCE_CONTEXT_QUALITY_FAILED: source {index} has no valid URL")
              if not str(item.get("supports") or "").strip():
                  raise SystemExit(f"SOURCE_CONTEXT_QUALITY_FAILED: source {index} has no claim support")

          target = Path(os.environ["TAYVORIQ_SOURCE_CONTEXT_FILE"])
          target.write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"SOURCE_CONTEXT_SHA256={digest}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"sha256={digest}\n")
              handle.write(f"trend_id={trend_id}\n")
          print(json.dumps({
              "source_context": "verified-and-materialized",
              "request_id": data.get("request_id"),
              "request_file": str(request_path),
              "trend_id": trend_id,
              "source_count": len(sources),
              "independent_news_count": source.get("independent_news_count"),
              "sha256": digest,
              "quality_gates_weakened": False,
          }, ensure_ascii=False))
          PY

      - name: Validate secrets and notify production start
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID PEXELS_API_KEY GROQ_API_KEY GEMINI_API_KEY; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo "Production-start Telegram suppressed for same-run recovery attempt ${GITHUB_RUN_ATTEMPT}."
            exit 0
          fi
          suppress_start=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            suppress_start=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.github/run-now/tayvoriq-x-request.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          print('true' if data.get('suppress_start_notification') is True else 'false')
          PY
            )
          fi
          if [ "$suppress_start" = "true" ]; then
            echo "Production-start Telegram suppressed for an already announced approved request."
            exit 0
          fi
          message=$(printf '🟣 TAYVORIQ Produktion gestartet\n\nThema: %s\n\nFür dich: ✅ Keine Aktion nötig.' "$TOPIC")
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${message}")
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") and d.get("result",{}).get("message_id"), d' "$response"

      - name: Checkout implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Lightweight contract preflight
        id: lightweight_preflight
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m compileall -q tools src runtime_patches tests
          python tools/tayvoriq_lightweight_preflight.py

      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Restore pip dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: tayvoriq-pip-v3-${{ runner.os }}-py311-${{ hashFiles('implementation/requirements.txt') }}-torch260-chatterbox-65b18437
          restore-keys: |
            tayvoriq-pip-v3-${{ runner.os }}-py311-

      - name: Restore lean production checkpoint
        id: restore_recovery_cache
        uses: actions/cache/restore@v4
        with:
          path: implementation/out/recovery-checkpoint
          key: tayvoriq-recovery-v1-${{ runner.os }}-${{ steps.source_context.outputs.trend_id }}-${{ steps.source_context.outputs.sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tayvoriq-recovery-v1-${{ runner.os }}-${{ steps.source_context.outputs.trend_id }}-${{ steps.source_context.outputs.sha256 }}-

      - name: Hydrate previous verified checkpoint
        id: hydrate_recovery
        working-directory: implementation
        run: |
          set -euo pipefail
          restored=false
          if [ -f out/recovery-checkpoint/meta.json ]; then
            if python tools/tayvoriq_recovery_checkpoint_v1.py hydrate \
              --checkpoint out/recovery-checkpoint \
              --output-root out \
              --trend-id "$TREND_ID" \
              --source-sha256 "$SOURCE_CONTEXT_SHA256"; then
              restored=true
              echo "Lean production checkpoint restored; full trend/script/render restart will be skipped."
            else
              echo "Restored cache failed identity/integrity checks; discard and produce fresh."
              rm -rf out/recovery-checkpoint
            fi
          fi
          echo "restored=$restored" >> "$GITHUB_OUTPUT"

      - name: Record immutable production manifest
        run: |
          set -euo pipefail
          mkdir -p implementation/out/control-plane
          CONTROL_SHA=$(git rev-parse HEAD)
          IMPLEMENTATION_SHA=$(git -C implementation rev-parse HEAD)
          PAGES_SHA=$(git -C pages-worktree rev-parse HEAD)
          SOURCE_SHA="${SOURCE_CONTEXT_SHA256:?canonical source context hash missing}"
          REQUEST_NONCE=$(env -u PYTHONPATH python -I -c 'import json,pathlib; p=pathlib.Path(".github/run-now/tayvoriq-x-request.json"); print((json.loads(p.read_text()).get("request_nonce") if p.exists() else "") or "")')
          env -u PYTHONPATH python -I - "$CONTROL_SHA" "$IMPLEMENTATION_SHA" "$PAGES_SHA" "$SOURCE_SHA" "$REQUEST_NONCE" <<'PY'
          import json, os, pathlib, sys
          payload = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "topic": os.environ.get("TOPIC"),
              "trend_id": os.environ.get("TREND_ID"),
              "control_plane_schema": os.environ.get("TAYVORIQ_CONTROL_PLANE_SCHEMA"),
              "control_plane_sha": sys.argv[1],
              "implementation_sha": sys.argv[2],
              "review_pages_sha": sys.argv[3],
              "source_context_sha256": sys.argv[4],
              "request_nonce": sys.argv[5],
              "implementation_branch": "feature/multi-platform-distribution-package",
              "execution_backend": os.environ.get("TAYVORIQ_EXECUTION_BACKEND"),
              "approved_trend_pinned": True,
              "source_context_bound": True,
              "single_x_owner": True,
              "restored_recovery_checkpoint": os.environ.get("RESTORED_CHECKPOINT") == "true",
              "lightweight_preflight_passed": True,
              "quality_gates_weakened": False,
          }
          pathlib.Path("implementation/out/control-plane/production-manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False))
          PY
        env:
          RESTORED_CHECKPOINT: ${{ steps.hydrate_recovery.outputs.restored }}

      - name: Install production dependencies
        run: |
          set -euo pipefail
          missing=()
          for command in ffmpeg ffprobe rsync git; do
            command -v "$command" >/dev/null || missing+=("$command")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg rsync git
          fi
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          python -m pip install -r implementation/requirements.txt pytest -q
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0" -q
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948" -q

      - name: Preflight
        id: preflight
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m compileall -q tools src runtime_patches
          python tools/tayvoriq_preflight_check.py --report-out out/control-plane/preflight.json

      - name: Restore production model cache
        if: steps.preflight.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.HF_HOME }}
            ${{ env.TORCH_HOME }}
          key: tayvoriq-models-v3-${{ runner.os }}-py311-torch260-chatterbox-65b18437
          restore-keys: |
            tayvoriq-models-v3-${{ runner.os }}-py311-

      - name: Produce approved master or reuse checkpoint
        id: controller
        if: steps.preflight.outcome == 'success'
        working-directory: implementation
        shell: bash
        env:
          RESTORED_CHECKPOINT: ${{ steps.hydrate_recovery.outputs.restored }}
        run: |
          set -uo pipefail
          mkdir -p out/tayvoriq-self-heal

          if [ "$RESTORED_CHECKPOINT" = "true" ]; then
            echo "Controller bypassed: verified lean checkpoint is already hydrated."
            echo "state=PUBLISHABLE_OUTPUT_RETRY_REQUIRED" >> "$GITHUB_OUTPUT"
            echo "process_exit=1" >> "$GITHUB_OUTPUT"
            echo "reusable_master=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          python tools/tayvoriq_autonomous_entrypoint.py \
            --trend-mode approved_trend \
            --trend-scope auto_scope \
            --topic "${TOPIC}" \
            --language Deutsch \
            --platform youtube_tiktok \
            --target-duration 35 \
            --llm-provider auto \
            --outdir out/tayvoriq-youtube-tiktok \
            --site-root site/tayvoriq \
            --run-id "${GITHUB_RUN_ID}" \
            --state-out out/tayvoriq-review-state.json \
            --report-out out/tayvoriq-self-heal/report.json \
            --request-out out/tayvoriq-self-heal/request.json \
            --max-runtime-attempts 1 \
            --self-heal-depth 0 \
            --target-branch feature/multi-platform-distribution-package \
            2>&1 | tee out/tayvoriq-self-heal/controller-console.log
          process_exit=${PIPESTATUS[0]}
          set -e
          state=$(python -c 'import json,pathlib; p=pathlib.Path("out/tayvoriq-self-heal/report.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get("state") or "TECHNICAL_FAILURE")')
          reusable_master=$(python - <<'PY'
          from pathlib import Path
          import tayvoriq_resume_existing_render as resume
          print('true' if resume.rendered_candidates(Path('out/tayvoriq-youtube-tiktok')) else 'false')
          PY
          )
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "process_exit=$process_exit" >> "$GITHUB_OUTPUT"
          echo "reusable_master=$reusable_master" >> "$GITHUB_OUTPUT"
          echo "Controller handoff: state=$state reusable_master=$reusable_master process_exit=$process_exit"
          exit 0

      - name: Prepare lean durable recovery checkpoint
        id: prepare_checkpoint
        if: steps.controller.outputs.reusable_master == 'true'
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_recovery_checkpoint_v1.py prepare \
            --outdir out/tayvoriq-youtube-tiktok \
            --checkpoint out/recovery-checkpoint \
            --trend-id "$TREND_ID" \
            --source-sha256 "$SOURCE_CONTEXT_SHA256" \
            --controller-state "${{ steps.controller.outputs.state }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Persist lean recovery checkpoint immediately
        if: steps.prepare_checkpoint.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: implementation/out/recovery-checkpoint
          key: tayvoriq-recovery-v1-${{ runner.os }}-${{ steps.source_context.outputs.trend_id }}-${{ steps.source_context.outputs.sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Repair only failed local checkpoints
        id: checkpoint_recovery
        if: steps.controller.outputs.state != 'SUCCESS' && steps.controller.outputs.reusable_master == 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -uo pipefail
          echo "=== X checkpoint recovery: preserve render, source evidence and platform variants ==="
          set +e
          python tools/tayvoriq_resume_existing_render_v2.py \
            --outdir out/tayvoriq-youtube-tiktok \
            --site-root site/tayvoriq \
            --run-id "${GITHUB_RUN_ID}" \
            --state-out out/tayvoriq-review-state.json \
            --report-out out/tayvoriq-self-heal/report.json \
            2>&1 | tee out/tayvoriq-self-heal/checkpoint-resume-console.log
          resume_exit=${PIPESTATUS[0]}
          set -e
          state=$(python -c 'import json,pathlib; p=pathlib.Path("out/tayvoriq-self-heal/report.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get("state") or "PUBLISHABLE_OUTPUT_RETRY_REQUIRED")')
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "process_exit=$resume_exit" >> "$GITHUB_OUTPUT"
          echo "Checkpoint handoff: state=$state process_exit=$resume_exit"
          exit 0

      - name: Assert publishable production output
        id: production
        if: always()
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          CONTROLLER_STATE: ${{ steps.controller.outputs.state }}
          CONTROLLER_EXIT: ${{ steps.controller.outputs.process_exit }}
          RECOVERY_STATE: ${{ steps.checkpoint_recovery.outputs.state }}
          RECOVERY_EXIT: ${{ steps.checkpoint_recovery.outputs.process_exit }}
        run: |
          set -euo pipefail
          if [ "$PREFLIGHT_OUTCOME" != "success" ]; then
            echo "Production blocked before render: preflight outcome=$PREFLIGHT_OUTCOME"
            exit 1
          fi
          if [ "$CONTROLLER_STATE" = "SUCCESS" ] && [ "${CONTROLLER_EXIT:-1}" = "0" ]; then
            echo "Production completed directly by controller."
            exit 0
          fi
          if [ "$RECOVERY_STATE" = "SUCCESS" ] && [ "${RECOVERY_EXIT:-1}" = "0" ]; then
            echo "Production completed through localized checkpoint recovery."
            exit 0
          fi
          echo "Production is not publishable: controller=$CONTROLLER_STATE/$CONTROLLER_EXIT recovery=$RECOVERY_STATE/$RECOVERY_EXIT"
          exit 1

      - name: Validate publication quality
        id: publication_gate
        if: steps.production.outcome == 'success'
        working-directory: implementation
        run: |
          set -euo pipefail
          JOB_DIR=$(python -c 'import json,pathlib; d=json.loads(pathlib.Path("out/tayvoriq-review-state.json").read_text()); print(d.get("job_dir") or "")')
          test -n "$JOB_DIR" && test -d "$JOB_DIR"
          python tools/tayvoriq_publication_quality_gate_v2.py --job-dir "$JOB_DIR" --targets youtube_tiktok

      - name: Publish review page
        id: publish_review
        if: steps.publication_gate.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf pages-worktree/tayvoriq
          mkdir -p pages-worktree/tayvoriq
          rsync -a implementation/site/tayvoriq/ pages-worktree/tayvoriq/
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish TAYVORIQ review ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Send Telegram review
        id: telegram_final
        if: steps.publish_review.outcome == 'success'
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "" \
            --dashboard-url "" \
            --review-id "${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"

      - name: Record internal failure for Delivery Watch
        if: failure()
        continue-on-error: true
        working-directory: implementation
        run: |
          set +e
          mkdir -p out/control-plane
          python - <<'PY'
          import json
          from pathlib import Path
          report_path = Path("out/tayvoriq-self-heal/report.json")
          preflight_path = Path("out/control-plane/preflight.json")
          report = {}
          preflight = {}
          if report_path.exists():
              try: report = json.loads(report_path.read_text(encoding="utf-8"))
              except Exception: report = {}
          if preflight_path.exists():
              try: preflight = json.loads(preflight_path.read_text(encoding="utf-8"))
              except Exception: preflight = {}
          state = str(report.get("state") or preflight.get("state") or "TECHNICAL_FAILURE")
          payload = {
              "state": state,
              "notification_owner": "tayvoriq-delivery-watch",
              "telegram_technical_failure_emitted": False,
              "internal_recovery_expected": state != "EXTERNAL_ACTION_REQUIRED",
              "quality_gates_weakened": False,
          }
          Path("out/control-plane/failure-notification-policy.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(payload)
          PY
          echo "Recoverable technical failure retained for Delivery Watch; no Telegram technical-error message emitted."

      - name: Build lean diagnostics bundle
        if: always()
        continue-on-error: true
        working-directory: implementation
        run: |
          set +e
          rm -rf out/diagnostics-bundle
          mkdir -p out/diagnostics-bundle/control-plane out/diagnostics-bundle/self-heal out/diagnostics-bundle/job
          cp -f out/control-plane/*.json out/diagnostics-bundle/control-plane/ 2>/dev/null || true
          cp -f out/tayvoriq-self-heal/*.json out/tayvoriq-self-heal/*.log out/diagnostics-bundle/self-heal/ 2>/dev/null || true
          cp -f out/tayvoriq-review-state.json out/diagnostics-bundle/ 2>/dev/null || true
          cp -f out/recovery-checkpoint/meta.json out/diagnostics-bundle/recovery-checkpoint-meta.json 2>/dev/null || true
          python - <<'PY'
          import shutil
          from pathlib import Path
          try:
              import tayvoriq_resume_existing_render as resume
              candidates = resume.rendered_candidates(Path('out/tayvoriq-youtube-tiktok'))
          except Exception:
              candidates = []
          if candidates:
              job_dir, _ = candidates[0]
              target = Path('out/diagnostics-bundle/job')
              for path in job_dir.iterdir():
                  if path.is_file() and path.suffix.casefold() == '.json':
                      shutil.copy2(path, target / path.name)
              for platform in ('youtube_shorts', 'tiktok'):
                  source = job_dir / platform
                  if not source.is_dir():
                      continue
                  platform_target = target / platform
                  platform_target.mkdir(parents=True, exist_ok=True)
                  for path in source.iterdir():
                      if path.is_file() and path.suffix.casefold() == '.json':
                          shutil.copy2(path, platform_target / path.name)
          PY

      - name: Upload lean diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-x-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: implementation/out/diagnostics-bundle/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
