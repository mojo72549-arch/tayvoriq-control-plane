name: TAYVORIQ-X Golden Path

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Freigegebenes Thema
        required: false
        type: string
      trend_id:
        description: Freigegebene Trend-ID
        required: false
        type: string
  repository_dispatch:
    types: [tayvoriq_trend_approved]
  push:
    branches: [main]
    paths:
      - .github/run-now/tayvoriq-x-request.json

permissions:
  contents: write
  actions: write

concurrency:
  group: tayvoriq-x-golden-path
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
  TAYVORIQ_CONTROL_PLANE_SCHEMA: "x-v3"
  TAYVORIQ_EXECUTION_BACKEND: "github_hosted_public"
  TAYVORIQ_CLOUD_MODE: "true"
  TAYVORIQ_RENDER_SIZE: "1080x1920"
  TAYVORIQ_TTS_PROVIDER: "chatterbox_v3"
  TAYVORIQ_CHATTERBOX_ENABLED: "true"
  TAYVORIQ_CHATTERBOX_REQUIRED: "true"
  TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
  TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
  TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "300"
  TAYVORIQ_CHATTERBOX_MAX_CHUNKS: "2"
  TAYVORIQ_CHATTERBOX_MAX_CHARS: "520"
  TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
  TAYVORIQ_CHATTERBOX_EXAGGERATION: "0.42"
  TAYVORIQ_CHATTERBOX_CFG_WEIGHT: "0.36"
  TAYVORIQ_CHATTERBOX_PAUSE_MS: "360"
  TAYVORIQ_NATURAL_VOICE_WPM: "132"
  TAYVORIQ_NARRATOR_PITCH_FACTOR: "0.90"
  TAYVORIQ_NARRATOR_TONE_REQUIRED: "true"
  TAYVORIQ_RENDER_TIMEOUT_SECONDS: "900"
  TAYVORIQ_EDGE_RECOVERY_TIMEOUT_SECONDS: "900"
  TAYVORIQ_AUDIT_TIMEOUT_SECONDS: "210"
  TAYVORIQ_AUDIT_RETRY_DELAYS: "0,12,30"
  TAYVORIQ_CONTROLLER_TIMEOUT_SECONDS: "2700"
  TAYVORIQ_LOCAL_QUALITY_REPAIR_ATTEMPTS: "2"
  TAYVORIQ_APPROVED_TREND_PINNED: "true"
  TAYVORIQ_TELEGRAM_PROGRESS: "false"
  TAYVORIQ_SOURCE_CONTEXT_FILE: ${{ github.workspace }}/tayvoriq-source-context.json
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic || 'KI-Boom kippt – warum Tech-Aktien plötzlich abstürzen' }}
  TREND_ID: ${{ github.event.inputs.trend_id || github.event.client_payload.trend_id || '1' }}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate hosted execution contract
        shell: bash
        env:
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT_VALUE" = "github-hosted" || { echo "RUNNER_CONTRACT_FAILED: GitHub-hosted runner required"; exit 1; }
          test "$RUNNER_OS_VALUE" = "Linux" || { echo "RUNNER_CONTRACT_FAILED: Linux required"; exit 1; }
          test "$RUNNER_ARCH_VALUE" = "X64" || { echo "RUNNER_CONTRACT_FAILED: X64 required"; exit 1; }
          for command in python git curl; do
            command -v "$command" >/dev/null || { echo "RUNNER_CONTRACT_FAILED: missing $command"; exit 1; }
          done
          python - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 11):
              raise SystemExit(f"RUNNER_CONTRACT_FAILED: Python 3.11 required, got {sys.version}")
          PY
          mkdir -p "$HF_HOME" "$TORCH_HOME"
          df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 { if ($4 < 12582912) { print "RUNNER_CONTRACT_FAILED: less than 12 GiB free"; exit 1 } }'

      - name: Validate single X control-plane request contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          workflow = ".github/workflows/tayvoriq-deliver-video-now.yml"
          workflow_files = list(Path('.github/workflows').glob('*.yml')) + list(Path('.github/workflows').glob('*.yaml'))
          x_owners = []
          for path in workflow_files:
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'name: TAYVORIQ-X Golden Path' in text:
                  x_owners.append(str(path))
          if x_owners != [workflow]:
              raise SystemExit(f"CONTROL_PLANE_SINGLE_OWNER_FAILED: expected={[workflow]!r} actual={x_owners!r}")

          if os.environ.get('EVENT_NAME') == 'push':
              path = Path('.github/run-now/tayvoriq-x-request.json')
              if not path.is_file():
                  raise SystemExit('CONTROL_PLANE_REQUEST_MISSING')
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('request') != 'tayvoriq-x-production':
                  raise SystemExit('CONTROL_PLANE_REQUEST_TYPE_FAILED')
              if data.get('workflow') != workflow:
                  raise SystemExit('CONTROL_PLANE_WORKFLOW_BINDING_FAILED')
              if data.get('approved_trend_pinned') is not True:
                  raise SystemExit('CONTROL_PLANE_APPROVAL_PIN_FAILED')
              if str(data.get('topic') or '').strip() != str(os.environ.get('TOPIC') or '').strip():
                  raise SystemExit('CONTROL_PLANE_TOPIC_BINDING_FAILED')
              if str(data.get('trend_id') or '').strip() != str(os.environ.get('TREND_ID') or '').strip():
                  raise SystemExit('CONTROL_PLANE_TREND_BINDING_FAILED')
              hardening = data.get('hardening')
              required = (
                  'checkpoint_source_context_required',
                  'platform_specific_cta_required',
                  'platform_specific_voice_repair_required',
                  'validated_voice_candidate_required',
                  'premium_voice_required',
                  'concrete_failure_state_required',
              )
              if not isinstance(hardening, dict) or any(hardening.get(key) is not True for key in required):
                  raise SystemExit('CONTROL_PLANE_HARDENING_CONTRACT_FAILED')
              if hardening.get('quality_gates_weakened') is not False:
                  raise SystemExit('CONTROL_PLANE_QUALITY_GATE_INTEGRITY_FAILED')
              nonce = str(data.get('request_nonce') or '').strip()
              if len(nonce) < 12:
                  raise SystemExit('CONTROL_PLANE_REQUEST_NONCE_FAILED')
          print('TAYVORIQ_X_CONTROL_PLANE_CONTRACT_PASSED')
          PY

      - name: Materialize immutable verified source context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          trend_id = str(os.environ.get("TREND_ID") or "").strip()
          if not trend_id:
              raise SystemExit("SOURCE_CONTEXT_MISSING: approved trend id is empty")

          candidates = []
          for path in Path("requests").glob("*.json"):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if str(data.get("trend_id") or "").strip() != trend_id:
                  continue
              if str(data.get("mode") or "").strip() != "full":
                  continue
              if str(data.get("status") or "").upper() not in {"DISPATCHING", "DISPATCHED"}:
                  continue
              source = data.get("source_context")
              if not isinstance(source, dict) or not source:
                  continue
              approved = str(data.get("approved_at") or "")
              try:
                  stamp = datetime.fromisoformat(approved.replace("Z", "+00:00")).timestamp()
              except Exception:
                  stamp = 0.0
              candidates.append((stamp, path, data, source))

          if not candidates:
              raise SystemExit(f"SOURCE_CONTEXT_MISSING: no verified full request exists for trend_id={trend_id}")

          _, request_path, data, source = max(candidates, key=lambda item: item[0])
          raw = json.dumps(source, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          digest = hashlib.sha256(raw).hexdigest()
          expected = str(data.get("source_context_sha256") or "").strip()
          if not expected or digest != expected:
              raise SystemExit(f"SOURCE_CONTEXT_INTEGRITY_FAILED: expected={expected!r} actual={digest}")

          sources = source.get("sources")
          answers = source.get("fallback_editorial_answers")
          required_answers = ("what_happened","why_happening","who_is_affected","personal_impact","action_now")
          if not isinstance(sources, list) or len(sources) < 2:
              raise SystemExit("SOURCE_CONTEXT_QUALITY_FAILED: at least two sources are required")
          if int(source.get("independent_news_count") or 0) < 2:
              raise SystemExit("SOURCE_CONTEXT_QUALITY_FAILED: independent_news_count must be >= 2")
          if not isinstance(answers, dict) or any(not str(answers.get(key) or "").strip() for key in required_answers):
              raise SystemExit("SOURCE_CONTEXT_QUALITY_FAILED: complete five-answer evidence is required")
          for index, item in enumerate(sources, start=1):
              if not isinstance(item, dict):
                  raise SystemExit(f"SOURCE_CONTEXT_QUALITY_FAILED: source {index} is not structured")
              if not str(item.get("publisher") or "").strip():
                  raise SystemExit(f"SOURCE_CONTEXT_QUALITY_FAILED: source {index} has no publisher")
              if not str(item.get("url") or "").strip().startswith(("https://", "http://")):
                  raise SystemExit(f"SOURCE_CONTEXT_QUALITY_FAILED: source {index} has no valid URL")
              if not str(item.get("supports") or "").strip():
                  raise SystemExit(f"SOURCE_CONTEXT_QUALITY_FAILED: source {index} has no claim support")

          target = Path(os.environ["TAYVORIQ_SOURCE_CONTEXT_FILE"])
          target.write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"source_context":"verified-and-materialized","request_id":data.get("request_id"),"request_file":str(request_path),"trend_id":trend_id,"source_count":len(sources),"independent_news_count":source.get("independent_news_count"),"sha256":digest,"quality_gates_weakened":False}, ensure_ascii=False))
          PY

      - name: Validate secrets and notify production start
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID PEXELS_API_KEY GROQ_API_KEY GEMINI_API_KEY; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done
          message=$(printf '🟣 TAYVORIQ Produktion gestartet\n\nThema: %s\n\nFür dich: ✅ Keine Aktion nötig.' "$TOPIC")
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${message}")
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") and d.get("result",{}).get("message_id"), d' "$response"

      - name: Checkout implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Record immutable production manifest
        run: |
          set -euo pipefail
          mkdir -p implementation/out/control-plane
          CONTROL_SHA=$(git rev-parse HEAD)
          IMPLEMENTATION_SHA=$(git -C implementation rev-parse HEAD)
          PAGES_SHA=$(git -C pages-worktree rev-parse HEAD)
          SOURCE_SHA=$(sha256sum "$TAYVORIQ_SOURCE_CONTEXT_FILE" | awk '{print $1}')
          REQUEST_NONCE=$(python -c 'import json,pathlib; p=pathlib.Path(".github/run-now/tayvoriq-x-request.json"); print((json.loads(p.read_text()).get("request_nonce") if p.exists() else "") or "")')
          python - "$CONTROL_SHA" "$IMPLEMENTATION_SHA" "$PAGES_SHA" "$SOURCE_SHA" "$REQUEST_NONCE" <<'PY'
          import json, os, pathlib, sys
          payload = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "topic": os.environ.get("TOPIC"),
              "trend_id": os.environ.get("TREND_ID"),
              "control_plane_schema": os.environ.get("TAYVORIQ_CONTROL_PLANE_SCHEMA"),
              "control_plane_sha": sys.argv[1],
              "implementation_sha": sys.argv[2],
              "review_pages_sha": sys.argv[3],
              "source_context_sha256": sys.argv[4],
              "request_nonce": sys.argv[5],
              "implementation_branch": "feature/multi-platform-distribution-package",
              "execution_backend": os.environ.get("TAYVORIQ_EXECUTION_BACKEND"),
              "approved_trend_pinned": True,
              "source_context_bound": True,
              "single_x_owner": True,
              "quality_gates_weakened": False,
          }
          pathlib.Path("implementation/out/control-plane/production-manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False))
          PY

      - name: Install production dependencies
        run: |
          set -euo pipefail
          missing=()
          for command in ffmpeg ffprobe rsync git; do
            command -v "$command" >/dev/null || missing+=("$command")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg rsync git
          fi
          python -m pip install --upgrade pip -q
          python -m pip install -r implementation/requirements.txt pytest -q
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0" -q
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948" -q

      - name: Preflight
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m compileall -q tools src runtime_patches
          python tools/tayvoriq_preflight_check.py --report-out out/control-plane/preflight.json

      - name: Produce approved video with bounded checkpoint recovery
        id: production
        working-directory: implementation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/tayvoriq-self-heal
          set +e
          python tools/tayvoriq_autonomous_entrypoint.py \
            --trend-mode approved_trend \
            --trend-scope auto_scope \
            --topic "${TOPIC}" \
            --language Deutsch \
            --platform youtube_tiktok \
            --target-duration 35 \
            --llm-provider auto \
            --outdir out/tayvoriq-youtube-tiktok \
            --site-root site/tayvoriq \
            --run-id "${GITHUB_RUN_ID}" \
            --state-out out/tayvoriq-review-state.json \
            --report-out out/tayvoriq-self-heal/report.json \
            --request-out out/tayvoriq-self-heal/request.json \
            --max-runtime-attempts 1 \
            --self-heal-depth 0 \
            --target-branch feature/multi-platform-distribution-package \
            2>&1 | tee out/tayvoriq-self-heal/controller-console.log
          process_exit=${PIPESTATUS[0]}
          set -e
          state=$(python -c 'import json,pathlib; p=pathlib.Path("out/tayvoriq-self-heal/report.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get("state") or "TECHNICAL_FAILURE")')

          if [ "$state" != "SUCCESS" ]; then
            echo "=== X checkpoint recovery: preserve render, source evidence and platform variants ==="
            set +e
            python tools/tayvoriq_resume_existing_render_v2.py \
              --outdir out/tayvoriq-youtube-tiktok \
              --site-root site/tayvoriq \
              --run-id "${GITHUB_RUN_ID}" \
              --state-out out/tayvoriq-review-state.json \
              --report-out out/tayvoriq-self-heal/report.json \
              2>&1 | tee out/tayvoriq-self-heal/checkpoint-resume-console.log
            resume_exit=${PIPESTATUS[0]}
            set -e
            state=$(python -c 'import json,pathlib; p=pathlib.Path("out/tayvoriq-self-heal/report.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get("state") or "PUBLISHABLE_OUTPUT_RETRY_REQUIRED")')
            if [ "$resume_exit" -eq 0 ] && [ "$state" = "SUCCESS" ]; then
              process_exit=0
            else
              process_exit="$resume_exit"
            fi
          fi

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "process_exit=$process_exit" >> "$GITHUB_OUTPUT"
          test "$state" = "SUCCESS" && test "$process_exit" -eq 0

      - name: Validate publication quality
        id: publication_gate
        if: steps.production.outcome == 'success'
        working-directory: implementation
        run: |
          set -euo pipefail
          JOB_DIR=$(python -c 'import json,pathlib; d=json.loads(pathlib.Path("out/tayvoriq-review-state.json").read_text()); print(d.get("job_dir") or "")')
          test -n "$JOB_DIR" && test -d "$JOB_DIR"
          python tools/tayvoriq_publication_quality_gate_v2.py --job-dir "$JOB_DIR" --targets youtube_tiktok

      - name: Publish review page
        id: publish_review
        if: steps.publication_gate.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf pages-worktree/tayvoriq
          mkdir -p pages-worktree/tayvoriq
          rsync -a implementation/site/tayvoriq/ pages-worktree/tayvoriq/
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish TAYVORIQ review ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Send Telegram review
        id: telegram_final
        if: steps.publish_review.outcome == 'success'
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "" \
            --dashboard-url "" \
            --review-id "${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"

      - name: Notify final failure with concrete state
        if: failure()
        working-directory: implementation
        run: |
          set +e
          readarray -t failure_info < <(python - <<'PY'
          import json
          from pathlib import Path
          report_path = Path("out/tayvoriq-self-heal/report.json")
          preflight_path = Path("out/control-plane/preflight.json")
          report = {}
          if report_path.exists():
              try: report = json.loads(report_path.read_text(encoding="utf-8"))
              except Exception: report = {}
          state = str(report.get("state") or "")
          reason = " ".join(str(report.get("reason") or "").split())[:900]
          scopes = report.get("repair_target_stages")
          if not state and preflight_path.exists():
              try: preflight = json.loads(preflight_path.read_text(encoding="utf-8"))
              except Exception: preflight = {}
              state = str(preflight.get("state") or "")
              issues = preflight.get("issues") or []
              if issues: reason = "; ".join(str(item) for item in issues[:3])
          print(state or "TECHNICAL_FAILURE")
          print(reason)
          print(", ".join(str(item) for item in scopes) if isinstance(scopes, list) else "")
          PY
          )
          state="${failure_info[0]:-TECHNICAL_FAILURE}"
          detail="${failure_info[1]:-}"
          scopes="${failure_info[2]:-}"
          headline="❌ TAYVORIQ Produktion konnte nicht abgeschlossen werden"
          case "$state" in
            PREFLIGHT_FAILED) reason="Die Produktionssicherheit hat vor dem Render einen internen Vertragsfehler erkannt. ${detail} Es wurde nichts veröffentlicht." ;;
            SKIPPED_NO_PUBLISHABLE_TREND|CONTENT_REJECTED) reason="Das Video hat ein unverändertes Qualitäts- oder Fakten-Gate nicht bestanden. ${detail} Es wurde nichts veröffentlicht." ;;
            PUBLISHABLE_OUTPUT_RETRY_REQUIRED) headline="🔧 TAYVORIQ Reparaturmodus"; reason="Der vorhandene Master bleibt erhalten, hat aber noch nicht alle strengen Gates bestanden. Reparaturziel: ${scopes:-unbekannt}. ${detail} Es wurde nichts veröffentlicht." ;;
            *) reason="Die Produktion konnte technisch nicht sicher abgeschlossen werden. ${detail} Es wurde nichts veröffentlicht." ;;
          esac
          message=$(printf '%s\n\n%s' "$headline" "$reason")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${message}" >/dev/null

      - name: Upload diagnostics and preserved candidates
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-x-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            implementation/out/**
            implementation/site/tayvoriq/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1
