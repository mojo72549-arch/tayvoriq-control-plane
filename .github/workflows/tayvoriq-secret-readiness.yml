name: TAYVORIQ Secret Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-secret-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - name: Validate required production secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID PEXELS_API_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ -z "${GEMINI_API_KEY:-}" ] && [ -z "${GROQ_API_KEY:-}" ] && [ -z "${HF_TOKEN:-}" ]; then
            missing+=("ONE_OF_GEMINI_API_KEY_GROQ_API_KEY_HF_TOKEN")
          fi

          if [ -z "${YOUTUBE_API_KEY:-}" ]; then
            for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
              if [ -z "${!name:-}" ]; then
                missing+=("$name")
              fi
            done
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error title=Missing production secrets::%s\n' "$(IFS=,; echo "${missing[*]}")"
            exit 1
          fi

          echo "All required TAYVORIQ production secrets are configured." >> "$GITHUB_STEP_SUMMARY"
