name: TAYVORIQ Request Continuity Watchdog

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - TAYVORIQ-X Golden Path
      - TAYVORIQ Production Green Promoter
      - TAYVORIQ Deterministic Codefix Continuity
      - TAYVORIQ Delivery Watch
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: read
  contents: read

# Observer only. This workflow never retries, dispatches, cancels, mutates request
# state, or claims recovery ownership. The Agent Orchestrator is the sole lifecycle
# decision owner; this watchdog only exposes evidence for diagnosis/failsafe checks.
concurrency:
  group: tayvoriq-request-continuity-watchdog
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ACTIVE_REQUEST_POINTER: .github/state/tayvoriq-active-production-request.json
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Observe canonical active request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          pointer_path = Path('.github/state/tayvoriq-active-production-request.json')
          if not pointer_path.is_file():
              print('WATCHDOG:NO_ACTIVE_POINTER')
              raise SystemExit(0)

          try:
              pointer = json.loads(pointer_path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'WATCHDOG:ACTIVE_POINTER_INVALID:{exc}')
              raise SystemExit(0)

          request_id = str(pointer.get('request_id') or '').strip()
          run_id = int(pointer.get('golden_path_run_id') or 0)
          state = str(pointer.get('state') or '').strip()
          generation = int(pointer.get('recovery_generation') or 0)
          request_path = Path('requests') / f'{request_id}.json' if request_id else None
          request_status = ''
          request_substate = ''
          if request_path and request_path.is_file():
              try:
                  request = json.loads(request_path.read_text(encoding='utf-8'))
                  request_status = str(request.get('status') or '')
                  request_substate = str(request.get('request_substate') or '')
              except Exception:
                  request_status = 'INVALID_JSON'

          print(json.dumps({
              'observer':'tayvoriq-request-continuity-watchdog',
              'decision_owner':'tayvoriq-agent-orchestrator-v2',
              'active_state':state,
              'request_id':request_id,
              'golden_path_run_id':run_id,
              'recovery_generation':generation,
              'request_status':request_status,
              'request_substate':request_substate,
              'action':'OBSERVE_ONLY'
          }, ensure_ascii=False))
          PY

      - name: Observe referenced Golden Path run
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.github/state/tayvoriq-active-production-request.json')
          try:
              d=json.loads(p.read_text(encoding='utf-8')) if p.is_file() else {}
              print(int(d.get('golden_path_run_id') or 0))
          except Exception:
              print(0)
          PY
          )
          if [ "$run_id" = "0" ]; then
            echo 'WATCHDOG:NO_REFERENCED_RUN'
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            --jq '{id,name,status,conclusion,event,head_sha,updated_at}' || true

      - name: Record observer contract
        run: |
          {
            echo '### TAYVORIQ Watchdog'
            echo '- Mode: **observer only**'
            echo '- Decision owner: **TAYVORIQ Agent Orchestrator V2**'
            echo '- Mutations: **none**'
            echo '- Recovery dispatch: **none**'
            echo '- Run cancellation: **none**'
          } >> "$GITHUB_STEP_SUMMARY"
