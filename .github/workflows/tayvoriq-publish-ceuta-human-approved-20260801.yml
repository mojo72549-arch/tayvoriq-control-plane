name: TAYVORIQ Publish Human-Approved Ceuta 2026-08-01

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-publish-ceuta-human-approved-20260801.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tayvoriq-publish-ceuta-human-approved-20260801
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  REVIEW_RUN_ID: "30712536166"
  APPROVAL_RECORD: ".automation/tayvoriq-control-reviews/30712536166.json"
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_CATEGORY_ID: "28"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  publish-human-approved-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout control plane approval record
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout publishing implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Install publishing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r implementation/requirements.txt -q

      - name: Download approved control review artifact
        uses: actions/download-artifact@v4
        with:
          name: tayvoriq-control-review-${{ env.REVIEW_RUN_ID }}
          path: approved-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.REVIEW_RUN_ID }}

      - name: Locate approved Ceuta job
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          jobs=[]
          for item in Path('approved-artifact').rglob('job.json'):
              root=item.parent
              if (root/'short_youtube.mp4').is_file() and (root/'short_tiktok.mp4').is_file():
                  jobs.append(root.resolve())
          if len(jobs) != 1:
              raise SystemExit(f'expected exactly one complete job, found={len(jobs)}')
          job=jobs[0]
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write(f'TAYVORIQ_APPROVED_JOB_DIR={job}\n')
          print({'approved_job_dir':str(job)})
          PY

      - name: Strict explicit-human-approval publication gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def load(path: Path):
              if not path.is_file():
                  raise SystemExit(f'missing required proof: {path}')
              return json.loads(path.read_text(encoding='utf-8'))

          def sha256(path: Path) -> str:
              h=hashlib.sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda: fh.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          approval=load(Path(os.environ['APPROVAL_RECORD']))
          job_dir=Path(os.environ['TAYVORIQ_APPROVED_JOB_DIR'])
          job=load(job_dir/'job.json')
          private_gate=load(job_dir/'private-review-gate.json')
          quality=load(job_dir/'youtube_shorts'/'quality_report.json')
          audio=load(job_dir/'youtube_shorts'/'audio_report.json')
          youtube=job_dir/'short_youtube.mp4'
          tiktok=job_dir/'short_tiktok.mp4'

          issues=[]
          if str(approval.get('status')).upper() != 'APPROVED': issues.append('approval-not-approved')
          if str(approval.get('review_id')) != os.environ['REVIEW_RUN_ID']: issues.append('approval-review-id-mismatch')
          if int(approval.get('telegram_message_id') or 0) != 186: issues.append('telegram-message-proof-mismatch')
          if approval.get('youtube_privacy') != 'public': issues.append('approval-not-public')
          if str(job.get('render_status')).upper() != 'DONE': issues.append('render-not-done')
          if (job.get('quality_report') or {}).get('passed') is not True: issues.append('top-level-quality-failed')
          shared=job.get('shared_master_render') or {}
          if shared.get('enabled') is not True or int(shared.get('render_count') or 0) != 1: issues.append('shared-master-contract-failed')
          verified=(private_gate.get('verified_local_package') or {})
          if private_gate.get('private_telegram_review_allowed') is not True: issues.append('private-review-not-allowed')
          if private_gate.get('youtube_requires_explicit_telegram_approval') is not True: issues.append('explicit-approval-not-required')
          if verified.get('local_quality_passed') is not True: issues.append('local-quality-proof-failed')
          if verified.get('shared_master_proof') != 'identical_sha256': issues.append('shared-master-proof-missing')
          if quality.get('passed') is not True or quality.get('issues'): issues.append('youtube-quality-report-failed')
          post_audio=audio.get('post_audio_quality_gate') or {}
          if post_audio.get('passed') is not True: issues.append('audio-quality-gate-failed')
          if not youtube.is_file() or youtube.stat().st_size < 100000: issues.append('youtube-video-invalid')
          if not tiktok.is_file() or tiktok.stat().st_size < 100000: issues.append('tiktok-video-invalid')

          youtube_hash=sha256(youtube) if youtube.is_file() else ''
          tiktok_hash=sha256(tiktok) if tiktok.is_file() else ''
          expected_youtube=(((verified.get('videos') or {}).get('youtube_shorts') or {}).get('sha256') or '')
          expected_tiktok=(((verified.get('videos') or {}).get('tiktok') or {}).get('sha256') or '')
          if not youtube_hash or youtube_hash != tiktok_hash: issues.append('platform-video-hash-mismatch')
          if youtube_hash != expected_youtube or tiktok_hash != expected_tiktok: issues.append('stored-hash-proof-mismatch')

          prior=job_dir/'publish_result.json'
          if prior.is_file():
              payload=load(prior)
              prior_url=(((payload.get('results') or {}).get('youtube_shorts') or {}).get('url') or '')
              if prior_url:
                  raise SystemExit(f'already-published:{prior_url}')

          report={
              'passed':not issues,
              'review_run_id':os.environ['REVIEW_RUN_ID'],
              'approval_source':approval.get('source'),
              'telegram_message_id':approval.get('telegram_message_id'),
              'local_quality_passed':verified.get('local_quality_passed'),
              'audio_gate_passed':post_audio.get('passed'),
              'shared_master_sha256':youtube_hash,
              'issues':issues,
              'public_upload_authorized':not issues,
              'external_ai_audit_status':private_gate.get('external_ai_audit'),
              'human_override_scope':'this explicitly approved review only',
          }
          (job_dir/'human_approval_publication_gate.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if issues:
              raise SystemExit('human approval publication gate failed: '+','.join(issues))
          PY

      - name: Publish approved YouTube video publicly
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          python tools/tayvoriq_publish_approved.py \
            --job-dir "$TAYVORIQ_APPROVED_JOB_DIR" \
            --approval FREIGEBEN \
            --targets youtube \
            --youtube-privacy public \
            --tiktok-mode draft_upload \
            --tiktok-privacy SELF_ONLY

      - name: Send final publication result to Telegram
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib import parse, request
          token=os.environ.get('TELEGRAM_BOT_TOKEN','').strip()
          chat=os.environ.get('TELEGRAM_CHAT_ID','').strip()
          job=Path(os.environ.get('TAYVORIQ_APPROVED_JOB_DIR','.'))
          result_path=job/'publish_result.json'
          result=json.loads(result_path.read_text(encoding='utf-8')) if result_path.exists() else {}
          youtube=(result.get('results') or {}).get('youtube_shorts') or {}
          errors=result.get('errors') or {}
          if youtube.get('url'):
              text=(
                  '✅ Ceuta-Video erfolgreich veröffentlicht\n\n'
                  f"YouTube: {youtube.get('url')}\n"
                  'Sichtbarkeit: Public\n\n'
                  'TikTok bleibt manuell.'
              )
          else:
              text='❌ Ceuta-Veröffentlichung fehlgeschlagen\n\n'+(' | '.join(str(v) for v in errors.values()) or 'Kein YouTube-Ergebnis vorhanden.')
          data=parse.urlencode({'chat_id':chat,'text':text,'disable_web_page_preview':'false'}).encode()
          with request.urlopen(f'https://api.telegram.org/bot{token}/sendMessage',data=data,timeout=35) as response:
              payload=json.loads(response.read().decode())
          if not payload.get('ok'):
              raise SystemExit(payload)
          print({'telegram_result_message_id':payload['result']['message_id'],'youtube_url':youtube.get('url')})
          PY

      - name: Upload publication proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-ceuta-human-approved-publish-${{ github.run_id }}
          path: |
            approved-artifact/**/human_approval_publication_gate.json
            approved-artifact/**/publish_result.json
          if-no-files-found: warn
          retention-days: 30
