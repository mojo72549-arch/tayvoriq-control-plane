name: TAYVORIQ Deep Fire Render Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-deep-fire-render-diagnostics.yml"

permissions:
  actions: read
  contents: read

jobs:
  render-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TAYVORIQ_TTS_PROVIDER: "chatterbox_v3"
      TAYVORIQ_CHATTERBOX_ENABLED: "true"
      TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
      TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
      TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "600"
      TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
      TAYVORIQ_CHATTERBOX_EXAGGERATION: "0.30"
      TAYVORIQ_CHATTERBOX_CFG_WEIGHT: "0.42"
      TAYVORIQ_CHATTERBOX_NATURAL_PAUSE_MS: "480"
      TAYVORIQ_CHATTERBOX_MAX_CHUNKS: "3"
      TAYVORIQ_CHATTERBOX_MAX_CHARS: "480"
      TAYVORIQ_NATURAL_VOICE_WPM: "128"
      TAYVORIQ_NATURAL_VOICE_MIN_SECONDS: "58"
      TAYVORIQ_NATURAL_VOICE_MAX_SECONDS: "68"
      TAYVORIQ_DOCUMENTARY_TARGET_F0_HZ: "112"
      TAYVORIQ_AUDIO_END_PADDING_SECONDS: "1.25"
      TAYVORIQ_RENDER_SIZE: "1080x1920"
      TAYVORIQ_CHATTERBOX_REFERENCE_AUDIO: ${{ github.workspace }}/implementation/reference/deep_documentary_reference.wav
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TORCH_HOME: ${{ github.workspace }}/.cache/torch

    steps:
      - name: Checkout diagnostics
        uses: actions/checkout@v4

      - name: Checkout private documentary fix
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: fix/deep-documentary-fire-safety-v29
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Restore Chatterbox cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: tayvoriq-deep-documentary-chatterbox-whisper-py311-v1

      - name: Install render dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q rubberband
          python -m pip install --upgrade pip
          python -m pip install -r implementation/requirements.txt pytest
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0"
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948"

      - name: Download prior Chatterbox voice
        uses: actions/download-artifact@v4
        with:
          name: tayvoriq-review-30277119576
          path: previous-review
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: mojo72549-arch/tayvoriq-control-plane
          run-id: 30277119576

      - name: Build deep anonymous reference
        run: |
          set -euo pipefail
          SOURCE=$(find previous-review -type f -name 'voice_chatterbox_raw.wav' | head -n 1)
          test -n "$SOURCE" && test -f "$SOURCE"
          mkdir -p implementation/reference
          ffmpeg -y -loglevel error -ss 1.0 -t 15.0 -i "$SOURCE" \
            -af "rubberband=pitch=0.84:transients=smooth:detector=soft:phase=laminar,highpass=f=55,bass=g=2.5:f=120:w=0.7,treble=g=-1:f=4800:w=0.5,acompressor=threshold=-20dB:ratio=2:attack=20:release=250,loudnorm=I=-16:TP=-1.5:LRA=10" \
            -ac 1 -ar 24000 -c:a pcm_s16le \
            implementation/reference/deep_documentary_reference.wav

      - name: Run render and preserve every diagnostic
        id: render
        working-directory: implementation
        shell: bash
        run: |
          set +e
          mkdir -p out/deep-fire-safety-review
          python tools/tayvoriq_fire_safety_documentary_v2.py \
            --out-dir "$PWD/out/deep-fire-safety-review" \
            2>&1 | tee out/deep-fire-safety-review/render-diagnostics.log
          status=${PIPESTATUS[0]}
          printf 'render_status=%s\n' "$status" | tee out/deep-fire-safety-review/render-status.txt
          find out/deep-fire-safety-review -maxdepth 3 -type f -printf '%p %s bytes\n' \
            | sort | tee out/deep-fire-safety-review/file-inventory.txt
          exit 0

      - name: Upload render diagnostics regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-fire-render-diagnostics-${{ github.run_id }}
          path: |
            implementation/out/deep-fire-safety-review/**
            implementation/reference/deep_documentary_reference.wav
          if-no-files-found: error
          retention-days: 7

      - name: Enforce render result after evidence upload
        working-directory: implementation
        run: |
          set -euo pipefail
          source out/deep-fire-safety-review/render-status.txt
          test "$render_status" = "0"
