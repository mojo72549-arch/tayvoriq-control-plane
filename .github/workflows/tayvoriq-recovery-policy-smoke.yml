name: TAYVORIQ Recovery Policy Smoke

on:
  pull_request:
    paths:
      - tools/tayvoriq_recovery_policy_v1.py
      - tests/test_tayvoriq_recovery_policy_v1.py
      - tests/test_tayvoriq_recovery_policy_external_hardening.py
      - tests/test_tayvoriq_request_continuity_latest_request_v2.py
      - .github/workflows/tayvoriq-agent-orchestrator-v2.yml
      - .github/workflows/tayvoriq-delivery-watch.yml
      - .github/workflows/tayvoriq-request-continuity-watchdog.yml
      - tools/tayvoriq_telegram_progress_v1.py
      - tools/tayvoriq_telegram_progress_notification_policy_v2.py
      - state/tayvoriq-notification-policy.json
      - tests/test_tayvoriq_telegram_progress_v1.py
      - tests/test_tayvoriq_telegram_progress_v2.py
      - .github/workflows/tayvoriq-telegram-progress-smoke.yml
      - .github/workflows/tayvoriq-recovery-policy-smoke.yml
  push:
    branches: [main]
    paths:
      - tools/tayvoriq_recovery_policy_v1.py
      - tests/test_tayvoriq_recovery_policy_v1.py
      - tests/test_tayvoriq_recovery_policy_external_hardening.py
      - tests/test_tayvoriq_request_continuity_latest_request_v2.py
      - .github/workflows/tayvoriq-agent-orchestrator-v2.yml
      - .github/workflows/tayvoriq-delivery-watch.yml
      - .github/workflows/tayvoriq-request-continuity-watchdog.yml
      - tools/tayvoriq_telegram_progress_v1.py
      - tools/tayvoriq_telegram_progress_notification_policy_v2.py
      - state/tayvoriq-notification-policy.json
      - tests/test_tayvoriq_telegram_progress_v1.py
      - tests/test_tayvoriq_telegram_progress_v2.py
      - .github/workflows/tayvoriq-telegram-progress-smoke.yml
      - .github/workflows/tayvoriq-recovery-policy-smoke.yml

permissions:
  contents: read

jobs:
  recovery-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile recovery policy
        run: |
          python -m py_compile \
            tools/tayvoriq_recovery_policy_v1.py \
            tests/test_tayvoriq_recovery_policy_v1.py \
            tests/test_tayvoriq_recovery_policy_external_hardening.py \
            tests/test_tayvoriq_request_continuity_latest_request_v2.py
      - name: Run recovery policy regressions
        run: |
          python -m pip install pytest pyyaml -q
          python -m pytest -q \
            tests/test_tayvoriq_recovery_policy_v1.py \
            tests/test_tayvoriq_recovery_policy_external_hardening.py \
            tests/test_tayvoriq_request_continuity_latest_request_v2.py
      - name: Parse recovery workflows as YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in (
              '.github/workflows/tayvoriq-agent-orchestrator-v2.yml',
              '.github/workflows/tayvoriq-delivery-watch.yml',
              '.github/workflows/tayvoriq-request-continuity-watchdog.yml',
          ):
              data = yaml.safe_load(Path(name).read_text(encoding='utf-8'))
              assert isinstance(data, dict) and data.get('jobs'), name
          print('RECOVERY_WORKFLOW_YAML_VALID')
          PY
      - name: Assert orchestrator-owned bounded recovery invariants
        run: |
          set -euo pipefail
          grep -q 'MAX_RECOVERY_GENERATIONS: "4"' .github/workflows/tayvoriq-delivery-watch.yml
          grep -q 'lifecycle-controller:' .github/workflows/tayvoriq-agent-orchestrator-v2.yml
          grep -q 'Enforce single active executor' .github/workflows/tayvoriq-agent-orchestrator-v2.yml
          grep -q 'tayvoriq-deterministic-codefix-continuity.yml' .github/workflows/tayvoriq-agent-orchestrator-v2.yml
          grep -q 'tayvoriq-delivery-watch.yml' .github/workflows/tayvoriq-agent-orchestrator-v2.yml
          grep -q 'actions: read' .github/workflows/tayvoriq-request-continuity-watchdog.yml
          grep -q "action':'OBSERVE_ONLY'" .github/workflows/tayvoriq-request-continuity-watchdog.yml
          ! grep -q 'gh workflow run' .github/workflows/tayvoriq-request-continuity-watchdog.yml
          ! grep -q '/cancel' .github/workflows/tayvoriq-request-continuity-watchdog.yml
          ! grep -q 'actions: write' .github/workflows/tayvoriq-request-continuity-watchdog.yml

  telegram-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Telegram progress policy
        run: |
          python -m py_compile \
            tools/tayvoriq_telegram_progress_v1.py \
            tools/tayvoriq_telegram_progress_notification_policy_v2.py \
            tests/test_tayvoriq_telegram_progress_v1.py \
            tests/test_tayvoriq_telegram_progress_v2.py
      - name: Run Telegram progress regressions
        run: |
          python -m pip install pytest -q
          python -m pytest -q \
            tests/test_tayvoriq_telegram_progress_v1.py \
            tests/test_tayvoriq_telegram_progress_v2.py
      - name: Assert quiet watchdog contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy=json.loads(Path('state/tayvoriq-notification-policy.json').read_text(encoding='utf-8'))
          assert policy['watchdog_poll_interval_seconds'] == 180
          assert policy['operator_heartbeat_notify_minutes'] == [45]
          assert policy['recovery_replay_suppressed_stages'] == [
              'render_heartbeat', 'checkpoint_repair', 'checkpoint_heartbeat'
          ]
          assert policy['suppress_intermediate_liveness_polls'] is True
          assert policy['internal_recovery_operator_noise_suppressed'] is True
          assert policy['terminal_external_blocker_notification_enabled'] is True
          PY
