name: TAYVORIQ Recovery Generation Truth Contract

on:
  pull_request:
    paths:
      - "tools/sitecustomize.py"
      - "tools/tayvoriq_telegram_generation_truth_guard.py"
      - "tests/test_tayvoriq_telegram_generation_truth_guard.py"
      - ".github/workflows/tayvoriq-recovery-generation-truth-contract.yml"
  push:
    branches: [main]
    paths:
      - "tools/sitecustomize.py"
      - "tools/tayvoriq_telegram_generation_truth_guard.py"
      - "tests/test_tayvoriq_telegram_generation_truth_guard.py"
      - ".github/workflows/tayvoriq-recovery-generation-truth-contract.yml"

permissions:
  contents: read

jobs:
  recovery-generation-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Compile guard
        run: python -m compileall -q tools/sitecustomize.py tools/tayvoriq_telegram_generation_truth_guard.py tests/test_tayvoriq_telegram_generation_truth_guard.py
      - name: Verify stale generation can never be reported as current
        run: python -m pytest -q tests/test_tayvoriq_telegram_generation_truth_guard.py
