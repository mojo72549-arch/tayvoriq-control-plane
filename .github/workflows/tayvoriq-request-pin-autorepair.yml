name: TAYVORIQ Request Pin AutoRepair

on:
  workflow_run:
    workflows:
      - TAYVORIQ-X Golden Path
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed Golden Path run to bind and recover
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: tayvoriq-request-pin-autorepair
  cancel-in-progress: false

jobs:
  bind-owner-and-recover:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve exact source request from failed run snapshot
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          INPUT_RUN_ID: ${{ inputs.run_id || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then RUN_ID="$EVENT_RUN_ID"; else RUN_ID="$INPUT_RUN_ID"; fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::PIN_AUTOREPAIR_RUN_ID_INVALID:$RUN_ID"; exit 1; }

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > /tmp/failed-run.json
          HEAD_SHA=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/failed-run.json',encoding='utf-8'))
          print(str(d.get('head_sha') or ''))
          PY
          )
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::PIN_AUTOREPAIR_HEAD_SHA_INVALID"; exit 1; }
          git cat-file -e "${HEAD_SHA}^{commit}"
          git show "${HEAD_SHA}:.github/run-now/tayvoriq-x-request.json" > /tmp/run-request.json

          python - "$RUN_ID" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          run_id=int(sys.argv[1]); out=Path(sys.argv[2])
          trigger=json.load(open('/tmp/run-request.json',encoding='utf-8'))
          request_id=str(trigger.get('source_request_id') or '').strip()
          topic=' '.join(str(trigger.get('topic') or '').split()).strip()
          trend_id=str(trigger.get('trend_id') or '').strip()
          if not request_id or not topic or trend_id not in {'1','2','3','4','5'}:
              raise SystemExit('PIN_AUTOREPAIR_TRIGGER_CONTRACT_INVALID')
          request_path=Path('requests') / f'{request_id}.json'
          if not request_path.is_file():
              raise SystemExit(f'PIN_AUTOREPAIR_CANONICAL_REQUEST_MISSING:{request_path}')
          canonical=json.loads(request_path.read_text(encoding='utf-8'))
          if str(canonical.get('request_id') or '').strip() != request_id:
              raise SystemExit('PIN_AUTOREPAIR_REQUEST_ID_MISMATCH')
          if ' '.join(str(canonical.get('topic') or '').split()).strip() != topic:
              raise SystemExit('PIN_AUTOREPAIR_TOPIC_MISMATCH')
          if str(canonical.get('trend_id') or '').strip() != trend_id:
              raise SystemExit('PIN_AUTOREPAIR_TREND_MISMATCH')
          with out.open('a',encoding='utf-8') as h:
              h.write(f'run_id={run_id}\n')
              h.write(f'head_sha={canonical.get("head_sha", "")}\n')
              h.write(f'request_id={request_id}\n')
              h.write(f'request_file={request_path}\n')
              h.write(f'topic={topic}\n')
              h.write(f'trend_id={trend_id}\n')
          print({'run_id':run_id,'request_id':request_id,'request_file':str(request_path)})
          PY

      - name: Bind failed run to canonical durable request
        id: bind
        shell: bash
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          REQUEST_ID: ${{ steps.resolve.outputs.request_id }}
          REQUEST_FILE: ${{ steps.resolve.outputs.request_file }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            decision=$(python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path(os.environ['REQUEST_FILE'])
          data=json.loads(path.read_text(encoding='utf-8'))
          if str(data.get('request_id') or '').strip() != os.environ['REQUEST_ID']:
              raise SystemExit('PIN_AUTOREPAIR_IDENTITY_CHANGED')
          failed=int(os.environ['RUN_ID'])
          try: current=int(data.get('golden_path_run_id') or 0)
          except (TypeError, ValueError): current=0
          previous=[]
          for value in data.get('previous_golden_path_run_ids') or []:
              try: previous.append(int(value))
              except (TypeError, ValueError): pass
          if current and current != failed:
              print(f'SUPERSEDED:{current}')
              raise SystemExit(0)
          if current == failed:
              print('ALREADY_BOUND')
              raise SystemExit(0)
          if current and current not in previous: previous.append(current)
          data['previous_golden_path_run_ids']=previous[-20:]
          data['golden_path_run_id']=failed
          data['status']='DISPATCHED'
          data['recovery_owner']='tayvoriq-request-pin-autorepair'
          data['owner_bound_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          history=list(data.get('state_history') or [])
          history.append({
              'state':'DISPATCHED',
              'at':data['owner_bound_at'],
              'actor':'tayvoriq-request-pin-autorepair',
              'meta':{'golden_path_run_id':failed,'reason':'bind-failed-run-before-delivery-watch'},
          })
          data['state_history']=history
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('BOUND')
          PY
            )
            if [[ "$decision" == SUPERSEDED:* ]]; then
              echo "recover=false" >> "$GITHUB_OUTPUT"
              echo "Owner already points at newer run: $decision"
              exit 0
            fi
            if [ "$decision" = "ALREADY_BOUND" ]; then
              echo "recover=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$decision" = "BOUND" ] || { echo "::error::PIN_AUTOREPAIR_DECISION_INVALID:$decision"; exit 1; }
            git add -- "$REQUEST_FILE"
            git commit -m "ops: bind ${REQUEST_ID} to failed run ${RUN_ID}"
            if git push origin HEAD:main; then
              echo "recover=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::PIN_AUTOREPAIR_BIND_PUSH_FAILED"
          exit 1

      - name: Re-enter Delivery Watch after owner binding
        if: steps.bind.outputs.recover == 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          gh workflow run tayvoriq-delivery-watch.yml --ref main -f "run_id=$RUN_ID"
          echo "PIN_AUTOREPAIR_DELIVERY_WATCH_DISPATCHED:$RUN_ID"
