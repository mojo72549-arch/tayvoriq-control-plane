name: TAYVORIQ Deep Fire Safety Review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-deep-fire-safety-review.yml"
      - ".automation/tayvoriq-deep-fire-safety-review.json"

permissions:
  actions: read
  contents: read

concurrency:
  group: tayvoriq-deep-fire-safety-review
  cancel-in-progress: false

jobs:
  render-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TAYVORIQ_TTS_PROVIDER: "chatterbox_v3"
      TAYVORIQ_CHATTERBOX_ENABLED: "true"
      TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
      TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
      TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "600"
      TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
      TAYVORIQ_CHATTERBOX_EXAGGERATION: "0.30"
      TAYVORIQ_CHATTERBOX_CFG_WEIGHT: "0.42"
      TAYVORIQ_CHATTERBOX_NATURAL_PAUSE_MS: "480"
      TAYVORIQ_CHATTERBOX_MAX_CHUNKS: "3"
      TAYVORIQ_CHATTERBOX_MAX_CHARS: "480"
      TAYVORIQ_NATURAL_VOICE_WPM: "128"
      TAYVORIQ_NATURAL_VOICE_MIN_SECONDS: "58"
      TAYVORIQ_NATURAL_VOICE_MAX_SECONDS: "68"
      TAYVORIQ_DOCUMENTARY_TARGET_F0_HZ: "112"
      TAYVORIQ_AUDIO_END_PADDING_SECONDS: "1.25"
      TAYVORIQ_RENDER_SIZE: "1080x1920"
      TAYVORIQ_CHATTERBOX_REFERENCE_AUDIO: ${{ github.workspace }}/implementation/reference/deep_documentary_reference.wav
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID PEXELS_API_KEY; do
            test -n "${!name:-}" || { echo "::error title=Missing secret::$name"; exit 2; }
          done

      - name: Checkout private documentary fix
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: fix/deep-documentary-fire-safety-v29
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Restore voice and speech model cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: tayvoriq-deep-documentary-chatterbox-whisper-py311-v1

      - name: Install media voice and speech dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q rubberband
          python -m pip install --upgrade pip
          python -m pip install -r implementation/requirements.txt pytest "faster-whisper==1.1.1"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0"
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948"

      - name: Validate content voice and speech contracts
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m compileall -q tools src
          python -m pytest -q \
            tests/test_tayvoriq_fire_safety_documentary_v2.py \
            tests/test_tayvoriq_documentary_voice_gate_v29.py \
            tests/test_tayvoriq_speech_intelligibility_gate.py

      - name: Download previous Chatterbox review voice
        uses: actions/download-artifact@v4
        with:
          name: tayvoriq-review-30277119576
          path: previous-review
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: mojo72549-arch/tayvoriq-control-plane
          run-id: 30277119576

      - name: Build anonymous deep narrator reference
        run: |
          set -euo pipefail
          SOURCE=$(find previous-review -type f -name 'voice_chatterbox_raw.wav' | head -n 1)
          test -n "$SOURCE" && test -f "$SOURCE"
          mkdir -p implementation/reference
          ffmpeg -y -loglevel error \
            -ss 1.0 -t 15.0 -i "$SOURCE" \
            -af "rubberband=pitch=0.84:transients=smooth:detector=soft:phase=laminar,highpass=f=55,bass=g=2.5:f=120:w=0.7,treble=g=-1:f=4800:w=0.5,acompressor=threshold=-20dB:ratio=2:attack=20:release=250,loudnorm=I=-16:TP=-1.5:LRA=10" \
            -ac 1 -ar 24000 -c:a pcm_s16le \
            implementation/reference/deep_documentary_reference.wav
          test $(stat -c%s implementation/reference/deep_documentary_reference.wav) -gt 100000
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 \
            implementation/reference/deep_documentary_reference.wav

      - name: Render complete wildfire safety documentary
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_fire_safety_documentary_v2.py \
            --out-dir "${GITHUB_WORKSPACE}/implementation/out/deep-fire-safety-review"

      - name: Verify spoken German locally
        working-directory: implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("out/deep-fire-safety-review")
          package = json.loads((root / "text_package.json").read_text(encoding="utf-8"))
          (root / "reference_script.txt").write_text(package["script"] + "\n", encoding="utf-8")
          PY
          python tools/tayvoriq_speech_intelligibility_gate.py \
            --audio out/deep-fire-safety-review/voice.mp3 \
            --reference-text-file out/deep-fire-safety-review/reference_script.txt \
            --report out/deep-fire-safety-review/speech_intelligibility_report.json \
            --model-size base
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("out/deep-fire-safety-review")
          quality_path = root / "quality_report.json"
          quality = json.loads(quality_path.read_text(encoding="utf-8"))
          speech = json.loads((root / "speech_intelligibility_report.json").read_text(encoding="utf-8"))
          quality["speech_intelligibility_gate"] = speech
          quality["passed"] = bool(quality.get("passed") and speech.get("passed"))
          quality_path.write_text(json.dumps(quality, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if not quality["passed"]:
              raise SystemExit("Combined documentary quality gate failed")
          print(json.dumps({
              "voice": quality["voice_gate"],
              "speech": {
                  "passed": speech["passed"],
                  "similarity": speech["similarity"],
                  "required_concepts": speech["required_concepts"],
              },
              "content": quality["content_gate"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Final evidence and upload hold gate
        working-directory: implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          root = Path("out/deep-fire-safety-review")
          quality = json.loads((root / "quality_report.json").read_text(encoding="utf-8"))
          job = json.loads((root / "job.json").read_text(encoding="utf-8"))
          video = root / "short.mp4"
          failures = []
          if quality.get("passed") is not True:
              failures.append("quality_failed")
          if quality.get("voice_gate", {}).get("profile") != "deep-warm-calm-german-documentary":
              failures.append("wrong_voice_profile")
          if quality.get("voice_gate", {}).get("edge_fallback_allowed") is not False:
              failures.append("edge_fallback_not_blocked")
          if quality.get("speech_intelligibility_gate", {}).get("passed") is not True:
              failures.append("speech_not_intelligible")
          if quality.get("subtitles_complete") is not True:
              failures.append("subtitles_incomplete")
          if job.get("approval_status") != "PENDING_REVIEW":
              failures.append(f"approval={job.get('approval_status')}")
          if job.get("upload_status") != "NOT_STARTED_PENDING_APPROVAL":
              failures.append(f"upload={job.get('upload_status')}")
          if not video.is_file() or video.stat().st_size < 500000:
              failures.append("missing_mp4")
          if failures:
              raise SystemExit(", ".join(failures))
          subprocess.run([
              "ffprobe", "-v", "error", "-show_entries",
              "stream=codec_type,width,height:format=duration", "-of", "json", str(video)
          ], check=True)
          print("All local documentary gates passed. No platform upload performed.")
          PY

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-review-${{ github.run_id }}
          path: implementation/out/deep-fire-safety-review/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish review page
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          REVIEW_ID="${GITHUB_RUN_ID}"
          TARGET="pages-worktree/tayvoriq/runs/${REVIEW_ID}"
          mkdir -p "$TARGET"
          cp implementation/out/deep-fire-safety-review/short.mp4 "$TARGET/tayvoriq-review.mp4"
          cp implementation/out/deep-fire-safety-review/audio_report.json "$TARGET/audio_report.json"
          cp implementation/out/deep-fire-safety-review/quality_report.json "$TARGET/quality_report.json"
          cp implementation/out/deep-fire-safety-review/speech_intelligibility_report.json "$TARGET/speech_intelligibility_report.json"
          cat > "$TARGET/index.html" <<'HTML'
          <!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAYVORIQ Waldbrand-Sicherheitsreview</title><style>body{margin:0;background:#080b10;color:#f5f7fb;font-family:system-ui,sans-serif}main{max-width:620px;margin:auto;padding:24px}video{width:100%;max-height:78vh;background:#000;border-radius:18px}h1{font-size:1.45rem;line-height:1.25}.badge{display:inline-block;margin:4px 4px 8px 0;padding:7px 10px;border-radius:999px;background:#153824;color:#baf7c9;font-weight:700}.card{padding:15px;margin-top:16px;border:1px solid #343947;border-radius:14px;background:#121620;line-height:1.5}.warn{background:#3d2a13;color:#ffe0ae}a{color:#8fc8ff}</style></head><body><main><span class="badge">Tiefe Dokumentarstimme</span><span class="badge">112 geprüft</span><span class="badge">Kein TTS-Fallback</span><h1>Waldbrand: So reagierst du im Ernstfall richtig</h1><video controls playsinline preload="metadata" src="tayvoriq-review.mp4"></video><div class="card"><strong>Verbindlich geprüft</strong><p>Tiefe, warme Chatterbox-V3-Stimme · lokale Ausspracheprüfung · konkrete Prävention · Flucht und Warnung · Notruf 112 mit Orts- und Lageangaben · Grenzen eigener Löschversuche · vollständige Untertitel.</p></div><div class="card warn"><strong>Noch nicht veröffentlicht.</strong><p>Entscheide ausschließlich über die Telegram-Schaltflächen „Freigeben“ oder „Ablehnen“.</p></div><div class="card"><strong>Offizielle Grundlage</strong><p>Bundesamt für Bevölkerungsschutz und Katastrophenhilfe sowie Deutscher Feuerwehrverband.</p></div><p><a href="tayvoriq-review.mp4">Video direkt öffnen</a></p></main></body></html>
          HTML
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tayvoriq/runs/${REVIEW_ID}" .nojekyll
          git commit -m "Publish deep fire-safety TAYVORIQ review ${REVIEW_ID}"
          git push origin main

      - name: Wait for review page
        run: |
          set -euo pipefail
          REVIEW_URL="https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"
          for attempt in $(seq 1 30); do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$REVIEW_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Review page ready: $REVIEW_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Review page unavailable::$REVIEW_URL"
          exit 1

      - name: Send Telegram approval review
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/" \
            --review-id "${GITHUB_RUN_ID}" \
            --approval-mode manual

      - name: Confirm no platform upload
        run: |
          echo "Deep fire-safety documentary published for human review only."
          echo "No YouTube, TikTok or Instagram upload was performed."
