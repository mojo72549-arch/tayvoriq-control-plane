name: TAYVORIQ Research Resilience Probe V2

on:
  push:
    branches:
      - fix/growth-v2-research-resilience-2
    paths:
      - ".github/workflows/tayvoriq-research-resilience-probe-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      TAYVORIQ_GDELT_BUDGET_SECONDS: "10"
      TAYVORIQ_GDELT_TIMEOUT_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/growth-v2-research-resilience-2
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile resilient research modules
        run: |
          python -m py_compile \
            tools/tayvoriq_agent_research_http_v2.py \
            tools/tayvoriq_agent_rss_v2.py \
            tools/tayvoriq_agent_gdelt_v2.py \
            tools/tayvoriq_agent_hf_v2.py \
            tools/tayvoriq_agent_research_resilience_v2.py \
            tools/tayvoriq_agent_trend_radar_v5.py \
            tools/tayvoriq_patch_orchestrator_research_v2.py

      - name: Wire production orchestrator on hotfix branch
        run: |
          set -euo pipefail
          python tools/tayvoriq_patch_orchestrator_research_v2.py
          if git diff --quiet -- .github/workflows/tayvoriq-agent-orchestrator-v2.yml; then
            echo "orchestrator already wired"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/tayvoriq-agent-orchestrator-v2.yml
            git commit -m "fix: wire resilient research into orchestrator"
            git pull --rebase origin fix/growth-v2-research-resilience-2
            git push origin HEAD:fix/growth-v2-research-resilience-2
          fi

      - name: Check Hugging Face credential presence without exposing it
        id: hf
        run: |
          python - <<'PY'
          import os
          present = bool((os.getenv('HF_TOKEN') or os.getenv('HUGGINGFACE_TOKEN') or '').strip())
          print({'huggingface_token_present': present})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as h:
              h.write(f"present={'true' if present else 'false'}\n")
          PY

      - name: Probe multi-publisher RSS source pool
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import tayvoriq_agent_rss_v2 as rss
          rows = rss.source_pool()
          domains = {row.get('domain') for row in rows if row.get('domain')}
          print(json.dumps({'rss_records': len(rows), 'independent_domains': len(domains)}))
          if len(rows) < 8 or len(domains) < 2:
              raise SystemExit('RSS_SOURCE_POOL_TOO_SMALL')
          Path('/tmp/tayvoriq-rss-source-pool.json').write_text(json.dumps(rows, ensure_ascii=False), encoding='utf-8')
          PY

      - name: Probe source-bounded Hugging Face structuring
        if: steps.hf.outputs.present == 'true'
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import tayvoriq_agent_hf_v2 as hf
          rows = json.loads(Path('/tmp/tayvoriq-rss-source-pool.json').read_text(encoding='utf-8'))
          token = (os.getenv('HF_TOKEN') or os.getenv('HUGGINGFACE_TOKEN') or '').strip()
          data, chunks, model = hf.structure('Current German TAYVORIQ trends; prioritize freshness, relevance, visual explainability and two independent sources.', token, rows, 'multi-publisher-rss')
          candidates = [c for c in (data.get('candidates') or []) if len(c.get('sources') or []) == 2]
          print(json.dumps({'hf_model': model, 'valid_candidates': len(candidates), 'grounding_chunks': len(chunks)}))
          if not candidates:
              raise SystemExit('HF_NO_SOURCE_BOUND_CANDIDATES')
          PY

      - name: Probe GDELT as secondary diagnostic only
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'tools')
          import tayvoriq_agent_gdelt_v2 as gdelt
          rows = gdelt.source_pool()
          print(json.dumps({'gdelt_records': len(rows), 'independent_domains': len({r.get('domain') for r in rows if r.get('domain')})}))
          PY

      - name: Require Hugging Face credential for production fallback
        if: steps.hf.outputs.present != 'true'
        run: |
          echo "HF_TOKEN_MISSING"
          exit 1
