name: TAYVORIQ Research Resilience Probe V2

on:
  push:
    branches:
      - fix/growth-v2-research-resilience-2
    paths:
      - ".github/workflows/tayvoriq-research-resilience-probe-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      TAYVORIQ_GDELT_BUDGET_SECONDS: "30"
      TAYVORIQ_GDELT_TIMEOUT_SECONDS: "8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/growth-v2-research-resilience-2
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile resilient research modules
        run: |
          python -m py_compile \
            tools/tayvoriq_agent_research_http_v2.py \
            tools/tayvoriq_agent_gdelt_v2.py \
            tools/tayvoriq_agent_hf_v2.py \
            tools/tayvoriq_agent_research_resilience_v2.py \
            tools/tayvoriq_agent_trend_radar_v5.py

      - name: Wire production orchestrator on hotfix branch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/tayvoriq-agent-orchestrator-v2.yml')
          s = p.read_text(encoding='utf-8')
          if '  HF_TOKEN:' not in s:
              lines = s.splitlines()
              out = []
              inserted = False
              for line in lines:
                  out.append(line)
                  if line.startswith('  GROQ_API_KEY:') and not inserted:
                      dollar = chr(36)
                      out.append('  HF_TOKEN: ' + dollar + '{{ secrets.HF_TOKEN }}')
                      out.append('  HUGGINGFACE_TOKEN: ' + dollar + '{{ secrets.HUGGINGFACE_TOKEN }}')
                      inserted = True
              if not inserted:
                  raise SystemExit('GROQ env anchor missing')
              s = '\n'.join(out) + '\n'
          marker = '      - name: Notify gate failure once for this run\n'
          if marker not in s:
              raise SystemExit('failure step anchor missing')
          prefix = s.split(marker, 1)[0]
          replacement = '''      - name: Notify gate failure once for this run
        if: failure() && steps.slot.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          if [ -f /tmp/tayvoriq-research-deferred.json ]; then
            echo "Research providers temporarily saturated; deferred internally. No user-facing Telegram failure sent."
            exit 0
          fi
          text="❌ TAYVORIQ Agent V2 konnte die aktuelle Growth-Rangliste nicht sicher erstellen. Es wurde keine Produktion gestartet. Run: ${GITHUB_RUN_ID}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" >/dev/null || true
'''
          p.write_text(prefix + replacement, encoding='utf-8')
          PY
          if git diff --quiet -- .github/workflows/tayvoriq-agent-orchestrator-v2.yml; then
            echo "orchestrator already wired"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/tayvoriq-agent-orchestrator-v2.yml
            git commit -m "fix: wire resilient research into orchestrator"
            git pull --rebase origin fix/growth-v2-research-resilience-2
            git push origin HEAD:fix/growth-v2-research-resilience-2
          fi

      - name: Check Hugging Face credential presence without exposing it
        id: hf
        run: |
          python - <<'PY'
          import os
          present = bool((os.getenv('HF_TOKEN') or os.getenv('HUGGINGFACE_TOKEN') or '').strip())
          print({'huggingface_token_present': present})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as h:
              h.write(f"present={'true' if present else 'false'}\n")
          PY

      - name: Probe independent GDELT source pool
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'tools')
          import tayvoriq_agent_gdelt_v2 as gdelt
          rows = gdelt.source_pool()
          domains = {row.get('domain') for row in rows if row.get('domain')}
          print(json.dumps({'gdelt_records': len(rows), 'independent_domains': len(domains)}))
          if len(rows) < 8 or len(domains) < 4:
              raise SystemExit('GDELT_SOURCE_POOL_TOO_SMALL')
          PY

      - name: Require Hugging Face credential for production fallback
        if: steps.hf.outputs.present != 'true'
        run: |
          echo "HF_TOKEN_MISSING"
          exit 1
