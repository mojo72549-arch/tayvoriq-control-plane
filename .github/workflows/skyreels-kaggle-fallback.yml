name: SkyReels Kaggle Fallback

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - 'lab/skyreels-v3-engine'
    paths:
      - 'lab/kaggle_skyreels/trigger.txt'

permissions:
  contents: read

jobs:
  kaggle-render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4
        with:
          ref: lab/skyreels-v3-engine

      - name: Require isolated Kaggle credentials
        shell: bash
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo 'KAGGLE_API_TOKEN_MISSING'; exit 2; }
          test -n "$KAGGLE_USERNAME" || { echo 'KAGGLE_USERNAME_MISSING'; exit 2; }

      - name: Install Kaggle CLI
        shell: bash
        run: python -m pip install -q -U kaggle

      - name: Build private GPU kernel package
        shell: bash
        run: |
          rm -rf /tmp/tayvoriq-kaggle
          mkdir -p /tmp/tayvoriq-kaggle
          cp lab/kaggle_skyreels/kernel.py /tmp/tayvoriq-kaggle/kernel.py
          cat > /tmp/tayvoriq-kaggle/kernel-metadata.json <<JSON
          {
            "id": "${KAGGLE_USERNAME}/tayvoriq-skyreels-fallback",
            "title": "TAYVORIQ SkyReels Fallback",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": "true",
            "enable_gpu": "true",
            "enable_internet": "true",
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          JSON

      - name: Start independent Kaggle GPU render
        shell: bash
        run: |
          kaggle kernels push -p /tmp/tayvoriq-kaggle --accelerator NvidiaTeslaT4 --timeout 300
          echo 'KAGGLE_RENDER_SUBMITTED'

      - name: Wait for Kaggle render
        shell: bash
        run: |
          set +e
          for i in $(seq 1 120); do
            OUT=$(kaggle kernels status "${KAGGLE_USERNAME}/tayvoriq-skyreels-fallback" 2>&1)
            RC=$?
            echo "$OUT"
            if echo "$OUT" | grep -Eqi 'complete|completed'; then exit 0; fi
            if echo "$OUT" | grep -Eqi 'error|failed|cancel'; then exit 1; fi
            if [ $RC -ne 0 ]; then echo "status retry $i"; fi
            sleep 30
          done
          echo 'KAGGLE_RENDER_TIMEOUT'
          exit 1

      - name: Download Kaggle output
        shell: bash
        run: |
          mkdir -p lab/output/kaggle_skyreels
          kaggle kernels output "${KAGGLE_USERNAME}/tayvoriq-skyreels-fallback" -p lab/output/kaggle_skyreels
          RAW=$(find lab/output/kaggle_skyreels -type f -name 'TAYVORIQ_Blitz_SkyReels_Kaggle_Raw.mp4' | head -1)
          test -n "$RAW" && test -s "$RAW"
          ffprobe -v error -show_entries stream=width,height -show_entries format=duration,size -of json "$RAW"

      - name: Upload Kaggle proof
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-skyreels-kaggle-fallback
          path: lab/output/kaggle_skyreels/**/TAYVORIQ_Blitz_SkyReels_Kaggle_Raw.mp4
          retention-days: 7
