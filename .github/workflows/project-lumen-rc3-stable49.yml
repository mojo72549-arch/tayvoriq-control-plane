name: Project Lumen 13.2 RC6 Playback Persistence UX Build

on:
  pull_request:
    branches:
      - build/project-lumen-rc5-base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-lumen-rc6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'build/project-lumen-rc6-trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout stable Project Lumen source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply RC5 baseline recovery patch
        shell: bash
        run: python lumen138/ci/apply_rc5_recovery.py

      - name: Apply RC6 playback persistence performance and UX patch
        shell: bash
        run: python lumen138/ci/apply_rc6_quality.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore verified stable Project Lumen signing key
        shell: bash
        run: |
          set -euo pipefail
          OLD_COMMIT=28b0ea71876712ec2638e5cd2ecb6093ee98a637
          git fetch --no-tags --depth=1 origin "$OLD_COMMIT"
          mkdir -p /tmp/lumen-old /tmp/lumen-parts lumen138/ci/keys
          for part in 00 01 02 03 04; do
            git show "$OLD_COMMIT:relay/lumen-build-relay.tar.xz.b64.part$part" > "/tmp/lumen-parts/part$part"
          done
          cat /tmp/lumen-parts/part* | base64 --decode > /tmp/lumen-old/source.tar.xz
          echo "c617e95631564c3eb15ee6e6c26554fcc23a1d761c44e8bebf4e7a10c9954d7a  /tmp/lumen-old/source.tar.xz" | sha256sum --check
          tar -xJf /tmp/lumen-old/source.tar.xz -C /tmp/lumen-old
          base64 --decode /tmp/lumen-old/lumen-build-relay/ci/keys/lumen-pilot-v1.jks.b64 > lumen138/ci/keys/lumen-pilot-v1.jks
          echo "764e0c501b8c13fb1eae852bcaddd16aab0c31109cf17de97bde5d15327a8817  lumen138/ci/keys/lumen-pilot-v1.jks" | sha256sum --check

      - name: Unit tests lint and signed release APK
        shell: bash
        working-directory: lumen138
        run: |
          set -euo pipefail
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          gradle --no-daemon testDebugUnitTest lintDebug assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/dist/android-build.log"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/Project_Lumen_13.2.0_RC6_Samsung.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/Project_Lumen_13.2.0_RC6_FireTV.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/Project_Lumen_13.2.0_RC6_Universal.apk"

      - name: Verify version signature launchers playback recovery persistence and PiP
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/dist/Project_Lumen_13.2.0_RC6_Universal.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/dist/apk-signature.txt"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/dist/apk-badging.txt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee "$GITHUB_WORKSPACE/dist/apk-manifest.txt"
          grep -q "package: name='com.projectlumen.pilot.robust'" "$GITHUB_WORKSPACE/dist/apk-badging.txt"
          grep -q "versionName='13.2.0-rc6-playback-persistence-ux'" "$GITHUB_WORKSPACE/dist/apk-badging.txt"
          grep -q "application-label:'Project Lumen RC6'" "$GITHUB_WORKSPACE/dist/apk-badging.txt"
          grep -q 'android.intent.category.LAUNCHER' "$GITHUB_WORKSPACE/dist/apk-manifest.txt"
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' "$GITHUB_WORKSPACE/dist/apk-manifest.txt"
          grep -q 'android:supportsPictureInPicture' "$GITHUB_WORKSPACE/dist/apk-manifest.txt"
          sha256sum "$GITHUB_WORKSPACE/dist/Project_Lumen_13.2.0_RC6_Samsung.apk" > "$GITHUB_WORKSPACE/dist/Project_Lumen_13.2.0_RC6_Samsung.apk.sha256"
          sha256sum "$GITHUB_WORKSPACE/dist/Project_Lumen_13.2.0_RC6_FireTV.apk" > "$GITHUB_WORKSPACE/dist/Project_Lumen_13.2.0_RC6_FireTV.apk.sha256"
          sha256sum "$GITHUB_WORKSPACE/dist/Project_Lumen_13.2.0_RC6_Universal.apk" > "$GITHUB_WORKSPACE/dist/Project_Lumen_13.2.0_RC6_Universal.apk.sha256"
          printf 'version=13.2.0-rc6-playback-persistence-ux\nbase=13.2.0-rc5-stable49-recovery\npackage=com.projectlumen.pilot.robust\ncommit=%s\nsignature=stable-project-lumen-pilot\nlauncher=smartphone-and-leanback\nplayback=extensionless-mpegts-and-custom-port-http-recovery\npersistence=cache-first-and-synchronous-active-metadata\nimport=gzip-optional-four-megabyte-buffer\nux=unified-language-and-category-facets\nback_behavior=picture-in-picture-on-active-smartphone-playback\n' "$GITHUB_SHA" > "$GITHUB_WORKSPACE/dist/BUILD_INFO.txt"

      - name: Upload RC6 Samsung Fire TV and universal APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-lumen-13-2-0-rc6-${{ github.sha }}
          path: dist/
          if-no-files-found: warn
          retention-days: 7
