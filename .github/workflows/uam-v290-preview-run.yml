name: UAM V290 Email Auth Preview Deploy

on:
  push:
    branches:
      - uam-v290-preview-run
    paths:
      - .github/workflows/uam-v290-preview-run.yml

permissions:
  contents: write

concurrency:
  group: uam-v290-email-auth-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRAP_SECRET: ${{ secrets.UAM_VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Maifclp5V8xrU2vIyzXHpbyH
      VERCEL_PROJECT_ID: prj_6CeUslzmHvM8TnH8oS9f8EkNFlbP
    steps:
      - name: Checkout encrypted transport
        uses: actions/checkout@v4

      - name: Recover V290 source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRAP_SECRET"
          mkdir -p /tmp/uam-v290/src

          base64 -d .uam-v290/transport-private.pem.enc.b64 > /tmp/transport-private.pem.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/transport-private.pem.enc \
            -out /tmp/transport-private.pem \
            -pass env:WRAP_SECRET

          base64 -d .uam-v290/source-key.rsa.b64 > /tmp/source-key.rsa
          openssl pkeyutl -decrypt \
            -inkey /tmp/transport-private.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/source-key.rsa > /tmp/source-key.txt

          cat .uam-v290/secure-payload-00.b64 \
              .uam-v290/secure-payload-01.b64 \
              .uam-v290/secure-payload-02.b64 \
              .uam-v290/secure-payload-03.b64 \
              .uam-v290/secure-payload-04.b64 > /tmp/source.tar.xz.enc.b64
          base64 -d /tmp/source.tar.xz.enc.b64 > /tmp/source.tar.xz.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/source.tar.xz.enc \
            -out /tmp/source.tar.xz \
            -pass file:/tmp/source-key.txt
          tar -xJf /tmp/source.tar.xz -C /tmp/uam-v290/src
          rm -f /tmp/transport-private.pem.enc /tmp/transport-private.pem /tmp/source-key.rsa /tmp/source-key.txt /tmp/source.tar.xz.enc.b64 /tmp/source.tar.xz.enc /tmp/source.tar.xz

      - name: Quick source verification
        working-directory: /tmp/uam-v290/src
        shell: bash
        run: |
          set -euo pipefail
          node verify.mjs
          node build.mjs
          test -f dist/index.html

      - name: Authenticate Vercel CLI by device
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/vercel-login.log .uam-v290/device-login.txt
          timeout 1200s script -q -e -c "npx --yes vercel@latest login --no-color" /tmp/vercel-login.log &
          LOGIN_PID=$!

          URL=""
          for i in $(seq 1 180); do
            URL=$(grep -Eo 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' /tmp/vercel-login.log | tail -n 1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done

          test -n "$URL" || { echo "::error::No Vercel device login URL generated"; kill "$LOGIN_PID" || true; exit 3; }
          printf '%s\n' "$URL" > .uam-v290/device-login.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .uam-v290/device-login.txt
          git commit -m "ops: publish temporary Vercel device login URL"
          git push origin HEAD:uam-v290-preview-run

          echo "Vercel device authorization URL published."
          wait "$LOGIN_PID"
          npx --yes vercel@latest whoami --no-color

      - name: Bind exact existing project
        working-directory: /tmp/uam-v290/src
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_6CeUslzmHvM8TnH8oS9f8EkNFlbP","orgId":"team_Maifclp5V8xrU2vIyzXHpbyH","projectName":"uam-biograd-mobile-v290"}' > .vercel/project.json

      - name: Deploy PREVIEW only
        id: deploy
        working-directory: /tmp/uam-v290/src
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --yes --scope mo61 --no-color 2>&1 | tee /tmp/vercel-preview.log
          URL=$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-preview.log | tail -n 1 || true)
          test -n "$URL" || { echo "::error::No Preview URL returned"; exit 20; }
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview created: $URL"
          {
            echo "### UAM V290 Preview"
            echo "$URL"
            echo ""
            echo "Existing project: uam-biograd-mobile-v290"
            echo "Production changed: NO"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify preview deployment
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest inspect "$PREVIEW_URL" --wait --scope mo61 --no-color
