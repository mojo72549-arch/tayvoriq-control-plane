name: UAM V290 Secure Bootstrap

on:
  push:
    branches:
      - uam-v290-preview-run
    paths:
      - .github/workflows/uam-v290-preview-run.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WRAP_SECRET: ${{ secrets.UAM_VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate protected transport key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRAP_SECRET" || { echo "::error::UAM_VERCEL_TOKEN secret missing"; exit 2; }
          mkdir -p .uam-v290
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/uam-private.pem
          openssl rsa -pubout -in /tmp/uam-private.pem -out .uam-v290/transport-public.pem
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in /tmp/uam-private.pem \
            -out /tmp/uam-private.pem.enc \
            -pass env:WRAP_SECRET
          base64 -w 0 /tmp/uam-private.pem.enc > .uam-v290/transport-private.pem.enc.b64
          rm -f /tmp/uam-private.pem /tmp/uam-private.pem.enc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .uam-v290/transport-public.pem .uam-v290/transport-private.pem.enc.b64
          git commit -m "ops: bootstrap protected UAM transport key"
          git push origin HEAD:uam-v290-preview-run
