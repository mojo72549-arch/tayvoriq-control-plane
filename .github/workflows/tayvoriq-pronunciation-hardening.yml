name: TAYVORIQ Pronunciation and DFB Recovery Verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-pronunciation-hardening.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tayvoriq-pronunciation-dfb-verification
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate private repository token
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN" || { echo 'Missing PRIVATE_REPO_TOKEN'; exit 2; }

      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: |
          set -euo pipefail
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          python -m pip install -r implementation/requirements.txt pytest -q
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0" -q
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948" -q

      - name: Compile active implementation
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m compileall -q tools src runtime_patches tests

      - name: Verify canonical pronunciation examples
        working-directory: implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          from tools.tayvoriq_pronunciation_lexicon_v1 import apply_spoken_surfaces

          source = "MHP, IT, ITW, DFB-Camp, KI, EU und USA."
          expected = (
              "Emm Hah Peh, Ih Teh, Ih Teh Weh, Deh Eff Beh Camp, "
              "Kah Ih, Eh Uh und Uh Ess Ah."
          )
          actual = apply_spoken_surfaces(source)
          if actual != expected:
              raise SystemExit(f"PRONUNCIATION_CONTRACT_FAILED:{actual!r}")
          print("TAYVORIQ_GERMAN_ACRONYM_CONTRACT_PASSED")
          PY

      - name: Run pronunciation and DFB regressions
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_tayvoriq_pronunciation_lexicon_v1.py             tests/test_tayvoriq_pronunciation_audit_contract.py             tests/test_tayvoriq_verified_source_overflow_repair.py             tests/test_tayvoriq_tts_pacing_resilience.py             tests/test_tayvoriq_voice_v5_human_narrator.py

      - name: Run lightweight production contract
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_lightweight_preflight.py

      - name: Run full production preflight
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_preflight_check.py             --report-out out/control-plane/pronunciation-dfb-preflight.json

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-pronunciation-dfb-verification-${{ github.run_id }}
          path: implementation/out/control-plane/pronunciation-dfb-preflight.json
          if-no-files-found: warn
          retention-days: 14
