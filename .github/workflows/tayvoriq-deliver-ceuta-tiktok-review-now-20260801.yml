name: TAYVORIQ Deliver Ceuta TikTok Review Now 2026-08-01

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-deliver-ceuta-tiktok-review-now-20260801.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: tayvoriq-tiktok-decisions
  cancel-in-progress: false

env:
  SOURCE_REVIEW_RUN_ID: "30712536166"
  SOURCE_ARTIFACT: "tayvoriq-control-review-30712536166"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  deliver-tiktok-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download approved Ceuta review artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: approved-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_REVIEW_RUN_ID }}

      - name: Verify TikTok package and prepare caption
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          roots=[]
          for item in Path('approved-artifact').rglob('job.json'):
              root=item.parent
              if (root/'short_tiktok.mp4').is_file() and (root/'short_youtube.mp4').is_file():
                  roots.append(root)
          if len(roots) != 1:
              raise SystemExit(f'expected exactly one complete review job, found={len(roots)}')
          root=roots[0].resolve()
          job=json.loads((root/'job.json').read_text(encoding='utf-8'))
          quality=job.get('quality_report') if isinstance(job.get('quality_report'),dict) else {}
          if quality.get('passed') is not True:
              raise SystemExit({'quality_gate_failed':quality})

          youtube=root/'short_youtube.mp4'
          tiktok=root/'short_tiktok.mp4'
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda:fh.read(1024*1024),b''):
                      h.update(chunk)
              return h.hexdigest()
          youtube_hash=digest(youtube)
          tiktok_hash=digest(tiktok)
          if youtube_hash != tiktok_hash:
              raise SystemExit({'platform_master_mismatch':[youtube_hash,tiktok_hash]})

          variants=job.get('variants') if isinstance(job.get('variants'),dict) else {}
          variant=variants.get('tiktok') if isinstance(variants.get('tiktok'),dict) else {}
          package=variant.get('text_package') if isinstance(variant.get('text_package'),dict) else {}
          metadata=package.get('tiktok_metadata') if isinstance(package.get('tiktok_metadata'),dict) else {}
          caption=' '.join(str(metadata.get('caption') or '').split()).strip()
          hashtags=metadata.get('hashtags') if isinstance(metadata.get('hashtags'),list) else []
          hashtag_text=' '.join(str(item).strip() for item in hashtags if str(item).strip())
          if not caption:
              caption='Ceuta liegt in Afrika, gehört aber zu Spanien. Warum versuchten Zehntausende Menschen diese Grenze zu überwinden? Hinter den Bildern stehen Hoffnung, Gerüchte und Familien, die Angehörige suchen.'
          if hashtag_text and hashtag_text not in caption:
              caption=f'{caption} {hashtag_text}'
          if '#TAYVORIQ' not in caption:
              caption=f'{caption} #TAYVORIQ'
          caption=caption[:900]

          Path('/tmp/tiktok-caption.txt').write_text(caption,encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write(f'TAYVORIQ_TIKTOK_VIDEO={tiktok}\n')
              handle.write(f'TAYVORIQ_JOB_DIR={root}\n')
              handle.write(f'TAYVORIQ_MASTER_SHA256={tiktok_hash}\n')
          print({'tiktok_review_ready':True,'video_size':tiktok.stat().st_size,'sha256':tiktok_hash,'caption_length':len(caption)})
          PY

      - name: Send TikTok review video with approval buttons
        id: telegram
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          markup=$(python - <<'PY'
          import json, os
          run=os.environ['GITHUB_RUN_ID']
          details=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run}"
          print(json.dumps({'inline_keyboard':[
              [
                  {'text':'✅ TikTok freigeben','callback_data':f'tayvoriqtiktok:approve:{run}'},
                  {'text':'❌ Ablehnen','callback_data':f'tayvoriqtiktok:reject:{run}'},
              ],
              [{'text':'🔧 Technische Details','url':details}],
          ]},ensure_ascii=False))
          PY
          )
          caption=$'🎵 TAYVORIQ TikTok-Review\n\nThema: Ceuta – warum Zehntausende diese Grenze stürmten\nFormat: 9:16 · TikTok-ready\nQuality-Gates: bestanden\n\nNach Freigabe erhältst du die Caption direkt zum Kopieren.'
          http_code=$(curl --silent --show-error \
            --max-time 300 \
            --output /tmp/telegram-tiktok-send.json \
            --write-out '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@${TAYVORIQ_TIKTOK_VIDEO};type=video/mp4" \
            -F "caption=${caption}" \
            -F "supports_streaming=true" \
            -F "reply_markup=${markup}")
          python - "$http_code" <<'PY'
          import json, os, sys
          from pathlib import Path
          code=int(sys.argv[1])
          payload=json.loads(Path('/tmp/telegram-tiktok-send.json').read_text(encoding='utf-8'))
          if code != 200 or not payload.get('ok'):
              raise SystemExit({'http_code':code,'telegram':payload})
          message_id=payload['result']['message_id']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f'message_id={message_id}\n')
          print({'telegram_tiktok_delivery':'confirmed','message_id':message_id,'buttons':True})
          PY

      - name: Persist pending TikTok review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation/tayvoriq-tiktok-reviews
          REVIEW_ID="$GITHUB_RUN_ID" MESSAGE_ID="${{ steps.telegram.outputs.message_id }}" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          caption=Path('/tmp/tiktok-caption.txt').read_text(encoding='utf-8').strip()
          review_id=os.environ['REVIEW_ID']
          payload={
              'review_id':review_id,
              'source_review_run_id':os.environ['SOURCE_REVIEW_RUN_ID'],
              'status':'PENDING_REVIEW',
              'topic':'Ceuta: Warum Zehntausende diese Grenze stürmten',
              'category':'world_events_africa',
              'platform':'tiktok',
              'tiktok_upload_mode':'manual',
              'telegram_message_id':int(os.environ['MESSAGE_ID']),
              'tiktok_caption':caption,
              'master_sha256':os.environ['TAYVORIQ_MASTER_SHA256'],
              'created_at':datetime.now(timezone.utc).isoformat(),
          }
          path=Path(f'.automation/tayvoriq-tiktok-reviews/{review_id}.json')
          path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(payload)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".automation/tayvoriq-tiktok-reviews/${GITHUB_RUN_ID}.json"
          git commit -m "Register TikTok review ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin main

      - name: Process immediate TikTok decision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token=os.environ['TELEGRAM_BOT_TOKEN'].strip()
          expected_chat=os.environ['TELEGRAM_CHAT_ID'].strip()
          review_id=os.environ['GITHUB_RUN_ID']
          review_path=Path(f'.automation/tayvoriq-tiktok-reviews/{review_id}.json')
          state_path=Path('.automation/tayvoriq-tiktok-decision-state.json')
          state={'next_update_id':0}
          if state_path.is_file():
              try: state.update(json.loads(state_path.read_text(encoding='utf-8')))
              except Exception: pass
          offset=int(state.get('next_update_id') or 0)

          def telegram(method,payload):
              req=urllib.request.Request(
                  f'https://api.telegram.org/bot{token}/{method}',
                  data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),
                  headers={'Content-Type':'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req,timeout=35) as response:
                  value=json.loads(response.read().decode('utf-8'))
              if not value.get('ok'): raise RuntimeError(value)
              return value.get('result')

          deadline=time.time()+420
          processed=False
          while time.time()<deadline and not processed:
              updates=telegram('getUpdates',{
                  'offset':offset,
                  'limit':100,
                  'timeout':20,
                  'allowed_updates':['callback_query'],
              }) or []
              for update in updates:
                  update_id=int(update.get('update_id') or 0)
                  offset=max(offset,update_id+1)
                  callback=update.get('callback_query') if isinstance(update.get('callback_query'),dict) else {}
                  data=str(callback.get('data') or '')
                  approve=f'tayvoriqtiktok:approve:{review_id}'
                  reject=f'tayvoriqtiktok:reject:{review_id}'
                  if data not in {approve,reject}:
                      continue
                  message=callback.get('message') if isinstance(callback.get('message'),dict) else {}
                  chat=message.get('chat') if isinstance(message.get('chat'),dict) else {}
                  if str(chat.get('id') or '') != expected_chat:
                      continue
                  action='approve' if data==approve else 'reject'
                  status='APPROVED' if action=='approve' else 'REJECTED'
                  review=json.loads(review_path.read_text(encoding='utf-8'))
                  review.update({
                      'status':status,
                      'processed_at':datetime.now(timezone.utc).isoformat(),
                      'source':'telegram_callback_immediate',
                  })
                  review_path.write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  telegram('answerCallbackQuery',{
                      'callback_query_id':callback['id'],
                      'text':'TikTok-Freigabe gespeichert.' if status=='APPROVED' else 'TikTok-Review abgelehnt.',
                  })
                  telegram('editMessageReplyMarkup',{
                      'chat_id':expected_chat,
                      'message_id':int(message.get('message_id') or 0),
                      'reply_markup':{'inline_keyboard':[]},
                  })
                  if status=='APPROVED':
                      text=(
                          '✅ TikTok-Freigabe gespeichert\n\n'
                          'Das Video aus der vorherigen Nachricht speichern und in TikTok hochladen.\n\n'
                          'Caption zum Kopieren:\n'+review['tiktok_caption']
                      )
                  else:
                      text='❌ TikTok-Video abgelehnt. Es wird nicht für TikTok verwendet.'
                  telegram('sendMessage',{'chat_id':expected_chat,'text':text,'disable_web_page_preview':True})
                  processed=True
                  break
          state['next_update_id']=offset
          state['last_checked_at']=datetime.now(timezone.utc).isoformat()
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print({'immediate_decision_processed':processed,'review_id':review_id})
          PY

      - name: Persist immediate TikTok decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".automation/tayvoriq-tiktok-reviews/${GITHUB_RUN_ID}.json" \
                  .automation/tayvoriq-tiktok-decision-state.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record immediate TikTok decision ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin main
