name: TAYVORIQ Delivery Watch

on:
  workflow_run:
    workflows:
      - TAYVORIQ-X Golden Path
    types:
      - completed

permissions:
  actions: write
  contents: write

concurrency:
  group: tayvoriq-delivery-watch-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover-or-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAX_RECOVERY_GENERATIONS: "4"

    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact request bound to completed Golden Path run
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python tools/tayvoriq_delivery_recovery_v3.py resolve \
            --run-id "$RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Guard explicitly stopped terminal run
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          ignore=false
          reason=current

          case "${RUN_CONCLUSION:-}" in
            cancelled|skipped|neutral)
              ignore=true
              reason="terminal-${RUN_CONCLUSION}"
              ;;
          esac

          if [ "$ignore" != "true" ] && [ -f .github/run-now/tayvoriq-stale-stop.json ]; then
            stale_target=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.github/run-now/tayvoriq-stale-stop.json')
          try:
              d=json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              d={}
          value=str(d.get('target_run_id') or '')
          print(value if value.isdigit() else '')
          PY
            )
            if [ -n "$stale_target" ] && [ "$stale_target" = "$RUN_ID" ]; then
              ignore=true
              reason=explicit-stale-stop
            fi
          fi

          echo "ignore=$ignore" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "TAYVORIQ delivery-watch guard: run=$RUN_ID request=${{ steps.request.outputs.request_id }} ignore=$ignore reason=$reason"

      - name: Classify recovery state
        id: classify
        if: steps.guard.outputs.ignore != 'true'
        shell: bash
        env:
          REQUEST_BOUND: ${{ steps.request.outputs.bound }}
          REQUEST_RETRY_ALLOWED: ${{ steps.request.outputs.retry_allowed }}
          REQUEST_RECOVERY_GENERATION: ${{ steps.request.outputs.recovery_generation }}
        run: |
          set -euo pipefail
          external_blocker=false
          should_retry=false
          needs_fresh_generation=false
          recovery_state=SUCCESS

          if [ "$RUN_CONCLUSION" != "success" ]; then
            recovery_state=TECHNICAL_FAILURE
            logs=$(gh run view "$RUN_ID" --log-failed 2>/dev/null || true)
            lowered=$(printf '%s' "$logs" | tr '[:upper:]' '[:lower:]')

            if printf '%s' "$lowered" | grep -Eq 'external_auth_blocker|missing secret|401 client error|unauthorized|billing|spending limit|payment|permission denied'; then
              external_blocker=true
              recovery_state=EXTERNAL_ACTION_REQUIRED
            elif [ "$REQUEST_BOUND" != "true" ]; then
              recovery_state=REQUEST_BINDING_REQUIRED
            elif [ "$REQUEST_RETRY_ALLOWED" != "true" ]; then
              recovery_state=RETRY_NOT_ALLOWED
            elif [ "${RUN_ATTEMPT:-1}" -lt 3 ]; then
              should_retry=true
              recovery_state=AUTO_RECOVERY_QUEUED
            elif [ "${REQUEST_RECOVERY_GENERATION:-0}" -lt "$MAX_RECOVERY_GENERATIONS" ]; then
              needs_fresh_generation=true
              recovery_state=FRESH_RECOVERY_GENERATION_REQUIRED
            else
              recovery_state=AUTONOMOUS_RECOVERY_BUDGET_EXHAUSTED
            fi
          fi

          echo "external_blocker=$external_blocker" >> "$GITHUB_OUTPUT"
          echo "should_retry=$should_retry" >> "$GITHUB_OUTPUT"
          echo "needs_fresh_generation=$needs_fresh_generation" >> "$GITHUB_OUTPUT"
          echo "recovery_state=$recovery_state" >> "$GITHUB_OUTPUT"
          echo "TAYVORIQ delivery-watch: state=$recovery_state attempt=$RUN_ATTEMPT request=${{ steps.request.outputs.request_id }}"

      - name: Re-run same failed production automatically
        if: steps.guard.outputs.ignore != 'true' && steps.classify.outputs.should_retry == 'true'
        run: |
          set -euo pipefail
          echo "Automatic silent recovery: rerunning failed jobs for run $RUN_ID attempt $RUN_ATTEMPT request=${{ steps.request.outputs.request_id }}."
          gh run rerun "$RUN_ID" --failed

      - name: Start fresh recovery generation for exact bound request
        id: fresh
        if: steps.guard.outputs.ignore != 'true' && steps.classify.outputs.needs_fresh_generation == 'true'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
          TOPIC: ${{ steps.request.outputs.topic }}
          TREND_ID: ${{ steps.request.outputs.trend_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          prepared=false
          started=false
          generation=0
          new_run_id=""

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tmp=$(mktemp)
            python tools/tayvoriq_delivery_recovery_v3.py prepare \
              --run-id "$RUN_ID" \
              --maximum "$MAX_RECOVERY_GENERATIONS" \
              --github-output "$tmp"
            generation=$(awk -F= '$1=="generation" {print $2}' "$tmp")
            git add "$REQUEST_PATH"
            git commit -m "agent(v2): prepare request-bound recovery ${REQUEST_ID} g${generation}"
            if git push origin HEAD:main; then
              prepared=true
              break
            fi
            sleep $((attempt * 2))
          done

          if [ "$prepared" = "true" ]; then
            before=$(gh run list --workflow tayvoriq-deliver-video-now.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            for dispatch_attempt in 1 2 3; do
              if gh workflow run tayvoriq-deliver-video-now.yml --repo "$GITHUB_REPOSITORY" --ref main -f topic="$TOPIC" -f trend_id="$TREND_ID"; then
                for poll in $(seq 1 24); do
                  sleep 5
                  latest=$(gh run list --workflow tayvoriq-deliver-video-now.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
                  if [[ "$latest" =~ ^[0-9]+$ ]] && [ "$latest" != "0" ] && [ "$latest" != "$before" ]; then
                    new_run_id="$latest"
                    started=true
                    break
                  fi
                done
              fi
              [ "$started" = "true" ] && break
              sleep $((dispatch_attempt * 5))
            done
          fi

          if [ "$started" = "true" ]; then
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              python tools/tayvoriq_delivery_recovery_v3.py bind-new \
                --request-id "$REQUEST_ID" \
                --old-run-id "$RUN_ID" \
                --new-run-id "$new_run_id"
              git add "$REQUEST_PATH"
              git commit -m "ops(tayvoriq): bind ${REQUEST_ID} recovery to Golden Path ${new_run_id}"
              if git push origin HEAD:main; then
                break
              fi
              sleep $((attempt * 2))
            done
          fi

          echo "prepared=$prepared" >> "$GITHUB_OUTPUT"
          echo "started=$started" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "new_run_id=$new_run_id" >> "$GITHUB_OUTPUT"

      - name: Persist delivery and recovery state
        if: steps.guard.outputs.ignore != 'true'
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          CLASSIFIED_STATE: ${{ steps.classify.outputs.recovery_state }}
          FRESH_STARTED: ${{ steps.fresh.outputs.started }}
          FRESH_RUN_ID: ${{ steps.fresh.outputs.new_run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          fresh_started = str(os.environ.get('FRESH_STARTED') or '').lower() == 'true'
          state = 'FRESH_RECOVERY_GENERATION_RUNNING' if fresh_started else str(os.environ.get('CLASSIFIED_STATE') or 'TECHNICAL_FAILURE')
          payload = {
              'run_id': int(os.environ['RUN_ID']),
              'request_id': str(os.environ.get('REQUEST_ID') or ''),
              'status': 'completed',
              'conclusion': os.environ['RUN_CONCLUSION'],
              'run_attempt': int(os.environ.get('RUN_ATTEMPT') or 1),
              'recovery_state': state,
              'recovery_run_id': int(os.environ['FRESH_RUN_ID']) if str(os.environ.get('FRESH_RUN_ID') or '').isdigit() else None,
              'url': os.environ['RUN_URL'],
              'workflow': 'TAYVORIQ-X Golden Path',
              'user_intervention_required': state == 'EXTERNAL_ACTION_REQUIRED',
              'internal_recovery_silent': state != 'EXTERNAL_ACTION_REQUIRED',
              'completed_at': datetime.now(timezone.utc).isoformat(),
          }
          path = Path('.github/run-now/latest-delivery-run.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          print(payload)
          PY
            git add .github/run-now/latest-delivery-run.json
            git commit -m "ops: record request-bound TAYVORIQ delivery recovery state" || exit 0
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Telegram external action blocker
        if: steps.guard.outputs.ignore != 'true' && steps.classify.outputs.external_blocker == 'true'
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          message=$(cat <<'EOF'
          ⚠️ TAYVORIQ braucht einmalig deine Hilfe

          Ein externer Zugang, Secret, Zahlungs- oder Berechtigungsstatus blockiert den freigegebenen Auftrag. Die Trendfreigabe bleibt gespeichert; keine neue Themenfreigabe nötig.
          EOF
          )
          curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" >/dev/null

      - name: Record silent autonomous recovery state
        if: steps.guard.outputs.ignore != 'true' && steps.classify.outputs.external_blocker != 'true'
        run: |
          echo "Autonomous request-bound recovery state=${{ steps.classify.outputs.recovery_state }} request=${{ steps.request.outputs.request_id }} run=$RUN_ID; no technical-error Telegram noise emitted."
