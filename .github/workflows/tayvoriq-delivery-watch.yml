name: TAYVORIQ Delivery Watch

on:
  workflow_run:
    workflows:
      - TAYVORIQ-X Golden Path
    types:
      - completed

permissions:
  actions: write
  contents: write

concurrency:
  group: tayvoriq-delivery-watch-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover-or-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAX_RECOVERY_GENERATIONS: "4"
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify recovery state
        id: classify
        run: |
          set -euo pipefail
          external_blocker=false
          should_retry=false
          needs_fresh_generation=false
          recovery_state=SUCCESS

          if [ "$RUN_CONCLUSION" != "success" ]; then
            recovery_state=TECHNICAL_FAILURE
            logs=$(gh run view "$RUN_ID" --log-failed 2>/dev/null || true)
            lowered=$(printf '%s' "$logs" | tr '[:upper:]' '[:lower:]')
            if printf '%s' "$lowered" | grep -Eq 'external_auth_blocker|missing secret|401 client error|unauthorized|billing|spending limit|payment|permission denied'; then
              external_blocker=true
              recovery_state=EXTERNAL_ACTION_REQUIRED
            elif [ "${RUN_ATTEMPT:-1}" -lt 3 ]; then
              should_retry=true
              recovery_state=AUTO_RECOVERY_QUEUED
            else
              needs_fresh_generation=true
              recovery_state=FRESH_RECOVERY_GENERATION_REQUIRED
            fi
          fi

          echo "external_blocker=$external_blocker" >> "$GITHUB_OUTPUT"
          echo "should_retry=$should_retry" >> "$GITHUB_OUTPUT"
          echo "needs_fresh_generation=$needs_fresh_generation" >> "$GITHUB_OUTPUT"
          echo "recovery_state=$recovery_state" >> "$GITHUB_OUTPUT"
          echo "TAYVORIQ delivery-watch: state=$recovery_state attempt=$RUN_ATTEMPT"

      - name: Re-run failed production automatically
        if: steps.classify.outputs.should_retry == 'true'
        run: |
          set -euo pipefail
          echo "Automatic silent recovery: rerunning failed jobs for run $RUN_ID after attempt $RUN_ATTEMPT."
          gh run rerun "$RUN_ID" --failed

      - name: Start and verify fresh recovery generation on current main
        id: fresh
        if: steps.classify.outputs.needs_fresh_generation == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          prepared=false
          started=false
          generation=0
          state=AUTONOMOUS_TECHNICAL_ESCALATION
          topic=""
          trend_id=""
          new_run_id=""

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            readarray -t decision < <(python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('.github/run-now/tayvoriq-x-request.json')
          if not path.is_file():
              print('false'); print('0'); print('AUTONOMOUS_TECHNICAL_ESCALATION'); print(''); print('')
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding='utf-8'))
          approved = data.get('approved_trend_pinned') is True
          source_request_id = str(data.get('source_request_id') or '').strip()
          topic = str(data.get('topic') or '').strip()
          trend_id = str(data.get('trend_id') or '').strip()
          if not approved or not source_request_id or not topic or not trend_id:
              print('false'); print(str(int(data.get('recovery_generation') or 0))); print('AUTONOMOUS_TECHNICAL_ESCALATION'); print(topic); print(trend_id)
              raise SystemExit(0)

          current = int(data.get('recovery_generation') or 0)
          maximum = int(os.environ.get('MAX_RECOVERY_GENERATIONS') or 4)
          if current >= maximum:
              print('false'); print(str(current)); print('AUTONOMOUS_TECHNICAL_ESCALATION'); print(topic); print(trend_id)
              raise SystemExit(0)

          generation = current + 1
          now = datetime.now(timezone.utc)
          data['recovery_generation'] = generation
          data['retry_of_run_id'] = int(os.environ['RUN_ID'])
          data['requested_at'] = now.isoformat().replace('+00:00', 'Z')
          data['request_nonce'] = (
              f"tayvoriq-recovery-{source_request_id}-g{generation}-"
              f"{os.environ['RUN_ID']}-{int(now.timestamp())}"
          )
          data['reason'] = 'autonomous-fresh-recovery-generation-on-current-main-after-same-run-budget'
          # Internal recovery is intentionally silent. A recovered request must
          # not emit a second "production started" message either.
          data['suppress_start_notification'] = True
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('true'); print(str(generation)); print('FRESH_RECOVERY_GENERATION_PREPARED'); print(topic); print(trend_id)
          PY
          )

            prepared="${decision[0]:-false}"
            generation="${decision[1]:-0}"
            state="${decision[2]:-AUTONOMOUS_TECHNICAL_ESCALATION}"
            topic="${decision[3]:-}"
            trend_id="${decision[4]:-}"

            if [ "$prepared" != "true" ]; then
              break
            fi

            git add .github/run-now/tayvoriq-x-request.json
            git commit -m "agent(v2): prepare silent recovery generation ${generation} for ${RUN_ID}"
            if git push origin HEAD:main; then
              break
            fi
            sleep $((attempt * 2))
            prepared=false
            state=AUTONOMOUS_TECHNICAL_ESCALATION
          done

          if [ "$prepared" = "true" ]; then
            for dispatch_attempt in 1 2 3; do
              before=$(gh run list --workflow tayvoriq-deliver-video-now.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
              if gh workflow run tayvoriq-deliver-video-now.yml --repo "$GITHUB_REPOSITORY" --ref main -f topic="$topic" -f trend_id="$trend_id"; then
                for poll in $(seq 1 24); do
                  sleep 5
                  latest=$(gh run list --workflow tayvoriq-deliver-video-now.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
                  if [ -n "$latest" ] && [ "$latest" != "0" ] && [ "$latest" != "$before" ]; then
                    new_run_id="$latest"
                    started=true
                    state=FRESH_RECOVERY_GENERATION_RUNNING
                    break
                  fi
                done
              fi
              [ "$started" = "true" ] && break
              sleep $((dispatch_attempt * 5))
            done
          fi

          echo "started=$started" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "new_run_id=$new_run_id" >> "$GITHUB_OUTPUT"
          echo "topic=$topic" >> "$GITHUB_OUTPUT"
          echo "trend_id=$trend_id" >> "$GITHUB_OUTPUT"
          echo "TAYVORIQ fresh recovery: prepared=$prepared started=$started generation=$generation new_run_id=$new_run_id state=$state"

      - name: Persist delivery and recovery state
        env:
          CLASSIFIED_STATE: ${{ steps.classify.outputs.recovery_state }}
          FRESH_STATE: ${{ steps.fresh.outputs.state }}
          FRESH_RUN_ID: ${{ steps.fresh.outputs.new_run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .github/run-now

            python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          state = str(os.environ.get('FRESH_STATE') or os.environ.get('CLASSIFIED_STATE') or 'TECHNICAL_FAILURE')
          payload = {
              "run_id": int(os.environ["RUN_ID"]),
              "status": "completed",
              "conclusion": os.environ["RUN_CONCLUSION"],
              "run_attempt": int(os.environ.get("RUN_ATTEMPT") or 1),
              "recovery_state": state,
              "recovery_run_id": int(os.environ['FRESH_RUN_ID']) if str(os.environ.get('FRESH_RUN_ID') or '').isdigit() else None,
              "url": os.environ["RUN_URL"],
              "completed_at": datetime.now(timezone.utc).isoformat(),
              "workflow": "TAYVORIQ-X Golden Path",
              "user_intervention_required": state == "EXTERNAL_ACTION_REQUIRED",
              "internal_recovery_silent": state in {
                  "AUTO_RECOVERY_QUEUED",
                  "FRESH_RECOVERY_GENERATION_REQUIRED",
                  "FRESH_RECOVERY_GENERATION_RUNNING",
                  "AUTONOMOUS_TECHNICAL_ESCALATION",
                  "TECHNICAL_FAILURE",
              },
          }
          Path(".github/run-now/latest-delivery-run.json").write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          fresh_run_id=str(os.environ.get('FRESH_RUN_ID') or '').strip()
          if fresh_run_id.isdigit():
              x_path=Path('.github/run-now/tayvoriq-x-request.json')
              x_request=json.loads(x_path.read_text(encoding='utf-8')) if x_path.is_file() else {}
              source_request_id=str(x_request.get('source_request_id') or '').strip()
              source_path=Path('requests') / f'{source_request_id}.json'
              source=json.loads(source_path.read_text(encoding='utf-8')) if source_path.is_file() else {}
              selection_id=str(source.get('selection_id') or '').strip()
              if '-agentv2' in selection_id:
                  mapping={
                      'run_id':int(fresh_run_id),
                      'root_run_id':int(os.environ['RUN_ID']),
                      'retry_count':int(x_request.get('recovery_generation') or 0),
                      'selection_id':selection_id,
                      'topic':str(source.get('topic') or x_request.get('topic') or ''),
                      'trend_id':str(source.get('trend_id') or x_request.get('trend_id') or ''),
                      'source_request_id':source_request_id,
                      'agent_orchestrator':'v2',
                      'recovery_owner':'tayvoriq-delivery-watch',
                  }
                  map_path=Path(f'.automation/tayvoriq-agent-v2/run-map/{fresh_run_id}.json')
                  map_path.parent.mkdir(parents=True, exist_ok=True)
                  map_path.write_text(json.dumps(mapping,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(payload)
          PY

            git add .github/run-now/latest-delivery-run.json
            if [ -d .automation/tayvoriq-agent-v2/run-map ]; then
              git add .automation/tayvoriq-agent-v2/run-map/
            fi
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "ops: record TAYVORIQ delivery recovery state"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Record silent same-run recovery
        if: steps.classify.outputs.should_retry == 'true'
        run: |
          set -euo pipefail
          echo "Internal recovery queued silently for run $RUN_ID; no user notification emitted."

      - name: Record verified silent fresh recovery generation
        if: steps.fresh.outputs.started == 'true'
        env:
          GENERATION: ${{ steps.fresh.outputs.generation }}
          NEW_RUN_ID: ${{ steps.fresh.outputs.new_run_id }}
        run: |
          set -euo pipefail
          test -n "$NEW_RUN_ID"
          echo "Internal recovery generation $GENERATION/$MAX_RECOVERY_GENERATIONS verified as run $NEW_RUN_ID; no user notification emitted."

      - name: Telegram external action blocker
        if: steps.classify.outputs.external_blocker == 'true'
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          message=$(cat <<'EOF'
          ⚠️ TAYVORIQ braucht einmalig deine Hilfe

          Die autonome technische Recovery ist nicht der Blocker. Ein externer Zugang, Secret, Zahlungs- oder Berechtigungsstatus verhindert die Ausführung.

          Deine Trendfreigabe bleibt gespeichert. Nach Behebung wird derselbe Auftrag fortgesetzt; keine neue Themenfreigabe nötig.
          EOF
          )
          curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" >/dev/null

      - name: Record internal technical escalation without user noise
        if: steps.classify.outputs.needs_fresh_generation == 'true' && steps.fresh.outputs.started != 'true'
        run: |
          set -euo pipefail
          echo "Internal recovery escalation remains active. Approval is retained; no user action requested and no Telegram technical-error message emitted."
