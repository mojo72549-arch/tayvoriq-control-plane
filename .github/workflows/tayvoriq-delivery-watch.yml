name: TAYVORIQ Delivery Watch

on:
  workflow_run:
    workflows:
      - TAYVORIQ-X Golden Path
    types:
      - completed

permissions:
  actions: write
  contents: write

concurrency:
  group: tayvoriq-delivery-watch-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover-or-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAX_RECOVERY_GENERATIONS: "4"
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify recovery state
        id: classify
        run: |
          set -euo pipefail
          external_blocker=false
          should_retry=false
          needs_fresh_generation=false
          recovery_state=SUCCESS

          if [ "$RUN_CONCLUSION" != "success" ]; then
            recovery_state=TECHNICAL_FAILURE
            logs=$(gh run view "$RUN_ID" --log-failed 2>/dev/null || true)
            lowered=$(printf '%s' "$logs" | tr '[:upper:]' '[:lower:]')
            if printf '%s' "$lowered" | grep -Eq 'external_auth_blocker|missing secret|401 client error|unauthorized|billing|spending limit|payment|permission denied'; then
              external_blocker=true
              recovery_state=EXTERNAL_ACTION_REQUIRED
            elif [ "${RUN_ATTEMPT:-1}" -lt 3 ]; then
              should_retry=true
              recovery_state=AUTO_RECOVERY_QUEUED
            else
              needs_fresh_generation=true
              recovery_state=FRESH_RECOVERY_GENERATION_REQUIRED
            fi
          fi

          echo "external_blocker=$external_blocker" >> "$GITHUB_OUTPUT"
          echo "should_retry=$should_retry" >> "$GITHUB_OUTPUT"
          echo "needs_fresh_generation=$needs_fresh_generation" >> "$GITHUB_OUTPUT"
          echo "recovery_state=$recovery_state" >> "$GITHUB_OUTPUT"
          echo "TAYVORIQ delivery-watch: state=$recovery_state attempt=$RUN_ATTEMPT"

      - name: Re-run failed production automatically
        if: steps.classify.outputs.should_retry == 'true'
        run: |
          set -euo pipefail
          echo "Automatic recovery: rerunning failed jobs for run $RUN_ID after attempt $RUN_ATTEMPT."
          gh run rerun "$RUN_ID" --failed

      - name: Start fresh recovery generation on current main
        id: fresh
        if: steps.classify.outputs.needs_fresh_generation == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          started=false
          generation=0
          state=AUTONOMOUS_TECHNICAL_ESCALATION

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            readarray -t decision < <(python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('.github/run-now/tayvoriq-x-request.json')
          if not path.is_file():
              print('false')
              print('0')
              print('AUTONOMOUS_TECHNICAL_ESCALATION')
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding='utf-8'))
          approved = data.get('approved_trend_pinned') is True
          source_request_id = str(data.get('source_request_id') or '').strip()
          if not approved or not source_request_id:
              print('false')
              print(str(int(data.get('recovery_generation') or 0)))
              print('AUTONOMOUS_TECHNICAL_ESCALATION')
              raise SystemExit(0)

          current = int(data.get('recovery_generation') or 0)
          maximum = int(os.environ.get('MAX_RECOVERY_GENERATIONS') or 4)
          if current >= maximum:
              print('false')
              print(str(current))
              print('AUTONOMOUS_TECHNICAL_ESCALATION')
              raise SystemExit(0)

          generation = current + 1
          now = datetime.now(timezone.utc)
          data['recovery_generation'] = generation
          data['retry_of_run_id'] = int(os.environ['RUN_ID'])
          data['requested_at'] = now.isoformat().replace('+00:00', 'Z')
          data['request_nonce'] = (
              f"tayvoriq-recovery-{source_request_id}-g{generation}-"
              f"{os.environ['RUN_ID']}-{int(now.timestamp())}"
          )
          data['reason'] = (
              'autonomous-fresh-recovery-generation-on-current-main-after-same-run-budget'
          )
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('true')
          print(str(generation))
          print('FRESH_RECOVERY_GENERATION_QUEUED')
          PY
          )

            started="${decision[0]:-false}"
            generation="${decision[1]:-0}"
            state="${decision[2]:-AUTONOMOUS_TECHNICAL_ESCALATION}"

            if [ "$started" != "true" ]; then
              break
            fi

            git add .github/run-now/tayvoriq-x-request.json
            git commit -m "agent(v2): start recovery generation ${generation} for ${RUN_ID}"
            if git push origin HEAD:main; then
              break
            fi
            sleep $((attempt * 2))
            started=false
            state=AUTONOMOUS_TECHNICAL_ESCALATION
          done

          echo "started=$started" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "TAYVORIQ fresh recovery: started=$started generation=$generation state=$state"

      - name: Persist delivery and recovery state
        env:
          CLASSIFIED_STATE: ${{ steps.classify.outputs.recovery_state }}
          FRESH_STATE: ${{ steps.fresh.outputs.state }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .github/run-now

            python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          state = str(os.environ.get('FRESH_STATE') or os.environ.get('CLASSIFIED_STATE') or 'TECHNICAL_FAILURE')
          payload = {
              "run_id": int(os.environ["RUN_ID"]),
              "status": "completed",
              "conclusion": os.environ["RUN_CONCLUSION"],
              "run_attempt": int(os.environ.get("RUN_ATTEMPT") or 1),
              "recovery_state": state,
              "url": os.environ["RUN_URL"],
              "completed_at": datetime.now(timezone.utc).isoformat(),
              "workflow": "TAYVORIQ-X Golden Path",
              "user_intervention_required": state == "EXTERNAL_ACTION_REQUIRED",
          }
          Path(".github/run-now/latest-delivery-run.json").write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(payload)
          PY

            git add .github/run-now/latest-delivery-run.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "ops: record TAYVORIQ delivery recovery state"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Telegram same-run recovery status
        if: steps.classify.outputs.should_retry == 'true'
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          next_attempt=$((RUN_ATTEMPT + 1))
          message=$(printf '🔧 TAYVORIQ Recovery läuft\n\nDer technische Fehler wurde automatisch übernommen.\nRecovery-Ebene: gleicher Lauf\nVersuch: %s/3\n\n✅ Deine Trendfreigabe bleibt gültig.\n✅ Kein neues Go nötig.\n✅ Keine Aktion für dich.' "$next_attempt")
          curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" >/dev/null

      - name: Telegram fresh recovery generation status
        if: steps.fresh.outputs.started == 'true'
        env:
          GENERATION: ${{ steps.fresh.outputs.generation }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          message=$(printf '🛠️ TAYVORIQ technische Recovery wird fortgesetzt\n\nDie drei Same-Run-Versuche sind beendet. Der identische freigegebene Auftrag wurde jetzt auf dem aktuellen Code-Stand als Recovery-Generation %s/%s fortgesetzt.\n\n✅ Thema, Quellen und Freigabe bleiben erhalten.\n✅ Kein neues Go nötig.\n✅ Keine Aktion für dich.' "$GENERATION" "$MAX_RECOVERY_GENERATIONS")
          curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" >/dev/null

      - name: Telegram external action blocker
        if: steps.classify.outputs.external_blocker == 'true'
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          message=$(cat <<'EOF'
          ⚠️ TAYVORIQ braucht einmalig deine Hilfe

          Die autonome technische Recovery ist nicht der Blocker. Ein externer Zugang, Secret, Zahlungs- oder Berechtigungsstatus verhindert die Ausführung.

          Deine Trendfreigabe bleibt gespeichert. Nach Behebung wird derselbe Auftrag fortgesetzt; keine neue Themenfreigabe nötig.
          EOF
          )
          curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" >/dev/null

      - name: Telegram internal technical escalation
        if: steps.classify.outputs.needs_fresh_generation == 'true' && steps.fresh.outputs.started != 'true'
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          message=$(cat <<'EOF'
          🟣 TAYVORIQ technische Eskalation aktiv

          Die automatischen Recovery-Generationen haben ihren Sicherheitsrahmen erreicht. Der Auftrag und die Diagnosen bleiben vollständig erhalten; es wird nichts ungeprüft veröffentlicht.

          ✅ Deine Trendfreigabe bleibt gültig.
          ✅ Du musst den Fehler nicht analysieren oder GitHub bedienen.
          ✅ Keine neue Themenfreigabe nötig.
          EOF
          )
          curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" >/dev/null
