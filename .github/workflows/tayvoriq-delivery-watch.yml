name: TAYVORIQ Delivery Watch

on:
  workflow_run:
    workflows:
      - TAYVORIQ Deliver Video Now
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: tayvoriq-delivery-watch
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist final delivery state with self-heal
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Persist attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .github/run-now

            python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "run_id": int(os.environ["RUN_ID"]),
              "status": "completed",
              "conclusion": os.environ["RUN_CONCLUSION"],
              "url": os.environ["RUN_URL"],
              "completed_at": datetime.now(timezone.utc).isoformat(),
              "workflow": "TAYVORIQ Deliver Video Now",
          }
          Path(".github/run-now/latest-delivery-run.json").write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(payload)
          PY

            git add .github/run-now/latest-delivery-run.json
            if git diff --cached --quiet; then
              echo "Delivery state already current."
              exit 0
            fi

            git commit -m "ops: record completed TAYVORIQ delivery run"
            if git push origin HEAD:main; then
              echo "Delivery state persisted successfully."
              exit 0
            fi

            echo "Concurrent update detected; retrying."
            sleep $((attempt * 2))
          done

          echo "Unable to persist delivery state after 5 attempts."
          exit 1

      - name: Notify Telegram only when action is required
        if: github.event.workflow_run.conclusion != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          message=$(cat <<EOF
          ❌ TAYVORIQ-Produktion nicht abgeschlossen

          Status: ${RUN_CONCLUSION}
          Es wurde kein ungeprüftes Video zur Freigabe gesendet.

          Diagnose öffnen:
          ${RUN_URL}
          EOF
          )
          response=$(curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}")
          python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; print("telegram_message_id=" + str(data["result"]["message_id"]))' <<<"$response"
