name: TAYVORIQ Delivery Watch

on:
  workflow_run:
    workflows:
      - TAYVORIQ-X Golden Path
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed Golden Path run to recover
        required: true
        type: string

permissions:
  actions: write
  contents: write

# One recovery owner at a time. The scheduled continuity watchdog uses the same
# lock and therefore cannot race this immediate failure handler.
concurrency:
  group: tayvoriq-delivery-watch
  cancel-in-progress: false

jobs:
  classify-and-recover:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAX_RECOVERY_GENERATIONS: "4"
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve failed Golden Path run
        id: watched
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          INPUT_RUN_ID: ${{ inputs.run_id || '' }}
        run: |
          set -euo pipefail
          run_id=""
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            run_id="$EVENT_RUN_ID"
          else
            run_id="$INPUT_RUN_ID"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "RECOVERY_RUN_ID_INVALID:$run_id"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/watched-run.json
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          run=json.load(open('/tmp/watched-run.json', encoding='utf-8'))
          values={
              'run_id':str(run.get('id') or ''),
              'run_attempt':str(max(1, int(run.get('run_attempt') or 1))),
              'status':str(run.get('status') or ''),
              'conclusion':str(run.get('conclusion') or ''),
          }
          with open(sys.argv[1],'a',encoding='utf-8') as h:
              for key,value in values.items(): h.write(f'{key}={value}\n')
          print(values)
          PY

      - name: Resolve exact durable request owner
        id: owner
        shell: bash
        env:
          RUN_ID: ${{ steps.watched.outputs.run_id }}
        run: |
          set -euo pipefail
          # Request Pin and Delivery Watch are both emitted from workflow_run.
          # Give the binder a bounded window to persist the exact owner so this
          # canonical watch invocation never needs a second workflow dispatch.
          for poll in $(seq 1 20); do
            if python - <<'PY'
          import json, os
          from pathlib import Path
          run_id=int(os.environ['RUN_ID'])
          for path in Path('requests').glob('*.json'):
              try: data=json.loads(path.read_text(encoding='utf-8'))
              except Exception: continue
              ids=[data.get('golden_path_run_id'), *(data.get('previous_golden_path_run_ids') or [])]
              if any(str(value or '') == str(run_id) for value in ids):
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              break
            fi
            sleep 2
            git fetch origin main --quiet || true
            git reset --hard origin/main >/dev/null 2>&1 || true
          done
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          from pathlib import Path
          run_id=int(os.environ['RUN_ID'])
          matches=[]
          for path in sorted(Path('requests').glob('*.json')):
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              ids=[]
              for value in [data.get('golden_path_run_id'), *(data.get('previous_golden_path_run_ids') or [])]:
                  try: ids.append(int(value))
                  except (TypeError, ValueError): pass
              if run_id in ids:
                  matches.append((path,data))
          if not matches:
              values={'found':'false','is_current':'false','request_file':'','request_id':'','topic':'','trend_id':'','generation':'0'}
          else:
              matches.sort(key=lambda item: 0 if int(item[1].get('golden_path_run_id') or 0) == run_id else 1)
              path,data=matches[0]
              current=int(data.get('golden_path_run_id') or 0)
              values={
                  'found':'true',
                  'is_current':'true' if current == run_id else 'false',
                  'request_file':str(path),
                  'request_id':str(data.get('request_id') or '').strip(),
                  'topic':str(data.get('topic') or '').strip(),
                  'trend_id':str(data.get('trend_id') or '').strip(),
                  'generation':str(max(0, int(data.get('recovery_generation') or 0))),
              }
          with open(sys.argv[1],'a',encoding='utf-8') as h:
              for key,value in values.items(): h.write(f'{key}={value}\n')
          print(values)
          PY

      - name: Capture failed-run evidence
        if: steps.watched.outputs.conclusion != 'success'
        shell: bash
        env:
          RUN_ID: ${{ steps.watched.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --log-failed > /tmp/tayvoriq-failed.log 2>&1 || true
          test -f /tmp/tayvoriq-failed.log

      - name: Classify with shared recovery policy
        id: policy
        if: steps.watched.outputs.conclusion != 'success'
        shell: bash
        env:
          RUN_ATTEMPT: ${{ steps.watched.outputs.run_attempt }}
          GENERATION: ${{ steps.owner.outputs.generation }}
          OWNER_FOUND: ${{ steps.owner.outputs.found }}
          OWNER_CURRENT: ${{ steps.owner.outputs.is_current }}
        run: |
          set -euo pipefail
          exact_retry=false
          if [[ "${GENERATION:-0}" =~ ^[0-9]+$ ]] && [ "${GENERATION:-0}" -gt 0 ]; then exact_retry=true; fi
          python tools/tayvoriq_recovery_policy_v1.py \
            --logs-file /tmp/tayvoriq-failed.log \
            --run-attempt "${RUN_ATTEMPT:-1}" \
            --recovery-generation "${GENERATION:-0}" \
            --max-generations "$MAX_RECOVERY_GENERATIONS" \
            --owner-found "${OWNER_FOUND:-false}" \
            --owner-current "${OWNER_CURRENT:-false}" \
            --exact-request-retry "$exact_retry" \
            --output-json /tmp/recovery-policy.json
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data=json.load(open('/tmp/recovery-policy.json', encoding='utf-8'))
          with open(sys.argv[1],'a',encoding='utf-8') as h:
              for key in ('mode','state','retry_kind','failure_signature','reason'):
                  h.write(f'{key}={str(data.get(key) or "").replace(chr(10)," ")}\n')
              h.write(f'retry_allowed={str(bool(data.get("retry_allowed"))).lower()}\n')
              h.write(f'next_generation={"" if data.get("next_generation") is None else int(data["next_generation"])}\n')
          print(data)
          PY

      - name: Same-run retry for transient failure only
        if: steps.policy.outputs.mode == 'rerun' && steps.policy.outputs.retry_allowed == 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.watched.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run rerun "$RUN_ID" --failed
          echo "TRANSIENT_SAME_RUN_RETRY_REQUESTED:$RUN_ID"

      - name: Start bounded fresh request recovery
        id: fresh
        if: steps.policy.outputs.mode == 'fresh' && steps.policy.outputs.retry_allowed == 'true'
        shell: bash
        env:
          OLD_RUN_ID: ${{ steps.watched.outputs.run_id }}
          REQUEST_FILE: ${{ steps.owner.outputs.request_file }}
          REQUEST_ID: ${{ steps.owner.outputs.request_id }}
          TOPIC: ${{ steps.owner.outputs.topic }}
          TREND_ID: ${{ steps.owner.outputs.trend_id }}
          NEXT_GENERATION: ${{ steps.policy.outputs.next_generation }}
        run: |
          set -euo pipefail
          [[ "$NEXT_GENERATION" =~ ^[0-9]+$ ]] || { echo 'RECOVERY_GENERATION_INVALID'; exit 1; }
          [ "$NEXT_GENERATION" -le "$MAX_RECOVERY_GENERATIONS" ] || { echo 'RECOVERY_CIRCUIT_BREACH'; exit 1; }

          before_ids=$(gh run list --workflow tayvoriq-deliver-video-now.yml --event workflow_dispatch --limit 40 --json databaseId --jq '.[].databaseId' | tr '\n' ' ')
          dispatch_epoch=$(date +%s)
          gh workflow run tayvoriq-deliver-video-now.yml --ref main \
            -f "topic=$TOPIC" \
            -f "trend_id=$TREND_ID" \
            -f "source_request_id=$REQUEST_ID"

          new_run_id=""
          for poll in $(seq 1 30); do
            sleep 4
            gh run list --workflow tayvoriq-deliver-video-now.yml --event workflow_dispatch --limit 40 --json databaseId,createdAt > /tmp/recovery-runs.json
            candidate=$(python - "$before_ids" "$dispatch_epoch" <<'PY'
          import json, sys
          from datetime import datetime
          before={int(v) for v in sys.argv[1].split() if v.isdigit()}; epoch=int(sys.argv[2]); candidates=[]
          for item in json.load(open('/tmp/recovery-runs.json',encoding='utf-8')):
              try:
                  rid=int(item.get('databaseId') or 0)
                  created=datetime.fromisoformat(str(item.get('createdAt') or '').replace('Z','+00:00')).timestamp()
              except Exception:
                  continue
              if rid and rid not in before and created >= epoch - 5: candidates.append((created,rid))
          print(max(candidates)[1] if candidates else '')
          PY
            )
            if [[ "$candidate" =~ ^[0-9]+$ ]] && [ "$candidate" != "$OLD_RUN_ID" ]; then new_run_id="$candidate"; break; fi
          done
          [[ "$new_run_id" =~ ^[0-9]+$ ]] || { echo 'DELIVERY_RECOVERY_DISPATCH_NOT_VERIFIED'; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rebound=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - "$REQUEST_FILE" "$REQUEST_ID" "$OLD_RUN_ID" "$new_run_id" "$NEXT_GENERATION" "${{ steps.policy.outputs.failure_signature }}" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path(sys.argv[1]); request_id=sys.argv[2]; old_run=int(sys.argv[3]); new_run=int(sys.argv[4]); generation=int(sys.argv[5]); signature=sys.argv[6]
          data=json.loads(path.read_text(encoding='utf-8'))
          if str(data.get('request_id') or '').strip() != request_id: raise SystemExit('REQUEST_ID_CHANGED_DURING_RECOVERY')
          if int(data.get('golden_path_run_id') or 0) != old_run: raise SystemExit('REQUEST_ALREADY_REBOUND')
          previous=list(data.get('previous_golden_path_run_ids') or [])
          if old_run not in previous: previous.append(old_run)
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          data['previous_golden_path_run_ids']=previous[-20:]
          data['golden_path_run_id']=new_run
          data['status']='DISPATCHED'
          data['recovery_generation']=generation
          data['retry_of_run_id']=old_run
          data['replacement_reason']='BOUNDED_REQUEST_RECOVERY'
          data['recovery_owner']='tayvoriq-delivery-watch'
          data['recovery_failure_signature']=signature
          data['recovery_dispatched_at']=now
          data['state_history']=list(data.get('state_history') or []) + [{
              'state':'DISPATCHED','at':now,'actor':'tayvoriq-delivery-watch',
              'meta':{'retry_of_run_id':old_run,'golden_path_run_id':new_run,'recovery_generation':generation,'failure_signature':signature,'reason':'bounded-shared-policy-recovery'}
          }]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            git add -- "$REQUEST_FILE"
            git commit -m "ops: bounded delivery recovery ${REQUEST_ID} g${NEXT_GENERATION} to ${new_run_id}"
            if git push origin HEAD:main; then rebound=true; break; fi
            sleep $((attempt * 2))
          done
          [ "$rebound" = "true" ] || { echo 'DELIVERY_RECOVERY_BIND_FAILED'; exit 1; }
          echo "new_run_id=$new_run_id" >> "$GITHUB_OUTPUT"
          echo "generation=$NEXT_GENERATION" >> "$GITHUB_OUTPUT"

      - name: Telegram bounded recovery resumed
        if: steps.fresh.outputs.new_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '🔧 TAYVORIQ 60 %% · Recovery gezielt fortgesetzt\n\nThema: %s\nFehlgeschlagener Run: %s\nNeuer Recovery-Run: %s\nRecovery: Generation %s von %s\n\n✅ Derselbe Telegram-Auftrag und dieselben geprüften Quellen bleiben gebunden.\n✅ Der Retry wurde durch die zentrale Recovery-Policy freigegeben.\n➡️ Kein unbegrenzter Recovery-Loop.' \
            "${{ steps.owner.outputs.topic }}" "${{ steps.watched.outputs.run_id }}" "${{ steps.fresh.outputs.new_run_id }}" "${{ steps.fresh.outputs.generation }}" "$MAX_RECOVERY_GENERATIONS")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" >/dev/null

      - name: Telegram deterministic technical stop
        if: steps.policy.outputs.mode == 'deterministic'
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '🛑 TAYVORIQ · Technischer Recovery-Stopp\n\nThema: %s\nRun: %s\nFehlerklasse: %s\n\n✅ Auftrag, Freigabe und Quellen bleiben gespeichert.\n✅ Es wird kein identischer Produktions-Run erneut gestartet.\n➡️ Der deterministische Code-/Testfehler muss zuerst repariert werden; danach reicht ein gezielter Neustart.' \
            "${{ steps.owner.outputs.topic }}" "${{ steps.watched.outputs.run_id }}" "${{ steps.policy.outputs.state }}")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" >/dev/null

      - name: Telegram external blocker
        if: steps.policy.outputs.mode == 'external'
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '⚠️ TAYVORIQ braucht externe Hilfe\n\nThema: %s\nRun: %s\n\nEin Zugang, Secret, Zahlungs- oder Berechtigungsstatus blockiert den Auftrag. Es wird nicht blind weitergeretryt.' "${{ steps.owner.outputs.topic }}" "${{ steps.watched.outputs.run_id }}")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" >/dev/null

      - name: Telegram duplicate blocker
        if: steps.policy.outputs.mode == 'duplicate'
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '🛑 TAYVORIQ · Dublette verhindert\n\nThema: %s\nRun: %s\n\n✅ Es wurde nichts veröffentlicht.\n➡️ Für einen neu freigegebenen Inhalt ist ein klar unterscheidbarer Winkel nötig.' "${{ steps.owner.outputs.topic }}" "${{ steps.watched.outputs.run_id }}")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" >/dev/null

      - name: Telegram recovery circuit open
        if: steps.policy.outputs.mode == 'exhausted'
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '🛑 TAYVORIQ · Recovery-Circuit geöffnet\n\nThema: %s\nRun: %s\n\nNach maximal %s frischen Recovery-Generationen wird kein weiterer Produktions-Run erzeugt. Auftrag und Quellen bleiben erhalten.' "${{ steps.owner.outputs.topic }}" "${{ steps.watched.outputs.run_id }}" "$MAX_RECOVERY_GENERATIONS")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" >/dev/null

      - name: Record recovery decision
        if: always() && steps.policy.outputs.state != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "RECOVERY_DECISION run=${{ steps.watched.outputs.run_id }} request=${{ steps.owner.outputs.request_id }} mode=${{ steps.policy.outputs.mode }} state=${{ steps.policy.outputs.state }} signature=${{ steps.policy.outputs.failure_signature }} fresh_run=${{ steps.fresh.outputs.new_run_id }}"
