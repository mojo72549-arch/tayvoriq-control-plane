name: TAYVORIQ Delivery Watch

on:
  workflow_run:
    workflows:
      - TAYVORIQ Deliver Video Now
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: tayvoriq-delivery-watch-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Persist final delivery state
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          mkdir -p .github/run-now
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "run_id": int(os.environ["RUN_ID"]),
              "status": "completed",
              "conclusion": os.environ["RUN_CONCLUSION"],
              "url": os.environ["RUN_URL"],
              "completed_at": datetime.now(timezone.utc).isoformat(),
              "workflow": "TAYVORIQ Deliver Video Now",
          }
          Path(".github/run-now/latest-delivery-run.json").write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(payload)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/run-now/latest-delivery-run.json
          if ! git diff --cached --quiet; then
            git commit -m "ops: record completed TAYVORIQ delivery run"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Notify Telegram only when action is required
        if: github.event.workflow_run.conclusion != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          message=$(cat <<EOF
          ❌ TAYVORIQ-Produktion nicht abgeschlossen

          Status: ${RUN_CONCLUSION}
          Es wurde kein ungeprüftes Video zur Freigabe gesendet.

          Diagnose öffnen:
          ${RUN_URL}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            >/dev/null
