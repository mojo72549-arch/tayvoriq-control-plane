name: TAYVORIQ Delivery Watch

on:
  workflow_run:
    workflows:
      - TAYVORIQ-X Golden Path
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional failed Golden Path run; defaults to canonical active run
        required: false
        type: string
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-delivery-watch.yml
      - tools/tayvoriq_recovery_policy_v1.py

permissions:
  actions: write
  contents: write

# One recovery owner at a time. Delivery Watch and deterministic continuity share
# this lock, so a missed workflow_run event can be reconciled without duplicate
# recovery dispatches.
concurrency:
  group: tayvoriq-delivery-watch
  cancel-in-progress: false

jobs:
  classify-and-recover:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAX_RECOVERY_GENERATIONS: '4'
      ACTIVE_REQUEST_POINTER: .github/state/tayvoriq-active-production-request.json
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve canonical active owner
        id: owner
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          INPUT_RUN_ID: ${{ inputs.run_id || '' }}
        run: |
          set -euo pipefail
          python - "$ACTIVE_REQUEST_POINTER" "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          from pathlib import Path

          pointer_path=Path(sys.argv[1]); output=Path(sys.argv[2])
          out={
              'found':'false','request_file':'','request_id':'','topic':'','trend_id':'',
              'run_id':'','generation':'0','selection_id':'','telegram_message_id':'',
          }
          if not pointer_path.is_file():
              print('DELIVERY_WATCH_ACTIVE_POINTER_MISSING')
          else:
              try: pointer=json.loads(pointer_path.read_text(encoding='utf-8'))
              except Exception: pointer={}
              if pointer.get('schema')!='tayvoriq-active-production-request-v1' or pointer.get('state')!='ACTIVE':
                  print('DELIVERY_WATCH_ACTIVE_POINTER_INVALID')
              else:
                  request_id=str(pointer.get('request_id') or '').strip()
                  request_path=Path('requests')/f'{request_id}.json'
                  try: pointer_run=int(pointer.get('golden_path_run_id') or 0)
                  except (TypeError,ValueError): pointer_run=0
                  event_name=str(os.environ.get('EVENT_NAME') or '')
                  event_run=str(os.environ.get('EVENT_RUN_ID') or '').strip()
                  input_run=str(os.environ.get('INPUT_RUN_ID') or '').strip()
                  requested=pointer_run
                  if event_name=='workflow_run' and event_run.isdigit(): requested=int(event_run)
                  elif event_name=='workflow_dispatch' and input_run:
                      requested=int(input_run) if input_run.isdigit() else -1
                  if requested != pointer_run:
                      print(f'DELIVERY_WATCH_STALE_RUN_REJECTED:requested={requested}:active={pointer_run}')
                  elif request_id and pointer_run>0 and request_path.is_file():
                      try: data=json.loads(request_path.read_text(encoding='utf-8'))
                      except Exception: data={}
                      try: request_run=int(data.get('golden_path_run_id') or 0)
                      except (TypeError,ValueError): request_run=0
                      immutable_ok=True
                      for field in ('approval_key','source_context_sha256','contract_sha256'):
                          pv=str(pointer.get(field) or '').strip(); rv=str(data.get(field) or '').strip()
                          if pv and pv != rv: immutable_ok=False
                      telegram_bound=(str(data.get('source') or '').strip()=='telegram_trend_approval')
                      if (
                          str(data.get('request_id') or '').strip()==request_id
                          and str(data.get('status') or '')=='DISPATCHED'
                          and request_run==pointer_run
                          and immutable_ok and telegram_bound
                      ):
                          out.update({
                              'found':'true','request_file':str(request_path),'request_id':request_id,
                              'topic':str(data.get('topic') or '').strip(),
                              'trend_id':str(data.get('trend_id') or '').strip(),
                              'run_id':str(pointer_run),
                              'generation':str(max(0,int(data.get('recovery_generation') or 0))),
                              'selection_id':str(data.get('selection_id') or '').strip(),
                              'telegram_message_id':str(data.get('telegram_message_id') or '').strip(),
                          })
                      else:
                          print('DELIVERY_WATCH_ACTIVE_REQUEST_CONTRACT_MISMATCH')
          with output.open('a',encoding='utf-8') as h:
              for key,value in out.items(): h.write(f'{key}={value}\n')
          print(out)
          PY

      - name: Inspect active Golden Path
        id: watched
        if: steps.owner.outputs.found == 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.owner.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > /tmp/watched-run.json
          python - "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          run=json.load(open('/tmp/watched-run.json',encoding='utf-8'))
          name=str(run.get('name') or '')
          status=str(run.get('status') or '')
          conclusion=str(run.get('conclusion') or '')
          recoverable=(name=='TAYVORIQ-X Golden Path' and status=='completed' and conclusion!='success')
          values={
              'recoverable':str(recoverable).lower(),
              'run_id':str(run.get('id') or ''),
              'run_attempt':str(max(1,int(run.get('run_attempt') or 1))),
              'status':status,'conclusion':conclusion,
          }
          with open(sys.argv[1],'a',encoding='utf-8') as h:
              for key,value in values.items(): h.write(f'{key}={value}\n')
          print(values)
          PY

      - name: Capture failed-run evidence
        if: steps.watched.outputs.recoverable == 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.owner.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --log-failed > /tmp/tayvoriq-failed.log 2>&1 || true
          test -s /tmp/tayvoriq-failed.log || { echo 'DELIVERY_WATCH_FAILED_LOG_MISSING'; exit 1; }

      - name: Classify with shared recovery policy
        id: policy
        if: steps.watched.outputs.recoverable == 'true'
        shell: bash
        env:
          RUN_ATTEMPT: ${{ steps.watched.outputs.run_attempt }}
          GENERATION: ${{ steps.owner.outputs.generation }}
        run: |
          set -euo pipefail
          # The canonical pointer proves this is the exact Telegram-approved request,
          # even at generation 0 after a deterministic codefix replay.
          python tools/tayvoriq_recovery_policy_v1.py \
            --logs-file /tmp/tayvoriq-failed.log \
            --run-attempt "${RUN_ATTEMPT:-1}" \
            --recovery-generation "${GENERATION:-0}" \
            --max-generations "$MAX_RECOVERY_GENERATIONS" \
            --owner-found true \
            --owner-current true \
            --exact-request-retry true \
            --output-json /tmp/recovery-policy.json
          python - "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          data=json.load(open('/tmp/recovery-policy.json',encoding='utf-8'))
          with open(sys.argv[1],'a',encoding='utf-8') as h:
              for key in ('mode','state','retry_kind','failure_signature','reason'):
                  h.write(f'{key}={str(data.get(key) or "").replace(chr(10)," ")}\n')
              h.write(f'retry_allowed={str(bool(data.get("retry_allowed"))).lower()}\n')
              h.write(f'next_generation={"" if data.get("next_generation") is None else int(data["next_generation"])}\n')
          print(data)
          PY

      - name: Same-run retry for transient failure only
        if: steps.policy.outputs.mode == 'rerun' && steps.policy.outputs.retry_allowed == 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.owner.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run rerun "$RUN_ID" --failed
          echo "TRANSIENT_SAME_RUN_RETRY_REQUESTED:$RUN_ID"

      - name: Start bounded fresh request recovery
        id: fresh
        if: steps.policy.outputs.mode == 'fresh' && steps.policy.outputs.retry_allowed == 'true'
        shell: bash
        env:
          OLD_RUN_ID: ${{ steps.owner.outputs.run_id }}
          REQUEST_FILE: ${{ steps.owner.outputs.request_file }}
          REQUEST_ID: ${{ steps.owner.outputs.request_id }}
          TOPIC: ${{ steps.owner.outputs.topic }}
          TREND_ID: ${{ steps.owner.outputs.trend_id }}
          NEXT_GENERATION: ${{ steps.policy.outputs.next_generation }}
          FAILURE_SIGNATURE: ${{ steps.policy.outputs.failure_signature }}
        run: |
          set -euo pipefail
          [[ "$NEXT_GENERATION" =~ ^[0-9]+$ ]] || { echo 'RECOVERY_GENERATION_INVALID'; exit 1; }
          [ "$NEXT_GENERATION" -le "$MAX_RECOVERY_GENERATIONS" ] || { echo 'RECOVERY_CIRCUIT_BREACH'; exit 1; }

          # Close the race window before dispatch. Request and pointer must still
          # own exactly the failed run and immutable approval/source hashes.
          git fetch origin main --quiet
          git reset --hard origin/main
          python - "$ACTIVE_REQUEST_POINTER" "$REQUEST_FILE" "$REQUEST_ID" "$OLD_RUN_ID" <<'PY'
          import json,sys
          pointer=json.load(open(sys.argv[1],encoding='utf-8'))
          request=json.load(open(sys.argv[2],encoding='utf-8'))
          rid=sys.argv[3]; run=int(sys.argv[4])
          if pointer.get('state')!='ACTIVE' or str(pointer.get('request_id') or '')!=rid or int(pointer.get('golden_path_run_id') or 0)!=run:
              raise SystemExit('DELIVERY_RECOVERY_ACTIVE_OWNER_CHANGED')
          if str(request.get('request_id') or '')!=rid or int(request.get('golden_path_run_id') or 0)!=run:
              raise SystemExit('DELIVERY_RECOVERY_REQUEST_CHANGED')
          for field in ('approval_key','source_context_sha256','contract_sha256'):
              pv=str(pointer.get(field) or '').strip(); rv=str(request.get(field) or '').strip()
              if pv and pv!=rv: raise SystemExit(f'DELIVERY_RECOVERY_IMMUTABLE_MISMATCH:{field}')
          PY

          before_ids=$(gh run list --workflow tayvoriq-deliver-video-now.yml --event workflow_dispatch --limit 50 --json databaseId --jq '.[].databaseId' | tr '\n' ' ')
          dispatch_epoch=$(date +%s)
          gh workflow run tayvoriq-deliver-video-now.yml --ref main \
            -f "topic=$TOPIC" -f "trend_id=$TREND_ID" -f "source_request_id=$REQUEST_ID"

          new_run_id=''
          for poll in $(seq 1 30); do
            sleep 4
            gh run list --workflow tayvoriq-deliver-video-now.yml --event workflow_dispatch --limit 50 --json databaseId,createdAt > /tmp/recovery-runs.json
            candidate=$(python - "$before_ids" "$dispatch_epoch" <<'PY'
          import json,sys
          from datetime import datetime
          before={int(v) for v in sys.argv[1].split() if v.isdigit()}; epoch=int(sys.argv[2]); found=[]
          for item in json.load(open('/tmp/recovery-runs.json',encoding='utf-8')):
              try:
                  rid=int(item.get('databaseId') or 0)
                  created=datetime.fromisoformat(str(item.get('createdAt') or '').replace('Z','+00:00')).timestamp()
              except Exception: continue
              if rid and rid not in before and created>=epoch-5: found.append((created,rid))
          print(max(found)[1] if found else '')
          PY
            )
            if [[ "$candidate" =~ ^[0-9]+$ ]] && [ "$candidate" != "$OLD_RUN_ID" ]; then new_run_id="$candidate"; break; fi
          done
          [[ "$new_run_id" =~ ^[0-9]+$ ]] || { echo 'DELIVERY_RECOVERY_DISPATCH_NOT_VERIFIED'; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rebound=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            git reset --hard origin/main
            if python - "$ACTIVE_REQUEST_POINTER" "$REQUEST_FILE" "$REQUEST_ID" "$OLD_RUN_ID" "$new_run_id" "$NEXT_GENERATION" "$FAILURE_SIGNATURE" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          pp=Path(sys.argv[1]); rp=Path(sys.argv[2]); rid=sys.argv[3]
          old_run=int(sys.argv[4]); new_run=int(sys.argv[5]); generation=int(sys.argv[6]); signature=sys.argv[7]
          pointer=json.loads(pp.read_text(encoding='utf-8')); data=json.loads(rp.read_text(encoding='utf-8'))
          if pointer.get('state')!='ACTIVE' or str(pointer.get('request_id') or '')!=rid or int(pointer.get('golden_path_run_id') or 0)!=old_run:
              raise SystemExit('DELIVERY_RECOVERY_ACTIVE_OWNER_CHANGED')
          if str(data.get('request_id') or '')!=rid or int(data.get('golden_path_run_id') or 0)!=old_run:
              raise SystemExit('DELIVERY_RECOVERY_REQUEST_CHANGED')
          for field in ('approval_key','source_context_sha256','contract_sha256'):
              pv=str(pointer.get(field) or '').strip(); rv=str(data.get(field) or '').strip()
              if pv and pv!=rv: raise SystemExit(f'DELIVERY_RECOVERY_IMMUTABLE_MISMATCH:{field}')
          previous=list(data.get('previous_golden_path_run_ids') or [])
          if old_run not in previous: previous.append(old_run)
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          data['previous_golden_path_run_ids']=previous[-20:]
          data['golden_path_run_id']=new_run; data['status']='DISPATCHED'; data['recovery_generation']=generation
          data['retry_of_run_id']=old_run; data['replacement_reason']='BOUNDED_REQUEST_RECOVERY'
          data['recovery_owner']='tayvoriq-delivery-watch'; data['recovery_failure_signature']=signature; data['recovery_dispatched_at']=now
          codefix=data.get('codefix_recovery') if isinstance(data.get('codefix_recovery'),dict) else {}
          codefix.update({
              'status':'FRESH_RECOVERY_DISPATCHED','request_substate':'DISPATCHED',
              'fresh_recovery_run_id':new_run,'fresh_recovery_of_run_id':old_run,
              'fresh_recovery_generation':generation,'fresh_recovery_at':now,
              'quality_gates_weakened':False,'active_pointer_verified':True,
          })
          data['codefix_recovery']=codefix
          data['state_history']=list(data.get('state_history') or [])+[{
              'state':'DISPATCHED','at':now,'actor':'tayvoriq-delivery-watch',
              'meta':{'retry_of_run_id':old_run,'golden_path_run_id':new_run,'recovery_generation':generation,
                      'failure_signature':signature,'reason':'bounded-shared-policy-recovery',
                      'quality_gates_weakened':False,'active_pointer_verified':True}
          }]
          rp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pointer['golden_path_run_id']=new_run; pointer['updated_at']=now; pointer['reason']='bounded-request-recovery'
          pp.write_text(json.dumps(pointer,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            then
              git add -- "$REQUEST_FILE" "$ACTIVE_REQUEST_POINTER"
              git commit -m "ops: bounded active delivery recovery ${REQUEST_ID} g${NEXT_GENERATION} to ${new_run_id}"
              if git push origin HEAD:main; then rebound=true; break; fi
            else
              gh run cancel "$new_run_id" >/dev/null 2>&1 || true
              exit 1
            fi
            sleep $((attempt*2))
          done
          [ "$rebound" = 'true' ] || { gh run cancel "$new_run_id" >/dev/null 2>&1 || true; echo 'DELIVERY_RECOVERY_BIND_FAILED'; exit 1; }
          echo "new_run_id=$new_run_id" >> "$GITHUB_OUTPUT"
          echo "generation=$NEXT_GENERATION" >> "$GITHUB_OUTPUT"

      - name: Telegram bounded recovery resumed
        if: steps.fresh.outputs.new_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '🔧 TAYVORIQ 60 %% · Recovery gezielt fortgesetzt\n\nThema: %s\nFehlgeschlagener Run: %s\nNeuer Recovery-Run: %s\nRecovery: Generation %s von %s\n\n✅ Exakt derselbe Telegram-Auftrag und dieselben geprüften Quellen bleiben gebunden.\n✅ Request und Active-Pointer wurden gemeinsam auf den neuen Run gebunden.\n➡️ Produktion und Qualitätsprüfungen laufen automatisch weiter.' \
            "${{ steps.owner.outputs.topic }}" "${{ steps.owner.outputs.run_id }}" "${{ steps.fresh.outputs.new_run_id }}" "${{ steps.fresh.outputs.generation }}" "$MAX_RECOVERY_GENERATIONS")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" >/dev/null

      - name: Arm deterministic failure through canonical continuity helper
        if: steps.policy.outputs.mode == 'deterministic'
        shell: bash
        env:
          TAYVORIQ_RECOVERY_TARGET_REQUEST_ID: ${{ steps.owner.outputs.request_id }}
        run: |
          set -euo pipefail
          python -m py_compile tools/tayvoriq_codefix_orphan_reconcile_v1.py
          python tools/tayvoriq_codefix_orphan_reconcile_v1.py

      - name: Telegram external blocker
        if: steps.policy.outputs.mode == 'external'
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '⚠️ TAYVORIQ braucht externe Hilfe\n\nThema: %s\nRun: %s\n\nEin Zugang, Secret, Zahlungs- oder Berechtigungsstatus blockiert den aktiven Auftrag. Es wird nicht blind weitergeretryt.' "${{ steps.owner.outputs.topic }}" "${{ steps.owner.outputs.run_id }}")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" >/dev/null

      - name: Telegram duplicate blocker
        if: steps.policy.outputs.mode == 'duplicate'
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '⛔ TAYVORIQ · Dublette blockiert\n\nThema: %s\nRun: %s\n\nDer Dubletten-Schutz hat diesen aktiven Auftrag absichtlich gestoppt.' "${{ steps.owner.outputs.topic }}" "${{ steps.owner.outputs.run_id }}")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" >/dev/null

      - name: Recovery no-op truth
        if: steps.owner.outputs.found != 'true' || steps.watched.outputs.recoverable != 'true'
        shell: bash
        run: |
          echo 'DELIVERY_WATCH_NOOP_NO_FAILED_ACTIVE_REQUEST'
