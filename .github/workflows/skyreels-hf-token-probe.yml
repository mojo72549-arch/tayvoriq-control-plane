name: SkyReels HF Token Probe

on:
  push:
    branches:
      - lab/skyreels-v3-engine
    paths:
      - '.github/workflows/skyreels-hf-token-probe.yml'
      - 'lab/skyreels_v3_engine/hf-trigger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Hugging Face token without exposing it
        shell: bash
        run: |
          python -m pip install -q -U huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ.get('HF_TOKEN','').strip()
          if not token:
              raise SystemExit('HF_TOKEN_SECRET_NOT_AVAILABLE')
          info = HfApi().whoami(token=token)
          name = info.get('name') or info.get('fullname') or 'unknown'
          print(f'HF_TOKEN_OK user={name}')
          PY
