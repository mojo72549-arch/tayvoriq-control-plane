name: Export bound VW evidence for frame verification
on:
  push:
    branches: [codex/vw-45510042088-checkpoint-evidence]
    paths: [.github/workflows/tayvoriq-vw-checkpoint-evidence.yml]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        suffix: ['1', '3-post-local-repair']
    steps:
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: implementation/out/recovery-checkpoint
          key: tayvoriq-recovery-v1-Linux-1-91d55e03500a804d6a08f56215d5ee3e3ad2c3606c648e0f8d18cf74c6367cd2-45510042088-${{ matrix.suffix }}
          fail-on-cache-miss: true
      - name: Verify checkpoint identity and encrypt for the investigator
        env:
          EXACT_MATCH: ${{ steps.restore.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXACT_MATCH" = true
          checkpoint=implementation/out/recovery-checkpoint
          jq -e '.run_id | tostring == "45510042088"' "$checkpoint/meta.json" >/dev/null
          jq -e '.source_request_id == "telegram-3696-trend-1" and .implementation_sha == "5f9baa36075467dbea868a3066870645e2e4835a" and .source_context_sha256 == "91d55e03500a804d6a08f56215d5ee3e3ad2c3606c648e0f8d18cf74c6367cd2"' "$checkpoint/meta.json" >/dev/null
