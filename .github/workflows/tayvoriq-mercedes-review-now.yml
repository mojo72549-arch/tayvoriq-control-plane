name: TAYVORIQ Mercedes Review Now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-mercedes-review-now.yml

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
  TAYVORIQ_CLOUD_MODE: "true"
  TAYVORIQ_RENDER_SIZE: "1080x1920"
  TAYVORIQ_REQUIRE_REAL_VIDEO_SCENES: "true"
  TAYVORIQ_TTS_PROVIDER: "edge_tts"
  TAYVORIQ_CHATTERBOX_ENABLED: "false"
  TAYVORIQ_CHATTERBOX_REQUIRED: "false"
  TAYVORIQ_EMERGENCY_EDGE_REVIEW: "true"
  TAYVORIQ_EDGE_TTS_VOICE: "de-DE-ConradNeural"
  TAYVORIQ_EDGE_TTS_PITCH: "-3Hz"
  TAYVORIQ_NATURAL_VOICE_WPM: "132"
  TAYVORIQ_TELEGRAM_PROGRESS: "false"
  TAYVORIQ_SOURCE_CONTEXT_FILE: ${{ github.workspace }}/tayvoriq-source-context.json
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

jobs:
  review-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout exact Studio review implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: ad0127e8385a015dd7c56561d046d8cddc0c5b51
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Materialize exact approved Mercedes source context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          req = json.loads(Path("requests/telegram-3155-trend-1.json").read_text(encoding="utf-8"))
          assert req["request_id"] == "telegram-3155-trend-1"
          assert req["trend_id"] == "1"
          assert req["topic"] == "Mercedes: 38 Stunden ohne mehr Geld – und zwei Werke stehen zur Debatte"
          source = req["source_context"]
          assert source["quality_gates_weakened"] is False
          assert len(source["sources"]) >= 2
          Path("tayvoriq-source-context.json").write_text(
              json.dumps(source, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Install review dependencies without Chatterbox
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          grep -vE '^[[:space:]]*chatterbox-tts[[:space:]]*@' implementation/requirements.txt > /tmp/tayvoriq-review-requirements.txt
          python -m pip install -r /tmp/tayvoriq-review-requirements.txt pytest -q

      - name: Render exact Mercedes review candidate
        working-directory: implementation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/tayvoriq-youtube-tiktok out/review-site out/tayvoriq-self-heal
          set +e
          python tools/tayvoriq_autonomous_entrypoint.py \
            --trend-mode approved_trend \
            --trend-scope business_economy \
            --topic "Mercedes: 38 Stunden ohne mehr Geld – und zwei Werke stehen zur Debatte" \
            --language Deutsch \
            --platform youtube_tiktok \
            --target-duration 35 \
            --llm-provider auto \
            --outdir out/tayvoriq-youtube-tiktok \
            --site-root out/review-site \
            --run-id "${GITHUB_RUN_ID}" \
            --state-out out/tayvoriq-review-state.json \
            --report-out out/tayvoriq-self-heal/report.json \
            --request-out out/tayvoriq-self-heal/request.json \
            --max-runtime-attempts 1 \
            --self-heal-depth 0 \
            --target-branch feature/multi-platform-distribution-package \
            2>&1 | tee out/tayvoriq-self-heal/emergency-review-console.log
          echo "controller_exit=${PIPESTATUS[0]}"
          set -e

      - name: Collect rendered MP4s
        if: always()
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          find out/tayvoriq-youtube-tiktok -type f -name '*.mp4' -size +100k -print
          yt="$(find out/tayvoriq-youtube-tiktok -type f -name 'short_youtube.mp4' -size +100k -print -quit || true)"
          tt="$(find out/tayvoriq-youtube-tiktok -type f -name 'short_tiktok.mp4' -size +100k -print -quit || true)"
          any="$(find out/tayvoriq-youtube-tiktok -type f -name '*.mp4' -size +100k -print -quit || true)"
          [ -n "$yt" ] && cp "$yt" delivery/TAYVORIQ-Mercedes-YouTube-Review.mp4
          [ -n "$tt" ] && cp "$tt" delivery/TAYVORIQ-Mercedes-TikTok-Review.mp4
          if [ -z "$yt" ] && [ -z "$tt" ] && [ -n "$any" ]; then
            cp "$any" delivery/TAYVORIQ-Mercedes-Review.mp4
          fi
          test -n "$(find delivery -type f -name '*.mp4' -size +100k -print -quit)" || {
            echo "MERCEDES_REVIEW_MP4_NOT_RENDERED"
            exit 1
          }
          cp out/tayvoriq-self-heal/report.json delivery/report.json 2>/dev/null || true
          cp out/tayvoriq-self-heal/emergency-review-console.log delivery/render.log 2>/dev/null || true
          ls -lh delivery

      - name: Upload Mercedes review video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-mercedes-review-${{ github.run_id }}
          path: implementation/delivery/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
