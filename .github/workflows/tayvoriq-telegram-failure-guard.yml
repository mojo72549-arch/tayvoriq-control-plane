name: TAYVORIQ Telegram Failure Guard

on:
  workflow_run:
    workflows: ["TAYVORIQ-X Golden Path"]
    types: [completed]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  notify-failure:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source-run control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Send mandatory Telegram failure status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = str(os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = str(os.environ.get("TELEGRAM_CHAT_ID") or "").strip()
          run_id = str(os.environ.get("SOURCE_RUN_ID") or "").strip()
          run_attempt = str(os.environ.get("SOURCE_RUN_ATTEMPT") or "").strip()
          conclusion = str(os.environ.get("SOURCE_RUN_CONCLUSION") or "failure").strip()
          run_url = str(os.environ.get("SOURCE_RUN_URL") or "").strip()
          if not token or not chat_id:
              raise SystemExit("TELEGRAM_FAILURE_GUARD_SECRET_MISSING")

          topic = "Freigegebener TAYVORIQ-Auftrag"
          request_id = ""
          request_path = Path(".github/run-now/tayvoriq-x-request.json")
          if request_path.is_file():
              try:
                  request = json.loads(request_path.read_text(encoding="utf-8"))
                  candidate = " ".join(str(request.get("topic") or "").split()).strip()
                  if candidate:
                      topic = candidate[:180]
                  request_id = " ".join(str(request.get("source_request_id") or "").split()).strip()[:120]
              except Exception:
                  pass

          lines = [
              "🟠 TAYVORIQ · Technischer Stopp erkannt",
              "",
              f"Thema: {topic}",
              f"Run: {run_id}" + (f" · Versuch {run_attempt}" if run_attempt else ""),
              f"Status: {conclusion.upper()}",
          ]
          if request_id:
              lines.append(f"Request: {request_id}")
          lines += [
              "",
              "✅ Erledigt: Der fehlerhafte Produktionslauf wurde erkannt. Freigabe und vorhandene Artefakte bleiben erhalten; es wurde nichts veröffentlicht.",
              "➡️ Als Nächstes: Der Recovery-Pfad muss denselben gebundenen Request gezielt fortsetzen; keine neue Trendauswahl und kein Blind-Restart.",
              "",
              "Für dich: ✅ Keine Aktion nötig.",
          ]
          text = "\n".join(lines)
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              body = json.loads(response.read().decode("utf-8"))
          message_id = ((body.get("result") or {}).get("message_id") if isinstance(body, dict) else None)
          if body.get("ok") is not True or not message_id:
              raise SystemExit(f"TELEGRAM_FAILURE_GUARD_SEND_FAILED: {body!r}")
          receipt = {
              "source_run_id": run_id,
              "source_run_attempt": run_attempt,
              "source_run_conclusion": conclusion,
              "message_id": message_id,
              "request_id": request_id or None,
              "run_url": run_url or None,
          }
          print(json.dumps(receipt, ensure_ascii=False))
          PY
