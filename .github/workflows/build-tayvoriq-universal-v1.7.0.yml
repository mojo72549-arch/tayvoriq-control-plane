name: Build TAYVORIQ Universal Import v1.7.0

on:
  push:
    branches:
      - universal-import-v1.7.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Minecraft source untouched
        shell: bash
        run: |
          git fetch origin universal-import-v1.6.2:refs/remotes/origin/universal-import-v1.6.2
          git diff --exit-code origin/universal-import-v1.6.2 -- android-test-app/app/src/main/java/com/tayvoriq/addonmanager/FileImportActivity.java

      - name: Add isolated SFS routing
        shell: bash
        run: python3 .ci/patch_sfs_v170.py

      - name: Verify SFS safeguards
        shell: bash
        run: |
          grep -q 'inspection.sfsPackCount > 0' android-test-app/app/src/main/java/com/tayvoriq/addonmanager/FileImportActivity.java
          grep -q 'MessageDigest.getInstance("SHA-256")' android-test-app/app/src/main/java/com/tayvoriq/addonmanager/SfsPackImportActivity.java
          grep -q 'renameTo(backupName)' android-test-app/app/src/main/java/com/tayvoriq/addonmanager/SfsPackImportActivity.java
          grep -q 'PREF_SFS_PARTS_TREE' android-test-app/app/src/main/java/com/tayvoriq/addonmanager/SfsPackImportActivity.java
          grep -q 'PC-/ausführbarer Mod-Bestandteil' android-test-app/app/src/main/java/com/tayvoriq/addonmanager/SfsPackImportActivity.java
          grep -q 'Custom_Assets/Parts' android-test-app/app/src/main/java/com/tayvoriq/addonmanager/SfsPackImportActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build APK
        working-directory: android-test-app
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="android-test-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > android-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > android-manifest.txt
          grep -q "versionName='1.7.0-universal-import-debug'" android-badging.txt
          grep -q 'SfsPackImportActivity' android-manifest.txt
          grep -q 'com.StefMorojna.SpaceflightSimulator' android-manifest.txt
          grep -q '\\.pack' android-manifest.txt
          grep -q '\\.mcaddon' android-manifest.txt
          grep -q '\\.mcpack' android-manifest.txt
          grep -q '\\.mcworld' android-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p delivery
          cp "$APK" delivery/TAYVORIQ_Universal_Import_Android_v1.7.0.apk
          sha256sum delivery/TAYVORIQ_Universal_Import_Android_v1.7.0.apk > delivery/SHA256SUMS.txt
          ls -lh delivery

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAYVORIQ-Universal-Android-v1.7.0
          path: delivery/*
          if-no-files-found: error
          retention-days: 14
