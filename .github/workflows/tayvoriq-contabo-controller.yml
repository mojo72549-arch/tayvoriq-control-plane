name: TAYVORIQ Contabo Controller
run-name: ${{ inputs.orchestrator_decision_key && format('TAYVORIQ lifecycle {0}', inputs.orchestrator_decision_key) || format('TAYVORIQ Contabo {0}', inputs.source_request_id || 'telegram-3751-trend-1') }}
on:
  workflow_call:
    inputs:
      source_request_id:
        required: false
        type: string
      delivery_run_id:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      quality_parent_run_id:
        required: false
        type: string
      orchestrator_decision_key:
        required: false
        type: string
      visual_parent_run_id:
        required: false
        type: string
      source_request_id:
        required: true
        type: string
      delivery_run_id:
        required: false
        type: string
  push:
    branches: [main]
    paths: [.github/run-now/tayvoriq-contabo-kick.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: tayvoriq-contabo-controller
  cancel-in-progress: false
jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REQUEST_ID: ${{ inputs.source_request_id || '' }}
      DELIVERY_RUN_ID: ${{ inputs.delivery_run_id || '' }}
      VISUAL_PARENT_RUN_ID: ${{ inputs.visual_parent_run_id || '' }}
      QUALITY_PARENT_RUN_ID: ${{ inputs.quality_parent_run_id || '' }}
      ORCHESTRATOR_DECISION_KEY: ${{ inputs.orchestrator_decision_key || '' }}
      STUDIO: mojo72549-arch/shorts-agent-studio
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wait for the dispatcher to bind this exact run
        if: github.workflow == 'TAYVORIQ-X Golden Path' && env.REQUEST_ID != '' && env.DELIVERY_RUN_ID == ''
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            if python3 - <<'PY'
          import json, os
          from pathlib import Path

          request_id = os.environ['REQUEST_ID']
          run_id = int(os.environ['GITHUB_RUN_ID'])
          pointer = json.loads(Path('.github/state/tayvoriq-active-production-request.json').read_text())
          raise SystemExit(0 if (
              pointer.get('state') == 'ACTIVE'
              and pointer.get('request_id') == request_id
              and pointer.get('golden_path_run_id') == run_id
          ) else 1)
          PY
            then exit 0; fi
            sleep 5
          done
          echo 'The dispatcher did not bind the approved request to this run.'
          exit 1
      - name: Verify the original Telegram approval and source binding
        id: request
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from tools.tayvoriq_contabo_handoff import identity,verify
          kick=json.loads(Path('.github/run-now/tayvoriq-contabo-kick.json').read_text())
          rid=os.environ['REQUEST_ID'] or kick['source_request_id']
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write('REQUEST_ID='+rid+'\n')
          assert re.fullmatch(r'[A-Za-z0-9_-]{4,80}',rid)
          request=json.loads(Path(f'requests/{rid}.json').read_text())
          pointer=json.loads(Path('.github/state/tayvoriq-active-production-request.json').read_text())
          identity(request,pointer)
          assert pointer['state']=='ACTIVE'
          assert not request.get('production_completion',{}).get('telegram_message_id')
          from_kick=os.environ['GITHUB_EVENT_NAME']=='push' and not os.environ['REQUEST_ID']
          delivery=str(os.environ['DELIVERY_RUN_ID'] or (kick.get('delivery_run_id') if from_kick else '') or '')
          canonical_run=int(os.environ['GITHUB_RUN_ID'])
          if delivery:
              assert re.fullmatch(r'[0-9]+',delivery)
              canonical_run=int(delivery)
              verify(request,pointer,canonical_run,int(pointer['execution_run_id']))
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write('REVIEW_RUN_ID='+str(canonical_run)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('source_sha='+request['source_context_sha256']+'\n')
              out.write('trend_id='+request['trend_id']+'\n')
              out.write('old_run='+str(pointer['golden_path_run_id'])+'\n')
              out.write('delivery_only='+str(bool(delivery)).lower()+'\n')
              out.write('existing_worker='+str(pointer['execution_run_id'] if delivery else '')+'\n')
          PY
      - name: Record actual Contabo handoff preparation
        if: steps.request.outputs.delivery_only != 'true'
        env:
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            git reset --hard origin/main
            if [ -n "$QUALITY_PARENT_RUN_ID" ]; then
              PYTHONPATH=tools python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from tayvoriq_contabo_handoff import POINTER, prepare, read, write
          from tayvoriq_contabo_recovery_decision import contabo_decision, private_diagnostics

          parent = int(os.environ['QUALITY_PARENT_RUN_ID'])
          controller = int(os.environ['GITHUB_RUN_ID'])
          path = Path('requests') / (os.environ['REQUEST_ID'] + '.json')
          request, pointer = read(path), read(POINTER)
          assert pointer['golden_path_run_id'] == parent and not request.get('quality_recovery'), 'QUALITY_REPAIR_ALREADY_CLAIMED'
          base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/'
          run = json.loads(subprocess.check_output(['gh', 'api', base + str(parent)],
              env={**os.environ, 'GH_TOKEN': os.environ['CONTROL_TOKEN']}, text=True))
          plan = contabo_decision(pointer, request, run, read('.github/state/tayvoriq-production-green.json'),
              read(Path('run-status/contabo') / f'{parent}.json'),
              diagnostics=lambda worker: private_diagnostics(worker, os.environ['GH_TOKEN']))
          assert plan and plan['state'] == 'RETRY_ELIGIBLE' and plan['decision_key'] == os.environ['ORCHESTRATOR_DECISION_KEY'], 'QUALITY_REPAIR_PROOF_UNVERIFIED'
          prepare(request, pointer, controller)
          request['quality_recovery'] = {**plan, 'parent_run_id': parent, 'controller_run_id': controller}
          write(path, request)
          write(POINTER, pointer)
          PY
            elif [ -n "$VISUAL_PARENT_RUN_ID" ]; then
              PYTHONPATH=tools python3 - <<'PY'
          import os
          from pathlib import Path
          from tayvoriq_contabo_handoff import POINTER, prepare, read, write
          from tayvoriq_contabo_visual_recovery import plan

          controller = int(os.environ['GITHUB_RUN_ID'])
          proof = plan(Path('.'), os.environ['GITHUB_REPOSITORY'], os.environ['CONTROL_TOKEN'],
                       expected_run=int(os.environ['VISUAL_PARENT_RUN_ID']))
          assert proof and proof['request_id'] == os.environ['REQUEST_ID'], 'VISUAL_RECOVERY_ALREADY_CLAIMED_OR_UNVERIFIED'
          path = Path('requests') / (proof['request_id'] + '.json')
          request, pointer = read(path), read(POINTER)
          prepare(request, pointer, controller)
          request['visual_recovery'] = {**proof, 'controller_run_id':controller}
          write(path, request)
          write(POINTER, pointer)
          PY
            else
              python3 tools/tayvoriq_contabo_handoff.py prepare --request "requests/$REQUEST_ID.json" --controller "$GITHUB_RUN_ID" --worker 0
            fi
            git add "requests/$REQUEST_ID.json" .github/state/tayvoriq-active-production-request.json
            git commit -m "Record Contabo preparation for $REQUEST_ID"
            if git push origin HEAD:main;then exit 0;fi
          done
          exit 1
      - name: Cancel superseded public production for this exact request
        if: steps.request.outputs.delivery_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow tayvoriq-deliver-video-now.yml --limit 30 --json databaseId,displayTitle,status > /tmp/legacy-runs.json
          python3 - <<'PY'
          import json,os,subprocess
          for run in json.load(open('/tmp/legacy-runs.json')):
              if run['databaseId']!=int(os.environ['GITHUB_RUN_ID']) and run['displayTitle']=='TAYVORIQ request '+os.environ['REQUEST_ID'] and run['status'] in {'in_progress','queued','waiting','pending'}:
                  subprocess.run(['gh','run','cancel',str(run['databaseId']),'--repo',os.environ['GITHUB_REPOSITORY']],check=True)
          PY
      - name: Restore approved production results for migration
        if: steps.request.outputs.delivery_only != 'true'
        id: checkpoint
        uses: actions/cache/restore@v4
        with:
          path: implementation/out/recovery-checkpoint
          key: contabo-transfer-${{ github.run_id }}
          restore-keys: tayvoriq-recovery-v1-Linux-${{ steps.request.outputs.trend_id }}-${{ steps.request.outputs.source_sha }}-
      - name: Transfer the exact checkpoint to the private execution repository
        if: steps.request.outputs.delivery_only != 'true'
        id: transfer
        run: |
          if [ ! -f implementation/out/recovery-checkpoint/meta.json ]; then
            echo "release=" >> "$GITHUB_OUTPUT"
            echo 'No legacy media: the private worker will validate its own source-bound cache or a fresh approved request.'
            exit 0
          fi
          python3 - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          root=Path('implementation/out/recovery-checkpoint')
          meta=json.loads((root/'meta.json').read_text())
          request=json.loads(Path('requests/'+os.environ['REQUEST_ID']+'.json').read_text())
          assert meta['source_context_sha256']==request['source_context_sha256']
          assert meta['source_request_id']==request['request_id']
          assert meta['quality_gates_weakened'] is False
          print('Checkpoint metadata verified for transfer')
          with zipfile.ZipFile('/tmp/checkpoint.zip','w',compression=zipfile.ZIP_STORED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and not p.is_symlink():z.write(p,p.relative_to(root))
          PY
          echo "release=artifact:$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Store the verified checkpoint for the private worker
        if: steps.transfer.outputs.release != ''
        uses: actions/upload-artifact@v4
        with:
          name: contabo-checkpoint
          path: /tmp/checkpoint.zip
          retention-days: 7
          if-no-files-found: error
      - name: Queue exactly one private Contabo worker
        if: steps.request.outputs.delivery_only != 'true'
        id: worker
        env:
          RELEASE: ${{ steps.transfer.outputs.release }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=dict(schema='tayvoriq-contabo-queue-v1',state='PENDING',request_id=os.environ['REQUEST_ID'],
            controller_run_id=int(os.environ['GITHUB_RUN_ID']),checkpoint_release=os.environ['RELEASE'],
            source_context_sha256=os.environ['SOURCE_SHA'],quality_gates_weakened=False)
          Path('.github/state/tayvoriq-contabo-queue.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
          git add .github/state/tayvoriq-contabo-queue.json
          git commit -m "Queue private Contabo computation for $REQUEST_ID"
          git pull --rebase origin main
          git push origin HEAD:main
          # The persisted public queue is authoritative. If the existing
          # credential can write private contents, wake its worker immediately.
          # A read-only credential leaves the scheduled consumer in charge.
          python3 - <<'PY'
          import base64, json, os, subprocess

          repository = os.environ['STUDIO']
          endpoint = f'repos/{repository}/contents/.automation/contabo-wakeup.json'
          details = json.dumps({'controller_run_id':int(os.environ['GITHUB_RUN_ID']),
                                'request_id':os.environ['REQUEST_ID'], 'reason':'verified-controller-queue'})
          try:
              response = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True, timeout=12)
              if response.returncode == 0:
                  previous = json.loads(response.stdout)
                  wakeup = json.loads(base64.b64decode(previous['content']))
                  if wakeup.get('controller_run_id') == int(os.environ['GITHUB_RUN_ID']):
                      raise SystemExit(0)
              elif '404' in response.stderr:
                  previous = {}
              else:
                  raise RuntimeError('private wakeup cannot be read')
              body = {'branch':'main', 'message':'Wake private Contabo worker for a verified queue item',
                      'content':base64.b64encode(details.encode()).decode()}
              if previous.get('sha'):
                  body['sha'] = previous['sha']
              subprocess.run(['gh', 'api', '--method', 'PUT', endpoint, '--input', '-'],
                             input=json.dumps(body), text=True, capture_output=True, check=True, timeout=12)
              print('CONTABO_PRIVATE_WAKEUP_CONFIRMED')
          except (subprocess.SubprocessError, ValueError, KeyError, RuntimeError):
              print('CONTABO_PRIVATE_WAKEUP_DEFERRED_TO_SCHEDULE')
          PY
          for poll in $(seq 1 180); do
            if gh api "repos/$STUDIO/contents/.automation/contabo-workers/$GITHUB_RUN_ID.json" --jq '.content' > /tmp/contabo-receipt-base64 2>/dev/null;then
              python3 - <<'PY' > /tmp/contabo-worker-id
          import json,base64,os
          d=json.loads(base64.b64decode(open('/tmp/contabo-receipt-base64').read()))
          assert d['request_id']==os.environ['REQUEST_ID']
          assert d['controller_run_id']==int(os.environ['GITHUB_RUN_ID'])
          assert d['source_context_sha256']==os.environ['SOURCE_SHA']
          print(int(d['worker_run_id']))
          PY
              worker=$(cat /tmp/contabo-worker-id)
              if [[ "$worker" =~ ^[0-9]+$ ]];then echo "run_id=$worker" >> "$GITHUB_OUTPUT";exit 0;fi
            fi
            sleep 5
          done
          echo 'No private worker accepted the exact queued request.'
          exit 1
      - name: Bind controller and private worker to the canonical request
        if: steps.request.outputs.delivery_only != 'true'
        env:
          WORKER: ${{ steps.worker.outputs.run_id }}
          RELEASE: ${{ steps.transfer.outputs.release }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            git reset --hard origin/main
            python3 tools/tayvoriq_contabo_handoff.py bind --request "requests/$REQUEST_ID.json" --controller "$GITHUB_RUN_ID" --worker "$WORKER" --release "$RELEASE"
            git add "requests/$REQUEST_ID.json" .github/state/tayvoriq-active-production-request.json
            git commit -m "Bind Contabo worker $WORKER to canonical controller $GITHUB_RUN_ID"
            if git push origin HEAD:main;then exit 0;fi
          done
          exit 1
      - name: Monitor the private worker receipt
        if: steps.request.outputs.delivery_only != 'true'
        env:
          WORKER: ${{ steps.worker.outputs.run_id }}
          CONTABO_CONTROL_TOKEN: ${{ github.token }}
        run: |
          for poll in $(seq 1 160); do
            gh api "repos/$STUDIO/contents/.automation/contabo-workers/$GITHUB_RUN_ID.json" --jq '.content' > /tmp/contabo-receipt-base64
            python3 tools/tayvoriq_contabo_observation.py
            result=$(python3 - <<'PY'
          import json,base64,os
          d=json.loads(base64.b64decode(open('/tmp/contabo-receipt-base64').read()))
          assert d['controller_run_id']==int(os.environ['GITHUB_RUN_ID']) and d['worker_run_id']==int(os.environ['WORKER'])
          print(d['status'])
          PY
            )
            if [ "$result" = SUCCEEDED ];then exit 0;fi
            if [ "$result" = FAILED ];then echo 'Private compute reported a verified failure.';exit 1;fi
            sleep 15
          done
          exit 1
      - name: Receive the request-bound Contabo review package
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          WORKER: ${{ steps.request.outputs.existing_worker || steps.worker.outputs.run_id }}
        run: |
          mkdir -p returned
          gh api "repos/$STUDIO/contents/.automation/contabo-workers/$REVIEW_RUN_ID.json" --jq '.content' > /tmp/contabo-delivery-receipt
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          receipt=json.loads(base64.b64decode(Path('/tmp/contabo-delivery-receipt').read_text()))
          assert receipt['schema']=='tayvoriq-contabo-worker-v1' and receipt['status']=='SUCCEEDED'
          assert receipt['request_id']==os.environ['REQUEST_ID']
          assert receipt['source_context_sha256']==os.environ['SOURCE_SHA']
          assert receipt['controller_run_id']==int(os.environ['REVIEW_RUN_ID'])
          assert receipt['worker_run_id']==int(os.environ['WORKER'])
          assert receipt['result_release']=='contabo-result-'+os.environ['REVIEW_RUN_ID']
          PY
          bash tools/tayvoriq_download_contabo_result.sh "$STUDIO" "$REVIEW_RUN_ID" /tmp/result.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          target=Path('returned').resolve()
          with zipfile.ZipFile('/tmp/result.zip') as z:
              for item in z.infolist():assert (target/item.filename).resolve().is_relative_to(target)
              z.extractall(target)
          PY
      - name: Assert immutable result and final quality proof
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('returned/out/control-plane/contabo-result.json')
          d=json.loads(p.read_text())
          assert d['schema']=='tayvoriq-contabo-result-v1'
          assert d['request_id']==os.environ['REQUEST_ID']
          assert str(d['run_id'])==os.environ['REVIEW_RUN_ID']
          assert d['source_context_sha256']==os.environ['SOURCE_SHA']
          assert d['quality_passed'] is True and d['quality_gates_weakened'] is False
          root=Path('returned/site/tayvoriq/runs')/os.environ['REVIEW_RUN_ID']
          assert (root/'short_youtube.mp4').stat().st_size>500000
          assert (root/'short_tiktok.mp4').stat().st_size>500000
          PY
      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
      - name: Publish review page
        run: |
          mkdir -p pages-worktree/tayvoriq
          rsync -a returned/site/tayvoriq/ pages-worktree/tayvoriq/
          cd pages-worktree
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tayvoriq
          if ! git diff --cached --quiet; then
            git commit -m "Publish strictly verified Contabo review $REVIEW_RUN_ID"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Checkout verified delivery implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: 798c9f3ed8d1a20291b73e3ea4b0cc7ba5a9ac73
          path: implementation-delivery
      - name: Send Telegram review
        id: telegram
        env:
          PYTHONPATH: implementation-delivery/tools
        run: |
          python3 -m pip install requests
          python3 - <<'PY'
          import os
          from tayvoriq_send_telegram import send_status
          run=os.environ['REVIEW_RUN_ID']
          message=send_status(state='SUCCESS',conclusion='success',run_url='',review_id=run,
              review_url=f'https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/{run}/',approval_mode='manual',video_path=__import__('pathlib').Path('returned/site/tayvoriq/runs')/run/'short_youtube.mp4')
          assert type(message) is int and message>0
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('message_id='+str(message)+'\n')
          PY
      - name: Finalize verified review delivery
        env:
          WORKER: ${{ steps.request.outputs.existing_worker || steps.worker.outputs.run_id }}
          MESSAGE: ${{ steps.telegram.outputs.message_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 tools/tayvoriq_contabo_handoff.py finalize --request "requests/$REQUEST_ID.json" --controller "$REVIEW_RUN_ID" --worker "$WORKER" --message "$MESSAGE" --delivery-run "$GITHUB_RUN_ID"
          git add "requests/$REQUEST_ID.json" .github/state/tayvoriq-active-production-request.json
          git commit -m "Verify Contabo review delivered for $REQUEST_ID"
          git push origin HEAD:main

      - name: Explain a verified stop in both control channels
        if: failure() && ((env.VISUAL_PARENT_RUN_ID == '' && env.QUALITY_PARENT_RUN_ID == '') || steps.worker.outcome == 'success' || steps.worker.outcome == 'failure')
        env:
          TRANSFER_OUTCOME: ${{ steps.transfer.outcome }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
          WORKER_ID: ${{ steps.request.outputs.existing_worker || steps.worker.outputs.run_id }}
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,subprocess,base64
          from pathlib import Path
          rid=os.environ['REQUEST_ID']
          request=json.loads(Path('requests/'+rid+'.json').read_text())
          run=os.environ.get('REVIEW_RUN_ID') or os.environ['GITHUB_RUN_ID']
          mirrored_worker_stop=False
          transfer=os.environ['TRANSFER_OUTCOME']=='failure'
          reason='Der gespeicherte Produktionsstand konnte nicht an Contabo übergeben werden.' if transfer else 'Die Contabo-Produktion oder ihre abschließende Zustellung ist angehalten.'
          if os.environ.get('WORKER_ID'):
              try:
                  meta=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['STUDIO']+'/contents/.automation/contabo-workers/'+run+'.json'],text=True))
                  receipt=json.loads(base64.b64decode(meta['content']))
                  if (receipt['controller_run_id']==int(run) and receipt['request_id']==rid
                      and str(receipt['worker_run_id'])==os.environ['WORKER_ID']
                      and receipt['source_context_sha256']==request['source_context_sha256']):
                      reason=receipt.get('failure_reason') or reason
                      mirrored_worker_stop=receipt.get('status')=='FAILED'
              except Exception:pass
          detail={'schema':'tayvoriq-execution-incident-v1','request_id':rid,'source_context_sha256':request['source_context_sha256'],
            'run_id':int(run),'code':'CHECKPOINT_TRANSFER_FAILED' if transfer else 'CONTABO_EXECUTION_STOPPED',
            'cause':reason,'action':'Der Lauf ist gestoppt. Der fehlgeschlagene Schritt muss korrigiert und verifiziert werden.',
            'next_proof':'Bestätigte Übernahme des Produktionsstands und anschließende Qualitätsprüfung.',
            'user_action_required':False,'quality_gates_weakened':False}
          path=Path('state/tayvoriq-execution-incidents')/(rid+'.json');path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(detail,ensure_ascii=False,indent=2)+'\n')
          if mirrored_worker_stop:
              from tools.tayvoriq_contabo_observation import notify
              if notify({},receipt,os.environ['CONTROL_TOKEN']):
                  raise SystemExit(0)
          token=os.environ['TELEGRAM_BOT_TOKEN'];chat=os.environ['TELEGRAM_CHAT_ID']
          data=json.dumps({'chat_id':chat,'text':'🔴 TAYVORIQ · Technischer Lauf angehalten\n\nUrsache: '+reason+'\nMaßnahme: '+detail['action']+'\nNoch offen: '+detail['next_proof']+'\nRequest: '+rid+'\nRun: '+run}).encode()
          with urllib.request.urlopen(urllib.request.Request('https://api.telegram.org/bot'+token+'/sendMessage',data=data,headers={'Content-Type':'application/json'}),timeout=30) as r:
              assert json.load(r).get('ok') is True
          PY
