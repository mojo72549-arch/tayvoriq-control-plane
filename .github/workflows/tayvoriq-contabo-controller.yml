name: TAYVORIQ Contabo Controller
run-name: TAYVORIQ Contabo ${{ inputs.source_request_id || 'telegram-3751-trend-1' }}
on:
  workflow_call:
    inputs:
      source_request_id:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_request_id:
        required: true
        type: string
  push:
    branches: [main]
    paths: [.github/run-now/tayvoriq-contabo-kick.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: tayvoriq-contabo-controller
  cancel-in-progress: false
jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REQUEST_ID: ${{ inputs.source_request_id || '' }}
      STUDIO: mojo72549-arch/shorts-agent-studio
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify the original Telegram approval and source binding
        id: request
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from tools.tayvoriq_contabo_handoff import identity
          rid=os.environ['REQUEST_ID'] or json.loads(Path('.github/run-now/tayvoriq-contabo-kick.json').read_text())['source_request_id']
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write('REQUEST_ID='+rid+'\n')
          assert re.fullmatch(r'[A-Za-z0-9_-]{4,80}',rid)
          request=json.loads(Path(f'requests/{rid}.json').read_text())
          pointer=json.loads(Path('.github/state/tayvoriq-active-production-request.json').read_text())
          identity(request,pointer)
          assert pointer['state']=='ACTIVE'
          assert not request.get('production_completion',{}).get('telegram_message_id')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('source_sha='+request['source_context_sha256']+'\n')
              out.write('trend_id='+request['trend_id']+'\n')
              out.write('old_run='+str(pointer['golden_path_run_id'])+'\n')
          PY
      - name: Record actual Contabo handoff preparation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            git reset --hard origin/main
            python3 tools/tayvoriq_contabo_handoff.py prepare --request "requests/$REQUEST_ID.json" --controller "$GITHUB_RUN_ID" --worker 0
            git add "requests/$REQUEST_ID.json" .github/state/tayvoriq-active-production-request.json
            git commit -m "Record Contabo preparation for $REQUEST_ID"
            if git push origin HEAD:main;then exit 0;fi
          done
          exit 1
      - name: Cancel superseded public production for this exact request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow tayvoriq-deliver-video-now.yml --limit 30 --json databaseId,displayTitle,status > /tmp/legacy-runs.json
          python3 - <<'PY'
          import json,os,subprocess
          for run in json.load(open('/tmp/legacy-runs.json')):
              if run['databaseId']!=int(os.environ['GITHUB_RUN_ID']) and run['displayTitle']=='TAYVORIQ request '+os.environ['REQUEST_ID'] and run['status'] in {'in_progress','queued','waiting','pending'}:
                  subprocess.run(['gh','run','cancel',str(run['databaseId']),'--repo',os.environ['GITHUB_REPOSITORY']],check=True)
          PY
      - name: Restore approved production results for migration
        id: checkpoint
        uses: actions/cache/restore@v4
        with:
          path: implementation/out/recovery-checkpoint
          key: contabo-transfer-${{ github.run_id }}
          restore-keys: tayvoriq-recovery-v1-Linux-${{ steps.request.outputs.trend_id }}-${{ steps.request.outputs.source_sha }}-
      - name: Transfer the exact checkpoint to the private execution repository
        id: transfer
        run: |
          if python3 - <<'PRIVATE_CACHE'
          import json,os
          from pathlib import Path
          r=json.loads(Path('requests/'+os.environ['REQUEST_ID']+'.json').read_text())
          raise SystemExit(0 if r.get('contabo_handoff',{}).get('worker_run_id') else 1)
          PRIVATE_CACHE
          then
            echo "release=" >> "$GITHUB_OUTPUT"
            echo 'Reuse the private source-bound post-repair cache; do not replace it with an older migration checkpoint.'
            exit 0
          fi
          if [ ! -f implementation/out/recovery-checkpoint/meta.json ]; then
            echo "release=" >> "$GITHUB_OUTPUT"
            echo 'No legacy media: the private worker will validate its own source-bound cache or a fresh approved request.'
            exit 0
          fi
          python3 - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          root=Path('implementation/out/recovery-checkpoint')
          meta=json.loads((root/'meta.json').read_text())
          request=json.loads(Path('requests/'+os.environ['REQUEST_ID']+'.json').read_text())
          assert meta['source_context_sha256']==request['source_context_sha256']
          assert meta['source_request_id']==request['request_id']
          assert meta['quality_gates_weakened'] is False
          print('Checkpoint metadata verified for transfer')
          with zipfile.ZipFile('/tmp/checkpoint.zip','w',compression=zipfile.ZIP_STORED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and not p.is_symlink():z.write(p,p.relative_to(root))
          PY
          echo "release=artifact:$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Store the verified checkpoint for the private worker
        if: steps.transfer.outputs.release != ''
        uses: actions/upload-artifact@v4
        with:
          name: contabo-checkpoint
          path: /tmp/checkpoint.zip
          retention-days: 7
          if-no-files-found: error
      - name: Queue exactly one private Contabo worker
        id: worker
        env:
          RELEASE: ${{ steps.transfer.outputs.release }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=dict(schema='tayvoriq-contabo-queue-v1',state='PENDING',request_id=os.environ['REQUEST_ID'],
            controller_run_id=int(os.environ['GITHUB_RUN_ID']),checkpoint_release=os.environ['RELEASE'],
            source_context_sha256=os.environ['SOURCE_SHA'],quality_gates_weakened=False)
          Path('.github/state/tayvoriq-contabo-queue.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
          git add .github/state/tayvoriq-contabo-queue.json
          git commit -m "Queue private Contabo computation for $REQUEST_ID"
          git pull --rebase origin main
          git push origin HEAD:main
          for poll in $(seq 1 180); do
            if gh api "repos/$STUDIO/contents/.automation/contabo-workers/$GITHUB_RUN_ID.json" --jq '.content' > /tmp/contabo-receipt-base64 2>/dev/null;then
              python3 - <<'PY' > /tmp/contabo-worker-id
          import json,base64,os
          d=json.loads(base64.b64decode(open('/tmp/contabo-receipt-base64').read()))
          assert d['request_id']==os.environ['REQUEST_ID']
          assert d['controller_run_id']==int(os.environ['GITHUB_RUN_ID'])
          assert d['source_context_sha256']==os.environ['SOURCE_SHA']
          print(int(d['worker_run_id']))
          PY
              worker=$(cat /tmp/contabo-worker-id)
              if [[ "$worker" =~ ^[0-9]+$ ]];then echo "run_id=$worker" >> "$GITHUB_OUTPUT";exit 0;fi
            fi
            sleep 5
          done
          echo 'No private worker accepted the exact queued request.'
          exit 1
      - name: Bind controller and private worker to the canonical request
        env:
          WORKER: ${{ steps.worker.outputs.run_id }}
          RELEASE: ${{ steps.transfer.outputs.release }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            git reset --hard origin/main
            python3 tools/tayvoriq_contabo_handoff.py bind --request "requests/$REQUEST_ID.json" --controller "$GITHUB_RUN_ID" --worker "$WORKER" --release "$RELEASE"
            git add "requests/$REQUEST_ID.json" .github/state/tayvoriq-active-production-request.json
            git commit -m "Bind Contabo worker $WORKER to canonical controller $GITHUB_RUN_ID"
            if git push origin HEAD:main;then exit 0;fi
          done
          exit 1
      - name: Monitor the private worker receipt
        env:
          WORKER: ${{ steps.worker.outputs.run_id }}
          CONTABO_CONTROL_TOKEN: ${{ github.token }}
        run: |
          for poll in $(seq 1 160); do
            gh api "repos/$STUDIO/contents/.automation/contabo-workers/$GITHUB_RUN_ID.json" --jq '.content' > /tmp/contabo-receipt-base64
            python3 tools/tayvoriq_contabo_observation.py
            result=$(python3 - <<'PY'
          import json,base64,os
          d=json.loads(base64.b64decode(open('/tmp/contabo-receipt-base64').read()))
          assert d['controller_run_id']==int(os.environ['GITHUB_RUN_ID']) and d['worker_run_id']==int(os.environ['WORKER'])
          print(d['status'])
          PY
            )
            if [ "$result" = SUCCEEDED ];then exit 0;fi
            if [ "$result" = FAILED ];then echo 'Private compute reported a verified failure.';exit 1;fi
            sleep 15
          done
          exit 1
      - name: Receive the request-bound Contabo review package
        run: |
          mkdir -p returned
          gh release download "contabo-result-$GITHUB_RUN_ID" --repo "$STUDIO" --pattern result.zip --dir /tmp
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          target=Path('returned').resolve()
          with zipfile.ZipFile('/tmp/result.zip') as z:
              for item in z.infolist():assert (target/item.filename).resolve().is_relative_to(target)
              z.extractall(target)
          PY
      - name: Assert immutable result and final quality proof
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('returned/out/control-plane/contabo-result.json')
          d=json.loads(p.read_text())
          assert d['schema']=='tayvoriq-contabo-result-v1'
          assert d['request_id']==os.environ['REQUEST_ID']
          assert str(d['run_id'])==os.environ['GITHUB_RUN_ID']
          assert d['source_context_sha256']==os.environ['SOURCE_SHA']
          assert d['quality_passed'] is True and d['quality_gates_weakened'] is False
          root=Path('returned/site/tayvoriq/runs')/os.environ['GITHUB_RUN_ID']
          assert (root/'short_youtube.mp4').stat().st_size>500000
          assert (root/'short_tiktok.mp4').stat().st_size>500000
          PY
      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
      - name: Publish review page
        run: |
          mkdir -p pages-worktree/tayvoriq
          rsync -a returned/site/tayvoriq/ pages-worktree/tayvoriq/
          cd pages-worktree
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tayvoriq
          git commit -m "Publish strictly verified Contabo review $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Checkout verified delivery implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: 798c9f3ed8d1a20291b73e3ea4b0cc7ba5a9ac73
          path: implementation-delivery
      - name: Send Telegram review
        id: telegram
        env:
          PYTHONPATH: implementation-delivery/tools
        run: |
          python3 -m pip install requests
          python3 - <<'PY'
          import os
          from tayvoriq_send_telegram import send_status
          run=os.environ['GITHUB_RUN_ID']
          message=send_status(state='SUCCESS',conclusion='success',run_url='',review_id=run,
              review_url=f'https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/{run}/',approval_mode='manual',video_path=__import__('pathlib').Path('returned/site/tayvoriq/runs')/run/'short_youtube.mp4')
          assert type(message) is int and message>0
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('message_id='+str(message)+'\n')
          PY
      - name: Finalize verified review delivery
        env:
          WORKER: ${{ steps.worker.outputs.run_id }}
          MESSAGE: ${{ steps.telegram.outputs.message_id }}
        run: |
          git pull --rebase origin main
          python3 tools/tayvoriq_contabo_handoff.py finalize --request "requests/$REQUEST_ID.json" --controller "$GITHUB_RUN_ID" --worker "$WORKER" --message "$MESSAGE"
          git add "requests/$REQUEST_ID.json" .github/state/tayvoriq-active-production-request.json
          git commit -m "Verify Contabo review delivered for $REQUEST_ID"
          git push origin HEAD:main

      - name: Explain a verified stop in both control channels
        if: failure()
        env:
          TRANSFER_OUTCOME: ${{ steps.transfer.outcome }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
          WORKER_ID: ${{ steps.worker.outputs.run_id }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,subprocess,base64
          from pathlib import Path
          rid=os.environ['REQUEST_ID']
          request=json.loads(Path('requests/'+rid+'.json').read_text())
          transfer=os.environ['TRANSFER_OUTCOME']=='failure'
          reason='Der gespeicherte Produktionsstand konnte nicht an Contabo übergeben werden.' if transfer else 'Die Contabo-Produktion oder ihre abschließende Zustellung ist angehalten.'
          if os.environ.get('WORKER_ID'):
              try:
                  meta=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['STUDIO']+'/contents/.automation/contabo-workers/'+os.environ['GITHUB_RUN_ID']+'.json'],text=True))
                  receipt=json.loads(base64.b64decode(meta['content']))
                  if receipt['controller_run_id']==int(os.environ['GITHUB_RUN_ID']) and receipt['source_context_sha256']==request['source_context_sha256']:
                      reason=receipt.get('failure_reason') or reason
              except Exception:pass
          detail={'schema':'tayvoriq-execution-incident-v1','request_id':rid,'source_context_sha256':request['source_context_sha256'],
            'run_id':int(os.environ['GITHUB_RUN_ID']),'code':'CHECKPOINT_TRANSFER_FAILED' if transfer else 'CONTABO_EXECUTION_STOPPED',
            'cause':reason,'action':'Der Lauf ist gestoppt. Der fehlgeschlagene Schritt muss korrigiert und verifiziert werden.',
            'next_proof':'Bestätigte Übernahme des Produktionsstands und anschließende Qualitätsprüfung.',
            'user_action_required':False,'quality_gates_weakened':False}
          path=Path('state/tayvoriq-execution-incidents')/(rid+'.json');path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(detail,ensure_ascii=False,indent=2)+'\n')
          token=os.environ['TELEGRAM_BOT_TOKEN'];chat=os.environ['TELEGRAM_CHAT_ID']
          data=json.dumps({'chat_id':chat,'text':'🔴 TAYVORIQ · Technischer Lauf angehalten\n\nUrsache: '+reason+'\nMaßnahme: '+detail['action']+'\nNoch offen: '+detail['next_proof']+'\nRequest: '+rid+'\nRun: '+os.environ['GITHUB_RUN_ID']}).encode()
          with urllib.request.urlopen(urllib.request.Request('https://api.telegram.org/bot'+token+'/sendMessage',data=data,headers={'Content-Type':'application/json'}),timeout=30) as r:
              assert json.load(r).get('ok') is True
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "state/tayvoriq-execution-incidents/$REQUEST_ID.json"
          git commit -m "Explain verified Contabo stop for $REQUEST_ID"
          git pull --rebase origin main
          git push origin HEAD:main
