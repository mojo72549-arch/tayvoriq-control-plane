name: TAYVORIQ Agent Orchestrator V2

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Trend-Slot
        required: true
        default: morning
        type: choice
        options: [morning, afternoon]
  push:
    branches: [main]
    paths:
      - ".github/run-now/tayvoriq-agent-trigger.txt"
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: tayvoriq-agent-orchestrator-v2
  cancel-in-progress: true

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  trend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_run: ${{ steps.slot.outputs.should_run }}
      slot: ${{ steps.slot.outputs.slot }}
      active_series: ${{ steps.mode.outputs.active_series }}
      series_in_flight: ${{ steps.mode.outputs.series_in_flight }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Resolve Berlin slot and activation date
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Berlin'))
          event = os.environ.get('EVENT_NAME','')
          schedule = os.environ.get('EVENT_SCHEDULE','')
          requested = os.environ.get('INPUT_SLOT','')
          slot = requested if event == 'workflow_dispatch' else ''
          should = now.date().isoformat() >= '2026-08-15'
          if event == 'push':
              slot = 'morning' if now.hour < 12 else 'afternoon'
          if event == 'schedule':
              offset = int(now.utcoffset().total_seconds() // 3600)
              expected = {
                  'morning': '30 4 * * *' if offset == 2 else '30 5 * * *',
                  'afternoon': '30 12 * * *' if offset == 2 else '30 13 * * *',
              }
              slot = next((name for name, cron in expected.items() if cron == schedule), '')
              should = should and bool(slot)
          if slot not in {'morning','afternoon'}:
              should = False
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write(f"should_run={'true' if should else 'false'}\n")
              h.write(f"slot={slot}\n")
          print({'berlin': now.isoformat(), 'slot': slot, 'should_run': should})
          PY

      - name: Detect active editorial series and in-flight episode
        id: mode
        if: steps.slot.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          path=Path('state/tayvoriq-active-series.json')
          active=False
          in_flight=False
          info={}
          state={}
          if path.is_file():
              state=json.loads(path.read_text(encoding='utf-8'))
              active=str(state.get('status') or '').strip().lower() in {'active','ready_for_selection'}
              series_id=str(state.get('series_id') or '').strip()
              try:
                  episode=int(state.get('episode') or 0)
              except Exception:
                  episode=0
              info={'series_id':series_id,'episode':episode,'title':state.get('episode_title')}
              if active and series_id and episode > 0:
                  for request_path in Path('requests').glob('*.json'):
                      try:
                          request=json.loads(request_path.read_text(encoding='utf-8'))
                      except Exception:
                          continue
                      if str(request.get('status') or '').strip().upper() not in {'APPROVED','DISPATCHING','DISPATCHED'}:
                          continue
                      source=request.get('source_context') if isinstance(request.get('source_context'),dict) else {}
                      series=source.get('series_context') if isinstance(source.get('series_context'),dict) else {}
                      try:
                          request_episode=int(series.get('episode') or 0)
                      except Exception:
                          request_episode=0
                      if str(series.get('series_id') or '').strip() == series_id and request_episode == episode:
                          in_flight=True
                          info['in_flight_request']=request.get('request_id') or request_path.stem
                          info['in_flight_status']=request.get('status')
                          break
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write(f"active_series={'true' if active else 'false'}\n")
              h.write(f"series_in_flight={'true' if in_flight else 'false'}\n")
          print({'active_series':active,'series_in_flight':in_flight, **info})
          PY

      - name: Hold duplicate series proposal while approved episode is in flight
        if: steps.slot.outputs.should_run == 'true' && steps.mode.outputs.active_series == 'true' && steps.mode.outputs.series_in_flight == 'true'
        run: |
          echo "Active series episode already approved/dispatched; no duplicate Telegram approval and no new trend scan."

      - name: Build active series episode request
        if: steps.slot.outputs.should_run == 'true' && steps.mode.outputs.active_series == 'true' && steps.mode.outputs.series_in_flight != 'true'
        run: |
          set -euo pipefail
          python tools/tayvoriq_agent_series_request_v2.py \
            --slot "${{ steps.slot.outputs.slot }}" \
            --output /tmp/tayvoriq-trend-request.json \
            --audit-output /tmp/tayvoriq-trend-audit.json

      - name: Generate grounded 5-trend ranking
        if: steps.slot.outputs.should_run == 'true' && steps.mode.outputs.active_series != 'true'
        run: |
          set -euo pipefail
          python tools/tayvoriq_agent_trend_radar_v3.py \
            --slot "${{ steps.slot.outputs.slot }}" \
            --output /tmp/tayvoriq-trend-request.json \
            --audit-output /tmp/tayvoriq-trend-audit.json

      - name: Validate approval contract
        if: steps.slot.outputs.should_run == 'true' && steps.mode.outputs.series_in_flight != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('/tmp/tayvoriq-trend-request.json',encoding='utf-8'))
          assert d.get('agent_orchestrator') == 'v2'
          trends=d.get('trends') or []
          if d.get('mode') == 'active_series':
              assert len(trends) == 1
              assert [x.get('id') for x in trends] == ['1']
              sc=trends[0].get('source_context') or {}
              series=sc.get('series_context') or {}
              assert series.get('series_id') and int(series.get('episode') or 0) >= 1
              assert series.get('hook') and series.get('bridge_out') and series.get('red_thread')
          else:
              assert len(trends) == 5
              assert [x.get('id') for x in trends] == ['1','2','3','4','5']
          for t in trends:
              assert len(t.get('sources') or []) >= 2
              sc=t.get('source_context') or {}
              assert sc.get('independent_news_count',0) >= 2
              assert len(sc.get('sources') or []) >= 2
              assert all((sc.get('fallback_editorial_answers') or {}).get(k) for k in ['what_happened','why_happening','who_is_affected','personal_impact','action_now'])
          print({'contract':'passed','mode':d.get('mode') or 'trend_radar','trend_count':len(trends)})
          PY

      - name: Persist canonical request without triggering legacy push workflows
        if: steps.slot.outputs.should_run == 'true' && steps.mode.outputs.series_in_flight != 'true'
        run: |
          set -euo pipefail
          cp /tmp/tayvoriq-trend-request.json .github/run-now/tayvoriq-trend-request.json
          selection_id=$(python -c "import json; print(json.load(open('/tmp/tayvoriq-trend-request.json'))['selection_id'])")
          mkdir -p .automation/tayvoriq-agent-v2/sessions
          cp /tmp/tayvoriq-trend-audit.json ".automation/tayvoriq-agent-v2/sessions/${selection_id}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/run-now/tayvoriq-trend-request.json .automation/tayvoriq-agent-v2/sessions/
          git commit -m "agent(v2): stage ${selection_id} approval request"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Send approval request to Telegram
        if: steps.slot.outputs.should_run == 'true' && steps.mode.outputs.series_in_flight != 'true'
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          python - <<'PY' >/tmp/message.json
          import json, os
          d=json.load(open('/tmp/tayvoriq-trend-request.json',encoding='utf-8'))
          sid=d['selection_id']
          if d.get('mode') == 'active_series':
              t=d['trends'][0]
              sc=(t.get('source_context') or {}).get('series_context') or {}
              lines=[
                  f"🧭 TAYVORIQ Serie · Teil {sc.get('episode')}/5",
                  str(sc.get('series_title') or ''),
                  '',
                  f"Folge: {sc.get('episode_title') or t.get('title')}",
                  f"Cover: {sc.get('cover_text') or ''}",
                  '',
                  f"Hook: {sc.get('hook') or ''}",
                  '',
                  f"Übergang zu Teil {int(sc.get('episode') or 0)+1}: {sc.get('bridge_out') or ''}",
                  '',
                  f"Quellen geprüft: {len(t.get('sources') or [])}",
                  'Die Serie und die rote Linie sind bereits festgelegt. Kein neuer Trend-Scan nötig.',
                  '',
                  'Mit „Trend freigeben“ übernimmt Agent V2 danach Produktion, Reparaturen, Quality-Gates und Veröffentlichung autonom.'
              ]
              kb={'inline_keyboard':[
                  [{'text':'✅ Trend freigeben','callback_data':f'approve_trend:{sid}:1'}],
                  [{'text':'❌ Ablehnen','callback_data':'reject_trend:1'}]
              ]}
          else:
              morning=d['slot']=='morning'
              lines=[('🌅 TAYVORIQ Morgen-Trends' if morning else '🌆 TAYVORIQ Nachmittags-Trends'),'', 'Rangliste:']
              for t in d['trends']:
                  lines.append(f"{t['id']}. {t['title']} — {t['score']} %")
              lines += ['', 'Aktuell geprüft · mindestens 2 Quellen je Trend · Qualität vor Geschwindigkeit.', '', 'Schritt 1: Trendnummer wählen.', 'Schritt 2: Details prüfen und separat „Trend freigeben“ tippen.', '', 'Erst danach übernimmt Agent V2 Produktion, Reparaturen, Quality-Gates und Veröffentlichung selbstständig.']
              kb={'inline_keyboard':[[
                  {'text':'1️⃣ Trend 1','callback_data':f'select_trend:{sid}:1'},
                  {'text':'2️⃣ Trend 2','callback_data':f'select_trend:{sid}:2'}],[
                  {'text':'3️⃣ Trend 3','callback_data':f'select_trend:{sid}:3'},
                  {'text':'4️⃣ Trend 4','callback_data':f'select_trend:{sid}:4'}],[
                  {'text':'5️⃣ Trend 5','callback_data':f'select_trend:{sid}:5'}]]}
          print(json.dumps({'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':'\n'.join(lines),'disable_web_page_preview':True,'reply_markup':kb}, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' \
            -d @/tmp/message.json \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /tmp/telegram.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/telegram.json'))
          assert d.get('ok') and (d.get('result') or {}).get('message_id'), d
          print({'telegram_message_id':d['result']['message_id']})
          PY

      - name: Notify gate failure once for this run
        if: failure() && steps.slot.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          if [ "${{ steps.mode.outputs.active_series }}" = "true" ]; then
            text="❌ TAYVORIQ Agent V2 konnte die vorbereitete Serienfolge nicht bis zur Telegram-Freigabe bereitstellen. Es wurde keine Produktion gestartet. Run: ${GITHUB_RUN_ID}"
          else
            text="❌ TAYVORIQ Agent V2 konnte die aktuelle Trend-Rangliste nicht sicher erstellen. Es wurde keine Produktion gestartet. Run: ${GITHUB_RUN_ID}"
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" >/dev/null || true