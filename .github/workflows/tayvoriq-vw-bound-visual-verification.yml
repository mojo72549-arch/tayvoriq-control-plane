name: VW bound autonomous recovery and strict gates
on:
  push:
    branches: [codex/vw-45510042088-checkpoint-evidence]
    paths: [.github/workflows/tayvoriq-vw-bound-visual-verification.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      TAYVORIQ_RENDER_SIZE: "1080x1920"
      TAYVORIQ_REQUIRE_REAL_VIDEO_SCENES: "true"
      TAYVORIQ_CLOUD_MODE: "true"
      TAYVORIQ_APPROVED_TREND_PINNED: "true"
      TAYVORIQ_AUDIO_END_PADDING_SECONDS: "1.25"
      TAYVORIQ_VISUAL_REPAIR_ROUND: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: 5f9baa36075467dbea868a3066870645e2e4835a
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: 01d97a61aea81dbdb88f98d6457b448f8d70a0bf
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          ref: dabfd3f8548d30ed0eea8759decbdead9626e0e6
          path: scene-engine
          persist-credentials: false
      - name: Restore approved checkpoint
        uses: actions/cache/restore@v4
        with:
          path: implementation/out/recovery-checkpoint
          key: tayvoriq-recovery-v1-Linux-1-91d55e03500a804d6a08f56215d5ee3e3ad2c3606c648e0f8d18cf74c6367cd2-45510042088-1
          fail-on-cache-miss: true
      - name: Restore production render dependencies
        id: dependency_cache
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: tayvoriq-venv-v1-${{ runner.os }}-py311-${{ hashFiles('implementation/requirements.txt') }}-torch260-chatterbox-65b18437
      - name: Verify video dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! .venv/bin/python -c 'from moviepy.editor import VideoFileClip; import requests'; then
            python -m venv .venv
            awk '!/chatterbox-tts/ { print }' implementation/requirements.txt > "$RUNNER_TEMP/render-requirements.txt"
            .venv/bin/python -m pip install -q -r "$RUNNER_TEMP/render-requirements.txt"
          fi
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ffprobe -version | sed -n '1p'
      - name: Render candidate for both platforms with scene-specific search and repeat exclusion
        working-directory: candidate
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PEXELS_API_KEY"
          PYTHONPATH="$PWD:$PWD/tools" "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/tools/vw_bound_visual_comparison.py" fixed "$GITHUB_WORKSPACE/implementation/out/recovery-checkpoint" "$RUNNER_TEMP/vw-comparison"
      - name: Run the canonical checkpoint recovery through all strict gates
        working-directory: candidate
        env:
          TAYVORIQ_CHECKPOINT_REPAIR_ROUND_LIMIT: "3"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAYVORIQ_MONEYPRINTERTURBO_ROOT: ${{ github.workspace }}/scene-engine
        shell: bash
        run: |
          set -euo pipefail
          job_dir="$RUNNER_TEMP/vw-comparison/fixed"
          PYTHONPATH="$PWD:$PWD/tools" "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/tools/vw_bound_scene_revision.py" "$job_dir"
      - name: Encrypt checked comparison files
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vw-comparison"
          if [ ! -s "$work/fixed/comparison.json" ]; then exit 0; fi
          cat > "$RUNNER_TEMP/evidence-recipient.pem" <<'CERT'
