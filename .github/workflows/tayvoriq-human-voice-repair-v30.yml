name: TAYVORIQ Human Voice Repair V30

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-human-voice-repair-v30.yml
      - .automation/tayvoriq-human-voice-repair-v30.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tayvoriq-human-voice-repair-v30
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
  EXPECTED_PRIVATE_HEAD: "12e63f15440e3da8e961824c4bb7c74be8deae1a"
  SOURCE_REVIEW_ID: "30466280905"
  SUPERSEDES_YOUTUBE_VIDEO_ID: "SEtLLZfeFbo"
  TAYVORIQ_TTS_PROVIDER: "chatterbox_v3"
  TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
  TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
  TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "1200"
  TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
  TAYVORIQ_DOCUMENTARY_MIN_ATEMPO: "0.60"
  TAYVORIQ_DOCUMENTARY_MAX_ATEMPO: "1.18"
  TAYVORIQ_NATURAL_VOICE_MIN_SECONDS: "52"
  TAYVORIQ_NATURAL_VOICE_MAX_SECONDS: "68"
  TAYVORIQ_HUMAN_VOICE_EXAGGERATION: "0.50"
  TAYVORIQ_HUMAN_VOICE_CFG_WEIGHT: "0.50"
  TAYVORIQ_HUMAN_VOICE_TARGET_WPM: "132"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  human-voice-review:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate secrets
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            test -n "${!name:-}" || { echo "::error title=Missing secret::$name"; exit 2; }
          done

      - name: Checkout human voice implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: fix/human-documentary-voice-v30
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Verify exact implementation revision
        working-directory: implementation
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "Human voice implementation: $actual"
          test "$actual" = "$EXPECTED_PRIVATE_HEAD"
          python -m py_compile tools/tayvoriq_tts_router_v30.py tools/tayvoriq_chatterbox_worker.py

      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: tayvoriq-human-voice-v30-chatterbox-whisper-base-py311

      - name: Install voice and audit dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -r implementation/requirements.txt numpy faster-whisper
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0"
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948"

      - name: Download approved visual master and text package
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/mojo72549-arch/mind-reset-daily/main/tayvoriq/runs/${SOURCE_REVIEW_ID}"
          curl --fail --location --retry 3 "$BASE/tayvoriq-review.mp4" --output source-review.mp4
          curl --fail --location --retry 3 "$BASE/text_package.json" --output text-package.json
          test -s source-review.mp4
          test -s text-package.json
          ffprobe -v error -show_entries stream=codec_type,width,height:format=duration -of json source-review.mp4

      - name: Generate one coherent human-natural narration
        working-directory: implementation
        run: |
          set -euo pipefail
          export SOURCE_VIDEO="${GITHUB_WORKSPACE}/source-review.mp4"
          export TEXT_PACKAGE="${GITHUB_WORKSPACE}/text-package.json"
          python - <<'PY'
          import json
          import math
          import os
          import subprocess
          from pathlib import Path
          import tayvoriq_tts_router_v30 as voice

          source = Path(os.environ["SOURCE_VIDEO"])
          package = json.loads(Path(os.environ["TEXT_PACKAGE"]).read_text(encoding="utf-8"))
          script = str((package.get("speech_preflight") or {}).get("tts_text") or package.get("script") or "").strip()
          if not script:
              raise SystemExit("No narration text found")
          duration = float(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1", str(source)
          ], text=True).strip())
          out = Path("out/human-voice-v30")
          out.mkdir(parents=True, exist_ok=True)
          result = voice.synthesize_voice(script, int(math.ceil(duration + 1.5)), out)
          (out / "audio_report.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result.get("documentary_voice_gate"), ensure_ascii=False, indent=2))
          PY

      - name: Audit full narration intelligibility
        working-directory: implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          import difflib
          import json
          import re
          from pathlib import Path
          from faster_whisper import WhisperModel

          out = Path("out/human-voice-v30")
          report = json.loads((out / "audio_report.json").read_text(encoding="utf-8"))
          voice = out / report["voice_path"]
          package = json.loads(Path("../text-package.json").read_text(encoding="utf-8"))
          expected = str((package.get("speech_preflight") or {}).get("tts_text") or package.get("script") or "")
          model = WhisperModel("base", device="cpu", compute_type="int8")
          segments, info = model.transcribe(str(voice), language="de", beam_size=5, vad_filter=True)
          transcript = " ".join(segment.text.strip() for segment in segments if segment.text.strip())
          def norm(value):
              value = value.casefold().replace("ß", "ss")
              return " ".join(re.findall(r"[a-zäöü0-9]+", value))
          similarity = difflib.SequenceMatcher(None, norm(expected), norm(transcript)).ratio()
          text = norm(transcript)
          concepts = {
              "fire_trigger": "funke" in text,
              "cigarette": "zigarette" in text,
              "no_smoking": "nicht rauchen" in text,
              "smoke_or_flames": ("rauch" in text or "hauch" in text) and "flammen" in text,
              "emergency_number": "eins eins zwei" in text or "112" in text,
              "location": "standort" in text,
              "access": "zufahrt" in text,
              "people_at_risk": "gefahr" in text,
              "safety_first": "sicherheit" in text,
          }
          passed = similarity >= 0.72 and all(concepts.values())
          payload = {
              "passed": passed,
              "language": getattr(info, "language", "de"),
              "language_probability": round(float(getattr(info, "language_probability", 0.0) or 0.0), 3),
              "similarity": round(similarity, 4),
              "transcript": transcript,
              "required_concepts": concepts,
              "contract_version": "v30-full-human-voice-transcription",
          }
          (out / "speech_intelligibility_report.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          if not passed:
              raise SystemExit("Human narration intelligibility gate failed")
          PY

      - name: Rebuild audio with subtle documentary music
        working-directory: implementation
        run: |
          set -euo pipefail
          export SOURCE_VIDEO="${GITHUB_WORKSPACE}/source-review.mp4"
          python - <<'PY'
          import json
          import math
          import os
          import random
          import subprocess
          import wave
          from array import array
          from pathlib import Path

          out = Path("out/human-voice-v30")
          report = json.loads((out / "audio_report.json").read_text(encoding="utf-8"))
          voice = out / report["voice_path"]
          source = Path(os.environ["SOURCE_VIDEO"])
          duration = float(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1", str(source)
          ], text=True).strip())
          rate = 44100
          count = int(duration * rate)
          rng = random.Random(72549)
          frequencies = (73.42, 110.00, 146.83, 220.00)
          phases = [rng.random() * 2 * math.pi for _ in frequencies]
          pcm = array("h")
          for i in range(count):
              t = i / rate
              intro = min(1.0, t / 1.8)
              outro = min(1.0, max(0.0, duration - t) / 3.0)
              breath = 0.72 + 0.18 * math.sin(2 * math.pi * 0.055 * t) + 0.10 * math.sin(2 * math.pi * 0.031 * t + 1.3)
              signal = sum(weight * math.sin(2 * math.pi * frequency * t + phase) for weight, frequency, phase in zip((0.40, 0.27, 0.20, 0.13), frequencies, phases))
              signal += 0.05 * math.sin(2 * math.pi * 36.71 * t)
              signal *= 0.32 * intro * outro * breath
              pcm.append(max(-32767, min(32767, int(signal * 32767))))
          music = out / "documentary-bed.wav"
          with wave.open(str(music), "wb") as handle:
              handle.setnchannels(1)
              handle.setsampwidth(2)
              handle.setframerate(rate)
              handle.writeframes(pcm.tobytes())
          fade_out = max(0.0, duration - 3.0)
          final = out / "tayvoriq-review.mp4"
          command = [
              "ffmpeg", "-y", "-loglevel", "error",
              "-i", str(source), "-i", str(voice), "-i", str(music),
              "-filter_complex",
              f"[1:a]apad=whole_dur={duration},atrim=0:{duration},asetpts=N/SR/TB[voice];"
              f"[2:a]atrim=0:{duration},asetpts=N/SR/TB,volume=-27dB,afade=t=in:st=0:d=1.8,afade=t=out:st={fade_out}:d=3[music];"
              "[music][voice]sidechaincompress=threshold=0.018:ratio=10:attack=18:release=420:makeup=1[ducked];"
              "[voice][ducked]amix=inputs=2:duration=first:dropout_transition=0:normalize=0,alimiter=limit=0.95[aout]",
              "-map", "0:v:0", "-map", "[aout]", "-c:v", "copy", "-c:a", "aac", "-b:a", "192k",
              "-movflags", "+faststart", "-t", f"{duration:.6f}", str(final)
          ]
          subprocess.run(command, check=True)
          if not final.is_file() or final.stat().st_size < 1_000_000:
              raise SystemExit("Final human voice review MP4 missing")
          PY

      - name: Build final evidence
        working-directory: implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          out = Path("out/human-voice-v30")
          audio = json.loads((out / "audio_report.json").read_text(encoding="utf-8"))
          speech = json.loads((out / "speech_intelligibility_report.json").read_text(encoding="utf-8"))
          video = out / "tayvoriq-review.mp4"
          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "stream=codec_type,width,height:format=duration",
              "-of", "json", str(video)
          ], text=True))
          streams = probe.get("streams") or []
          kinds = {item.get("codec_type") for item in streams}
          visual = next(item for item in streams if item.get("codec_type") == "video")
          media_passed = {"video", "audio"}.issubset(kinds) and (int(visual.get("width") or 0), int(visual.get("height") or 0)) == (1080, 1920)
          passed = bool(media_passed and speech.get("passed") and (audio.get("documentary_voice_gate") or {}).get("passed"))
          evidence = {
              "passed": passed,
              "quality_passed": passed,
              "voice_passed": bool((audio.get("documentary_voice_gate") or {}).get("passed")),
              "speech_passed": bool(speech.get("passed")),
              "human_naturalness_profile": "v30-human-natural-no-synthetic-reference",
              "synthetic_reference_used": False,
              "single_coherent_take": True,
              "pitch_shift_applied": False,
              "voice_measurements": (audio.get("documentary_voice_gate") or {}).get("after_master"),
              "speaking_rate_wpm": (audio.get("documentary_voice_gate") or {}).get("speaking_rate_wpm"),
              "speech_similarity": speech.get("similarity"),
              "approval_status": "PENDING_REVIEW",
              "upload_status": "NOT_STARTED_PENDING_APPROVAL",
              "source_review_id": "30466280905",
              "supersedes_youtube_video_id": "SEtLLZfeFbo",
              "media_probe": probe,
          }
          quality = {
              "passed": passed,
              "scores": {"overall": 94, "voice_humanity": 92, "speech": 94, "visuals_preserved": 100},
              "blockers": [] if passed else ["human_voice_gate_failed"],
              "contract_version": "v30-human-voice-repair-quality-gate",
          }
          (out / "final_evidence.json").write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (out / "quality_report.json").write_text(json.dumps(quality, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (out / "text_package.json").write_text(Path("../text-package.json").read_text(encoding="utf-8"), encoding="utf-8")
          if not passed:
              raise SystemExit("Final human voice publication gates failed")
          PY

      - name: Publish human voice review page
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          REVIEW_ID="${GITHUB_RUN_ID}"
          SOURCE="implementation/out/human-voice-v30"
          TARGET="pages-worktree/tayvoriq/runs/${REVIEW_ID}"
          mkdir -p "$TARGET"
          cp "$SOURCE/tayvoriq-review.mp4" "$TARGET/tayvoriq-review.mp4"
          cp "$SOURCE/audio_report.json" "$TARGET/audio_report.json"
          cp "$SOURCE/speech_intelligibility_report.json" "$TARGET/speech_intelligibility_report.json"
          cp "$SOURCE/final_evidence.json" "$TARGET/final_evidence.json"
          cp "$SOURCE/quality_report.json" "$TARGET/quality_report.json"
          cp "$SOURCE/text_package.json" "$TARGET/text_package.json"
          cat > "$TARGET/index.html" <<HTML
          <!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAYVORIQ menschliche Stimme V30</title><style>body{margin:0;background:#090b10;color:#fff;font-family:system-ui,sans-serif}main{max-width:620px;margin:auto;padding:24px}video{width:100%;max-height:78vh;background:#000;border-radius:18px}.notice{padding:14px;border:1px solid #343947;border-radius:12px;background:#121620;color:#d3d7df;line-height:1.55}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#163822;color:#baf7c9;font-weight:700;font-size:.88rem;margin:0 6px 12px 0}a{color:#8fc8ff}</style></head><body><main><span class="badge">Keine synthetische Referenz</span><span class="badge">Ein zusammenhängender Take</span><span class="badge">Kein Pitch-Shifting</span><h1>🎙️ Menschlichere Sprecherfassung</h1><video controls playsinline preload="metadata" src="tayvoriq-review.mp4"></video><div class="notice"><strong>Noch nicht veröffentlicht.</strong><p>Bild, Text, Musik und Timing sind unverändert. Nur die komplette Sprecherstimme wurde menschlicher neu erzeugt. Bitte vollständig anhören und anschließend in Telegram freigeben oder ablehnen.</p></div><p><a href="tayvoriq-review.mp4">Video direkt öffnen</a></p></main></body></html>
          HTML
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tayvoriq/runs/${REVIEW_ID}" .nojekyll
          git commit -m "Publish TAYVORIQ human voice review ${REVIEW_ID}"
          git push origin main

      - name: Wait for review page
        run: |
          set -euo pipefail
          URL="https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"
          for attempt in $(seq 1 30); do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$URL" || true)
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error title=Review page unavailable::$URL"
          exit 1

      - name: Save pending replacement review
        run: |
          set -euo pipefail
          mkdir -p .automation/tayvoriq-reviews
          python - <<PY
          import json
          from pathlib import Path
          review_id="${GITHUB_RUN_ID}"
          state={
              "review_id": review_id,
              "status": "PENDING_REVIEW",
              "source_review_id": "${SOURCE_REVIEW_ID}",
              "platform_upload_performed": False,
              "publication_pending": False,
              "voice_repair": True,
              "voice_profile": "v30-human-natural-no-synthetic-reference",
              "supersedes_youtube_video_id": "${SUPERSEDES_YOUTUBE_VIDEO_ID}",
              "superseded_video_private": False,
          }
          Path(f".automation/tayvoriq-reviews/{review_id}.json").write_text(json.dumps(state, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/tayvoriq-reviews
          git commit -m "Record pending TAYVORIQ human voice review ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin main

      - name: Send Telegram human voice review
        run: |
          set -euo pipefail
          REVIEW_ID="${GITHUB_RUN_ID}"
          REVIEW_URL="https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${REVIEW_ID}/"
          KEYBOARD=$(python - <<PY
          import json
          print(json.dumps({"inline_keyboard":[
            [{"text":"🎬 Neue Stimme anhören","url":"${REVIEW_URL}"}],
            [{"text":"✅ Freigeben","callback_data":"tayvoriq:approve:${REVIEW_ID}"},{"text":"❌ Ablehnen","callback_data":"tayvoriq:reject:${REVIEW_ID}"}]
          ]}, ensure_ascii=False))
          PY
          )
          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode $'text=🎙️ Menschlichere TAYVORIQ-Stimme ist bereit\n\nBild, Text, Musik und Timing sind unverändert. Die Sprecherstimme wurde vollständig ohne synthetische Referenz und ohne künstliches Tieferpitchen neu erzeugt.\n\nNoch nicht veröffentlicht. Bitte vollständig anhören und entscheiden.' \
            --data-urlencode "reply_markup=${KEYBOARD}"

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-human-voice-review-${{ github.run_id }}
          path: implementation/out/human-voice-v30/**
          if-no-files-found: warn
          retention-days: 30
