name: TAYVORIQ One-Time Immutable Green Hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-one-time-immutable-green-hardening.yml
      - tools/tayvoriq_harden_golden_path_v1.py
      - tools/tayvoriq_resolve_production_green_v1.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile hardening tools
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/tayvoriq_harden_golden_path_v1.py tools/tayvoriq_resolve_production_green_v1.py

      - name: Apply deterministic Golden Path hardening
        shell: bash
        run: |
          set -euo pipefail
          python tools/tayvoriq_harden_golden_path_v1.py
          python tools/tayvoriq_harden_golden_path_v1.py --check

      - name: Validate patch diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- .github/workflows/tayvoriq-deliver-video-now.yml

      - name: Commit hardened Golden Path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tayvoriq-deliver-video-now.yml
          if git diff --cached --quiet; then
            echo 'Golden Path already hardened.'
            exit 0
          fi
          git commit -m 'fix(tayvoriq): pin production to immutable verified implementation'
          git pull --rebase origin main
          git push origin main
