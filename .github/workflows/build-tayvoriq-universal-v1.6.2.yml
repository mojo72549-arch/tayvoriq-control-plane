name: Build TAYVORIQ Universal Import v1.6.2

on:
  push:
    branches:
      - universal-import-v1.6.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Spaceflight picker and version
        run: python3 scripts/patch_sfs_picker_v162.py

      - name: Verify source patch
        run: |
          grep -q 'android.provider.extra.INITIAL_URI' android-test-app/app/src/main/java/com/tayvoriq/addonmanager/FileImportActivity.java
          grep -q 'Android/media/com.StefMorojna.SpaceflightSimulator/files/Saving/Blueprints' android-test-app/app/src/main/java/com/tayvoriq/addonmanager/FileImportActivity.java
          grep -q 'versionName = "1.6.2-universal-import"' android-test-app/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build APK
        working-directory: android-test-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and package APK
        run: |
          APK="android-test-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee android-badging.txt
          grep -q "versionName='1.6.2-universal-import-debug'" android-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p delivery
          cp "$APK" delivery/TAYVORIQ_Universal_Import_Android_v1.6.2.apk
          sha256sum delivery/TAYVORIQ_Universal_Import_Android_v1.6.2.apk > delivery/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAYVORIQ-Universal-Android-v1.6.2
          path: delivery/*
          if-no-files-found: error
          retention-days: 14
