name: TAYVORIQ Research Observation Tests

on:
  pull_request:
    paths:
      - 'tools/tayvoriq_research_observer.py'
      - 'tools/tayvoriq_contabo_research.py'
      - 'tools/tayvoriq_research_terminal_notice.py'
      - 'tools/tayvoriq_research_retry_v1.py'
      - 'tools/tayvoriq_provider_health_v1.py'
      - 'tests/test_tayvoriq_research_observer.py'
      - 'tests/test_tayvoriq_ollama_research.py'
      - 'tests/test_tayvoriq_explicit_research_notice.py'
      - 'tests/test_tayvoriq_manual_research_recovery.py'
      - '.github/workflows/tayvoriq-research-observation-checks.yml'

permissions:
  contents: read

jobs:
  research-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest -q
      - name: Verify terminal notices and observed research state offline
        run: >-
          python -m pytest -q
          tests/test_tayvoriq_explicit_research_notice.py
          tests/test_tayvoriq_research_observer.py
          tests/test_tayvoriq_ollama_research.py
          tests/test_tayvoriq_manual_research_recovery.py
