name: TAYVORIQ Smart Trend Queue Intake

on:
  push:
    branches: [main]
    paths:
      - 'queue/trend-relay/*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tayvoriq-smart-trend-queue-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Queue accepted
        run: |
          echo "TAYVORIQ queue request accepted."
          echo "The private Studio queue consumer owns production dispatch."
