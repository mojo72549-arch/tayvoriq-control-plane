name: TAYVORIQ Control Telegram Approval Poller

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tayvoriq-control-telegram-approval-poller
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YOUTUBE_PRIVACY: "private"

jobs:
  process-buttons:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Process Telegram decisions
        id: process
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib import request

          token=os.environ.get('TELEGRAM_BOT_TOKEN','').strip()
          configured_chat=os.environ.get('TELEGRAM_CHAT_ID','').strip()
          github_token=os.environ.get('GH_TOKEN','').strip()
          repository=os.environ['GITHUB_REPOSITORY']
          if not token or not configured_chat or not github_token:
              raise SystemExit('Required Telegram/GitHub configuration missing')

          state_path=Path('.automation/tayvoriq-control-telegram-state.json')
          if state_path.exists():
              try:
                  state=json.loads(state_path.read_text(encoding='utf-8'))
              except Exception:
                  state={}
          else:
              state={}
          state.setdefault('next_update_id',0)
          state.setdefault('decisions',{})

          def telegram(method,payload):
              body=json.dumps(payload,ensure_ascii=False).encode('utf-8')
              req=request.Request(
                  f'https://api.telegram.org/bot{token}/{method}',
                  data=body,
                  headers={'Content-Type':'application/json'},
                  method='POST',
              )
              with request.urlopen(req,timeout=35) as response:
                  value=json.loads(response.read().decode('utf-8'))
              if not value.get('ok'):
                  raise RuntimeError(value)
              return value.get('result')

          def github(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              req=request.Request(
                  url,
                  data=data,
                  headers={
                      'Authorization':f'Bearer {github_token}',
                      'Accept':'application/vnd.github+json',
                      'X-GitHub-Api-Version':'2022-11-28',
                      'Content-Type':'application/json',
                  },
                  method=method,
              )
              with request.urlopen(req,timeout=35) as response:
                  raw=response.read()
                  return json.loads(raw.decode('utf-8')) if raw else {}

          updates=telegram('getUpdates',{
              'offset':int(state.get('next_update_id') or 0),
              'limit':100,
              'timeout':0,
              'allowed_updates':['callback_query'],
          }) or []
          pattern=re.compile(r'^tayvoriqcp:(approve|reject):([0-9]{6,})$')
          changed=False
          handled=0

          for update in updates:
              update_id=int(update.get('update_id') or 0)
              state['next_update_id']=max(int(state.get('next_update_id') or 0),update_id+1)
              changed=True
              callback=update.get('callback_query') if isinstance(update.get('callback_query'),dict) else {}
              callback_id=str(callback.get('id') or '').strip()
              data=str(callback.get('data') or '').strip()
              message=callback.get('message') if isinstance(callback.get('message'),dict) else {}
              chat=message.get('chat') if isinstance(message.get('chat'),dict) else {}
              chat_id=str(chat.get('id') or '').strip()
              message_id=int(message.get('message_id') or 0)
              match=pattern.fullmatch(data)
              if not callback_id or not match:
                  continue
              if chat_id != configured_chat:
                  telegram('answerCallbackQuery',{'callback_query_id':callback_id,'text':'Nicht autorisierter Chat.','show_alert':True})
                  continue
              action,run_id=match.groups()
              previous=state['decisions'].get(run_id) if isinstance(state['decisions'].get(run_id),dict) else {}
              if str(previous.get('status') or '').upper() in {'APPROVED','REJECTED'}:
                  telegram('answerCallbackQuery',{'callback_query_id':callback_id,'text':'Diese Review wurde bereits verarbeitet.'})
                  if message_id:
                      telegram('editMessageReplyMarkup',{'chat_id':chat_id,'message_id':message_id,'reply_markup':{'inline_keyboard':[]}})
                  continue

              now=datetime.now(timezone.utc).isoformat()
              if action=='reject':
                  state['decisions'][run_id]={'status':'REJECTED','processed_at':now,'source':'telegram_callback'}
                  telegram('answerCallbackQuery',{'callback_query_id':callback_id,'text':'Video abgelehnt. Es wird nichts veröffentlicht.'})
                  if message_id:
                      telegram('editMessageReplyMarkup',{'chat_id':chat_id,'message_id':message_id,'reply_markup':{'inline_keyboard':[]}})
                  telegram('sendMessage',{'chat_id':configured_chat,'text':f'❌ Review {run_id} abgelehnt. Nichts wird veröffentlicht.'})
                  handled+=1
                  continue

              artifacts=github('GET',f'https://api.github.com/repos/{repository}/actions/runs/{run_id}/artifacts')
              expected=f'tayvoriq-control-review-{run_id}'
              exists=any(str(item.get('name') or '')==expected for item in artifacts.get('artifacts',[]) if isinstance(item,dict))
              if not exists:
                  telegram('answerCallbackQuery',{'callback_query_id':callback_id,'text':'Das geprüfte Video-Artefakt fehlt. Freigabe wurde nicht ausgeführt.','show_alert':True})
                  continue

              github('POST',f'https://api.github.com/repos/{repository}/dispatches',{
                  'event_type':'tayvoriq_control_publish_approved',
                  'client_payload':{
                      'review_run_id':run_id,
                      'youtube_privacy':os.environ.get('YOUTUBE_PRIVACY','private'),
                      'approval_source':'telegram_callback',
                  },
              })
              state['decisions'][run_id]={
                  'status':'APPROVED',
                  'youtube_privacy':os.environ.get('YOUTUBE_PRIVACY','private'),
                  'processed_at':now,
                  'source':'telegram_callback',
              }
              telegram('answerCallbackQuery',{'callback_query_id':callback_id,'text':'Freigabe erkannt. YouTube-Veröffentlichung startet.'})
              if message_id:
                  telegram('editMessageReplyMarkup',{'chat_id':chat_id,'message_id':message_id,'reply_markup':{'inline_keyboard':[]}})
              telegram('sendMessage',{
                  'chat_id':configured_chat,
                  'text':f'✅ Freigabe erkannt.\n\nReview: {run_id}\nYouTube: private\nNach Abschluss folgt der YouTube-Link.',
              })
              handled+=1

          state['last_checked_at']=datetime.now(timezone.utc).isoformat()
          state['last_handled_count']=handled
          state_path.parent.mkdir(parents=True,exist_ok=True)
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f'changed={str(changed).lower()}\n')
              handle.write(f'handled={handled}\n')
          print({'updates':len(updates),'handled':handled,'next_update_id':state['next_update_id']})
          PY

      - name: Persist Telegram state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/tayvoriq-control-telegram-state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ops: persist TAYVORIQ control Telegram decisions"
          git pull --rebase origin main
          git push origin main
