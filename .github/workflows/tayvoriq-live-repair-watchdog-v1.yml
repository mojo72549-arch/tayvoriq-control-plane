name: TAYVORIQ Live Repair Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Share the recovery-owner lock: a stale live run must never race Delivery Watch
# while the same immutable Telegram request is being rebound.
concurrency:
  group: tayvoriq-delivery-watch
  cancel-in-progress: false

jobs:
  watch-live-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REPAIR_STALE_MINUTES: '38'
      MASTER_STALE_MINUTES: '42'
      DEFAULT_STALE_MINUTES: '30'
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve current Telegram-bound request and live step
        id: live
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, os, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path

          def gh_json(path):
              raw = subprocess.check_output(['gh','api',path], text=True)
              return json.loads(raw)

          candidates=[]
          for path in Path('requests').glob('*.json'):
              try: data=json.loads(path.read_text(encoding='utf-8'))
              except Exception: continue
              rid=str(data.get('request_id') or '').strip()
              if not rid or path.name != f'{rid}.json': continue
              if str(data.get('status') or '').upper() != 'DISPATCHED': continue
              if str(data.get('source') or '') != 'telegram_trend_approval': continue
              try: run_id=int(data.get('golden_path_run_id') or 0)
              except Exception: run_id=0
              if run_id: candidates.append((run_id,path,data))

          out={
              'found':'false','request_id':'','topic':'','run_id':'','run_status':'',
              'run_age_minutes':'0','step_name':'','step_age_minutes':'0',
              'stale':'false','stale_limit_minutes':'0','heartbeat':'false'
          }
          if candidates:
              run_id,path,data=max(candidates,key=lambda item:item[0])
              run=gh_json(f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}')
              status=str(run.get('status') or '')
              if status == 'in_progress':
                  now=datetime.now(timezone.utc)
                  started=datetime.fromisoformat(str(run.get('run_started_at') or run.get('created_at')).replace('Z','+00:00'))
                  run_age=max(0,int((now-started).total_seconds()//60))
                  jobs=gh_json(f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}/jobs?per_page=100')
                  active_step=None
                  for job in jobs.get('jobs') or []:
                      for step in job.get('steps') or []:
                          if str(step.get('status') or '') == 'in_progress':
                              active_step=step
                              break
                      if active_step: break
                  step_name=str((active_step or {}).get('name') or 'workflow in progress')
                  step_started_raw=str((active_step or {}).get('started_at') or '')
                  if step_started_raw:
                      step_started=datetime.fromisoformat(step_started_raw.replace('Z','+00:00'))
                      step_age=max(0,int((now-step_started).total_seconds()//60))
                  else:
                      step_age=run_age

                  folded=step_name.casefold()
                  if 'repair only failed local checkpoints' in folded:
                      stale_limit=int(os.environ['REPAIR_STALE_MINUTES'])
                  elif 'produce approved master' in folded:
                      stale_limit=int(os.environ['MASTER_STALE_MINUTES'])
                  else:
                      stale_limit=int(os.environ['DEFAULT_STALE_MINUTES'])
                  stale=step_age >= stale_limit
                  # A meaningful heartbeat starts after 8 minutes in one step.
                  # The workflow itself runs every 10 minutes, so this stays low-noise.
                  heartbeat=step_age >= 8 and not stale
                  out.update({
                      'found':'true','request_id':str(data.get('request_id') or ''),
                      'topic':str(data.get('topic') or ''),'run_id':str(run_id),
                      'run_status':status,'run_age_minutes':str(run_age),
                      'step_name':step_name.replace('\n',' '),
                      'step_age_minutes':str(step_age),'stale':str(stale).lower(),
                      'stale_limit_minutes':str(stale_limit),
                      'heartbeat':str(heartbeat).lower(),
                  })

          with open(sys.argv[1],'a',encoding='utf-8') as handle:
              for k,v in out.items(): handle.write(f'{k}={v}\n')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Telegram recovery heartbeat
        if: steps.live.outputs.heartbeat == 'true'
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '🔧 TAYVORIQ · Recovery arbeitet weiter\n\nThema: %s\nRun: %s\nAktiver Prüfschritt: %s\nAktiv seit: ca. %s Minuten\n\n✅ Render/Checkpoint und Freigabe bleiben gebunden.\n➡️ Der Watchdog überwacht den Schritt. Bei Stillstand wird derselbe Auftrag automatisch übernommen.\n\nFür dich: ✅ Keine Aktion nötig.' \
            "${{ steps.live.outputs.topic }}" \
            "${{ steps.live.outputs.run_id }}" \
            "${{ steps.live.outputs.step_name }}" \
            "${{ steps.live.outputs.step_age_minutes }}")
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}")
          python - "$response" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          if data.get('ok') is not True or not (data.get('result') or {}).get('message_id'):
              raise SystemExit('TELEGRAM_HEARTBEAT_NOT_VERIFIED')
          print('TELEGRAM_HEARTBEAT_MESSAGE_ID=' + str(data['result']['message_id']))
          PY

      - name: Telegram stalled repair takeover
        if: steps.live.outputs.stale == 'true'
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '🔧 TAYVORIQ · Hängende Reparatur automatisch erkannt\n\nThema: %s\nRun: %s\nPrüfschritt: %s\nOhne Abschluss seit: ca. %s Minuten\n\n✅ Freigabe, Quellen und vorhandener Checkpoint bleiben erhalten.\n➡️ Der festhängende Run wird jetzt beendet; der request-gebundene Recovery-Pfad übernimmt denselben Auftrag automatisch.\n\nFür dich: ✅ Keine Aktion nötig.' \
            "${{ steps.live.outputs.topic }}" \
            "${{ steps.live.outputs.run_id }}" \
            "${{ steps.live.outputs.step_name }}" \
            "${{ steps.live.outputs.step_age_minutes }}")
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}")
          python - "$response" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          if data.get('ok') is not True or not (data.get('result') or {}).get('message_id'):
              raise SystemExit('TELEGRAM_STALL_NOTICE_NOT_VERIFIED')
          print('TELEGRAM_STALL_MESSAGE_ID=' + str(data['result']['message_id']))
          PY

      - name: Cancel only the verified stale current run
        if: steps.live.outputs.stale == 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.live.outputs.run_id }}
          REQUEST_ID: ${{ steps.live.outputs.request_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          request_id=os.environ['REQUEST_ID']; run_id=int(os.environ['RUN_ID'])
          path=Path('requests')/f'{request_id}.json'
          data=json.loads(path.read_text(encoding='utf-8'))
          if str(data.get('request_id') or '') != request_id:
              raise SystemExit('STALE_WATCH_REQUEST_ID_CHANGED')
          if int(data.get('golden_path_run_id') or 0) != run_id:
              raise SystemExit('STALE_WATCH_RUN_ALREADY_SUPERSEDED')
          if str(data.get('source') or '') != 'telegram_trend_approval':
              raise SystemExit('STALE_WATCH_NOT_TELEGRAM_BOUND')
          print('STALE_CURRENT_REQUEST_VERIFIED')
          PY
          gh run cancel "$RUN_ID"
          for poll in $(seq 1 18); do
            sleep 5
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status + ":" + (.conclusion // "")')
            echo "CANCEL_POLL:${state}"
            [[ "$state" == completed:* ]] && exit 0
          done
          echo 'STALE_RUN_CANCEL_NOT_CONFIRMED'
          exit 1
