name: TAYVORIQ Auto-Publish Approved Review

on:
  push:
    branches: [main]
    paths:
      - ".automation/tayvoriq-reviews/**"
      - ".automation/tayvoriq-direct-reviews/**"
  workflow_dispatch:
    inputs:
      review_id:
        description: Optional approved review ID to publish
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tayvoriq-auto-publish-approved
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

jobs:
  publish-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate publication credentials
        run: |
          set -euo pipefail
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "::error title=Missing secret::$name"; exit 2; }
          done

      - name: Select approved unpublished review
        id: select
        env:
          REQUESTED_REVIEW_ID: ${{ inputs.review_id || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          requested = os.environ.get("REQUESTED_REVIEW_ID", "").strip()
          candidates = []
          for root in [Path('.automation/tayvoriq-reviews'), Path('.automation/tayvoriq-direct-reviews')]:
              if not root.exists():
                  continue
              for path in root.glob('*.json'):
                  try:
                      data = json.loads(path.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  review_id = str(data.get('review_id') or path.stem)
                  if requested and review_id != requested:
                      continue
                  if str(data.get('status') or '') == 'APPROVED' and not bool(data.get('platform_upload_performed')):
                      candidates.append((int(review_id) if review_id.isdigit() else 0, path, data))

          if not candidates:
              print('No approved unpublished review found.')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  out.write('found=false\n')
              raise SystemExit(0)

          _, path, data = max(candidates, key=lambda item: item[0])
          review_id = str(data.get('review_id') or path.stem)
          Path('selected-review.json').write_text(
              json.dumps({'path': str(path), 'review': data}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('found=true\n')
              out.write(f'review_id={review_id}\n')
              out.write(f'review_path={path}\n')
          print(f'Selected approved review {review_id} from {path}')
          PY

      - name: Resolve verified platform package and metadata
        if: steps.select.outputs.found == 'true'
        env:
          REVIEW_ID: ${{ steps.select.outputs.review_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          selected = json.loads(Path('selected-review.json').read_text(encoding='utf-8'))
          review = selected.get('review') or {}
          review_id = os.environ['REVIEW_ID']
          base = f'https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/{review_id}'
          payload = {
              'base': base,
              'youtube_video_url': str(review.get('youtube_video_url') or review.get('video_url') or f'{base}/short_youtube.mp4'),
              'tiktok_video_url': str(review.get('tiktok_video_url') or f'{base}/short_tiktok.mp4'),
          }
          Path('platform-urls.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY

          YOUTUBE_URL=$(python -c "import json; print(json.load(open('platform-urls.json'))['youtube_video_url'])")
          TIKTOK_URL=$(python -c "import json; print(json.load(open('platform-urls.json'))['tiktok_video_url'])")
          BASE=$(python -c "import json; print(json.load(open('platform-urls.json'))['base'])")
          for url in "$YOUTUBE_URL" "$TIKTOK_URL"; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$url" || true)
            test "$code" = "200" || { echo "::error title=Platform MP4 unavailable::$url HTTP $code"; exit 1; }
          done

          curl --fail --location --retry 3 "${BASE}/job.json" --output review-job.json
          curl --fail --location --retry 3 "${BASE}/preapproval_ai_audit.json" --output preapproval-ai-audit.json

          export YOUTUBE_URL TIKTOK_URL REVIEW_ID
          python - <<'PY'
          import json, os
          from pathlib import Path

          job = json.loads(Path('review-job.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('preapproval-ai-audit.json').read_text(encoding='utf-8'))

          quality = job.get('quality_report') if isinstance(job.get('quality_report'), dict) else {}
          if quality.get('passed') is not True:
              raise SystemExit('Publication blocked: job quality_report did not pass')
          if audit.get('passed') is not True:
              raise SystemExit('Publication blocked: preapproval audit did not pass')
          if audit.get('human_review_allowed') is not True:
              raise SystemExit('Publication blocked: human review was not allowed')
          if audit.get('quality_gates_weakened') is not False:
              raise SystemExit('Publication blocked: quality gate integrity invalid')
          if audit.get('blockers'):
              raise SystemExit(f"Publication blocked: audit blockers={audit.get('blockers')}")

          variants = job.get('variants') if isinstance(job.get('variants'), dict) else {}
          yt_variant = variants.get('youtube_shorts') if isinstance(variants.get('youtube_shorts'), dict) else {}
          tt_variant = variants.get('tiktok') if isinstance(variants.get('tiktok'), dict) else {}
          yt_package = yt_variant.get('text_package') if isinstance(yt_variant.get('text_package'), dict) else {}
          tt_package = tt_variant.get('text_package') if isinstance(tt_variant.get('text_package'), dict) else {}
          yt_meta = yt_package.get('youtube_metadata') if isinstance(yt_package.get('youtube_metadata'), dict) else {}
          tt_meta = tt_package.get('tiktok_metadata') if isinstance(tt_package.get('tiktok_metadata'), dict) else {}

          title = str(yt_meta.get('title') or '').strip()
          description = str(yt_meta.get('description') or '').strip()
          caption = str(tt_meta.get('caption') or '').strip()
          hashtags = yt_meta.get('hashtags') if isinstance(yt_meta.get('hashtags'), list) else []
          tags = ','.join(str(tag).strip().lstrip('#') for tag in hashtags if str(tag).strip())
          if not title or not description:
              raise SystemExit('Publication blocked: approved YouTube metadata missing')
          if not caption:
              raise SystemExit('Publication blocked: approved TikTok caption missing')

          payload = {
              'review_id': os.environ['REVIEW_ID'],
              'video_url': os.environ['YOUTUBE_URL'],
              'youtube_video_url': os.environ['YOUTUBE_URL'],
              'tiktok_video_url': os.environ['TIKTOK_URL'],
              'title': title,
              'description': description,
              'tags': tags,
              'privacy': 'public',
              'tiktok_caption': caption,
              'quality_gates_weakened': False,
          }
          Path('publish-payload.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Setup Python
        if: steps.select.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YouTube uploader
        if: steps.select.outputs.found == 'true'
        run: python -m pip install requests google-api-python-client google-auth google-auth-httplib2

      - name: Upload approved YouTube master publicly
        if: steps.select.outputs.found == 'true'
        run: |
          set -euo pipefail
          VIDEO_URL=$(python -c "import json; print(json.load(open('publish-payload.json'))['youtube_video_url'])")
          TITLE=$(python -c "import json; print(json.load(open('publish-payload.json'))['title'])")
          DESCRIPTION=$(python -c "import json; print(json.load(open('publish-payload.json'))['description'])")
          TAGS=$(python -c "import json; print(json.load(open('publish-payload.json'))['tags'])")
          python tools/youtube_publish_approved.py \
            --video-url "$VIDEO_URL" \
            --title "$TITLE" \
            --description "$DESCRIPTION" \
            --tags "$TAGS" \
            --privacy public \
            --output youtube-result.json
          test -s youtube-result.json

      - name: Mark review as published
        if: steps.select.outputs.found == 'true'
        env:
          REVIEW_PATH: ${{ steps.select.outputs.review_path }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(os.environ['REVIEW_PATH'])
          review = json.loads(path.read_text(encoding='utf-8'))
          result = json.loads(Path('youtube-result.json').read_text(encoding='utf-8'))
          payload = json.loads(Path('publish-payload.json').read_text(encoding='utf-8'))
          review.update({
              'platform_upload_performed': True,
              'publication_pending': False,
              'upload_status': 'PUBLISHED_YOUTUBE',
              'youtube': result,
              'published_at': datetime.now(timezone.utc).isoformat(),
              'youtube_privacy': 'public',
              'tiktok_status': 'MANUAL_UPLOAD_REQUIRED',
              'tiktok_video_url': payload['tiktok_video_url'],
              'tiktok_caption': payload['tiktok_caption'],
              'published_payload': payload,
          })
          path.write_text(json.dumps(review, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REVIEW_PATH"
          git commit -m "Publish approved TAYVORIQ review ${{ steps.select.outputs.review_id }} to YouTube"
          git pull --rebase origin main
          git push origin main

      - name: Send YouTube result and TikTok package to Telegram
        if: steps.select.outputs.found == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          result = json.load(open('youtube-result.json', encoding='utf-8'))
          payload = json.load(open('publish-payload.json', encoding='utf-8'))
          text = (
              '✅ YouTube-Upload fertig und öffentlich\n\n'
              f"🎬 YouTube: {result['url']}\n\n"
              '📱 TikTok – manuell hochladen:\n'
              f"MP4: {payload['tiktok_video_url']}\n\n"
              'Caption:\n'
              f"{payload['tiktok_caption']}"
          )
          data = urllib.parse.urlencode({'chat_id': os.environ['TELEGRAM_CHAT_ID'], 'text': text, 'disable_web_page_preview': 'false'}).encode('utf-8')
          request = urllib.request.Request(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage", data=data, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              body = response.read().decode('utf-8')
              print(body)
              parsed = json.loads(body)
              assert parsed.get('ok') is True and parsed.get('result', {}).get('message_id'), parsed
          PY

      - name: Upload publication evidence
        if: steps.select.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-youtube-publication-${{ steps.select.outputs.review_id }}
          path: |
            selected-review.json
            platform-urls.json
            review-job.json
            preapproval-ai-audit.json
            publish-payload.json
            youtube-result.json
          retention-days: 30

      - name: Notify Telegram on publication failure
        if: failure()
        run: |
          set +e
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode $'text=🔴 YouTube-Upload fehlgeschlagen\n\nDie Freigabe bleibt gespeichert. Es wird nichts doppelt hochgeladen. Der bestehende Review und das TikTok-Paket bleiben erhalten.' >/dev/null
          fi
