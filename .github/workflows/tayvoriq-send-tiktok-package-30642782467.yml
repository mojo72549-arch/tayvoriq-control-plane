name: TAYVORIQ Send TikTok Package 30642782467

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-send-tiktok-package-30642782467.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"
  REVIEW_RUN_ID: "30642782467"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  send-tiktok-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download approved review artifact
        uses: actions/download-artifact@v4
        with:
          name: tayvoriq-control-review-${{ env.REVIEW_RUN_ID }}
          path: approved-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.REVIEW_RUN_ID }}

      - name: Locate TikTok package
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          candidates=[]
          for meta in Path('approved-artifact').rglob('tiktok_metadata.json'):
              root=meta.parent
              video=root/'short_tiktok.mp4'
              if video.is_file():
                  candidates.append((root, video, meta))
          if not candidates:
              raise SystemExit('TikTok package not found')
          root, video, meta=sorted(candidates, key=lambda item: len(str(item[0])))[0]
          data=json.loads(meta.read_text(encoding='utf-8'))
          caption=str(data.get('caption') or '').strip()
          title=str(data.get('title') or '').strip()
          if not caption:
              raise SystemExit('TikTok caption missing')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write(f'TIKTOK_VIDEO={video.resolve()}\n')
              handle.write(f'TIKTOK_META={meta.resolve()}\n')
              handle.write(f'TIKTOK_TITLE={title}\n')
          Path('tiktok-caption.txt').write_text(caption+'\n',encoding='utf-8')
          print({'video':str(video),'bytes':video.stat().st_size,'title':title})
          PY

      - name: Send TikTok video to Telegram
        run: |
          set -euo pipefail
          VIDEO_CAPTION=$'🎵 TAYVORIQ TikTok-Paket\n\nDas ist die originale TikTok-Datei.\n1. Video in Telegram speichern\n2. TikTok öffnen und auf + tippen\n3. Hochladen wählen\n4. Sichtbarkeit auf Alle stellen\n5. KI-generierter Inhalt aktivieren\n\nDie kopierfertige Caption kommt direkt danach.'
          curl -fsS \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@${TIKTOK_VIDEO};type=video/mp4" \
            -F "caption=${VIDEO_CAPTION}" \
            -F "supports_streaming=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -o telegram-video-result.json
          python - <<'PY'
          import json
          value=json.load(open('telegram-video-result.json',encoding='utf-8'))
          if not value.get('ok'):
              raise SystemExit(value)
          print({'telegram_video_message_id':value['result']['message_id']})
          PY

      - name: Send copy-ready TikTok caption to Telegram
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, os, urllib.parse, urllib.request
          caption=open('tiktok-caption.txt',encoding='utf-8').read().strip()
          title=os.environ.get('TIKTOK_TITLE','').strip()
          text=(
              '📋 <b>TIKTOK-CAPTION – gedrückt halten und kopieren</b>\n\n'
              f'<pre>{html.escape(caption)}</pre>\n\n'
              '🖼 <b>Titelbild:</b> 40 GRAD – SO SCHÜTZT DU DICH\n'
              '👁 <b>Sichtbarkeit:</b> Alle\n'
              '🤖 <b>KI-Inhalt:</b> Aktivieren\n'
              '🎵 <b>Musik:</b> Keine zusätzliche Musik – Audio ist bereits fertig.'
          )
          payload=urllib.parse.urlencode({
              'chat_id':os.environ['TELEGRAM_CHAT_ID'],
              'text':text,
              'parse_mode':'HTML',
              'disable_web_page_preview':'true',
          }).encode()
          with urllib.request.urlopen(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data=payload,
              timeout=35,
          ) as response:
              value=json.loads(response.read().decode())
          if not value.get('ok'):
              raise SystemExit(value)
          print({'telegram_caption_message_id':value['result']['message_id'],'title':title})
          PY
