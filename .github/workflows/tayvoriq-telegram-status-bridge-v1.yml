name: TAYVORIQ Telegram Status Bridge V1

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Verified production status stage
        required: true
        default: recovery_started
        type: choice
        options:
          - recovery_started
          - audio_recovery
          - duplicate_blocked
          - technical_stop
          - sources_locked
          - production_active
          - render_heartbeat
          - checkpoint_repair
          - checkpoint_heartbeat
          - master_ready
          - quality_passed
      topic:
        description: Approved topic
        required: true
        type: string
      run_id:
        description: Related Golden Path run id
        required: true
        type: string
      elapsed_minutes:
        description: Verified active render minutes (heartbeat only)
        required: false
        default: "0"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/run-now/tayvoriq-progress-trigger.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: tayvoriq-telegram-status-bridge
  cancel-in-progress: false

jobs:
  send-verified-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Resolve validated status payload
        id: payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STAGE: ${{ inputs.stage || '' }}
          INPUT_TOPIC: ${{ inputs.topic || '' }}
          INPUT_RUN_ID: ${{ inputs.run_id || '' }}
          INPUT_ELAPSED_MINUTES: ${{ inputs.elapsed_minutes || '0' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              stage = os.environ.get("INPUT_STAGE", "")
              topic = os.environ.get("INPUT_TOPIC", "")
              run_id = os.environ.get("INPUT_RUN_ID", "")
              elapsed_minutes = os.environ.get("INPUT_ELAPSED_MINUTES", "0")
          else:
              path = Path(".github/run-now/tayvoriq-progress-trigger.json")
              data = json.loads(path.read_text(encoding="utf-8"))
              stage = str(data.get("stage") or "")
              topic = str(data.get("topic") or "")
              run_id = str(data.get("run_id") or "")
              elapsed_minutes = str(data.get("elapsed_minutes") or "0")

          allowed = {
              "recovery_started",
              "audio_recovery",
              "duplicate_blocked",
              "technical_stop",
              "sources_locked",
              "production_active",
              "render_heartbeat",
              "checkpoint_repair",
              "checkpoint_heartbeat",
              "master_ready",
              "quality_passed",
          }
          if stage not in allowed:
              raise SystemExit(f"STATUS_STAGE_INVALID: {stage!r}")
          topic = " ".join(topic.split()).strip()
          if not topic or len(topic) > 180:
              raise SystemExit("STATUS_TOPIC_INVALID")
          if not re.fullmatch(r"[0-9]{6,20}", run_id):
              raise SystemExit("STATUS_RUN_ID_INVALID")
          try:
              elapsed = int(str(elapsed_minutes).strip() or "0")
          except ValueError:
              raise SystemExit("STATUS_ELAPSED_MINUTES_INVALID")
          if elapsed < 0 or elapsed > 80:
              raise SystemExit("STATUS_ELAPSED_MINUTES_INVALID")
          if stage not in {"render_heartbeat", "checkpoint_heartbeat"}:
              elapsed = 0

          # Bind the bridge to the same durable Telegram request as the Golden
          # Path run. This prevents a bridge heartbeat from losing recovery
          # generation and visibly regressing from >=60 % back to 45 %.
          request_matches = []
          run_number = int(run_id)
          for request_path in Path("requests").glob("*.json"):
              try:
                  request = json.loads(request_path.read_text(encoding="utf-8"))
                  current_run = int(request.get("golden_path_run_id") or 0)
              except Exception:
                  continue
              if current_run != run_number:
                  continue
              if str(request.get("topic") or "").strip() != topic:
                  continue
              request_id = str(request.get("request_id") or "").strip()
              if not request_id or any(char in request_id for char in "/\\\r\n"):
                  continue
              request_matches.append(request_id)
          if len(request_matches) > 1:
              raise SystemExit("STATUS_REQUEST_BINDING_AMBIGUOUS")
          request_id = request_matches[0] if request_matches else ""

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"stage={stage}\n")
              handle.write(f"topic={topic}\n")
              handle.write(f"run_id={run_id}\n")
              handle.write(f"elapsed_minutes={elapsed}\n")
              handle.write(f"request_id={request_id}\n")
          print(json.dumps({
              "stage": stage,
              "topic": topic,
              "run_id": run_id,
              "elapsed_minutes": elapsed,
              "request_id": request_id or None,
              "request_bound": bool(request_id),
          }, ensure_ascii=False))
          PY

      - name: Suppress stale or superseded status
        id: guard
        env:
          STATUS_RUN_ID: ${{ steps.payload.outputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          suppressed=false
          reason=current

          if [ -f .github/run-now/tayvoriq-stale-stop.json ]; then
            target=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              d=json.loads(Path('.github/run-now/tayvoriq-stale-stop.json').read_text(encoding='utf-8'))
          except Exception:
              d={}
          value=str(d.get('target_run_id') or '')
          print(value if value.isdigit() else '')
          PY
            )
            if [ -n "$target" ] && [ "$target" = "$STATUS_RUN_ID" ]; then
              suppressed=true
              reason=explicit-stale-stop
            fi
          fi

          if [ "$suppressed" != "true" ]; then
            latest=$(gh run list \
              --workflow tayvoriq-deliver-video-now.yml \
              --limit 20 \
              --json databaseId \
              --jq '[.[].databaseId] | max // 0' 2>/dev/null || echo 0)
            if [[ "$latest" =~ ^[0-9]+$ ]] && [ "$latest" -gt "$STATUS_RUN_ID" ]; then
              suppressed=true
              reason="superseded-by-${latest}"
            fi
          fi

          echo "suppressed=$suppressed" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "TAYVORIQ Telegram status guard: run=$STATUS_RUN_ID suppressed=$suppressed reason=$reason"

      - name: Record suppressed stale status
        if: steps.guard.outputs.suppressed == 'true'
        run: echo "Stale Telegram status suppressed for run ${{ steps.payload.outputs.run_id }}; no message sent."

      - name: Send and verify Telegram status
        if: steps.guard.outputs.suppressed != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_REQUEST_ID_PIN: ${{ steps.payload.outputs.request_id }}
        run: |
          set -euo pipefail
          python tools/tayvoriq_telegram_progress_v1.py \
            --stage "${{ steps.payload.outputs.stage }}" \
            --topic "${{ steps.payload.outputs.topic }}" \
            --run-id "${{ steps.payload.outputs.run_id }}" \
            --run-attempt "1" \
            --elapsed-minutes "${{ steps.payload.outputs.elapsed_minutes }}"
