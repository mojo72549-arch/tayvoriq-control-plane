name: TAYVORIQ V15 Fallback CTA Contract Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-v15-fallback-cta-contract-fix.yml

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  patch-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public control plane
        uses: actions/checkout@v4

      - name: Checkout implementation at guarded branch
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Apply exact fail-closed CTA contract repair
        shell: bash
        run: |
          set -euo pipefail
          cd implementation
          EXPECTED_SHA="211397bbfff7d677240d8911557861c346e4ca7d"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "IMPLEMENTATION_SHA_MOVED: expected=$EXPECTED_SHA actual=$ACTUAL_SHA"; exit 1; }
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/tayvoriq_dual_platform_render_v15.py")
          text = path.read_text(encoding="utf-8")
          old_series = 'result["series_next"] = ""'
          if text.count(old_series) != 2:
              raise SystemExit(f"V15_PATCH_CONTRACT_FAILED: expected 2 series_next sites, got {text.count(old_series)}")
          text = text.replace(
              old_series,
              'result["series_next"] = "Im nächsten Teil: die wichtigsten Folgen."',
          )
          old_payoff = '''result["viewer_payoff"] = v2.ensure_sentence(\n        result.get("viewer_payoff") or "Das Video erklärt den Trend vollständig."\n    )'''
          if text.count(old_payoff) != 1:
              raise SystemExit("V15_PATCH_CONTRACT_FAILED: payoff normalization site changed")
          text = text.replace(
              old_payoff,
              'result["viewer_payoff"] = "So weißt du, was zählt."',
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile tools/tayvoriq_dual_platform_render_v15.py
          git diff --check
          git diff -- tools/tayvoriq_dual_platform_render_v15.py

      - name: Commit guarded implementation repair
        shell: bash
        run: |
          set -euo pipefail
          cd implementation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tayvoriq_dual_platform_render_v15.py
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "fix(tayvoriq): make V15 fallback CTA satisfy unchanged duration gates"
          git push origin HEAD:feature/multi-platform-distribution-package
