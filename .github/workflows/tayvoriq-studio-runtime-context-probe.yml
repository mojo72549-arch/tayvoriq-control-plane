name: TAYVORIQ Studio Runtime Context Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-studio-runtime-context-probe.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Studio production branch
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Print exact repair context
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          echo "STUDIO_SHA=$(git rev-parse HEAD)"
          target="runtime_patches/tayvoriq_verified_request_runtime_recovery.py"
          test -f "$target"
          nl -ba "$target" | sed -n '1,260p'
          echo "=== RELATED FILES ==="
          find tools runtime_patches src tests -maxdepth 2 -type f \
            \( -iname '*pronunciation*' -o -iname '*visual*audit*' -o -iname '*verified*request*recovery*' \) \
            -print | sort | head -120
