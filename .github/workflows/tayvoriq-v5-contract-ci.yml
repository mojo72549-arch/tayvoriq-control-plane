name: TAYVORIQ V5 Contract CI

on:
  pull_request:
    paths:
      - "tools/tayvoriq_retention_v5.py"
      - "tools/tayvoriq_analytics_v5.py"
      - "api/live.js"
      - "dashboard/api/live.js"
      - "dashboard/live.html"
      - "infra/telegram-approval-worker-v2.js"
      - "tools/tayvoriq_agent_trend_radar_v2.py"
      - "tools/tayvoriq_agent_trend_provider_v3.py"
      - "tools/tayvoriq_agent_trend_radar_v8.py"
      - "tools/tayvoriq_orchestration_contract.py"
      - "tests/test_tayvoriq_retention_v5.py"
      - ".github/workflows/tayvoriq-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q pytest
      - name: Compile V5 control-plane files
        run: |
          python -m py_compile \
            tools/tayvoriq_retention_v5.py \
            tools/tayvoriq_analytics_v5.py \
            tools/tayvoriq_agent_trend_radar_v2.py \
            tools/tayvoriq_agent_trend_provider_v3.py \
            tools/tayvoriq_agent_trend_radar_v8.py \
            tools/tayvoriq_orchestration_contract.py
      - name: Run V5 regressions
        run: python -m pytest -q tests/test_tayvoriq_retention_v5.py tests/test_tayvoriq_analytics_v5.py tests/test_tayvoriq_retention_control_center_v5.py
      - name: Dry-run a real historical request without publication
        run: |
          python tools/tayvoriq_retention_v5.py dry-run             --request requests/telegram-2657-trend-1.json             --out /tmp/tayvoriq-v5-real-request-dry-run.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/tayvoriq-v5-real-request-dry-run.json',encoding='utf-8'))
          assert p['dry_run'] is True
          assert p['platform_upload_performed'] is False
          assert p['review_required_before_publish'] is True
          assert p['quality_gates_weakened'] is False
          print(json.dumps(p,ensure_ascii=False,indent=2))
          PY

      - name: Checkout canonical private production ref
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: agent/gp-v5-legacy-compat-20260925
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Install private production test media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install private production Python test dependencies
        run: |
          grep -vE '^[[:space:]]*chatterbox-tts[[:space:]]*@' implementation/requirements.txt > /tmp/tayvoriq-v5-requirements.txt
          python -m pip install -q -r /tmp/tayvoriq-v5-requirements.txt

      - name: Compile private production V5 files
        run: |
          python -m py_compile \
            implementation/tools/tayvoriq_retention_v5.py \
            implementation/tools/tayvoriq_dual_platform_render_v34.py \
            implementation/tools/tayvoriq_publication_quality_gate_v2.py \
            implementation/tools/tayvoriq_build_dual_review_site.py

      - name: Run private production V5 regressions
        working-directory: implementation
        run: |
          python -m pytest -q \
            tests/test_tayvoriq_retention_v5.py \
            tests/test_tayvoriq_quality_gates.py::test_publication_gate_v2_accepts_strict_chatterbox_primary \
            tests/test_tayvoriq_review_actions.py::test_review_page_is_dual_platform_and_telegram_decision_status
