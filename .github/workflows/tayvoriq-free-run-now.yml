name: TAYVORIQ FREE RUN NOW

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".automation/tayvoriq-run-now.json"

permissions:
  actions: write
  contents: write

concurrency:
  group: tayvoriq-free-run-now
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Adopt existing run or dispatch one complete production
        id: launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requested_at="$(jq -r '.requested_at' .automation/tayvoriq-run-now.json)"
          request_id="$(jq -r '.request_id // "legacy"' .automation/tayvoriq-run-now.json)"

          find_run() {
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "TAYVORIQ Golden Path" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,url,status,conclusion,createdAt \
              --jq ".[] | select(.createdAt >= \"$requested_at\") | @json" \
              | head -n 1
          }

          run_json="$(find_run || true)"
          if [ -z "$run_json" ]; then
            gh workflow run "TAYVORIQ Golden Path" \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f mode=full \
              -f trend_scope=auto_scope \
              -f topic=''

            for _ in $(seq 1 20); do
              run_json="$(find_run || true)"
              [ -n "$run_json" ] && break
              sleep 2
            done
          fi

          if [ -z "$run_json" ]; then
            echo "::error title=Golden Path dispatch unresolved::No run could be found or started."
            exit 1
          fi

          printf '%s\n' "$run_json" > /tmp/run.json
          run_id="$(jq -r '.databaseId' /tmp/run.json)"
          run_url="$(jq -r '.url' /tmp/run.json)"
          run_status="$(jq -r '.status' /tmp/run.json)"
          run_created_at="$(jq -r '.createdAt' /tmp/run.json)"

          mkdir -p .github/run-now
          jq -n \
            --arg request_id "$request_id" \
            --arg requested_at "$requested_at" \
            --argjson run_id "$run_id" \
            --arg url "$run_url" \
            --arg status "$run_status" \
            --arg created_at "$run_created_at" \
            '{request_id:$request_id,requested_at:$requested_at,run_id:$run_id,url:$url,status:$status,created_at:$created_at,workflow:"TAYVORIQ Golden Path",runner_mode:"public_free"}' \
            > .github/run-now/latest-free-golden-path-run.json

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "Golden Path run: $run_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Record active public production run
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/run-now/latest-free-golden-path-run.json
          if ! git diff --cached --quiet; then
            git commit -m "ops(tayvoriq): record active free Golden Path run"
            git push origin main
          fi
