name: FinanzPilot Android APK

on:
  push:
    branches: [ finanzpilot-apk-build-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle --no-daemon -p finanzpilot-android :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp finanzpilot-android/app/build/outputs/apk/debug/app-debug.apk dist/FinanzPilot_v2.0.0.apk
          sha256sum dist/FinanzPilot_v2.0.0.apk > dist/FinanzPilot_v2.0.0.sha256
          printf 'version=2.0.0\ncommit=%s\nfeature=truth-first-current-vs-historical-dashboard-with-charts\n' "$GITHUB_SHA" > dist/BUILD_INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinanzPilot-v2-0-0-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
