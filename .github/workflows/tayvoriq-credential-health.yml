name: TAYVORIQ Credential Health

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/tayvoriq-credential-health.yml

permissions:
  contents: read

concurrency:
  group: tayvoriq-credential-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check repository and provider credentials
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          failures=0

          require_secret() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing credential::$name is not configured"
              failures=$((failures + 1))
            fi
          }

          for name in PRIVATE_REPO_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID PEXELS_API_KEY YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            require_secret "$name"
          done

          if [ "$failures" -eq 0 ]; then
            headers=$(mktemp)
            repo_status=$(curl --silent --show-error \
              --dump-header "$headers" \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${PRIVATE_REPO_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/mojo72549-arch/shorts-agent-studio')
            if [ "$repo_status" != "200" ]; then
              echo "::error title=Private repository access failed::GitHub returned HTTP ${repo_status}"
              failures=$((failures + 1))
            else
              echo "Private repository access: passed"
            fi

            expiration=$(awk -F': ' 'tolower($1)=="github-authentication-token-expiration" {gsub("\r", "", $2); print $2}' "$headers" | tail -n 1)
            if [ -n "$expiration" ]; then
              days_left=$(EXPIRATION="$expiration" python - <<'PY'
          import os
          from datetime import datetime, timezone
          value = os.environ["EXPIRATION"].strip()
          expires = datetime.fromisoformat(value.replace("Z", "+00:00"))
          print(int((expires - datetime.now(timezone.utc)).total_seconds() // 86400))
          PY
              )
              echo "Private repository token expiry: ${expiration} (${days_left} days remaining)"
              if [ "$days_left" -lt 30 ]; then
                echo "::error title=Private repository token expires soon::${days_left} days remaining"
                failures=$((failures + 1))
              fi
            else
              echo "Private repository token: GitHub reported no expiration header"
            fi

            telegram_status=$(curl --silent --show-error \
              --output /tmp/telegram-health.json \
              --write-out '%{http_code}' \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
            if [ "$telegram_status" != "200" ] || ! jq -e '.ok == true' /tmp/telegram-health.json >/dev/null; then
              echo "::error title=Telegram bot unavailable::Credential check failed"
              failures=$((failures + 1))
            else
              echo "Telegram bot: passed"
            fi

            pexels_status=$(curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: ${PEXELS_API_KEY}" \
              'https://api.pexels.com/v1/search?query=technology&per_page=1')
            if [ "$pexels_status" != "200" ]; then
              echo "::error title=Pexels unavailable::Credential check returned HTTP ${pexels_status}"
              failures=$((failures + 1))
            else
              echo "Pexels: passed"
            fi

            youtube_status=$(curl --silent --show-error \
              --output /tmp/youtube-health.json \
              --write-out '%{http_code}' \
              --request POST \
              --data-urlencode "client_id=${YOUTUBE_CLIENT_ID}" \
              --data-urlencode "client_secret=${YOUTUBE_CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${YOUTUBE_REFRESH_TOKEN}" \
              --data-urlencode 'grant_type=refresh_token' \
              'https://oauth2.googleapis.com/token')
            if [ "$youtube_status" != "200" ] || ! jq -e '.access_token | length > 0' /tmp/youtube-health.json >/dev/null; then
              error_name=$(jq -r '.error // "unknown_error"' /tmp/youtube-health.json 2>/dev/null || echo unknown_error)
              echo "::error title=YouTube authorization unavailable::${error_name}"
              failures=$((failures + 1))
            else
              echo "YouTube refresh authorization: passed"
            fi
          fi

          if [ "$failures" -ne 0 ]; then
            echo "Credential health failed with ${failures} problem(s)."
            exit 1
          fi

          echo "All durable credential checks passed."

      - name: Send Telegram maintenance alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram itself is unavailable; the failed Actions run remains the visible alert."
            exit 0
          fi
          message=$(cat <<EOF
          ⚠️ TAYVORIQ benötigt Wartung

          Eine Berechtigung oder ein externer Anbieter ist nicht mehr einsatzbereit oder läuft bald ab.
          Die tägliche Produktion wurde nicht stillschweigend fortgesetzt.

          Diagnose:
          ${RUN_URL}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            >/dev/null
