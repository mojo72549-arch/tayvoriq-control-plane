name: TAYVORIQ Human Review Restart

on:
  push:
    branches: [main]
    paths:
      - .github/run-now/tayvoriq-human-review-restart.json

permissions:
  contents: write
  actions: write

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel stale pre-patch production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/32210196564/cancel" || true

      - name: Lock natural narrator and retrigger human review
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/tayvoriq-deliver-video-now.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace('TAYVORIQ_NARRATOR_PITCH_FACTOR: "0.90"', 'TAYVORIQ_NARRATOR_PITCH_FACTOR: "1.0"')
          text = text.replace('TAYVORIQ_NARRATOR_TONE_REQUIRED: "true"', 'TAYVORIQ_NARRATOR_TONE_REQUIRED: "false"')
          workflow.write_text(text, encoding='utf-8')

          trigger = Path('.github/run-now/tayvoriq-x-request.json')
          data = json.loads(trigger.read_text(encoding='utf-8'))
          data['requested_at'] = '2026-08-19T05:03:00+02:00'
          data['request_nonce'] = 'em-human-story-review-v2-natural-voice-20260819T050300CEST'
          data['retry_of_run_id'] = 32210196564
          data['reason'] = 'human-first-review-natural-voice-no-pitch-shift'
          data['recovery_generation'] = 2
          trigger.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          grep 'TAYVORIQ_NARRATOR_PITCH_FACTOR: "1.0"' .github/workflows/tayvoriq-deliver-video-now.yml
          grep 'TAYVORIQ_NARRATOR_TONE_REQUIRED: "false"' .github/workflows/tayvoriq-deliver-video-now.yml

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/workflows/tayvoriq-deliver-video-now.yml .github/run-now/tayvoriq-x-request.json
          git commit -m "Run human-first EM review with natural voice"
          git push
