name: TAYVORIQ Eclipse V6 Review Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/run-now/tayvoriq-eclipse-v6-review-recovery.json'

concurrency:
  group: tayvoriq-eclipse-v6-review-recovery
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  recover-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Checkout fixed audit review builder
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: audit-implementation
          fetch-depth: 1

      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Restore exact passed V6 artifact
        uses: actions/download-artifact@v4
        with:
          name: tayvoriq-eclipse-afterglow-v6-31670946329
          run-id: 31670946329
          github-token: ${{ github.token }}
          path: restored

      - name: Prove exact V6 masters and passed gates
        id: prove
        run: |
          set -euo pipefail
          JOB=restored/out/eclipsereview
          test -s "$JOB/short_youtube.mp4"
          test -s "$JOB/short_tiktok.mp4"
          test -s "$JOB/job.json"
          test -s "$JOB/preapproval_ai_audit.json"
          test -s "$JOB/publication_quality_gate.json"
          echo '77d312fe8f1445d3e0a1cfc86c4ef35a155ec94a1844c787357583268c692059  restored/out/eclipsereview/short_youtube.mp4' | sha256sum -c -
          echo '4794ab3d3f2c93a5c994448d52ff0da827c5f837d4e06b4bec162ae8377c7771  restored/out/eclipsereview/short_tiktok.mp4' | sha256sum -c -
          echo 'af9f9d782b6cccc2431a993e01ae8983d4810ebe6b365c2fd8245d69d679ebed  restored/out/eclipsereview/job.json' | sha256sum -c -
          echo '2ea631b8bff6e1e7ce042d4b555a9e2af540224a795ae6cf906d21902333565a  restored/out/eclipsereview/preapproval_ai_audit.json' | sha256sum -c -
          echo 'ae97ffbfe23d5701bfe152b90f519c0f2e0354a67fb26cc0ef4ad39ac1927712  restored/out/eclipsereview/publication_quality_gate.json' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('restored/out/eclipsereview')
          job=json.loads((root/'job.json').read_text(encoding='utf-8'))
          audit=json.loads((root/'preapproval_ai_audit.json').read_text(encoding='utf-8'))
          gate=json.loads((root/'publication_quality_gate.json').read_text(encoding='utf-8'))
          assert job['quality_report']['passed'] is True
          assert job['quality_report']['full_spoken_captions'] is True
          assert job['quality_report']['editorial_summary_overlays_used'] is False
          assert set(job['variants']) == {'youtube_shorts','tiktok'}
          scenes=job['variants']['youtube_shorts']['text_package']['scenes']
          assert len(scenes) == 8
          assert all(s['display_chunk'] == s['spoken_chunk'] for s in scenes)
          assert audit['passed'] is True
          assert audit['human_review_allowed'] is True
          assert audit['quality_gates_weakened'] is False
          assert not audit.get('blockers')
          assert set(audit['targets']) == {'youtube_shorts','tiktok'}
          assert gate['passed'] is True
          assert gate['quality_gates_weakened'] is False
          assert set(gate['targets']) == {'youtube_shorts','tiktok'}
          assert gate['production_mix']['passed'] is True
          print('EXACT_V6_MASTER_AND_GATES_PROVEN')
          PY

      - name: Build dual-platform approval review only
        id: review
        run: |
          set -euo pipefail
          rm -rf site/tayvoriq
          python audit-implementation/tools/tayvoriq_build_youtube_review_site.py \
            --job-dir restored/out/eclipsereview \
            --site-root site/tayvoriq \
            --run-id "${GITHUB_RUN_ID}"
          test -s "site/tayvoriq/runs/${GITHUB_RUN_ID}/index.html"
          test -s "site/tayvoriq/runs/${GITHUB_RUN_ID}/short_youtube.mp4"
          test -s "site/tayvoriq/runs/${GITHUB_RUN_ID}/short_tiktok.mp4"
          grep -q 'YouTube + TikTok sind vollständig geprüft' "site/tayvoriq/runs/${GITHUB_RUN_ID}/index.html"
          echo '77d312fe8f1445d3e0a1cfc86c4ef35a155ec94a1844c787357583268c692059  site/tayvoriq/runs/'"${GITHUB_RUN_ID}"'/short_youtube.mp4' | sha256sum -c -
          echo '4794ab3d3f2c93a5c994448d52ff0da827c5f837d4e06b4bec162ae8377c7771  site/tayvoriq/runs/'"${GITHUB_RUN_ID}"'/short_tiktok.mp4' | sha256sum -c -
          echo REVIEW_ONLY_RECOVERY_BUILT

      - name: Publish recovered review page
        id: publish
        run: |
          set -euo pipefail
          mkdir -p pages-worktree/tayvoriq/latest pages-worktree/tayvoriq/runs/${GITHUB_RUN_ID}
          rsync -a --delete site/tayvoriq/latest/ pages-worktree/tayvoriq/latest/
          rsync -a site/tayvoriq/runs/${GITHUB_RUN_ID}/ pages-worktree/tayvoriq/runs/${GITHUB_RUN_ID}/
          cp site/tayvoriq/index.html pages-worktree/tayvoriq/index.html
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish TAYVORIQ eclipse V6 recovered review ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Verify published platform package
        id: verify_public
        run: |
          set -euo pipefail
          BASE="https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}"
          for path in short_youtube.mp4 short_tiktok.mp4 job.json preapproval_ai_audit.json publication_quality_gate.json; do
            curl -fsSL --retry 5 --retry-delay 2 "${BASE}/${path}" -o "/tmp/${path}"
            test -s "/tmp/${path}"
          done
          echo '77d312fe8f1445d3e0a1cfc86c4ef35a155ec94a1844c787357583268c692059  /tmp/short_youtube.mp4' | sha256sum -c -
          echo '4794ab3d3f2c93a5c994448d52ff0da827c5f837d4e06b4bec162ae8377c7771  /tmp/short_tiktok.mp4' | sha256sum -c -
          echo PUBLIC_REVIEW_PACKAGE_VERIFIED

      - name: Send Telegram approval review
        id: telegram
        env:
          PYTHONPATH: ${{ github.workspace }}/audit-implementation:${{ github.workspace }}/audit-implementation/tools
        run: |
          set -euo pipefail
          python audit-implementation/tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --dashboard-url "" \
            --review-id "${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/" \
            --approval-mode manual

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-eclipse-v6-review-recovery-${{ github.run_id }}
          path: |
            restored/out/eclipsereview/job.json
            restored/out/eclipsereview/preapproval_ai_audit.json
            restored/out/eclipsereview/publication_quality_gate.json
            site/tayvoriq/**
          retention-days: 30
          compression-level: 1

      - name: Telegram precise recovery failure
        if: failure()
        env:
          PROVE: ${{ steps.prove.outcome }}
          REVIEW: ${{ steps.review.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          PUBLIC_VERIFY: ${{ steps.verify_public.outcome }}
          TELEGRAM: ${{ steps.telegram.outcome }}
        run: |
          set +e
          stage="UNKNOWN"
          if [ "$PROVE" != "success" ]; then stage="EXACT_ARTIFACT_PROOF";
          elif [ "$REVIEW" != "success" ]; then stage="DUAL_PLATFORM_REVIEW_BUILD";
          elif [ "$PUBLISH" != "success" ]; then stage="REVIEW_PUBLISH";
          elif [ "$PUBLIC_VERIFY" != "success" ]; then stage="PUBLIC_PACKAGE_VERIFY";
          elif [ "$TELEGRAM" != "success" ]; then stage="TELEGRAM_REVIEW_DELIVERY"; fi
          message=$(printf '❌ TAYVORIQ V6 Review-Recovery blockiert\n\nRun: %s\nStufe: %s\n\nDer bestandene V6-Master aus Run 31670946329 wurde nicht verändert. Nichts veröffentlicht.' "$GITHUB_RUN_ID" "$stage")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${message}" >/dev/null || true
