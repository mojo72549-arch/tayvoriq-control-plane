name: TAYVORIQ Heat Final Recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-heat-final-recovery-20260813.yml

permissions:
  contents: read
  actions: write

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
  TOPIC: "Die konkreten Folgen der aktuellen Hitzewelle für Europa: Gesundheit, Wasser, Landwirtschaft, Brände und Infrastruktur"
  TREND_ID: "1"
  TAYVORIQ_CONTROL_PLANE_SCHEMA: "x-v3"
  TAYVORIQ_EXECUTION_BACKEND: "github_hosted_public"
  TAYVORIQ_CLOUD_MODE: "true"
  TAYVORIQ_RENDER_SIZE: "1080x1920"
  TAYVORIQ_TTS_PROVIDER: "chatterbox_v3"
  TAYVORIQ_CHATTERBOX_ENABLED: "true"
  TAYVORIQ_CHATTERBOX_REQUIRED: "true"
  TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
  TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
  TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "300"
  TAYVORIQ_CHATTERBOX_MAX_CHUNKS: "2"
  TAYVORIQ_CHATTERBOX_MAX_CHARS: "520"
  TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
  TAYVORIQ_CHATTERBOX_EXAGGERATION: "0.42"
  TAYVORIQ_CHATTERBOX_CFG_WEIGHT: "0.36"
  TAYVORIQ_CHATTERBOX_PAUSE_MS: "360"
  TAYVORIQ_NATURAL_VOICE_WPM: "132"
  TAYVORIQ_NARRATOR_PITCH_FACTOR: "0.90"
  TAYVORIQ_NARRATOR_TONE_REQUIRED: "true"
  TAYVORIQ_RENDER_TIMEOUT_SECONDS: "900"
  TAYVORIQ_EDGE_RECOVERY_TIMEOUT_SECONDS: "900"
  TAYVORIQ_AUDIT_TIMEOUT_SECONDS: "210"
  TAYVORIQ_AUDIT_RETRY_DELAYS: "0,12,30"
  TAYVORIQ_CONTROLLER_TIMEOUT_SECONDS: "1800"
  TAYVORIQ_VISUAL_REPAIR_TIMEOUT_SECONDS: "900"
  TAYVORIQ_VOICE_REPAIR_TIMEOUT_SECONDS: "1200"
  TAYVORIQ_LOCAL_QUALITY_REPAIR_ATTEMPTS: "2"
  TAYVORIQ_APPROVED_TREND_PINNED: "true"
  TAYVORIQ_TELEGRAM_PROGRESS: "false"
  TAYVORIQ_SOURCE_CONTEXT_FILE: ${{ github.workspace }}/tayvoriq-source-context.json
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  recover-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Materialize preserved verified heat source context
        shell: bash
        run: |
          set -euo pipefail
          cat > "$TAYVORIQ_SOURCE_CONTEXT_FILE" <<'JSON'
          {
            "verified_at": "2026-08-13T21:35:00Z",
            "independent_news_count": 2,
            "sources": [
              {
                "publisher": "Reuters",
                "url": "https://www.reuters.com/business/energy/french-power-prices-jump-over-20-heatwave-tightens-supply-2026-08-11/",
                "supports": "Die aktuelle Hitzewelle belastet Europas Energieversorgung: In Frankreich können hohe Flusstemperaturen die Leistung von Kernkraftwerken begrenzen; zugleich verschärfen Hitze und schwache Windstromproduktion die Strommarktlage."
              },
              {
                "publisher": "Associated Press",
                "url": "https://apnews.com/article/f4f6ecf0953d423e0a70b74cd477c81a",
                "supports": "Westeuropa erlebt eine intensive Hitzewelle mit Temperaturen um 40 Grad, Dürre, Waldbrandgefahr und hoher gesundheitlicher Belastung."
              },
              {
                "publisher": "Deutscher Wetterdienst",
                "url": "https://www.dwd.de/DE/leistungen/hitzewarnung/hitzewarnung.html",
                "supports": "Starke Wärmebelastung und ausbleibende nächtliche Abkühlung können gesundheitlich gefährlich werden."
              },
              {
                "publisher": "WHO Europe",
                "url": "https://www.who.int/europe/news-room/fact-sheets/item/keepcool-in-the-heat",
                "supports": "Extreme Hitze erhöht Risiken für Hitzeschlag und kann Herz-Kreislauf-, Atemwegs- und Nierenerkrankungen verschlimmern."
              }
            ],
            "fallback_editorial_answers": {
              "what_happened": "Europas Hitzewelle belastet Gesundheit, Böden, Energieversorgung und Verkehr gleichzeitig.",
              "why_happening": "Weil Hitze und Trockenheit Menschen, Wasserreserven und technische Systeme belasten.",
              "who_is_affected": "Besonders betroffen sind Ältere, Kinder, chronisch Kranke und Außenarbeiter.",
              "personal_impact": "Für dich steigen Kreislaufstress, Schlafprobleme und mögliche Versorgungsprobleme.",
              "action_now": "Prüfe Hitzewarnungen, meide Mittagshitze, trinke regelmäßig und beachte regionale Einschränkungen."
            },
            "editorial_direction": {
              "hook": "Europas Hitzewelle wird jetzt zum echten Belastungstest – für Menschen, Wasser und Infrastruktur.",
              "story_order": [
                "Gesundheit und fehlende nächtliche Erholung",
                "Trockenheit, Wasserstress und Waldbrandgefahr",
                "Landwirtschaft und Vegetation",
                "Energie- und Infrastrukturfolgen",
                "konkreter Zuschauer-Nutzen"
              ],
              "visual_style": "hochwertig dokumentarisch realistisch; jede Szene muss die gesprochene Behauptung direkt unterstützen; keine generischen Strand- oder Thermometer-Füllbilder",
              "target_duration_seconds": 35,
              "semantic_gate": "Der Short muss konkret beantworten, welche aktuellen Folgen die Hitzewelle für Europa hat. Allgemeine Hitze-Erklärungen reichen nicht."
            }
          }
          JSON
          python - <<'PY'
          import json,re,os
          from pathlib import Path
          d=json.loads(Path(os.environ['TAYVORIQ_SOURCE_CONTEXT_FILE']).read_text(encoding='utf-8'))
          keys=('what_happened','why_happening','who_is_affected','personal_impact','action_now')
          counts=[]
          for k in keys:
              n=len(re.findall(r'\b[\wÄÖÜäöüß-]+\b',d['fallback_editorial_answers'][k]))
              if not 5 <= n <= 15: raise SystemExit(f'HEAT_EDITORIAL_FIELD_WORDS_FAILED:{k}:{n}')
              counts.append(n)
          total=sum(counts)
          if not 38 <= total <= 49: raise SystemExit(f'HEAT_EDITORIAL_BODY_WORDS_FAILED:{total}')
          if not d['fallback_editorial_answers']['why_happening'].startswith('Weil '): raise SystemExit('HEAT_CAUSE_FAILED')
          if not d['fallback_editorial_answers']['personal_impact'].startswith('Für dich '): raise SystemExit('HEAT_PERSONAL_IMPACT_FAILED')
          if not d['fallback_editorial_answers']['action_now'].startswith('Prüfe '): raise SystemExit('HEAT_ACTION_FAILED')
          print({'heat_source_context':'preserved','editorial_body_words':total,'quality_gates_weakened':False})
          PY

      - name: Validate secrets
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID PEXELS_API_KEY GROQ_API_KEY GEMINI_API_KEY; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done

      - name: Checkout implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Apply guarded V15 contract repair locally
        shell: bash
        run: |
          set -euo pipefail
          cd implementation
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/tayvoriq_dual_platform_render_v15.py')
          s=p.read_text(encoding='utf-8')
          blank='result["series_next"] = ""'
          payoff='result["viewer_payoff"] = v2.ensure_sentence(\n        result.get("viewer_payoff") or "Das Video erklärt den Trend vollständig."\n    )'
          if s.count(blank) != 2 or s.count(payoff) != 1:
              raise SystemExit('V15_RUNTIME_REPAIR_REFUSED: implementation shape changed')
          s=s.replace(blank,'result["series_next"] = "Im nächsten Teil: die wichtigsten Folgen."')
          s=s.replace(payoff,'result["viewer_payoff"] = "So weißt du, was zählt."')
          s=s.replace('"series_next": "",\n            "viewer_payoff": "Das Video erklärt den Trend vollständig.",','"series_next": normalized["series_next"],\n            "viewer_payoff": normalized["viewer_payoff"],')
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/tayvoriq_dual_platform_render_v15.py
          git diff --check
          echo 'V15_RUNTIME_CONTRACT_REPAIR_APPLIED quality_gates_weakened=false'

      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Restore dependency and model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ${{ env.HF_HOME }}
            ${{ env.TORCH_HOME }}
          key: tayvoriq-deps-v2-${{ runner.os }}-py311-${{ hashFiles('implementation/requirements.txt') }}-torch260-chatterbox-65b18437
          restore-keys: |
            tayvoriq-deps-v2-${{ runner.os }}-py311-

      - name: Install production dependencies
        run: |
          set -euo pipefail
          missing=()
          for command in ffmpeg ffprobe rsync git; do command -v "$command" >/dev/null || missing+=("$command"); done
          if [ "${#missing[@]}" -gt 0 ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg rsync git; fi
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          python -m pip install -r implementation/requirements.txt pytest -q
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0" -q
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948" -q

      - name: Preflight
        working-directory: implementation
        run: |
          set -euo pipefail
          mkdir -p out/control-plane
          python -m compileall -q tools src runtime_patches
          python tools/tayvoriq_preflight_check.py --report-out out/control-plane/preflight.json

      - name: Produce approved heat master
        id: controller
        working-directory: implementation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/tayvoriq-self-heal
          set +e
          python tools/tayvoriq_autonomous_entrypoint.py \
            --trend-mode approved_trend \
            --trend-scope world_society \
            --topic "${TOPIC}" \
            --language Deutsch \
            --platform youtube_tiktok \
            --target-duration 35 \
            --llm-provider auto \
            --outdir out/tayvoriq-youtube-tiktok \
            --site-root site/tayvoriq \
            --run-id "${GITHUB_RUN_ID}" \
            --state-out out/tayvoriq-review-state.json \
            --report-out out/tayvoriq-self-heal/report.json \
            --request-out out/tayvoriq-self-heal/request.json \
            --max-runtime-attempts 1 \
            --self-heal-depth 0 \
            --target-branch feature/multi-platform-distribution-package \
            2>&1 | tee out/tayvoriq-self-heal/controller-console.log
          process_exit=${PIPESTATUS[0]}
          set -e
          state=$(python -c 'import json,pathlib; p=pathlib.Path("out/tayvoriq-self-heal/report.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get("state") or "TECHNICAL_FAILURE")')
          reusable_master=$(python - <<'PY'
          from pathlib import Path
          import tayvoriq_resume_existing_render as resume
          print('true' if resume.rendered_candidates(Path('out/tayvoriq-youtube-tiktok')) else 'false')
          PY
          )
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "process_exit=$process_exit" >> "$GITHUB_OUTPUT"
          echo "reusable_master=$reusable_master" >> "$GITHUB_OUTPUT"
          echo "Controller handoff: state=$state reusable_master=$reusable_master process_exit=$process_exit"
          exit 0

      - name: Repair only failed local checkpoints
        id: recovery
        if: steps.controller.outputs.state != 'SUCCESS' && steps.controller.outputs.reusable_master == 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python tools/tayvoriq_resume_existing_render_v2.py \
            --outdir out/tayvoriq-youtube-tiktok \
            --site-root site/tayvoriq \
            --run-id "${GITHUB_RUN_ID}" \
            --state-out out/tayvoriq-review-state.json \
            --report-out out/tayvoriq-self-heal/report.json \
            2>&1 | tee out/tayvoriq-self-heal/checkpoint-resume-console.log
          resume_exit=${PIPESTATUS[0]}
          set -e
          state=$(python -c 'import json,pathlib; p=pathlib.Path("out/tayvoriq-self-heal/report.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get("state") or "PUBLISHABLE_OUTPUT_RETRY_REQUIRED")')
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "process_exit=$resume_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert publishable output
        id: production
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.controller.outputs.state }}" = "SUCCESS" ] && [ "${{ steps.controller.outputs.process_exit }}" = "0" ]; then exit 0; fi
          if [ "${{ steps.recovery.outputs.state }}" = "SUCCESS" ] && [ "${{ steps.recovery.outputs.process_exit }}" = "0" ]; then exit 0; fi
          echo "Production not publishable: controller=${{ steps.controller.outputs.state }}/${{ steps.controller.outputs.process_exit }} recovery=${{ steps.recovery.outputs.state }}/${{ steps.recovery.outputs.process_exit }}"
          exit 1

      - name: Validate publication quality
        if: steps.production.outcome == 'success'
        working-directory: implementation
        run: |
          set -euo pipefail
          JOB_DIR=$(python -c 'import json,pathlib; d=json.loads(pathlib.Path("out/tayvoriq-review-state.json").read_text()); print(d.get("job_dir") or "")')
          test -n "$JOB_DIR" && test -d "$JOB_DIR"
          python tools/tayvoriq_publication_quality_gate_v2.py --job-dir "$JOB_DIR" --targets youtube_tiktok

      - name: Publish review page
        id: publish_review
        run: |
          set -euo pipefail
          rm -rf pages-worktree/tayvoriq
          mkdir -p pages-worktree/tayvoriq
          rsync -a implementation/site/tayvoriq/ pages-worktree/tayvoriq/
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish TAYVORIQ heat recovery review ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Send Telegram review
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "" \
            --dashboard-url "" \
            --review-id "${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"

      - name: Upload finished review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-heat-final-${{ github.run_id }}
          path: |
            implementation/out/tayvoriq-youtube-tiktok/**
            implementation/out/tayvoriq-review-state.json
            implementation/out/tayvoriq-self-heal/**
            implementation/site/tayvoriq/runs/${{ github.run_id }}/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
