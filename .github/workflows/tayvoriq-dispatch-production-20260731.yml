name: Dispatch TAYVORIQ Production 2026-07-31

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-dispatch-production-20260731.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-production:
    runs-on: ubuntu-latest
    steps:
      - name: Start today's TAYVORIQ production with repository token
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_REPO_TOKEN:-}" || { echo "::error title=Missing secret::PRIVATE_REPO_TOKEN"; exit 2; }
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tayvoriq-deliver-video-now.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PRIVATE_REPO_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}')
          cat response.txt || true
          test "$status" = "204" || { echo "::error title=Dispatch failed::HTTP $status"; exit 1; }
          echo "Today's TAYVORIQ production was dispatched successfully."
