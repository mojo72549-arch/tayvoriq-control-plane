name: TAYVORIQ Execute Approved Review 30642782467

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-manual-approved-publish-30642782467.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tayvoriq-manual-approved-publish-30642782467
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  REVIEW_RUN_ID: "30642782467"
  YOUTUBE_PRIVACY: "private"
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_CATEGORY_ID: "28"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  publish-approved-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate explicit approval
        run: |
          set -euo pipefail
          test "$REVIEW_RUN_ID" = "30642782467"
          test "$YOUTUBE_PRIVACY" = "private"

      - name: Checkout publishing implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Install publishing dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -q
          python -m pip install -r implementation/requirements.txt -q

      - name: Download approved review artifact
        uses: actions/download-artifact@v4
        with:
          name: tayvoriq-control-review-${{ env.REVIEW_RUN_ID }}
          path: approved-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.REVIEW_RUN_ID }}

      - name: Locate approved video job
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          jobs=[]
          for item in Path('approved-artifact').rglob('job.json'):
              root=item.parent
              if (root/'short_youtube.mp4').is_file() and (root/'short_tiktok.mp4').is_file():
                  jobs.append(root.resolve())
          if not jobs:
              raise SystemExit('No complete approved job found')
          root=sorted(jobs,key=lambda p:len(str(p)))[0]
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write(f'TAYVORIQ_APPROVED_JOB_DIR={root}\n')
          print({'approved_job_dir':str(root),'video_bytes':(root/'short_youtube.mp4').stat().st_size})
          PY

      - name: Migrate verified Chatterbox quality profile metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path(os.environ['TAYVORIQ_APPROVED_JOB_DIR'])
          job_path=root/'job.json'
          job=json.loads(job_path.read_text(encoding='utf-8'))
          legacy='tayvoriq-deep-calm-natural-narrator-chatterbox-v34'
          current='tayvoriq-chatterbox-deep-calm-natural-narrator-v34'
          migrated=[]

          variants=job.get('variants') if isinstance(job.get('variants'),dict) else {}
          for platform in ('youtube_shorts','tiktok'):
              variant=variants.get(platform)
              if not isinstance(variant,dict):
                  raise SystemExit(f'Missing variant: {platform}')
              audio=variant.get('audio')
              if not isinstance(audio,dict):
                  raise SystemExit(f'Missing audio evidence: {platform}')
              checks={
                  'provider':audio.get('provider') == 'chatterbox_multilingual_v3',
                  'voice_provider_used':audio.get('voice_provider_used') == 'chatterbox_multilingual_v3',
                  'fallback_false':audio.get('fallback') is False,
                  'post_audio_gate':isinstance(audio.get('post_audio_quality_gate'),dict) and audio['post_audio_quality_gate'].get('passed') is True,
                  'reference_audio':isinstance(audio.get('voice_settings'),dict) and audio['voice_settings'].get('reference_audio_used') is True,
                  'natural_pacing':audio.get('natural_pacing_contract_passed') is True,
                  'premium_voice':audio.get('premium_voice_contract_passed') is True,
              }
              if not all(checks.values()):
                  raise SystemExit({'platform':platform,'failed_evidence':[k for k,v in checks.items() if not v]})
              previous=str(audio.get('quality_profile') or '')
              if previous == legacy:
                  audio['quality_profile']=current
                  migrated.append(platform)
              elif not previous.startswith('tayvoriq-chatterbox'):
                  raise SystemExit({'platform':platform,'unsupported_quality_profile':previous})

              report_path=root/platform/'audio_report.json'
              report=json.loads(report_path.read_text(encoding='utf-8'))
              if str(report.get('quality_profile') or '') == legacy:
                  report['quality_profile']=current
              elif not str(report.get('quality_profile') or '').startswith('tayvoriq-chatterbox'):
                  raise SystemExit({'platform':platform,'unsupported_audio_report_profile':report.get('quality_profile')})
              report['quality_profile_migration']={
                  'from':legacy,
                  'to':current,
                  'reason':'Publication gate V2 naming-schema migration; audio bytes and synthesis evidence unchanged',
                  'migrated_at':datetime.now(timezone.utc).isoformat(),
                  'quality_gates_weakened':False,
              }
              report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          job['quality_profile_migration']={
              'from':legacy,
              'to':current,
              'platforms':migrated,
              'audio_bytes_changed':False,
              'quality_gates_weakened':False,
              'evidence_revalidated':True,
              'migrated_at':datetime.now(timezone.utc).isoformat(),
          }
          job_path.write_text(json.dumps(job,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(job['quality_profile_migration'])
          PY

      - name: Recheck publication quality
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_publication_quality_gate_v2.py \
            --job-dir "$TAYVORIQ_APPROVED_JOB_DIR" \
            --targets youtube

      - name: Publish approved YouTube video privately
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_publish_approved_v2.py \
            --job-dir "$TAYVORIQ_APPROVED_JOB_DIR" \
            --approval FREIGEBEN \
            --targets youtube \
            --youtube-privacy "$YOUTUBE_PRIVACY" \
            --tiktok-mode draft_upload \
            --tiktok-privacy SELF_ONLY

      - name: Verify publication result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          result_path=Path(os.environ['TAYVORIQ_APPROVED_JOB_DIR'])/'publish_result.json'
          if not result_path.exists():
              raise SystemExit('publish_result.json missing')
          result=json.loads(result_path.read_text(encoding='utf-8'))
          youtube=(result.get('results') or {}).get('youtube_shorts') or {}
          url=str(youtube.get('url') or '').strip()
          if not url:
              raise SystemExit({'publish_result':result})
          marker={
              'review_run_id':os.environ['REVIEW_RUN_ID'],
              'status':'PUBLISHED_PRIVATE',
              'youtube_url':url,
              'privacy_status':youtube.get('privacy_status') or os.environ['YOUTUBE_PRIVACY'],
              'published_at':datetime.now(timezone.utc).isoformat(),
              'approval_source':'explicit_user_telegram_approval_recovery',
          }
          target=Path('.automation/tayvoriq-control-publications')/f"{os.environ['REVIEW_RUN_ID']}.json"
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(marker,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write(f'TAYVORIQ_YOUTUBE_URL={url}\n')
          print(marker)
          PY

      - name: Persist publication marker
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".automation/tayvoriq-control-publications/${REVIEW_RUN_ID}.json"
          git commit -m "ops: record approved TAYVORIQ publication ${REVIEW_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Send successful YouTube result to Telegram
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from urllib import parse, request
          token=os.environ['TELEGRAM_BOT_TOKEN'].strip()
          chat=os.environ['TELEGRAM_CHAT_ID'].strip()
          url=os.environ['TAYVORIQ_YOUTUBE_URL'].strip()
          text=(
              '✅ Freigabe erfolgreich ausgeführt\n\n'
              f'YouTube: {url}\n'
              'Sichtbarkeit: privat\n\n'
              'TikTok bleibt vorerst manuell.'
          )
          data=parse.urlencode({'chat_id':chat,'text':text,'disable_web_page_preview':'false'}).encode()
          with request.urlopen(f'https://api.telegram.org/bot{token}/sendMessage',data=data,timeout=35) as response:
              payload=json.loads(response.read().decode())
          if not payload.get('ok'):
              raise SystemExit(payload)
          print({'telegram_result_message_id':payload['result']['message_id'],'youtube_url':url})
          PY
