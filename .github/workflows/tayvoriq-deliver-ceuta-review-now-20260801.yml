name: TAYVORIQ Deliver Ceuta Review Now 2026-08-01

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-deliver-ceuta-review-now-20260801.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: tayvoriq-deliver-ceuta-review-now-20260801
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "30711918496"
  SIGNED_ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-c134-81f4-a422-c5c6ce1cef7a/raw?se=2026-08-01T18:30:49Z&sp=r&sv=2026-02-06&sr=b&scid=0013b080-5813-50f0-9ba8-408ef79c8779&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T01:17:22Z&ske=2026-08-02T01:17:22Z&sks=b&skv=2026-02-06&sig=oB9CtsbIag/ZSnwxI4Yys%2BUVprXKGfWISMKYX8ng6nY%3D"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  deliver-ceuta-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Telegram bot and package link
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNED_ARTIFACT_URL"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          http_code=$(curl --silent --show-error \
            --output /tmp/telegram-getme.json \
            --write-out '%{http_code}' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          python - "$http_code" <<'PY'
          import json, sys
          from pathlib import Path
          code=int(sys.argv[1])
          payload=json.loads(Path('/tmp/telegram-getme.json').read_text(encoding='utf-8'))
          if code != 200 or not payload.get('ok'):
              raise SystemExit({'http_code':code,'telegram':payload})
          print({'telegram_bot_valid':True,'username':(payload.get('result') or {}).get('username')})
          PY

      - name: Download finished Ceuta review package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --location --retry 3 --retry-delay 1 \
            --connect-timeout 20 --max-time 300 \
            "$SIGNED_ARTIFACT_URL" \
            --output /tmp/tayvoriq-ceuta-review.zip
          test -s /tmp/tayvoriq-ceuta-review.zip
          unzip -q /tmp/tayvoriq-ceuta-review.zip -d source
          rm -f /tmp/tayvoriq-ceuta-review.zip

      - name: Verify and reconstruct approval package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path

          roots=[]
          for item in Path('source').rglob('job.json'):
              root=item.parent
              if (root/'short_youtube.mp4').is_file():
                  roots.append(root)
          if not roots:
              raise SystemExit('No completed Ceuta review found')
          root=max(roots,key=lambda p:p.stat().st_mtime).resolve()
          job=json.loads((root/'job.json').read_text(encoding='utf-8'))
          quality=job.get('quality_report') if isinstance(job.get('quality_report'),dict) else {}
          if quality.get('passed') is not True:
              raise SystemExit({'quality_gate_failed':quality})

          master=root/'short_youtube.mp4'
          if master.stat().st_size < 100000:
              raise SystemExit('Ceuta master video is unexpectedly small')
          digest=hashlib.sha256(master.read_bytes()).hexdigest()

          states=list(Path('source').rglob('tayvoriq-review-state.json'))
          state=json.loads(states[0].read_text(encoding='utf-8')) if states else {}
          expected=str(state.get('shared_master_sha256') or '')
          if expected and expected != digest:
              raise SystemExit({'source_hash_mismatch':[expected,digest]})
          if state.get('local_quality_passed') is not True:
              raise SystemExit({'private_review_state_invalid':state})
          if str(state.get('category') or '') != 'world_events_africa':
              raise SystemExit({'unexpected_category':state.get('category')})

          shutil.copy2(master,root/'short_tiktok.mp4')
          shutil.copy2(master,root/'short.mp4')
          if hashlib.sha256((root/'short_tiktok.mp4').read_bytes()).hexdigest() != digest:
              raise SystemExit('Reconstructed TikTok hash mismatch')

          target=Path('control-review')/'out'/'tayvoriq-youtube-tiktok'/root.name
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copytree(root,target)
          control_state={
              'source_run_id':os.environ['SOURCE_RUN_ID'],
              'job_dir':str(Path('out')/'tayvoriq-youtube-tiktok'/root.name),
              'topic':'Ceuta: Warum Zehntausende diese Grenze stürmten',
              'category':'world_events_africa',
              'local_quality_passed':True,
              'shared_master_sha256':digest,
              'private_human_review':True,
              'youtube_publication_allowed':False,
              'youtube_requires_explicit_telegram_approval':True,
              'tiktok':'manual_after_human_approval'
          }
          (Path('control-review')/'out').mkdir(parents=True,exist_ok=True)
          (Path('control-review')/'out'/'tayvoriq-review-state.json').write_text(
              json.dumps(control_state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write(f'TAYVORIQ_JOB_DIR={target.resolve()}\n')
              handle.write(f'TAYVORIQ_TELEGRAM_VIDEO={(target/"short_youtube.mp4").resolve()}\n')
          print({'review_ready':True,'quality_passed':True,'sha256':digest,'video_size':master.stat().st_size})
          PY

      - name: Register approval artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-control-review-${{ github.run_id }}
          path: control-review/out/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Send Ceuta video with approval buttons
        id: telegram
        shell: bash
        run: |
          set -euo pipefail
          markup=$(python - <<'PY'
          import json, os
          run=os.environ['GITHUB_RUN_ID']
          details=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run}"
          print(json.dumps({'inline_keyboard':[
              [
                  {'text':'✅ Freigeben','callback_data':f'tayvoriq:approve:{run}'},
                  {'text':'❌ Ablehnen','callback_data':f'tayvoriq:reject:{run}'},
              ],
              [{'text':'🔧 Technische Details','url':details}],
          ]},ensure_ascii=False))
          PY
          )
          caption=$'🟢 Dein TAYVORIQ-Video ist bereit\n\nThema: Ceuta – warum Zehntausende diese Grenze stürmten\nKategorie: World Events · Afrika\nRender- und lokale Quality-Gates: bestanden\n\nYouTube bleibt gesperrt, bis du auf Freigeben klickst. TikTok bleibt manuell.'
          http_code=$(curl --silent --show-error \
            --max-time 300 \
            --output /tmp/telegram-send.json \
            --write-out '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@${TAYVORIQ_TELEGRAM_VIDEO};type=video/mp4" \
            -F "caption=${caption}" \
            -F "supports_streaming=true" \
            -F "reply_markup=${markup}")
          python - "$http_code" <<'PY'
          import json, os, sys
          from pathlib import Path
          code=int(sys.argv[1])
          payload=json.loads(Path('/tmp/telegram-send.json').read_text(encoding='utf-8'))
          if code != 200 or not payload.get('ok'):
              raise SystemExit({'http_code':code,'telegram':payload})
          message_id=payload['result']['message_id']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f'message_id={message_id}\n')
          print({'telegram_delivery':'confirmed','message_id':message_id,'buttons':True})
          PY

      - name: Persist confirmed Ceuta delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation/tayvoriq-telegram-delivery
          cat > ".automation/tayvoriq-telegram-delivery/${GITHUB_RUN_ID}.json" <<JSON
          {
            "status": "DELIVERED_TO_TELEGRAM",
            "source_run_id": "${SOURCE_RUN_ID}",
            "control_review_run_id": "${GITHUB_RUN_ID}",
            "topic": "Ceuta: Warum Zehntausende diese Grenze stürmten",
            "category": "world_events_africa",
            "telegram_message_id": "${{ steps.telegram.outputs.message_id }}",
            "approve_callback": "tayvoriq:approve:${GITHUB_RUN_ID}",
            "reject_callback": "tayvoriq:reject:${GITHUB_RUN_ID}",
            "youtube_published": false,
            "tiktok_mode": "manual_after_approval",
            "delivered_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".automation/tayvoriq-telegram-delivery/${GITHUB_RUN_ID}.json"
          git commit -m "ops: confirm Ceuta Telegram delivery ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin main
