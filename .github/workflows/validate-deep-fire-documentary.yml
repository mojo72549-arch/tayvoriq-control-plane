name: TAYVORIQ Repair Duplicate Guard

on:
  pull_request:
    paths:
      - ".github/workflows/validate-deep-fire-documentary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tayvoriq-targeted-fire-narration-repair
  cancel-in-progress: true

jobs:
  suppress-duplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm delivered review remains authoritative
        run: |
          echo "Successful repaired review run 30465706345 was already published and sent by Telegram."
          echo "Any duplicate repair execution is intentionally cancelled."
          echo "No platform upload is performed."
