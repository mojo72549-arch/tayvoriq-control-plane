name: TAYVORIQ One-shot Production Ref Hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-one-shot-production-ref-hardening.yml

permissions:
  contents: write

concurrency:
  group: tayvoriq-one-shot-production-ref-hardening
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply fail-safe implementation pin and notification suppression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          golden = Path('.github/workflows/tayvoriq-deliver-video-now.yml')
          text = golden.read_text(encoding='utf-8')
          old_checkout = '''          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation'''
          new_checkout = '''          repository: mojo72549-arch/shorts-agent-studio
          ref: tayvoriq-production-green
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation'''
          if old_checkout in text:
              text = text.replace(old_checkout, new_checkout, 1)
          elif new_checkout not in text:
              raise SystemExit('GOLDEN_PATH_IMPLEMENTATION_CHECKOUT_ANCHOR_MISSING')

          old_manifest = '"implementation_branch": "feature/multi-platform-distribution-package",'
          new_manifest = '"implementation_branch": "tayvoriq-production-green",'
          if old_manifest in text:
              text = text.replace(old_manifest, new_manifest, 1)
          elif new_manifest not in text:
              raise SystemExit('GOLDEN_PATH_IMPLEMENTATION_MANIFEST_ANCHOR_MISSING')

          guard_anchor = '''          if x_owners != [workflow]:
              raise SystemExit(f"CONTROL_PLANE_SINGLE_OWNER_FAILED: expected={[workflow]!r} actual={x_owners!r}")
'''
          guard = '''          if x_owners != [workflow]:
              raise SystemExit(f"CONTROL_PLANE_SINGLE_OWNER_FAILED: expected={[workflow]!r} actual={x_owners!r}")
          golden_text = Path(workflow).read_text(encoding='utf-8', errors='replace')
          required_checkout = "repository: mojo72549-arch/shorts-agent-studio\\n          ref: tayvoriq-production-green"
          if required_checkout not in golden_text:
              raise SystemExit('CONTROL_PLANE_PRODUCTION_GREEN_REF_FAILED')
'''
          if 'CONTROL_PLANE_PRODUCTION_GREEN_REF_FAILED' not in text:
              if guard_anchor not in text:
                  raise SystemExit('GOLDEN_PATH_SELF_GUARD_ANCHOR_MISSING')
              text = text.replace(guard_anchor, guard, 1)
          golden.write_text(text, encoding='utf-8')

          progress = Path('tools/tayvoriq_telegram_progress_v1.py')
          ptext = progress.read_text(encoding='utf-8')
          const_anchor = '''RECOVERY_REPLAY_SUPPRESSED_STAGES = {
    "render_heartbeat",
    "checkpoint_repair",
    "checkpoint_heartbeat",
}
'''
          const_replacement = '''RECOVERY_REPLAY_SUPPRESSED_STAGES = {
    "render_heartbeat",
    "checkpoint_repair",
    "checkpoint_heartbeat",
}

# These states are owned by internal request-bound recovery. They are diagnostics,
# not user-action states, so the Golden Path must not emit a premature orange stop.
# Delivery Watch remains authoritative and may surface an external/exhausted state.
INTERNAL_RECOVERY_TECHNICAL_STATES = {
    "PREFLIGHT_FAILED",
    "DETERMINISTIC_PREFLIGHT_FAILURE",
    "CODE_REPAIR_REQUIRED",
    "PUBLISHABLE_OUTPUT_RETRY_REQUIRED",
}
'''
          if 'INTERNAL_RECOVERY_TECHNICAL_STATES' not in ptext:
              if const_anchor not in ptext:
                  raise SystemExit('PROGRESS_INTERNAL_STATE_ANCHOR_MISSING')
              ptext = ptext.replace(const_anchor, const_replacement, 1)

          main_anchor = '''    attempt = parse_attempt(args.run_attempt)
    generation = recovery_generation()
'''
          main_replacement = '''    attempt = parse_attempt(args.run_attempt)
    generation = recovery_generation()
    normalized_failure_state = clean_topic(args.failure_state).upper() if args.failure_state else ""
    if args.stage == "technical_stop" and normalized_failure_state in INTERNAL_RECOVERY_TECHNICAL_STATES:
        print(json.dumps({
            "status": "suppressed_internal_recovery",
            "stage": args.stage,
            "failure_state": normalized_failure_state,
            "run_attempt": attempt,
            "recovery_generation": generation,
        }))
        return 0
'''
          if 'normalized_failure_state = clean_topic(args.failure_state).upper()' not in ptext:
              if main_anchor not in ptext:
                  raise SystemExit('PROGRESS_MAIN_RECOVERY_ANCHOR_MISSING')
              ptext = ptext.replace(main_anchor, main_replacement, 1)
          progress.write_text(ptext, encoding='utf-8')
          PY

          python -m compileall -q tools
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          import tayvoriq_telegram_progress_v1 as progress

          workflow = Path('.github/workflows/tayvoriq-deliver-video-now.yml').read_text(encoding='utf-8')
          assert 'repository: mojo72549-arch/shorts-agent-studio\n          ref: tayvoriq-production-green' in workflow
          assert '"implementation_branch": "tayvoriq-production-green"' in workflow
          assert 'CONTROL_PLANE_PRODUCTION_GREEN_REF_FAILED' in workflow
          assert 'PREFLIGHT_FAILED' in progress.INTERNAL_RECOVERY_TECHNICAL_STATES
          assert 'CODE_REPAIR_REQUIRED' in progress.INTERNAL_RECOVERY_TECHNICAL_STATES
          print('TAYVORIQ_PRODUCTION_REF_HARDENING_VERIFIED')
          PY

      - name: Commit hardening and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tayvoriq-one-shot-production-ref-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tayvoriq-deliver-video-now.yml tools/tayvoriq_telegram_progress_v1.py .github/workflows/tayvoriq-one-shot-production-ref-hardening.yml
          git commit -m "hardening: consume only promoted TAYVORIQ implementation"
          git push origin HEAD:main

# migration-trigger: v2
