name: TAYVORIQ Golden Path Runtime Contract Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-golden-path-runtime-contract-repair.yml

permissions:
  contents: write

jobs:
  install-runtime-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install resilient audit provider routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tayvoriq-deliver-video-now.yml')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()

          wanted = {
              'GEMINI_MODEL': '  GEMINI_MODEL: "gemini-2.5-flash-lite"',
              'GROQ_MODEL': '  GROQ_MODEL: "openai/gpt-oss-20b"',
          }

          seen = set()
          out = []
          insert_after = None
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('GEMINI_MODEL:'):
                  out.append(wanted['GEMINI_MODEL'])
                  seen.add('GEMINI_MODEL')
                  continue
              if stripped.startswith('GROQ_MODEL:'):
                  out.append(wanted['GROQ_MODEL'])
                  seen.add('GROQ_MODEL')
                  continue
              out.append(line)
              if stripped.startswith('TAYVORIQ_AUDIT_RETRY_DELAYS:'):
                  insert_after = len(out)

          missing = [key for key in ('GEMINI_MODEL', 'GROQ_MODEL') if key not in seen]
          if missing:
              if insert_after is None:
                  raise SystemExit('AUDIT_PROVIDER_ROUTING_REFUSED:anchor-missing')
              additions = [wanted[key] for key in missing]
              out[insert_after:insert_after] = additions

          new_text = '\n'.join(out) + '\n'
          if new_text == text:
              print('Audit provider routing already installed.')
          else:
              path.write_text(new_text, encoding='utf-8')
              print('Installed audit provider routing.')
          PY

          git diff --check
          git diff -- .github/workflows/tayvoriq-deliver-video-now.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tayvoriq-deliver-video-now.yml
          if git diff --cached --quiet; then
            echo 'No Golden Path provider change required.'
            exit 0
          fi
          git commit -m 'fix(tayvoriq): route strict audit through resilient providers'
          git push origin HEAD:main
