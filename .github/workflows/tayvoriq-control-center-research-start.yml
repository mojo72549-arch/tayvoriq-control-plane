name: TAYVORIQ Control Center · Recherche starten
on:
  push:
    branches: [main]
    paths: ['.github/run-now/tayvoriq-control-center-research.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: tayvoriq-control-center-research-start
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/run-now
      - uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: a8c4c4e4e4b1ad5071339dae2ace29effc4060c6
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: studio
          sparse-checkout: cinematic-control-center/lib
          persist-credentials: false
      - name: Bestehenden Control-Center-Trigger ausführen
        env:
          TAYVORIQ_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {requestResearch} from './studio/cinematic-control-center/lib/research-control.js';
          const {action_id,day,slot}=JSON.parse(readFileSync('.github/run-now/tayvoriq-control-center-research.json','utf8'));
          if(day!==new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Berlin'})) throw Error('Abgelaufener Rechercheauftrag');
          const res={status(code){this.code=code;return this;},json(body){this.body=body;}};
          await requestResearch({body:{slot,action_id,topic:'',purpose:'portfolio'}},res);
          if(res.code!==202||!res.body?.accepted) throw Error(res.body?.error||'Recherche nicht bestätigt');
          console.log('Control Center hat die Recherche angenommen:',res.body.selection_id);
          JS
