name: TAYVORIQ Approve Ceuta Now 2026-08-01

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-approve-ceuta-now-20260801.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tayvoriq-approve-ceuta-now-20260801
  cancel-in-progress: false

env:
  REVIEW_RUN_ID: "30712536166"
  EXPECTED_ARTIFACT: "tayvoriq-control-review-30712536166"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  dispatch-confirmed-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate approved review artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN_ID}/artifacts")"
          RESPONSE="$response" python - <<'PY'
          import json, os
          payload=json.loads(os.environ['RESPONSE'])
          expected=os.environ['EXPECTED_ARTIFACT']
          matches=[a for a in payload.get('artifacts',[]) if a.get('name')==expected and not a.get('expired')]
          if not matches:
              raise SystemExit(f'approved artifact missing: {expected}')
          print({'approved_artifact':expected,'artifact_id':matches[0]['id']})
          PY

      - name: Record explicit approval
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation/tayvoriq-control-reviews
          cat > ".automation/tayvoriq-control-reviews/${REVIEW_RUN_ID}.json" <<JSON
          {
            "review_id": "${REVIEW_RUN_ID}",
            "status": "APPROVED",
            "processed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source": "explicit_chat_confirmation_after_telegram_click",
            "telegram_message_id": 186,
            "publication_pending": true,
            "youtube_privacy": "public",
            "platform_upload_performed": false
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".automation/tayvoriq-control-reviews/${REVIEW_RUN_ID}.json"
          git commit -m "Record approved Ceuta review ${REVIEW_RUN_ID}"
          git pull --rebase origin main
          git push origin main

      - name: Dispatch public YouTube publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d "{\"event_type\":\"tayvoriq_control_publish_approved\",\"client_payload\":{\"review_run_id\":\"${REVIEW_RUN_ID}\",\"youtube_privacy\":\"public\",\"approval_source\":\"explicit_chat_confirmation_after_telegram_click\"}}"
          echo "Public publish dispatch accepted for review ${REVIEW_RUN_ID}"

      - name: Acknowledge approval in Telegram
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ Freigabe erkannt. Das Ceuta-Video wird jetzt öffentlich auf YouTube veröffentlicht. Nach Abschluss folgt der YouTube-Link."
