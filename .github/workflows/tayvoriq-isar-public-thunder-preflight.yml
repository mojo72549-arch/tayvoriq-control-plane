name: TAYVORIQ Isar Public Thunder Preflight

on:
  push:
    branches: [main]
    paths:
      - '.automation/isar-public-thunder-preflight.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_REPO: mojo72549-arch/shorts-agent-studio
  SOURCE_REQUEST_ID: isar-spectrum-20260909-pilot01
  CHECKPOINT_PATH: cinematic-control-center/checkpoints/isar-spectrum-20260909-pilot01/checkpoint.json
  THUNDER_API: https://api.thundercompute.com:8443

jobs:
  preflight:
    name: Public preflight · private A6000 handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      PRIVATE_DISPATCH_TOKEN: ${{ secrets.PRIVATE_DISPATCH_TOKEN }}
      PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
      TNR_API_TOKEN_1: ${{ secrets.TNR_API_TOKEN }}
      TNR_API_TOKEN_2: ${{ secrets.THUNDER_API_TOKEN }}
      TNR_API_TOKEN_3: ${{ secrets.THUNDER_TOKEN }}
      TNR_API_TOKEN_4: ${{ secrets.TNR_TOKEN }}
      TNR_API_TOKEN_5: ${{ secrets.THUNDER_COMPUTE_TOKEN }}
      TNR_API_TOKEN_6: ${{ secrets.THUNDERCOMPUTE_TOKEN }}
      TNR_API_TOKEN_7: ${{ secrets.THUNDER_API_KEY }}
      TNR_API_TOKEN_8: ${{ secrets.TNR_API_KEY }}
    steps:
      - name: Verify public runner is actually assigned
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown} os=${RUNNER_OS:-unknown} arch=${RUNNER_ARCH:-unknown}"
          test "${RUNNER_OS:-}" = "Linux"

      - name: Verify private production repo and durable Isar checkpoint are readable
        run: |
          set -euo pipefail
          test -n "${PRIVATE_REPO_TOKEN:-}" || { echo '::error::PRIVATE_REPO_TOKEN missing in public control-plane repo'; exit 11; }
          auth="Authorization: Bearer ${PRIVATE_REPO_TOKEN}"
          curl -fsS -H "$auth" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${PRIVATE_REPO}" > /tmp/private-repo.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/private-repo.json'))
          assert d.get('private') is True
          assert d.get('full_name') == 'mojo72549-arch/shorts-agent-studio'
          print('private repo readable')
          PY
          encoded_path=$(python - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('cinematic-control-center/checkpoints/isar-spectrum-20260909-pilot01/checkpoint.json', safe='/'))
          PY
          )
          curl -fsS -H "$auth" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${PRIVATE_REPO}/contents/${encoded_path}?ref=lab%2Fcinematic-control-center" > /tmp/checkpoint-content.json
          python - <<'PY'
          import base64, json
          raw=json.load(open('/tmp/checkpoint-content.json'))
          payload=json.loads(base64.b64decode(str(raw['content']).replace('\n','')).decode())
          assert payload.get('state') == 'PREPRODUCTION_READY', payload
          assert payload.get('source_request_id') == 'isar-spectrum-20260909-pilot01', payload
          assert payload.get('voice_provider') == 'chatterbox_multilingual_v3', payload
          assert payload.get('artifact_storage_required') is False, payload
          assert payload.get('quality_gates_weakened') is False, payload
          print({'checkpoint':'PREPRODUCTION_READY','voice':payload.get('voice_provider'),'duration':payload.get('voice_duration_sec')})
          PY

      - name: Resolve optional public Thunder credential
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          selected_name=''
          for n in 1 2 3 4 5 6 7 8; do
            var="TNR_API_TOKEN_${n}"
            val="${!var:-}"
            if [ -n "$val" ]; then
              selected="$val"
              selected_name="$var"
              break
            fi
          done
          if [ -n "$selected" ]; then
            echo "TNR_API_TOKEN=$selected" >> "$GITHUB_ENV"
            echo "PUBLIC_THUNDER_CREDENTIAL_PRESENT=true" >> "$GITHUB_ENV"
            echo "Resolved a public Thunder credential via $selected_name. Secret value remains masked."
          else
            echo "PUBLIC_THUNDER_CREDENTIAL_PRESENT=false" >> "$GITHUB_ENV"
            echo "No public Thunder credential is configured; private-secret preflight will be authoritative."
          fi

      - name: GPU-free Thunder auth check when public credential exists
        shell: bash
        run: |
          set -euo pipefail
          auth_mode='PRIVATE_REQUIRED'
          if [ "${PUBLIC_THUNDER_CREDENTIAL_PRESENT:-false}" = 'true' ]; then
            set +e
            http_code=$(curl --silent --show-error --output /tmp/thunder-instances.json --write-out '%{http_code}' \
              -H "Authorization: Bearer ${TNR_API_TOKEN}" \
              "${THUNDER_API}/v1/instances/list?update_ips=true")
            curl_rc=$?
            set -e
            if [ "$curl_rc" -eq 0 ] && [ "$http_code" = '200' ]; then
              python - <<'PY'
          import json
          d=json.load(open('/tmp/thunder-instances.json'))
          vals=list(d.values()) if isinstance(d,dict) else list(d or [])
          active=[x for x in vals if str((x or {}).get('status','')).upper() in {'RUNNING','STARTING','PROVISIONING','PENDING','QUEUED'}]
          print({'public_thunder_auth':'ok','active_instances':len(active)})
          assert len(active) == 0, f'refusing duplicate paid GPU: {len(active)} active instance(s)'
          PY
              auth_mode='PUBLIC_OK'
            else
              echo "::warning title=Public Thunder auth unavailable::HTTP ${http_code:-none}; handing authentication to the private worker."
            fi
          fi
          echo "THUNDER_AUTH_MODE=$auth_mode" >> "$GITHUB_ENV"

      - name: Dispatch locked Isar request to private GPU worker
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json, os
          print(json.dumps({
              'event_type':'tayvoriq_isar_gpu_production',
              'client_payload':{
                  'source_request_id':os.environ['SOURCE_REQUEST_ID'],
                  'checkpoint_path':os.environ['CHECKPOINT_PATH'],
                  'public_run_id':os.environ['GITHUB_RUN_ID'],
                  'public_repository':os.environ['GITHUB_REPOSITORY'],
                  'public_thunder_auth':os.environ.get('THUNDER_AUTH_MODE','PRIVATE_REQUIRED'),
                  'max_budget_usd':'1.75',
              },
          }, separators=(',',':')))
          PY
          )

          dispatched='false'
          selected_name=''
          for token_name in PRIVATE_DISPATCH_TOKEN PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN; do
            token="${!token_name:-}"
            [ -n "$token" ] || continue
            code=$(curl --silent --show-error --output /tmp/private-dispatch-response.json --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              "https://api.github.com/repos/${PRIVATE_REPO}/dispatches" || true)
            if [ "$code" = '204' ]; then
              dispatched='true'
              selected_name="$token_name"
              break
            fi
            echo "Dispatch candidate $token_name returned HTTP ${code:-none}; trying next configured candidate."
          done

          if [ "$dispatched" != 'true' ]; then
            echo '::error title=Private dispatch permission missing::No configured cross-repository token can create the private Isar dispatch. The A6000 was NOT started. Configure PRIVATE_DISPATCH_TOKEN with Contents: write on shorts-agent-studio.'
            exit 13
          fi
          echo "Private production dispatch accepted through $selected_name."

      - name: Preflight contract
        run: |
          echo 'ISAR_PUBLIC_THUNDER_PREFLIGHT_GREEN'
          echo "Thunder auth context: ${THUNDER_AUTH_MODE:-PRIVATE_REQUIRED}"
          echo 'No GPU was started by this public workflow.'
          echo 'The private worker must revalidate the checkpoint, Thunder authentication, duplicate-instance guard and budget before creating the A6000.'
