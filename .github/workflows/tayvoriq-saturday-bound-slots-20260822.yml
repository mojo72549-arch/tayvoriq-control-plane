name: TAYVORIQ Saturday Bound Slots 2026-08-22

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-saturday-bound-slots-20260822.yml"
      - ".automation/tayvoriq-agent-v2/selections/20260822-m-s21game.json"
      - ".automation/tayvoriq-agent-v2/selections/20260822-e-boschrobot.json"
  schedule:
    # 12:30 Europe/Berlin on 22 August 2026 (CEST = UTC+2).
    - cron: "30 10 22 8 *"
  workflow_dispatch:
    inputs:
      slot:
        description: Bound slot to dispatch
        required: true
        default: morning
        type: choice
        options: [morning, evening]

permissions:
  contents: write
  actions: write

concurrency:
  group: tayvoriq-bound-slots-20260822-${{ github.event_name }}-${{ github.event.inputs.slot || 'auto' }}
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  MORNING_SELECTION_ID: 20260822-m-s21game
  MORNING_SELECTION_FILE: .automation/tayvoriq-agent-v2/selections/20260822-m-s21game.json
  EVENING_SELECTION_ID: 20260822-e-boschrobot
  EVENING_SELECTION_FILE: .automation/tayvoriq-agent-v2/selections/20260822-e-boschrobot.json
  SLOT_STATE: state/tayvoriq-bound-slots-20260822.json

jobs:
  dispatch-morning:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.slot == 'morning')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Validate bound morning selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          d=json.load(open(os.environ['MORNING_SELECTION_FILE'],encoding='utf-8'))
          assert d['selection_id'] == os.environ['MORNING_SELECTION_ID']
          assert d['date'] == '2026-08-22' and d['slot'] == 'morning'
          assert d['selected_trend_id'] == '1' and len(d['trends']) == 1
          t=d['trends'][0]
          assert 'Stuttgart 21' in t['title'] and 'Gleis 9' in t['title']
          assert len(t.get('sources') or []) >= 2
          assert int((t.get('source_context') or {}).get('independent_news_count') or 0) >= 2
          print({'selection':d['selection_id'],'topic':t['title'],'contract':'passed'})
          PY

      - name: Stop duplicate morning dispatch
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          already=false
          if [ -f "$SLOT_STATE" ]; then
            already=$(python - <<'PY'
          import json, os
          try: d=json.load(open(os.environ['SLOT_STATE'],encoding='utf-8'))
          except Exception: d={}
          print('true' if d.get('morning_dispatch_accepted') is True else 'false')
          PY
            )
          fi
          echo "already=$already" >> "$GITHUB_OUTPUT"

      - name: Confirm both Saturday slots on Telegram
        id: telegram
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID"
          TEXT=$(cat <<'EOF'
          ✅ TAYVORIQ · Samstag 22.08. fest gebucht

          🌅 MORGEN
          Stuttgart 21 wird zum Videospiel: S21-Demo · Gleis 9 in 20 Minuten
          Stil: schnell, lokal, witzig · echter Game-Look + reale S21-Fakten sauber getrennt

          🌙 ABEND
          Humanoide Roboter aus Baden-Württemberg: Bosch startet 2027 die Produktion in Bühl
          Fokus: Physical AI · Fabrik/Logistik · Bosch als Fertigungs-/Industrialisierungspartner

          ▶️ Morgenproduktion wird jetzt gestartet.
          🕧 Abendproduktion ist separat gebunden und startet morgen automatisch für den Abend.

          Für dich: ✅ Keine weitere Trend-Freigabe nötig.
          EOF
          )
          RESPONSE=$(curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode 'disable_web_page_preview=true')
          python - "$RESPONSE" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1]); assert d.get('ok') is True, d
          r=d.get('result') or {}; assert r.get('message_id'), r
          with open(sys.argv[2],'a',encoding='utf-8') as h:
              h.write(f"message_id={int(r['message_id'])}\n")
          print({'telegram_message_id':r['message_id']})
          PY

      - name: Dispatch approved S21 morning trend
        id: dispatch
        if: steps.guard.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_MESSAGE_ID: ${{ steps.telegram.outputs.message_id }}
        shell: bash
        run: |
          set -euo pipefail
          TOPIC=$(python - <<'PY'
          import json,os
          d=json.load(open(os.environ['MORNING_SELECTION_FILE'],encoding='utf-8'))
          print(d['trends'][0]['title'])
          PY
          )
          APPROVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export TOPIC APPROVED_AT TELEGRAM_MESSAGE_ID
          python - <<'PY' >/tmp/dispatch.json
          import json,os
          print(json.dumps({
            'event_type':'tayvoriq_trend_approved',
            'client_payload':{
              'trend_id':'1',
              'topic':os.environ['TOPIC'],
              'selection_id':os.environ['MORNING_SELECTION_ID'],
              'telegram_chat_id':os.environ['TELEGRAM_CHAT_ID'],
              'telegram_message_id':int(os.environ['TELEGRAM_MESSAGE_ID']),
              'approved_at':os.environ['APPROVED_AT'],
              'approval_origin':'user_explicit_chat_choice_mirrored_to_telegram'
            }
          },ensure_ascii=False))
          PY
          code=$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d @/tmp/dispatch.json)
          test "$code" = '204' || { cat /tmp/dispatch-response.txt; echo "dispatch HTTP $code"; exit 1; }
          echo "approved_at=$APPROVED_AT" >> "$GITHUB_OUTPUT"

      - name: Persist morning dispatch and evening queue
        if: steps.dispatch.outcome == 'success'
        env:
          TELEGRAM_MESSAGE_ID: ${{ steps.telegram.outputs.message_id }}
          APPROVED_AT: ${{ steps.dispatch.outputs.approved_at }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p state
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          payload={
            'target_date':'2026-08-22',
            'morning_selection_id':os.environ['MORNING_SELECTION_ID'],
            'morning_dispatch_accepted':True,
            'morning_approved_at':os.environ['APPROVED_AT'],
            'morning_telegram_message_id':int(os.environ['TELEGRAM_MESSAGE_ID']),
            'evening_selection_id':os.environ['EVENING_SELECTION_ID'],
            'evening_status':'QUEUED',
            'evening_dispatch_accepted':False,
            'evening_target_start_berlin':'2026-08-22T12:30:00+02:00',
            'telegram_only_user_path':True,
            'recorded_at':datetime.now(timezone.utc).isoformat()
          }
          Path(os.environ['SLOT_STATE']).write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SLOT_STATE"
          git commit -m "ops(tayvoriq): bind Saturday morning and queue evening"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2)); git pull --rebase origin main
          done
          exit 1

      - name: Notify only if morning dispatch failed
        if: failure() && steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set +e
          curl -fsS --retry 2 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode $'text=🔴 TAYVORIQ Morgenauftrag · S21\nDie Produktionsübergabe wurde nicht bestätigt. Es wurde nichts veröffentlicht. Der Abendauftrag bleibt getrennt gebunden.' >/dev/null || true

  dispatch-evening:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.slot == 'evening')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Validate date and idempotency
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          SHOULD=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            BERLIN_DATE=$(TZ=Europe/Berlin date +%F)
            [ "$BERLIN_DATE" = "2026-08-22" ] || SHOULD=false
          fi
          ALREADY=false
          if [ -f "$SLOT_STATE" ]; then
            ALREADY=$(python - <<'PY'
          import json,os
          try: d=json.load(open(os.environ['SLOT_STATE'],encoding='utf-8'))
          except Exception: d={}
          print('true' if d.get('evening_dispatch_accepted') is True else 'false')
          PY
            )
          fi
          echo "should=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "already=$ALREADY" >> "$GITHUB_OUTPUT"

      - name: Validate bound evening selection
        if: steps.guard.outputs.should == 'true' && steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          d=json.load(open(os.environ['EVENING_SELECTION_FILE'],encoding='utf-8'))
          assert d['selection_id'] == os.environ['EVENING_SELECTION_ID']
          assert d['date'] == '2026-08-22' and d['slot'] == 'evening'
          assert d['selected_trend_id'] == '1' and len(d['trends']) == 1
          t=d['trends'][0]
          assert 'Bosch' in t['title'] and 'Bühl' in t['title']
          assert len(t.get('sources') or []) >= 2
          assert int((t.get('source_context') or {}).get('independent_news_count') or 0) >= 2
          PY

      - name: Announce evening production on Telegram
        id: telegram
        if: steps.guard.outputs.should == 'true' && steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TEXT=$(cat <<'EOF'
          🌙 TAYVORIQ · Abendproduktion startet

          Thema: Humanoide Roboter aus Baden-Württemberg – Bosch startet 2027 die Produktion in Bühl.

          ✅ Gestern fest gebucht
          ✅ Eigener Abend-Request
          ✅ Quellen- und Duplicate-Guard gebunden
          ➡️ Agent V2 übernimmt jetzt Produktion, Render, Self-Heal und Quality-Gates.

          Für dich: ✅ Keine Aktion nötig bis zum Review.
          EOF
          )
          RESPONSE=$(curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode 'disable_web_page_preview=true')
          python - "$RESPONSE" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1]); assert d.get('ok') is True, d
          r=d.get('result') or {}; assert r.get('message_id'), r
          with open(sys.argv[2],'a',encoding='utf-8') as h: h.write(f"message_id={int(r['message_id'])}\n")
          PY

      - name: Dispatch approved Bosch evening trend
        id: dispatch
        if: steps.guard.outputs.should == 'true' && steps.guard.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_MESSAGE_ID: ${{ steps.telegram.outputs.message_id }}
        shell: bash
        run: |
          set -euo pipefail
          TOPIC=$(python - <<'PY'
          import json,os
          d=json.load(open(os.environ['EVENING_SELECTION_FILE'],encoding='utf-8'))
          print(d['trends'][0]['title'])
          PY
          )
          APPROVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export TOPIC APPROVED_AT TELEGRAM_MESSAGE_ID
          python - <<'PY' >/tmp/dispatch.json
          import json,os
          print(json.dumps({
            'event_type':'tayvoriq_trend_approved',
            'client_payload':{
              'trend_id':'1',
              'topic':os.environ['TOPIC'],
              'selection_id':os.environ['EVENING_SELECTION_ID'],
              'telegram_chat_id':os.environ['TELEGRAM_CHAT_ID'],
              'telegram_message_id':int(os.environ['TELEGRAM_MESSAGE_ID']),
              'approved_at':os.environ['APPROVED_AT'],
              'approval_origin':'user_explicit_chat_choice_queued_and_mirrored_to_telegram'
            }
          },ensure_ascii=False))
          PY
          code=$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d @/tmp/dispatch.json)
          test "$code" = '204' || { cat /tmp/dispatch-response.txt; exit 1; }
          echo "approved_at=$APPROVED_AT" >> "$GITHUB_OUTPUT"

      - name: Persist evening dispatch
        if: steps.dispatch.outcome == 'success'
        env:
          TELEGRAM_MESSAGE_ID: ${{ steps.telegram.outputs.message_id }}
          APPROVED_AT: ${{ steps.dispatch.outputs.approved_at }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p state
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path(os.environ['SLOT_STATE'])
          try: d=json.loads(p.read_text(encoding='utf-8'))
          except Exception: d={'target_date':'2026-08-22','morning_selection_id':os.environ['MORNING_SELECTION_ID']}
          d.update({
            'evening_selection_id':os.environ['EVENING_SELECTION_ID'],
            'evening_status':'DISPATCH_ACCEPTED',
            'evening_dispatch_accepted':True,
            'evening_approved_at':os.environ['APPROVED_AT'],
            'evening_telegram_message_id':int(os.environ['TELEGRAM_MESSAGE_ID']),
            'evening_recorded_at':datetime.now(timezone.utc).isoformat()
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SLOT_STATE"
          git commit -m "ops(tayvoriq): dispatch Saturday evening Bosch trend"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2)); git pull --rebase origin main
          done
          exit 1

      - name: Notify only if evening dispatch failed
        if: failure() && steps.guard.outputs.should == 'true' && steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set +e
          curl -fsS --retry 2 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode $'text=🔴 TAYVORIQ Abendauftrag · Bosch Robotik\nDie Produktionsübergabe wurde nicht bestätigt. Es wurde nichts veröffentlicht.' >/dev/null || true
