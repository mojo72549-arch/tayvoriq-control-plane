name: TAYVORIQ Saturday Bound Slots 2026-08-22 (retired)

# RETIRED 2026-08-22:
# The original one-day workflow treated 12:30 Europe/Berlin as an unconditional
# evening production trigger and could therefore announce/start slot 2 while
# slot 1 was still in recovery. Slot ordering is now owned exclusively by the
# generic Request Dispatcher + Slot Serialization Release contract.
#
# Kept as a manual audit-only workflow so historical references remain valid.
# It MUST NOT dispatch production, send a production-start Telegram message, or
# mutate a request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm retirement
        run: |
          echo "SATURDAY_CLOCK_ONLY_DISPATCHER_RETIRED"
          echo "Evening production is released only after verified successful morning final review."
