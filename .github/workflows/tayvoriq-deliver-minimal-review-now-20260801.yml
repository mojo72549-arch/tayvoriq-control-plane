name: TAYVORIQ Deliver Minimal Review Now 2026-08-01

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-deliver-minimal-review-now-20260801.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: tayvoriq-deliver-minimal-review-now-20260801
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "30696256615"
  BRIDGE_RUN_ID: "30698463835"
  SIGNED_ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-ffc0-81f4-9d8f-690a9683f212/raw?se=2026-08-01T11:56:04Z&sp=r&sv=2026-02-06&sr=b&scid=bcde8660-f60a-5333-802e-e0c99327c0e6&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T06:53:32Z&ske=2026-08-02T06:53:32Z&sks=b&skv=2026-02-06&sig=cwLgzMS/DVOo6HX/HLpIIo2WlolKrdDiGTGlvRwwuM8%3D"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  deliver-minimal-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Telegram bot and signed package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNED_ARTIFACT_URL"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          http_code=$(curl --silent --show-error \
            --output /tmp/telegram-getme.json \
            --write-out '%{http_code}' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          python - "$http_code" <<'PY'
          import json, sys
          from pathlib import Path
          code=int(sys.argv[1])
          payload=json.loads(Path('/tmp/telegram-getme.json').read_text(encoding='utf-8'))
          if code != 200 or not payload.get('ok'):
              raise SystemExit({'http_code':code,'telegram':payload})
          print({'telegram_bot_valid':True,'username':(payload.get('result') or {}).get('username')})
          PY

      - name: Download minimal private review package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --location --retry 3 --retry-delay 1 \
            --connect-timeout 20 --max-time 300 \
            "$SIGNED_ARTIFACT_URL" \
            --output /tmp/tayvoriq-minimal-review.zip
          test -s /tmp/tayvoriq-minimal-review.zip
          unzip -q /tmp/tayvoriq-minimal-review.zip -d source
          rm -f /tmp/tayvoriq-minimal-review.zip

      - name: Reconstruct and verify review package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path

          roots=[]
          for item in Path('source').rglob('job.json'):
              root=item.parent
              if (root/'short_youtube.mp4').is_file():
                  roots.append(root)
          if not roots:
              raise SystemExit('No completed minimal review job found')
          root=max(roots,key=lambda p:p.stat().st_mtime).resolve()
          job=json.loads((root/'job.json').read_text(encoding='utf-8'))
          quality=job.get('quality_report') if isinstance(job.get('quality_report'),dict) else {}
          if quality.get('passed') is not True:
              raise SystemExit({'quality_gate_failed':quality})

          master=root/'short_youtube.mp4'
          if master.stat().st_size < 100000:
              raise SystemExit('Master review video is unexpectedly small')
          shutil.copy2(master,root/'short_tiktok.mp4')
          shutil.copy2(master,root/'short.mp4')

          digest=hashlib.sha256(master.read_bytes()).hexdigest()
          if hashlib.sha256((root/'short_tiktok.mp4').read_bytes()).hexdigest() != digest:
              raise SystemExit('Reconstructed TikTok video hash mismatch')

          state_files=list(Path('source').rglob('tayvoriq-review-state.json'))
          bridge_state=json.loads(state_files[0].read_text(encoding='utf-8')) if state_files else {}
          expected=str(bridge_state.get('shared_master_sha256') or '')
          if expected and expected != digest:
              raise SystemExit({'bridge_hash_mismatch':[expected,digest]})

          target=Path('control-review')/'out'/'tayvoriq-youtube-tiktok'/root.name
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copytree(root,target)
          state={
              'source_run_id':os.environ['SOURCE_RUN_ID'],
              'bridge_run_id':os.environ['BRIDGE_RUN_ID'],
              'job_dir':str(Path('out')/'tayvoriq-youtube-tiktok'/root.name),
              'topic':job.get('topic') or 'Sächsische Schweiz – Lebensgefahr durch beschädigte Bäume',
              'local_quality_passed':True,
              'shared_master_sha256':digest,
              'private_human_review':True,
              'youtube_publication_allowed':False,
              'youtube_requires_explicit_telegram_approval':True,
              'tiktok':'manual_after_human_approval',
          }
          (Path('control-review')/'out').mkdir(parents=True,exist_ok=True)
          (Path('control-review')/'out'/'tayvoriq-review-state.json').write_text(
              json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write(f'TAYVORIQ_JOB_DIR={target.resolve()}\n')
              handle.write(f'TAYVORIQ_TELEGRAM_VIDEO={(target/"short_youtube.mp4").resolve()}\n')
          print({
              'review_ready':True,
              'quality_passed':True,
              'shared_master_sha256':digest,
              'video_size':master.stat().st_size,
          })
          PY

      - name: Register approval artifact in control plane
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-control-review-${{ github.run_id }}
          path: control-review/out/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Send video with approve and reject buttons
        id: telegram
        shell: bash
        run: |
          set -euo pipefail
          markup=$(python - <<'PY'
          import json, os
          run=os.environ['GITHUB_RUN_ID']
          details=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run}"
          print(json.dumps({'inline_keyboard':[
              [
                  {'text':'✅ Freigeben','callback_data':f'tayvoriq:approve:{run}'},
                  {'text':'❌ Ablehnen','callback_data':f'tayvoriq:reject:{run}'},
              ],
              [{'text':'🔧 Technische Details','url':details}],
          ]},ensure_ascii=False))
          PY
          )
          caption=$'🟢 Dein TAYVORIQ-Video ist bereit\n\nThema: Sächsische Schweiz – Lebensgefahr durch beschädigte Bäume\nLokale Render- und Quality-Gates: bestanden\nExterne KI-Endkontrolle: wegen Provider-Quota zur privaten Sichtprüfung verschoben\n\nYouTube bleibt gesperrt, bis du auf Freigeben klickst. TikTok bleibt manuell.'
          http_code=$(curl --silent --show-error \
            --max-time 300 \
            --output /tmp/telegram-send.json \
            --write-out '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@${TAYVORIQ_TELEGRAM_VIDEO};type=video/mp4" \
            -F "caption=${caption}" \
            -F "supports_streaming=true" \
            -F "reply_markup=${markup}")
          cat /tmp/telegram-send.json
          python - "$http_code" <<'PY'
          import json, os, sys
          from pathlib import Path
          code=int(sys.argv[1])
          payload=json.loads(Path('/tmp/telegram-send.json').read_text(encoding='utf-8'))
          if code != 200 or not payload.get('ok'):
              raise SystemExit({'http_code':code,'telegram':payload})
          message_id=payload['result']['message_id']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f'message_id={message_id}\n')
          print({'telegram_delivery':'confirmed','message_id':message_id,'buttons':True})
          PY

      - name: Persist confirmed delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation/tayvoriq-telegram-delivery
          cat > ".automation/tayvoriq-telegram-delivery/${GITHUB_RUN_ID}.json" <<JSON
          {
            "status": "DELIVERED_TO_TELEGRAM",
            "source_run_id": "${SOURCE_RUN_ID}",
            "bridge_run_id": "${BRIDGE_RUN_ID}",
            "control_review_run_id": "${GITHUB_RUN_ID}",
            "telegram_message_id": "${{ steps.telegram.outputs.message_id }}",
            "approve_callback": "tayvoriq:approve:${GITHUB_RUN_ID}",
            "reject_callback": "tayvoriq:reject:${GITHUB_RUN_ID}",
            "youtube_published": false,
            "tiktok_mode": "manual_after_approval",
            "delivered_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".automation/tayvoriq-telegram-delivery/${GITHUB_RUN_ID}.json"
          git commit -m "ops: confirm TAYVORIQ Telegram delivery ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin main
