name: TAYVORIQ Ops Health

on:
  workflow_run:
    workflows:
      - TAYVORIQ-X Golden Path
      - TAYVORIQ Production Green Promoter
    types: [requested, in_progress, completed]
  push:
    branches: [main]
    paths:
      - requests/**
      - .github/state/tayvoriq-production-green.json
      - scripts/tayvoriq_ops_health.py
      - scripts/tayvoriq_ops_health_postprocess.py
      - .github/workflows/tayvoriq-ops-health.yml
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: tayvoriq-ops-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout live control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Reconcile latest main before health snapshot
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Autonomous active-request watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          POINTER=".github/state/tayvoriq-active-production-request.json"
          [ -f "$POINTER" ] || { echo "ORCHESTRATOR_NO_ACTIVE_POINTER"; exit 0; }
          readarray -t owner < <(python -S - "$POINTER" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          try: d=json.loads(path.read_text(encoding='utf-8'))
          except Exception: d={}
          print(str(d.get('state') or ''))
          print(str(d.get('request_id') or ''))
          print(str(d.get('golden_path_run_id') or '0'))
          PY
          )
          pointer_state="${owner[0]:-}"
          request_id="${owner[1]:-}"
          run_id="${owner[2]:-0}"
          if [ "$pointer_state" != "ACTIVE" ] || [ -z "$request_id" ] || [[ ! "$run_id" =~ ^[0-9]+$ ]] || [ "$run_id" -le 0 ]; then
            echo "ORCHESTRATOR_POINTER_NOT_ACTIONABLE state=$pointer_state request=$request_id run=$run_id"
            exit 0
          fi
          run_state=$(gh run view "$run_id" --json status,conclusion --jq '(.status // "") + ":" + (.conclusion // "")' 2>/dev/null || true)
          echo "ORCHESTRATOR_OWNER request=$request_id run=$run_id state=$run_state"
          if [ "$run_state" = "completed:success" ]; then
            python -S - "$POINTER" "$run_id" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path(sys.argv[1]); run_id=int(sys.argv[2]); d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('state')!='ACTIVE' or int(d.get('golden_path_run_id') or 0)!=run_id:
              raise SystemExit(0)
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          d['state']='COMPLETED'; d['reason']='ops-health-terminal-success-reconcile'; d['completed_at']=now; d['updated_at']=now
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'ORCHESTRATOR_STALE_SUCCESS_FINALIZED:{run_id}')
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$POINTER"
            if ! git diff --cached --quiet; then
              git commit -m "ops(tayvoriq): reconcile completed active pointer ${run_id}"
              git push origin HEAD:main || { git pull --rebase origin main; git push origin HEAD:main; }
            fi
            exit 0
          fi
          if [ "$run_state" != "completed:failure" ] && [ "$run_state" != "completed:cancelled" ] && [ "$run_state" != "completed:timed_out" ]; then
            echo "ORCHESTRATOR_RUN_STILL_ACTIVE_OR_UNKNOWN"
            exit 0
          fi
          REQUEST_FILE="requests/${request_id}.json"
          [ -f "$REQUEST_FILE" ] || { echo "ORCHESTRATOR_REQUEST_FILE_MISSING"; exit 0; }

          # Delivery Watch is the single recovery classifier for every terminal
          # failed active Golden Path. It decides fresh-run, same-run rerun,
          # deterministic codefix, duplicate block, or external action. Never
          # bypass that policy here based on stale request recovery metadata.
          active_recovery=$(gh run list --workflow tayvoriq-delivery-watch.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested")] | length')
          if [ "$active_recovery" -eq 0 ]; then
            gh workflow run tayvoriq-delivery-watch.yml --ref main -f "run_id=$run_id"
            echo "ORCHESTRATOR_DELIVERY_WATCH_DISPATCHED request=$request_id run=$run_id"
          else
            echo "ORCHESTRATOR_DELIVERY_WATCH_ALREADY_RUNNING count=$active_recovery"
          fi
      - name: Build live health snapshot
        id: health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAYVORIQ_OPS_STATE_PATH: run-status/ops-health.json
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tayvoriq_ops_health.py
          python -m json.tool run-status/ops-health.json >/dev/null

      - name: Resolve effective recovery state
        id: effective
        env:
          TAYVORIQ_OPS_STATE_PATH: run-status/ops-health.json
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tayvoriq_ops_health_postprocess.py
          python -m json.tool run-status/ops-health.json >/dev/null

      - name: Persist health snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run-status/ops-health.json
          if git diff --cached --quiet; then
            echo "TAYVORIQ_OPS_HEALTH_UNCHANGED"
            exit 0
          fi
          git commit -m "ops(tayvoriq): refresh control center health"
          if git push origin HEAD:main; then
            echo "TAYVORIQ_OPS_HEALTH_PERSISTED"
            exit 0
          fi
          echo "Concurrent control-plane change detected; regenerating against latest main"
          git pull --rebase origin main
          GITHUB_TOKEN="${GITHUB_TOKEN}" python scripts/tayvoriq_ops_health.py
          python scripts/tayvoriq_ops_health_postprocess.py
          git add run-status/ops-health.json
          git commit --amend --no-edit
          git push origin HEAD:main
          echo "TAYVORIQ_OPS_HEALTH_PERSISTED_AFTER_REBASE"

      - name: Telegram health transition
        if: steps.health.outputs.notify == 'true' || steps.effective.outputs.notify == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONTROL_CENTER_URL: https://tayvoriq-control-center-mo61.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "TELEGRAM_HEALTH_NOTIFICATION_SKIPPED: secrets unavailable"
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          state=json.loads(Path('run-status/ops-health.json').read_text(encoding='utf-8'))
          overall=state.get('overall','unknown')
          icon={'green':'🟢','yellow':'🟡','red':'🔴'}.get(overall,'⚪')
          title={'green':'System wieder gesund','yellow':'Run / Recovery aktiv','red':'Incident erkannt'}.get(overall,'Status aktualisiert')
          req=state.get('request') or {}
          run=state.get('run') or {}
          incident=state.get('incident') or {}
          recovery=state.get('recovery') or {}
          action='⚠️ Aktion von dir erforderlich.' if state.get('user_action_required') else '✅ Keine Aktion von dir nötig.'
          lines=[
              f"{icon} TAYVORIQ Control Center · {title}",
              '',
              f"Thema: {req.get('topic') or '—'}",
              f"Run: {run.get('id') or '—'} · {str(run.get('status') or '—').upper()}",
          ]
          if incident.get('failure_state'):
              lines.append(f"Fehlerklasse: {incident.get('failure_state')}")
          if incident.get('failed_step'):
              lines.append(f"Step: {incident.get('failed_step')}")
          lines += [
              f"Self-Heal: {recovery.get('status') or 'IDLE'}",
              action,
              '',
              f"Schaltzentrale: {os.environ['CONTROL_CENTER_URL']}",
          ]
          payload={'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':'\n'.join(lines),'disable_web_page_preview':True}
          Path('/tmp/tayvoriq-ops-telegram.json').write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
          PY
          curl -fsS --retry 2 --connect-timeout 10 --max-time 25 \
            -H 'Content-Type: application/json' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-binary @/tmp/tayvoriq-ops-telegram.json \
            >/dev/null || echo "TELEGRAM_HEALTH_NOTIFICATION_FAILED"
