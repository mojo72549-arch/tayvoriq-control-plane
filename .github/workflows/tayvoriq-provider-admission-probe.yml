name: TAYVORIQ Provider Admission Probe

on:
  workflow_dispatch:
  push:
    branches: [fix/tayvoriq-provider-admission-20261021]
    paths: [.github/workflows/tayvoriq-provider-admission-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check existing provider admission without modifying production
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          sys.path.insert(0, 'tools')
          import tayvoriq_agent_trend_provider_v3 as provider

          def inspect(label, call):
              try:
                  result = call()
                  print(json.dumps({'probe':label,'status':'accepted'}))
              except Exception as exc:
                  seen=set(); root=exc
                  while root and id(root) not in seen:
                      seen.add(id(root))
                      if isinstance(root, urllib.error.HTTPError):
                          body=root.read(12000).decode('utf-8','replace')
                          for key in ('GEMINI_API_KEY','GROQ_API_KEY'):
                              secret=os.environ.get(key,'')
                              if secret: body=body.replace(secret,'[redacted]')
                          body=re.sub(r'org_[A-Za-z0-9_-]+','[organization]',body)
                          safe_headers={k:v for k,v in root.headers.items()
                                        if k.lower().startswith(('retry-after','x-ratelimit-'))}
                          print(json.dumps({'probe':label,'http_status':root.code,
                                            'rate_headers':safe_headers,'error_body':body[:6000]}))
                          return
                      root=root.__cause__ or root.__context__
                  print(json.dumps({'probe':label,'status':'failed','error_type':type(exc).__name__}))

          groq=os.environ.get('GROQ_API_KEY','')
          if groq:
              inspect('groq_small_admission',lambda:provider.post_groq({
                  'model':'openai/gpt-oss-20b',
                  'messages':[{'role':'user','content':'Reply OK.'}],
                  'max_completion_tokens':32,'reasoning_effort':'low'},groq,timeout=30))
              inspect('groq_current_browser_contract',lambda:provider.groq_browser_then_structure(
                  'Current German regional events with two independent original sources.',groq))
          gemini=os.environ.get('GEMINI_API_KEY','')
          if gemini:
              def gemini_probe():
                  request=urllib.request.Request(
                      'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent',
                      data=json.dumps({'contents':[{'parts':[{'text':'Reply OK.'}]}],
                                       'generationConfig':{'maxOutputTokens':32}}).encode(),
                      headers={'Content-Type':'application/json','x-goog-api-key':gemini},method='POST')
                  with urllib.request.urlopen(request,timeout=30) as response:
                      return response.status
              inspect('gemini_small_admission',gemini_probe)
          PY
