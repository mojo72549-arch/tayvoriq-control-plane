name: TAYVORIQ Eclipse Afterglow Repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/run-now/tayvoriq-eclipse-afterglow.json'

concurrency:
  group: tayvoriq-eclipse-afterglow-repair
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: '1'
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TAYVORIQ_CLOUD_MODE: 'true'
  TAYVORIQ_RENDER_SIZE: '1080x1920'
  TAYVORIQ_TTS_PROVIDER: 'chatterbox'
  TAYVORIQ_CHATTERBOX_MODEL_VERSION: 'v3'
  TAYVORIQ_CHATTERBOX_LANGUAGE: 'de'
  TAYVORIQ_CHATTERBOX_ENABLED: 'true'
  TAYVORIQ_CHATTERBOX_CPU_THREADS: '4'
  TAYVORIQ_DOCUMENTARY_TIMEOUT_SECONDS: '1200'
  TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: '1200'
  TAYVORIQ_CHATTERBOX_MAX_CHUNKS: '2'
  TAYVORIQ_CHATTERBOX_MAX_CHARS: '720'
  TAYVORIQ_NATURAL_DOCUMENTARY_TARGET_WPM: '140'
  TAYVORIQ_NATURAL_CHATTERBOX_EXAGGERATION: '0.50'
  TAYVORIQ_NATURAL_CHATTERBOX_CFG_WEIGHT: '0.30'
  TAYVORIQ_NATURAL_CHATTERBOX_PAUSE_MS: '360'
  TAYVORIQ_AUDIO_END_PADDING_SECONDS: '1.25'
  TAYVORIQ_NATURAL_VOICE_MIN_SECONDS: '48'
  TAYVORIQ_NATURAL_VOICE_MAX_SECONDS: '58'
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch

jobs:
  render-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Chatterbox model cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: tayvoriq-chatterbox-v3-cpu-py311-v3

      - name: Checkout implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: fix/deep-documentary-fire-safety-v29
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Checkout audit implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: audit-implementation
          fetch-depth: 1

      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Checkout narrator reference snapshot
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: 4b97b081a5f974b9d74f1bc957f5e81080759402
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: voice-reference-pages
          fetch-depth: 1

      - name: Install dependencies
        id: deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rsync libsndfile1 rubberband-cli
          python -m pip install --upgrade pip -q
          pip install -r implementation/requirements.txt -q
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0' 'torchaudio==2.6.0' -q
          python -m pip install 'git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948' -q
          python -m pip install requests python-dotenv python-slugify pillow 'moviepy==1.0.3' imageio-ffmpeg numpy flask google-api-python-client google-auth-oauthlib google-auth-httplib2 certifi 'edge-tts==7.2.8' pydub -q
          python - <<'PY'
          import torch, torchaudio, chatterbox
          print('CHATTERBOX_RUNTIME_READY', torch.__version__, torchaudio.__version__)
          PY

      - name: Prepare narrator reference
        id: reference
        run: |
          set -euo pipefail
          SOURCE="voice-reference-pages/tayvoriq/runs/30277119576/tayvoriq-review.mp4"
          test -s "$SOURCE"
          ffmpeg -y -loglevel error -i "$SOURCE" -vn -ac 1 -ar 24000 -t 24 -c:a pcm_s16le natural_reference.wav
          test -s natural_reference.wav
          echo "TAYVORIQ_CHATTERBOX_REFERENCE_AUDIO=$GITHUB_WORKSPACE/natural_reference.wav" >> "$GITHUB_ENV"
          echo "NARRATOR_REFERENCE_READY"

      - name: Validate afterglow repair contract
        id: guard
        run: |
          set -euo pipefail
          python -m py_compile implementation/tools/tayvoriq_tts_router_v31_natural.py
          python -m py_compile implementation/tools/tayvoriq_eclipse_afterglow_v4.py
          python - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('.github/run-now/tayvoriq-eclipse-afterglow.json').read_text(encoding='utf-8'))
          assert request['release_scope'] == 'youtube'
          assert request['rejected_review_id'] == 31638457966
          assert request['failed_afterglow_run'] == 31639345305
          assert request['human_rejection']['voice_anonymous_like'] is True
          assert request['human_rejection']['glasses_scene_quality'] is True
          assert request['requirements']['post_event_recap'] is True
          assert request['requirements']['beautiful_moments'] is True
          assert request['requirements']['next_total_eclipse_2027_focus'] is True
          assert request['voice']['pitch_shift_allowed'] is False
          assert request['voice']['max_chunks'] == 2
          assert request['audit_repair']['remove_spoken_island'] is True
          assert request['audit_repair']['verbalize_all_tts_numbers'] is True
          assert request['audit_repair']['forbid_generic_stock'] is True
          assert request['audit_repair']['forbid_wrong_geography_maps'] is True
          assert request['visuals']['official_nasa_eclipse_viewers'] is True
          assert request['visuals']['official_nasa_glasses_photo'] is True
          assert request['visuals']['official_nasa_2026_visual'] is True
          assert request['visuals']['official_nasa_2027_map'] is True
          assert request['platform_upload'] is False
          assert request['quality_gates_weakened'] is False
          print('AFTERGLOW_V4_REPAIR_GUARD_VALID')
          PY

      - name: Render audit-repaired natural-voice afterglow Short
        id: render
        env:
          PYTHONPATH: ${{ github.workspace }}/implementation/tools
        run: |
          set -euo pipefail
          rm -rf out/eclipsereview
          python implementation/tools/tayvoriq_eclipse_afterglow_v4.py --out-dir out/eclipsereview
          test -s out/eclipsereview/job.json
          test -s out/eclipsereview/short_youtube.mp4
          python - <<'PY'
          import json, re
          from pathlib import Path
          job=json.loads(Path('out/eclipsereview/job.json').read_text(encoding='utf-8'))
          gate=job['variants']['youtube_shorts']['audio']['documentary_voice_gate']
          audio=job['variants']['youtube_shorts']['audio']
          script=job['variants']['youtube_shorts']['text_package']['script']
          assert gate['passed'] is True
          assert gate['pitch_shift_applied'] is False
          assert gate['anonymous_voice_effect_forbidden'] is True
          assert not re.search(r'\d', audio['tts_text'])
          assert 'Island' not in audio['tts_text']
          assert job['quality_report']['generic_stock_used'] is False
          assert job['quality_report']['real_nasa_glasses_visual'] is True
          assert job['quality_report']['nasa_2026_vertical_visual'] is True
          assert job['quality_report']['nasa_2027_animated_map'] is True
          report=json.loads(Path('out/eclipsereview/voice_chatterbox_report.json').read_text(encoding='utf-8'))
          assert report['chunk_count'] <= 2
          print('NEW_AFTERGLOW_V4_MASTER_RENDERED')
          PY

      - name: Run independent YouTube final audit
        id: audit
        env:
          PYTHONPATH: ${{ github.workspace }}/audit-implementation:${{ github.workspace }}/audit-implementation/tools
        run: |
          set -euo pipefail
          rm -f out/eclipsereview/preapproval_ai_audit.json
          python audit-implementation/tools/tayvoriq_preapproval_ai_audit_v6.py --job-dir out/eclipsereview --targets youtube

      - name: Run YouTube publication quality gate
        id: quality
        env:
          PYTHONPATH: ${{ github.workspace }}/audit-implementation:${{ github.workspace }}/audit-implementation/tools
        run: |
          set -euo pipefail
          python audit-implementation/tools/tayvoriq_publication_quality_gate_v2.py --job-dir out/eclipsereview --targets youtube

      - name: Build YouTube approval review
        id: review
        env:
          PYTHONPATH: ${{ github.workspace }}/audit-implementation:${{ github.workspace }}/audit-implementation/tools
        run: |
          set -euo pipefail
          rm -rf site/tayvoriq
          python audit-implementation/tools/tayvoriq_build_youtube_review_site.py --job-dir out/eclipsereview --site-root site/tayvoriq --run-id "${GITHUB_RUN_ID}"

      - name: Publish approval review page
        id: review_publish
        run: |
          set -euo pipefail
          mkdir -p pages-worktree/tayvoriq/latest pages-worktree/tayvoriq/runs/${GITHUB_RUN_ID}
          rsync -a --delete site/tayvoriq/latest/ pages-worktree/tayvoriq/latest/
          rsync -a site/tayvoriq/runs/${GITHUB_RUN_ID}/ pages-worktree/tayvoriq/runs/${GITHUB_RUN_ID}/
          cp site/tayvoriq/index.html pages-worktree/tayvoriq/index.html
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish TAYVORIQ eclipse afterglow V4 review ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Send Telegram approval review
        id: telegram
        env:
          PYTHONPATH: ${{ github.workspace }}/audit-implementation:${{ github.workspace }}/audit-implementation/tools
        run: |
          set -euo pipefail
          python audit-implementation/tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --dashboard-url "" \
            --review-id "${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"

      - name: Upload afterglow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-eclipse-afterglow-v4-${{ github.run_id }}
          path: |
            out/eclipsereview/**
            site/tayvoriq/**
          retention-days: 30
          compression-level: 1

      - name: Telegram precise failure
        if: failure()
        env:
          DEPS: ${{ steps.deps.outcome }}
          REFERENCE: ${{ steps.reference.outcome }}
          GUARD: ${{ steps.guard.outcome }}
          RENDER: ${{ steps.render.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          QUALITY: ${{ steps.quality.outcome }}
          REVIEW: ${{ steps.review.outcome }}
          REVIEW_PUBLISH: ${{ steps.review_publish.outcome }}
          TELEGRAM: ${{ steps.telegram.outcome }}
        run: |
          set +e
          stage="UNKNOWN"
          detail="Der Sonnenfinsternis-Afterglow V4 ist noch nicht freigabefähig."
          if [ "$DEPS" != "success" ]; then stage="DEPENDENCIES"; detail="Abhängigkeiten konnten nicht sauber aufgebaut werden.";
          elif [ "$REFERENCE" != "success" ]; then stage="VOICE_REFERENCE"; detail="Die Sprecherreferenz konnte nicht geladen werden.";
          elif [ "$GUARD" != "success" ]; then stage="AFTERGLOW_V4_GUARD"; detail="Der Audit-Repair-Vertrag hat blockiert.";
          elif [ "$RENDER" != "success" ]; then stage="NATURAL_VOICE_OR_VISUAL_RENDER"; detail="Natürliche Stimme oder offizielle Eclipse-Visuals konnten nicht sauber gerendert werden.";
          elif [ "$AUDIT" != "success" ]; then stage="YOUTUBE_FINAL_AUDIT"; detail="Der unabhängige Audit blockiert die neue V4-Fassung.";
          elif [ "$QUALITY" != "success" ]; then stage="YOUTUBE_PUBLICATION_GATE"; detail="Audit bestanden; Publication Gate blockiert noch.";
          elif [ "$REVIEW" != "success" ]; then stage="YOUTUBE_REVIEW_BUILD"; detail="Alle Gates bestanden; Review-Seite konnte nicht gebaut werden.";
          elif [ "$REVIEW_PUBLISH" != "success" ]; then stage="YOUTUBE_REVIEW_PUBLISH"; detail="Alle Gates bestanden; Review-Seite konnte nicht bereitgestellt werden.";
          elif [ "$TELEGRAM" != "success" ]; then stage="TELEGRAM_REVIEW_DELIVERY"; detail="Alle Gates bestanden; nur Telegram ist fehlgeschlagen."; fi
          message=$(printf '❌ TAYVORIQ Sonnenfinsternis-Afterglow V4 noch nicht freigabefähig\n\nRun: %s\nStufe: %s\n%s\n\nKeine generischen Stock-Szenen. Kein Upload vor deiner Freigabe.' "$GITHUB_RUN_ID" "$stage" "$detail")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${message}" >/dev/null
