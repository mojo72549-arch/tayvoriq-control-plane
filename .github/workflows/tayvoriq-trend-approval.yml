name: TAYVORIQ Trend Selection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run-now/tayvoriq-trend-request.json
      - .github/workflows/tayvoriq-trend-approval.yml

permissions:
  contents: read

concurrency:
  group: tayvoriq-trend-selection
  cancel-in-progress: true

jobs:
  deliver-trend-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate two-step selection request and Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          test -s .github/run-now/tayvoriq-trend-request.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data=json.loads(Path('.github/run-now/tayvoriq-trend-request.json').read_text(encoding='utf-8'))
          selection_id=str(data.get('selection_id') or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]{4,40}', selection_id), selection_id
          assert data.get('selected_trend_id') in {None, ''}, data.get('selected_trend_id')
          trends=data.get('trends') or []
          assert len(trends) == 5, len(trends)
          assert [str(item.get('id')) for item in trends] == ['1','2','3','4','5'], trends
          required_criteria={'aktualitaet','viralitaet','tayvoriq_passung','quellenqualitaet','visuell'}
          required_answers={'what_happened','why_happening','who_is_affected','personal_impact','action_now'}
          for item in trends:
              assert str(item.get('title') or '').strip(), item
              assert 0 <= int(item.get('score')) <= 100, item
              assert required_criteria <= set((item.get('criteria') or {}).keys()), item
              assert len(item.get('sources') or []) >= 2, item
              context=item.get('source_context') or {}
              assert int(context.get('independent_news_count') or 0) >= 2, item
              assert len(context.get('sources') or []) >= 2, item
              assert required_answers <= set((context.get('fallback_editorial_answers') or {}).keys()), item
          print('two_step_request_valid', selection_id)
          PY

      - name: Send Telegram evening ranking with selection buttons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/message.txt
          import json
          from pathlib import Path

          data=json.loads(Path('.github/run-now/tayvoriq-trend-request.json').read_text(encoding='utf-8'))
          lines=['🌙 TAYVORIQ Abend-Trends', '', 'Rangliste:']
          for trend in data['trends']:
              lines.append(f"{trend['id']}. {trend['title']} — {trend['score']} %")
          lines += [
              '',
              'Bewertet nach Aktualität · Viralität · TAYVORIQ-Passung · Quellenqualität · visueller Umsetzbarkeit.',
              '',
              'Schritt 1: Tippe auf eine Nummer.',
              'Schritt 2: Prüfe Details und Quellen und tippe separat auf „Trend freigeben“.',
              '',
              'Vor dem zweiten Klick startet keine Produktion.'
          ]
          print('\n'.join(lines))
          PY
          KEYBOARD=$(python - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('.github/run-now/tayvoriq-trend-request.json').read_text(encoding='utf-8'))
          selection_id=data['selection_id']
          keyboard={'inline_keyboard': [
            [
              {'text':'1️⃣ Trend 1','callback_data':f'select_trend:{selection_id}:1'},
              {'text':'2️⃣ Trend 2','callback_data':f'select_trend:{selection_id}:2'},
            ],
            [
              {'text':'3️⃣ Trend 3','callback_data':f'select_trend:{selection_id}:3'},
              {'text':'4️⃣ Trend 4','callback_data':f'select_trend:{selection_id}:4'},
            ],
            [{'text':'5️⃣ Trend 5','callback_data':f'select_trend:{selection_id}:5'}],
          ]}
          print(json.dumps(keyboard, ensure_ascii=False))
          PY
          )
          RESPONSE=$(curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@/tmp/message.txt" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "reply_markup=${KEYBOARD}")
          python - "$RESPONSE" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          assert data.get('ok') is True, data
          result=data.get('result') or {}
          assert result.get('message_id'), result
          markup=result.get('reply_markup') or {}
          callbacks=[button.get('callback_data') for row in markup.get('inline_keyboard',[]) for button in row]
          assert len(callbacks) == 5, callbacks
          assert all(str(value).startswith('select_trend:') for value in callbacks), callbacks
          assert not any(str(value).startswith('approve_trend:') for value in callbacks), callbacks
          print('telegram_message_id', result['message_id'])
          print('selection_callbacks_verified', callbacks)
          PY

      - name: Verify Telegram webhook status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS --retry 3 --retry-all-errors "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")
          python - "$RESPONSE" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1]); assert data.get('ok') is True, data
          result=data.get('result') or {}
          assert result.get('url'), result
          assert result.get('pending_update_count',0) >= 0
          print('webhook_active', result.get('url'))
          print('pending_update_count', result.get('pending_update_count'))
          print('last_error_message', result.get('last_error_message',''))
          PY
