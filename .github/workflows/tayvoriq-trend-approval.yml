name: TAYVORIQ Trend Selection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run-now/tayvoriq-trend-request.json

permissions:
  contents: read

concurrency:
  group: tayvoriq-trend-selection
  cancel-in-progress: true

jobs:
  deliver-trend-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate two-step selection request and Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          test -s .github/run-now/tayvoriq-trend-request.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data=json.loads(Path('.github/run-now/tayvoriq-trend-request.json').read_text(encoding='utf-8'))
          selection_id=str(data.get('selection_id') or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]{4,40}', selection_id), selection_id
          assert data.get('selected_trend_id') in {None, ''}, data.get('selected_trend_id')
          assert data.get('superseded', False) is not True, 'selection is superseded'
          assert data.get('rejected_whole_selection', False) is not True, 'selection was rejected'
          assert data.get('production_started', False) is False, 'selection already started production'
          trends=data.get('trends') or []
          if data.get('mode') == 'active_series':
              assert len(trends) == 1, f'active_series must contain exactly one bound episode, got {len(trends)}'
          else:
              assert len(trends) == 5, f'V5 requires exactly five trends, got {len(trends)}'
          assert [str(item.get('id')) for item in trends] == [str(i) for i in range(1,len(trends)+1)], trends
          required_criteria={'aktualitaet','viralitaet','tayvoriq_passung','quellenqualitaet','visuell'}
          required_answers={'what_happened','why_happening','who_is_affected','personal_impact','action_now'}
          for item in trends:
              assert str(item.get('title') or '').strip(), item
              assert 0 <= int(item.get('score')) <= 100, item
              assert required_criteria <= set((item.get('criteria') or {}).keys()), item
              assert len(item.get('sources') or []) >= 2, item
              context=item.get('source_context') or {}
              assert int(context.get('independent_news_count') or 0) >= 2, item
              assert len(context.get('sources') or []) >= 2, item
              assert required_answers <= set((context.get('fallback_editorial_answers') or {}).keys()), item
              for key in ('viral_potential','tayvoriq_fit','novelty_score','series_fit_score','return_viewer_score','follow_conversion_potential','open_loop_potential','trend_selection_score'):
                  assert 0 <= int(item.get(key)) <= 100, (key,item)
              assert str(item.get('content_angle') or '').strip(), item
              assert str(item.get('cta_type') or '') in {'CURIOSITY','EXPERTISE','COMMUNITY','SERIES','DISCUSSION','IDENTITY'}, item
              assert str(item.get('open_loop_status') or '') in {'NONE','SOFT','HARD'}, item
              assert str(item.get('follow_reason') or '').strip(), item
              assert str(item.get('cta_text') or '').strip(), item
              if str(item.get('open_loop_status') or '') == 'HARD':
                  assert str(item.get('next_episode_candidate') or '').strip(), item
                  assert str(item.get('next_episode_queue_status') or '') in {'PLANNED','QUEUED','READY'}, item
          print('two_step_request_valid_v5', selection_id)
          PY

      - name: Send Telegram evening ranking with selection buttons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/message.txt
          import json
          from pathlib import Path

          data=json.loads(Path('.github/run-now/tayvoriq-trend-request.json').read_text(encoding='utf-8'))
          lines=['🌙 TAYVORIQ Abend-Trends', '', 'V5-Rangliste:']
          for trend in data['trends']:
              sc=trend.get('source_context') or {}
              reach=sc.get('reach_gate') or {}
              series=trend.get('proposed_series_name') or 'NONE'
              nxt=trend.get('next_episode_candidate') or '—'
              lines += [
                  f"{trend['id']}. {trend['title']} — Auswahl {int(trend.get('trend_selection_score') or 0)}/100",
                  f"   Warum jetzt: {reach.get('why_now') or 'durch Quellenkontext belegt'}",
                  f"   Viralität: {int(trend.get('viral_potential') or 0)}/100 · TAYVORIQ-Fit: {int(trend.get('tayvoriq_fit') or 0)}/100",
                  f"   Serie: {series} · Serienpotenzial: {int(trend.get('series_fit_score') or 0)}/100",
                  f"   Return-Viewer: {int(trend.get('return_viewer_score') or 0)}/100 · Follow: {int(trend.get('follow_conversion_potential') or 0)}/100",
                  f"   Möglicher nächster Teil: {nxt}",
                  ''
              ]
          lines += [
              '',
              'Evidence/Quellenqualität bleibt Mindestbedingung; der V5-Score kann sie nicht kompensieren.',
              '',
              'Schritt 1: Tippe auf eine Nummer.',
              'Schritt 2: Prüfe Details und Quellen und tippe separat auf „Trend freigeben“.',
              '',
              'Vor dem zweiten Klick startet keine Produktion.'
          ]
          print('\n'.join(lines))
          PY
          KEYBOARD=$(python - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('.github/run-now/tayvoriq-trend-request.json').read_text(encoding='utf-8'))
          selection_id=data['selection_id']
          labels=['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣']
          buttons=[
            {'text':f"{labels[i-1]} Trend {i}",'callback_data':f'select_trend:{selection_id}:{i}'}
            for i in range(1,len(data['trends'])+1)
          ]
          keyboard={'inline_keyboard':[buttons[i:i+2] for i in range(0,len(buttons),2)]}
          print(json.dumps(keyboard, ensure_ascii=False))
          PY
          )
          RESPONSE=$(curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@/tmp/message.txt" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "reply_markup=${KEYBOARD}")
          python - "$RESPONSE" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          assert data.get('ok') is True, data
          result=data.get('result') or {}
          assert result.get('message_id'), result
          markup=result.get('reply_markup') or {}
          callbacks=[button.get('callback_data') for row in markup.get('inline_keyboard',[]) for button in row]
          expected=1 if data.get('mode') == 'active_series' else 5
          assert len(callbacks) == expected, callbacks
          assert all(str(value).startswith('select_trend:') for value in callbacks), callbacks
          assert not any(str(value).startswith('approve_trend:') for value in callbacks), callbacks
          print('telegram_message_id', result['message_id'])
          print('selection_callbacks_verified', callbacks)
          PY

      - name: Verify Telegram webhook status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS --retry 3 --retry-all-errors "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")
          python - "$RESPONSE" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1]); assert data.get('ok') is True, data
          result=data.get('result') or {}
          assert result.get('url'), result
          assert result.get('pending_update_count',0) >= 0
          print('webhook_active', result.get('url'))
          print('pending_update_count', result.get('pending_update_count'))
          print('last_error_message', result.get('last_error_message',''))
          PY
