name: SkyReels ZeroGPU Compatibility Fix

on:
  push:
    branches:
      - lab/skyreels-v3-engine
    paths:
      - '.github/workflows/skyreels-space-zerogpu-fix.yml'
      - 'lab/skyreels_v3_engine/zerogpu-fix-trigger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-space:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_SKYREELS_TOKEN }}
      HF_SPACE_ID: Mo6161/tayvoriq-skyreels-lab
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch duplicated SkyReels Space for ZeroGPU and public API
        shell: bash
        run: |
          python -m pip install -q -U huggingface_hub
          python - <<'PY'
          import os, tempfile, time
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download

          token = os.environ.get('HF_TOKEN','').strip()
          repo_id = os.environ['HF_SPACE_ID']
          if not token:
              raise SystemExit('HF_SKYREELS_TOKEN_SECRET_NOT_AVAILABLE')
          api = HfApi(token=token)
          print('AUTH', (api.whoami(token=token).get('name') or 'unknown'))

          tmp = Path(tempfile.mkdtemp(prefix='skyreels-zero-'))
          def grab(name):
              return Path(hf_hub_download(repo_id=repo_id, filename=name, repo_type='space', token=token, local_dir=tmp, force_download=True))

          readme = grab('README.md').read_text(encoding='utf-8')
          # Keep Gradio + Python 3.10, remove a paid-L40 recommendation that does not apply to ZeroGPU.
          readme = readme.replace('suggested_hardware: l40sx1\n', '')
          grab('README.md').write_text(readme, encoding='utf-8')

          req = grab('requirements.txt').read_text(encoding='utf-8')
          req = req.replace('torch==2.5.1', 'torch==2.8.0')
          req = req.replace('torchvision==0.20.1', 'torchvision==0.23.0')
          old_flash = 'https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.5cxx11abiFALSE-cp310-cp310-linux_x86_64.whl'
          new_flash = 'https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3%2Bcu12torch2.8cxx11abiFALSE-cp310-cp310-linux_x86_64.whl'
          req = req.replace(old_flash, new_flash)
          grab('requirements.txt').write_text(req, encoding='utf-8')

          app_path = grab('app_df.py')
          app = app_path.read_text(encoding='utf-8')
          if 'import spaces\n' not in app:
              app = app.replace('import gradio as gr\n', 'import gradio as gr\nimport spaces\n', 1)
          marker = 'def generate_diffusion_forced_video(\n'
          if '@spaces.GPU' not in app:
              if marker not in app:
                  raise SystemExit('GENERATOR_FUNCTION_NOT_FOUND')
              app = app.replace(marker, '@spaces.GPU(duration=180)\n' + marker, 1)
          app = app.replace('cache_examples = False if is_shared_ui else True,', 'cache_examples = False,')
          # Keep the internal parameter-change endpoint private, but expose the actual generator with a stable API name.
          last = app.rfind('api_visibility="private"')
          if last < 0:
              raise SystemExit('PRIVATE_GENERATE_ENDPOINT_NOT_FOUND')
          app = app[:last] + 'api_name="generate_video",\n        api_visibility="public"' + app[last+len('api_visibility="private"'):]
          app_path.write_text(app, encoding='utf-8')

          for name in ['README.md','requirements.txt','app_df.py']:
              api.upload_file(
                  path_or_fileobj=str(tmp/name),
                  path_in_repo=name,
                  repo_id=repo_id,
                  repo_type='space',
                  token=token,
                  commit_message='TAYVORIQ: make SkyReels V2 compatible with ZeroGPU API',
              )
              print('UPLOADED', name)

          try:
              api.request_space_hardware(repo_id=repo_id, hardware='zero-a10g', token=token)
          except Exception as e:
              print('HARDWARE_NOTE', type(e).__name__, str(e)[:300])
          try:
              api.restart_space(repo_id=repo_id, token=token)
              print('SPACE_RESTARTED')
          except Exception as e:
              print('RESTART_NOTE', type(e).__name__, str(e)[:300])

          for i in range(12):
              try:
                  rt = api.get_space_runtime(repo_id=repo_id, token=token)
                  print('RUNTIME', i, rt.stage, rt.hardware, rt.requested_hardware)
                  if str(rt.stage) in {'RUNNING','RUNNING_BUILDING'}:
                      break
                  if str(rt.stage) in {'BUILD_ERROR','RUNTIME_ERROR'}:
                      break
              except Exception as e:
                  print('RUNTIME_CHECK_NOTE', type(e).__name__, str(e)[:300])
              time.sleep(10)
          print('SPACE_URL=https://huggingface.co/spaces/'+repo_id)
          PY
