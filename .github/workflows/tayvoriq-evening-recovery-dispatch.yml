name: TAYVORIQ Evening Recovery Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/run-now/tayvoriq-evening-recovery-trigger.txt"

permissions:
  actions: write
  contents: write

jobs:
  dispatch-evening-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Dispatch existing orchestrator as evening slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run tayvoriq-agent-orchestrator-v2.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f slot=evening

      - name: Persist verified dispatch receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "dispatch_verified": True,
              "target_workflow": "tayvoriq-agent-orchestrator-v2.yml",
              "slot": "evening",
              "recovery_for": "2026-08-17-evening",
              "dispatcher_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "verified_at": datetime.now(timezone.utc).isoformat(),
          }
          path = Path("state/tayvoriq-evening-recovery-dispatch-receipt.json")
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/tayvoriq-evening-recovery-dispatch-receipt.json
          git commit -m "ops(tayvoriq): verify evening recovery dispatch"
          git pull --rebase origin main
          git push origin HEAD:main
