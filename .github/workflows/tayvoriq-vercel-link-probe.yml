name: UAM V290 Preview Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tayvoriq-vercel-link-probe.yml

permissions:
  contents: read

concurrency:
  group: uam-v290-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UAM_VERCEL_TOKEN: ${{ secrets.UAM_VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Maifclp5V8xrU2vIyzXHpbyH
      VERCEL_PROJECT_ID: prj_6CeUslzmHvM8TnH8oS9f8EkNFlbP
    steps:
      - name: Verify secret and fixed target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UAM_VERCEL_TOKEN" || { echo "::error::UAM_VERCEL_TOKEN missing"; exit 2; }
          test "$VERCEL_PROJECT_ID" = "prj_6CeUslzmHvM8TnH8oS9f8EkNFlbP"
          test "$VERCEL_ORG_ID" = "team_Maifclp5V8xrU2vIyzXHpbyH"

      - name: Restore encrypted V290 package
