name: TAYVORIQ Deterministic Codefix Continuity

on:
  workflow_run:
    workflows:
      - TAYVORIQ-X Golden Path
      - TAYVORIQ Production Green Promoter
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/state/tayvoriq-production-green.json
      - .github/state/tayvoriq-active-production-request.json
      - .github/workflows/tayvoriq-deterministic-codefix-continuity.yml
      - tools/tayvoriq_codefix_orphan_reconcile_v1.py
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Recovery is single-owner and fail-closed. Durable request JSON files are audit
# history, not a recovery queue. Every automatic action must match the canonical
# active-production pointer before it may mutate, notify, or replay anything.
concurrency:
  group: tayvoriq-delivery-watch
  cancel-in-progress: false

jobs:
  protect-deterministic-request:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.name == 'TAYVORIQ Production Green Promoter' ||
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IMPLEMENTATION_REPO: mojo72549-arch/shorts-agent-studio
      PRODUCTION_GREEN_POINTER: .github/state/tayvoriq-production-green.json
      ACTIVE_REQUEST_POINTER: .github/state/tayvoriq-active-production-request.json
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve canonical active request
        id: active
        shell: bash
        run: |
          set -euo pipefail
          python - "$ACTIVE_REQUEST_POINTER" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          pointer_path=Path(sys.argv[1]); output=Path(sys.argv[2])
          out={'found':'false','request_file':'','request_id':'','topic':'','trend_id':'','run_id':'','generation':'0'}
          if pointer_path.is_file():
              try: pointer=json.loads(pointer_path.read_text(encoding='utf-8'))
              except Exception: pointer={}
              if pointer.get('schema')=='tayvoriq-active-production-request-v1' and pointer.get('state')=='ACTIVE':
                  request_id=str(pointer.get('request_id') or '').strip()
                  try: pointer_run=int(pointer.get('golden_path_run_id') or 0)
                  except (TypeError,ValueError): pointer_run=0
                  request_path=Path('requests') / f'{request_id}.json'
                  if request_id and pointer_run>0 and request_path.is_file():
                      try: data=json.loads(request_path.read_text(encoding='utf-8'))
                      except Exception: data={}
                      try: request_run=int(data.get('golden_path_run_id') or 0)
                      except (TypeError,ValueError): request_run=0
                      immutable_ok=True
                      for field in ('approval_key','source_context_sha256','contract_sha256'):
                          pv=str(pointer.get(field) or '').strip(); rv=str(data.get(field) or '').strip()
                          if pv and pv != rv: immutable_ok=False
                      if (
                          str(data.get('request_id') or '').strip()==request_id
                          and str(data.get('status') or '')=='DISPATCHED'
                          and request_run==pointer_run
                          and immutable_ok
                      ):
                          out.update({
                              'found':'true','request_file':str(request_path),'request_id':request_id,
                              'topic':str(data.get('topic') or '').strip(),'trend_id':str(data.get('trend_id') or '').strip(),
                              'run_id':str(pointer_run),'generation':str(max(0,int(data.get('recovery_generation') or 0))),
                          })
          with output.open('a',encoding='utf-8') as h:
              for k,v in out.items(): h.write(f'{k}={v}\n')
          print(out)
          PY

      - name: Reject stale workflow-run owner
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'TAYVORIQ-X Golden Path' &&
          github.event.workflow_run.conclusion != 'success'
        shell: bash
        env:
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          ACTIVE_FOUND: ${{ steps.active.outputs.found }}
          ACTIVE_RUN_ID: ${{ steps.active.outputs.run_id }}
          ACTIVE_REQUEST_ID: ${{ steps.active.outputs.request_id }}
        run: |
          set -euo pipefail
          if [ "$ACTIVE_FOUND" != "true" ]; then
            echo "CODEFIX_FAIL_CLOSED_NO_ACTIVE_OWNER"
            exit 0
          fi
          if [ "$FAILED_RUN_ID" != "$ACTIVE_RUN_ID" ]; then
            echo "CODEFIX_STALE_RUN_REJECTED failed=$FAILED_RUN_ID active=$ACTIVE_RUN_ID request=$ACTIVE_REQUEST_ID"
            exit 0
          fi
          echo "CODEFIX_ACTIVE_RUN_CONFIRMED:$ACTIVE_REQUEST_ID:$ACTIVE_RUN_ID"

      - name: Arm deterministic active Golden Path failure
        id: arm
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'TAYVORIQ-X Golden Path' &&
          github.event.workflow_run.conclusion != 'success' &&
          steps.active.outputs.found == 'true' &&
          github.event.workflow_run.id == fromJSON(steps.active.outputs.run_id)
        shell: bash
        env:
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          OWNER: ${{ steps.active.outputs.request_file }}
          ACTIVE_REQUEST_ID: ${{ steps.active.outputs.request_id }}
          GENERATION: ${{ steps.active.outputs.generation }}
        run: |
          set -euo pipefail
          run_id="$FAILED_RUN_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/codefix-run.json
          run_attempt=$(python - <<'PY'
          import json
          print(max(1,int(json.load(open('/tmp/codefix-run.json',encoding='utf-8')).get('run_attempt') or 1)))
          PY
          )
          gh run view "$run_id" --log-failed > /tmp/codefix-failed.log 2>&1 || true
          test -s /tmp/codefix-failed.log || { echo 'CODEFIX_ACTIVE_NO_FAILED_LOGS'; echo 'armed=false' >> "$GITHUB_OUTPUT"; exit 0; }

          python tools/tayvoriq_recovery_policy_v1.py \
            --logs-file /tmp/codefix-failed.log \
            --run-attempt "$run_attempt" \
            --recovery-generation "$GENERATION" \
            --max-generations 4 \
            --owner-found true \
            --owner-current true \
            --exact-request-retry true \
            --output-json /tmp/codefix-policy.json
          mode=$(python -c "import json; print(json.load(open('/tmp/codefix-policy.json')) .get('mode',''))")
          if [ "$mode" != "deterministic" ]; then
            echo "CODEFIX_ACTIVE_NOT_DETERMINISTIC:$mode"
            echo 'armed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf /tmp/codefix-diag; mkdir -p /tmp/codefix-diag
          artifact_name="tayvoriq-x-diagnostics-${run_id}-attempt-${run_attempt}"
          gh run download "$run_id" -n "$artifact_name" -D /tmp/codefix-diag >/dev/null 2>&1 || true
          manifest=$(find /tmp/codefix-diag -type f -name production-manifest.json -print -quit 2>/dev/null || true)
          readarray -t vals < <(python - "$manifest" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]) if len(sys.argv)>1 and sys.argv[1] else None
          d={}
          if p and p.is_file():
              try: d=json.loads(p.read_text(encoding='utf-8'))
              except Exception: pass
          print(str(d.get('control_plane_sha') or ''))
          print(str(d.get('implementation_sha') or ''))
          PY
          )
          failed_control_sha="${vals[0]:-}"
          failed_impl_sha="${vals[1]:-}"
          if [ -z "$failed_control_sha" ]; then
            failed_control_sha=$(python -c "import json; print(json.load(open('/tmp/codefix-run.json')).get('head_sha',''))")
          fi
          failure_signature=$(python -c "import json; print(json.load(open('/tmp/codefix-policy.json')).get('failure_signature',''))")
          failure_state=$(python -c "import json; print(json.load(open('/tmp/codefix-policy.json')).get('state','CODE_REPAIR_REQUIRED'))")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          armed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            git reset --hard origin/main
            result=$(python - "$ACTIVE_REQUEST_POINTER" "$OWNER" "$ACTIVE_REQUEST_ID" "$run_id" "$failure_signature" "$failure_state" "$failed_control_sha" "$failed_impl_sha" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          pointer_path=Path(sys.argv[1]); request_path=Path(sys.argv[2]); expected_id=sys.argv[3]; run_id=int(sys.argv[4])
          signature,state,failed_control,failed_impl=sys.argv[5:9]
          pointer=json.loads(pointer_path.read_text(encoding='utf-8'))
          data=json.loads(request_path.read_text(encoding='utf-8'))
          if pointer.get('state')!='ACTIVE' or str(pointer.get('request_id') or '')!=expected_id or int(pointer.get('golden_path_run_id') or 0)!=run_id:
              print('STALE_ACTIVE_OWNER'); raise SystemExit(0)
          if str(data.get('request_id') or '')!=expected_id or int(data.get('golden_path_run_id') or 0)!=run_id:
              print('STALE_REQUEST_OWNER'); raise SystemExit(0)
          existing=data.get('codefix_recovery') if isinstance(data.get('codefix_recovery'),dict) else {}
          if str(existing.get('status') or '') in {'ARMED','REPLAY_DISPATCHED'}:
              print('ALREADY_HANDLED'); raise SystemExit(0)
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z'); generation=max(0,int(data.get('recovery_generation') or 0))
          data['codefix_recovery']={
              'status':'ARMED','request_substate':'AWAITING_CODEFIX','failed_run_id':run_id,
              'failure_signature':signature,'failure_state':state,
              'failed_control_plane_sha':failed_control,'failed_implementation_sha':failed_impl,
              'recovery_generation':generation,'armed_at':now,
              'same_generation_replay_required':True,'exact_source_request_required':True,
              'quality_gates_weakened':False,'active_pointer_verified':True
          }
          data['state_history']=list(data.get('state_history') or [])+[{
              'state':'AWAITING_CODEFIX','at':now,'actor':'tayvoriq-deterministic-codefix-continuity',
              'meta':{'failed_run_id':run_id,'failure_signature':signature,'failure_state':state,
                      'failed_control_plane_sha':failed_control,'failed_implementation_sha':failed_impl,
                      'recovery_generation':generation,'reason':'active-owner-deterministic-failure',
                      'quality_gates_weakened':False,'active_pointer_verified':True}
          }]
          request_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'request_id':expected_id,'topic':str(data.get('topic') or ''),'generation':generation},ensure_ascii=False))
          PY
            )
            if [ "$result" = "STALE_ACTIVE_OWNER" ] || [ "$result" = "STALE_REQUEST_OWNER" ] || [ "$result" = "ALREADY_HANDLED" ]; then
              echo 'armed=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            git add -- "$OWNER"
            git commit -m "ops: arm active codefix ${ACTIVE_REQUEST_ID} run ${run_id}"
            if git push origin HEAD:main; then armed=true; break; fi
            sleep $((attempt * 2))
          done
          [ "$armed" = "true" ] || { echo 'CODEFIX_ACTIVE_ARM_PUSH_FAILED'; exit 1; }
          topic=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["topic"])' "$result")
          generation=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["generation"])' "$result")
          echo 'armed=true' >> "$GITHUB_OUTPUT"
          echo "topic=$topic" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"

      - name: Telegram active codefix armed
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '🧰 TAYVORIQ · Codefix-Recovery ist aktiv\n\nThema: %s\nFehlgeschlagener Run: %s\nRecovery: Generation %s\n\n✅ Ausschließlich der aktuell freigegebene Telegram-Auftrag wurde übernommen.\n✅ Auftrag, Trendfreigabe und geprüfte Quellen bleiben gebunden.\n✅ Historische Requests werden nicht automatisch reaktiviert.\n➡️ Derselbe Auftrag läuft nach einem verifizierten Production-Green-Codefix weiter.' \
            "${{ steps.arm.outputs.topic }}" "${{ steps.arm.outputs.run_id }}" "${{ steps.arm.outputs.generation }}")
          curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null

      - name: Reconcile only active orphan
        if: >-
          github.event_name != 'workflow_run' ||
          (github.event.workflow_run.name == 'TAYVORIQ Production Green Promoter' && github.event.workflow_run.conclusion == 'success')
        shell: bash
        env:
          TAYVORIQ_RECOVERY_TARGET_REQUEST_ID: ${{ steps.active.outputs.request_id }}
        run: |
          set -euo pipefail
          if [ "${{ steps.active.outputs.found }}" != "true" ]; then
            echo 'CODEFIX_RECONCILE_NO_ACTIVE_OWNER'; exit 0
          fi
          python -m py_compile tools/tayvoriq_codefix_orphan_reconcile_v1.py
          python tools/tayvoriq_codefix_orphan_reconcile_v1.py

      - name: Resolve active armed request
        id: pending
        if: >-
          github.event_name != 'workflow_run' ||
          (github.event.workflow_run.name == 'TAYVORIQ Production Green Promoter' && github.event.workflow_run.conclusion == 'success')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git reset --hard origin/main
          python - "$ACTIVE_REQUEST_POINTER" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          from pathlib import Path
          pp=Path(sys.argv[1]); outp=Path(sys.argv[2])
          out={'found':'false','request_file':'','request_id':'','topic':'','trend_id':'','run_id':'','generation':'0','failed_control_sha':'','failed_impl_sha':'','failure_signature':''}
          if pp.is_file():
              try: p=json.loads(pp.read_text(encoding='utf-8'))
              except Exception: p={}
              rid=str(p.get('request_id') or '').strip(); rp=Path('requests')/f'{rid}.json'
              if p.get('schema')=='tayvoriq-active-production-request-v1' and p.get('state')=='ACTIVE' and rid and rp.is_file():
                  try: d=json.loads(rp.read_text(encoding='utf-8'))
                  except Exception: d={}
                  c=d.get('codefix_recovery') if isinstance(d.get('codefix_recovery'),dict) else {}
                  try: prun=int(p.get('golden_path_run_id') or 0); rrun=int(d.get('golden_path_run_id') or 0); frun=int(c.get('failed_run_id') or 0)
                  except (TypeError,ValueError): prun=rrun=frun=0
                  if (
                      str(d.get('request_id') or '')==rid and str(d.get('status') or '')=='DISPATCHED'
                      and c.get('status')=='ARMED' and c.get('request_substate')=='AWAITING_CODEFIX'
                      and prun>0 and rrun==prun and frun==prun
                  ):
                      out.update({'found':'true','request_file':str(rp),'request_id':rid,'topic':str(d.get('topic') or ''),
                          'trend_id':str(d.get('trend_id') or ''),'run_id':str(prun),
                          'generation':str(max(0,int(d.get('recovery_generation') or 0))),
                          'failed_control_sha':str(c.get('failed_control_plane_sha') or ''),
                          'failed_impl_sha':str(c.get('failed_implementation_sha') or ''),
                          'failure_signature':str(c.get('failure_signature') or '')})
          with outp.open('a',encoding='utf-8') as h:
              for k,v in out.items(): h.write(f'{k}={v}\n')
          print(out)
          PY

      - name: Detect verified revision from Production Green
        id: revision
        if: steps.pending.outputs.found == 'true'
        shell: bash
        env:
          FAILED_CONTROL_SHA: ${{ steps.pending.outputs.failed_control_sha }}
          FAILED_IMPL_SHA: ${{ steps.pending.outputs.failed_impl_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          current_control=$(git rev-parse origin/main)
          current_impl=$(python - "$PRODUCTION_GREEN_POINTER" "$IMPLEMENTATION_REPO" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1]); expected_repo=sys.argv[2]
          if not path.is_file(): raise SystemExit('PRODUCTION_GREEN_POINTER_MISSING')
          data=json.loads(path.read_text(encoding='utf-8'))
          if data.get('schema')!='tayvoriq-production-green-v1': raise SystemExit('PRODUCTION_GREEN_POINTER_SCHEMA_INVALID')
          if str(data.get('implementation_repository') or '')!=expected_repo: raise SystemExit('PRODUCTION_GREEN_REPO_MISMATCH')
          sha=str(data.get('implementation_sha') or '').strip().lower()
          if len(sha)!=40 or any(c not in '0123456789abcdef' for c in sha): raise SystemExit('PRODUCTION_GREEN_SHA_INVALID')
          if data.get('full_preflight_passed') is not True: raise SystemExit('PRODUCTION_GREEN_PREFLIGHT_NOT_PASSED')
          if data.get('quality_gates_weakened') is not False: raise SystemExit('PRODUCTION_GREEN_QUALITY_GATE_INTEGRITY_FAILED')
          print(sha)
          PY
          )

          relevant_control=false
          if [[ "$FAILED_CONTROL_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]] && git cat-file -e "${FAILED_CONTROL_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "$FAILED_CONTROL_SHA"..origin/main > /tmp/codefix-control-files.txt || true
            if python - /tmp/codefix-control-files.txt <<'PY'
          import sys
          paths=[line.strip() for line in open(sys.argv[1],encoding='utf-8') if line.strip()]
          ignored={'.github/state/tayvoriq-production-green.json','.github/state/tayvoriq-active-production-request.json',
                   '.github/workflows/tayvoriq-deterministic-codefix-continuity.yml','tools/tayvoriq_codefix_orphan_reconcile_v1.py'}
          relevant=[]
          for path in paths:
              if path.startswith('.github/run-now/') or path.startswith('requests/') or path.startswith('state/') or path in ignored: continue
              if path.startswith('tools/tayvoriq_') or path.startswith('scripts/') or path.startswith('.github/workflows/tayvoriq-'): relevant.append(path)
          raise SystemExit(0 if relevant else 1)
          PY
            then relevant_control=true; fi
          fi

          implementation_changed=false
          if [[ "$FAILED_IMPL_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]] && [[ "$current_impl" =~ ^[0-9a-fA-F]{40}$ ]]; then
            if [[ "$current_impl" != "$FAILED_IMPL_SHA" && "$current_impl" != "$FAILED_IMPL_SHA"* ]]; then implementation_changed=true; fi
          fi
          detected=false; reason=''
          if [[ "$FAILED_IMPL_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            if [ "$implementation_changed" = "true" ]; then detected=true; reason='production-green-implementation-changed'; fi
          elif [ "$relevant_control" = "true" ]; then
            detected=true; reason='relevant-control-code-changed-without-implementation-pin'
          fi
          echo "detected=$detected" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "current_control_sha=$current_control" >> "$GITHUB_OUTPUT"
          echo "current_impl_sha=$current_impl" >> "$GITHUB_OUTPUT"
          echo "CODEFIX_REVISION_CHECK:$detected:$reason"

      - name: Replay exact active request after verified codefix
        id: replay
        if: steps.revision.outputs.detected == 'true'
        shell: bash
        env:
          OLD_RUN_ID: ${{ steps.pending.outputs.run_id }}
          REQUEST_FILE: ${{ steps.pending.outputs.request_file }}
          REQUEST_ID: ${{ steps.pending.outputs.request_id }}
          TOPIC: ${{ steps.pending.outputs.topic }}
          TREND_ID: ${{ steps.pending.outputs.trend_id }}
          GENERATION: ${{ steps.pending.outputs.generation }}
          FAILURE_SIGNATURE: ${{ steps.pending.outputs.failure_signature }}
          CURRENT_CONTROL_SHA: ${{ steps.revision.outputs.current_control_sha }}
          CURRENT_IMPL_SHA: ${{ steps.revision.outputs.current_impl_sha }}
          CODEFIX_REASON: ${{ steps.revision.outputs.reason }}
        run: |
          set -euo pipefail
          [[ "$OLD_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$GENERATION" =~ ^[0-9]+$ ]] || exit 1
          [ "$GENERATION" -le 4 ] || { echo 'CODEFIX_REPLAY_GENERATION_LIMIT_EXCEEDED'; exit 1; }
          [[ "$CURRENT_IMPL_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'CODEFIX_REPLAY_PRODUCTION_GREEN_SHA_INVALID'; exit 1; }

          # Re-check active owner immediately before dispatch to close race windows.
          python - "$ACTIVE_REQUEST_POINTER" "$REQUEST_ID" "$OLD_RUN_ID" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          if p.get('state')!='ACTIVE' or str(p.get('request_id') or '')!=sys.argv[2] or int(p.get('golden_path_run_id') or 0)!=int(sys.argv[3]):
              raise SystemExit('CODEFIX_REPLAY_ACTIVE_OWNER_CHANGED')
          PY

          before_ids=$(gh run list --workflow tayvoriq-deliver-video-now.yml --event workflow_dispatch --limit 50 --json databaseId --jq '.[].databaseId' | tr '\n' ' ')
          dispatch_epoch=$(date +%s)
          gh workflow run tayvoriq-deliver-video-now.yml --ref main -f "topic=$TOPIC" -f "trend_id=$TREND_ID" -f "source_request_id=$REQUEST_ID"
          new_run_id=''
          for poll in $(seq 1 30); do
            sleep 4
            gh run list --workflow tayvoriq-deliver-video-now.yml --event workflow_dispatch --limit 50 --json databaseId,createdAt > /tmp/codefix-replay-runs.json
            candidate=$(python - "$before_ids" "$dispatch_epoch" <<'PY'
          import json,sys
          from datetime import datetime
          before={int(v) for v in sys.argv[1].split() if v.isdigit()}; epoch=int(sys.argv[2]); found=[]
          for item in json.load(open('/tmp/codefix-replay-runs.json',encoding='utf-8')):
              try: rid=int(item.get('databaseId') or 0); created=datetime.fromisoformat(str(item.get('createdAt') or '').replace('Z','+00:00')).timestamp()
              except Exception: continue
              if rid and rid not in before and created>=epoch-5: found.append((created,rid))
          print(max(found)[1] if found else '')
          PY
            )
            if [[ "$candidate" =~ ^[0-9]+$ ]] && [ "$candidate" != "$OLD_RUN_ID" ]; then new_run_id="$candidate"; break; fi
          done
          [[ "$new_run_id" =~ ^[0-9]+$ ]] || { echo 'CODEFIX_REPLAY_DISPATCH_NOT_VERIFIED'; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rebound=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet; git reset --hard origin/main
            python - "$ACTIVE_REQUEST_POINTER" "$REQUEST_FILE" "$REQUEST_ID" "$OLD_RUN_ID" "$new_run_id" "$GENERATION" "$FAILURE_SIGNATURE" "$CURRENT_CONTROL_SHA" "$CURRENT_IMPL_SHA" "$CODEFIX_REASON" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          pp=Path(sys.argv[1]); rp=Path(sys.argv[2]); request_id=sys.argv[3]; old_run=int(sys.argv[4]); new_run=int(sys.argv[5]); generation=int(sys.argv[6])
          signature,control_sha,impl_sha,reason=sys.argv[7:11]
          pointer=json.loads(pp.read_text(encoding='utf-8')); data=json.loads(rp.read_text(encoding='utf-8'))
          codefix=data.get('codefix_recovery') if isinstance(data.get('codefix_recovery'),dict) else {}
          if pointer.get('state')!='ACTIVE' or str(pointer.get('request_id') or '')!=request_id or int(pointer.get('golden_path_run_id') or 0)!=old_run: raise SystemExit('CODEFIX_REPLAY_ACTIVE_OWNER_CHANGED')
          if str(data.get('request_id') or '')!=request_id or int(data.get('golden_path_run_id') or 0)!=old_run: raise SystemExit('CODEFIX_REPLAY_REQUEST_CHANGED')
          if codefix.get('status')!='ARMED' or codefix.get('request_substate')!='AWAITING_CODEFIX': raise SystemExit('CODEFIX_REPLAY_NOT_ARMED')
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          previous=list(data.get('previous_golden_path_run_ids') or [])
          if old_run not in previous: previous.append(old_run)
          data['previous_golden_path_run_ids']=previous[-20:]; data['golden_path_run_id']=new_run; data['status']='DISPATCHED'; data['recovery_generation']=generation
          data['retry_of_run_id']=old_run; data['replacement_reason']='SAME_GENERATION_CODEFIX_REPLAY'; data['recovery_owner']='tayvoriq-deterministic-codefix-continuity'
          data['recovery_failure_signature']=signature; data['recovery_dispatched_at']=now
          codefix.update({'status':'REPLAY_DISPATCHED','request_substate':'DISPATCHED','replay_run_id':new_run,'replayed_at':now,
                          'replay_control_plane_sha':control_sha,'replay_implementation_sha':impl_sha,'codefix_detection_reason':reason,
                          'quality_gates_weakened':False,'active_pointer_verified':True})
          data['codefix_recovery']=codefix
          data['state_history']=list(data.get('state_history') or [])+[{'state':'DISPATCHED','at':now,'actor':'tayvoriq-deterministic-codefix-continuity',
              'meta':{'retry_of_run_id':old_run,'golden_path_run_id':new_run,'recovery_generation':generation,'failure_signature':signature,
                      'reason':'same-generation-production-green-codefix-replay','codefix_detection_reason':reason,
                      'replay_control_plane_sha':control_sha,'replay_implementation_sha':impl_sha,'quality_gates_weakened':False,'active_pointer_verified':True}}]
          rp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pointer['golden_path_run_id']=new_run; pointer['updated_at']=now; pointer['reason']='same-generation-codefix-replay'
          pp.write_text(json.dumps(pointer,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            git add -- "$REQUEST_FILE" "$ACTIVE_REQUEST_POINTER"
            git commit -m "ops: replay active codefix ${REQUEST_ID} to ${new_run_id}"
            if git push origin HEAD:main; then rebound=true; break; fi
            sleep $((attempt*2))
          done
          [ "$rebound" = "true" ] || { echo 'CODEFIX_REPLAY_BIND_FAILED'; exit 1; }
          echo "new_run_id=$new_run_id" >> "$GITHUB_OUTPUT"
          echo "generation=$GENERATION" >> "$GITHUB_OUTPUT"

      - name: Telegram active codefix recovery resumed
        if: steps.replay.outputs.new_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '🔧 TAYVORIQ · Production-Green-Codefix erkannt – Recovery fortgesetzt\n\nThema: %s\nAlter Run: %s\nNeuer Run: %s\nRecovery: Generation %s\n\n✅ Exakt derselbe aktuell freigegebene Auftrag und dieselben Quellen bleiben gebunden.\n✅ Historische Requests wurden ausgeschlossen.\n➡️ Produktion und Qualitätsprüfungen laufen autonom weiter.' \
            "${{ steps.pending.outputs.topic }}" "${{ steps.pending.outputs.run_id }}" "${{ steps.replay.outputs.new_run_id }}" "${{ steps.replay.outputs.generation }}")
          curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null
