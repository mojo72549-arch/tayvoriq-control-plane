name: TAYVORIQ Narrator Voice Sample V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-narrator-voice-sample-v2.yml"
      - ".automation/tayvoriq-narrator-voice-sample-v2.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tayvoriq-narrator-voice-sample-v2
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  render-narrator-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Validate secrets
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            test -n "${!name:-}" || { echo "::error title=Missing secret::$name"; exit 2; }
          done

      - name: Checkout Chatterbox implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: fix/human-documentary-voice-v30
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: tayvoriq-narrator-v2-chatterbox-v3-py311

      - name: Install voice dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git libsndfile1 fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0"
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948"

      - name: Prepare same Chatterbox voice as reference
        run: |
          set -euo pipefail
          mkdir -p sample
          curl --fail --location --retry 3 \
            "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/voice-samples/30534698841/voice-sample.mp4" \
            --output sample/previous-sample.mp4
          ffmpeg -y -loglevel error -i sample/previous-sample.mp4 -vn -ac 1 -ar 24000 -c:a pcm_s16le sample/reference.wav
          test -s sample/reference.wav

      - name: Generate calmer documentary narrator take
        run: |
          set -euo pipefail
          cat > sample/text.txt <<'TEXT'
          Es gibt Momente, in denen eine einzige Entscheidung alles verändert. Nicht laut. Nicht plötzlich. Sondern genau in dem Augenblick, in dem wir erkennen, was wirklich zählt.
          TEXT
          export TAYVORIQ_CHATTERBOX_MAX_CHUNKS=1
          export TAYVORIQ_CHATTERBOX_MAX_CHARS=420
          export TAYVORIQ_CHATTERBOX_CPU_THREADS=4
          python implementation/tools/tayvoriq_chatterbox_worker.py \
            --text-file sample/text.txt \
            --output sample/raw.wav \
            --report sample/voice-report.json \
            --language de \
            --model-version v3 \
            --reference-audio sample/reference.wav \
            --exaggeration 0.42 \
            --cfg-weight 0.55 \
            --pause-ms 560
          python - <<'PY'
          import json
          r=json.load(open('sample/voice-report.json', encoding='utf-8'))
          assert r.get('passed') is True, r
          assert r.get('reference_audio_used') is True, r
          assert int(r.get('chunk_count') or 0) == 1, r
          print(json.dumps(r, ensure_ascii=False, indent=2))
          PY

      - name: Apply warm narrator mastering without pitch shift
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error -i sample/raw.wav \
            -af "highpass=f=55,lowpass=f=15000,bass=g=1.8:f=120:w=0.7,treble=g=-0.6:f=5000:w=0.5,acompressor=threshold=-22dB:ratio=1.5:attack=35:release=300,loudnorm=I=-16:TP=-1.5:LRA=11" \
            -c:a aac -b:a 192k sample/voice.m4a
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 sample/voice.m4a)
          ffmpeg -y -loglevel error \
            -f lavfi -i "color=c=0x0b0f18:s=1080x1920:r=30:d=${DURATION}" \
            -i sample/voice.m4a \
            -vf "drawbox=x=100:y=520:w=880:h=880:color=0x151d2c@0.92:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='TAYVORIQ':fontcolor=white:fontsize=82:x=(w-text_w)/2:y=680,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='ERZAEHLER-STIMMENTEST':fontcolor=0x9fd3ff:fontsize=42:x=(w-text_w)/2:y=820,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='ruhig  warm  dokumentarisch':fontcolor=white:fontsize=34:x=(w-text_w)/2:y=1030" \
            -map 0:v:0 -map 1:a:0 -c:v libx264 -pix_fmt yuv420p -preset medium -crf 20 \
            -c:a aac -b:a 192k -shortest -movflags +faststart sample/tayvoriq-narrator-sample-v2.mp4
          test -s sample/tayvoriq-narrator-sample-v2.mp4

      - name: Publish narrator sample page
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          SAMPLE_ID="${GITHUB_RUN_ID}"
          TARGET="pages-worktree/tayvoriq/voice-samples/${SAMPLE_ID}"
          mkdir -p "$TARGET"
          cp sample/tayvoriq-narrator-sample-v2.mp4 "$TARGET/voice-sample.mp4"
          cp sample/voice-report.json "$TARGET/voice-report.json"
          cat > "$TARGET/index.html" <<HTML
          <!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAYVORIQ Erzähler-Stimmtest</title><style>body{margin:0;background:#080b12;color:#fff;font-family:system-ui,sans-serif}main{max-width:560px;margin:auto;padding:20px}video{width:100%;max-height:82vh;background:#000;border-radius:18px}.box{margin-top:14px;padding:14px;background:#131a28;border:1px solid #2c3b55;border-radius:14px;line-height:1.5}a{color:#9fd3ff}</style></head><body><main><h1>🎙️ Erzähler-Stimmtest V2</h1><video controls playsinline autoplay src="voice-sample.mp4"></video><div class="box"><strong>Chatterbox V3 – ruhiger Erzähler.</strong><br>Gleiche Grundstimme, langsamer und wärmer inszeniert, ohne Pitch-Shifting.</div><p><a href="voice-sample.mp4">Video direkt öffnen</a></p></main></body></html>
          HTML
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tayvoriq/voice-samples/${SAMPLE_ID}" .nojekyll
          git commit -m "Publish TAYVORIQ narrator voice sample ${SAMPLE_ID}"
          git push origin main

      - name: Wait for sample page
        run: |
          set -euo pipefail
          URL="https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/voice-samples/${GITHUB_RUN_ID}/"
          for attempt in $(seq 1 30); do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$URL" || true)
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1

      - name: Send narrator sample to Telegram
        run: |
          set -euo pipefail
          URL="https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/voice-samples/${GITHUB_RUN_ID}/"
          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode $'text=🎙️ Neuer Chatterbox-Erzähler-Stimmtest ist bereit\n\nRuhiger, wärmer und dokumentarischer. Nur wenige Sekunden zum Gegenhören.' \
            --data-urlencode "reply_markup={\"inline_keyboard\":[[{\"text\":\"▶️ Erzähler-Stimme anhören\",\"url\":\"${URL}\"}]]}"

      - name: Upload narrator sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-narrator-voice-sample-${{ github.run_id }}
          path: sample/**
          if-no-files-found: warn
          retention-days: 14
