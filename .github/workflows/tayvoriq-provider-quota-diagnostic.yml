name: TAYVORIQ Provider Quota Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run-now/tayvoriq-provider-quota-diagnostic.json
permissions:
  contents: write
concurrency:
  group: tayvoriq-provider-quota-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect one bounded provider response for the current owner request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAYVORIQ_TREND_MODEL: gemini-3.6-flash
        run: python tools/tayvoriq_provider_quota_diagnostic.py --request .github/run-now/tayvoriq-provider-quota-diagnostic.json --output /tmp/tayvoriq-provider-quota-diagnostic.json
      - name: Preserve only the allowlisted provider diagnosis
        run: |
          set -euo pipefail
          cp /tmp/tayvoriq-provider-quota-diagnostic.json state/tayvoriq-provider-quota-diagnostic.json
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add state/tayvoriq-provider-quota-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record bounded provider quota diagnosis"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
