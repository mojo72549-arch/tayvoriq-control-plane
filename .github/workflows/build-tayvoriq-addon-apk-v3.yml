name: Build TAYVORIQ Add-on APK v3

on:
  push:
    branches:
      - minecraft-addon-ui-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore neon UI source
        run: |
          cat android-test-app/app/src/main/java/com/tayvoriq/addonmanager/source-parts/*.b64 | base64 -d > /tmp/MainActivity.java.gz
          gzip -t /tmp/MainActivity.java.gz
          gzip -dc /tmp/MainActivity.java.gz > android-test-app/app/src/main/java/com/tayvoriq/addonmanager/MainActivity.java
          test -s android-test-app/app/src/main/java/com/tayvoriq/addonmanager/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compile neon UI test APK
        working-directory: android-test-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify signature and package
        run: |
          APK="android-test-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p delivery
          cp "$APK" delivery/TAYVORIQ_Addon_Manager_Neon_Test_v1.3.apk
          sha256sum delivery/TAYVORIQ_Addon_Manager_Neon_Test_v1.3.apk | tee delivery/SHA256SUMS.txt
          ls -lh delivery

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAYVORIQ-Addon-Manager-Neon-Test-v1.3
          path: delivery/*
          if-no-files-found: error
          retention-days: 7
