name: TAYVORIQ Growth Fallback E2E

on:
  push:
    branches:
      - fix/growth-fallback-overcomplete-pool
    paths:
      - "config/tayvoriq_growth_runtime_v2.json"
      - "tools/tayvoriq_agent_hf_v2.py"
      - "tools/tayvoriq_agent_research_resilience_v2.py"
      - "tools/tayvoriq_agent_trend_radar_v5.py"
      - "tools/tayvoriq_agent_series_request_v2.py"
      - ".github/workflows/tayvoriq-agent-orchestrator-v2.yml"
      - ".github/workflows/tayvoriq-growth-fallback-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tayvoriq-growth-fallback-e2e
  cancel-in-progress: true

jobs:
  fallback-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: intentionally-invalid-force-fallback
      GROQ_API_KEY: ""
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      TAYVORIQ_GDELT_BUDGET_SECONDS: "5"
      TAYVORIQ_GDELT_TIMEOUT_SECONDS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/growth-fallback-overcomplete-pool

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile fallback entrypoints
        run: |
          python -m py_compile \
            tools/tayvoriq_agent_hf_v2.py \
            tools/tayvoriq_agent_research_resilience_v2.py \
            tools/tayvoriq_agent_trend_radar_v5.py \
            tools/tayvoriq_agent_series_request_v2.py

      - name: Force fallback and accept quality-driven 1-5 selection
        run: |
          set -euo pipefail
          python tools/tayvoriq_agent_series_request_v2.py \
            --slot evening \
            --output /tmp/request.json \
            --audit-output /tmp/audit.json
          python - <<'PY'
          import json
          request=json.load(open('/tmp/request.json',encoding='utf-8'))
          audit=json.load(open('/tmp/audit.json',encoding='utf-8'))
          trends=request.get('trends') or []
          assert 1 <= len(trends) <= 5, len(trends)
          assert [t.get('id') for t in trends] == [str(i) for i in range(1, len(trends)+1)]
          assert all(int((t.get('growth_v2') or {}).get('growth_score') or 0) >= 80 for t in trends)
          assert all(len(t.get('sources') or []) >= 2 for t in trends)
          assert all(int((t.get('source_context') or {}).get('independent_news_count') or 0) >= 2 for t in trends)
          assert audit.get('quality_gates_weakened') is False
          assert audit.get('candidate_count_policy') == 'quality_driven_1_to_5'
          assert 1 <= int(audit.get('grounded_scan_count') or 0) <= 2
          print(json.dumps({
              'selection_id': request.get('selection_id'),
              'trend_count': len(trends),
              'growth_scores': [int((t.get('growth_v2') or {}).get('growth_score') or 0) for t in trends],
              'provider': audit.get('provider'),
              'grounded_scan_count': audit.get('grounded_scan_count'),
              'growth_rescan_used': audit.get('growth_rescan_used'),
              'candidate_count_policy': audit.get('candidate_count_policy'),
          }, ensure_ascii=False))
          PY
