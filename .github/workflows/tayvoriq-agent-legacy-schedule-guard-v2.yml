name: TAYVORIQ Agent Legacy Schedule Guard V2

on:
  workflow_run:
    workflows: ["TAYVORIQ Daily Orchestrator"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: tayvoriq-agent-legacy-schedule-guard-v2
  cancel-in-progress: false

jobs:
  guard:
    if: github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Cancel only unbound legacy-scheduled Golden Path child
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_CREATED: ${{ github.event.workflow_run.created_at }}
          LEGACY_UPDATED: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/bound-runs.txt
          import json
          from pathlib import Path
          ids=[]
          for p in Path('requests').glob('*.json'):
              try: d=json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              rid=str(d.get('golden_path_run_id') or '')
              if rid.isdigit(): ids.append(rid)
          print('\n'.join(ids))
          PY
          local_date=$(TZ=Europe/Berlin date +%F)
          if [[ "$local_date" < "2026-08-15" ]]; then
            echo "V2 activation not reached."
            exit 0
          fi
          gh run list --workflow tayvoriq-deliver-video-now.yml --event workflow_dispatch --limit 10 --json databaseId,createdAt,status > /tmp/runs.json
          python - <<'PY' >/tmp/candidates.txt
          import json, os
          from datetime import datetime, timedelta
          bound=set(open('/tmp/bound-runs.txt',encoding='utf-8').read().split())
          created=datetime.fromisoformat(os.environ['LEGACY_CREATED'].replace('Z','+00:00'))
          updated=datetime.fromisoformat(os.environ['LEGACY_UPDATED'].replace('Z','+00:00')) + timedelta(minutes=2)
          runs=json.load(open('/tmp/runs.json',encoding='utf-8'))
          for r in runs:
              rid=str(r.get('databaseId') or '')
              try: stamp=datetime.fromisoformat(str(r.get('createdAt')).replace('Z','+00:00'))
              except Exception: continue
              if created <= stamp <= updated and rid not in bound and r.get('status') in {'queued','in_progress','waiting','pending'}:
                  print(rid)
          PY
          while read -r run; do
            [ -n "$run" ] || continue
            echo "Canceling legacy scheduled unbound Golden Path run $run"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/cancel" >/dev/null || true
          done < /tmp/candidates.txt
