name: TAYVORIQ Voice Checkpoint Repair NOW

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/run-now/tayvoriq-voice-checkpoint-repair.json'

concurrency:
  group: tayvoriq-voice-checkpoint-repair
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: '1'
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
  TAYVORIQ_RENDER_SIZE: 1080x1920
  TAYVORIQ_TTS_PROVIDER: chatterbox_v3
  TAYVORIQ_CHATTERBOX_ENABLED: 'true'
  TAYVORIQ_CHATTERBOX_REQUIRED: 'true'
  TAYVORIQ_CHATTERBOX_MODEL_VERSION: v3
  TAYVORIQ_CHATTERBOX_LANGUAGE: de
  TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: '300'
  TAYVORIQ_CHATTERBOX_MAX_CHUNKS: '2'
  TAYVORIQ_CHATTERBOX_MAX_CHARS: '520'
  TAYVORIQ_CHATTERBOX_CPU_THREADS: '4'
  TAYVORIQ_CHATTERBOX_EXAGGERATION: '0.42'
  TAYVORIQ_CHATTERBOX_CFG_WEIGHT: '0.36'
  TAYVORIQ_CHATTERBOX_PAUSE_MS: '360'
  TAYVORIQ_NATURAL_VOICE_WPM: '132'
  TAYVORIQ_NARRATOR_PITCH_FACTOR: '0.90'
  TAYVORIQ_NARRATOR_TONE_REQUIRED: 'true'
  TAYVORIQ_V3_SEGMENT_RETRIES: '3'
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  repair-voice-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Install voice checkpoint dependencies
        run: |
          set -euo pipefail
          missing=()
          for command in ffmpeg ffprobe unzip rsync; do
            command -v "$command" >/dev/null || missing+=("$command")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg unzip rsync
          fi
          python -m pip install --upgrade pip -q
          python -m pip install requests pillow -q
          python -m pip install -r implementation/requirements.txt pytest -q
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0" -q
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948" -q

      - name: Validate permanent voice robustness guards
        id: robustness_guard
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/tayvoriq_voice_only_repair_v3.py \
            tools/tayvoriq_voice_only_repair_v4.py \
            tools/tayvoriq_voice_only_repair_v5.py \
            tools/tayvoriq_voice_only_repair_v3_retry.py \
            tools/tayvoriq_tts_router_v28.py \
            tools/tayvoriq_preapproval_ai_audit_v4.py \
            tools/tayvoriq_preapproval_ai_audit_v5.py
          python -m pytest -q \
            tests/test_tayvoriq_voice_checkpoint_v3.py \
            tests/test_tayvoriq_voice_v4_postmux.py \
            tests/test_tayvoriq_voice_v5_human_narrator.py \
            tests/test_tayvoriq_preapproval_audio_quorum_v5.py
          python - <<'PY'
          from pathlib import Path
          import tools.tayvoriq_voice_only_repair_v3_retry as retry
          import tools.tayvoriq_voice_only_repair_v4 as v4
          import tools.tayvoriq_voice_only_repair_v5 as v5
          import tools.tayvoriq_preapproval_ai_audit_v4 as audit_v4
          import tools.tayvoriq_preapproval_ai_audit_v5 as audit_v5

          assert retry._retry_count() == 3
          wrapper_source = Path(retry.__file__).read_text(encoding='utf-8')
          assert 'raise SystemExit(v4.main())' in wrapper_source
          assert v4.POSTMUX_MIN_SIMILARITY == 0.95
          assert v4.SHARED_PREFIX_MAX_SPEEDUP == 1.01
          assert v4.SHARED_PREFIX_REPAIR_ATTEMPTS == 2
          assert v5.FULL_TAKE_ATTEMPTS == 2
          assert v5.NATURAL_WPM_MIN >= 108.0
          assert v5.NATURAL_WPM_MAX <= 150.0
          assert audit_v5.AUDIT_QUORUM_MIN_SIMILARITY == 0.95
          assert audit_v5.AUDIT_QUORUM_REQUIRED_PASSES == 2
          assert audit_v5.AUDIT_QUORUM_TOTAL_VOTES == 3

          human_script = (
              'Sandisk und Western Digital fielen trotz starker Zahlen deutlich. '
              'Die Aktien fielen, weil hohe KI-Erwartungen starke Zahlen überschatteten. '
              'Betroffen sind Anleger und Unternehmen im KI- und Chipsektor. '
              'Für dich zeigt das, wie schnell KI-Hype Aktienkurse verzerren kann. '
              'Abonniere TAYVORIQ für verifizierte Einordnung und konkrete Schritte.'
          )
          spoken, replacement = v5._natural_spoken_contract(human_script, 'youtube_shorts')
          assert 'KI-Erwartungen' in spoken and 'KI-Hype' in spoken and 'Chipsektor' in spoken
          assert all(token not in spoken for token in ('K I', 'Ka I', 'Chip Sektor', 'Tai wo rik'))
          assert 'Abonniere den Kanal' in spoken and replacement == 'den Kanal'

          timing = v4._duration_fit_plan(29.62, 29.58)
          assert timing['required'] is True
          assert 1.0 < timing['speed_factor'] <= 1.01
          try:
              v4._duration_fit_plan(30.50, 29.58)
          except RuntimeError as exc:
              assert 'VOICE_V4_SHARED_PREFIX_DURATION_EXCEEDED' in str(exc)
          else:
              raise AssertionError('material speed change must remain blocked')

          candidates = retry._ordered_candidates('Sandisk und Western Digital fallen deutlich.', 'intro')
          assert candidates[0]['label'] == 'sandisk:San Disk'

          expected = 'San Disk und Western Digital fielen trotz starker Zahlen deutlich.'
          exact_joined = retry.v3._segment_validation(
              'SanDisk und Western Digital fielen trotz starker Zahlen deutlich.', expected, 'intro'
          )
          assert exact_joined['passed'] is True
          assert exact_joined['similarity'] >= 0.90
          assert exact_joined['missing_critical_terms'] == []

          wrong = retry.v3._segment_validation(
              'Sundisk und Western Digital fielen trotz starker Zahlen deutlich.', expected, 'intro'
          )
          assert wrong['passed'] is False
          assert 'Sandisk=>San Disk' in wrong['missing_critical_terms']

          provider_budget = retry.v3._provider_aware_segment_budget(4.79, 34.65)
          assert provider_budget == retry.v3.CHATTERBOX_SEGMENT_MIN_WINDOW_SECONDS == 5.25
          assert retry.v3._provider_aware_segment_budget(4.79, 5.00) == 5.00

          cta = retry.v3._segment_synthesis_candidates(
              'Abonniere TAYVORIQ für verifizierte Einordnung und konkrete Schritte.', 'cta'
          )
          assert [item['label'] for item in cta[:3]] == [
              'brand:Tayvorik', 'brand:Taiworik', 'brand:Teyworik'
          ]
          assert cta[-1]['label'] == 'cta:brand-safe:abonniere'
          assert cta[-1]['text'] == 'Abonniere den Kanal für verifizierte Einordnung und konkrete Schritte.'
          assert cta[-1]['tayvoriq_spoken_replacement'] == 'den Kanal'
          assert cta[-1]['brand_spoken_fallback'] is True

          assert audit_v4._safe_speech_contract_normalize('Sandisk KI Chipsektor') == 'San Disk KI Chip Sektor'
          assert audit_v4._safe_speech_contract_normalize('Sundisk Chantandy') == 'Sundisk Chantandy'

          workflow_source = Path('../.github/workflows/tayvoriq-voice-checkpoint-repair-now.yml').read_text(encoding='utf-8')
          fragile_locator = "JOB_DIR=$(find out/tayvoriq-youtube-tiktok/candidate-01 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          robust_locator = "JOB_DIR=$(find out/tayvoriq-youtube-tiktok/candidate-01 -mindepth 2 -maxdepth 2 -type f -name job.json -printf '%h\\n' | sort | tail -1)"
          assert fragile_locator not in workflow_source
          assert workflow_source.count(robust_locator) == 2

          print('VOICE_V4_STANDARD_AND_V5_HUMAN_NARRATOR_GUARDS_VALIDATED')
          PY

      - name: Restore preserved master from failed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_ARTIFACT_ID=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.github/run-now/tayvoriq-voice-checkpoint-repair.json').read_text(encoding='utf-8'))
          artifact_id = str(data.get('source_artifact_id') or '').strip()
          if not artifact_id.isdigit():
              raise SystemExit('Invalid source_artifact_id in checkpoint request')
          print(artifact_id)
          PY
          )
          SOURCE_RUN_ID=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.github/run-now/tayvoriq-voice-checkpoint-repair.json').read_text(encoding='utf-8'))
          print(str(data.get('source_run_id') or '').strip())
          PY
          )
          echo "Restoring preserved master: run=${SOURCE_RUN_ID} artifact=${SOURCE_ARTIFACT_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/tayvoriq-preserved.zip
          unzip -q /tmp/tayvoriq-preserved.zip -d implementation
          test -d implementation/out/tayvoriq-youtube-tiktok
          echo "PRESERVED_MASTER_RESTORED"

      - name: Repair or reuse VOICE checkpoint
        id: voice_repair
        working-directory: implementation
        run: |
          set -euo pipefail
          test -d out/tayvoriq-youtube-tiktok/candidate-01
          REPAIR_STAGE=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('../.github/run-now/tayvoriq-voice-checkpoint-repair.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          print(str(data.get('repair_stage') or 'VOICE_POSTMUX').strip().upper())
          PY
          )
          if [ "$REPAIR_STAGE" = "FINAL_PREAPPROVAL_AUDIT" ]; then
            JOB_DIR=$(find out/tayvoriq-youtube-tiktok/candidate-01 -mindepth 2 -maxdepth 2 -type f -name job.json -printf '%h\n' | sort | tail -1)
            test -n "$JOB_DIR" && test -f "$JOB_DIR/job.json"
            echo "job_dir=$JOB_DIR" >> "$GITHUB_OUTPUT"
            echo "VOICE_ALREADY_PASSED_REUSED"
            exit 0
          fi
          if [ "$REPAIR_STAGE" = "VOICE_HUMAN_NARRATOR" ]; then
            export TAYVORIQ_NARRATOR_PITCH_FACTOR='1.0'
            export TAYVORIQ_NARRATOR_TONE_REQUIRED='false'
            export TAYVORIQ_CHATTERBOX_LANGUAGE='de'
            export TAYVORIQ_CHATTERBOX_MAX_CHUNKS='1'
            export TAYVORIQ_CHATTERBOX_MAX_CHARS='520'
            echo "HUMAN_NARRATOR_V5: continuous natural German Chatterbox take; no artificial pitch shift"
            python tools/tayvoriq_voice_only_repair_v5.py \
              --outdir out/tayvoriq-youtube-tiktok/candidate-01 \
              2>&1 | tee out/voice-checkpoint-repair.log
          else
            python tools/tayvoriq_voice_only_repair_v3_retry.py \
              --outdir out/tayvoriq-youtube-tiktok/candidate-01 \
              2>&1 | tee out/voice-checkpoint-repair.log
          fi
          JOB_DIR=$(find out/tayvoriq-youtube-tiktok/candidate-01 -mindepth 2 -maxdepth 2 -type f -name job.json -printf '%h\n' | sort | tail -1)
          test -n "$JOB_DIR" && test -f "$JOB_DIR/job.json"
          echo "job_dir=$JOB_DIR" >> "$GITHUB_OUTPUT"
          echo "VOICE_CHECKPOINT_REPAIRED stage=$REPAIR_STAGE"

      - name: Final preapproval audit
        id: final_audit
        working-directory: implementation
        run: |
          set -euo pipefail
          rm -f "${{ steps.voice_repair.outputs.job_dir }}/preapproval_ai_audit.json"
          python tools/tayvoriq_preapproval_ai_audit_v5.py --job-dir "${{ steps.voice_repair.outputs.job_dir }}"

      - name: Final publication quality gate
        id: publication_gate
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_publication_quality_gate_v2.py \
            --job-dir "${{ steps.voice_repair.outputs.job_dir }}" \
            --targets youtube_tiktok

      - name: Build repaired review page
        id: review_build
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_build_dual_review_site.py \
            --job-dir "${{ steps.voice_repair.outputs.job_dir }}" \
            --site-root site/tayvoriq \
            --run-id "${GITHUB_RUN_ID}"

      - name: Publish repaired review page
        id: publish_review
        run: |
          set -euo pipefail
          rm -rf pages-worktree/tayvoriq
          mkdir -p pages-worktree/tayvoriq
          rsync -a implementation/site/tayvoriq/ pages-worktree/tayvoriq/
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish repaired TAYVORIQ review ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Send Telegram approval review
        id: telegram_review
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "" \
            --dashboard-url "" \
            --review-id "${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"

      - name: Upload repaired checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-voice-checkpoint-${{ github.run_id }}
          path: |
            implementation/out/**
            implementation/site/tayvoriq/**
          retention-days: 30
          compression-level: 1

      - name: Telegram checkpoint failure
        if: failure()
        env:
          GUARD_OUTCOME: ${{ steps.robustness_guard.outcome }}
          VOICE_OUTCOME: ${{ steps.voice_repair.outcome }}
          AUDIT_OUTCOME: ${{ steps.final_audit.outcome }}
          QUALITY_OUTCOME: ${{ steps.publication_gate.outcome }}
          REVIEW_BUILD_OUTCOME: ${{ steps.review_build.outcome }}
          REVIEW_PUBLISH_OUTCOME: ${{ steps.publish_review.outcome }}
          TELEGRAM_REVIEW_OUTCOME: ${{ steps.telegram_review.outcome }}
        run: |
          set +e
          requested_stage=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              data = json.loads(Path('.github/run-now/tayvoriq-voice-checkpoint-repair.json').read_text(encoding='utf-8'))
          except Exception:
              data = {}
          print(str(data.get('repair_stage') or '').strip().upper())
          PY
          )
          stage="UNKNOWN"
          detail="Checkpoint nicht freigabefähig."
          if [ "$GUARD_OUTCOME" != "success" ]; then
            stage="ROBUSTNESS_GUARD"
            detail="Die internen Robustheits-/Regressionstests haben vor VOICE gestoppt; Audio wurde nicht neu verarbeitet."
          elif [ "$VOICE_OUTCOME" != "success" ]; then
            if [ "$requested_stage" = "VOICE_HUMAN_NARRATOR" ]; then
              stage="VOICE_HUMAN_NARRATOR"
              detail="Der neue natürliche deutsche Erzähler-Take hat die strenge Sprach-/Post-Mux-Prüfung noch nicht bestanden."
            else
              stage="VOICE_POSTMUX"
              detail="Die unabhängige Sprach-/Post-Mux-Prüfung ist noch nicht sauber."
            fi
          elif [ "$AUDIT_OUTCOME" != "success" ]; then
            stage="FINAL_PREAPPROVAL_AUDIT"
            detail="VOICE ist bestanden; der unabhängige Final-Audit blockiert noch."
          elif [ "$QUALITY_OUTCOME" != "success" ]; then
            stage="PUBLICATION_QUALITY_GATE"
            detail="VOICE und Final-Audit sind bestanden; das Veröffentlichungs-Gate blockiert noch."
          elif [ "$REVIEW_BUILD_OUTCOME" != "success" ]; then
            stage="REVIEW_BUILD"
            detail="Alle Qualitäts-Gates sind bestanden; die Review-Seite konnte nicht gebaut werden."
          elif [ "$REVIEW_PUBLISH_OUTCOME" != "success" ]; then
            stage="REVIEW_PUBLISH"
            detail="Alle Qualitäts-Gates sind bestanden; die Review-Seite konnte nicht veröffentlicht werden."
          elif [ "$TELEGRAM_REVIEW_OUTCOME" != "success" ]; then
            stage="TELEGRAM_REVIEW_DELIVERY"
            detail="Alle Qualitäts-Gates sind bestanden; nur die Telegram-Auslieferung ist fehlgeschlagen."
          fi
          message=$(printf '❌ TAYVORIQ Checkpoint noch nicht freigabefähig\n\nRun: %s\nStufe: %s\n%s\n\nMaster bleibt erhalten. Trend, Quellen, Skript und Visuals wurden nicht neu erzeugt. Nichts veröffentlicht.' "$GITHUB_RUN_ID" "$stage" "$detail")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" >/dev/null