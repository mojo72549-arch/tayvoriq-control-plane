name: TAYVORIQ Delivery Watch Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tayvoriq-delivery-watch.yml"
      - ".github/workflows/tayvoriq-delivery-watch-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-delivery-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate request-bound recovery contract
        run: |
          set -euo pipefail
          python -m pip install pyyaml -q
          python - <<'PY'
          from pathlib import Path
          import yaml

          path=Path('.github/workflows/tayvoriq-delivery-watch.yml')
          text=path.read_text(encoding='utf-8')
          doc=yaml.load(text, Loader=yaml.BaseLoader)
          assert isinstance(doc, dict), 'delivery watch must parse as a YAML mapping'
          assert 'jobs' in doc, 'delivery watch jobs missing'
          assert 'workflow_run' in doc.get('on', {}), 'workflow_run trigger missing'
          assert 'newer-golden-path-' not in text, 'global unrelated-run supersession guard must stay removed'
          assert '.github/run-now/tayvoriq-x-request.json' not in text, 'fresh recovery must not use stale global X request'
          assert 'golden_path_run_id' in text, 'recovery must resolve exact durable request owner'
          assert 'for poll in $(seq 1 20)' in text, 'canonical watch must wait for exact owner binding'
          assert "data['status']='DISPATCHED'" in text, 'verified replacement run must remain bound'
          assert "data['replacement_reason']='BOUNDED_REQUEST_RECOVERY'" in text, 'bounded recovery marker missing'
          assert 'tayvoriq_recovery_policy_v1.py' in text, 'shared recovery policy missing'
          print('TAYVORIQ request-bound delivery-watch smoke: PASS')
          PY
