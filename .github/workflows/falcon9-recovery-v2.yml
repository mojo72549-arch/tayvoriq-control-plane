name: TAYVORIQ Falcon-9 Recovery V2

on:
  push:
    paths:
      - .github/workflows/falcon9-recovery-v2.yml
      - bootstrap/sitecustomize.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tayvoriq-falcon9-recovery-v2
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/bootstrap:${{ github.workspace }}/implementation/tools:${{ github.workspace }}/implementation
  TAYVORIQ_CLOUD_MODE: "true"
  TAYVORIQ_RENDER_SIZE: "1080x1920"
  TAYVORIQ_AUDIO_END_PADDING_SECONDS: "1.25"
  TAYVORIQ_TTS_PROVIDER: "auto"
  TAYVORIQ_CHATTERBOX_ENABLED: "true"
  TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
  TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
  TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "300"
  TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
  TAYVORIQ_CHATTERBOX_EXAGGERATION: "0.46"
  TAYVORIQ_CHATTERBOX_CFG_WEIGHT: "0.34"
  TAYVORIQ_CHATTERBOX_PAUSE_MS: "220"
  TAYVORIQ_CONTROLLER_TIMEOUT_SECONDS: "1200"
  TAYVORIQ_TELEGRAM_PROGRESS: "false"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  recover-render-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Checkout corrected implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Install production dependencies and Chatterbox V3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg rsync git
          python -m pip install --upgrade pip
          python -m pip install -r implementation/requirements.txt pytest
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0"
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948"

      - name: Verify Falcon-9 editorial and voice routes
        working-directory: implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          import inspect
          import sitecustomize
          import tayvoriq_dual_platform_render_v16 as v16
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          topic = "Falcon-9-Weltraumschrott trifft den Mond: Was genau passieren sollte und warum Forschende den Einschlag beobachten wollten"
          package = v16._verified_eu_ai_act_fallback(topic)
          assert package is not None, "Falcon-9 fallback route was not installed"
          issues, normalized = v16.v11.validate_rewrite_v11(package, 35, "youtube_tiktok")
          assert not issues, issues
          signature = inspect.signature(ChatterboxMultilingualTTS.from_pretrained)
          assert "t3_model" in signature.parameters, signature
          print({"falcon9_route": "passed", "body_words": normalized.get("editorial_body_words"), "voice": "chatterbox_multilingual_v3"})
          PY

      - name: Render Falcon-9 video
        working-directory: implementation
        run: |
          set -euo pipefail
          mkdir -p out/tayvoriq-self-heal
          python tools/tayvoriq_autonomous_entrypoint.py \
            --trend-mode manual_topic \
            --trend-scope science_future \
            --topic "Falcon-9-Weltraumschrott trifft den Mond: Was genau passieren sollte und warum Forschende den Einschlag beobachten wollten" \
            --language Deutsch \
            --platform youtube_tiktok \
            --target-duration 35 \
            --llm-provider auto \
            --outdir out/tayvoriq-youtube-tiktok \
            --site-root site/tayvoriq \
            --run-id "${GITHUB_RUN_ID}" \
            --state-out out/tayvoriq-review-state.json \
            --report-out out/tayvoriq-self-heal/report.json \
            --request-out out/tayvoriq-self-heal/request.json \
            --self-heal-depth 0 \
            --target-branch feature/multi-platform-distribution-package
          python -c 'import json; from pathlib import Path; r=json.loads(Path("out/tayvoriq-self-heal/report.json").read_text(encoding="utf-8")); assert r.get("state")=="SUCCESS", r'

      - name: Validate publication package
        working-directory: implementation
        run: |
          set -euo pipefail
          JOB_DIR=$(python -c 'import json; from pathlib import Path; s=json.loads(Path("out/tayvoriq-review-state.json").read_text(encoding="utf-8")); print(s.get("job_dir") or "")')
          test -n "$JOB_DIR"
          test -d "$JOB_DIR"
          python tools/tayvoriq_publication_quality_gate_v2.py --job-dir "$JOB_DIR" --targets youtube_tiktok

      - name: Publish review page
        run: |
          set -euo pipefail
          test -d implementation/site/tayvoriq
          rm -rf pages-worktree/tayvoriq
          mkdir -p pages-worktree/tayvoriq
          rsync -a implementation/site/tayvoriq/ pages-worktree/tayvoriq/
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish TAYVORIQ Falcon-9 review ${GITHUB_RUN_ID}"
            git push origin main
          fi

      - name: Send Telegram review
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --review-id "${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falcon9-recovery-v2-${{ github.run_id }}
          path: |
            implementation/out/tayvoriq-self-heal
            implementation/out/tayvoriq-review-state.json
            implementation/out/tayvoriq-youtube-tiktok
          if-no-files-found: warn
          retention-days: 7
