name: WAN Blitz Open Source Lab

on:
  push:
    branches:
      - 'lab/wan-blitz-open-source'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-blitz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'lab/wan-blitz-open-source'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install open-source clients and TTS
        run: |
          pip install -U gradio_client huggingface_hub piper-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate two continuous LTX 2.5 sequences
        run: |
          mkdir -p lab/output lab/work
          python - <<'PY'
          import json, shutil, subprocess, time
          from pathlib import Path
          from gradio_client import Client, handle_file

          WORK = Path('lab/work')
          client = Client('RioShiina/LTX-2.5', verbose=False)
          seed = 614273
          negative = 'cartoon, anime, game render, low quality, inconsistent identity, inconsistent clothing, duplicate people, extra limbs, deformed hands, blurry, jittery, distorted, text, subtitles, watermark, logo, still image'

          def extract_task_id(obj):
              if isinstance(obj, str):
                  try:
                      obj = json.loads(obj)
                  except Exception:
                      return obj if obj.strip() else None
              if isinstance(obj, dict):
                  for key in ('task_id','id','taskId'):
                      if obj.get(key): return str(obj[key])
                  for value in obj.values():
                      found = extract_task_id(value)
                      if found: return found
              if isinstance(obj, (list, tuple)):
                  for value in obj:
                      found = extract_task_id(value)
                      if found: return found
              return None

          def poll(task_id, timeout=900):
              start = time.time()
              while time.time() - start < timeout:
                  status = client.predict(task_id, api_name='/get_task_status')
                  if isinstance(status, str):
                      try: status = json.loads(status)
                      except Exception: pass
                  print('STATUS', status, flush=True)
                  if isinstance(status, dict):
                      state = str(status.get('status','')).lower()
                      if state == 'completed': return status
                      if state == 'failed': raise RuntimeError(f'LTX task failed: {status}')
                      result = status.get('result')
                      if isinstance(result, dict) and result.get('videos'):
                          return status
                  time.sleep(5)
              raise TimeoutError(f'LTX task timeout: {task_id}')

          def resolve_video(status):
              result = status.get('result', status) if isinstance(status, dict) else status
              candidates = []
              if isinstance(result, dict):
                  if result.get('video_path'): candidates.append(result['video_path'])
                  vids = result.get('videos') or []
                  if isinstance(vids, str): vids = [vids]
                  candidates.extend(vids)
              elif isinstance(result, str):
                  candidates.append(result)
              for item in candidates:
                  if isinstance(item, str) and item:
                      return item
              raise RuntimeError(f'Cannot resolve generated video: {status!r}')

          def run_task(params, out_path):
              print('RUN PARAMS', json.dumps(params, ensure_ascii=False), flush=True)
              submitted = client.predict(json.dumps(params), api_name='/run')
              print('SUBMITTED', submitted, flush=True)
              task_id = extract_task_id(submitted)
              if not task_id:
                  raise RuntimeError(f'No task id returned: {submitted!r}')
              status = poll(task_id)
              src = resolve_video(status)
              if src.startswith('http://') or src.startswith('https://'):
                  import urllib.request
                  urllib.request.urlretrieve(src, out_path)
              else:
                  shutil.copy2(src, out_path)
              print('VIDEO READY', out_path, flush=True)

          prompt_a = '''One continuous cinematic photorealistic 9:16 movie shot at night on a rain-soaked rooftop in a modern European city. The SAME 30-year-old man throughout: short dark wet hair, light stubble, black waterproof rain jacket, dark trousers, black shoes. Heavy rain and wind visibly move his jacket and hair. He looks nervously at the storm clouds. The camera slowly tracks toward him. A violent white-blue lightning bolt suddenly strikes the rooftop several meters beside him. He visibly flinches, his entire body jerks, he loses balance, stumbles backward on the wet concrete, reaches out with both arms trying to recover, then falls hard onto the rooftop and remains motionless. Camera naturally follows the action without cutting away. Real human motion, realistic body physics, realistic rain splashes and city lights, serious documentary-cinematic realism, no gore, no presenter.'''

          params_a = {
              'task_type':'t2v', 'prompt':prompt_a, 'negative_prompt':negative,
              'resolution':'544p', 'aspect_ratio':'9:16 (Portrait)',
              'duration':9.0, 'fps':'24fps', 'seed':seed,
              'use_spatial_upscaler':False, 'use_temporal_upscaler':False,
              'zero_gpu_duration':60
          }
          clip_a = WORK/'sequence_a.mp4'
          run_task(params_a, clip_a)

          last = WORK/'continuation.png'
          subprocess.run(['ffmpeg','-y','-sseof','-0.08','-i',str(clip_a),'-frames:v','1',str(last)], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          prompt_b = '''Continue immediately from this exact frame as the SAME movie, SAME rooftop, SAME fallen man, SAME black rain jacket, SAME rain, SAME city skyline and SAME cinematic visual language. The fallen man remains on the wet rooftop. A second adult man in a dark hooded rain jacket urgently runs out of the rooftop access door into frame, crosses the wet roof, drops to his knees beside the victim, speaks to him and checks for a response. He clearly takes a smartphone from his pocket, calls emergency services on speaker and checks the victim's breathing. Moments later blue emergency-light reflections appear across the wet roof. Two realistic European paramedics run through the access door carrying a medical bag, kneel beside the same victim and take over while the helper moves aside. Camera slowly pulls back at the end. Real human movement, natural hands and body physics, continuous rain, documentary-cinematic photorealism, no gore, no logos, no text.'''

          params_b = {
              'task_type':'i2v', 'prompt':prompt_b, 'start_image':str(last.resolve()),
              'negative_prompt':negative, 'resolution':'544p', 'aspect_ratio':'9:16 (Portrait)',
              'duration':9.0, 'fps':'24fps', 'seed':seed,
              'use_spatial_upscaler':False, 'use_temporal_upscaler':False,
              'zero_gpu_duration':60
          }
          clip_b = WORK/'sequence_b.mp4'
          # Some Gradio high-level APIs accept uploaded file handles rather than plain paths.
          try:
              params_b['start_image'] = handle_file(str(last))
              run_task(params_b, clip_b)
          except Exception as first_error:
              print('I2V handle fallback after:', repr(first_error), flush=True)
              params_b['start_image'] = str(last.resolve())
              run_task(params_b, clip_b)

          concat = WORK/'concat.txt'
          concat.write_text(f"file '{clip_a.resolve()}'\nfile '{clip_b.resolve()}'\n")
          subprocess.run([
              'ffmpeg','-y','-f','concat','-safe','0','-i',str(concat),
              '-vf','scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=24',
              '-c:v','libx264','-preset','medium','-crf','18','-pix_fmt','yuv420p',str(WORK/'continuous_silent.mp4')
          ], check=True)
          PY

      - name: Generate German open-source narration
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil
          model = hf_hub_download('rhasspy/piper-voices', 'de/de_DE/thorsten/high/de_DE-thorsten-high.onnx')
          config = hf_hub_download('rhasspy/piper-voices', 'de/de_DE/thorsten/high/de_DE-thorsten-high.onnx.json')
          shutil.copy2(model, 'lab/work/voice.onnx')
          shutil.copy2(config, 'lab/work/voice.onnx.json')
          PY
          cat > lab/work/narration.txt <<'TXT'
          Ein Blitz schlägt direkt neben ihm ein. In Sekunden können Herz, Atmung und Nervensystem aus dem Takt geraten. Wichtig: Ein Blitzopfer bleibt nicht elektrisch geladen. Du kannst es sofort berühren und helfen. Ruf einhundertzwölf, prüfe die Atmung und beginne, wenn nötig, mit der Wiederbelebung. Schnelle Hilfe kann Leben retten. TAYVORIQ.
          TXT
          cat lab/work/narration.txt | piper --model lab/work/voice.onnx --config lab/work/voice.onnx.json --output_file lab/work/narration.wav

      - name: Mix final master
        run: |
          ffmpeg -y -i lab/work/continuous_silent.mp4 -i lab/work/narration.wav \
            -filter_complex "[1:a]volume=1.15[a]" -map 0:v -map "[a]" \
            -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart \
            lab/output/TAYVORIQ_Blitz_OpenSource_AI.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 lab/output/TAYVORIQ_Blitz_OpenSource_AI.mp4

      - name: Publish lab result to isolated branch
        run: |
          git config user.name "TAYVORIQ Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/output/TAYVORIQ_Blitz_OpenSource_AI.mp4
          git commit -m "lab: add LTX 2.5 Blitz AI video [skip ci]" || exit 0
          git push origin HEAD:lab/wan-blitz-open-source

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-blitz-open-source-ai
          path: lab/output/TAYVORIQ_Blitz_OpenSource_AI.mp4
          if-no-files-found: error
          retention-days: 7
