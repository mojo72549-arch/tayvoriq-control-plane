name: Apply quality-driven candidate count migration

on:
  push:
    branches:
      - fix/growth-fallback-overcomplete-pool
    paths:
      - ".github/workflows/tayvoriq-quality-driven-candidate-count-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/growth-fallback-overcomplete-pool
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch orchestrator
        run: |
          set -euo pipefail
          python tools/tayvoriq_patch_quality_driven_candidate_count.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tayvoriq-agent-orchestrator-v2.yml
          git commit -m "fix: make Telegram trend count quality-driven"
          git pull --rebase origin fix/growth-fallback-overcomplete-pool
          git push origin HEAD:fix/growth-fallback-overcomplete-pool
