name: TAYVORIQ Robustness Contract

# implementation-contract-revision: v20-authoritative-length-v6-stdlib-contracts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-deliver-video-now.yml
      - .github/workflows/tayvoriq-delivery-watch.yml
      - .github/workflows/tayvoriq-agent-autorelease-v2.yml
      - .github/workflows/tayvoriq-agent-orchestrator-v2.yml
      - .github/workflows/tayvoriq-daily-orchestrator.yml
      - .github/workflows/tayvoriq-request-dispatch.yml
      - .github/workflows/tayvoriq-robustness-contract.yml
      - infra/telegram-approval-worker-v2.js
      - tools/tayvoriq_agent_*.py
      - state/tayvoriq-active-series.json
      - tests/test_tayvoriq_control_plane_v2.py

permissions:
  contents: read

jobs:
  robustness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Checkout current implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run control-plane unit contracts
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run zero-heavy-dependency implementation contracts
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m compileall -q tools src runtime_patches tests
          python tools/tayvoriq_lightweight_preflight.py
          python - <<'PY'
          from runtime_patches import tayvoriq_brand_pronunciation_guard as brand
          from runtime_patches import tayvoriq_deep_voice_contract as voice
          from runtime_patches import tayvoriq_world_forces_visual_guard as visuals

          assert voice.DEEP_F0_MIN_HZ == 84.0
          assert voice.DEEP_F0_MAX_HZ == 125.0
          assert round(voice.DEEP_REPAIR_HIGH_HZ, 2) == 156.25
          for median in (150.94, 153.85):
              factor = voice.repair_factor_for_median(median)
              assert factor is not None
              projected = voice.projected_f0_hz(median, factor)
              assert voice.DEEP_F0_MIN_HZ <= projected <= voice.DEEP_F0_MAX_HZ
          assert voice.repair_factor_for_median(156.26) is None

          for legacy in ('TAYVORIQ', 'Tai wo rik', 'Taiworik', 'Tai vor ik', 'Tayvorik'):
              assert brand.normalize_spoken_brand(f'Abonniere {legacy}.') == 'Abonniere Tayvorik.'

          package = {
              'source_context': {
                  'independent_news_count': 2,
                  'sources': [
                      {'publisher': 'U.S. Geological Survey'},
                      {'publisher': 'GFZ Helmholtz-Zentrum für Geoforschung'},
                  ],
                  'series_context': {'series_id': 'world-forces-v1', 'episode': 1},
              },
              'scenes': [{'visual_query': 'generic news'}],
          }
          result = visuals._apply_world_forces_visuals(package)
          queries = [item['visual_query'] for item in result['scenes']]
          assert result['visual_query_contract'] == 'world-forces-v1-episode-1-geology-v1'
          assert len(queries) == 6
          assert any('geology' in query for query in queries)
          assert any('seismograph' in query for query in queries)
          print({
              'deep_voice_bounded_recovery': True,
              'brand_pronunciation_canonical': True,
              'world_forces_visual_contract': True,
              'quality_gates_weakened': False,
          })
          PY

      - name: Enforce workflow performance and notification invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          golden_path = Path('.github/workflows/tayvoriq-deliver-video-now.yml').read_text(encoding='utf-8')
          watcher = Path('.github/workflows/tayvoriq-delivery-watch.yml').read_text(encoding='utf-8')
          release = Path('.github/workflows/tayvoriq-agent-autorelease-v2.yml').read_text(encoding='utf-8')
          scheduler = Path('.github/workflows/tayvoriq-agent-orchestrator-v2.yml').read_text(encoding='utf-8')
          legacy_bridge = Path('.github/workflows/tayvoriq-daily-orchestrator.yml').read_text(encoding='utf-8')
          dispatcher = Path('.github/workflows/tayvoriq-request-dispatch.yml').read_text(encoding='utf-8')
          worker = Path('infra/telegram-approval-worker-v2.js').read_text(encoding='utf-8')
          series_state = Path('tools/tayvoriq_agent_series_state_v2.py').read_text(encoding='utf-8')
          entrypoint = Path('implementation/tools/tayvoriq_autonomous_entrypoint.py').read_text(encoding='utf-8')
          bootstrap = Path('implementation/tools/tayvoriq_production_render_bootstrap.py').read_text(encoding='utf-8')

          def position(text: str, token: str) -> int:
              value = text.find(token)
              if value < 0:
                  raise SystemExit(f'ROBUSTNESS_CONTRACT_MISSING:{token}')
              return value

          light = position(golden_path, '- name: Lightweight contract preflight')
          pip_cache = position(golden_path, '- name: Restore pip dependency cache')
          install = position(golden_path, '- name: Install production dependencies')
          full_preflight = position(golden_path, '- name: Preflight')
          model_cache = position(golden_path, '- name: Restore production model cache')
          controller = position(golden_path, '- name: Produce approved master or reuse checkpoint')

          if not (light < pip_cache < install < full_preflight < model_cache < controller):
              raise SystemExit(
                  'ROBUSTNESS_CONTRACT_ORDER_FAILED:'
                  f'light={light},pip={pip_cache},install={install},preflight={full_preflight},'
                  f'model={model_cache},controller={controller}'
              )

          forbidden_golden = (
              '- name: Restore dependency and model cache',
              '- name: Notify final failure with concrete state',
              '❌ TAYVORIQ Produktion konnte nicht abgeschlossen werden',
          )
          for token in forbidden_golden:
              if token in golden_path:
                  raise SystemExit(f'ROBUSTNESS_CONTRACT_FORBIDDEN_GOLDEN:{token}')

          required_golden = (
              'telegram_technical_failure_emitted',
              'notification_owner',
              'tayvoriq-delivery-watch',
              'GITHUB_RUN_ATTEMPT',
          )
          for token in required_golden:
              if token not in golden_path:
                  raise SystemExit(f'ROBUSTNESS_CONTRACT_GOLDEN_MISSING:{token}')

          forbidden_watcher = (
              '- name: Telegram same-run recovery status',
              '- name: Telegram verified fresh recovery generation status',
              'Recovery läuft\\n',
          )
          for token in forbidden_watcher:
              if token in watcher:
                  raise SystemExit(f'ROBUSTNESS_CONTRACT_FORBIDDEN_WATCHER:{token}')

          required_watcher = (
              "data['suppress_start_notification'] = True",
              '- name: Record silent same-run recovery',
              '- name: Record verified silent fresh recovery generation',
              '- name: Telegram external action blocker',
              'EXTERNAL_ACTION_REQUIRED',
              'new_run_id',
          )
          for token in required_watcher:
              if token not in watcher:
                  raise SystemExit(f'ROBUSTNESS_CONTRACT_WATCHER_MISSING:{token}')

          required_scheduler = (
              'options: [morning, evening]',
              '- cron: "30 4 * * *"',
              '- cron: "30 5 * * *"',
              '- cron: "30 15 * * *"',
              '- cron: "30 16 * * *"',
              'cancel-in-progress: false',
              'TAYVORIQ_SKIP_ACTIVE_SERIES',
              '.automation/tayvoriq-agent-v2/selections/',
              '.automation/tayvoriq-agent-v2/deliveries/',
              '1️⃣ Folge auswählen',
          )
          for token in required_scheduler:
              if token not in scheduler:
                  raise SystemExit(f'ROBUSTNESS_CONTRACT_SCHEDULER_MISSING:{token}')
          if 'afternoon' in scheduler.lower() or '30 12 * * *' in scheduler or '30 13 * * *' in scheduler:
              raise SystemExit('ROBUSTNESS_CONTRACT_SCHEDULER_FORBIDDEN: afternoon/legacy slot')

          if '\n  schedule:' in legacy_bridge or 'tayvoriq-deliver-video-now.yml' in legacy_bridge:
              raise SystemExit('ROBUSTNESS_CONTRACT_LEGACY_DIRECT_PRODUCTION_ACTIVE')
          if 'tayvoriq-agent-orchestrator-v2.yml' not in legacy_bridge:
              raise SystemExit('ROBUSTNESS_CONTRACT_LEGACY_BRIDGE_TARGET_MISSING')
          if '*/5 * * * *' in dispatcher:
              raise SystemExit('ROBUSTNESS_CONTRACT_NOOP_DISPATCH_POLLING_ACTIVE')

          required_selection = (
              'loadTrendRequest(env, selectionId)',
              '.automation/tayvoriq-agent-v2/selections/${safeSelection}.json',
              'SELECTION_SNAPSHOT_MISSING',
          )
          for token in required_selection:
              if token not in worker + dispatcher:
                  raise SystemExit(f'ROBUSTNESS_CONTRACT_SELECTION_SNAPSHOT_MISSING:{token}')

          if "github.event.workflow_run.conclusion == 'success'" not in release:
              raise SystemExit('ROBUSTNESS_CONTRACT_RELEASE_FAILURE_OWNERSHIP_INVALID')
          required_manual_release = (
              '- name: Preserve Telegram human approval gate',
              'contents: read',
              'actions: read',
              "'state': 'PENDING_TELEGRAM_VIDEO_APPROVAL'",
              "'telegram_review_buttons_preserved': True",
              "'automatic_approval_created': False",
              "'youtube_upload_started': False",
              "'tiktok_delivery_started': False",
              "approved_via: 'telegram_callback'",
              'tayvoriq:approve:',
          )
          for token in required_manual_release:
              if token not in release + worker:
                  raise SystemExit(f'ROBUSTNESS_CONTRACT_TELEGRAM_APPROVAL_MISSING:{token}')
          for token in (
              '- name: Notify independent quality audit start',
              '- name: Notify quality gates passed',
              'YouTube-Veröffentlichung wurde automatisch gestartet',
              '- name: Remove redundant manual review buttons from V2 message',
              '- name: Create automatic approval record',
              'auto-approve review',
              'gh workflow run tayvoriq-auto-publish-approved.yml',
          ):
              if token in release:
                  raise SystemExit(f'ROBUSTNESS_CONTRACT_FORBIDDEN_AUTORELEASE:{token}')
          if "'recovery_owner':'tayvoriq-delivery-watch'" not in watcher:
              raise SystemExit('ROBUSTNESS_CONTRACT_RECOVERY_RUN_MAP_MISSING')
          for token in ('platform_upload_performed', 'advanced_to_next_episode', 'series_completed'):
              if token not in series_state:
                  raise SystemExit(f'ROBUSTNESS_CONTRACT_SERIES_LIFECYCLE_MISSING:{token}')

          required_entrypoint = (
              'def _runtime_progress_enabled()',
              'if not _runtime_progress_enabled():',
              'TAYVORIQ_TELEGRAM_PROGRESS_SUPPRESSED',
              'os.environ["TAYVORIQ_TELEGRAM_PROGRESS"] = "false"',
              '"telegram_progress_suppressed": True',
          )
          for token in required_entrypoint:
              if token not in entrypoint:
                  raise SystemExit(f'ROBUSTNESS_CONTRACT_RUNTIME_TELEGRAM_MISSING:{token}')

          required_bootstrap = (
              'tayvoriq_brand_pronunciation_guard.py',
              'PRODUCTION_RUNTIME_BOOTSTRAP_BRAND_PRONUNCIATION_INSTALL_MISSING',
              'tayvoriq_world_forces_visual_guard.py',
              'PRODUCTION_RUNTIME_BOOTSTRAP_WORLD_FORCES_VISUAL_INSTALL_MISSING',
              'tayvoriq_v20_authoritative_length_guard.py',
          )
          for token in required_bootstrap:
              if token not in bootstrap:
                  raise SystemExit(f'ROBUSTNESS_CONTRACT_BOOTSTRAP_MISSING:{token}')

          print({
              'state': 'TAYVORIQ_ROBUSTNESS_CONTRACT_PASSED',
              'lightweight_before_heavy_runtime': True,
              'model_cache_after_full_preflight': True,
              'internal_recovery_silent': True,
              'runtime_progress_opt_in_only': True,
              'brand_pronunciation_canonical': True,
              'world_forces_visuals_bound_before_first_render': True,
              'external_blocker_notification_retained': True,
              'twice_daily_berlin_slots': True,
              'selection_snapshots': True,
              'single_recovery_owner': True,
              'series_lifecycle_bounded': True,
              'noop_polling_removed': True,
              'quality_gates_weakened': False,
          })
          PY
