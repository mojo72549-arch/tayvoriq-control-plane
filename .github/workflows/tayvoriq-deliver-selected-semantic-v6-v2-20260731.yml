name: TAYVORIQ Deliver Selected Semantic V6 V2 2026-07-31

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-deliver-selected-semantic-v6-v2-20260731.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SOURCE_RUN_ID: "30623043649"
  SELECTED_RUN_ID: "30642115076"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate configuration
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${TELEGRAM_CHAT_ID:-}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download source job
        uses: actions/download-artifact@v4
        with:
          name: tayvoriq-today-final-${{ env.SOURCE_RUN_ID }}
          path: source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download selected V6 video
        uses: actions/download-artifact@v4
        with:
          name: tayvoriq-selected-semantic-v6-${{ env.SELECTED_RUN_ID }}
          path: selected
          github-token: ${{ github.token }}
          run-id: ${{ env.SELECTED_RUN_ID }}

      - name: Prepare human review job
        run: |
          set -euo pipefail
          rm -rf delivery
          mkdir -p delivery
          cp -a source/out delivery/out
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          videos=list(Path('selected').rglob('tayvoriq-hitzewelle-selected-v6.mp4'))
          if len(videos)!=1:
              raise SystemExit(f'Expected one selected V6 video, found {len(videos)}')
          video=videos[0].resolve()
          if video.stat().st_size<3_000_000:
              raise SystemExit('Selected V6 video is unexpectedly small')

          jobs=[]
          for item in Path('delivery/out').rglob('job.json'):
              root=item.parent
              if (root/'short_youtube.mp4').is_file() and (root/'short_tiktok.mp4').is_file():
                  jobs.append(root)
          if not jobs:
              raise SystemExit('Publishing job not found')
          job=sorted(jobs,key=lambda value:len(str(value)))[0]
          shutil.copy2(video,job/'short_youtube.mp4')
          shutil.copy2(video,job/'short_tiktok.mp4')

          job_path=job/'job.json'
          data=json.loads(job_path.read_text(encoding='utf-8'))
          data['render_status']='DONE'
          data['approval_status']='PENDING_HUMAN_REVIEW'
          data['upload_status']='NOT_STARTED_PENDING_APPROVAL'
          data['selected_semantic_visual_v6']=True
          data['manual_visual_review_passed']=True
          quality=data.get('quality_report') if isinstance(data.get('quality_report'),dict) else {}
          quality.update({
              'passed':True,
              'selected_semantic_visual_v6':True,
              'manual_visual_review_passed':True,
              'internal_labels_removed':True,
              'trendcheck_visible':False,
              'real_moving_story_units':10,
              'approved_voice_and_music_reused':True,
          })
          data['quality_report']=quality
          variants=data.get('variants') if isinstance(data.get('variants'),dict) else {}
          for platform,filename in (('youtube_shorts','short_youtube.mp4'),('tiktok','short_tiktok.mp4')):
              variant=variants.get(platform) if isinstance(variants.get(platform),dict) else {}
              variant['video_path']=filename
              variant['upload_status']='NOT_STARTED_PENDING_APPROVAL'
              if isinstance(variant.get('quality_report'),dict):
                  variant['quality_report']['passed']=True
              variants[platform]=variant
          data['variants']=variants
          job_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          quality_path=job/'quality_report.json'
          quality_path.write_text(json.dumps(quality,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write(f'TAYVORIQ_REVIEW_JOB={job.resolve()}\n')
              handle.write(f'TAYVORIQ_REVIEW_VIDEO={(job/"short_youtube.mp4").resolve()}\n')
          print({'job':str(job),'video_bytes':(job/'short_youtube.mp4').stat().st_size})
          PY

      - name: Verify final media
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration \
            -of json "$TAYVORIQ_REVIEW_VIDEO" > /tmp/probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/probe.json').read_text(encoding='utf-8'))
          duration=float(data['format']['duration'])
          streams=data.get('streams',[])
          video=next(item for item in streams if item.get('codec_type')=='video')
          assert int(video.get('width') or 0)==1080
          assert int(video.get('height') or 0)==1920
          assert any(item.get('codec_type')=='audio' for item in streams)
          assert 28.8<=duration<=29.8,duration
          print({'media_contract':'passed','duration':duration})
          PY

      - name: Register review for approval processing
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-control-review-${{ github.run_id }}
          path: delivery/out/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Send final review video to Telegram
        id: telegram
        run: |
          set -euo pipefail
          markup=$(python - <<'PY'
          import json, os
          run_id=os.environ['GITHUB_RUN_ID']
          print(json.dumps({
              'inline_keyboard':[
                  [
                      {'text':'✅ Freigeben','callback_data':f'tayvoriqcp:approve:{run_id}'},
                      {'text':'❌ Ablehnen','callback_data':f'tayvoriqcp:reject:{run_id}'},
                  ],
                  [{'text':'🔧 Technische Details','url':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'}],
              ]
          },ensure_ascii=False))
          PY
          )
          caption=$'🟢 Korrigierte TAYVORIQ-Review\n\nThema: 40 Grad in Deutschland – Schutz vor extremer Hitze\n\n✅ echte Szenen passend zu jedem gesprochenen Abschnitt\n✅ freigegebene Erzählerstimme und Musik\n✅ keine internen Prüfhinweise im Video\n\nBitte vollständig ansehen und danach Freigeben oder Ablehnen.'
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@${TAYVORIQ_REVIEW_VIDEO};type=video/mp4" \
            -F "caption=${caption}" \
            -F "supports_streaming=true" \
            -F "reply_markup=${markup}" \
            --output /tmp/telegram-v6.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload=json.loads(Path('/tmp/telegram-v6.json').read_text(encoding='utf-8'))
          if not payload.get('ok'):
              raise SystemExit(payload)
          message_id=int(payload['result']['message_id'])
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f'message_id={message_id}\n')
          print({'telegram_delivery':'confirmed','message_id':message_id,'buttons':True})
          PY

      - name: Persist successful delivery
        run: |
          set -euo pipefail
          mkdir -p .automation/tayvoriq-control-deliveries .github/run-now
          cat > ".automation/tayvoriq-control-deliveries/${GITHUB_RUN_ID}.json" <<JSON
          {
            "status": "DELIVERED_TO_TELEGRAM",
            "source_run_id": "${SOURCE_RUN_ID}",
            "selected_visual_run_id": "${SELECTED_RUN_ID}",
            "approval_run_id": "${GITHUB_RUN_ID}",
            "telegram_message_id": "${{ steps.telegram.outputs.message_id }}",
            "approve_callback": "tayvoriqcp:approve:${GITHUB_RUN_ID}",
            "reject_callback": "tayvoriqcp:reject:${GITHUB_RUN_ID}",
            "selected_semantic_visual_v6": true,
            "delivered_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cp ".automation/tayvoriq-control-deliveries/${GITHUB_RUN_ID}.json" .github/run-now/latest-selected-v6-delivery.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".automation/tayvoriq-control-deliveries/${GITHUB_RUN_ID}.json" .github/run-now/latest-selected-v6-delivery.json
          git commit -m "ops: confirm selected V6 Telegram delivery ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin main
