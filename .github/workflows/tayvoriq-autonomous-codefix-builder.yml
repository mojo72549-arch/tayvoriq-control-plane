name: TAYVORIQ Autonomous Codefix Builder
# continuity-kick: current-provider-validation-v2

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Exact failed Golden Path run
        required: true
        type: string
      source_request_id:
        description: Exact active Telegram request
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: tayvoriq-autonomous-codefix-builder
  cancel-in-progress: false

jobs:
  build-verified-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ACTIVE_REQUEST_POINTER: .github/state/tayvoriq-active-production-request.json
      IMPLEMENTATION_REPO: mojo72549-arch/shorts-agent-studio
      IMPLEMENTATION_BRANCH: feature/multi-platform-distribution-package
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact armed owner
        id: owner
        shell: bash
        env:
          INPUT_RUN_ID: ${{ inputs.failed_run_id }}
          INPUT_REQUEST_ID: ${{ inputs.source_request_id }}
        run: |
          set -euo pipefail
          [[ "$INPUT_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'AUTOCODEFIX_RUN_ID_INVALID'; exit 1; }
          [[ "$INPUT_REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo 'AUTOCODEFIX_REQUEST_ID_INVALID'; exit 1; }
          python - "$ACTIVE_REQUEST_POINTER" "$INPUT_REQUEST_ID" "$INPUT_RUN_ID" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          from pathlib import Path
          pointer_path=Path(sys.argv[1]); request_id=sys.argv[2]; run_id=int(sys.argv[3]); out=Path(sys.argv[4])
          if not pointer_path.is_file():
              raise SystemExit('AUTOCODEFIX_ACTIVE_POINTER_MISSING')
          pointer=json.loads(pointer_path.read_text(encoding='utf-8'))
          request_path=Path('requests')/f'{request_id}.json'
          if not request_path.is_file():
              raise SystemExit('AUTOCODEFIX_REQUEST_MISSING')
          data=json.loads(request_path.read_text(encoding='utf-8'))
          codefix=data.get('codefix_recovery') if isinstance(data.get('codefix_recovery'),dict) else {}
          if pointer.get('schema')!='tayvoriq-active-production-request-v1' or pointer.get('state')!='ACTIVE':
              raise SystemExit('AUTOCODEFIX_ACTIVE_POINTER_INVALID')
          if str(pointer.get('request_id') or '')!=request_id or int(pointer.get('golden_path_run_id') or 0)!=run_id:
              raise SystemExit('AUTOCODEFIX_ACTIVE_OWNER_CHANGED')
          if str(data.get('request_id') or '')!=request_id or int(data.get('golden_path_run_id') or 0)!=run_id:
              raise SystemExit('AUTOCODEFIX_REQUEST_OWNER_CHANGED')
          if codefix.get('status')!='ARMED' or codefix.get('request_substate')!='AWAITING_CODEFIX':
              raise SystemExit('AUTOCODEFIX_REQUEST_NOT_ARMED')
          if int(codefix.get('failed_run_id') or 0)!=run_id:
              raise SystemExit('AUTOCODEFIX_FAILED_RUN_MISMATCH')
          for field in ('approval_key','source_context_sha256','contract_sha256'):
              pv=str(pointer.get(field) or '').strip(); rv=str(data.get(field) or '').strip()
              if pv and pv!=rv:
                  raise SystemExit(f'AUTOCODEFIX_IMMUTABLE_MISMATCH:{field}')
          values={
              'request_file':str(request_path),
              'request_id':request_id,
              'run_id':str(run_id),
              'topic':str(data.get('topic') or '').strip(),
              'failed_impl_sha':str(codefix.get('failed_implementation_sha') or '').strip(),
              'failure_state':str(codefix.get('failure_state') or 'PUBLISHABLE_CODEFIX_REQUIRED').strip(),
              'failure_signature':str(codefix.get('failure_signature') or '').strip(),
          }
          with out.open('a',encoding='utf-8') as h:
              for k,v in values.items(): h.write(f'{k}={v}\n')
          print(json.dumps(values,ensure_ascii=False))
          PY

      - name: Reserve bounded codefix attempt before providers and notifications
        id: admission
        shell: bash
        env:
          STUDIO_LOOKUP_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          REQUEST_FILE: ${{ steps.owner.outputs.request_file }}
        run: |
          set -euo pipefail
          implementation_sha=$(GH_TOKEN="$STUDIO_LOOKUP_TOKEN" gh api "repos/$IMPLEMENTATION_REPO/commits/$IMPLEMENTATION_BRANCH" --jq .sha)
          python -m unittest discover -s tests -p test_tayvoriq_autocodefix_budget_v1.py
          python tools/tayvoriq_autocodefix_budget_v1.py \
            --request "$REQUEST_FILE" --implementation-sha "$implementation_sha" \
            --builder-run-id "$GITHUB_RUN_ID" > /tmp/codefix-admission.json
          readarray -t admission < <(python - <<'PY'
          import json
          data=json.load(open('/tmp/codefix-admission.json'))
          print('true' if data['admitted'] else 'false')
          print(data['ledger_path'])
          print(data['implementation_sha'])
          PY
          )
          if [ "${admission[0]}" != "true" ]; then
            echo "admitted=false" >> "$GITHUB_OUTPUT"
            echo "AUTOCODEFIX_DUPLICATE_EVIDENCE_BLOCKED: no provider call or Telegram notification"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${admission[1]}"
          git commit -m "ops: reserve one bounded codefix attempt for $GITHUB_RUN_ID"
          persisted=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then persisted=true; break; fi
            git pull --rebase origin main
          done
          [ "$persisted" = "true" ] || { echo "AUTOCODEFIX_BUDGET_PERSIST_FAILED"; exit 1; }
          echo "admitted=true" >> "$GITHUB_OUTPUT"
          echo "implementation_sha=${admission[2]}" >> "$GITHUB_OUTPUT"

      - name: Telegram codefix started
        if: steps.admission.outputs.admitted == 'true' && (steps.owner.outputs.request_id != '')
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '🧰 TAYVORIQ · Auto-Codefix gestartet\n\nThema: %s\nFehlgeschlagener Run: %s\nFehlerklasse: %s\n\n✅ Derselbe freigegebene Auftrag und dieselben Quellen bleiben gebunden.\n➡️ Fehlerbeweise werden analysiert und ein verifizierter Studio-Fix wird automatisch erstellt.\n\nFür dich: ✅ Keine Aktion nötig.' \
            "${{ steps.owner.outputs.topic }}" "${{ steps.owner.outputs.run_id }}" "${{ steps.owner.outputs.failure_state }}")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null

      - name: Capture exact failed-run evidence
        if: steps.admission.outputs.admitted == 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.owner.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/tayvoriq-codefix-failed.log 2>&1 || true
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > /tmp/tayvoriq-codefix-full.log 2>&1 || true
          test -s /tmp/tayvoriq-codefix-failed.log || { echo 'AUTOCODEFIX_FAILED_LOG_MISSING'; exit 1; }
          if [ ! -s /tmp/tayvoriq-codefix-full.log ]; then
            cp /tmp/tayvoriq-codefix-failed.log /tmp/tayvoriq-codefix-full.log
          fi

      - name: Build guarded repair request
        if: steps.admission.outputs.admitted == 'true'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.owner.outputs.request_id }}
          RUN_ID: ${{ steps.owner.outputs.run_id }}
          FAILURE_STATE: ${{ steps.owner.outputs.failure_state }}
          FAILURE_SIGNATURE: ${{ steps.owner.outputs.failure_signature }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re
          from pathlib import Path

          failed_log=Path('/tmp/tayvoriq-codefix-failed.log').read_text(encoding='utf-8',errors='replace')
          full_log=Path('/tmp/tayvoriq-codefix-full.log').read_text(encoding='utf-8',errors='replace')

          # Failed-step logs often contain only the final publishability assertion.
          # Preserve the earlier quality-audit evidence that actually explains why
          # Voice/Visual repair failed, so autonomous repair targets the root cause
          # instead of blindly increasing retries or weakening gates.
          lines=full_log.splitlines()
          evidence_patterns=(
              r'retention_contract_source_hash_mismatch',
              r'retention_request_source_hash_mismatch',
              r'preapproval-ai quality-gate',
              r'critical_pronunciation',
              r'number-pronunciation',
              r'pronunciation',
              r'achtundvierzig\\.null',
              r'48\\.000',
              r'number_pronunciation_terms_(?:missing|passed)',
              r'voice_repair_duration_exceeded',
              r'spoken_contract_text',
              r'score_below_threshold',
              r'visual_agent',
              r'marketing_agent',
              r'local_repair_wall_timeout',
              r'publishable_output_retry_required',
              r'checkpoint.*repair',
              r'voice.*repair',
              r'visual.*repair',
              r'whisper',
          )
          hit_indexes=[]
          for index,line in enumerate(lines):
              lowered=line.casefold()
              if any(re.search(pattern,lowered,re.IGNORECASE) for pattern in evidence_patterns):
                  hit_indexes.extend(range(max(0,index-2),min(len(lines),index+3)))
          selected=[]
          seen=set()
          for index in hit_indexes:
              if index in seen:
                  continue
              seen.add(index)
              selected.append(lines[index])
          quality_evidence='\n'.join(selected)[-14000:]

          source_hash_failure=(
              'RETENTION_CONTRACT_SOURCE_HASH_MISMATCH' in full_log
              or 'RETENTION_REQUEST_SOURCE_HASH_MISMATCH' in full_log
          )
          source_files=[
              'tools/tayvoriq_retention_v5.py',
              'tests/test_tayvoriq_retention_v5.py',
              'tools/tayvoriq_dual_platform_render_v34.py',
              'runtime_patches/tayvoriq_verified_request_runtime_recovery.py',
          ]
          voice_files=[
              'tools/tayvoriq_speech_numbers_v23.py',
              'tools/tayvoriq_voice_only_repair_v5.py',
              'tools/tayvoriq_pronunciation_lexicon_v1.py',
              'tests/test_tayvoriq_pronunciation_audit_contract.py',
              'tools/tayvoriq_preapproval_ai_audit_v6.py',
              'runtime_patches/tayvoriq_verified_request_runtime_recovery.py',
          ]
          visual_files=[
              'tools/tayvoriq_visual_only_repair_v1.py',
              'tools/tayvoriq_dual_platform_render_v34.py',
              'tools/tayvoriq_dual_platform_render_v2.py',
              'tools/tayvoriq_preapproval_ai_audit_v6.py',
              'tests/test_tayvoriq_visual_audit_resilience.py',
          ]
          visual_failure=(
              'visual_agent:' in quality_evidence.casefold()
              and any(term in quality_evidence.casefold() for term in
                      ('finanz', 'börse', 'trading', 'stock chart', 'themat', 'mismatch'))
          )
          pronunciation_failure=(
              'pronunciation_interpretation:' in quality_evidence.casefold()
              or 'maus und bullion' in quality_evidence.casefold()
          )
          number_failure=any(term in quality_evidence.casefold() for term in
                             ('number-pronunciation', '48.000', 'achtundvierzig.null'))
          if source_hash_failure:
              action='repair_exact_approved_source_binding_at_v5_render_boundary'
              traceback_files=source_files
          elif visual_failure:
              action='repair_topic_bound_visual_assets_and_critical_pronunciation'
              traceback_files=visual_files + (voice_files[1:3] if pronunciation_failure else [])
          elif number_failure:
              action='repair_observed_number_pronunciation_then_resume_approved_request'
              traceback_files=voice_files
          elif pronunciation_failure:
              action='repair_observed_critical_word_pronunciation_then_resume_approved_request'
              traceback_files=voice_files[1:]
          else:
              action='repair_only_the_observed_publishability_failure'
              traceback_files=['tools/tayvoriq_preapproval_ai_audit_v6.py']
          payload={
              'state':'CODE_REPAIR_REQUIRED',
              'self_heal_depth':0,
              'action':action,
              'request_id':os.environ['REQUEST_ID'],
              'failed_run_id':int(os.environ['RUN_ID']),
              'failure_state':os.environ['FAILURE_STATE'],
              'failure_signature':os.environ['FAILURE_SIGNATURE'],
              'traceback_files':traceback_files,
              'observed_failure_classes':{
                  'source_hash':source_hash_failure,
                  'visual_semantics':visual_failure,
                  'critical_pronunciation':pronunciation_failure,
                  'number_pronunciation':number_failure,
              },
              'log_excerpt':((quality_evidence + '\n\n' + failed_log[-7000:]).strip())[-14000:],
              'quality_evidence_excerpt':quality_evidence,
              'full_log_tail':full_log[-7000:],
              'safety_contract':{
                  'exact_request_required':True,
                  'source_context_must_remain_bound':True,
                  'quality_gates_weakened':False,
                  'thresholds_must_not_change':True,
                  'publication_must_remain_review_gated':True,
                  'generic_runtime_fix_required':True,
                  'root_cause_evidence_required':True,
                  'checkpoint_reuse_required':True,
                  'pronunciation_normalization_must_be_deterministic':True,
                  'visual_semantics_must_remain_topic_bound':True,
                  'blind_retry_forbidden':True,
              },
          }
          Path('/tmp/tayvoriq-codefix-request.json').write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps({'repair_request':'ready','request_id':payload['request_id'],'failure_state':payload['failure_state']},ensure_ascii=False))
          PY

      - name: Checkout Studio production branch
        if: steps.admission.outputs.admitted == 'true'
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: ${{ steps.admission.outputs.implementation_sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 0

      - name: Hydrate prior verified overlay for cumulative repair
        if: steps.admission.outputs.admitted == 'true'
        id: hydrate_overlay
        working-directory: implementation
        shell: bash
        env:
          REQUEST_ID: ${{ steps.owner.outputs.request_id }}
        run: |
          set -euo pipefail
          meta="$GITHUB_WORKSPACE/.github/state/tayvoriq-autocodefix-candidate.json"
          patch="$GITHUB_WORKSPACE/.github/state/tayvoriq-autocodefix-candidate.patch"
          if [ ! -f "$meta" ] || [ ! -f "$patch" ]; then
            echo "hydrated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          decision=$(python - "$meta" "$patch" "$REQUEST_ID" "$(git rev-parse HEAD)" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          meta=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          patch=Path(sys.argv[2]); rid=sys.argv[3]; base=sys.argv[4]
          if (
              meta.get('schema')!='tayvoriq-autocodefix-handoff-v1'
              or meta.get('state')!='PATCH_VERIFIED_PENDING_STUDIO_APPLY'
              or str(meta.get('request_id') or '')!=rid
              or str(meta.get('base_sha') or '')!=base
              or meta.get('quality_gates_weakened') is not False
          ):
              print('skip'); raise SystemExit(0)
          actual=hashlib.sha256(patch.read_bytes()).hexdigest()
          expected=str(meta.get('patch_sha256') or '')
          if actual!=expected:
              print('skip-corrupt-prior-handoff')
              raise SystemExit(0)
          print('apply')
          PY
          )
          if [ "$decision" != "apply" ]; then
            echo "AUTOCODEFIX_PRIOR_OVERLAY_DISCARDED:$decision"
            echo "hydrated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git apply --check --recount --whitespace=fix "$patch"
          git apply --recount --whitespace=fix "$patch"
          git diff --check
          echo "hydrated=true" >> "$GITHUB_OUTPUT"
          echo "AUTOCODEFIX_CUMULATIVE_OVERLAY_HYDRATED:$REQUEST_ID"

      - name: Resolve existing candidate
        if: steps.admission.outputs.admitted == 'true'
        id: existing
        working-directory: implementation
        shell: bash
        env:
          REQUEST_ID: ${{ steps.owner.outputs.request_id }}
          FAILED_IMPL_SHA: ${{ steps.owner.outputs.failed_impl_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if git log --format='%s' "${FAILED_IMPL_SHA}..HEAD" 2>/dev/null | grep -Fq "auto-codefix(${REQUEST_ID})"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "AUTOCODEFIX_EXISTING_CANDIDATE:$head"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.admission.outputs.admitted == 'true' && (steps.existing.outputs.ready != 'true')
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install guarded repair dependencies
        if: steps.admission.outputs.admitted == 'true' && (steps.existing.outputs.ready != 'true')
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for command in ffmpeg ffprobe; do
            command -v "$command" >/dev/null || missing+=("$command")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg >/dev/null || { echo 'AUTOCODEFIX_FFMPEG_MISSING'; exit 1; }
          command -v ffprobe >/dev/null || { echo 'AUTOCODEFIX_FFPROBE_MISSING'; exit 1; }
          python -m pip install -q requests pillow "moviepy==1.0.3" pytest

      - name: Telegram root cause context ready
        if: steps.admission.outputs.admitted == 'true' && (steps.existing.outputs.ready != 'true')
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '🔎 TAYVORIQ · Fehleranalyse abgeschlossen\n\nThema: %s\nRun: %s\n\n✅ Voice-, Aussprache- und Visual-Audit wurden als Reparaturkontext übernommen.\n✅ Der aktuelle Studio-Code ist exakt gebunden.\n➡️ Jetzt wird ein anwendbarer Patch gegen den tatsächlichen Produktionsstand erzeugt.\n\nFür dich: ✅ Keine Aktion nötig.' \
            "${{ steps.owner.outputs.topic }}" "${{ steps.owner.outputs.run_id }}")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null

      - name: Generate guarded Studio patch
        id: generate
        if: steps.admission.outputs.admitted == 'true' && (steps.existing.outputs.ready != 'true')
        working-directory: implementation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/tayvoriq-self-heal
          set +e
          python tools/tayvoriq_autonomous_code_repair_v2.py \
            --request /tmp/tayvoriq-codefix-request.json \
            --repo . \
            --provider auto \
            --report-out out/tayvoriq-self-heal/autonomous-codefix-report.json \
            --max-provider-attempts 3 2>&1 | tee /tmp/tayvoriq-autocodefix-generate.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            reason=$(python - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/tayvoriq-autocodefix-generate.log').read_text(encoding='utf-8',errors='replace')
          candidates=[]
          for line in text.splitlines():
              s=line.strip()
              if 'RuntimeError:' in s or 'git apply --check failed:' in s or 'AUTOCODEFIX_' in s:
                  candidates.append(s)
          reason=(candidates[-1] if candidates else 'Studio-Patch konnte nicht verifiziert erzeugt werden.')
          reason=re.sub(r'\s+',' ',reason)[:700]
          print(reason)
          PY
            )
            {
              echo 'failure_reason<<EOF'
              echo "$reason"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            exit "$rc"
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          request=json.loads(Path('/tmp/tayvoriq-codefix-request.json').read_text(encoding='utf-8'))
          report=json.loads(Path('out/tayvoriq-self-heal/autonomous-codefix-report.json').read_text(encoding='utf-8'))
          changed={str(path) for path in report.get('changed_paths', [])}
          observed=request.get('observed_failure_classes') or {}
          if observed.get('visual_semantics') and not any(
              'visual' in path or 'render' in path or 'asset' in path for path in changed
          ):
              raise SystemExit('AUTOCODEFIX_PATCH_IRRELEVANT_TO_OBSERVED_VISUAL_FAILURE')
          if observed.get('number_pronunciation') is False and changed and all(
              'speech_numbers' in path for path in changed
          ):
              raise SystemExit('AUTOCODEFIX_UNOBSERVED_NUMBER_REPAIR_BLOCKED')
          print({'codefix_relevance_verified': True, 'changed_paths': sorted(changed)})
          PY
          git diff --check
          test -n "$(git status --porcelain)" || { echo 'AUTOCODEFIX_NO_PATCH_PRODUCED'; exit 1; }

      - name: Telegram Studio patch generated
        if: steps.admission.outputs.admitted == 'true' && (steps.generate.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '🛠️ TAYVORIQ · Studio-Fix erzeugt\n\nThema: %s\nRun: %s\n\n✅ Der automatische Codefix hat einen konkreten Patch erzeugt.\n➡️ Jetzt laufen Regressionstests und der technische Preflight.\n\nFür dich: ✅ Keine Aktion nötig.' \
            "${{ steps.owner.outputs.topic }}" "${{ steps.owner.outputs.run_id }}")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null

      - name: Validate generated patch
        id: validate
        if: steps.admission.outputs.admitted == 'true' && (steps.existing.outputs.ready != 'true')
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          # The repository root must precede src so the real runtime_patches
          # package wins over src/runtime_patches.py during regression collection.
          export PYTHONPATH="$PWD:$PWD/tools:$PWD/src/runtime_hotfixes:$PWD/src:${PYTHONPATH:-}"
          # src/tools is a regular package. Ensure the production tools directory
          # wins package resolution when a pinned Studio commit lacks this marker.
          if [ ! -f tools/__init__.py ]; then
            printf '%s\n' '"""Production tools package for guarded regression imports."""' > tools/__init__.py
          fi
          python - <<'PY'
          from pathlib import Path
          import runtime_patches
          from runtime_patches import tayvoriq_deep_voice_contract  # noqa: F401
          origin = Path(runtime_patches.__file__).resolve()
          if origin.name != "__init__.py" or origin.parent.name != "runtime_patches":
              raise SystemExit(f"AUTOCODEFIX_RUNTIME_PATCH_PACKAGE_SHADOWED:{origin}")
          print(f"AUTOCODEFIX_RUNTIME_PATCH_PACKAGE_OK:{origin}")
          PY
          python -m compileall -q tools runtime_patches src/runtime_hotfixes tests

          # Autonomous recovery must never weaken or bypass an already-tested
          # production contract. Reject the two regression classes that caused
          # the September recovery loop before any handoff can be published.
          python - <<'PY'
          import re
          import subprocess

          diff = subprocess.check_output(
              ["git", "diff", "--unified=0"], text=True, errors="replace"
          )
          added = "\n".join(
              line for line in diff.splitlines()
              if line.startswith("+") and not line.startswith("+++")
          )
          forbidden = {
              "FULL_TAKE_ATTEMPTS contract override": r"(?m)^\+.*FULL_TAKE_ATTEMPTS\s*=\s*(?!3\b)\d+",
              "forced SUCCESS status": r"(?m)^\+.*\[['\"]status['\"]\]\s*=\s*['\"]SUCCESS['\"]",
              "forced preflight success": r"(?m)^\+.*\[['\"]preflight_outcome['\"]\]\s*=\s*['\"]success['\"]",
              "forced verified_recovered preflight": r"(?m)^\+.*\[['\"]preflight_status['\"]\]\s*=\s*['\"]verified_recovered['\"]",
          }
          hits = [name for name, pattern in forbidden.items() if re.search(pattern, added)]
          if hits:
              raise SystemExit(
                  "AUTOCODEFIX_CONTRACT_REGRESSION_BLOCKED:" + ",".join(hits)
              )
          PY

          # Run the exact regression contract that previously escaped the
          # reduced autocodefix suite, then the existing focused safety suite.
          python -m pytest -q tests/test_tayvoriq_voice_v5_human_narrator.py
          python -m pytest -q tests/test_tayvoriq_autonomous_code_repair_provider_resilience.py
          python -m pytest -q             tests/test_tayvoriq_publishability_codefix_context.py             tests/test_tayvoriq_verified_request_runtime_recovery.py             tests/test_tayvoriq_pronunciation_audit_contract.py             tests/test_tayvoriq_visual_audit_resilience.py
          python tools/tayvoriq_lightweight_preflight.py

      - name: Telegram codefix verified
        if: steps.admission.outputs.admitted == 'true' && (steps.validate.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          text=$(printf '✅ TAYVORIQ · Auto-Codefix verifiziert\n\nThema: %s\nRun: %s\n\n✅ Regressionstests bestanden.\n✅ Lightweight Preflight bestanden.\n✅ Quality-Gates wurden nicht abgeschwächt.\n➡️ Derselbe Auftrag wird jetzt mit dem verifizierten Fix fortgesetzt.\n\nFür dich: ✅ Keine Aktion nötig.' \
            "${{ steps.owner.outputs.topic }}" "${{ steps.owner.outputs.run_id }}")
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null

      - name: Publish verified patch handoff
        id: handoff
        if: steps.admission.outputs.admitted == 'true' && (steps.existing.outputs.ready != 'true')
        working-directory: implementation
        shell: bash
        env:
          REQUEST_ID: ${{ steps.owner.outputs.request_id }}
          REQUEST_FILE: ${{ steps.owner.outputs.request_file }}
          RUN_ID: ${{ steps.owner.outputs.run_id }}
          FAILURE_SIGNATURE: ${{ steps.owner.outputs.failure_signature }}
        run: |
          set -euo pipefail
          git diff --binary > /tmp/tayvoriq-autocodefix-candidate.patch
          test -s /tmp/tayvoriq-autocodefix-candidate.patch || { echo 'AUTOCODEFIX_EMPTY_VERIFIED_PATCH'; exit 1; }
          base_sha="$(git rev-parse HEAD)"
          patch_sha="$(sha256sum /tmp/tayvoriq-autocodefix-candidate.patch | awk '{print $1}')"
          cd "$GITHUB_WORKSPACE"
          git pull --rebase origin main
          mkdir -p .github/state
          cp /tmp/tayvoriq-autocodefix-candidate.patch .github/state/tayvoriq-autocodefix-candidate.patch
          BASE_SHA="$base_sha" PATCH_SHA="$patch_sha" python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          payload={
              "schema":"tayvoriq-autocodefix-handoff-v1",
              "state":"PATCH_VERIFIED_PENDING_STUDIO_APPLY",
              "request_id":os.environ["REQUEST_ID"],
              "failed_run_id":int(os.environ["RUN_ID"]),
              "failure_signature":os.environ["FAILURE_SIGNATURE"],
              "implementation_repository":"mojo72549-arch/shorts-agent-studio",
              "target_branch":"feature/multi-platform-distribution-package",
              "base_sha":os.environ["BASE_SHA"],
              "patch_sha256":os.environ["PATCH_SHA"],
              "quality_gates_weakened":False,
              "created_at":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
          }
          Path(".github/state/tayvoriq-autocodefix-candidate.json").write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          request_path=Path(os.environ["REQUEST_FILE"])
          if not request_path.is_file():
              raise SystemExit("AUTOCODEFIX_HANDOFF_REQUEST_MISSING")
          request=json.loads(request_path.read_text(encoding="utf-8"))
          codefix=request.get("codefix_recovery") if isinstance(request.get("codefix_recovery"),dict) else {}
          if str(request.get("request_id") or "") != os.environ["REQUEST_ID"]:
              raise SystemExit("AUTOCODEFIX_HANDOFF_REQUEST_ID_MISMATCH")
          if str(request.get("status") or "") != "DISPATCHED":
              raise SystemExit("AUTOCODEFIX_HANDOFF_REQUEST_NOT_DISPATCHED")
          if codefix.get("status") not in {"ARMED","REPLAY_DISPATCHED"}:
              raise SystemExit("AUTOCODEFIX_HANDOFF_REQUEST_NOT_CODEFIX_BOUND")
          if int(codefix.get("failed_run_id") or 0) != int(os.environ["RUN_ID"]):
