          if [ "${GENERATE_OUTCOME:-}" = "failure" ]; then stage="Studio-Patch erzeugen"; fi
          if [ "${VALIDATE_OUTCOME:-}" = "failure" ]; then stage="Regressionstests / Preflight"; fi
          if [ "${HANDOFF_OUTCOME:-}" = "failure" ]; then stage="Verifizierten Patch übernehmen"; fi
          if [ "${REPLAY_OUTCOME:-}" = "failure" ]; then stage="Reparierten Recovery-Run binden"; fi
