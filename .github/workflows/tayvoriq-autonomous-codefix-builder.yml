name: TAYVORIQ Autonomous Codefix Builder

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Exact failed Golden Path run
        required: true
        type: string
      source_request_id:
        description: Exact active Telegram request
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: tayvoriq-autonomous-codefix-builder
  cancel-in-progress: false

jobs:
  build-verified-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ACTIVE_REQUEST_POINTER: .github/state/tayvoriq-active-production-request.json
      IMPLEMENTATION_REPO: mojo72549-arch/shorts-agent-studio
      IMPLEMENTATION_BRANCH: feature/multi-platform-distribution-package
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact armed owner
        id: owner
        shell: bash
        env:
          INPUT_RUN_ID: ${{ inputs.failed_run_id }}
          INPUT_REQUEST_ID: ${{ inputs.source_request_id }}
        run: |
          set -euo pipefail
          [[ "$INPUT_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'AUTOCODEFIX_RUN_ID_INVALID'; exit 1; }
          [[ "$INPUT_REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo 'AUTOCODEFIX_REQUEST_ID_INVALID'; exit 1; }
          python - "$ACTIVE_REQUEST_POINTER" "$INPUT_REQUEST_ID" "$INPUT_RUN_ID" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          from pathlib import Path
          pointer_path=Path(sys.argv[1]); request_id=sys.argv[2]; run_id=int(sys.argv[3]); out=Path(sys.argv[4])
          if not pointer_path.is_file():
              raise SystemExit('AUTOCODEFIX_ACTIVE_POINTER_MISSING')
          pointer=json.loads(pointer_path.read_text(encoding='utf-8'))
          request_path=Path('requests')/f'{request_id}.json'
          if not request_path.is_file():
              raise SystemExit('AUTOCODEFIX_REQUEST_MISSING')
          data=json.loads(request_path.read_text(encoding='utf-8'))
          codefix=data.get('codefix_recovery') if isinstance(data.get('codefix_recovery'),dict) else {}
          if pointer.get('schema')!='tayvoriq-active-production-request-v1' or pointer.get('state')!='ACTIVE':
              raise SystemExit('AUTOCODEFIX_ACTIVE_POINTER_INVALID')
          if str(pointer.get('request_id') or '')!=request_id or int(pointer.get('golden_path_run_id') or 0)!=run_id:
              raise SystemExit('AUTOCODEFIX_ACTIVE_OWNER_CHANGED')
          if str(data.get('request_id') or '')!=request_id or int(data.get('golden_path_run_id') or 0)!=run_id:
              raise SystemExit('AUTOCODEFIX_REQUEST_OWNER_CHANGED')
          if codefix.get('status')!='ARMED' or codefix.get('request_substate')!='AWAITING_CODEFIX':
              raise SystemExit('AUTOCODEFIX_REQUEST_NOT_ARMED')
          if int(codefix.get('failed_run_id') or 0)!=run_id:
              raise SystemExit('AUTOCODEFIX_FAILED_RUN_MISMATCH')
          for field in ('approval_key','source_context_sha256','contract_sha256'):
              pv=str(pointer.get(field) or '').strip(); rv=str(data.get(field) or '').strip()
              if pv and pv!=rv:
                  raise SystemExit(f'AUTOCODEFIX_IMMUTABLE_MISMATCH:{field}')
          values={
              'request_file':str(request_path),
              'request_id':request_id,
              'run_id':str(run_id),
              'topic':str(data.get('topic') or '').strip(),
              'failed_impl_sha':str(codefix.get('failed_implementation_sha') or '').strip(),
              'failure_state':str(codefix.get('failure_state') or 'PUBLISHABLE_CODEFIX_REQUIRED').strip(),
              'failure_signature':str(codefix.get('failure_signature') or '').strip(),
          }
          with out.open('a',encoding='utf-8') as h:
              for k,v in values.items(): h.write(f'{k}={v}\n')
          print(json.dumps(values,ensure_ascii=False))
          PY

      - name: Capture exact failed-run evidence
        shell: bash
        env:
          RUN_ID: ${{ steps.owner.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/tayvoriq-codefix-failed.log 2>&1 || true
          test -s /tmp/tayvoriq-codefix-failed.log || { echo 'AUTOCODEFIX_FAILED_LOG_MISSING'; exit 1; }

      - name: Build guarded repair request
        shell: bash
        env:
          REQUEST_ID: ${{ steps.owner.outputs.request_id }}
          RUN_ID: ${{ steps.owner.outputs.run_id }}
          FAILURE_STATE: ${{ steps.owner.outputs.failure_state }}
          FAILURE_SIGNATURE: ${{ steps.owner.outputs.failure_signature }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          log=Path('/tmp/tayvoriq-codefix-failed.log').read_text(encoding='utf-8',errors='replace')
          payload={
              'state':'CODE_REPAIR_REQUIRED',
              'self_heal_depth':0,
              'action':'repair_publishability_quality_contract_then_resume_approved_request',
              'request_id':os.environ['REQUEST_ID'],
              'failed_run_id':int(os.environ['RUN_ID']),
              'failure_state':os.environ['FAILURE_STATE'],
              'failure_signature':os.environ['FAILURE_SIGNATURE'],
              'traceback_files':[],
              'log_excerpt':log[-24000:],
              'safety_contract':{
                  'exact_request_required':True,
                  'source_context_must_remain_bound':True,
                  'quality_gates_weakened':False,
                  'thresholds_must_not_change':True,
                  'publication_must_remain_review_gated':True,
                  'generic_runtime_fix_required':True,
              },
          }
          Path('/tmp/tayvoriq-codefix-request.json').write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps({'repair_request':'ready','request_id':payload['request_id'],'failure_state':payload['failure_state']},ensure_ascii=False))
          PY

      - name: Checkout Studio production branch
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: ${{ env.IMPLEMENTATION_BRANCH }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 0

      - name: Hydrate prior verified overlay for cumulative repair
        id: hydrate_overlay
        working-directory: implementation
        shell: bash
        env:
          REQUEST_ID: ${{ steps.owner.outputs.request_id }}
        run: |
          set -euo pipefail
          meta="$GITHUB_WORKSPACE/.github/state/tayvoriq-autocodefix-candidate.json"
          patch="$GITHUB_WORKSPACE/.github/state/tayvoriq-autocodefix-candidate.patch"
          if [ ! -f "$meta" ] || [ ! -f "$patch" ]; then
            echo "hydrated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          decision=$(python - "$meta" "$patch" "$REQUEST_ID" "$(git rev-parse HEAD)" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          meta=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          patch=Path(sys.argv[2]); rid=sys.argv[3]; base=sys.argv[4]
          if (
              meta.get('schema')!='tayvoriq-autocodefix-handoff-v1'
              or meta.get('state')!='PATCH_VERIFIED_PENDING_STUDIO_APPLY'
              or str(meta.get('request_id') or '')!=rid
              or str(meta.get('base_sha') or '')!=base
              or meta.get('quality_gates_weakened') is not False
          ):
              print('skip'); raise SystemExit(0)
          actual=hashlib.sha256(patch.read_bytes()).hexdigest()
          if actual!=str(meta.get('patch_sha256') or ''):
              raise SystemExit('AUTOCODEFIX_CUMULATIVE_PATCH_HASH_MISMATCH')
          print('apply')
          PY
          )
          if [ "$decision" != "apply" ]; then
            echo "hydrated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git apply --check --recount --whitespace=fix "$patch"
          git apply --recount --whitespace=fix "$patch"
          git diff --check
          echo "hydrated=true" >> "$GITHUB_OUTPUT"
          echo "AUTOCODEFIX_CUMULATIVE_OVERLAY_HYDRATED:$REQUEST_ID"

      - name: Resolve existing candidate
        id: existing
        working-directory: implementation
        shell: bash
        env:
          REQUEST_ID: ${{ steps.owner.outputs.request_id }}
          FAILED_IMPL_SHA: ${{ steps.owner.outputs.failed_impl_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if git log --format='%s' "${FAILED_IMPL_SHA}..HEAD" 2>/dev/null | grep -Fq "auto-codefix(${REQUEST_ID})"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "AUTOCODEFIX_EXISTING_CANDIDATE:$head"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.existing.outputs.ready != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install guarded repair dependencies
        if: steps.existing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for command in ffmpeg ffprobe; do
            command -v "$command" >/dev/null || missing+=("$command")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg >/dev/null || { echo 'AUTOCODEFIX_FFMPEG_MISSING'; exit 1; }
          command -v ffprobe >/dev/null || { echo 'AUTOCODEFIX_FFPROBE_MISSING'; exit 1; }
          python -m pip install -q requests pillow "moviepy==1.0.3" pytest

      - name: Generate guarded Studio patch
        if: steps.existing.outputs.ready != 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          python tools/tayvoriq_autonomous_code_repair_v2.py             --request /tmp/tayvoriq-codefix-request.json             --repo .             --provider auto             --report-out out/tayvoriq-self-heal/autonomous-codefix-report.json             --max-provider-attempts 3
          git diff --check
          test -n "$(git status --porcelain)" || { echo 'AUTOCODEFIX_NO_PATCH_PRODUCED'; exit 1; }

      - name: Validate generated patch
        if: steps.existing.outputs.ready != 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools runtime_patches src/runtime_hotfixes tests
          python -m pytest -q             tests/test_tayvoriq_publishability_codefix_context.py             tests/test_tayvoriq_verified_request_runtime_recovery.py             tests/test_tayvoriq_pronunciation_audit_contract.py             tests/test_tayvoriq_visual_audit_resilience.py
          python tools/tayvoriq_lightweight_preflight.py

      - name: Publish verified patch handoff
        id: handoff
        if: steps.existing.outputs.ready != 'true'
        working-directory: implementation
        shell: bash
        env:
          REQUEST_ID: ${{ steps.owner.outputs.request_id }}
          REQUEST_FILE: ${{ steps.owner.outputs.request_file }}
          RUN_ID: ${{ steps.owner.outputs.run_id }}
          FAILURE_SIGNATURE: ${{ steps.owner.outputs.failure_signature }}
        run: |
          set -euo pipefail
          git diff --binary > /tmp/tayvoriq-autocodefix-candidate.patch
          test -s /tmp/tayvoriq-autocodefix-candidate.patch || { echo 'AUTOCODEFIX_EMPTY_VERIFIED_PATCH'; exit 1; }
          base_sha="$(git rev-parse HEAD)"
          patch_sha="$(sha256sum /tmp/tayvoriq-autocodefix-candidate.patch | awk '{print $1}')"
          cd "$GITHUB_WORKSPACE"
          git pull --rebase origin main
          mkdir -p .github/state
          cp /tmp/tayvoriq-autocodefix-candidate.patch .github/state/tayvoriq-autocodefix-candidate.patch
          BASE_SHA="$base_sha" PATCH_SHA="$patch_sha" python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          payload={
              "schema":"tayvoriq-autocodefix-handoff-v1",
              "state":"PATCH_VERIFIED_PENDING_STUDIO_APPLY",
              "request_id":os.environ["REQUEST_ID"],
              "failed_run_id":int(os.environ["RUN_ID"]),
              "failure_signature":os.environ["FAILURE_SIGNATURE"],
              "implementation_repository":"mojo72549-arch/shorts-agent-studio",
              "target_branch":"feature/multi-platform-distribution-package",
              "base_sha":os.environ["BASE_SHA"],
              "patch_sha256":os.environ["PATCH_SHA"],
              "quality_gates_weakened":False,
              "created_at":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
          }
          Path(".github/state/tayvoriq-autocodefix-candidate.json").write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          request_path=Path(os.environ["REQUEST_FILE"])
          if not request_path.is_file():
              raise SystemExit("AUTOCODEFIX_HANDOFF_REQUEST_MISSING")
          request=json.loads(request_path.read_text(encoding="utf-8"))
          codefix=request.get("codefix_recovery") if isinstance(request.get("codefix_recovery"),dict) else {}
          if str(request.get("request_id") or "") != os.environ["REQUEST_ID"]:
              raise SystemExit("AUTOCODEFIX_HANDOFF_REQUEST_ID_MISMATCH")
          if str(request.get("status") or "") != "DISPATCHED":
              raise SystemExit("AUTOCODEFIX_HANDOFF_REQUEST_NOT_DISPATCHED")
          if codefix.get("status") not in {"ARMED","REPLAY_DISPATCHED"}:
              raise SystemExit("AUTOCODEFIX_HANDOFF_REQUEST_NOT_CODEFIX_BOUND")
          if int(codefix.get("failed_run_id") or 0) != int(os.environ["RUN_ID"]):
              raise SystemExit("AUTOCODEFIX_HANDOFF_FAILED_RUN_MISMATCH")
          if str(codefix.get("failure_signature") or "") != os.environ["FAILURE_SIGNATURE"]:
              raise SystemExit("AUTOCODEFIX_HANDOFF_FAILURE_SIGNATURE_MISMATCH")
          codefix["verified_overlay_patch_sha256"]=os.environ["PATCH_SHA"]
          codefix["verified_overlay_base_sha"]=os.environ["BASE_SHA"]
          codefix["verified_overlay_at"]=payload["created_at"]
          codefix["quality_gates_weakened"]=False
          request["codefix_recovery"]=codefix
          request_path.write_text(json.dumps(request,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(payload,ensure_ascii=False))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state/tayvoriq-autocodefix-candidate.json .github/state/tayvoriq-autocodefix-candidate.patch "$REQUEST_FILE"
          git commit -m "ops(tayvoriq): publish verified Studio codefix handoff ${REQUEST_ID}"
          git push origin HEAD:main
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "patch_sha256=$patch_sha" >> "$GITHUB_OUTPUT"
          echo "AUTOCODEFIX_VERIFIED_HANDOFF_PUBLISHED:$REQUEST_ID:$patch_sha"

      - name: Handoff ready for request-bound overlay replay
        if: steps.handoff.outputs.patch_sha256 != ''
        run: |
          echo "AUTOCODEFIX_VERIFIED_OVERLAY_READY:${{ steps.owner.outputs.request_id }}:${{ steps.handoff.outputs.patch_sha256 }}"

      - name: Dispatch and bind exact verified overlay replay
        id: overlay_replay
        if: steps.handoff.outputs.patch_sha256 != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.owner.outputs.request_id }}
          REQUEST_FILE: ${{ steps.owner.outputs.request_file }}
          OLD_RUN_ID: ${{ steps.owner.outputs.run_id }}
          TOPIC: ${{ steps.owner.outputs.topic }}
          HANDOFF_BASE_SHA: ${{ steps.handoff.outputs.base_sha }}
          PATCH_SHA256: ${{ steps.handoff.outputs.patch_sha256 }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          green_sha=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.github/state/tayvoriq-production-green.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('schema')!='tayvoriq-production-green-v1' or d.get('full_preflight_passed') is not True or d.get('quality_gates_weakened') is not False:
              raise SystemExit('AUTOCODEFIX_OVERLAY_PRODUCTION_GREEN_INVALID')
          print(str(d.get('implementation_sha') or ''))
          PY
          )
          if [ "$green_sha" != "$HANDOFF_BASE_SHA" ]; then
            gh workflow run tayvoriq-production-green-promoter.yml --ref main
            echo "AUTOCODEFIX_OVERLAY_BASE_NOT_GREEN:handoff=$HANDOFF_BASE_SHA green=$green_sha"
            echo "replay_dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before_ids=$(gh run list --workflow tayvoriq-deliver-video-now.yml --limit 50 --json databaseId --jq '.[].databaseId' | tr '\n' ' ')
          dispatch_epoch=$(date +%s)
          python - "$REQUEST_FILE" "$HANDOFF_BASE_SHA" "$PATCH_SHA256" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          request=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          codefix=request.get('codefix_recovery') if isinstance(request.get('codefix_recovery'),dict) else {}
          if str(request.get('request_id') or '')=='' or str(request.get('status') or '')!='DISPATCHED':
              raise SystemExit('AUTOCODEFIX_OVERLAY_REPLAY_REQUEST_INVALID')
          if codefix.get('status') not in {'ARMED','REPLAY_DISPATCHED'}:
              raise SystemExit('AUTOCODEFIX_OVERLAY_REPLAY_NOT_CODEFIX_BOUND')
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          trigger_path=Path('.github/run-now/tayvoriq-x-request.json')
          try:
              trigger=json.loads(trigger_path.read_text(encoding='utf-8'))
          except Exception:
              trigger={}
          trigger.update({
              'request':'tayvoriq-x-production',
              'topic':str(request.get('topic') or ''),
              'trend_id':str(request.get('trend_id') or ''),
              'requested_at':now,
              'request_nonce':f"autocodefix-overlay-{request.get('request_id')}-{sys.argv[2][:12]}-{sys.argv[3][:12]}",
              'workflow':'.github/workflows/tayvoriq-deliver-video-now.yml',
              'implementation_branch':'feature/multi-platform-distribution-package',
              'implementation_sha_expected':sys.argv[2],
              'approved_trend_pinned':True,
              'source_request_id':str(request.get('request_id') or ''),
              'technical_replay':True,
              'fresh_recovery':True,
              'reuse_exact_source_request':True,
              'suppress_start_notification':True,
              'execution_backend':'github_hosted_public',
              'retry_of_run_id':int(codefix.get('failed_run_id') or request.get('golden_path_run_id') or 0),
              'recovery_generation':max(0,int(request.get('recovery_generation') or 0)),
              'recovery_strategy':'same-approved-request-verified-autocodefix-overlay',
              'checkpoint_policy':'discard_if_implementation_binding_missing',
              'slot':'recovery',
          })
          hardening=trigger.get('hardening')
          if not isinstance(hardening,dict):
              hardening={}
          required=(
              'checkpoint_source_context_required','implementation_bound_checkpoint_required',
              'platform_specific_cta_required','platform_specific_voice_repair_required',
              'validated_voice_candidate_required','premium_voice_required',
              'concrete_failure_state_required','post_repair_checkpoint_required',
              'fresh_post_repair_audit_required','topic_aware_visual_repair_required',
              'actual_frame_semantics_required','semantic_voice_fact_terms_required',
              'request_bound_recovery_required','exact_source_request_pin_required',
              'telegram_review_video_required','provider_failure_must_not_reuse_stale_audit',
              'strict_visual_audit_required','strict_pronunciation_audit_required',
              'generic_visual_fallback_forbidden',
          )
          for key in required:
              hardening[key]=True
          hardening['quality_gates_weakened']=False
          trigger['hardening']=hardening
          trigger_path.write_text(json.dumps(trigger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/run-now/tayvoriq-x-request.json
          git commit -m "ops(tayvoriq): dispatch verified overlay replay ${REQUEST_ID}"
          git push origin HEAD:main

          new_run_id=''
          for poll in $(seq 1 30); do
            sleep 4
            gh run list --workflow tayvoriq-deliver-video-now.yml --limit 50 --json databaseId,createdAt,event > /tmp/overlay-replay-runs.json
            candidate=$(python - "$before_ids" "$dispatch_epoch" <<'PY'
          import json,sys
          from datetime import datetime
          before={int(v) for v in sys.argv[1].split() if v.isdigit()}; epoch=int(sys.argv[2]); found=[]
          for item in json.load(open('/tmp/overlay-replay-runs.json',encoding='utf-8')):
              try:
                  rid=int(item.get('databaseId') or 0)
                  created=datetime.fromisoformat(str(item.get('createdAt') or '').replace('Z','+00:00')).timestamp()
              except Exception:
                  continue
              if rid and rid not in before and created>=epoch-5:
                  found.append((created,rid))
          print(max(found)[1] if found else '')
          PY
            )
            if [[ "$candidate" =~ ^[0-9]+$ ]]; then new_run_id="$candidate"; break; fi
          done
          [[ "$new_run_id" =~ ^[0-9]+$ ]] || { echo 'AUTOCODEFIX_OVERLAY_REPLAY_RUN_NOT_FOUND'; exit 1; }

          rebound=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            git reset --hard origin/main
            python - "$ACTIVE_REQUEST_POINTER" "$REQUEST_FILE" "$REQUEST_ID" "$new_run_id" "$HANDOFF_BASE_SHA" "$PATCH_SHA256" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          pp=Path(sys.argv[1]); rp=Path(sys.argv[2]); rid=sys.argv[3]; new_run=int(sys.argv[4]); impl=sys.argv[5]; patch=sys.argv[6]
          pointer=json.loads(pp.read_text(encoding='utf-8')); request=json.loads(rp.read_text(encoding='utf-8'))
          codefix=request.get('codefix_recovery') if isinstance(request.get('codefix_recovery'),dict) else {}
          if str(pointer.get('request_id') or '')!=rid or str(request.get('request_id') or '')!=rid:
              raise SystemExit('AUTOCODEFIX_OVERLAY_BIND_OWNER_CHANGED')
          if codefix.get('status') not in {'ARMED','REPLAY_DISPATCHED'}:
              raise SystemExit('AUTOCODEFIX_OVERLAY_BIND_NOT_CODEFIX_BOUND')
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          old_run=int(request.get('golden_path_run_id') or 0)
          previous=list(request.get('previous_golden_path_run_ids') or [])
          if old_run and old_run not in previous: previous.append(old_run)
          request['previous_golden_path_run_ids']=previous[-20:]
          request['golden_path_run_id']=new_run
          request['status']='DISPATCHED'
          request['retry_of_run_id']=old_run
          request['replacement_reason']='VERIFIED_AUTOCODEFIX_OVERLAY_REPLAY'
          request['recovery_owner']='tayvoriq-autonomous-codefix-builder'
          request['recovery_dispatched_at']=now
          codefix.update({
              'status':'REPLAY_DISPATCHED','request_substate':'DISPATCHED',
              'replay_run_id':new_run,'replayed_at':now,
              'replay_implementation_sha':impl,
              'verified_overlay_patch_sha256':patch,
              'codefix_detection_reason':'verified-request-bound-overlay',
              'quality_gates_weakened':False,'active_pointer_verified':True,
          })
          request['codefix_recovery']=codefix
          request['state_history']=list(request.get('state_history') or [])+[{
              'state':'DISPATCHED','at':now,'actor':'tayvoriq-autonomous-codefix-builder',
              'meta':{'retry_of_run_id':old_run,'golden_path_run_id':new_run,
                      'reason':'verified-request-bound-autocodefix-overlay-replay',
                      'replay_implementation_sha':impl,'verified_overlay_patch_sha256':patch,
                      'quality_gates_weakened':False,'active_pointer_verified':True}
          }]
          rp.write_text(json.dumps(request,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pointer['golden_path_run_id']=new_run
          pointer['reason']='verified-autocodefix-overlay-replay'
          pointer['updated_at']=now
          pp.write_text(json.dumps(pointer,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            git add "$REQUEST_FILE" "$ACTIVE_REQUEST_POINTER"
            git commit -m "ops(tayvoriq): bind verified overlay replay ${REQUEST_ID} to ${new_run_id}"
            if git push origin HEAD:main; then rebound=true; break; fi
            sleep $((attempt*2))
          done
          [ "$rebound" = "true" ] || { echo 'AUTOCODEFIX_OVERLAY_REPLAY_BIND_FAILED'; exit 1; }
          echo "replay_dispatched=true" >> "$GITHUB_OUTPUT"
          echo "new_run_id=$new_run_id" >> "$GITHUB_OUTPUT"
          echo "AUTOCODEFIX_OVERLAY_REPLAY_BOUND:$REQUEST_ID:$new_run_id:$PATCH_SHA256"
