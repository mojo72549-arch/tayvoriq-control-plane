name: TAYVORIQ Episode2 Real Motion Hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/run-now/tayvoriq-episode2-hotfix.json

permissions:
  contents: read

concurrency:
  group: tayvoriq-episode2-real-motion-hotfix
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  visual-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Validate hotfix runtime
        shell: bash
        run: |
          set -euo pipefail
          for command in python ffmpeg ffprobe git; do
            command -v "$command" >/dev/null || { echo "HOTFIX_RUNTIME_MISSING:$command"; exit 1; }
          done
          test -n "$PEXELS_API_KEY" || { echo "PEXELS_API_KEY_MISSING"; exit 1; }
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "TELEGRAM_BOT_TOKEN_MISSING"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "TELEGRAM_CHAT_ID_MISSING"; exit 1; }
          python -m py_compile tools/tayvoriq_episode2_real_motion_hotfix.py

      - name: Build fresh real-motion masters
        shell: bash
        run: |
          set -euo pipefail
          python tools/tayvoriq_episode2_real_motion_hotfix.py \
            --pages-root pages-worktree \
            --old-review 32004854648 \
            --new-review "$GITHUB_RUN_ID" \
            | tee visual-hotfix-manifest.log

      - name: Assert rejected visuals cannot reappear
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_DIR="pages-worktree/tayvoriq/runs/${GITHUB_RUN_ID}"
          test -s "$REVIEW_DIR/short_youtube.mp4"
          test -s "$REVIEW_DIR/short_tiktok.mp4"
          test -s "$REVIEW_DIR/visual_hotfix_manifest.json"
          python - "$REVIEW_DIR/visual_hotfix_manifest.json" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d.get('old_render_reused') is False, d
          assert d.get('old_visual_assets_reused') is False, d
          assert d.get('generated_geology_animation') is False, d
          assert int(d.get('scene_count') or 0) == 7, d
          assert int(d.get('unique_provider_assets') or 0) == 7, d
          assert all((x or {}).get('source') in {'pexels_video','pexels_photo_kenburns'} for x in d.get('assets') or []), d
          assert d.get('youtube_upload_allowed_before_human_approval') is False, d
          print('REAL_MOTION_HOTFIX_GATE_PASSED')
          PY

      - name: Publish fresh review page
        shell: bash
        run: |
          set -euo pipefail
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add "tayvoriq/runs/${GITHUB_RUN_ID}" .nojekyll
          git commit -m "Publish TAYVORIQ real-motion review ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "REVIEW_PUSH_FAILED"
          exit 1

      - name: Send Telegram visual review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          token = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          chat_id = os.environ['TELEGRAM_CHAT_ID'].strip()
          review_id = os.environ['GITHUB_RUN_ID'].strip()
          review_url = f"https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/{review_id}/"
          text = (
              "<b>🟢 TAYVORIQ Visual-Hotfix ist bereit</b>\n\n"
              f"Review: <code>{review_id}</code>\n"
              "Die zuvor abgelehnten Erdbeben-Szenen wurden vollständig ersetzt. "
              "Der Sprechertext und die geprüften Fakten bleiben erhalten; der Bildstream besteht aus "
              "frischen Real-Motion-Clips bzw. hochwertig animierten Bildmotiven.\n\n"
              "Bitte öffne das Video und entscheide danach mit <b>Freigeben</b> oder <b>Ablehnen</b>."
          )
          payload = {
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": False,
              "reply_markup": {
                  "inline_keyboard": [
                      [{"text": "🎬 Review öffnen", "url": review_url}],
                      [
                          {"text": "✅ Freigeben", "callback_data": f"tayvoriq:approve:{review_id}"},
                          {"text": "❌ Ablehnen", "callback_data": f"tayvoriq:reject:{review_id}"},
                      ],
                  ]
              },
          }
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps(payload, ensure_ascii=False).encode('utf-8'),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode('utf-8'))
          if not result.get('ok') or not (result.get('result') or {}).get('message_id'):
              raise SystemExit(f"TELEGRAM_SEND_FAILED:{result}")
          print(f"TELEGRAM_VISUAL_REVIEW_SENT:{result['result']['message_id']}")
          PY
