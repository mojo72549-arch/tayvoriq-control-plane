name: Build MO FIT APK
on:
  push:
    branches:
      - mofit-apk-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mofit-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MO FIT v1.3 UI
        shell: bash
        run: |
          mkdir -p app/src/main/assets/ex
          echo '...CUT...AAA' | base64 -d | gunzip > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/ex/exercise-sprite.webp
          sed -i 's/versionCode 2/versionCode 3/' app/build.gradle
          sed -i 's/versionName "1.1"/versionName "1.3"/' app/build.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MO-FIT-v1.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MO-FIT-APK-v1.3
          path: mofit-apk/MO-FIT-v1.3.apk
          if-no-files-found: error
