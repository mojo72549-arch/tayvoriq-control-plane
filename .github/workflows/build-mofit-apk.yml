name: Build MO FIT V5 APK
on:
  push:
    branches:
      - mofit-v5-release
    paths-ignore:
      - 'mofit-apk/dist/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mofit-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and validate MO FIT V5
        shell: bash
        run: |
          test -s v5_ui.b64
          base64 -d v5_ui.b64 | gunzip > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/ex/exercise-sprite.webp
          grep -q 'MO FIT V5' app/src/main/assets/index.html
          grep -q 'exercise-sprite.webp' app/src/main/assets/index.html
          sed -i 's/applicationId "com.mofit.v4"/applicationId "com.mofit.v5"/' app/build.gradle
          sed -i 's/versionCode 400/versionCode 500/' app/build.gradle
          sed -i 's/versionName "4.0"/versionName "5.0.0"/' app/build.gradle
          grep -q 'applicationId "com.mofit.v5"' app/build.gradle
          grep -q 'versionCode 500' app/build.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep 'assets/ex/exercise-sprite.webp'
          unzip -p "$APK" assets/index.html | grep -q 'MO FIT V5'

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MO-FIT-V5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MO-FIT-V5-APK
          path: mofit-apk/MO-FIT-V5.apk
          if-no-files-found: error

      - name: Publish APK to branch
        run: |
          mkdir -p dist
          cp MO-FIT-V5.apk dist/MO-FIT-V5.apk
          echo "$GITHUB_RUN_ID" > dist/v5-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/MO-FIT-V5.apk dist/v5-run-id.txt
          git commit -m 'build: publish MO FIT V5 APK [skip ci]' || exit 0
          git push origin HEAD:mofit-v5-release
