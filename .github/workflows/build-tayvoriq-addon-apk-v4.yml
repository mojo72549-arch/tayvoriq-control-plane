name: Build TAYVORIQ Add-on APK v1.4.1

on:
  push:
    branches:
      - minecraft-addon-import-fix-v1.4.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compile Minecraft import fix APK
        working-directory: android-test-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify icon, Minecraft visibility, direct handoff and signature
        run: |
          APK="android-test-app/app/build/outputs/apk/debug/app-debug.apk"
          SRC="android-test-app/app/src/main/java/com/tayvoriq/addonmanager/FileImportActivity.java"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | tee manifest-tree.txt
          grep -q "application-icon-640" badging.txt
          grep -q "FileImportActivity" manifest-tree.txt
          grep -q "android.intent.action.VIEW" manifest-tree.txt
          grep -q "application/mcaddon" manifest-tree.txt
          grep -q "com.mojang.minecraftpe" manifest-tree.txt
          grep -Fq 'MINECRAFT_MAIN_ACTIVITY = "com.mojang.minecraftpe.MainActivity"' "$SRC"
          grep -Fq 'setComponent(new ComponentName(MINECRAFT_PACKAGE, MINECRAFT_MAIN_ACTIVITY))' "$SRC"
          grep -Fq 'legacyPackageIntent.setPackage(MINECRAFT_PACKAGE)' "$SRC"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p delivery
          cp "$APK" delivery/TAYVORIQ_Addon_Manager_Minecraft_Import_Fix_v1.4.1.apk
          sha256sum delivery/TAYVORIQ_Addon_Manager_Minecraft_Import_Fix_v1.4.1.apk > delivery/SHA256SUMS.txt
          cp badging.txt delivery/APK_BADGING.txt
          cp manifest-tree.txt delivery/APK_MANIFEST_TREE.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAYVORIQ-Addon-Manager-Minecraft-Import-Fix-v1.4.1
          path: delivery/*
          if-no-files-found: error
          retention-days: 7
