# Immediate verification requested for V5 soft-open-loop CTA budget candidate bd69ec26ce61.
name: TAYVORIQ Production Green Promoter

# Immediate verification requested for deterministic grouped-number voice guard 31c3cdf60939f8c7d3ef37b3e6d80f31c2f71990.

# Immediate verification requested for exact-number audit candidate a9c6844a77247a83036272d22a32a6f73679fa31.

# Immediate verification requested for exact grouped-thousand repair 5dcc13634270b79f67c0233b2a38f2c88ccb1552.

# Immediate verification requested for exact grouped-thousand voice repair bce1ed1f9d292c84e8179a4b935f433cb4160760.

# Recovery verification trigger: validate the current immutable Studio production ref.
# Immediate verification requested for grouped-number ASR alias fix b588a5f6ccd84a3cba423d46c55dcb3be91e513c.
# Immediate verification requested for grouped-number pronunciation fix 3581abcb190f58cc711ba1c6d186b2a559a88ab0.
# Immediate P0 verification requested for Studio candidate 6aa251ec4b750bae31f0263707410a6c5af6ed12 (explicit automotive visual typing).
# Immediate P0 verification requested for Studio candidate cc7cca17aeb686741aeb66fb41d30d8be6f46af8 (first-pass facts CTA automotive visuals).
# Immediate first-pass verification requested for Studio candidate cc7cca17aeb686741aeb66fb41d30d8be6f46af8.
# Immediate P0 verification requested for Studio candidate 2ab58897c357af29ea329cfed30b94c7a609899c (48k voice + automotive visuals).
# Immediate verification requested for acronym-ASR fix 36c9f6c6bffc4355f1a9f0c100fb06beca6bb9e3.
# Immediate replay-handler verification requested for Studio candidate bc8ea406c2ce909f63303b496eeab3e1746eb76e.
# Canonical production implementation currently lives on Studio's explicit
# feature/multi-platform-distribution-package production ref. Validate only that
# live ref until the runtime is deliberately migrated to Studio main.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-production-green-promoter.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-production-green-promoter.yml
  workflow_dispatch:
  # Slow failsafe only. Normal recovery is event-driven; this must not create
  # a five-minute Actions heartbeat when nothing changed.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: tayvoriq-production-green-promoter
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TAYVORIQ_CHATTERBOX_REQUIRED: "true"
      TAYVORIQ_TTS_PROVIDER: "chatterbox"
      TAYVORIQ_GREEN_POLICY_VERSION: "recovery-contract-v2"
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Checkout exact implementation candidate
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 0

      - name: Resolve immutable candidate and current green
        id: refs
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          readarray -t green_fields < <(python - <<'PY'
          import json
          from pathlib import Path
          path=Path('../.github/state/tayvoriq-production-green.json')
          if not path.is_file():
              raise SystemExit('PRODUCTION_GREEN_POINTER_MISSING')
          data=json.loads(path.read_text(encoding='utf-8'))
          if data.get('schema') != 'tayvoriq-production-green-v1':
              raise SystemExit('PRODUCTION_GREEN_POINTER_SCHEMA_INVALID')
          sha=str(data.get('implementation_sha') or '').strip().lower()
          if len(sha) != 40 or any(c not in '0123456789abcdef' for c in sha):
              raise SystemExit('PRODUCTION_GREEN_POINTER_SHA_INVALID')
          if data.get('full_preflight_passed') is not True or data.get('quality_gates_weakened') is not False:
              raise SystemExit('PRODUCTION_GREEN_POINTER_INTEGRITY_INVALID')
          print(sha)
          print(str(data.get('verification_policy_version') or ''))
          PY
          )
          current_green="${green_fields[0]:-}"
          current_policy="${green_fields[1]:-}"
          test -n "$candidate" || { echo "CANDIDATE_SHA_MISSING"; exit 1; }
          test -n "$current_green" || { echo "PRODUCTION_GREEN_POINTER_MISSING"; exit 1; }
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "current_green=$current_green" >> "$GITHUB_OUTPUT"
          echo "current_policy=$current_policy" >> "$GITHUB_OUTPUT"
          if [ "$candidate" = "$current_green" ] && [ "$current_policy" = "$TAYVORIQ_GREEN_POLICY_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "TAYVORIQ_PRODUCTION_GREEN_ALREADY_CURRENT:$candidate:policy=$current_policy"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "TAYVORIQ_PRODUCTION_GREEN_REVERIFY:$candidate current=$current_green policy=$current_policy required=$TAYVORIQ_GREEN_POLICY_VERSION"
          fi

      - name: Setup Python
        if: steps.refs.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: implementation/requirements.txt

      - name: Install fast-gate dependencies
        if: steps.refs.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for command in ffmpeg ffprobe rsync git; do
            command -v "$command" >/dev/null || missing+=("$command")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg rsync git
          fi
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          grep -vE '^[[:space:]]*chatterbox-tts[[:space:]]*@' implementation/requirements.txt > /tmp/tayvoriq-promoter-requirements.txt
          python -m pip install -r /tmp/tayvoriq-promoter-requirements.txt pytest -q

      - name: Fast request regression gate
        if: steps.refs.outputs.changed == 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.refs.outputs.candidate }}" || {
            echo "CANDIDATE_SHA_CHANGED_BEFORE_FAST_GATE"
            exit 1
          }
          python -m compileall -q tools tests
          if [ -d runtime_patches ]; then python -m compileall -q runtime_patches; fi
          python -m pytest -q \
            tests/test_tayvoriq_verified_request_causal_alignment.py \
            tests/test_tayvoriq_pronunciation_lexicon_v1.py \
            tests/test_tayvoriq_pronunciation_audit_contract.py \
            tests/test_tayvoriq_voice_v4_postmux.py \
            tests/test_tayvoriq_voice_v5_human_narrator.py

      - name: Exact Voice Work editorial regression gate
        if: steps.refs.outputs.changed == 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_tayvoriq_verified_source_editorial_v11.py::test_verified_source_accepts_bounded_causative_access_explanation             tests/test_tayvoriq_verified_source_editorial_v11.py::test_causative_gate_stays_narrow_for_non_explanatory_copy             tests/test_tayvoriq_lightweight_preflight_recovery_progress.py::test_lightweight_preflight_accepts_voice_work_causative_source

      - name: Install heavy voice verification dependencies
        if: steps.refs.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0" -q
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948" -q
          python - <<'PY'
          from pathlib import Path
          req=Path('/tmp/tayvoriq-promoter-requirements.txt').read_text(encoding='utf-8').casefold()
          assert 'chatterbox-tts' not in req
          print('TAYVORIQ_PROMOTER_CPU_DEPENDENCY_CONTRACT_READY')
          PY

      - name: Compile canonical production runtime
        if: steps.refs.outputs.changed == 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.refs.outputs.candidate }}" || {
            echo "CANDIDATE_SHA_CHANGED_BEFORE_PREFLIGHT"
            exit 1
          }
          python tools/tayvoriq_lightweight_preflight.py

      - name: Full production preflight
        if: steps.refs.outputs.changed == 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          python tools/tayvoriq_preflight_check.py --report-out out/control-plane/production-green-promotion.json
          python -m pytest -q \
            tests/test_tayvoriq_production_green_pin.py \
            tests/test_tayvoriq_verified_source_budget_guard.py \
            tests/test_tayvoriq_verified_request_causal_alignment.py \
            tests/test_tayvoriq_resume_publication_voice_recovery.py \
            tests/test_tayvoriq_checkpoint_resume_policy.py \
            tests/test_tayvoriq_semantic_voice_scope_regression.py \
            tests/test_tayvoriq_vw_visual_repair.py

      - name: Repeated-failure exact-request replay readiness gate
        if: steps.refs.outputs.changed == 'true'
        working-directory: implementation
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/implementation/tools:${{ github.workspace }}/implementation
          CANDIDATE_SHA: ${{ steps.refs.outputs.candidate }}
        run: |
          set -euo pipefail
          mkdir -p out/control-plane/replay-readiness
          active_pointer="../.github/state/tayvoriq-active-production-request.json"
          request="$(env -u PYTHONPATH python -I - "$active_pointer" <<'PY'
          import json,sys
          from pathlib import Path

          pointer_path=Path(sys.argv[1])
          if not pointer_path.is_file():
              print("")
              raise SystemExit(0)
          try:
              pointer=json.loads(pointer_path.read_text(encoding="utf-8"))
          except Exception:
              print("")
              raise SystemExit(0)
          request_id=str(pointer.get("request_id") or "").strip()
          if (
              pointer.get("schema")!="tayvoriq-active-production-request-v1"
              or pointer.get("state")!="ACTIVE"
              or not request_id
          ):
              print("")
              raise SystemExit(0)
          request_path=Path("../requests")/f"{request_id}.json"
          if not request_path.is_file():
              raise SystemExit(f"ACTIVE_REQUEST_FILE_MISSING:{request_path}")
          data=json.loads(request_path.read_text(encoding="utf-8"))
          recovery=data.get("codefix_recovery") if isinstance(data.get("codefix_recovery"),dict) else {}
          if (
              str(data.get("request_id") or "")!=request_id
              or str(data.get("status") or "")!="DISPATCHED"
              or recovery.get("status")!="ARMED"
              or recovery.get("request_substate")!="AWAITING_CODEFIX"
          ):
              print("")
              raise SystemExit(0)
          print(request_path)
          PY
          )"
          if [ -z "$request" ]; then
            echo "TAYVORIQ_REPLAY_READINESS:NO_ACTIVE_ARMED_OWNER"
            exit 0
          fi
          request_id="$(basename "$request" .json)"
          echo "TAYVORIQ_REPLAY_READINESS:ACTIVE_OWNER:$request_id"
          # An ARMED request has no current replay manifest yet by definition.
          # Verify the candidate's request-bound overlay handler and fail-closed
          # negative cases here; the exact live request+manifest proof runs in
          # Golden Path after the verified overlay is actually applied.
          python -m pytest -q tests/test_tayvoriq_replay_readiness_gate_v1.py
          env -u PYTHONPATH python -I - "$request" <<'PY'
          import json,os,re,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          recovery=data.get('codefix_recovery') if isinstance(data.get('codefix_recovery'),dict) else {}
          if recovery.get('status')!='ARMED' or recovery.get('request_substate')!='AWAITING_CODEFIX':
              raise SystemExit('PROMOTER_ACTIVE_REQUEST_NOT_ARMED')
          if recovery.get('quality_gates_weakened') is not False:
              raise SystemExit('PROMOTER_QUALITY_GATE_INTEGRITY_FAILED')

          candidate=str(os.environ.get('CANDIDATE_SHA') or '').strip().lower()
          failed_impl=str(recovery.get('failed_implementation_sha') or '').strip().lower()
          patch=str(recovery.get('verified_overlay_patch_sha256') or '').strip().lower()
          sha40=lambda value: re.fullmatch(r'[0-9a-f]{40}',value) is not None

          verified_studio_codefix=(
              sha40(candidate)
              and sha40(failed_impl)
              and candidate != failed_impl
          )
          verified_overlay=(
              re.fullmatch(r'[0-9a-f]{64}',patch) is not None
          )
          if not (verified_studio_codefix or verified_overlay):
              raise SystemExit(
                  'PROMOTER_NO_VERIFIED_RELEVANT_CODEFIX:'
                  f'candidate={candidate}:failed_impl={failed_impl}:overlay={bool(verified_overlay)}'
              )

          print(json.dumps({
              'request_id':data.get('request_id'),
              'candidate_handler_verified':True,
              'verification_mode':(
                  'new-studio-production-sha'
                  if verified_studio_codefix
                  else 'request-bound-overlay'
              ),
              'failed_implementation_sha':failed_impl or None,
              'candidate_implementation_sha':candidate,
              'verified_overlay_patch_sha256':patch or None,
              'quality_gates_weakened':False,
          },ensure_ascii=False))
          PY

      - name: Re-verify candidate did not move
        if: steps.refs.outputs.changed == 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          tested="${{ steps.refs.outputs.candidate }}"
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/feature/multi-platform-distribution-package | awk '{print $1}')"
          test "$local_sha" = "$tested" || { echo "TESTED_SHA_CHANGED:$local_sha:$tested"; exit 1; }
          test "$remote_sha" = "$tested" || { echo "STUDIO_PRODUCTION_REF_ADVANCED_DURING_PREFLIGHT:$remote_sha:$tested"; exit 1; }

      - name: Promote exact fully verified SHA in control plane
        if: steps.refs.outputs.changed == 'true'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.refs.outputs.candidate }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          sha=str(os.environ['CANDIDATE_SHA']).strip().lower()
          if len(sha) != 40 or any(c not in '0123456789abcdef' for c in sha):
              raise SystemExit('CANDIDATE_SHA_INVALID_BEFORE_PROMOTION')
          payload={
              'schema':'tayvoriq-production-green-v1',
              'implementation_repository':'mojo72549-arch/shorts-agent-studio',
              'implementation_sha':sha,
              'verified_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'verification_run_id':str(os.environ.get('GITHUB_RUN_ID') or ''),
              'verification_policy_version':str(os.environ.get('TAYVORIQ_GREEN_POLICY_VERSION') or ''),
              'full_preflight_passed':True,
              'quality_gates_weakened':False,
          }
          path=Path('.github/state/tayvoriq-production-green.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state/tayvoriq-production-green.json
          git diff --cached --quiet && { echo "PRODUCTION_GREEN_POINTER_ALREADY_CURRENT:$CANDIDATE_SHA"; exit 0; }
          git commit -m "ops(tayvoriq): promote verified production green ${CANDIDATE_SHA:0:12}"
          git push origin HEAD:main
          promoted="$(python -c 'import json; print(json.load(open(".github/state/tayvoriq-production-green.json"))["implementation_sha"])')"
          test "$promoted" = "$CANDIDATE_SHA" || {
            echo "PRODUCTION_GREEN_PROMOTION_NOT_VERIFIED:$promoted:$CANDIDATE_SHA"
            exit 1
          }
          echo "TAYVORIQ_PRODUCTION_GREEN_PROMOTED:$CANDIDATE_SHA"

      - name: Report verified Production Green state to Orchestrator
        shell: bash
        run: |
          set -euo pipefail
          echo "TAYVORIQ_PRODUCTION_GREEN_VERIFIED:${{ steps.refs.outputs.candidate }}:changed=${{ steps.refs.outputs.changed }}"
          echo "Lifecycle continuation is owned exclusively by TAYVORIQ Agent Orchestrator V2."
