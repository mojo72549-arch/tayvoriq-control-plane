name: TAYVORIQ Production Green Promoter

# Canonical production implementation currently lives on Studio's explicit
# feature/multi-platform-distribution-package production ref. Validate only that
# live ref until the runtime is deliberately migrated to Studio main.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-production-green-promoter.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-production-green-promoter.yml
  workflow_dispatch:
  # Slow failsafe only. Normal recovery is event-driven; this must not create
  # a five-minute Actions heartbeat when nothing changed.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: tayvoriq-production-green-promoter
  cancel-in-progress: true

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TAYVORIQ_CHATTERBOX_REQUIRED: "true"
      TAYVORIQ_TTS_PROVIDER: "chatterbox"
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Checkout exact implementation candidate
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 0

      - name: Resolve immutable candidate and current green
        id: refs
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          current_green="$(python - <<'PY'
          import json
          from pathlib import Path
          path=Path('../.github/state/tayvoriq-production-green.json')
          if not path.is_file():
              raise SystemExit('PRODUCTION_GREEN_POINTER_MISSING')
          data=json.loads(path.read_text(encoding='utf-8'))
          if data.get('schema') != 'tayvoriq-production-green-v1':
              raise SystemExit('PRODUCTION_GREEN_POINTER_SCHEMA_INVALID')
          sha=str(data.get('implementation_sha') or '').strip().lower()
          if len(sha) != 40 or any(c not in '0123456789abcdef' for c in sha):
              raise SystemExit('PRODUCTION_GREEN_POINTER_SHA_INVALID')
          if data.get('full_preflight_passed') is not True or data.get('quality_gates_weakened') is not False:
              raise SystemExit('PRODUCTION_GREEN_POINTER_INTEGRITY_INVALID')
          print(sha)
          PY
          )"
          test -n "$candidate" || { echo "CANDIDATE_SHA_MISSING"; exit 1; }
          test -n "$current_green" || { echo "PRODUCTION_GREEN_POINTER_MISSING"; exit 1; }
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "current_green=$current_green" >> "$GITHUB_OUTPUT"
          if [ "$candidate" = "$current_green" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "TAYVORIQ_PRODUCTION_GREEN_ALREADY_CURRENT:$candidate"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "TAYVORIQ_PRODUCTION_GREEN_CANDIDATE:$candidate current=$current_green"
          fi

      - name: Setup Python
        if: steps.refs.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic preflight dependencies
        if: steps.refs.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for command in ffmpeg ffprobe rsync git; do
            command -v "$command" >/dev/null || missing+=("$command")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg rsync git
          fi
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          grep -vE '^[[:space:]]*chatterbox-tts[[:space:]]*@' implementation/requirements.txt > /tmp/tayvoriq-promoter-requirements.txt
          python -m pip install --no-cache-dir -r /tmp/tayvoriq-promoter-requirements.txt pytest -q
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0" -q
          python -m pip install --no-cache-dir "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948" -q
          python - <<'PY'
          from pathlib import Path
          req=Path('/tmp/tayvoriq-promoter-requirements.txt').read_text(encoding='utf-8').casefold()
          assert 'chatterbox-tts' not in req
          print('TAYVORIQ_PROMOTER_CPU_DEPENDENCY_CONTRACT_READY')
          PY

      - name: Compile canonical production runtime
        if: steps.refs.outputs.changed == 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.refs.outputs.candidate }}" || {
            echo "CANDIDATE_SHA_CHANGED_BEFORE_PREFLIGHT"
            exit 1
          }
          python -m compileall -q tools tests
          if [ -d runtime_patches ]; then python -m compileall -q runtime_patches; fi
          python tools/tayvoriq_lightweight_preflight.py

      - name: Full production preflight
        if: steps.refs.outputs.changed == 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          python tools/tayvoriq_preflight_check.py --report-out out/control-plane/production-green-promotion.json
          python -m pytest -q \
            tests/test_tayvoriq_production_green_pin.py \
            tests/test_tayvoriq_verified_source_budget_guard.py \
            tests/test_tayvoriq_verified_request_causal_alignment.py

      - name: Re-verify candidate did not move
        if: steps.refs.outputs.changed == 'true'
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          tested="${{ steps.refs.outputs.candidate }}"
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/feature/multi-platform-distribution-package | awk '{print $1}')"
          test "$local_sha" = "$tested" || { echo "TESTED_SHA_CHANGED:$local_sha:$tested"; exit 1; }
          test "$remote_sha" = "$tested" || { echo "STUDIO_PRODUCTION_REF_ADVANCED_DURING_PREFLIGHT:$remote_sha:$tested"; exit 1; }

      - name: Promote exact fully verified SHA in control plane
        if: steps.refs.outputs.changed == 'true'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.refs.outputs.candidate }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          sha=str(os.environ['CANDIDATE_SHA']).strip().lower()
          if len(sha) != 40 or any(c not in '0123456789abcdef' for c in sha):
              raise SystemExit('CANDIDATE_SHA_INVALID_BEFORE_PROMOTION')
          payload={
              'schema':'tayvoriq-production-green-v1',
              'implementation_repository':'mojo72549-arch/shorts-agent-studio',
              'implementation_sha':sha,
              'verified_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'verification_run_id':str(os.environ.get('GITHUB_RUN_ID') or ''),
              'full_preflight_passed':True,
              'quality_gates_weakened':False,
          }
          path=Path('.github/state/tayvoriq-production-green.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state/tayvoriq-production-green.json
          git diff --cached --quiet && { echo "PRODUCTION_GREEN_POINTER_ALREADY_CURRENT:$CANDIDATE_SHA"; exit 0; }
          git commit -m "ops(tayvoriq): promote verified production green ${CANDIDATE_SHA:0:12}"
          git push origin HEAD:main
          promoted="$(python -c 'import json; print(json.load(open(".github/state/tayvoriq-production-green.json"))["implementation_sha"])')"
          test "$promoted" = "$CANDIDATE_SHA" || {
            echo "PRODUCTION_GREEN_PROMOTION_NOT_VERIFIED:$promoted:$CANDIDATE_SHA"
            exit 1
          }
          echo "TAYVORIQ_PRODUCTION_GREEN_PROMOTED:$CANDIDATE_SHA"

      - name: Report verified Production Green state to Orchestrator
        shell: bash
        run: |
          set -euo pipefail
          echo "TAYVORIQ_PRODUCTION_GREEN_VERIFIED:${{ steps.refs.outputs.candidate }}:changed=${{ steps.refs.outputs.changed }}"
          echo "Lifecycle continuation is owned exclusively by TAYVORIQ Agent Orchestrator V2."
