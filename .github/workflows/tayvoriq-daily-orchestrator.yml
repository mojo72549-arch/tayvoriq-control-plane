name: TAYVORIQ Daily Orchestrator

# Legacy/manual bridge. The authoritative twice-daily schedule lives in
# tayvoriq-agent-orchestrator-v2.yml and never starts production before approval.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Trend-Slot
        required: true
        default: morning
        type: choice
        options: [morning, evening]
  push:
    branches: [main]
    paths:
      - ".github/run-now/tayvoriq-daily-slot.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: tayvoriq-daily-orchestrator-manual-bridge
  cancel-in-progress: false

jobs:
  dispatch-agent-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Resolve requested trend slot
        id: slot
        env:
          INPUT_SLOT: ${{ inputs.slot || '' }}
        run: |
          set -euo pipefail
          slot="$INPUT_SLOT"
          if [ -z "$slot" ] && [ -f .github/run-now/tayvoriq-daily-slot.txt ]; then
            slot="$(sed -n 's/^slot=//p' .github/run-now/tayvoriq-daily-slot.txt | tail -n 1 | tr -d '\r' | xargs)"
          fi
          case "$slot" in
            morning|evening) ;;
            *) echo "::error title=Invalid trend slot::Expected morning or evening, got '$slot'"; exit 1 ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: Delegate slot to the authoritative Agent V2 trend gate
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          set -euo pipefail
          gh workflow run tayvoriq-agent-orchestrator-v2.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f slot="$SLOT"
          echo "Agent V2 trend gate dispatched for slot=$SLOT. No production starts before Telegram approval."
