name: TAYVORIQ Daily Orchestrator

# Legacy manual bridge only. The authoritative twice-daily schedule lives in
# tayvoriq-agent-orchestrator-v2.yml and never starts production before approval.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Trend-Slot
        required: true
        default: morning
        type: choice
        options: [morning, evening]

permissions:
  actions: write
  contents: read

concurrency:
  group: tayvoriq-daily-orchestrator-manual-bridge
  cancel-in-progress: false

jobs:
  dispatch-agent-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delegate manual slot to the authoritative Agent V2 trend gate
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          gh workflow run tayvoriq-agent-orchestrator-v2.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f slot="$SLOT"
          echo "Agent V2 trend gate dispatched for slot=$SLOT. No production starts before Telegram approval."
