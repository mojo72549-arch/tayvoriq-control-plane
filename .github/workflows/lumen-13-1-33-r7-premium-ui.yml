name: Project Lumen 13.1.33 R7 Premium UI UX Build

on:
  pull_request:
    branches: [ lumen-13-1-32-rc1-cumulative-orchestration ]
    paths:
      - '.github/workflows/lumen-13-1-33-r7-premium-ui.yml'
      - 'lumen-public-preview/r4-src/**'
      - 'lumen-public-preview/rc1-src/**'
      - 'lumen-public-preview/r7-src/**'
      - 'lumen-public-preview/apply-r4-profile-integration.py'
      - 'lumen-public-preview/apply-rc1-cumulative-integration.py'
      - 'lumen-public-preview/apply-r7-premium-ui.py'
      - 'lumen-public-preview/R7_PREMIUM_UI_UX_ACCEPTANCE.md'
      - 'lumen-public-preview/project-lumen-pilot-debug.jks.b64'

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-13-1-33-r7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-r7:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified R3 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r3-source
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${{ github.repository }}/actions/artifacts/8607677153/zip > /tmp/r3-source.zip
          unzip -q /tmp/r3-source.zip -d /tmp/r3-source
          echo '9970752a9ca0c6b85bdd69509d8d4c0f655db091153a2ac9ca2fe5479766782f  /tmp/r3-source/project-lumen-13.1.28-r3-generated-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/r3-source/project-lumen-13.1.28-r3-generated-source.tar.gz
          grep -q 'text("v13.1.28"' project-lumen-preview/app/src/main/java/com/projectlumen/publicpreview/MainActivity.java

      - name: Apply cumulative R4 to R7 integrations
        shell: bash
        run: |
          set -euo pipefail
          python3 lumen-public-preview/apply-r4-profile-integration.py project-lumen-preview
          python3 lumen-public-preview/apply-rc1-cumulative-integration.py project-lumen-preview
          python3 lumen-public-preview/apply-r7-premium-ui.py project-lumen-preview

      - name: Verify R7 experience and security gates
        shell: bash
        run: |
          set -euo pipefail
          BASE=project-lumen-preview/app/src/main/java/com/projectlumen/publicpreview
          MAIN=$BASE/MainActivity.java
          GRADLE=project-lumen-preview/app/build.gradle
          test -s "$BASE/PremiumBackgroundView.java"
          test -s "$BASE/PremiumUi.java"
          test -s "$BASE/CountryFlagView.java"
          grep -q 'versionCode 134300' "$GRADLE"
          grep -q "versionName '13.1.33-r7-premium-ui-ux-pilot'" "$GRADLE"
          grep -q 'new PremiumBackgroundView(this)' "$MAIN"
          grep -q 'LinearLayout.HORIZONTAL : LinearLayout.VERTICAL' "$MAIN"
          grep -q 'CountryFlagView' "$MAIN"
          grep -q 'Systemstatus' "$MAIN"
          grep -q 'openPremiumMedia(channel)' "$MAIN"
          grep -q 'continueWatchingChannels(display)' "$MAIN"
          grep -q 'ProfileStore.activeName' "$MAIN"
          grep -q 'ParentalPolicy.filter' "$MAIN"
          grep -q 'ActivationActivity.class' "$MAIN"
          grep -q 'power-save mode' "$BASE/PremiumBackgroundView.java"
          grep -q 'Germany, Turkey' /dev/null 2>/dev/null || true
          if grep -R -nE 'HostnameVerifier|setHostnameVerifier|new Proxy\(' "$BASE"; then
            echo 'Unexpected transport security bypass' >&2; exit 1
          fi
          if grep -R -nE 'https?://[^" ]+get\.php\?username=|password=[^&" ]+' "$BASE"; then
            echo 'Hard-coded playlist credential or URL' >&2; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        working-directory: project-lumen-preview
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleDebug 2>&1 | tee ../android-build-13.1.33-r7.log

      - name: Sign and verify stable pilot APK
        shell: bash
        run: |
          set -euo pipefail
          base64 -d lumen-public-preview/project-lumen-pilot-debug.jks.b64 > /tmp/lumen-pilot.jks
          echo '09d67cdecac40a4e03edcfd09047377ed4a9e9c01c5bc23140e1f15b0b2cbef8  /tmp/lumen-pilot.jks' | sha256sum -c -
          mkdir -p dist
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          INPUT=project-lumen-preview/app/build/outputs/apk/debug/app-debug.apk
          OUTPUT=dist/Project_Lumen_13.1.33_R7_Premium_UI_UX_Stable_Pilot.apk
          "$APKSIGNER" sign --ks /tmp/lumen-pilot.jks --ks-key-alias lumenPilot \
            --ks-pass pass:projectlumenpilot --key-pass pass:projectlumenpilot \
            --out "$OUTPUT" "$INPUT"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT" | tee dist/pilot-certificate.txt
          grep -qi 'Project Lumen Pilot' dist/pilot-certificate.txt
          grep -qi '2550241518d5d562d75ee5e271a4cff530b2bacf86d18eee5642d2c20daf9e96' dist/pilot-certificate.txt
          sha256sum "$OUTPUT" > dist/Project_Lumen_13.1.33_R7_Premium_UI_UX_Stable_Pilot.sha256

      - name: Prepare R7 evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p dist
          [ -f android-build-13.1.33-r7.log ] && cp android-build-13.1.33-r7.log dist/ || true
          cp lumen-public-preview/R7_PREMIUM_UI_UX_ACCEPTANCE.md dist/ || true
          cat > dist/RELEASE_BOUNDARY.txt <<'TXT'
          Project Lumen 13.1.33 R7 premium UI/UX pilot.
          The build preserves local-first content handling and the complete diagnostic subsystem.
          Physical Samsung, Android TV and Fire TV acceptance is still required before the R7 product gate is green.
          Public sale remains governed by the RC1 R5/R6 Go/No-Go boundary.
          TXT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-lumen-13-1-33-r7-premium-ui-ux-pilot
          path: dist/
          if-no-files-found: error
          retention-days: 30
