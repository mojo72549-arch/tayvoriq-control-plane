name: TAYVORIQ Dispatch Replay Hardening Contract

on:
  pull_request:
    paths:
      - ".github/workflows/tayvoriq-request-dispatch.yml"
      - ".github/workflows/tayvoriq-x-replay-start-guard.yml"
      - ".github/workflows/tayvoriq-dispatch-replay-hardening-contract.yml"
      - "tools/tayvoriq_telegram_progress_v1.py"
      - "tests/test_tayvoriq_dispatch_replay_hardening.py"
      - "tests/test_tayvoriq_telegram_progress_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-request-dispatch.yml"
      - ".github/workflows/tayvoriq-x-replay-start-guard.yml"
      - ".github/workflows/tayvoriq-dispatch-replay-hardening-contract.yml"
      - "tools/tayvoriq_telegram_progress_v1.py"
      - "tests/test_tayvoriq_dispatch_replay_hardening.py"
      - "tests/test_tayvoriq_telegram_progress_v1.py"

permissions:
  contents: read

jobs:
  hardening-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Compile hardening paths
        run: |
          set -euo pipefail
          python -m compileall -q tools tests
      - name: Run exact dispatch and replay regression contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_tayvoriq_dispatch_replay_hardening.py \
            tests/test_tayvoriq_telegram_progress_v1.py
