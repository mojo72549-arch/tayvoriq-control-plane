name: TAYVORIQ Isar Private Workflow Dispatch

on:
  push:
    branches: [main]
    paths:
      - '.automation/isar-private-workflow-dispatch.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tayvoriq-isar-private-workflow-dispatch
  cancel-in-progress: false

env:
  PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
  STUDIO_REPOSITORY: mojo72549-arch/shorts-agent-studio
  PRIVATE_WORKFLOW: tayvoriq-isar-checkpoint-resume.yml

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate locked dispatch request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.automation/isar-private-workflow-dispatch.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data.get('source_request_id') == 'isar-spectrum-20260909-pilot01'
          assert data.get('reuse_existing_checkpoint') is True
          assert data.get('publish_allowed') is False
          assert float(data.get('max_budget_usd')) == 1.75
          print('Locked private workflow dispatch request: OK')
          PY

      - name: Dispatch private checkpoint resume workflow
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PRIVATE_REPO_TOKEN:-}" || { echo '::error::PRIVATE_REPO_TOKEN missing'; exit 1; }
          code=$(curl -sS -o /tmp/dispatch-body.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $PRIVATE_REPO_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d '{"ref":"main","inputs":{"source_request_id":"isar-spectrum-20260909-pilot01"}}' \
            "https://api.github.com/repos/$STUDIO_REPOSITORY/actions/workflows/$PRIVATE_WORKFLOW/dispatches")
          if [ "$code" != '204' ]; then
            echo "::error::Private workflow_dispatch failed with HTTP $code"
            cat /tmp/dispatch-body.txt
            exit 1
          fi
          echo 'Private workflow_dispatch accepted (HTTP 204).'
          echo 'No GPU is started by this public bridge; private workflow must validate checkpoint and Thunder auth first.'
