name: TAYVORIQ Request Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - "requests/*.json"

permissions:
  actions: write
  contents: read

concurrency:
  group: tayvoriq-request-dispatch
  cancel-in-progress: false

jobs:
  dispatch-approved-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve changed approved request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^requests/.*\.json$' | tail -n 1 || true)
          if [ -z "$REQUEST_FILE" ]; then
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - "$REQUEST_FILE" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          request_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          data = json.loads(request_path.read_text(encoding="utf-8"))
          approved = str(data.get("status", "")).upper() in {
              "APPROVED",
              "TREND_APPROVED",
              "READY_FOR_PRODUCTION",
          }
          topic = str(data.get("topic") or "").replace("\n", " ").strip()
          scope = str(data.get("trend_scope") or "auto_scope").strip()
          request_id = str(data.get("request_id") or request_path.stem).strip()
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"approved={'true' if approved else 'false'}\n")
              handle.write(f"topic={topic}\n")
              handle.write(f"trend_scope={scope}\n")
              handle.write(f"request_id={request_id}\n")
          print({"request": request_id, "approved": approved, "scope": scope, "topic": topic})
          PY

      - name: Start TAYVORIQ Golden Path
        if: steps.request.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ steps.request.outputs.topic }}
          TREND_SCOPE: ${{ steps.request.outputs.trend_scope }}
        run: |
          set -euo pipefail
          gh workflow run tayvoriq-golden-path.yml \
            --ref main \
            -f mode=full \
            -f trend_scope="$TREND_SCOPE" \
            -f topic="$TOPIC"

      - name: Verify workflow dispatch accepted
        id: verify
        if: steps.request.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 8
          RUN_JSON=$(gh run list \
            --workflow tayvoriq-golden-path.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId,status,conclusion,url,createdAt)
          echo "$RUN_JSON"
          python - "$RUN_JSON" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          runs = json.loads(sys.argv[1])
          if not runs:
              raise SystemExit("Golden Path dispatch was not visible after acceptance")
          run = runs[0]
          if run.get("status") not in {"queued", "in_progress", "completed", "waiting", "pending"}:
              raise SystemExit(f"Unexpected Golden Path status: {run}")
          with open(sys.argv[2], "a", encoding="utf-8") as handle:
              handle.write(f"run_id={run['databaseId']}\n")
              handle.write(f"run_url={run['url']}\n")
              handle.write(f"run_status={run['status']}\n")
          print({"dispatch_verified": True, **run})
          PY

      - name: Send verified Telegram production-start message
        if: steps.request.outputs.approved == 'true' && steps.verify.outputs.run_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ steps.request.outputs.topic }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          RUN_ID: ${{ steps.verify.outputs.run_id }}
          RUN_URL: ${{ steps.verify.outputs.run_url }}
          RUN_STATUS: ${{ steps.verify.outputs.run_status }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚀 TAYVORIQ-Produktion gestartet\n\nThema: ${TOPIC}\nAuftrag: ${REQUEST_ID}\nGitHub-Run: ${RUN_ID}\nStatus: ${RUN_STATUS}\n\n${RUN_URL}" \
            --data-urlencode "disable_web_page_preview=true")
          echo "$RESPONSE"
          python - "$RESPONSE" <<'PY'
          import json
          import sys
          response = json.loads(sys.argv[1])
          if not response.get("ok"):
              raise SystemExit(f"Telegram send failed: {response}")
          message_id = response.get("result", {}).get("message_id")
          if not message_id:
              raise SystemExit(f"Telegram response has no message_id: {response}")
          print({"telegram_sent": True, "message_id": message_id})
          PY
