name: TAYVORIQ Request Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - "requests/*.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: tayvoriq-request-dispatch
  cancel-in-progress: false

jobs:
  dispatch-approved-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve approved request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE=""

          if [ "${{ github.event_name }}" = "push" ]; then
            REQUEST_FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^requests/.*\.json$' | tail -n 1 || true)
          fi

          if [ -z "$REQUEST_FILE" ]; then
            REQUEST_FILE=$(python - <<'PY'
          import json
          from pathlib import Path

          candidates = []
          for path in Path("requests").glob("*.json"):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              status = str(data.get("status") or "").upper()
              if status in {"APPROVED", "TREND_APPROVED", "READY_FOR_PRODUCTION"}:
                  candidates.append((path.stat().st_mtime, str(path)))
          print(max(candidates)[1] if candidates else "")
          PY
            )
          fi

          if [ -z "$REQUEST_FILE" ] || [ ! -f "$REQUEST_FILE" ]; then
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "No approved request is waiting."
            exit 0
          fi

          python - "$REQUEST_FILE" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          request_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          data = json.loads(request_path.read_text(encoding="utf-8"))
          approved = str(data.get("status", "")).upper() in {
              "APPROVED",
              "TREND_APPROVED",
              "READY_FOR_PRODUCTION",
          }
          topic = str(data.get("topic") or "").replace("\n", " ").strip()
          scope = str(data.get("trend_scope") or "auto_scope").strip()
          request_id = str(data.get("request_id") or request_path.stem).strip()
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"approved={'true' if approved else 'false'}\n")
              handle.write(f"request_file={request_path}\n")
              handle.write(f"topic={topic}\n")
              handle.write(f"trend_scope={scope}\n")
              handle.write(f"request_id={request_id}\n")
          print({"request": request_id, "approved": approved, "scope": scope, "topic": topic})
          PY

      - name: Start TAYVORIQ Golden Path
        id: dispatch
        if: steps.request.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ steps.request.outputs.topic }}
          TREND_SCOPE: ${{ steps.request.outputs.trend_scope }}
        run: |
          set -euo pipefail
          BEFORE=$(gh run list --workflow tayvoriq-golden-path.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run tayvoriq-golden-path.yml \
            --ref main \
            -f mode=full \
            -f trend_scope="$TREND_SCOPE" \
            -f topic="$TOPIC"

          RUN_ID=""
          for attempt in $(seq 1 12); do
            sleep 5
            RUN_ID=$(gh run list \
              --workflow tayvoriq-golden-path.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 5 \
              --json databaseId,status,conclusion,url,createdAt \
              --jq ".[] | select(.databaseId != $BEFORE) | .databaseId" | head -n 1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error title=Golden Path not started::No new workflow run became visible after dispatch"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Golden Path run $RUN_ID accepted."

      - name: Mark request dispatched
        if: steps.request.outputs.approved == 'true' && steps.dispatch.outcome == 'success'
        env:
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(os.environ["REQUEST_FILE"])
          data = json.loads(path.read_text(encoding="utf-8"))
          data["status"] = "DISPATCHED"
          data["golden_path_run_id"] = int(os.environ["RUN_ID"])
          data["dispatched_at"] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REQUEST_FILE"
          git commit -m "ops(tayvoriq): mark request dispatched to run $RUN_ID"
          git push origin main

      - name: Send dispatch failure to Telegram
        if: failure() && steps.request.outputs.approved == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          TEXT="❌ TAYVORIQ-Produktion konnte nicht gestartet werden.%0AAuftrag: ${REQUEST_ID}%0AFehlerstufe: Request Dispatcher%0ABitte GitHub Actions prüfen."
          curl --fail --silent --show-error \
            --request POST \
            --data "chat_id=${TELEGRAM_CHAT_ID}" \
            --data "text=${TEXT}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
