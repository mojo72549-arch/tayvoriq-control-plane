name: TAYVORIQ Request Dispatcher

on:
  repository_dispatch:
    types: [tayvoriq_trend_approved]
  push:
    branches: [main]
    paths:
      - "requests/*.json"
      - ".github/workflows/tayvoriq-request-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tayvoriq-request-dispatch
  cancel-in-progress: false

env:
  STUDIO_REPO: ${{ vars.TAYVORIQ_PRIVATE_REPO || 'mojo72549-arch/shorts-agent-studio' }}
  STUDIO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Resolve exactly one approved request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          TREND_ID: ${{ github.event.client_payload.trend_id || '' }}
          SELECTION_ID: ${{ github.event.client_payload.selection_id || '' }}
          DISPATCH_TOPIC: ${{ github.event.client_payload.topic || '' }}
          APPROVED_AT: ${{ github.event.client_payload.approved_at || '' }}
          TELEGRAM_MESSAGE_ID: ${{ github.event.client_payload.telegram_message_id || '' }}
        run: |
          set -euo pipefail
          REQUEST_FILE=""
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            test -n "$TELEGRAM_MESSAGE_ID" || { echo 'Missing Telegram message id'; exit 1; }
            TREND_REQUEST_FILE=$(python - <<'PY'
          import json,os,re
          from pathlib import Path
          selection=str(os.environ.get('SELECTION_ID') or '').strip()
          if not re.fullmatch(r'[A-Za-z0-9_-]{4,40}',selection): raise SystemExit('INVALID_SELECTION_ID')
          snapshot=Path(f'.automation/tayvoriq-agent-v2/selections/{selection}.json')
          canonical=Path('.github/run-now/tayvoriq-trend-request.json')
          if snapshot.is_file(): print(snapshot)
          elif canonical.is_file() and str(json.loads(canonical.read_text(encoding='utf-8')).get('selection_id') or '') == selection: print(canonical)
          else: raise SystemExit('SELECTION_SNAPSHOT_MISSING')
          PY
            )
            REQUEST_FILE=$(python tools/tayvoriq_orchestration_contract.py create-from-telegram \
              --trend-request "$TREND_REQUEST_FILE" \
              --trend-id "$TREND_ID" \
              --selection-id "$SELECTION_ID" \
              --message-id "$TELEGRAM_MESSAGE_ID" \
              --payload-topic "$DISPATCH_TOPIC" \
              --approved-at "$APPROVED_AT" \
              --out-dir requests)
          elif [ "$EVENT_NAME" = "push" ]; then
            REQUEST_FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^requests/.*\.json$' | tail -n 1 || true)
          else
            REQUEST_FILE=$(python - <<'PY'
          import json
          from pathlib import Path
          candidates=[]
          for p in Path('requests').glob('*.json'):
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
                  if str(d.get('status') or '').upper() in {'APPROVED','TREND_APPROVED','READY_FOR_PRODUCTION'}: candidates.append((p.stat().st_mtime,str(p)))
              except Exception: pass
          print(max(candidates)[1] if candidates else '')
          PY
            )
          fi
          if [ -z "$REQUEST_FILE" ] || [ ! -f "$REQUEST_FILE" ]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'No approved request waiting.'
            exit 0
          fi
          STATUS=$(python -c "import json; print(str(json.load(open('$REQUEST_FILE',encoding='utf-8')).get('status') or '').upper())")
          if [ "$STATUS" = "DISPATCHING" ] || [ "$STATUS" = "DISPATCHED" ]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo "Idempotent no-op: $REQUEST_FILE is $STATUS"
            exit 0
          fi
          python tools/tayvoriq_orchestration_contract.py validate "$REQUEST_FILE" --require-claimable
          python - "$REQUEST_FILE" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          with open(sys.argv[2],'a',encoding='utf-8') as h:
              h.write('eligible=true\n')
              h.write(f"request_file={sys.argv[1]}\n")
              h.write(f"request_id={d['request_id']}\n")
          PY

      - name: Atomically claim request
        if: steps.request.outputs.eligible == 'true'
        env:
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          cp "$REQUEST_FILE" /tmp/request.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          claimed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ ! -f "$REQUEST_FILE" ]; then mkdir -p "$(dirname "$REQUEST_FILE")"; cp /tmp/request.json "$REQUEST_FILE"; fi
            STATUS=$(python -c "import json; print(str(json.load(open('$REQUEST_FILE',encoding='utf-8')).get('status') or '').upper())")
            if [[ ! "$STATUS" =~ ^(APPROVED|TREND_APPROVED|READY_FOR_PRODUCTION)$ ]]; then
              echo "Request already claimed: $STATUS"; exit 0
            fi
            python tools/tayvoriq_orchestration_contract.py validate "$REQUEST_FILE" --require-claimable
            python tools/tayvoriq_orchestration_contract.py transition "$REQUEST_FILE" --to DISPATCHING --actor "request-dispatcher:${GITHUB_RUN_ID}" --meta "target_repo=${STUDIO_REPO}"
            git add "$REQUEST_FILE"; git commit -m "ops(tayvoriq): claim ${REQUEST_ID} for Studio"
            if git push origin HEAD:main; then claimed=true; break; fi
            sleep $((attempt * 2))
          done
          [ "$claimed" = true ] || exit 1

      - name: Validate Studio bridge credential
        if: steps.request.outputs.eligible == 'true'
        run: |
          test -n "$STUDIO_TOKEN" || { echo 'PRIVATE_REPO_TOKEN missing'; exit 2; }
          test -n "$STUDIO_REPO" || exit 2

      - name: Capture Studio run watermark
        if: steps.request.outputs.eligible == 'true'
        id: before
        run: |
          set -euo pipefail
          BEFORE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $STUDIO_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$STUDIO_REPO/actions/workflows/tayvoriq-approved-trend-golden-path.yml/runs?event=repository_dispatch&per_page=1" \
            | python -c "import json,sys; d=json.load(sys.stdin); print((d.get('workflow_runs') or [{}])[0].get('id') or 0)")
          echo "run_id=$BEFORE" >> "$GITHUB_OUTPUT"

      - name: Dispatch request to the single Studio production owner
        if: steps.request.outputs.eligible == 'true'
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          PAYLOAD=$(python - <<'PY'
          import json,os
          print(json.dumps({'event_type':'tayvoriq_produce_request','client_payload':{'source_request_id':os.environ['REQUEST_ID'],'control_repo':'mojo72549-arch/tayvoriq-control-plane','control_ref':'main','source':'request-dispatcher'}}))
          PY
          )
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $STUDIO_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$STUDIO_REPO/dispatches" -d "$PAYLOAD"

      - name: Bind request to the accepted Studio run
        if: steps.request.outputs.eligible == 'true'
        env:
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          BEFORE_RUN_ID: ${{ steps.before.outputs.run_id }}
        run: |
          set -euo pipefail
          STUDIO_RUN_ID=""
          for attempt in $(seq 1 15); do
            sleep 4
            STUDIO_RUN_ID=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $STUDIO_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$STUDIO_REPO/actions/workflows/tayvoriq-approved-trend-golden-path.yml/runs?event=repository_dispatch&per_page=10" \
              | python -c "import json,sys,os; b=int(os.environ['BEFORE_RUN_ID'] or 0); runs=json.load(sys.stdin).get('workflow_runs') or []; print(next((str(r['id']) for r in runs if int(r.get('id') or 0)>b),''))")
            [ -n "$STUDIO_RUN_ID" ] && break
          done
          [ -n "$STUDIO_RUN_ID" ] || { echo 'Studio accepted dispatch but run was not observable'; exit 1; }
          git pull --rebase origin main
          python tools/tayvoriq_orchestration_contract.py validate "$REQUEST_FILE"
          python tools/tayvoriq_orchestration_contract.py transition "$REQUEST_FILE" --to DISPATCHED --actor "request-dispatcher:${GITHUB_RUN_ID}" --meta "studio_run_id=${STUDIO_RUN_ID}" --meta "studio_repo=${STUDIO_REPO}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REQUEST_FILE"; git commit -m "ops(tayvoriq): bind ${REQUEST_ID} to Studio ${STUDIO_RUN_ID}"
          git push origin HEAD:main
          echo "BOUND_REQUEST=${REQUEST_ID} STUDIO_RUN=${STUDIO_RUN_ID}"

      - name: Mark dispatch failure without changing the topic
        if: failure() && steps.request.outputs.eligible == 'true'
        env:
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
        run: |
          set +e
          git pull --rebase origin main
          STATUS=$(python -c "import json; print(str(json.load(open('$REQUEST_FILE',encoding='utf-8')).get('status') or '').upper())" 2>/dev/null)
          if [ "$STATUS" = "DISPATCHING" ]; then
            python tools/tayvoriq_orchestration_contract.py transition "$REQUEST_FILE" --to DISPATCH_FAILED --actor "request-dispatcher:${GITHUB_RUN_ID}" --meta "reason=studio_dispatch_failed"
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$REQUEST_FILE"; git commit -m "ops(tayvoriq): record Studio dispatch failure" && git push origin HEAD:main
          fi
