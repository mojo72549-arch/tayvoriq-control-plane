name: TAYVORIQ Dispatch Current Delivery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tayvoriq-dispatch-current.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start current delivery workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run tayvoriq-deliver-video-now.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
