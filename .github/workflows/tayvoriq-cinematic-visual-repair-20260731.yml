name: TAYVORIQ Cinematic Visual Repair 2026-07-31

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-cinematic-visual-repair-20260731.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tayvoriq-cinematic-visual-repair-20260731
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "30623043649"
  SUPERSEDED_REVIEW_ID: "30637692047"
  SUPERSEDED_MESSAGE_ID: "178"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

jobs:
  rebuild-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate configuration
        run: |
          set -euo pipefail
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID PEXELS_API_KEY; do
            test -n "${!name:-}" || { echo "::error title=Missing secret::$name"; exit 1; }
          done

      - name: Install media tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip -q
          python -m pip install pillow -q

      - name: Download completed source production
        uses: actions/download-artifact@v4
        with:
          name: tayvoriq-today-final-${{ env.SOURCE_RUN_ID }}
          path: source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Locate source video and preserve approved audio
        run: |
          set -euo pipefail
          mkdir -p repaired
          cp -a source/out repaired/out
          python - <<'PY'
          import json, os
          from pathlib import Path

          state_path=Path('repaired/out/tayvoriq-review-state.json')
          state=json.loads(state_path.read_text(encoding='utf-8'))
          candidates=[]
          raw=Path(str(state.get('job_dir') or ''))
          if raw.parts and raw.parts[0]=='out':
              candidates.append(Path('repaired')/raw)
          candidates.extend(p.parent for p in Path('repaired/out').rglob('job.json'))
          job_dir=next((p for p in candidates if (p/'short_youtube.mp4').is_file()),None)
          if job_dir is None:
              raise SystemExit('Rendered source video not found')
          video=(job_dir/'short_youtube.mp4').resolve()
          if video.stat().st_size < 100000:
              raise SystemExit('Rendered source video is unexpectedly small')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write(f'REPAIRED_JOB_DIR={job_dir.resolve()}\n')
              handle.write(f'SOURCE_VIDEO={video}\n')
          print({'source_video':str(video),'bytes':video.stat().st_size})
          PY
          ffmpeg -y -loglevel error -i "$SOURCE_VIDEO" -vn -c:a aac -b:a 192k repaired/approved-audio.m4a
          test -s repaired/approved-audio.m4a

      - name: Download six real portrait scenes
        run: |
          set -euo pipefail
          mkdir -p repaired/clips
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib import parse, request

          api_key=os.environ['PEXELS_API_KEY'].strip()
          queries=[
              'European city extreme summer heat people walking',
              'thermometer hot sun summer close up',
              'elderly person drinking water heatwave',
              'family child cooling down summer heat',
              'person dizzy heat exhaustion first aid',
              'cold water shaded room fan summer heat',
          ]
          used_ids=set()
          manifest=[]
          out=Path('repaired/clips')

          def get_json(url):
              req=request.Request(url,headers={'Authorization':api_key,'User-Agent':'TAYVORIQ/1.0'})
              with request.urlopen(req,timeout=45) as response:
                  return json.loads(response.read().decode('utf-8'))

          def download(url,path):
              for attempt in range(3):
                  try:
                      req=request.Request(url,headers={'User-Agent':'TAYVORIQ/1.0'})
                      with request.urlopen(req,timeout=90) as response, path.open('wb') as handle:
                          while True:
                              chunk=response.read(1024*1024)
                              if not chunk:
                                  break
                              handle.write(chunk)
                      if path.stat().st_size > 500000:
                          return
                  except Exception:
                      if attempt==2:
                          raise
                      time.sleep(2+attempt)
              raise RuntimeError(f'Download failed: {url}')

          for index,query in enumerate(queries,1):
              url='https://api.pexels.com/videos/search?'+parse.urlencode({
                  'query':query,
                  'orientation':'portrait',
                  'size':'medium',
                  'per_page':30,
              })
              payload=get_json(url)
              candidates=[]
              for video in payload.get('videos',[]):
                  vid=int(video.get('id') or 0)
                  if not vid or vid in used_ids or float(video.get('duration') or 0)<3.0:
                      continue
                  for item in video.get('video_files',[]):
                      width=int(item.get('width') or 0)
                      height=int(item.get('height') or 0)
                      link=str(item.get('link') or '')
                      if not link or height<=width or width<540:
                          continue
                      score=(abs(width-1080),-width)
                      candidates.append((score,vid,width,height,link,video.get('url')))
              if not candidates:
                  raise SystemExit(f'No suitable portrait Pexels scene for: {query}')
              candidates.sort(key=lambda row:row[0])
              _,vid,width,height,link,page_url=candidates[0]
              used_ids.add(vid)
              target=out/f'scene_{index:02d}.mp4'
              download(link,target)
              manifest.append({
                  'scene':index,
                  'query':query,
                  'pexels_video_id':vid,
                  'source_page':page_url,
                  'width':width,
                  'height':height,
                  'file':str(target),
                  'bytes':target.stat().st_size,
              })
          Path('repaired/visual-manifest.json').write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print({'real_scenes':len(manifest),'unique_sources':len(used_ids)})
          PY

      - name: Build clean subtitles without internal labels
        run: |
          set -euo pipefail
          cat > repaired/captions.ass <<'ASS'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 0
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,DejaVu Sans,58,&H00FFFFFF,&H000000FF,&HCC000000,&H88000000,-1,0,0,0,100,100,0,0,1,5,1,2,75,75,250,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          Dialogue: 0,0:00:00.00,0:00:04.60,Default,,0,0,0,,Deutschland erlebt extreme Hitze\Nmit Temperaturen um vierzig Grad.
          Dialogue: 0,0:00:04.60,0:00:09.20,Default,,0,0,0,,Die Werte steigen, weil heiße Luft\Nund starke Sonne zusammenwirken.
          Dialogue: 0,0:00:09.20,0:00:14.30,Default,,0,0,0,,Gefährdet sind Kinder, Ältere, Kranke\Nund Beschäftigte im Freien.
          Dialogue: 0,0:00:14.30,0:00:19.10,Default,,0,0,0,,Kreislaufprobleme durch Hitze\Nkönnen schnell gefährlich werden.
          Dialogue: 0,0:00:19.10,0:00:25.40,Default,,0,0,0,,Reduziere Aufenthalte in der Hitze,\Ntrinke Wasser und suche einen kühlen Raum.
          Dialogue: 0,0:00:25.40,0:00:29.40,Default,,0,0,0,,Folge TAYVORIQ für verifizierte Warnlagen\Nund konkrete Schritte.
          ASS
          ! grep -Eiq 'trend.?check|schutz.?check|hitze.?update|quality.?gate' repaired/captions.ass

      - name: Render cinematic 9 by 16 video
        run: |
          set -euo pipefail
          durations=(4.60 4.60 5.10 4.80 6.30 4.00)
          mkdir -p repaired/segments
          for i in 1 2 3 4 5 6; do
            clip=$(printf 'repaired/clips/scene_%02d.mp4' "$i")
            out=$(printf 'repaired/segments/segment_%02d.mp4' "$i")
            dur=${durations[$((i-1))]}
            fade_out=$(python -c "print(max(0.1,float('$dur')-0.28))")
            ffmpeg -y -loglevel error -stream_loop -1 -i "$clip" -t "$dur" -an \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,eq=contrast=1.04:saturation=1.06,fade=t=in:st=0:d=0.22,fade=t=out:st=${fade_out}:d=0.28" \
              -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p "$out"
          done
          : > repaired/segments.txt
          for i in 1 2 3 4 5 6; do
            printf "file '%s'\n" "$(realpath $(printf 'repaired/segments/segment_%02d.mp4' "$i"))" >> repaired/segments.txt
          done
          ffmpeg -y -loglevel error -f concat -safe 0 -i repaired/segments.txt -c copy repaired/visual-only.mp4
          ffmpeg -y -loglevel error \
            -i repaired/visual-only.mp4 -i repaired/approved-audio.m4a \
            -vf "subtitles=repaired/captions.ass:fontsdir=/usr/share/fonts/truetype/dejavu" \
            -map 0:v:0 -map 1:a:0 -c:v libx264 -preset medium -crf 18 \
            -c:a aac -b:a 192k -shortest -movflags +faststart repaired/tayvoriq-cinematic-final.mp4
          test -s repaired/tayvoriq-cinematic-final.mp4

      - name: Run visual and technical quality gates
        run: |
          set -euo pipefail
          mkdir -p repaired/qa-frames
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration \
            -of json repaired/tayvoriq-cinematic-final.mp4 > repaired/ffprobe.json
          ffmpeg -y -loglevel error -i repaired/tayvoriq-cinematic-final.mp4 \
            -vf "select='eq(n,30)+eq(n,165)+eq(n,315)+eq(n,465)+eq(n,630)+eq(n,810)',scale=270:480" \
            -vsync 0 repaired/qa-frames/frame_%02d.jpg
          python - <<'PY'
          import json, statistics
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          probe=json.loads(Path('repaired/ffprobe.json').read_text())
          duration=float(probe['format']['duration'])
          streams=probe.get('streams',[])
          video=next(s for s in streams if s.get('codec_type')=='video')
          assert int(video.get('width') or 0)==1080,video
          assert int(video.get('height') or 0)==1920,video
          assert 28.5<=duration<=30.2,duration
          assert any(s.get('codec_type')=='audio' for s in streams),streams

          frames=sorted(Path('repaired/qa-frames').glob('*.jpg'))
          assert len(frames)>=6,len(frames)
          images=[Image.open(p).convert('RGB') for p in frames]
          means=[]
          contrast=[]
          for image in images:
              stat=ImageStat.Stat(image.convert('L'))
              means.append(stat.mean[0])
              contrast.append(stat.stddev[0])
          assert min(means)>18,means
          assert min(contrast)>12,contrast
          differences=[]
          for left,right in zip(images,images[1:]):
              differences.append(ImageStat.Stat(ImageChops.difference(left,right).convert('L')).mean[0])
          assert sum(value>8 for value in differences)>=4,differences
          report={
              'passed':True,
              'resolution':'1080x1920',
              'duration_seconds':duration,
              'real_scene_count':6,
              'unique_scene_transitions':sum(value>8 for value in differences),
              'frame_brightness':means,
              'frame_contrast':contrast,
              'frame_differences':differences,
              'internal_labels_removed':True,
              'approved_audio_reused':True,
          }
          Path('repaired/cinematic-quality-report.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(report)
          PY

      - name: Replace review videos and sanitize metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path

          job_dir=Path(os.environ['REPAIRED_JOB_DIR'])
          final=Path('repaired/tayvoriq-cinematic-final.mp4').resolve()
          for name in ('short_youtube.mp4','short_tiktok.mp4'):
              target=job_dir/name
              shutil.copy2(final,target)
          replacements={
              'Aktueller Trendcheck':'',
              'SCHUTZ-CHECK':'',
              'Schutz-Check':'',
              'TAYVORIQ · HITZE-UPDATE':'TAYVORIQ',
              'force_topic_safe_visual_cards": true':'force_topic_safe_visual_cards": false',
          }
          for path in job_dir.rglob('*'):
              if path.suffix.lower() not in {'.json','.txt','.srt','.ass','.html'} or not path.is_file():
                  continue
              try:
                  text=path.read_text(encoding='utf-8')
              except Exception:
                  continue
              updated=text
              for old,new in replacements.items():
                  updated=updated.replace(old,new)
              if updated!=text:
                  path.write_text(updated,encoding='utf-8')
          job_path=job_dir/'job.json'
          if job_path.exists():
              job=json.loads(job_path.read_text(encoding='utf-8'))
              job['cinematic_visual_repair']={
                  'passed':True,
                  'real_scene_count':6,
                  'internal_labels_removed':True,
                  'approved_audio_reused':True,
                  'quality_report':'cinematic-quality-report.json',
              }
              job_path.write_text(json.dumps(job,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          shutil.copy2('repaired/cinematic-quality-report.json',job_dir/'cinematic-quality-report.json')
          shutil.copy2('repaired/visual-manifest.json',job_dir/'visual-manifest.json')
          print({'replaced':True,'job_dir':str(job_dir)})
          PY

      - name: Register corrected review for approval buttons
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-control-review-${{ github.run_id }}
          path: repaired/out/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Invalidate superseded review
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageReplyMarkup" \
            -H 'Content-Type: application/json' \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"message_id\":${SUPERSEDED_MESSAGE_ID},\"reply_markup\":{\"inline_keyboard\":[]}}" \
            >/tmp/invalidate.json

      - name: Send corrected cinematic video to Telegram
        id: telegram
        run: |
          set -euo pipefail
          markup=$(python - <<'PY'
          import json, os
          run=os.environ['GITHUB_RUN_ID']
          print(json.dumps({
              'inline_keyboard':[[
                  {'text':'✅ Freigeben','callback_data':f'tayvoriqcp:approve:{run}'},
                  {'text':'❌ Ablehnen','callback_data':f'tayvoriqcp:reject:{run}'},
              ]]
          },ensure_ascii=False))
          PY
          )
          caption=$'🟢 Korrigierte TAYVORIQ-Version\n\n✅ echte bewegte Szenen\n✅ interne Prüftexte vollständig entfernt\n✅ freigegebene Erzählerstimme und Musik beibehalten\n✅ 1080 × 1920\n\nBitte das Video ansehen und danach Freigeben oder Ablehnen.'
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@repaired/tayvoriq-cinematic-final.mp4;type=video/mp4" \
            -F "caption=${caption}" \
            -F "supports_streaming=true" \
            -F "reply_markup=${markup}" \
            --output /tmp/telegram-response.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload=json.loads(Path('/tmp/telegram-response.json').read_text(encoding='utf-8'))
          if not payload.get('ok'):
              raise SystemExit(payload)
          message_id=payload['result']['message_id']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f'message_id={message_id}\n')
          print({'telegram_delivery':'confirmed','message_id':message_id,'approval_buttons':True})
          PY

      - name: Persist replacement and block old approval
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          state_path=Path('.automation/tayvoriq-control-telegram-state.json')
          try:
              state=json.loads(state_path.read_text(encoding='utf-8')) if state_path.exists() else {}
          except Exception:
              state={}
          state.setdefault('decisions',{})
          state['decisions'][os.environ['SUPERSEDED_REVIEW_ID']]={
              'status':'REJECTED',
              'processed_at':datetime.now(timezone.utc).isoformat(),
              'source':'superseded_by_cinematic_visual_repair',
          }
          state_path.parent.mkdir(parents=True,exist_ok=True)
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          delivery=Path('.automation/tayvoriq-control-deliveries')/f"{os.environ['GITHUB_RUN_ID']}.json"
          delivery.parent.mkdir(parents=True,exist_ok=True)
          delivery.write_text(json.dumps({
              'status':'DELIVERED_TO_TELEGRAM',
              'source_run_id':os.environ['SOURCE_RUN_ID'],
              'approval_run_id':os.environ['GITHUB_RUN_ID'],
              'telegram_message_id':os.environ.get('TELEGRAM_MESSAGE_ID',''),
              'visual_repair':'cinematic_real_scenes_v1',
              'supersedes_review_id':os.environ['SUPERSEDED_REVIEW_ID'],
              'quality_gate_passed':True,
              'delivered_at':datetime.now(timezone.utc).isoformat(),
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
        env:
          TELEGRAM_MESSAGE_ID: ${{ steps.telegram.outputs.message_id }}

      - name: Commit delivery state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/tayvoriq-control-telegram-state.json .automation/tayvoriq-control-deliveries
          git commit -m "ops: deliver corrected cinematic TAYVORIQ review ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin main

      - name: Upload cinematic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-cinematic-diagnostics-${{ github.run_id }}
          path: |
            repaired/cinematic-quality-report.json
            repaired/visual-manifest.json
            repaired/ffprobe.json
            repaired/qa-frames/**
            repaired/tayvoriq-cinematic-final.mp4
          if-no-files-found: warn
          retention-days: 30
