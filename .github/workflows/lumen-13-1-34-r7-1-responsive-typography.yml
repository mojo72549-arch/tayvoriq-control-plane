name: Project Lumen 13.1.34 R7.1 Responsive Typography Build

on:
  pull_request:
    branches: [ lumen-13-1-33-r7-premium-ui-ux ]
    paths:
      - '.github/workflows/lumen-13-1-34-r7-1-responsive-typography.yml'
      - 'lumen-public-preview/r3-source-inline.part*.b64'
      - 'lumen-public-preview/r4-src/**'
      - 'lumen-public-preview/rc1-src/**'
      - 'lumen-public-preview/r7-src/**'
      - 'lumen-public-preview/r7-1-src/**'
      - 'lumen-public-preview/apply-r4-profile-integration.py'
      - 'lumen-public-preview/apply-rc1-cumulative-integration.py'
      - 'lumen-public-preview/apply-r7-premium-ui.py'
      - 'lumen-public-preview/apply-r7-1-responsive-typography.py'
      - 'lumen-public-preview/R7_1_RESPONSIVE_TYPOGRAPHY_ACCEPTANCE.md'
      - 'lumen-public-preview/project-lumen-pilot-debug.jks.b64'

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-13-1-34-r7-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-r7-1:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Restore vendored and verified R3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/r3-source
          PARTS=(
            lumen-public-preview/r3-source-inline.part00.b64
            lumen-public-preview/r3-source-inline.part01a.b64
            lumen-public-preview/r3-source-inline.part01b.b64
            lumen-public-preview/r3-source-inline.part01c.b64
            lumen-public-preview/r3-source-inline.part02.b64
            lumen-public-preview/r3-source-inline.part03.b64
          )
          {
            echo 'R3 exact inline source parts:'
            wc -c "${PARTS[@]}"
          } | tee dist/source-restore-diagnostics.txt
          cat "${PARTS[@]}" | tr -d '[:space:]' > /tmp/r3-source.zip.b64
          wc -c /tmp/r3-source.zip.b64 | tee -a dist/source-restore-diagnostics.txt
          test "$(stat -c %s /tmp/r3-source.zip.b64)" = "71468"
          base64 -d /tmp/r3-source.zip.b64 > /tmp/r3-source.zip
          sha256sum /tmp/r3-source.zip | tee -a dist/source-restore-diagnostics.txt
          test "$(stat -c %s /tmp/r3-source.zip)" = "53600"
          echo '91f6a52769ed967c0a2f68ce14567fecaacc7580510465587022898f801e3e2e  /tmp/r3-source.zip' | sha256sum -c -
          unzip -t /tmp/r3-source.zip | tee -a dist/source-restore-diagnostics.txt
          unzip -q /tmp/r3-source.zip -d /tmp/r3-source
          sha256sum /tmp/r3-source/project-lumen-13.1.28-r3-generated-source.tar.gz | tee -a dist/source-restore-diagnostics.txt
          echo 'b49069866878a95d97ab19d5c6e8e66f8302a15c6beb83de25c8348e34af7c92  /tmp/r3-source/project-lumen-13.1.28-r3-generated-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/r3-source/project-lumen-13.1.28-r3-generated-source.tar.gz
          grep -q 'text("v13.1.28"' project-lumen-preview/app/src/main/java/com/projectlumen/publicpreview/MainActivity.java

      - name: Apply cumulative R4 through R7.1 integrations
        shell: bash
        run: |
          set -euo pipefail
          python3 lumen-public-preview/apply-r4-profile-integration.py project-lumen-preview
          python3 lumen-public-preview/apply-rc1-cumulative-integration.py project-lumen-preview
          python3 lumen-public-preview/apply-r7-premium-ui.py project-lumen-preview
          python3 lumen-public-preview/apply-r7-1-responsive-typography.py project-lumen-preview

      - name: Verify responsive experience and security gates
        shell: bash
        run: |
          set -euo pipefail
          BASE=project-lumen-preview/app/src/main/java/com/projectlumen/publicpreview
          MAIN=$BASE/MainActivity.java
          GRADLE=project-lumen-preview/app/build.gradle
          test -s "$BASE/ResponsiveUi.java"
          grep -q 'versionCode 134400' "$GRADLE"
          grep -q "versionName '13.1.34-r7.1-responsive-typography-pilot'" "$GRADLE"
          grep -q 'ResponsiveUi.singleLine(logo)' "$MAIN"
          grep -q 'int navHeight = compact ? 58' "$MAIN"
          grep -q 'premiumHero("Deine Medien", "Quelle hinzufügen und loslegen."' "$MAIN"
          grep -q 'ResponsiveUi.sp(this, 27, 30, 34, 36)' "$MAIN"
          grep -q 'tile.setMinimumHeight(dp(compact ? 84' "$MAIN"
          grep -q 'ProfileStore.activeName' "$MAIN"
          grep -q 'ParentalPolicy.filter' "$MAIN"
          grep -q 'Systemstatus' "$MAIN"
          grep -q 'ActivationActivity.class' "$MAIN"
          grep -q 'screenWidthDp' "$BASE/ResponsiveUi.java"
          grep -q 'HYPHENATION_FREQUENCY_NONE' "$BASE/ResponsiveUi.java"
          if grep -R -nE 'HostnameVerifier|setHostnameVerifier|new Proxy\(' "$BASE"; then
            echo 'Unexpected transport security bypass' >&2; exit 1
          fi
          if grep -R -nE 'https?://[^" ]+get\.php\?username=|password=[^&" ]+' "$BASE"; then
            echo 'Hard-coded playlist credential or URL' >&2; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        working-directory: project-lumen-preview
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleDebug 2>&1 | tee ../android-build-13.1.34-r7-1.log

      - name: Sign and verify stable pilot APK
        shell: bash
        run: |
          set -euo pipefail
          base64 -d lumen-public-preview/project-lumen-pilot-debug.jks.b64 > /tmp/lumen-pilot.jks
          echo '09d67cdecac40a4e03edcfd09047377ed4a9e9c01c5bc23140e1f15b0b2cbef8  /tmp/lumen-pilot.jks' | sha256sum -c -
          mkdir -p dist
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          INPUT=project-lumen-preview/app/build/outputs/apk/debug/app-debug.apk
          OUTPUT=dist/Project_Lumen_13.1.34_R7.1_Responsive_Typography_Stable_Pilot.apk
          "$APKSIGNER" sign --ks /tmp/lumen-pilot.jks --ks-key-alias lumenPilot \
            --ks-pass pass:projectlumenpilot --key-pass pass:projectlumenpilot \
            --out "$OUTPUT" "$INPUT"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT" | tee dist/pilot-certificate.txt
          grep -qi 'Project Lumen Pilot' dist/pilot-certificate.txt
          grep -qi '2550241518d5d562d75ee5e271a4cff530b2bacf86d18eee5642d2c20daf9e96' dist/pilot-certificate.txt
          sha256sum "$OUTPUT" > dist/Project_Lumen_13.1.34_R7.1_Responsive_Typography_Stable_Pilot.sha256

      - name: Prepare R7.1 evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p dist
          [ -f android-build-13.1.34-r7-1.log ] && cp android-build-13.1.34-r7-1.log dist/ || true
          cp lumen-public-preview/R7_1_RESPONSIVE_TYPOGRAPHY_ACCEPTANCE.md dist/ || true
          cat > dist/RELEASE_BOUNDARY.txt <<'TXT'
          Project Lumen 13.1.34 R7.1 responsive typography pilot.
          Compact-device layout and typography are statically integrated and compiled.
          Physical Samsung, font-scale, Android TV and Fire TV visual acceptance remains mandatory.
          Public sale remains governed by the existing R5/R6 Go/No-Go boundary.
          TXT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-lumen-13-1-34-r7-1-responsive-typography-pilot
          path: dist/
          if-no-files-found: error
          retention-days: 30
