name: TAYVORIQ Fire Safety Segment Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".automation/tayvoriq-fire-safety-segment-repair.json"
  pull_request:
    branches: [main]
    paths:
      - ".automation/tayvoriq-fire-safety-segment-repair.json"
      - ".github/workflows/tayvoriq-fire-safety-segment-repair.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: tayvoriq-fire-safety-segment-repair
  cancel-in-progress: false

jobs:
  repair-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
      EXPECTED_PRIVATE_HEAD: "8196cb8d2d0f8a97125a3284804f75b308549c06"
      SOURCE_RUN_ID: "30461580223"
      TAYVORIQ_TTS_PROVIDER: "chatterbox_v3"
      TAYVORIQ_CHATTERBOX_ENABLED: "true"
      TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
      TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
      TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "900"
      TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
      TAYVORIQ_DOCUMENTARY_TARGET_F0_HZ: "112"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            test -n "${!name:-}" || { echo "::error title=Missing secret::$name"; exit 2; }
          done

      - name: Checkout private repair implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: fix/deep-documentary-fire-safety-v29
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Verify exact private repair revision
        working-directory: implementation
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Private segment-repair revision: $actual"
          test "$actual" = "$EXPECTED_PRIVATE_HEAD"

      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Restore voice and transcription cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: tayvoriq-segment-repair-v1-chatterbox-v3-whisper-small-py311

      - name: Install repair dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -r implementation/requirements.txt pytest numpy edge-tts faster-whisper
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0"
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948"
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q rubberband

      - name: Validate targeted repair contract
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/tayvoriq_documentary_segment_repair_v1.py \
            tools/tayvoriq_speech_intelligibility_gate_v3.py \
            tools/tayvoriq_tts_router_v29.py
          python -m pytest -q \
            tests/test_tayvoriq_documentary_segment_repair_v1.py \
            tests/test_tayvoriq_fire_safety_documentary_v4.py \
            tests/test_tayvoriq_documentary_voice_gate_v29.py

      - name: Download completed V4.3 render artifact
        uses: actions/download-artifact@v4
        with:
          name: tayvoriq-review-30461580223
          path: source-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: mojo72549-arch/tayvoriq-control-plane
          run-id: 30461580223

      - name: Select matching deep narrator reference
        working-directory: implementation
        run: |
          set -euo pipefail
          mkdir -p out/documentary-reference
          python - <<'PY'
          import asyncio
          import json
          from pathlib import Path
          import edge_tts
          import tayvoriq_tts_router_v29 as router

          root = Path("out/documentary-reference").resolve()
          text = (
              "Ein ruhiger Erzähler spricht warm, tief und souverän. "
              "Er setzt klare Pausen, bleibt verständlich und erzählt ohne Hektik."
          )
          voices = ("de-DE-KillianNeural", "de-DE-ConradNeural")

          async def generate():
              reports = []
              for voice in voices:
                  target = root / f"{voice}.mp3"
                  try:
                      speaker = edge_tts.Communicate(
                          text=text, voice=voice, rate="-8%", pitch="-10Hz", volume="+0%"
                      )
                      await speaker.save(str(target))
                      reports.append({
                          "voice": voice,
                          "path": str(target),
                          "bytes": target.stat().st_size,
                          "metrics": router._voice_measurements(target),
                      })
                  except Exception as exc:
                      reports.append({"voice": voice, "error": f"{type(exc).__name__}: {exc}"})
              return reports

          reports = asyncio.run(generate())
          usable = [
              item for item in reports
              if "metrics" in item
              and 75 <= float(item["metrics"]["median_f0_hz"]) <= 155
              and float(item["metrics"]["pitch_span_hz"]) >= 10
          ]
          if not usable:
              raise SystemExit("No usable deep narrator reference: " + json.dumps(reports, ensure_ascii=False))
          selected = min(usable, key=lambda item: float(item["metrics"]["median_f0_hz"]))
          payload = {
              "selected": selected,
              "candidates": reports,
              "contract": "same-deep-timbre-reference-for-targeted-repair",
          }
          (root / "reference_selection.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          Path("../reference-env.txt").write_text(
              "TAYVORIQ_CHATTERBOX_REFERENCE_AUDIO=" + selected["path"] + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
          cat ../reference-env.txt >> "$GITHUB_ENV"

      - name: Repair only scenes four and six
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_documentary_segment_repair_v1.py \
            --artifact-root "${GITHUB_WORKSPACE}/source-artifact" \
            --out-dir "${GITHUB_WORKSPACE}/implementation/out/fire-safety-segment-repair" \
            --source-run-id "$SOURCE_RUN_ID"

      - name: Validate final repaired evidence
        working-directory: implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path("out/fire-safety-segment-repair")
          evidence = json.loads((root / "final_evidence.json").read_text(encoding="utf-8"))
          speech = json.loads((root / "speech_intelligibility_report.json").read_text(encoding="utf-8"))
          audio = json.loads((root / "audio_report.json").read_text(encoding="utf-8"))
          video = root / "short.mp4"
          failures = []
          if evidence.get("passed") is not True: failures.append("final_evidence_failed")
          if evidence.get("quality_passed") is not True: failures.append("quality_failed")
          if evidence.get("voice_passed") is not True: failures.append("voice_failed")
          if evidence.get("speech_passed") is not True: failures.append("speech_failed")
          if speech.get("passed") is not True: failures.append("full_transcription_failed")
          if not all(speech.get("required_concepts", {}).values()): failures.append("spoken_concept_missing")
          if audio.get("provider") != "chatterbox_multilingual_v3": failures.append("wrong_provider")
          if audio.get("fallback") is not False: failures.append("fallback_voice")
          if evidence.get("approval_status") != "PENDING_REVIEW": failures.append("approval_not_pending")
          if evidence.get("upload_status") != "NOT_STARTED_PENDING_APPROVAL": failures.append("upload_not_blocked")
          if not video.is_file() or video.stat().st_size < 500_000: failures.append("missing_mp4")
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=width,height:format=duration", "-of", "json", str(video)],
              capture_output=True, text=True, check=True,
          )
          print(probe.stdout)
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          if failures:
              raise SystemExit(", ".join(failures))
          PY

      - name: Upload repaired review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-review-${{ github.run_id }}
          path: |
            implementation/out/fire-safety-segment-repair/**
            implementation/out/documentary-reference/reference_selection.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish final review page
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          REVIEW_ID="${GITHUB_RUN_ID}"
          SOURCE="implementation/out/fire-safety-segment-repair"
          TARGET="pages-worktree/tayvoriq/runs/${REVIEW_ID}"
          mkdir -p "$TARGET"
          cp "$SOURCE/short.mp4" "$TARGET/tayvoriq-review.mp4"
          cp "$SOURCE/audio_report.json" "$TARGET/audio_report.json"
          cp "$SOURCE/quality_report.json" "$TARGET/quality_report.json"
          cp "$SOURCE/speech_intelligibility_report.json" "$TARGET/speech_intelligibility_report.json"
          cp "$SOURCE/text_package.json" "$TARGET/text_package.json"
          cp "$SOURCE/final_evidence.json" "$TARGET/final_evidence.json"
          cp "$SOURCE/segment_repair_report.json" "$TARGET/segment_repair_report.json"
          F0=$(jq -r '.voice_measurements.median_f0_hz' "$SOURCE/final_evidence.json")
          WPM=$(jq -r '.speaking_rate_wpm' "$SOURCE/final_evidence.json")
          SIMILARITY=$(jq -r '.speech_similarity' "$SOURCE/final_evidence.json")
          cat > "$TARGET/index.html" <<HTML
          <!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAYVORIQ Waldbrand Final Review</title><style>body{margin:0;background:#090b10;color:#fff;font-family:system-ui,sans-serif}main{max-width:620px;margin:auto;padding:24px}video{width:100%;max-height:78vh;background:#000;border-radius:18px}h1{font-size:1.4rem}.notice{padding:14px;border:1px solid #343947;border-radius:12px;background:#121620;color:#d3d7df;line-height:1.55}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.badge{padding:7px 10px;border-radius:999px;background:#163822;color:#baf7c9;font-weight:700;font-size:.88rem}a{color:#8fc8ff}</style></head><body><main><div class="badges"><span class="badge">Chatterbox V3 · kein Fallback</span><span class="badge">F0 ${F0} Hz</span><span class="badge">${WPM} Wörter/Min.</span><span class="badge">Sprachprüfung ${SIMILARITY}</span></div><h1>🔥 Waldbrand: So reagierst du richtig</h1><video controls playsinline preload="metadata" src="tayvoriq-review.mp4"></video><div class="notice"><strong>Noch nicht veröffentlicht.</strong><p>Die zwei zuvor fehlerhaften Sprechstellen wurden mit derselben tiefen Stimme separat neu erzeugt und vollständig transkribiert. Entscheide anschließend in Telegram mit „Freigeben“ oder „Ablehnen“.</p></div><p><a href="tayvoriq-review.mp4">Video direkt öffnen</a></p></main></body></html>
          HTML
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tayvoriq/runs/${REVIEW_ID}" .nojekyll
          git commit -m "Publish repaired TAYVORIQ review ${REVIEW_ID}"
          git push origin main

      - name: Wait for review page
        run: |
          set -euo pipefail
          REVIEW_URL="https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"
          for attempt in $(seq 1 30); do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$REVIEW_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Review page ready: $REVIEW_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Review page unavailable::$REVIEW_URL"
          exit 1

      - name: Send Telegram approval review
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/" \
            --review-id "${GITHUB_RUN_ID}" \
            --approval-mode manual

      - name: Confirm no platform upload
        run: |
          echo "Repaired documentary published only for human review."
          echo "No YouTube, TikTok or Instagram upload was performed."
