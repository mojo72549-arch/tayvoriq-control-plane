name: TAYVORIQ Contabo Research Verification
run-name: Verify complete platform ratings on live Contabo source pairs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-contabo-research-verification.yml
      - tools/tayvoriq_contabo_research.py
      - tools/tayvoriq_ollama_research.py
      - tools/tayvoriq_agent_research_resilience_v2.py
      - tools/tayvoriq_agent_trend_radar_v5.py

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STUDIO_RESEARCH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      STUDIO_RESEARCH_WAKE_TOKEN: ${{ secrets.PRIVATE_REPO_WAKE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TAYVORIQ_CONTABO_RESEARCH_ORIGIN: verification
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify research contracts offline
        run: |
          python3 -m unittest discover -s tests -p test_tayvoriq_ollama_research.py
          python3 -m unittest discover -s tests -p test_tayvoriq_local_research_article.py
      - name: Verify the live private research path without sending a selection
        run: |
          export TAYVORIQ_RESEARCH_SELECTION_ID TAYVORIQ_CONTROL_REVISION
          TAYVORIQ_RESEARCH_SELECTION_ID="$(TZ=Europe/Berlin date +%Y%m%d)-evening-agentv2-r${GITHUB_SHA:0:8}"
          TAYVORIQ_CONTROL_REVISION="$GITHUB_SHA"
          python3 tools/tayvoriq_contabo_research.py --slot evening \
            --output "$RUNNER_TEMP/researched-selection.json" --audit-output "$RUNNER_TEMP/researched-audit.json"
