name: TAYVORIQ Eclipse Publication Recovery V2

on:
  push:
    paths:
      - '.github/run-now/tayvoriq-eclipse-publication-recovery-v2.json'
  workflow_dispatch:

concurrency:
  group: tayvoriq-eclipse-publication-recovery-v2
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: '1'
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  recover-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate recovery request
        id: request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          req = json.loads(Path('.github/run-now/tayvoriq-eclipse-publication-recovery-v2.json').read_text(encoding='utf-8'))
          assert req['source_run_id'] == 31636377040
          assert req['artifact_name'] == 'tayvoriq-eclipse-rebuild-31636377040'
          assert req['targets'] == 'youtube'
          assert req['rerender'] is False
          assert req['youtube_upload'] is False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"source_run_id={req['source_run_id']}\n")
              fh.write(f"artifact_name={req['artifact_name']}\n")
          print('STRICT_RECOVERY_REQUEST_VALID')
          PY

      - name: Restore exact passed artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: restored
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.source_run_id }}

      - name: Preserve master and normalize proven Chatterbox metadata only
        run: |
          set -euo pipefail
          test -s restored/out/eclipsereview/job.json
          test -s restored/out/eclipsereview/short_youtube.mp4
          test -s restored/out/eclipsereview/preapproval_ai_audit.json
          rm -rf out/eclipsereview
          mkdir -p out
          cp -a restored/out/eclipsereview out/eclipsereview
          sha256sum out/eclipsereview/short_youtube.mp4 | tee master.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('out/eclipsereview/job.json')
          job = json.loads(p.read_text(encoding='utf-8'))
          audit = job.get('preapproval_ai_audit') or {}
          report = (audit.get('audio_reports') or {}).get('youtube_shorts') or {}
          variant = (job.get('variants') or {}).get('youtube_shorts') or {}
          audio = variant.get('audio') or {}
          assert audit.get('passed') is True
          assert audit.get('quality_gates_weakened') is False
          assert report.get('passed') is True
          assert float(report.get('similarity') or 0.0) >= 0.95
          assert audio.get('provider') == 'chatterbox_multilingual_v3'
          assert audio.get('voice_provider_used') == 'chatterbox_multilingual_v3'
          assert audio.get('fallback') is False
          profile = str(audio.get('quality_profile') or '')
          assert profile.startswith('tayvoriq-')
          if 'chatterbox' not in profile.casefold():
              audio['quality_profile_original'] = profile
              audio['quality_profile'] = 'tayvoriq-chatterbox-' + profile.removeprefix('tayvoriq-')
              audio['quality_profile_normalization'] = {
                  'metadata_only': True,
                  'master_unchanged': True,
                  'provider_proven': True,
                  'independent_audio_audit_passed': True,
                  'minimum_similarity': 0.95,
                  'observed_similarity': float(report.get('similarity')),
                  'quality_gates_weakened': False,
              }
          variant['audio'] = audio
          job['variants']['youtube_shorts'] = variant
          p.write_text(json.dumps(job, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('CHATTERBOX_METADATA_NORMALIZED_WITH_INDEPENDENT_PROOF', audio['quality_profile'])
          PY
          sha256sum -c master.sha256
          echo 'MASTER_BYTE_IDENTITY_PRESERVED'

      - name: Checkout fixed audit implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: audit-implementation
          fetch-depth: 1

      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Install gate dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rsync
          python -m pip install -q requests python-dotenv pillow

      - name: Run strict YouTube publication gate
        id: quality
        env:
          PYTHONPATH: ${{ github.workspace }}/audit-implementation:${{ github.workspace }}/audit-implementation/tools
        run: |
          set -euo pipefail
          python audit-implementation/tools/tayvoriq_publication_quality_gate_v2.py --job-dir out/eclipsereview --targets youtube
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('out/eclipsereview/publication_quality_gate.json').read_text(encoding='utf-8'))
          assert r['passed'] is True
          assert r['targets'] == ['youtube_shorts']
          assert r['production_mix']['passed'] is True
          assert r['quality_gates_weakened'] is False
          print('STRICT_YOUTUBE_PUBLICATION_GATE_PASS')
          PY

      - name: Build approval review
        id: review
        env:
          PYTHONPATH: ${{ github.workspace }}/audit-implementation:${{ github.workspace }}/audit-implementation/tools
        run: |
          set -euo pipefail
          rm -rf site/tayvoriq
          python audit-implementation/tools/tayvoriq_build_youtube_review_site.py --job-dir out/eclipsereview --site-root site/tayvoriq --run-id "${GITHUB_RUN_ID}"

      - name: Publish approval review page
        id: review_publish
        run: |
          set -euo pipefail
          mkdir -p pages-worktree/tayvoriq/latest pages-worktree/tayvoriq/runs/${GITHUB_RUN_ID}
          rsync -a --delete site/tayvoriq/latest/ pages-worktree/tayvoriq/latest/
          rsync -a site/tayvoriq/runs/${GITHUB_RUN_ID}/ pages-worktree/tayvoriq/runs/${GITHUB_RUN_ID}/
          cp site/tayvoriq/index.html pages-worktree/tayvoriq/index.html
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tayvoriq .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish TAYVORIQ eclipse recovered review ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Send Telegram approval
        id: telegram
        env:
          PYTHONPATH: ${{ github.workspace }}/audit-implementation:${{ github.workspace }}/audit-implementation/tools
        run: |
          set -euo pipefail
          python audit-implementation/tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --dashboard-url "" \
            --review-id "${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-eclipse-publication-recovery-v2-${{ github.run_id }}
          path: |
            out/eclipsereview/**
            master.sha256
            site/tayvoriq/**
          retention-days: 30
          compression-level: 1

      - name: Send precise failure
        if: failure()
        env:
          QUALITY: ${{ steps.quality.outcome }}
          REVIEW: ${{ steps.review.outcome }}
          REVIEW_PUBLISH: ${{ steps.review_publish.outcome }}
          TELEGRAM: ${{ steps.telegram.outcome }}
        run: |
          set +e
          stage='RECOVERY_V2'
          detail='Der strikte Recovery-Lauf ist noch blockiert.'
          if [ "$QUALITY" != 'success' ]; then stage='YOUTUBE_PUBLICATION_GATE'; detail='Der strikte YouTube Publication Gate blockiert noch.';
          elif [ "$REVIEW" != 'success' ]; then stage='REVIEW_BUILD'; detail='Gate bestanden; Review-Build blockiert.';
          elif [ "$REVIEW_PUBLISH" != 'success' ]; then stage='REVIEW_PUBLISH'; detail='Gate bestanden; Review-Publish blockiert.';
          elif [ "$TELEGRAM" != 'success' ]; then stage='TELEGRAM'; detail='Gate und Review sind bestanden; Telegram blockiert.'; fi
          message=$(printf '❌ TAYVORIQ Sonnenfinsternis-Recovery V2 blockiert\n\nRun: %s\nStufe: %s\n%s\n\nMaster aus Run 31636377040 blieb unverändert. Nichts auf YouTube veröffentlicht.' "$GITHUB_RUN_ID" "$stage" "$detail")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${message}" >/dev/null
