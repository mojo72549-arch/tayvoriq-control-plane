name: TAYVORIQ Heat Visual Candidate Audit 2026-07-31

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-heat-visual-candidate-audit-20260731.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

jobs:
  build-candidate-sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -q
          python -m pip install pillow -q

      - name: Build visual candidate sheets
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path
          from urllib import parse, request
          from PIL import Image, ImageDraw, ImageFont

          root=Path('candidate-audit')
          if root.exists():
              shutil.rmtree(root)
          root.mkdir(parents=True)
          api_key=os.environ['PEXELS_API_KEY'].strip()
          slots={
              'city_heat':{
                  'queries':['heatwave city people hot weather','people walking hot sun city'],
                  'anchors':['heat','hot','summer','sun','city','street','people'],
                  'exclude':['night','winter','snow','fire','empty'],
              },
              'child_heat':{
                  'queries':['child drinking water summer heat','children hot weather water'],
                  'anchors':['child','children','kid','boy','girl','water','summer','hot'],
                  'exclude':['night','winter','snow','empty'],
              },
              'heat_exhaustion':{
                  'queries':['sweating person hot summer','heat exhaustion person outdoors','woman wiping sweat hot weather'],
                  'anchors':['sweat','sweating','hot','heat','tired','exhausted','headache','person','woman','man'],
                  'exclude':['computer','office','night','party','dance','gym'],
              },
              'shade':{
                  'queries':['person sitting in shade hot summer','resting under tree shade summer'],
                  'anchors':['shade','shadow','tree','resting','sitting','summer','person'],
                  'exclude':['night','winter','empty','forest-walking'],
              },
              'cool_room':{
                  'queries':['person electric fan indoors hot summer','woman cooling with fan room'],
                  'anchors':['fan','cooling','cool','indoors','room','person','woman','man'],
                  'exclude':['soccer','football','celebrating','party','empty','outdoors'],
              },
              'warning_phone':{
                  'queries':['weather warning smartphone','emergency alert phone','weather app phone close up'],
                  'anchors':['weather','warning','alert','phone','smartphone','forecast','emergency'],
                  'exclude':['game','gaming','party','social-media','blank'],
              },
          }

          def search(query):
              args={'query':query,'per_page':80,'size':'medium'}
              url='https://api.pexels.com/videos/search?'+parse.urlencode(args)
              req=request.Request(url,headers={'Authorization':api_key,'User-Agent':'TAYVORIQ-Candidate-Audit/1.0'})
              with request.urlopen(req,timeout=45) as response:
                  return json.loads(response.read().decode('utf-8'))

          def download(url,path):
              req=request.Request(url,headers={'User-Agent':'TAYVORIQ-Candidate-Audit/1.0'})
              with request.urlopen(req,timeout=45) as response,path.open('wb') as handle:
                  handle.write(response.read())

          all_manifest={}
          for slot,spec in slots.items():
              by_id={}
              for query in spec['queries']:
                  for video in search(query).get('videos',[]):
                      video_id=int(video.get('id') or 0)
                      if not video_id:
                          continue
                      page=str(video.get('url') or '')
                      slug=page.rstrip('/').split('/')[-1].casefold()
                      words=set(re.findall(r'[a-z]+',slug))
                      if any(marker in words or marker in slug for marker in spec['exclude']):
                          continue
                      anchor=sum(1 for marker in spec['anchors'] if marker in words or marker in slug)
                      pictures=[str(item.get('picture') or '') for item in video.get('video_pictures',[]) if item.get('picture')]
                      files=[]
                      for item in video.get('video_files',[]):
                          width=int(item.get('width') or 0)
                          height=int(item.get('height') or 0)
                          link=str(item.get('link') or '')
                          if link and min(width,height)>=540:
                              files.append(((0 if height>width else 1,abs(width/max(1,height)-9/16),abs(max(width,height)-1920)),width,height,link))
                      if not pictures or not files:
                          continue
                      files.sort(key=lambda row:row[0])
                      _,width,height,link=files[0]
                      candidate={
                          'video_id':video_id,'page':page,'slug':slug,'anchor_score':anchor,
                          'duration':float(video.get('duration') or 0),'width':width,'height':height,
                          'video_file':link,'pictures':pictures,
                      }
                      current=by_id.get(video_id)
                      if current is None or candidate['anchor_score']>current['anchor_score']:
                          by_id[video_id]=candidate
              candidates=sorted(
                  by_id.values(),
                  key=lambda item:(-item['anchor_score'],0 if item['height']>item['width'] else 1,abs(item['width']/max(1,item['height'])-9/16))
              )[:6]
              if len(candidates)<3:
                  raise SystemExit(f'Not enough candidates for {slot}: {len(candidates)}')

              cell_w,cell_h=240,426
              sheet=Image.new('RGB',(cell_w*len(candidates),cell_h*2),(20,20,20))
              draw=ImageDraw.Draw(sheet)
              slot_dir=root/slot
              slot_dir.mkdir()
              for index,candidate in enumerate(candidates,1):
                  pics=candidate['pictures']
                  urls=[pics[0],pics[len(pics)//2]] if len(pics)>1 else [pics[0],pics[0]]
                  for row,url in enumerate(urls):
                      target=slot_dir/f'candidate_{index}_{row+1}.jpg'
                      download(url,target)
                      image=Image.open(target).convert('RGB')
                      image.thumbnail((cell_w,cell_h))
                      canvas=Image.new('RGB',(cell_w,cell_h),(0,0,0))
                      x=(cell_w-image.width)//2
                      y=(cell_h-image.height)//2
                      canvas.paste(image,(x,y))
                      sheet.paste(canvas,((index-1)*cell_w,row*cell_h))
                  x=(index-1)*cell_w
                  draw.rectangle((x+5,5,x+155,42),fill=(0,0,0))
                  draw.text((x+12,11),f'C{index} · ID {candidate["video_id"]}',fill=(255,255,255))
              sheet.save(root/f'{slot}-candidates.jpg',quality=94)
              for index,candidate in enumerate(candidates,1):
                  candidate['candidate']=f'C{index}'
              all_manifest[slot]=candidates

          (root/'candidate-manifest.json').write_text(json.dumps(all_manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print({slot:[item['video_id'] for item in items] for slot,items in all_manifest.items()})
          PY

      - name: Upload candidate audit
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-heat-candidate-audit-${{ github.run_id }}
          path: |
            candidate-audit/*-candidates.jpg
            candidate-audit/candidate-manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
