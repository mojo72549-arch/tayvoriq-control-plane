name: TAYVORIQ Root Cause V27 Migration

on:
  push:
    branches:
      - fix/root-cause-v27-contract-migration
    paths:
      - ".github/workflows/tayvoriq-root-cause-v27-migration.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-root-cause-v27-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private repository token
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: test -n "$PRIVATE_REPO_TOKEN"

      - name: Checkout private implementation root-fix branch
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: fix/v27-minimum-script-v38
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 0

      - name: Apply direct V27 canonical-package migration
        working-directory: implementation
        run: python tools/apply_v27_canonical_contract.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r implementation/requirements.txt pytest

      - name: Validate direct root fix through production import order
        working-directory: implementation
        run: |
          set -uo pipefail
          mkdir -p out/control-plane
          set +e
          {
            python -m compileall -q tools src &&
            python tools/tayvoriq_preflight_check.py \
              --report-out out/control-plane/preflight.json &&
            python -m pytest -q \
              tests/test_tayvoriq_v27_canonical_final_package.py \
              tests/test_tayvoriq_manual_review_contract_v30.py \
              tests/test_tayvoriq_bilger_audit_safe_v33.py
          } 2>&1 | tee out/control-plane/v27-root-fix.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error title=V27 root-fix validation::$(tail -n 30 out/control-plane/v27-root-fix.log | tr '\n' ' ' | cut -c1-3500)"
          fi
          exit "$code"

      - name: Upload compact root-fix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-v27-root-fix-${{ github.run_id }}
          path: |
            implementation/out/control-plane/v27-root-fix.log
            implementation/out/control-plane/preflight.json
          if-no-files-found: warn
          retention-days: 1

      - name: Commit validated direct fix to private branch
        working-directory: implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tayvoriq_dual_platform_render_v27.py
          if git diff --cached --quiet; then
            echo "Direct V27 fix already committed."
            exit 0
          fi
          git commit -m "fix(tayvoriq): make V27 the canonical final package"
          git push origin HEAD:fix/v27-minimum-script-v38
