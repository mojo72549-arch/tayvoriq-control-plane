name: TAYVORIQ Agent AutoRelease V2

on:
  workflow_run:
    workflows: ["TAYVORIQ-X Golden Path"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Golden-Path-Run-ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: tayvoriq-agent-autorelease-v2-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  autorelease:
    # Delivery Watch is the sole owner of failed-run recovery. AutoRelease only
    # handles a successful final generation (or an explicit manual audit).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Resolve V2 ownership
        id: owner
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          INPUT_RUN_ID: ${{ inputs.run_id || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          run_id=str(os.environ.get('EVENT_RUN_ID') or os.environ.get('INPUT_RUN_ID') or '').strip()
          if not run_id.isdigit(): raise SystemExit('invalid run id')
          conclusion=str(os.environ.get('EVENT_CONCLUSION') or '').strip()
          if not conclusion:
              conclusion=subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}','--jq','.conclusion // ""'],text=True).strip()
          source=None; retry_count=0
          for path in Path('requests').glob('*.json'):
              try: d=json.loads(path.read_text(encoding='utf-8'))
              except Exception: continue
              if str(d.get('golden_path_run_id') or '') == run_id and '-agentv2' in str(d.get('selection_id') or ''):
                  source={'request_path':str(path),'request':d}; break
          if source is None:
              map_path=Path(f'.automation/tayvoriq-agent-v2/run-map/{run_id}.json')
              if map_path.is_file():
                  m=json.loads(map_path.read_text(encoding='utf-8'))
                  source={'request_path':str(map_path),'request':m}; retry_count=int(m.get('retry_count') or 0)
          owned=source is not None
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write(f"owned={'true' if owned else 'false'}\nrun_id={run_id}\nconclusion={conclusion}\nretry_count={retry_count}\n")
              if owned:
                  d=source['request']
                  h.write(f"topic={str(d.get('topic') or '').replace(chr(10),' ')}\ntrend_id={str(d.get('trend_id') or '')}\nselection_id={str(d.get('selection_id') or '')}\nrequest_path={source['request_path']}\n")
          print({'run_id':run_id,'owned_by_v2':owned,'conclusion':conclusion,'retry_count':retry_count})
          PY

      - name: Ignore all non-V2 runs
        if: steps.owner.outputs.owned != 'true'
        run: echo "Run is not owned by Agent V2. Existing/manual behavior remains untouched."

      - name: Diagnose failed V2 production and notify
        id: diagnosis
        if: steps.owner.outputs.owned == 'true' && steps.owner.outputs.conclusion != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.owner.outputs.run_id }}
          TOPIC: ${{ steps.owner.outputs.topic }}
        run: |
          set +e
          gh run view "$RUN_ID" --log > /tmp/golden.log 2>/dev/null
          controller_line=$(grep -E 'Controller handoff: state=' /tmp/golden.log | tail -n 1 | sed -E 's/^.*Controller handoff:/Controller handoff:/' || true)
          production_line=$(grep -E 'Production is not publishable:' /tmp/golden.log | tail -n 1 | sed -E 's/^.*Production is not publishable:/Production is not publishable:/' || true)
          state=$(printf '%s\n' "$controller_line" | sed -nE 's/.*state=([A-Z0-9_]+).*/\1/p' | tail -n 1)
          [ -n "$state" ] || state="TECHNICAL_FAILURE"
          retryable=true
          case "$state" in
            CONTENT_REJECTED|SKIPPED_NO_PUBLISHABLE_TREND) retryable=false ;;
          esac
          case "$state" in
            TRANSIENT_RENDER_FAILURE) human="Render-/Skriptpfad konnte noch keinen sicheren Master erzeugen." ;;
            PUBLISHABLE_OUTPUT_RETRY_REQUIRED) human="Ein Produktionsartefakt existiert, aber mindestens ein lokales Freigabe-Gate ist noch offen." ;;
            PREFLIGHT_FAILED) human="Ein technischer Vorabcheck hat die Produktion vor dem Render blockiert." ;;
            CONTENT_REJECTED|SKIPPED_NO_PUBLISHABLE_TREND) human="Ein unverändertes Inhalts- oder Fakten-Gate hat den freigegebenen Inhalt blockiert." ;;
            *) human="Die Produktion ist technisch vor der sicheren Freigabe abgebrochen." ;;
          esac
          detail="$controller_line"
          [ -n "$production_line" ] && detail="${detail}${detail:+ | }${production_line}"
          detail=$(printf '%s' "$detail" | cut -c1-900)
          {
            echo "state=$state"
            echo "retryable=$retryable"
            echo "human=$human"
          } >> "$GITHUB_OUTPUT"
          text=$(printf '⚠️ TAYVORIQ Fehler erkannt\n\nThema: %s\nRun: %s\nStatus: %s\nUrsache: %s\n%s\n\nFür dich: ✅ Keine Aktion nötig – der Orchestrator übernimmt die technische Recovery.' "$TOPIC" "$RUN_ID" "$state" "$human" "$detail")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" >/dev/null || true
          exit 0

      - name: Bounded autonomous retry after failed V2 production
        if: steps.owner.outputs.owned == 'true' && steps.owner.outputs.conclusion != 'success' && steps.diagnosis.outputs.retryable == 'true' && fromJSON(steps.owner.outputs.retry_count) < 2
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ steps.owner.outputs.topic }}
          TREND_ID: ${{ steps.owner.outputs.trend_id }}
          SELECTION_ID: ${{ steps.owner.outputs.selection_id }}
          ROOT_RUN_ID: ${{ steps.owner.outputs.run_id }}
          RETRY_COUNT: ${{ steps.owner.outputs.retry_count }}
          DIAGNOSIS_STATE: ${{ steps.diagnosis.outputs.state }}
          DIAGNOSIS_HUMAN: ${{ steps.diagnosis.outputs.human }}
        run: |
          set -euo pipefail
          next_retry=$((RETRY_COUNT + 1))
          repair_text=$(printf '🔧 TAYVORIQ Reparatur gestartet\n\nFehlerklasse: %s\nBearbeitung: %s\nRecovery: %s/2\n\nDer bereits freigegebene Auftrag und seine Fakten bleiben erhalten. Der neue Produktionslauf wird vom aktuellen main-Stand gestartet.\n\nFür dich: ✅ Keine Aktion nötig.' "$DIAGNOSIS_STATE" "$DIAGNOSIS_HUMAN" "$next_retry")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${repair_text}" >/dev/null || true

          before=$(gh run list --workflow tayvoriq-deliver-video-now.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run tayvoriq-deliver-video-now.yml --repo "$GITHUB_REPOSITORY" --ref main -f topic="$TOPIC" -f trend_id="$TREND_ID"
          new=""
          for attempt in $(seq 1 18); do
            sleep 5
            new=$(gh run list --workflow tayvoriq-deliver-video-now.yml --branch main --event workflow_dispatch --limit 10 --json databaseId --jq ".[] | select(.databaseId > $before) | .databaseId" | head -n 1)
            [ -n "$new" ] && break
          done
          [ -n "$new" ] || { echo "retry run not found"; exit 1; }
          mkdir -p .automation/tayvoriq-agent-v2/run-map
          python - "$new" "$next_retry" <<'PY'
          import json, os, sys
          from pathlib import Path
          run=sys.argv[1]; retry_count=int(sys.argv[2])
          payload={'run_id':run,'root_run_id':os.environ['ROOT_RUN_ID'],'retry_count':retry_count,'selection_id':os.environ['SELECTION_ID'],'topic':os.environ['TOPIC'],'trend_id':os.environ['TREND_ID'],'agent_orchestrator':'v2'}
          Path(f'.automation/tayvoriq-agent-v2/run-map/{run}.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/tayvoriq-agent-v2/run-map/
          git commit -m "agent(v2): map recovery ${next_retry} run ${new}"
          git pull --rebase origin main
          git push origin HEAD:main
          restarted_text=$(printf '🔁 TAYVORIQ Produktion erneut gestartet\n\nRun: %s\nRecovery: %s/2\nThema: %s\n\nDer Fehlerpfad wurde übernommen; es wird nicht wieder bei der Trendauswahl begonnen.\n\nFür dich: ✅ Keine Aktion nötig.' "$new" "$next_retry" "$TOPIC")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${restarted_text}" >/dev/null || true

      - name: Stop only after safe recovery paths are exhausted
        if: steps.owner.outputs.owned == 'true' && steps.owner.outputs.conclusion != 'success' && (steps.diagnosis.outputs.retryable != 'true' || fromJSON(steps.owner.outputs.retry_count) >= 2)
        env:
          TOPIC: ${{ steps.owner.outputs.topic }}
          RUN_ID: ${{ steps.owner.outputs.run_id }}
          DIAGNOSIS_STATE: ${{ steps.diagnosis.outputs.state }}
          DIAGNOSIS_HUMAN: ${{ steps.diagnosis.outputs.human }}
          RETRYABLE: ${{ steps.diagnosis.outputs.retryable }}
        run: |
          if [ "$RETRYABLE" = "true" ]; then
            text=$(printf '🛑 TAYVORIQ finaler technischer Blocker\n\nThema: %s\nRun: %s\nStatus: %s\nUrsache: %s\n\nZwei sichere Recovery-Generationen wurden ausgeschöpft. Es wurde nichts veröffentlicht. Erst jetzt ist eine technische Prüfung erforderlich.' "$TOPIC" "$RUN_ID" "$DIAGNOSIS_STATE" "$DIAGNOSIS_HUMAN")
          else
            text=$(printf '🛑 TAYVORIQ Inhalts-/Fakten-Gate benötigt Entscheidung\n\nThema: %s\nRun: %s\nStatus: %s\nUrsache: %s\n\nDer Orchestrator verändert freigegebene Fakten nicht automatisch. Es wurde nichts veröffentlicht.' "$TOPIC" "$RUN_ID" "$DIAGNOSIS_STATE" "$DIAGNOSIS_HUMAN")
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" >/dev/null || true

      - name: Wait for verified review assets
        if: steps.owner.outputs.owned == 'true' && steps.owner.outputs.conclusion == 'success'
        env:
          RUN_ID: ${{ steps.owner.outputs.run_id }}
        run: |
          set -euo pipefail
          base="https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${RUN_ID}"
          ready=false
          for attempt in $(seq 1 15); do
            ok=true
            for file in job.json preapproval_ai_audit.json short_youtube.mp4 short_tiktok.mp4; do
              code=$(curl -L -s -o /dev/null -w '%{http_code}' "${base}/${file}" || true)
              [ "$code" = "200" ] || ok=false
            done
            if [ "$ok" = "true" ]; then ready=true; break; fi
            sleep 8
          done
          [ "$ready" = "true" ] || { echo "verified review assets unavailable"; exit 1; }
          curl -fsSL "${base}/job.json" -o /tmp/job.json
          curl -fsSL "${base}/preapproval_ai_audit.json" -o /tmp/audit.json

      - name: Independent V2 release gate
        if: steps.owner.outputs.owned == 'true' && steps.owner.outputs.conclusion == 'success'
        env:
          RUN_ID: ${{ steps.owner.outputs.run_id }}
        run: |
          python - <<'PY'
          import json, os
          job=json.load(open('/tmp/job.json',encoding='utf-8')); audit=json.load(open('/tmp/audit.json',encoding='utf-8'))
          quality=job.get('quality_report') if isinstance(job.get('quality_report'),dict) else {}
          assert quality.get('passed') is True, 'quality_report failed'
          assert audit.get('passed') is True, 'preapproval audit failed'
          assert audit.get('human_review_allowed') is True, 'review gate not passed'
          assert audit.get('quality_gates_weakened') is False, 'quality gate integrity invalid'
          assert not audit.get('blockers'), f"blockers={audit.get('blockers')}"
          print({'run_id':os.environ['RUN_ID'],'agent_v2_release_gate':'passed','quality_gates_weakened':False})
          PY

      - name: Preserve Telegram human approval gate
        if: steps.owner.outputs.owned == 'true' && steps.owner.outputs.conclusion == 'success'
        env:
          RUN_ID: ${{ steps.owner.outputs.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os

          job=json.load(open('/tmp/job.json',encoding='utf-8'))
          audit=json.load(open('/tmp/audit.json',encoding='utf-8'))
          assert audit.get('human_review_allowed') is True
          assert audit.get('quality_gates_weakened') is False
          print({
              'run_id': os.environ['RUN_ID'],
              'state': 'PENDING_TELEGRAM_VIDEO_APPROVAL',
              'telegram_review_buttons_preserved': True,
              'automatic_approval_created': False,
              'youtube_upload_started': False,
              'tiktok_delivery_started': False,
              'quality_gates_weakened': False,
          })
          PY
