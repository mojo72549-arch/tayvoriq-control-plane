name: TAYVORIQ Agent AutoRelease V2

on:
  workflow_run:
    workflows: ["TAYVORIQ-X Golden Path"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Golden-Path-Run-ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: tayvoriq-agent-autorelease-v2-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  autorelease:
    # Delivery Watch is the sole owner of failed-run recovery. AutoRelease only
    # handles a successful final generation (or an explicit manual audit).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Resolve V2 ownership
        id: owner
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          INPUT_RUN_ID: ${{ inputs.run_id || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          run_id=str(os.environ.get('EVENT_RUN_ID') or os.environ.get('INPUT_RUN_ID') or '').strip()
          if not run_id.isdigit(): raise SystemExit('invalid run id')
          conclusion=str(os.environ.get('EVENT_CONCLUSION') or '').strip()
          if not conclusion:
              conclusion=subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}','--jq','.conclusion // ""'],text=True).strip()
          source=None; retry_count=0
          for path in Path('requests').glob('*.json'):
              try: d=json.loads(path.read_text(encoding='utf-8'))
              except Exception: continue
              if str(d.get('golden_path_run_id') or '') == run_id and '-agentv2' in str(d.get('selection_id') or ''):
                  source={'request_path':str(path),'request':d}; break
          if source is None:
              map_path=Path(f'.automation/tayvoriq-agent-v2/run-map/{run_id}.json')
              if map_path.is_file():
                  m=json.loads(map_path.read_text(encoding='utf-8'))
                  source={'request_path':str(map_path),'request':m}; retry_count=int(m.get('retry_count') or 0)
          owned=source is not None
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write(f"owned={'true' if owned else 'false'}\nrun_id={run_id}\nconclusion={conclusion}\nretry_count={retry_count}\n")
              if owned:
                  d=source['request']
                  h.write(f"topic={str(d.get('topic') or '').replace(chr(10),' ')}\ntrend_id={str(d.get('trend_id') or '')}\nselection_id={str(d.get('selection_id') or '')}\nrequest_path={source['request_path']}\n")
          print({'run_id':run_id,'owned_by_v2':owned,'conclusion':conclusion,'retry_count':retry_count})
          PY

      - name: Ignore all non-V2 runs
        if: steps.owner.outputs.owned != 'true'
        run: echo "Run is not owned by Agent V2. Existing/manual behavior remains untouched."

      - name: Wait for verified review assets
        if: steps.owner.outputs.owned == 'true' && steps.owner.outputs.conclusion == 'success'
        env:
          RUN_ID: ${{ steps.owner.outputs.run_id }}
        run: |
          set -euo pipefail
          base="https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${RUN_ID}"
          ready=false
          for attempt in $(seq 1 15); do
            ok=true
            for file in job.json preapproval_ai_audit.json short_youtube.mp4 short_tiktok.mp4; do
              code=$(curl -L -s -o /dev/null -w '%{http_code}' "${base}/${file}" || true)
              [ "$code" = "200" ] || ok=false
            done
            if [ "$ok" = "true" ]; then ready=true; break; fi
            sleep 8
          done
          [ "$ready" = "true" ] || { echo "verified review assets unavailable"; exit 1; }
          curl -fsSL "${base}/job.json" -o /tmp/job.json
          curl -fsSL "${base}/preapproval_ai_audit.json" -o /tmp/audit.json

      - name: Independent V2 release gate
        if: steps.owner.outputs.owned == 'true' && steps.owner.outputs.conclusion == 'success'
        env:
          RUN_ID: ${{ steps.owner.outputs.run_id }}
        run: |
          python - <<'PY'
          import json, os
          job=json.load(open('/tmp/job.json',encoding='utf-8')); audit=json.load(open('/tmp/audit.json',encoding='utf-8'))
          quality=job.get('quality_report') if isinstance(job.get('quality_report'),dict) else {}
          assert quality.get('passed') is True, 'quality_report failed'
          assert audit.get('passed') is True, 'preapproval audit failed'
          assert audit.get('human_review_allowed') is True, 'review gate not passed'
          assert audit.get('quality_gates_weakened') is False, 'quality gate integrity invalid'
          assert not audit.get('blockers'), f"blockers={audit.get('blockers')}"
          print({'run_id':os.environ['RUN_ID'],'agent_v2_release_gate':'passed','quality_gates_weakened':False})
          PY

      - name: Preserve Telegram human approval gate
        if: steps.owner.outputs.owned == 'true' && steps.owner.outputs.conclusion == 'success'
        env:
          RUN_ID: ${{ steps.owner.outputs.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os

          job=json.load(open('/tmp/job.json',encoding='utf-8'))
          audit=json.load(open('/tmp/audit.json',encoding='utf-8'))
          assert audit.get('human_review_allowed') is True
          assert audit.get('quality_gates_weakened') is False
          print({
              'run_id': os.environ['RUN_ID'],
              'state': 'PENDING_TELEGRAM_VIDEO_APPROVAL',
              'telegram_review_buttons_preserved': True,
              'automatic_approval_created': False,
              'youtube_upload_started': False,
              'tiktok_delivery_started': False,
              'quality_gates_weakened': False,
          })
          PY
