name: TAYVORIQ Unified Telegram Decision Bridge V4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-telegram-decision-bridge.yml
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: tayvoriq-unified-telegram-callback-consumer
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
  STUDIO_REPOSITORY: "mojo72549-arch/shorts-agent-studio"

jobs:
  process-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Process all TAYVORIQ Telegram callbacks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token=os.environ.get('TELEGRAM_BOT_TOKEN','').strip()
          expected_chat=os.environ.get('TELEGRAM_CHAT_ID','').strip()
          control_token=os.environ.get('GH_TOKEN','').strip()
          private_token=os.environ.get('PRIVATE_REPO_TOKEN','').strip()
          repository=os.environ['GITHUB_REPOSITORY']
          studio_repository=os.environ.get('STUDIO_REPOSITORY','mojo72549-arch/shorts-agent-studio').strip()
          if not token or not expected_chat or not control_token or not private_token:
              raise SystemExit('Required Telegram/GitHub/private-repository configuration missing')

          state_path=Path('.automation/tayvoriq-telegram-decision-state.json')
          state={'next_update_id':0,'decisions':{}}
          if state_path.is_file():
              try:
                  loaded=json.loads(state_path.read_text(encoding='utf-8'))
                  if isinstance(loaded,dict):
                      state.update(loaded)
              except Exception:
                  pass
          state.setdefault('decisions',{})

          def telegram(method,payload):
              req=urllib.request.Request(
                  f'https://api.telegram.org/bot{token}/{method}',
                  data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),
                  headers={'Content-Type':'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req,timeout=35) as response:
                  value=json.loads(response.read().decode('utf-8'))
              if not value.get('ok'):
                  raise RuntimeError(value)
              return value.get('result')

          def github(method,url,payload=None,auth_token=None):
              body=None if payload is None else json.dumps(payload).encode('utf-8')
              req=urllib.request.Request(
                  url,
                  data=body,
                  headers={
                      'Authorization':f'Bearer {auth_token or control_token}',
                      'Accept':'application/vnd.github+json',
                      'X-GitHub-Api-Version':'2022-11-28',
                      'Content-Type':'application/json',
                  },
                  method=method,
              )
              with urllib.request.urlopen(req,timeout=35) as response:
                  raw=response.read()
              return json.loads(raw.decode('utf-8')) if raw else {}

          def artifact_exists(repo,review_id,expected_names,auth_token):
              try:
                  payload=github(
                      'GET',
                      f'https://api.github.com/repos/{repo}/actions/runs/{review_id}/artifacts',
                      auth_token=auth_token,
                  )
              except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError):
                  return False
              return any(
                  isinstance(item,dict)
                  and item.get('name') in expected_names
                  and not item.get('expired')
                  for item in payload.get('artifacts',[])
              )

          def control_artifact_exists(review_id):
              return artifact_exists(
                  repository,
                  review_id,
                  {f'tayvoriq-control-review-{review_id}'},
                  control_token,
              )

          def studio_artifact_exists(review_id):
              return artifact_exists(
                  studio_repository,
                  review_id,
                  {
                      f'tayvoriq-review-{review_id}',
                      f'tayvoriq-production-core-{review_id}',
                  },
                  private_token,
              )

          pattern=re.compile(r'^(tayvoriq|tayvoriq-direct|tayvoriqcp|tayvoriqtiktok):(approve|reject):(\d{6,})$')
          handled=0
          inspected=0

          for _ in range(10):
              updates=telegram('getUpdates',{
                  'offset':int(state.get('next_update_id') or 0),
                  'limit':100,
                  'timeout':0,
                  'allowed_updates':['callback_query'],
              }) or []
              if not updates:
                  break

              for update in updates:
                  inspected+=1
                  update_id=int(update.get('update_id') or 0)
                  state['next_update_id']=max(int(state.get('next_update_id') or 0),update_id+1)
                  callback=update.get('callback_query') if isinstance(update.get('callback_query'),dict) else {}
                  callback_id=str(callback.get('id') or '').strip()
                  match=pattern.fullmatch(str(callback.get('data') or '').strip())
                  if not callback_id or not match:
                      continue

                  namespace,action,review_id=match.groups()
                  message=callback.get('message') if isinstance(callback.get('message'),dict) else {}
                  chat=message.get('chat') if isinstance(message.get('chat'),dict) else {}
                  chat_id=str(chat.get('id') or '').strip()
                  message_id=int(message.get('message_id') or 0)
                  if chat_id != expected_chat:
                      telegram('answerCallbackQuery',{
                          'callback_query_id':callback_id,
                          'text':'Nicht autorisierter Chat.',
                          'show_alert':True,
                      })
                      continue

                  legacy_tiktok=namespace=='tayvoriqtiktok'
                  is_control=(not legacy_tiktok) and (namespace=='tayvoriqcp' or control_artifact_exists(review_id))
                  is_studio=(
                      not legacy_tiktok
                      and not is_control
                      and namespace in {'tayvoriq','tayvoriq-direct'}
                      and studio_artifact_exists(review_id)
                  )

                  if legacy_tiktok:
                      effective_namespace='tayvoriqtiktok'
                      review_path=Path(f'.automation/tayvoriq-tiktok-reviews/{review_id}.json')
                  elif is_control:
                      effective_namespace='tayvoriqcp'
                      review_path=Path(f'.automation/tayvoriq-control-reviews/{review_id}.json')
                  elif is_studio:
                      effective_namespace='tayvoriqstudio'
                      review_path=Path(f'.automation/tayvoriq-studio-reviews/{review_id}.json')
                  elif namespace=='tayvoriq-direct':
                      effective_namespace='tayvoriq-direct'
                      review_path=Path(f'.automation/tayvoriq-direct-reviews/{review_id}.json')
                  else:
                      effective_namespace='tayvoriq'
                      review_path=Path(f'.automation/tayvoriq-reviews/{review_id}.json')

                  review_path.parent.mkdir(parents=True,exist_ok=True)
                  try:
                      review=json.loads(review_path.read_text(encoding='utf-8')) if review_path.is_file() else {}
                  except Exception:
                      review={}

                  decision_key=f'{effective_namespace}:{review_id}'
                  previous=str(review.get('status') or state['decisions'].get(decision_key,{}).get('status') or '').upper()
                  if previous in {'APPROVED','REJECTED'}:
                      telegram('answerCallbackQuery',{
                          'callback_query_id':callback_id,
                          'text':'Diese Review wurde bereits verarbeitet.',
                      })
                      if message_id:
                          telegram('editMessageReplyMarkup',{
                              'chat_id':chat_id,
                              'message_id':message_id,
                              'reply_markup':{'inline_keyboard':[]},
                          })
                      continue

                  status='APPROVED' if action=='approve' else 'REJECTED'
                  dispatch_started=False
                  dispatch_target='none'
                  publication_capable=is_control or is_studio

                  if is_control and status=='APPROVED':
                      github('POST',f'https://api.github.com/repos/{repository}/dispatches',{
                          'event_type':'tayvoriq_control_publish_approved',
                          'client_payload':{
                              'review_run_id':review_id,
                              'youtube_privacy':'public',
                              'approval_source':'telegram_callback',
                              'telegram_message_id':str(message_id),
                              'deliver_tiktok_package':True,
                          },
                      },auth_token=control_token)
                      dispatch_started=True
                      dispatch_target=repository
                  elif is_studio and status=='APPROVED':
                      github('POST',f'https://api.github.com/repos/{studio_repository}/dispatches',{
                          'event_type':'tayvoriq_studio_publish_approved',
                          'client_payload':{
                              'review_run_id':review_id,
                              'youtube_privacy':'public',
                              'approval_source':'telegram_callback',
                              'telegram_message_id':str(message_id),
                              'deliver_tiktok_package':True,
                          },
                      },auth_token=private_token)
                      dispatch_started=True
                      dispatch_target=studio_repository

                  review.update({
                      'review_id':review_id,
                      'status':status,
                      'processed_at':datetime.now(timezone.utc).isoformat(),
                      'source':'telegram_callback',
                      'callback_namespace':namespace,
                      'effective_callback_namespace':effective_namespace,
                      'telegram_message_id':message_id,
                      'publication_pending':bool(publication_capable and status=='APPROVED'),
                      'youtube_privacy':'public' if publication_capable and status=='APPROVED' else review.get('youtube_privacy'),
                      'youtube_publish_dispatched':dispatch_started,
                      'publish_dispatch_target':dispatch_target,
                      'tiktok_package_pending':bool(publication_capable and status=='APPROVED'),
                      'tiktok_upload_mode':'manual',
                      'platform_upload_performed':False,
                  })
                  review_path.write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  state['decisions'][decision_key]=review

                  if publication_capable and status=='APPROVED':
                      callback_text='Freigabe erkannt: YouTube-Upload und TikTok-Paket starten.'
                  elif status=='APPROVED':
                      callback_text='Freigabe gespeichert.'
                  else:
                      callback_text='Review abgelehnt.'
                  telegram('answerCallbackQuery',{
                      'callback_query_id':callback_id,
                      'text':callback_text,
                  })

                  if message_id:
                      telegram('editMessageReplyMarkup',{
                          'chat_id':chat_id,
                          'message_id':message_id,
                          'reply_markup':{'inline_keyboard':[]},
                      })

                  if status=='REJECTED':
                      text=f'❌ TAYVORIQ Review {review_id} abgelehnt. Es wird nichts veröffentlicht.'
                  elif publication_capable:
                      text=(
                          '✅ Freigabe erkannt.\n\n'
                          f'Review: {review_id}\n'
                          '1. YouTube wird öffentlich hochgeladen.\n'
                          '2. Danach kommt das TikTok-Video als herunterladbare MP4-Datei.\n'
                          '3. Die TikTok-Caption steht direkt in derselben Telegram-Auslieferung.\n\n'
                          'Nach Abschluss folgt die Bestätigung mit dem YouTube-Link.'
                      )
                  elif legacy_tiktok:
                      caption=str(review.get('tiktok_caption') or '').strip()
                      text=(
                          '✅ TikTok-Freigabe gespeichert.\n\n'
                          'Caption zum Kopieren:\n'+caption
                      )
                  else:
                      text=(
                          f'⚠️ TAYVORIQ Review {review_id} freigegeben, aber das zugehörige '
                          'veröffentlichbare Artefakt wurde nicht gefunden. Es wurde nichts hochgeladen.'
                      )
                  telegram('sendMessage',{
                      'chat_id':expected_chat,
                      'text':text,
                      'disable_web_page_preview':True,
                  })
                  handled+=1

          state['last_checked_at']=datetime.now(timezone.utc).isoformat()
          state['last_handled_count']=handled
          state['last_inspected_count']=inspected
          state['consumer']='unified_v4'
          state_path.parent.mkdir(parents=True,exist_ok=True)
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print({
              'inspected':inspected,
              'handled':handled,
              'next_update_id':state.get('next_update_id'),
              'consumer':'unified_v4',
          })
          PY

      - name: Persist decisions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/tayvoriq-telegram-decision-state.json \
                  .automation/tayvoriq-reviews \
                  .automation/tayvoriq-direct-reviews \
                  .automation/tayvoriq-control-reviews \
                  .automation/tayvoriq-studio-reviews \
                  .automation/tayvoriq-tiktok-reviews 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record unified TAYVORIQ Telegram decision"
          git pull --rebase origin main
          git push origin main
