name: TAYVORIQ Telegram Decision Bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-telegram-decision-bridge.yml
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: tayvoriq-telegram-decision-bridge
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  process-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout decision repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Telegram secrets
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"

      - name: Process Telegram approval callbacks
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          expected_chat = os.environ["TELEGRAM_CHAT_ID"].strip()
          state_path = Path(".automation/tayvoriq-telegram-decision-state.json")
          state = {"next_update_id": 0, "decisions": {}}
          if state_path.exists():
              try:
                  loaded = json.loads(state_path.read_text(encoding="utf-8"))
                  if isinstance(loaded, dict):
                      state.update(loaded)
              except Exception:
                  pass

          def call(method, payload):
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=35) as response:
                  data = json.loads(response.read().decode("utf-8"))
              if not data.get("ok"):
                  raise RuntimeError(data)
              return data.get("result")

          updates = call(
              "getUpdates",
              {
                  "offset": int(state.get("next_update_id") or 0),
                  "limit": 100,
                  "timeout": 0,
                  "allowed_updates": ["callback_query"],
              },
          ) or []

          pattern = re.compile(r"^(tayvoriq(?:-direct)?):(approve|reject):(\d{6,})$")
          changed = False

          for update in updates:
              update_id = int(update.get("update_id") or 0)
              state["next_update_id"] = max(int(state.get("next_update_id") or 0), update_id + 1)

              callback = update.get("callback_query") or {}
              callback_id = str(callback.get("id") or "")
              match = pattern.fullmatch(str(callback.get("data") or ""))
              if not match:
                  continue

              namespace, action, review_id = match.groups()
              message = callback.get("message") or {}
              chat_id = str((message.get("chat") or {}).get("id") or "")
              message_id = int(message.get("message_id") or 0)

              if chat_id != expected_chat:
                  call(
                      "answerCallbackQuery",
                      {
                          "callback_query_id": callback_id,
                          "text": "Nicht autorisierter Chat.",
                          "show_alert": True,
                      },
                  )
                  continue

              direct_path = Path(f".automation/tayvoriq-direct-reviews/{review_id}.json")
              generic_path = Path(f".automation/tayvoriq-reviews/{review_id}.json")
              review_path = direct_path if direct_path.exists() else generic_path
              review_path.parent.mkdir(parents=True, exist_ok=True)

              if review_path.exists():
                  try:
                      review = json.loads(review_path.read_text(encoding="utf-8"))
                  except Exception:
                      review = {}
              else:
                  review = {
                      "review_id": review_id,
                      "status": "PENDING_REVIEW",
                      "telegram_message_id": message_id,
                      "platform_upload_performed": False,
                  }

              existing = str(review.get("status") or "")
              if existing in {"APPROVED", "REJECTED"}:
                  call(
                      "answerCallbackQuery",
                      {
                          "callback_query_id": callback_id,
                          "text": "Review bereits verarbeitet.",
                      },
                  )
                  continue

              status = "APPROVED" if action == "approve" else "REJECTED"
              review.update(
                  {
                      "review_id": review_id,
                      "status": status,
                      "processed_at": datetime.now(timezone.utc).isoformat(),
                      "source": "telegram_callback",
                      "callback_namespace": namespace,
                      "telegram_message_id": message_id,
                      "publication_pending": status == "APPROVED",
                      "platform_upload_performed": False,
                  }
              )
              review_path.write_text(
                  json.dumps(review, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              state.setdefault("decisions", {})[review_id] = review
              changed = True

              call(
                  "answerCallbackQuery",
                  {
                      "callback_query_id": callback_id,
                      "text": "Freigabe gespeichert." if status == "APPROVED" else "Review abgelehnt.",
                      "show_alert": False,
                  },
              )

              if message_id:
                  call(
                      "editMessageReplyMarkup",
                      {
                          "chat_id": chat_id,
                          "message_id": message_id,
                          "reply_markup": {"inline_keyboard": []},
                      },
                  )

              if status == "APPROVED":
                  text = (
                      f"✅ TAYVORIQ Review {review_id} freigegeben.\n\n"
                      "Deine Entscheidung wurde gespeichert. Das Video bleibt bis zum Publication-Gate gesperrt; "
                      "danach wird der freigegebene Upload gestartet."
                  )
              else:
                  text = f"❌ TAYVORIQ Review {review_id} abgelehnt. Es wird nichts veröffentlicht."
              call("sendMessage", {"chat_id": expected_chat, "text": text})

          state_path.parent.mkdir(parents=True, exist_ok=True)
          state["last_checked_at"] = datetime.now(timezone.utc).isoformat()
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"updates={len(updates)} changed={changed}")
          PY

      - name: Persist decisions
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/tayvoriq-telegram-decision-state.json \
                  .automation/tayvoriq-reviews \
                  .automation/tayvoriq-direct-reviews 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new Telegram decision."
            exit 0
          fi
          git commit -m "Record TAYVORIQ Telegram decision"
          git pull --rebase origin main
          git push origin main
