name: TAYVORIQ Unified Telegram Decision Bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-telegram-decision-bridge.yml
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: tayvoriq-unified-telegram-decision-bridge
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YOUTUBE_PRIVACY: "private"

jobs:
  process-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout decision repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Process all Telegram approval callbacks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          expected_chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          github_token = os.environ.get("GH_TOKEN", "").strip()
          repository = os.environ["GITHUB_REPOSITORY"]
          privacy = os.environ.get("YOUTUBE_PRIVACY", "private")
          if not token or not expected_chat or not github_token:
              raise SystemExit("Required Telegram/GitHub configuration missing")

          state_path = Path(".automation/tayvoriq-telegram-decision-state.json")
          state = {"next_update_id": 0, "decisions": {}}
          if state_path.exists():
              try:
                  loaded = json.loads(state_path.read_text(encoding="utf-8"))
                  if isinstance(loaded, dict):
                      state.update(loaded)
              except Exception:
                  pass
          state.setdefault("decisions", {})

          def telegram(method, payload):
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=35) as response:
                  value = json.loads(response.read().decode("utf-8"))
              if not value.get("ok"):
                  raise RuntimeError(value)
              return value.get("result")

          def github(method, url, payload=None):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=body,
                  headers={
                      "Authorization": f"Bearer {github_token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=35) as response:
                  raw = response.read()
              return json.loads(raw.decode("utf-8")) if raw else {}

          updates = telegram(
              "getUpdates",
              {
                  "offset": int(state.get("next_update_id") or 0),
                  "limit": 100,
                  "timeout": 0,
                  "allowed_updates": ["callback_query"],
              },
          ) or []

          pattern = re.compile(r"^(tayvoriq|tayvoriq-direct|tayvoriqcp):(approve|reject):(\d{6,})$")
          handled = 0

          for update in updates:
              update_id = int(update.get("update_id") or 0)
              state["next_update_id"] = max(int(state.get("next_update_id") or 0), update_id + 1)

              callback = update.get("callback_query") if isinstance(update.get("callback_query"), dict) else {}
              callback_id = str(callback.get("id") or "").strip()
              callback_data = str(callback.get("data") or "").strip()
              match = pattern.fullmatch(callback_data)
              if not callback_id or not match:
                  continue

              namespace, action, review_id = match.groups()
              message = callback.get("message") if isinstance(callback.get("message"), dict) else {}
              chat = message.get("chat") if isinstance(message.get("chat"), dict) else {}
              chat_id = str(chat.get("id") or "").strip()
              message_id = int(message.get("message_id") or 0)

              if chat_id != expected_chat:
                  telegram("answerCallbackQuery", {
                      "callback_query_id": callback_id,
                      "text": "Nicht autorisierter Chat.",
                      "show_alert": True,
                  })
                  continue

              if namespace == "tayvoriqcp":
                  review_path = Path(f".automation/tayvoriq-control-reviews/{review_id}.json")
              elif namespace == "tayvoriq-direct":
                  review_path = Path(f".automation/tayvoriq-direct-reviews/{review_id}.json")
              else:
                  review_path = Path(f".automation/tayvoriq-reviews/{review_id}.json")
              review_path.parent.mkdir(parents=True, exist_ok=True)

              try:
                  review = json.loads(review_path.read_text(encoding="utf-8")) if review_path.exists() else {}
              except Exception:
                  review = {}
              previous = str(review.get("status") or state["decisions"].get(review_id, {}).get("status") or "").upper()
              if previous in {"APPROVED", "REJECTED"}:
                  telegram("answerCallbackQuery", {
                      "callback_query_id": callback_id,
                      "text": "Diese Review wurde bereits verarbeitet.",
                  })
                  if message_id:
                      telegram("editMessageReplyMarkup", {
                          "chat_id": chat_id,
                          "message_id": message_id,
                          "reply_markup": {"inline_keyboard": []},
                      })
                  continue

              now = datetime.now(timezone.utc).isoformat()
              status = "APPROVED" if action == "approve" else "REJECTED"

              if namespace == "tayvoriqcp" and status == "APPROVED":
                  artifacts = github(
                      "GET",
                      f"https://api.github.com/repos/{repository}/actions/runs/{review_id}/artifacts",
                  )
                  expected_artifact = f"tayvoriq-control-review-{review_id}"
                  artifact_exists = any(
                      str(item.get("name") or "") == expected_artifact
                      for item in artifacts.get("artifacts", [])
                      if isinstance(item, dict)
                  )
                  if not artifact_exists:
                      telegram("answerCallbackQuery", {
                          "callback_query_id": callback_id,
                          "text": "Das geprüfte Video-Artefakt fehlt. Freigabe wurde nicht ausgeführt.",
                          "show_alert": True,
                      })
                      continue
                  github(
                      "POST",
                      f"https://api.github.com/repos/{repository}/dispatches",
                      {
                          "event_type": "tayvoriq_control_publish_approved",
                          "client_payload": {
                              "review_run_id": review_id,
                              "youtube_privacy": privacy,
                              "approval_source": "telegram_callback",
                          },
                      },
                  )

              review.update({
                  "review_id": review_id,
                  "status": status,
                  "processed_at": now,
                  "source": "telegram_callback",
                  "callback_namespace": namespace,
                  "telegram_message_id": message_id,
                  "publication_pending": status == "APPROVED",
                  "youtube_privacy": privacy if namespace == "tayvoriqcp" and status == "APPROVED" else review.get("youtube_privacy"),
                  "platform_upload_performed": False,
              })
              review_path.write_text(json.dumps(review, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              state["decisions"][review_id] = review

              telegram("answerCallbackQuery", {
                  "callback_query_id": callback_id,
                  "text": (
                      "Freigabe erkannt. YouTube-Veröffentlichung startet."
                      if namespace == "tayvoriqcp" and status == "APPROVED"
                      else "Freigabe gespeichert."
                      if status == "APPROVED"
                      else "Review abgelehnt."
                  ),
              })
              if message_id:
                  telegram("editMessageReplyMarkup", {
                      "chat_id": chat_id,
                      "message_id": message_id,
                      "reply_markup": {"inline_keyboard": []},
                  })

              if status == "REJECTED":
                  text = f"❌ TAYVORIQ Review {review_id} abgelehnt. Es wird nichts veröffentlicht."
              elif namespace == "tayvoriqcp":
                  text = (
                      f"✅ Freigabe erkannt.\n\nReview: {review_id}\n"
                      f"YouTube: {privacy}\nNach Abschluss folgt der YouTube-Link."
                  )
              else:
                  text = (
                      f"✅ TAYVORIQ Review {review_id} freigegeben.\n\n"
                      "Deine Entscheidung wurde gespeichert."
                  )
              telegram("sendMessage", {"chat_id": expected_chat, "text": text})
              handled += 1

          state["last_checked_at"] = datetime.now(timezone.utc).isoformat()
          state["last_handled_count"] = handled
          state_path.parent.mkdir(parents=True, exist_ok=True)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print({"updates": len(updates), "handled": handled, "next_update_id": state.get("next_update_id")})
          PY

      - name: Persist decisions
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/tayvoriq-telegram-decision-state.json \
                  .automation/tayvoriq-reviews \
                  .automation/tayvoriq-direct-reviews \
                  .automation/tayvoriq-control-reviews 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record TAYVORIQ Telegram decision"
          git pull --rebase origin main
          git push origin main
