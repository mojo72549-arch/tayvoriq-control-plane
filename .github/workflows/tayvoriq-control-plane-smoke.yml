name: TAYVORIQ Control Plane Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-control-plane-smoke.yml"
      - ".automation/tayvoriq-free-runner-smoke.md"

permissions:
  contents: read

concurrency:
  group: tayvoriq-control-plane-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private repository token
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN"

      - name: Checkout private V32 implementation fix
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: fix/bilger-script-length-v32
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r implementation/requirements.txt pytest

      - name: Compile and run production-critical preflight
        working-directory: implementation
        run: |
          set -euo pipefail
          mkdir -p out/control-plane
          python -m compileall -q tools src
          python tools/tayvoriq_preflight_check.py --report-out out/control-plane/preflight.json

      - name: Validate V32 against actual final render gate
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_tayvoriq_wildfire_source_grounding.py \
            tests/test_tayvoriq_manual_review_contract_v30.py \
            tests/test_tayvoriq_bilger_review_compiler_v31.py \
            tests/test_tayvoriq_bilger_final_render_gate_v32.py

      - name: Publish compact result to workflow summary
        if: always()
        working-directory: implementation
        run: |
          {
            echo "## TAYVORIQ V32 final-gate smoke"
            echo
            echo "Checks the actual V20 render quality gate and mandatory manual approval hold."
            if [ -f out/control-plane/preflight.json ]; then
              echo '```json'
              cat out/control-plane/preflight.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
