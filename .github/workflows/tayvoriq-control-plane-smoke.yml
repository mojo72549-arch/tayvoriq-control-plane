name: TAYVORIQ Control Plane Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-control-plane-smoke.yml"
      - ".automation/tayvoriq-free-runner-smoke.md"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private repository token
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: test -n "$PRIVATE_REPO_TOKEN"

      - name: Checkout private trend-cluster fix
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: fix/title-centered-public-trend-clustering
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r implementation/requirements.txt pytest

      - name: Compile and run production-critical preflight
        working-directory: implementation
        run: |
          set -euo pipefail
          mkdir -p out/control-plane
          python -m compileall -q tools src
          python tools/tayvoriq_preflight_check.py --report-out out/control-plane/preflight.json

      - name: Validate title-centered cluster regression
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_tayvoriq_public_interest_title_state.py \
            tests/test_tayvoriq_canonical_production_entrypoint.py \
            tests/test_tayvoriq_v27_canonical_final_package.py

      - name: Validate live two-publisher public-interest fallback
        working-directory: implementation
        run: |
          set -euo pipefail
          mkdir -p out/control-plane
          python tools/tayvoriq_trend_discovery_v8.py \
            --mode auto_trend \
            --manual-topic "" \
            --scope auto_scope \
            --language Deutsch \
            --out out/control-plane/live-trend-selection.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("out/control-plane/live-trend-selection.json").read_text(
                  encoding="utf-8"
              )
          )
          selected = report.get("selected_candidate") or {}
          topic = str(report.get("selected_topic") or "").strip()
          publishers = int(selected.get("independent_news_count") or 0)
          has_cause = bool(selected.get("factual_context_has_cause"))
          current = bool(selected.get("current_trend_confirmed"))
          if not topic:
              raise SystemExit(
                  "Live discovery did not produce a selected public-interest topic"
              )
          if publishers < 2:
              raise SystemExit(
                  f"Selected topic has only {publishers} independent publishers"
              )
          if not has_cause:
              raise SystemExit("Selected topic has no source-backed causal context")
          if not current:
              raise SystemExit("Selected topic is not marked current and confirmed")
          print(
              json.dumps(
                  {
                      "selected_topic": topic,
                      "independent_publishers": publishers,
                      "source_backed_cause": has_cause,
                      "current_trend_confirmed": current,
                      "trend_origin": selected.get("trend_origin"),
                      "social_origin": selected.get("social_origin"),
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Upload live discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-live-trend-${{ github.run_id }}
          path: implementation/out/control-plane/live-trend-selection.json
          if-no-files-found: warn
          retention-days: 1
