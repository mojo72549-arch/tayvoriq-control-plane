name: TAYVORIQ Control Plane Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-control-plane-smoke.yml"
      - ".automation/tayvoriq-free-runner-smoke.md"

permissions:
  contents: read

concurrency:
  group: tayvoriq-control-plane-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private repository token
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo "::error title=Missing secret::PRIVATE_REPO_TOKEN is not configured in the public control-plane repository"
            exit 2
          fi

      - name: Checkout private implementation fix
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: fix/source-grounded-wildfire-compiler
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r implementation/requirements.txt pytest

      - name: Compile and run production-critical preflight
        working-directory: implementation
        run: |
          set -euo pipefail
          mkdir -p out/control-plane
          python -m compileall -q tools src tests/test_tayvoriq_wildfire_source_grounding.py
          python tools/tayvoriq_preflight_check.py --report-out out/control-plane/preflight.json

      - name: Validate source-grounded wildfire compiler
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_tayvoriq_wildfire_source_grounding.py

      - name: Publish compact result to workflow summary
        if: always()
        working-directory: implementation
        run: |
          {
            echo "## TAYVORIQ source-grounding smoke"
            echo
            echo "Private ref: fix/source-grounded-wildfire-compiler"
            if [ -f out/control-plane/preflight.json ]; then
              echo '```json'
              cat out/control-plane/preflight.json
              echo '```'
            else
              echo "Preflight report was not created. Inspect the failed step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
