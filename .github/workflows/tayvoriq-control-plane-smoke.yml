name: TAYVORIQ Control Plane Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-control-plane-smoke.yml"
      - ".automation/tayvoriq-free-runner-smoke.md"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private repository token
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: test -n "$PRIVATE_REPO_TOKEN"

      - name: Checkout private V36 implementation fix
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: fix/entrypoint-final-hook-v36
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r implementation/requirements.txt pytest

      - name: Compile and run production-critical preflight
        working-directory: implementation
        run: |
          mkdir -p out/control-plane
          python -m compileall -q tools src
          python tools/tayvoriq_preflight_check.py --report-out out/control-plane/preflight.json

      - name: Validate entrypoint final hook and manual approval hold
        working-directory: implementation
        run: |
          python -m pytest -q \
            tests/test_tayvoriq_entrypoint_final_hook_v36.py \
            tests/test_tayvoriq_generic_script_contract_v34.py \
            tests/test_tayvoriq_manual_review_contract_v30.py \
            tests/test_tayvoriq_bilger_audit_safe_v33.py
