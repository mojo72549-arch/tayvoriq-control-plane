name: TAYVORIQ Oil Price Recovery Bind

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-oilprice-recovery-bind.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: tayvoriq-oilprice-recovery-bind
  cancel-in-progress: false

env:
  OLD_RUN_ID: "32305272222"
  X_REQUEST_MERGE_SHA: "2c907fc86e94d4dfbe5861d97c384a76f33899de"
  REQUEST_FILE: "requests/telegram-1268-trend-1.json"
  REQUEST_ID: "telegram-1268-trend-1"
  TOPIC: "Ölpreis bei 91,62 Dollar: Was bedeutet die Hormus-Krise für Deutschlands Spritpreise?"
  TREND_ID: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  adopt-or-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Adopt merge-triggered Golden Path or dispatch exact request
        id: run
        shell: bash
        run: |
          set -euo pipefail

          current=$(python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['REQUEST_FILE']); d=json.loads(p.read_text(encoding='utf-8'))
          print(str(d.get('golden_path_run_id') or ''))
          PY
          )
          if [[ "$current" =~ ^[0-9]+$ ]] && [ "$current" -gt "$OLD_RUN_ID" ]; then
            echo "run_id=$current" >> "$GITHUB_OUTPUT"
            echo "adopted=already-bound" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          candidate=$(gh run list --workflow tayvoriq-deliver-video-now.yml --limit 30 \
            --json databaseId,event,headSha,status,createdAt \
            --jq ".[] | select(.databaseId > ${OLD_RUN_ID} and .event == \"push\" and .headSha == \"${X_REQUEST_MERGE_SHA}\") | .databaseId" \
            | head -n 1)

          if [ -n "$candidate" ]; then
            echo "run_id=$candidate" >> "$GITHUB_OUTPUT"
            echo "adopted=merge-triggered" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before=$(gh run list --workflow tayvoriq-deliver-video-now.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run tayvoriq-deliver-video-now.yml --ref main \
            -f topic="$TOPIC" \
            -f trend_id="$TREND_ID" \
            -f source_request_id="$REQUEST_ID"

          candidate=""
          for poll in $(seq 1 24); do
            sleep 5
            candidate=$(gh run list --workflow tayvoriq-deliver-video-now.yml --branch main --event workflow_dispatch --limit 20 --json databaseId \
              --jq ".[] | select(.databaseId > ${before}) | .databaseId" | head -n 1)
            [ -n "$candidate" ] && break
          done
          [[ "$candidate" =~ ^[0-9]+$ ]] || { echo "::error title=Oil recovery not started::No exact Golden Path became visible"; exit 1; }
          echo "run_id=$candidate" >> "$GITHUB_OUTPUT"
          echo "adopted=explicit-dispatch" >> "$GITHUB_OUTPUT"

      - name: Bind durable Telegram request to the recovery run
        env:
          NEW_RUN_ID: ${{ steps.run.outputs.run_id }}
          ADOPTED: ${{ steps.run.outputs.adopted }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NEW_RUN_ID" =~ ^[0-9]+$ ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path(os.environ['REQUEST_FILE']); d=json.loads(p.read_text(encoding='utf-8'))
          if str(d.get('request_id') or '') != os.environ['REQUEST_ID']:
              raise SystemExit('OIL_RECOVERY_REQUEST_IDENTITY_FAILED')
          old=int(os.environ['OLD_RUN_ID']); new=int(os.environ['NEW_RUN_ID'])
          current=int(d.get('golden_path_run_id') or 0)
          if current not in {old,new} and current > old:
              raise SystemExit(0)
          previous=list(d.get('previous_golden_path_run_ids') or [])
          if old not in previous: previous.append(old)
          d['previous_golden_path_run_ids']=previous[-12:]
          d['golden_path_run_id']=new
          d['retry_of_run_id']=old
          d['recovery_generation']=max(1,int(d.get('recovery_generation') or 0)+1)
          d['replacement_reason']='EXACT_SOURCE_REQUEST_REBIND'
          d['recovery_owner']='tayvoriq-orchestrator'
          history=list(d.get('state_history') or [])
          if not any(str((item.get('meta') or {}).get('golden_path_run_id')) == str(new) for item in history if isinstance(item,dict)):
              history.append({
                  'state':'DISPATCHED',
                  'at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
                  'actor':'tayvoriq-orchestrator',
                  'meta':{
                      'retry_of_run_id':old,
                      'golden_path_run_id':new,
                      'reason':'exact-source-request-rebind',
                      'operator_notifications':'percentage-only',
                  },
              })
          d['state_history']=history
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            git add "$REQUEST_FILE"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "agent(v2): bind oil request to recovery run ${NEW_RUN_ID}"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
