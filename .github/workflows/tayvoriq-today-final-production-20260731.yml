name: TAYVORIQ Trend Heat Record Production 2026-07-31

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-today-final-production-20260731.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tayvoriq-heat-record-final-20260731-v4
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
  TAYVORIQ_CLOUD_MODE: "true"
  TAYVORIQ_RENDER_SIZE: "1080x1920"
  TAYVORIQ_AUDIO_END_PADDING_SECONDS: "1.25"
  TAYVORIQ_TTS_PROVIDER: "chatterbox_v3"
  TAYVORIQ_CHATTERBOX_ENABLED: "true"
  TAYVORIQ_CHATTERBOX_REQUIRED: "true"
  TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
  TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
  TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "780"
  TAYVORIQ_CHATTERBOX_MAX_CHUNKS: "1"
  TAYVORIQ_CHATTERBOX_MAX_CHARS: "520"
  TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
  TAYVORIQ_CHATTERBOX_EXAGGERATION: "0.50"
  TAYVORIQ_CHATTERBOX_CFG_WEIGHT: "0.47"
  TAYVORIQ_CHATTERBOX_PAUSE_MS: "520"
  TAYVORIQ_CHATTERBOX_NATURAL_PAUSE_MS: "520"
  TAYVORIQ_NATURAL_VOICE_WPM: "128"
  TAYVORIQ_NATURAL_VOICE_MIN_SECONDS: "23.5"
  TAYVORIQ_NATURAL_VOICE_MAX_SECONDS: "29.0"
  TAYVORIQ_NARRATOR_PITCH_FACTOR: "0.96"
  TAYVORIQ_NARRATOR_TONE_REQUIRED: "true"
  TAYVORIQ_RENDER_TIMEOUT_SECONDS: "900"
  TAYVORIQ_EDGE_RECOVERY_TIMEOUT_SECONDS: "120"
  TAYVORIQ_AUDIT_TIMEOUT_SECONDS: "300"
  TAYVORIQ_AUDIT_RETRY_DELAYS: "0,10,25"
  TAYVORIQ_CONTROLLER_TIMEOUT_SECONDS: "2700"
  TAYVORIQ_TELEGRAM_PROGRESS: "false"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  produce-final-review:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Persist isolated heat run
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .github/run-now
          printf '{"run_id":%s,"status":"in_progress","url":"https://github.com/%s/actions/runs/%s","started_at":"%s","workflow":"TAYVORIQ Heat Record Final V4"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .github/run-now/latest-heat-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/run-now/latest-heat-run.json
          if ! git diff --cached --quiet; then
            git commit -m "ops: record isolated TAYVORIQ heat production"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Validate required secrets
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID PEXELS_API_KEY GROQ_API_KEY GEMINI_API_KEY; do
            test -n "${!name:-}" || { echo "::error title=Missing secret::$name"; exit 1; }
          done

      - name: Checkout implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Restore Chatterbox cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: tayvoriq-chatterbox-v3-cpu-py311-v4

      - name: Install production dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rsync git libsndfile1
          python -m pip install --upgrade pip -q
          python -m pip install -r implementation/requirements.txt pytest -q
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0" -q
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948" -q

      - name: Prepare approved human narrator reference
        run: |
          set -euo pipefail
          mkdir -p implementation/out/tayvoriq-reference
          curl --fail --location --retry 3 \
            "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/voice-samples/30580853734/voice-sample.mp4" \
            --output implementation/out/tayvoriq-reference/narrator-v3.mp4
          ffmpeg -y -loglevel error \
            -i implementation/out/tayvoriq-reference/narrator-v3.mp4 \
            -vn -ac 1 -ar 24000 -c:a pcm_s16le \
            implementation/out/tayvoriq-reference/narrator-v3.wav
          test -s implementation/out/tayvoriq-reference/narrator-v3.wav
          echo "TAYVORIQ_CHATTERBOX_REFERENCE_AUDIO=${GITHUB_WORKSPACE}/implementation/out/tayvoriq-reference/narrator-v3.wav" >> "$GITHUB_ENV"

      - name: Preflight implementation
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m compileall -q tools src
          python tools/tayvoriq_preflight_check.py --report-out out/control-plane/preflight.json

      - name: Produce and audit today's trend video
        id: production
        working-directory: implementation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/tayvoriq-self-heal
          set +e
          python tools/tayvoriq_autonomous_entrypoint.py \
            --trend-mode manual_topic \
            --trend-scope world_society \
            --topic "40 Grad in Deutschland: So schützt du dich jetzt vor Hitzschlag und Unwettern" \
            --language Deutsch \
            --platform youtube_tiktok \
            --target-duration 35 \
            --llm-provider template \
            --outdir out/tayvoriq-youtube-tiktok \
            --site-root site/tayvoriq \
            --run-id "${GITHUB_RUN_ID}" \
            --state-out out/tayvoriq-review-state.json \
            --report-out out/tayvoriq-self-heal/report.json \
            --request-out out/tayvoriq-self-heal/request.json \
            --self-heal-depth 0 \
            --target-branch feature/multi-platform-distribution-package \
            2>&1 | tee out/tayvoriq-self-heal/controller-console.log
          process_exit=${PIPESTATUS[0]}
          set -e
          state=$(python -c 'import json,pathlib; p=pathlib.Path("out/tayvoriq-self-heal/report.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get("state") or "TECHNICAL_FAILURE")')
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "process_exit=$process_exit" >> "$GITHUB_OUTPUT"
          echo "Production state: $state, process exit: $process_exit"

      - name: Validate final human narrator
        id: narrator_gate
        if: steps.production.outputs.state == 'SUCCESS'
        working-directory: implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('out/tayvoriq-review-state.json').read_text(encoding='utf-8'))
          job_dir = Path(state['job_dir'])
          audio = json.loads((job_dir / 'audio_report.json').read_text(encoding='utf-8'))
          provider = str(audio.get('voice_provider_used') or audio.get('provider') or '').casefold()
          settings = dict(audio.get('voice_settings') or {})
          assert 'chatterbox' in provider, provider
          assert not bool(audio.get('fallback')), audio
          assert bool(settings.get('reference_audio_used')), settings
          assert bool(audio.get('narrator_tone_applied')), audio
          assert bool(audio.get('premium_voice_contract_passed')), audio
          assert bool(audio.get('natural_pacing_contract_passed')), audio
          pitch = float(settings.get('narrator_pitch_factor') or 1.0)
          assert 0.94 <= pitch <= 0.97, pitch
          print({'human_narrator_gate':'passed','provider':provider,'pitch_factor':pitch,'reference_audio_used':True})
          PY

      - name: Validate publication gates
        id: publication_gate
        if: steps.production.outputs.state == 'SUCCESS' && steps.narrator_gate.outcome == 'success'
        working-directory: implementation
        run: |
          set -euo pipefail
          JOB_DIR=$(python -c 'import json,pathlib; d=json.loads(pathlib.Path("out/tayvoriq-review-state.json").read_text()); print(d.get("job_dir") or "")')
          test -n "$JOB_DIR"
          python tools/tayvoriq_publication_quality_gate_v2.py --job-dir "$JOB_DIR" --targets youtube_tiktok

      - name: Publish review page
        id: publish_review
        if: steps.production.outputs.state == 'SUCCESS' && steps.narrator_gate.outcome == 'success' && steps.publication_gate.outcome == 'success'
        run: |
          set -euo pipefail
          test -d implementation/site/tayvoriq
          mkdir -p pages-worktree/tayvoriq
          rsync -a implementation/site/tayvoriq/ pages-worktree/tayvoriq/
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish TAYVORIQ review ${GITHUB_RUN_ID}"
            git push origin main
          fi

      - name: Send only finished Telegram review
        id: telegram_final
        if: steps.production.outputs.state == 'SUCCESS' && steps.narrator_gate.outcome == 'success' && steps.publication_gate.outcome == 'success' && steps.publish_review.outcome == 'success'
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --review-id "${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"

      - name: Verify definition of done
        if: steps.production.outputs.state == 'SUCCESS'
        working-directory: implementation
        env:
          NARRATOR_GATE_OUTCOME: ${{ steps.narrator_gate.outcome }}
          PUBLICATION_GATE_OUTCOME: ${{ steps.publication_gate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_review.outcome }}
          TELEGRAM_OUTCOME: ${{ steps.telegram_final.outcome }}
        run: |
          set -euo pipefail
          python -c 'import json,pathlib,os; s=json.loads(pathlib.Path("out/tayvoriq-review-state.json").read_text()); j=pathlib.Path(s["job_dir"]); vids=[j/"short_youtube.mp4",j/"short_tiktok.mp4"]; assert all(v.is_file() and v.stat().st_size>100000 for v in vids); assert all(os.environ[k]=="success" for k in ("NARRATOR_GATE_OUTCOME","PUBLICATION_GATE_OUTCOME","PUBLISH_OUTCOME","TELEGRAM_OUTCOME")); print({"definition_of_done":"passed","job_dir":str(j)})'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-today-final-${{ github.run_id }}
          path: |
            implementation/out/**
            implementation/site/tayvoriq/**
          if-no-files-found: warn
          retention-days: 30

      - name: Fail incomplete production
        if: steps.production.outputs.state != 'SUCCESS' || steps.narrator_gate.outcome != 'success' || steps.publication_gate.outcome != 'success' || steps.publish_review.outcome != 'success' || steps.telegram_final.outcome != 'success'
        run: |
          echo "::error title=TAYVORIQ today incomplete::No incomplete video was sent to Telegram."
          exit 1
