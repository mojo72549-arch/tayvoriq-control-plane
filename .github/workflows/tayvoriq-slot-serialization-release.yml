name: TAYVORIQ Slot Serialization Release

on:
  workflow_run:
    workflows:
      - TAYVORIQ-X Golden Path
    types:
      - completed
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tayvoriq-slot-serialization-release
  cancel-in-progress: false

jobs:
  release-next-evening:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find oldest held evening request
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/tayvoriq_slot_serialization_v1.py scan-held --requests-dir requests > /tmp/held.json
          request_file=$(python - <<'PY'
          import json
          items=json.load(open('/tmp/held.json',encoding='utf-8'))
          print(items[0] if items else '')
          PY
          )
          echo "request_file=$request_file" >> "$GITHUB_OUTPUT"
          if [ -z "$request_file" ]; then
            echo "No held evening request is waiting."
          else
            echo "Held evening candidate: $request_file"
          fi

      - name: Verify morning final-review completion
        id: gate
        if: steps.candidate.outputs.request_file != ''
        env:
          REQUEST_FILE: ${{ steps.candidate.outputs.request_file }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/tayvoriq_slot_serialization_v1.py check \
            --request "$REQUEST_FILE" \
            --requests-dir requests \
            --repo "$GITHUB_REPOSITORY" \
            --token "$GH_TOKEN" > /tmp/slot-result.json
          python - "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.load(open('/tmp/slot-result.json',encoding='utf-8'))
          with open(sys.argv[1],'a',encoding='utf-8') as h:
              h.write(f"released={'true' if d.get('released') else 'false'}\n")
              h.write(f"reason={d.get('reason') or ''}\n")
              h.write(f"predecessor_run_id={int(d.get('predecessor_run_id') or 0)}\n")
          print(d)
          PY

      - name: Release exact evening request
        if: steps.gate.outputs.released == 'true'
        env:
          REQUEST_FILE: ${{ steps.candidate.outputs.request_file }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          released=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            [ -f "$REQUEST_FILE" ] || { echo "Held request disappeared or was superseded."; exit 0; }

            python tools/tayvoriq_slot_serialization_v1.py check \
              --request "$REQUEST_FILE" \
              --requests-dir requests \
              --repo "$GITHUB_REPOSITORY" \
              --token "$GH_TOKEN" > /tmp/slot-result-live.json
            allowed=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/slot-result-live.json',encoding='utf-8'))
          print('true' if d.get('released') else 'false')
          PY
            )
            [ "$allowed" = "true" ] || { echo "Morning completion changed; keeping evening held."; exit 0; }

            python tools/tayvoriq_slot_serialization_v1.py mark-released \
              --request "$REQUEST_FILE" \
              --result /tmp/slot-result-live.json
            python tools/tayvoriq_orchestration_contract.py validate "$REQUEST_FILE" --require-claimable
            git add "$REQUEST_FILE"
            if git diff --cached --quiet; then
              echo "Request already released by another owner; exact redispatch remains idempotent."
              released=true
              break
            fi
            git commit -m "ops(tayvoriq): release evening after verified morning review"
            if git push origin HEAD:main; then
              released=true
              break
            fi
            sleep $((attempt * 2))
          done
          [ "$released" = "true" ] || { echo "::error title=Slot release persistence failed::Could not persist evening release"; exit 1; }
          echo "Evening request released; explicit idempotent redispatch will start production."

      - name: Redispatch exact released approval
        if: steps.gate.outputs.released == 'true'
        env:
          REQUEST_FILE: ${{ steps.candidate.outputs.request_file }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          [ -f "$REQUEST_FILE" ] || { echo "::error title=Released request missing::Cannot redispatch exact evening approval"; exit 1; }
          python tools/tayvoriq_orchestration_contract.py validate "$REQUEST_FILE" --require-claimable

          SOURCE_KIND=$(python - "$REQUEST_FILE" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          print(str(data.get('source') or '').strip())
          PY
          )
          if [ "$SOURCE_KIND" = "user_preapproved_preparation" ]; then
            echo "Preapproved preparation released. The release commit changes requests/*.json, so the single-owner Request Dispatcher receives this exact request via its push trigger. No Telegram callback is fabricated."
            exit 0
          fi
          [ "$SOURCE_KIND" = "telegram_trend_approval" ] || { echo "::error title=Unsupported approval source::Cannot safely redispatch source=$SOURCE_KIND"; exit 1; }

          python - "$REQUEST_FILE" > /tmp/tayvoriq-release-redispatch.json <<'PY'
          import json,sys
          from pathlib import Path

          path=Path(sys.argv[1])
          data=json.loads(path.read_text(encoding='utf-8'))
          if str(data.get('slot_serialization_state') or '') != 'RELEASED_AFTER_MORNING_REVIEW':
              raise SystemExit('SLOT_RELEASE_REDISPATCH_FAILED: request is not released')
          selection_id=str(data.get('selection_id') or '').strip()
          message_id=str(data.get('telegram_message_id') or '').strip()
          trend_id=str(data.get('trend_id') or '').strip()
          topic=str(data.get('topic') or '').strip()
          approved_at=str(data.get('approved_at') or '').strip()
          if not selection_id or not message_id.isdigit() or not trend_id or not topic or not approved_at:
              raise SystemExit('SLOT_RELEASE_REDISPATCH_FAILED: exact Telegram approval identity is incomplete')
          print(json.dumps({
              'event_type': 'tayvoriq_trend_approved',
              'client_payload': {
                  'trend_id': trend_id,
                  'topic': topic,
                  'selection_id': selection_id,
                  'telegram_message_id': int(message_id),
                  'approved_at': approved_at,
                  'release_redispatch': True,
                  'source_request_id': str(data.get('request_id') or ''),
              },
          }, ensure_ascii=False))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input /tmp/tayvoriq-release-redispatch.json
          echo "Released Telegram request handed back to the single-owner dispatcher via repository_dispatch."

      - name: Keep held without noise
        if: steps.candidate.outputs.request_file != '' && steps.gate.outputs.released != 'true'
        run: |
          echo "Evening remains held: ${{ steps.gate.outputs.reason }}"
          echo "No Golden Path dispatch and no production-start Telegram message will be emitted."
