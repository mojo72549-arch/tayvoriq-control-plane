name: TAYVORIQ Bootstrap Bosch Evening Hold 2026-08-22

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-bootstrap-bosch-evening-hold-20260822.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tayvoriq-bootstrap-bosch-evening-hold-20260822
  cancel-in-progress: false

env:
  EVENING_SELECTION_ID: 20260822-e-boschrobot
  EVENING_SELECTION_FILE: .automation/tayvoriq-agent-v2/selections/20260822-e-boschrobot.json
  SLOT_STATE: state/tayvoriq-bound-slots-20260822.json

jobs:
  enqueue-held-evening:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Stop if exact Bosch request already exists
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          exists=$(python - <<'PY'
          import json
          from pathlib import Path
          matches=[]
          for p in Path('requests').glob('*.json'):
              try: d=json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              if str(d.get('selection_id') or '') == '20260822-e-boschrobot' and str(d.get('trend_id') or '') == '1':
                  matches.append(str(p))
          print('true' if matches else 'false')
          PY
          )
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Re-emit exact approved Bosch request into strict FIFO gate
        if: steps.guard.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/dispatch.json
          import json, os
          selection=json.load(open(os.environ['EVENING_SELECTION_FILE'],encoding='utf-8'))
          state=json.load(open(os.environ['SLOT_STATE'],encoding='utf-8'))
          assert selection['selection_id'] == os.environ['EVENING_SELECTION_ID']
          assert selection['date'] == '2026-08-22' and selection['slot'] == 'evening'
          assert selection['selected_trend_id'] == '1'
          trend=selection['trends'][0]
          assert 'Bosch' in trend['title'] and 'Bühl' in trend['title']
          message_id=int(state.get('evening_telegram_message_id') or 1451)
          approved_at=str(state.get('evening_approved_at') or '2026-08-22T10:50:38Z')
          print(json.dumps({
            'event_type':'tayvoriq_trend_approved',
            'client_payload':{
              'trend_id':'1',
              'topic':trend['title'],
              'selection_id':selection['selection_id'],
              'telegram_chat_id':'durable-secret-owned-by-dispatcher',
              'telegram_message_id':message_id,
              'approved_at':approved_at,
              'approval_origin':'user_explicit_evening_choice_requeued_behind_strict_fifo_gate'
            }
          },ensure_ascii=False))
          PY
          code=$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d @/tmp/dispatch.json)
          test "$code" = '204' || { cat /tmp/dispatch-response.txt; echo "dispatch HTTP $code"; exit 1; }
          echo "Bosch approval re-emitted. Request Dispatcher must persist it held until S21 final review succeeds."

      - name: No duplicate action
        if: steps.guard.outputs.exists == 'true'
        run: echo "Exact Bosch evening request already exists; no duplicate dispatch emitted."
