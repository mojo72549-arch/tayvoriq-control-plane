name: TAYVORIQ Telegram Full Review Fastpath

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-telegram-redelivery-fastpath.yml

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_TITLE: "Deutschland holt 21 EM-Medaillen – 6 Gold und Platz 3"
      YOUTUBE_DESCRIPTION: "Deutschland beendet die Leichtathletik-EM mit 21 Medaillen und sechs Goldmedaillen – Platz drei im Medaillenspiegel. Warum reicht eine starke Gesamtzahl nicht automatisch für Rang eins? Entscheidend ist zuerst die Zahl der Goldmedaillen. TAYVORIQ ordnet das Ergebnis kompakt und verständlich ein.\n\n#Leichtathletik #TeamDeutschland #EM2026 #Sport #TAYVORIQ"
      TIKTOK_CAPTION: "21 Medaillen – und trotzdem Platz 3? 🇩🇪🏃 Deutschland beendet die Leichtathletik-EM mit sechs Goldmedaillen. Im Medaillenspiegel zählt zuerst Gold – nicht nur die Gesamtzahl. #Leichtathletik #TeamDeutschland #EM2026 #Sport #TAYVORIQ"
    steps:
      - name: Checkout review repository
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Build repaired dual-platform review package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_ID="${GITHUB_RUN_ID}"
          SRC_REPAIR='pages-worktree/tayvoriq/voice-repairs/32122612482-v3'
          SRC_RUN='pages-worktree/tayvoriq/runs/32122612482'
          DST="pages-worktree/tayvoriq/runs/${REVIEW_ID}"

          for f in repaired_youtube.mp4 repaired_tiktok.mp4 job.json youtube_audio_report.json tiktok_audio_report.json; do
            test -s "${SRC_REPAIR}/${f}"
          done
          test -s "${SRC_RUN}/preapproval_ai_audit.json"

          mkdir -p "$DST"
          cp "${SRC_REPAIR}/repaired_youtube.mp4" "$DST/short_youtube.mp4"
          cp "${SRC_REPAIR}/repaired_tiktok.mp4" "$DST/short_tiktok.mp4"
          cp "${SRC_REPAIR}/job.json" "$DST/job.json"
          cp "${SRC_REPAIR}/youtube_audio_report.json" "$DST/youtube_audio_report.json"
          cp "${SRC_REPAIR}/tiktok_audio_report.json" "$DST/tiktok_audio_report.json"
          cp "${SRC_RUN}/preapproval_ai_audit.json" "$DST/preapproval_ai_audit.json"

          export REVIEW_ID DST YOUTUBE_TITLE YOUTUBE_DESCRIPTION TIKTOK_CAPTION
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          dst = Path(os.environ['DST'])
          review_id = os.environ['REVIEW_ID']
          yt_title = os.environ['YOUTUBE_TITLE']
          yt_desc = os.environ['YOUTUBE_DESCRIPTION'].replace('\\n', '\n')
          tt_caption = os.environ['TIKTOK_CAPTION']

          job = json.loads((dst / 'job.json').read_text(encoding='utf-8'))
          job['github_run_id'] = review_id
          job['approval_status'] = 'PENDING_HUMAN_REVIEW'
          job['upload_status'] = 'NOT_STARTED_PENDING_HUMAN_APPROVAL'
          job['review_package'] = {
              'review_id': review_id,
              'source_master_run': '32122612482',
              'source_repair_run': '32183234839',
              'repair_type': 'voice_only_old_accepted_reference',
              'visual_master_reused': True,
              'script_reused': True,
              'youtube_video': 'short_youtube.mp4',
              'tiktok_video': 'short_tiktok.mp4',
              'telegram_review_buttons_required': True,
              'created_at': datetime.now(timezone.utc).isoformat(),
              'quality_gates_weakened': False,
          }
          variants = job.setdefault('variants', {})
          yt = variants.setdefault('youtube_shorts', {})
          tt = variants.setdefault('tiktok', {})
          yt['video_path'] = 'short_youtube.mp4'
          tt['video_path'] = 'short_tiktok.mp4'
          yt_pkg = yt.setdefault('text_package', {})
          tt_pkg = tt.setdefault('text_package', {})
          yt_pkg['youtube_metadata'] = {
              'title': yt_title,
              'description': yt_desc,
              'hashtags': ['#Leichtathletik', '#TeamDeutschland', '#EM2026', '#Sport', '#TAYVORIQ'],
          }
          tt_pkg['tiktok_metadata'] = {
              'caption': tt_caption,
              'hashtags': ['#Leichtathletik', '#TeamDeutschland', '#EM2026', '#Sport', '#TAYVORIQ'],
              'distribution': 'manual_after_user_approval',
          }
          (dst / 'job.json').write_text(json.dumps(job, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit = json.loads((dst / 'preapproval_ai_audit.json').read_text(encoding='utf-8'))
          audit['audio_reports'] = {
              'youtube_shorts': json.loads((dst / 'youtube_audio_report.json').read_text(encoding='utf-8')),
              'tiktok': json.loads((dst / 'tiktok_audio_report.json').read_text(encoding='utf-8')),
          }
          audit['repair_review'] = {
              'source_repair_run': '32183234839',
              'continuous_human_narrator_take': True,
              'pitch_shift_applied': False,
              'quality_gates_weakened': False,
              'human_review_allowed': True,
          }
          audit['passed'] = True
          audit['human_review_allowed'] = True
          audit['quality_gates_weakened'] = False
          audit['blockers'] = audit.get('blockers') or []
          (dst / 'preapproval_ai_audit.json').write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest = {
              'review_id': review_id,
              'topic': job.get('topic'),
              'youtube': {
                  'video': 'short_youtube.mp4',
                  'title': yt_title,
                  'description': yt_desc,
                  'approval_callback': f'tayvoriq:approve:{review_id}',
                  'reject_callback': f'tayvoriq:reject:{review_id}',
              },
              'tiktok': {
                  'video': 'short_tiktok.mp4',
                  'caption': tt_caption,
                  'distribution': 'manual_after_user_approval',
              },
              'source_master_run': '32122612482',
              'source_repair_run': '32183234839',
              'quality_gates_weakened': False,
          }
          (dst / 'review_manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          test -s "$DST/short_youtube.mp4"
          test -s "$DST/short_tiktok.mp4"
          YB=$(stat -c%s "$DST/short_youtube.mp4")
          TB=$(stat -c%s "$DST/short_tiktok.mp4")
          [ "$YB" -gt 1000000 ]
          [ "$TB" -gt 1000000 ]
          echo "review_id=$REVIEW_ID" >> "$GITHUB_OUTPUT"
          echo "youtube_bytes=$YB" >> "$GITHUB_OUTPUT"
          echo "tiktok_bytes=$TB" >> "$GITHUB_OUTPUT"

      - name: Publish review package before buttons become active
        shell: bash
        run: |
          set -euo pipefail
          cd pages-worktree
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "tayvoriq/runs/${GITHUB_RUN_ID}"
          git commit -m "Publish repaired TAYVORIQ review package ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin main

      - name: Wait until GitHub Pages review media is reachable
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}"
          ok=0
          for _ in $(seq 1 60); do
            y=$(curl -L -s -o /dev/null -w '%{http_code}' "$BASE/short_youtube.mp4" || true)
            t=$(curl -L -s -o /dev/null -w '%{http_code}' "$BASE/short_tiktok.mp4" || true)
            j=$(curl -L -s -o /dev/null -w '%{http_code}' "$BASE/job.json" || true)
            a=$(curl -L -s -o /dev/null -w '%{http_code}' "$BASE/preapproval_ai_audit.json" || true)
            if [ "$y" = 200 ] && [ "$t" = 200 ] && [ "$j" = 200 ] && [ "$a" = 200 ]; then
              ok=1
              break
            fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo 'Review package is not yet reachable via GitHub Pages'; exit 1; }

      - name: Send YouTube review with real approval buttons
        id: youtube_review
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          VIDEO="pages-worktree/tayvoriq/runs/${GITHUB_RUN_ID}/short_youtube.mp4"
          MARKUP=$(python - <<'PY'
          import json, os
          rid=os.environ['GITHUB_RUN_ID']
          print(json.dumps({'inline_keyboard': [[
              {'text':'✅ YouTube freigeben','callback_data':f'tayvoriq:approve:{rid}'},
              {'text':'❌ Review ablehnen','callback_data':f'tayvoriq:reject:{rid}'},
          ]]}, ensure_ascii=False))
          PY
          )
          response=$(curl -fsS --retry 3 --retry-all-errors \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "caption=🎬 YOUTUBE REVIEW · Leichtathletik-EM\nRun: ${GITHUB_RUN_ID}\n\nBitte prüfen: Aussprache · Szenenbezug · Untertitel · Gesamteindruck.\nDanach unten Freigeben oder Ablehnen." \
            -F "reply_markup=${MARKUP}" \
            -F 'supports_streaming=true' \
            -F "video=@${VIDEO};type=video/mp4" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo")
          python - "$response" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data=json.loads(sys.argv[1]); assert data.get('ok'), data
          with open(sys.argv[2],'a',encoding='utf-8') as f:
              f.write(f"message_id={data['result']['message_id']}\n")
              f.write(f"chat_id={data['result']['chat']['id']}\n")
          PY

      - name: Send YouTube title and description
        id: youtube_meta
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          TEXT=$(printf '📝 YOUTUBE-PAKET\n\nTitel:\n%s\n\nBeschreibung:\n%s\n\nNach deiner Freigabe startet der automatische öffentliche YouTube-Upload.' "$YOUTUBE_TITLE" "$YOUTUBE_DESCRIPTION")
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}")
          python - "$response" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1]); assert d.get('ok'), d
          with open(sys.argv[2],'a',encoding='utf-8') as f: f.write(f"message_id={d['result']['message_id']}\n")
          PY

      - name: Send separate TikTok video
        id: tiktok_video
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          VIDEO="pages-worktree/tayvoriq/runs/${GITHUB_RUN_ID}/short_tiktok.mp4"
          response=$(curl -fsS --retry 3 --retry-all-errors \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "caption=📱 TIKTOK VIDEO · Leichtathletik-EM\nSeparate TikTok-Datei für den manuellen Upload. Die fertige Caption kommt direkt in der nächsten Nachricht." \
            -F 'supports_streaming=true' \
            -F "video=@${VIDEO};type=video/mp4" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo")
          python - "$response" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1]); assert d.get('ok'), d
          with open(sys.argv[2],'a',encoding='utf-8') as f: f.write(f"message_id={d['result']['message_id']}\n")
          PY

      - name: Send copy-ready TikTok caption
        id: tiktok_meta
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          TEXT=$(printf '📋 TIKTOK-BESCHREIBUNG · direkt kopierbar\n\n%s\n\nℹ️ TikTok bleibt manuell, damit du Datei + Caption kontrolliert hochladen kannst.' "$TIKTOK_CAPTION")
          response=$(curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}")
          python - "$response" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1]); assert d.get('ok'), d
          with open(sys.argv[2],'a',encoding='utf-8') as f: f.write(f"message_id={d['result']['message_id']}\n")
          PY

      - name: Persist complete Telegram review receipt
        shell: bash
        env:
          YOUTUBE_REVIEW_MESSAGE_ID: ${{ steps.youtube_review.outputs.message_id }}
          YOUTUBE_META_MESSAGE_ID: ${{ steps.youtube_meta.outputs.message_id }}
          TIKTOK_VIDEO_MESSAGE_ID: ${{ steps.tiktok_video.outputs.message_id }}
          TIKTOK_META_MESSAGE_ID: ${{ steps.tiktok_meta.outputs.message_id }}
          CHAT_ID: ${{ steps.youtube_review.outputs.chat_id }}
        run: |
          set -euo pipefail
          D='pages-worktree/tayvoriq/telegram-deliveries'
          mkdir -p "$D"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          rid=os.environ['GITHUB_RUN_ID']
          receipt={
            'state':'FULL_REVIEW_DELIVERED',
            'delivered_at':datetime.now(timezone.utc).isoformat(),
            'review_id':rid,
            'telegram_chat_id':str(os.environ['CHAT_ID']),
            'youtube_review_message_id':int(os.environ['YOUTUBE_REVIEW_MESSAGE_ID']),
            'youtube_metadata_message_id':int(os.environ['YOUTUBE_META_MESSAGE_ID']),
            'tiktok_video_message_id':int(os.environ['TIKTOK_VIDEO_MESSAGE_ID']),
            'tiktok_metadata_message_id':int(os.environ['TIKTOK_META_MESSAGE_ID']),
            'approve_callback':f'tayvoriq:approve:{rid}',
            'reject_callback':f'tayvoriq:reject:{rid}',
            'source_master_run':'32122612482',
            'source_repair_run':'32183234839',
            'youtube_auto_publish_after_approval':True,
            'tiktok_manual_upload_required':True,
            'review_package':f'tayvoriq/runs/{rid}',
            'telegram_delivery_preserved':True,
            'quality_gates_weakened':False,
          }
          Path('pages-worktree/tayvoriq/telegram-deliveries/athletics-review-latest.json').write_text(
            json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False))
          PY
          cd pages-worktree
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tayvoriq/telegram-deliveries/athletics-review-latest.json
          git commit -m "Record full TAYVORIQ Telegram review ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin main
