name: TAYVORIQ Recover Existing Review

on:
  workflow_dispatch:
  push:
    paths:
      - ".automation/tayvoriq-recover-existing-review-request.json"

permissions:
  actions: read
  contents: read

concurrency:
  group: tayvoriq-recover-existing-review
  cancel-in-progress: false

jobs:
  recover-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVIEW_ID: "30270382678"
      REVIEW_URL: "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/30270382678/"
      RUN_URL: "https://github.com/mojo72549-arch/tayvoriq-control-plane/actions/runs/30270382678"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUTF8: "1"
    steps:
      - name: Validate recovery secrets
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            test -n "${!name:-}" || { echo "::error title=Missing recovery secret::$name"; exit 2; }
          done

      - name: Checkout private implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Download completed review artifact
        uses: actions/download-artifact@v4
        with:
          name: tayvoriq-review-30270382678
          path: recovered-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: mojo72549-arch/tayvoriq-control-plane
          run-id: 30270382678

      - name: Validate and publish existing MP4
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path

          root = Path("recovered-artifact")
          videos = [p for p in root.rglob("*.mp4") if p.is_file() and p.stat().st_size > 100_000]
          if not videos:
              raise SystemExit("No completed MP4 found in existing artifact")

          youtube = [p for p in videos if "youtube" in p.name.casefold()]
          source = max(youtube or videos, key=lambda p: p.stat().st_size)
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,width,height:format=duration", "-of", "json", str(source)],
              capture_output=True,
              text=True,
              check=True,
          )
          data = json.loads(probe.stdout)
          video_stream = next((s for s in data.get("streams", []) if s.get("codec_type") == "video"), {})
          width = int(video_stream.get("width") or 0)
          height = int(video_stream.get("height") or 0)
          duration = float((data.get("format") or {}).get("duration") or 0)
          if (width, height) != (1080, 1920):
              raise SystemExit(f"Unexpected resolution: {width}x{height}")
          if not 25 <= duration <= 60:
              raise SystemExit(f"Unexpected duration: {duration}")

          target_dir = Path("pages-worktree/tayvoriq/runs/30270382678")
          target_dir.mkdir(parents=True, exist_ok=True)
          target_video = target_dir / "tayvoriq-review.mp4"
          shutil.copy2(source, target_video)
          (target_dir / "recovery-evidence.json").write_text(
              json.dumps({
                  "review_id": "30270382678",
                  "source_artifact": "tayvoriq-review-30270382678",
                  "source_video": str(source),
                  "published_video": target_video.name,
                  "width": width,
                  "height": height,
                  "duration_seconds": round(duration, 3),
                  "upload_performed": False,
                  "approval_required": True,
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          html = '''<!doctype html>
          <html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>TAYVORIQ Review 30270382678</title>
          <style>body{margin:0;background:#090b10;color:#fff;font-family:system-ui,sans-serif}main{max-width:560px;margin:auto;padding:24px}video{width:100%;max-height:78vh;background:#000;border-radius:18px}h1{font-size:1.35rem}p{color:#c7ccd6;line-height:1.5}.notice{padding:14px;border:1px solid #343947;border-radius:12px;background:#121620}a{color:#8fc8ff}</style>
          </head><body><main><h1>🎬 TAYVORIQ Video-Review</h1>
          <video controls playsinline preload="metadata" src="tayvoriq-review.mp4"></video>
          <div class="notice"><strong>Noch nicht veröffentlicht.</strong><p>Schau dir das Video vollständig an und entscheide anschließend in Telegram mit „Freigeben“ oder „Ablehnen“. Erst nach deiner ausdrücklichen Freigabe darf der YouTube-Publish-Workflow starten.</p></div>
          <p><a href="tayvoriq-review.mp4">Video direkt öffnen</a></p></main></body></html>'''
          (target_dir / "index.html").write_text(html, encoding="utf-8")
          print(json.dumps({"source": str(source), "target": str(target_video), "width": width, "height": height, "duration": duration}))
          PY

          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq/runs/30270382678 .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish recovered TAYVORIQ review 30270382678"
            git push origin main
          fi

      - name: Wait for stable review page
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$REVIEW_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Review page is reachable."
              exit 0
            fi
            echo "Pages not ready yet (HTTP $code, attempt $attempt/30)"
            sleep 10
          done
          echo "::error title=Review page unavailable::$REVIEW_URL did not become reachable"
          exit 1

      - name: Send Telegram review and approval actions
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "$RUN_URL" \
            --review-url "$REVIEW_URL" \
            --review-id "$REVIEW_ID" \
            --approval-mode manual

      - name: Confirm recovery contract
        run: |
          echo "Recovered existing render without rerendering."
          echo "Review URL: $REVIEW_URL"
          echo "Telegram manual approval actions sent."
          echo "No YouTube/TikTok/Instagram upload was performed."
