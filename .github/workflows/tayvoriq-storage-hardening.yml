name: TAYVORIQ Storage Hardening

on:
  push:
    branches: [main]
    paths:
      - ".automation/tayvoriq-storage-hardening.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tayvoriq-storage-hardening
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prevent exhausted artifact storage from failing production
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tayvoriq-golden-path.yml')
          text = path.read_text(encoding='utf-8')
          original = text

          compact_old = '''      - name: Upload compact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
'''
          compact_new = '''      - name: Upload compact diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
'''
          if compact_old in text and compact_new not in text:
              text = text.replace(compact_old, compact_new, 1)

          complete_old = '''      - name: Upload complete review artifacts
        if: always()
        uses: actions/upload-artifact@v4
'''
          complete_new = '''      - name: Upload complete review artifacts
        if: ${{ false }}
        uses: actions/upload-artifact@v4
'''
          if complete_old in text:
              text = text.replace(complete_old, complete_new, 1)

          text = text.replace('retention-days: 30', 'retention-days: 1')

          if text == original:
              print('Golden Path already hardened; no changes required.')
          else:
              path.write_text(text, encoding='utf-8')
              print('Golden Path hardened for exhausted Actions artifact storage.')
          PY

      - name: Commit storage hardening
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/tayvoriq-golden-path.yml; then
            echo "No storage hardening change required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tayvoriq-golden-path.yml
          git commit -m "ci(tayvoriq): tolerate exhausted artifact storage"
          git push origin main
          echo "Golden Path storage hardening committed." >> "$GITHUB_STEP_SUMMARY"
