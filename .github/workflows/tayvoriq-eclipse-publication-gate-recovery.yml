name: TAYVORIQ Eclipse Publication Gate Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/run-now/tayvoriq-eclipse-publication-recovery.json'

concurrency:
  group: tayvoriq-eclipse-publication-gate-recovery
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: '1'
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  publication-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read recovery request
        id: request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          req = json.loads(Path('.github/run-now/tayvoriq-eclipse-publication-recovery.json').read_text(encoding='utf-8'))
          assert req['source_run_id'] == 31636377040
          assert req['artifact_name'] == 'tayvoriq-eclipse-rebuild-31636377040'
          assert req['targets'] == 'youtube'
          assert req['rerender'] is False
          assert req['republish_before_human_approval'] is False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"source_run_id={req['source_run_id']}\n")
              fh.write(f"artifact_name={req['artifact_name']}\n")
          print('RECOVERY_REQUEST_VALID')
          PY

      - name: Restore passed eclipse artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: restored
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.source_run_id }}

      - name: Restore exact passed master and audit evidence
        run: |
          set -euo pipefail
          test -s restored/out/eclipsereview/job.json
          test -s restored/out/eclipsereview/short_youtube.mp4
          test -s restored/out/eclipsereview/preapproval_ai_audit.json
          rm -rf out/eclipsereview
          mkdir -p out
          cp -a restored/out/eclipsereview out/eclipsereview
          echo "PASSED_MASTER_RESTORED_WITHOUT_RERENDER"

      - name: Checkout fixed audit implementation
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: feature/multi-platform-distribution-package
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: audit-implementation
          fetch-depth: 1

      - name: Checkout review pages
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Install lightweight gate dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rsync
          python -m pip install -q requests python-dotenv

      - name: Run repaired YouTube publication quality gate
        id: quality
        env:
          PYTHONPATH: ${{ github.workspace }}/audit-implementation:${{ github.workspace }}/audit-implementation/tools
        run: |
          set -euo pipefail
          python audit-implementation/tools/tayvoriq_publication_quality_gate_v2.py \
            --job-dir out/eclipsereview \
            --targets youtube
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('out/eclipsereview/publication_quality_gate.json').read_text(encoding='utf-8'))
          assert report['passed'] is True
          assert report['targets'] == ['youtube_shorts']
          assert report['quality_gates_weakened'] is False
          assert report['production_mix']['passed'] is True
          print('YOUTUBE_PUBLICATION_GATE_RECOVERED')
          PY

      - name: Build YouTube approval review
        id: review
        env:
          PYTHONPATH: ${{ github.workspace }}/audit-implementation:${{ github.workspace }}/audit-implementation/tools
        run: |
          set -euo pipefail
          rm -rf site/tayvoriq
          python audit-implementation/tools/tayvoriq_build_youtube_review_site.py \
            --job-dir out/eclipsereview \
            --site-root site/tayvoriq \
            --run-id "${GITHUB_RUN_ID}"

      - name: Publish approval review page
        id: review_publish
        run: |
          set -euo pipefail
          mkdir -p pages-worktree/tayvoriq/latest pages-worktree/tayvoriq/runs/${GITHUB_RUN_ID}
          rsync -a --delete site/tayvoriq/latest/ pages-worktree/tayvoriq/latest/
          rsync -a site/tayvoriq/runs/${GITHUB_RUN_ID}/ pages-worktree/tayvoriq/runs/${GITHUB_RUN_ID}/
          cp site/tayvoriq/index.html pages-worktree/tayvoriq/index.html
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish recovered TAYVORIQ eclipse review ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Send Telegram approval review
        id: telegram
        env:
          PYTHONPATH: ${{ github.workspace }}/audit-implementation:${{ github.workspace }}/audit-implementation/tools
        run: |
          set -euo pipefail
          python audit-implementation/tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --dashboard-url "" \
            --review-id "${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"

      - name: Upload recovered approval artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-eclipse-publication-recovery-${{ github.run_id }}
          path: |
            out/eclipsereview/**
            site/tayvoriq/**
          retention-days: 30
          compression-level: 1

      - name: Telegram precise recovery failure
        if: failure()
        env:
          QUALITY: ${{ steps.quality.outcome }}
          REVIEW: ${{ steps.review.outcome }}
          REVIEW_PUBLISH: ${{ steps.review_publish.outcome }}
          TELEGRAM: ${{ steps.telegram.outcome }}
        run: |
          set +e
          stage="RECOVERY_UNKNOWN"
          detail="Der Artifact-only Recovery-Lauf ist fehlgeschlagen."
          if [ "$QUALITY" != "success" ]; then stage="YOUTUBE_PUBLICATION_GATE_RECOVERY"; detail="Der technische YouTube-Publication-Gate-Recovery hat blockiert.";
          elif [ "$REVIEW" != "success" ]; then stage="YOUTUBE_REVIEW_BUILD"; detail="Gate bestanden; Review-Seite konnte nicht gebaut werden.";
          elif [ "$REVIEW_PUBLISH" != "success" ]; then stage="YOUTUBE_REVIEW_PUBLISH"; detail="Gate bestanden; Review-Seite konnte nicht publiziert werden.";
          elif [ "$TELEGRAM" != "success" ]; then stage="TELEGRAM_REVIEW_DELIVERY"; detail="Gate und Review sind bestanden; nur Telegram ist fehlgeschlagen."; fi
          message=$(printf '❌ TAYVORIQ Sonnenfinsternis-Recovery blockiert\n\nRun: %s\nStufe: %s\n%s\n\nDer bestandene Master aus Run 31636377040 blieb unverändert. Nichts auf YouTube veröffentlicht.' "$GITHUB_RUN_ID" "$stage" "$detail")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${message}" >/dev/null
