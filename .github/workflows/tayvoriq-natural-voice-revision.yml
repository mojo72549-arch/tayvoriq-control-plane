name: TAYVORIQ Natural Voice Revision

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tayvoriq-natural-voice-revision.yml"
      - ".automation/tayvoriq-natural-voice-revision.json"

permissions:
  actions: read
  contents: read

concurrency:
  group: tayvoriq-natural-voice-revision
  cancel-in-progress: false

jobs:
  revise-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/implementation:${{ github.workspace }}/implementation/tools
      TAYVORIQ_TTS_PROVIDER: "chatterbox_v3"
      TAYVORIQ_CHATTERBOX_ENABLED: "true"
      TAYVORIQ_CHATTERBOX_MODEL_VERSION: "v3"
      TAYVORIQ_CHATTERBOX_LANGUAGE: "de"
      TAYVORIQ_CHATTERBOX_TIMEOUT_SECONDS: "360"
      TAYVORIQ_CHATTERBOX_CPU_THREADS: "4"
      TAYVORIQ_CHATTERBOX_EXAGGERATION: "0.42"
      TAYVORIQ_CHATTERBOX_CFG_WEIGHT: "0.36"
      TAYVORIQ_CHATTERBOX_NATURAL_PAUSE_MS: "360"
      TAYVORIQ_NATURAL_VOICE_WPM: "132"
      TAYVORIQ_NATURAL_VOICE_MIN_SECONDS: "23.5"
      TAYVORIQ_NATURAL_VOICE_MAX_SECONDS: "27.5"
      TAYVORIQ_AUDIO_END_PADDING_SECONDS: "1.25"
      TAYVORIQ_RENDER_SIZE: "1080x1920"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN PAGES_DEPLOY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            test -n "${!name:-}" || { echo "::error title=Missing secret::$name"; exit 2; }
          done

      - name: Checkout private natural-voice fix
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/shorts-agent-studio
          ref: fix/natural-chatterbox-review-retry
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: implementation
          fetch-depth: 1

      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          repository: mojo72549-arch/mind-reset-daily
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-worktree
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Restore Chatterbox cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: tayvoriq-chatterbox-v3-cpu-py311-v3

      - name: Install media and voice dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg rsync git
          python -m pip install --upgrade pip
          python -m pip install -r implementation/requirements.txt pytest
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0"
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@65b18437192794391a0308a8f705b1e33e633948"

      - name: Validate natural voice contract
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m compileall -q tools src
          python -m pytest -q \
            tests/test_tayvoriq_natural_chatterbox_v28.py \
            tests/test_tayvoriq_canonical_production_entrypoint.py \
            tests/test_tayvoriq_v27_canonical_final_package.py

      - name: Download rejected source review
        uses: actions/download-artifact@v4
        with:
          name: tayvoriq-review-30270382678
          path: rejected-review
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: mojo72549-arch/tayvoriq-control-plane
          run-id: 30270382678

      - name: Rerender with natural Chatterbox voice
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_revision_rerender.py \
            --artifact-root "${GITHUB_WORKSPACE}/rejected-review" \
            --out-dir "${GITHUB_WORKSPACE}/implementation/out/natural-voice-revision"

      - name: Validate revision evidence
        working-directory: implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path("out/natural-voice-revision")
          quality = json.loads((root / "quality_report.json").read_text(encoding="utf-8"))
          audio = json.loads((root / "audio_report.json").read_text(encoding="utf-8"))
          job = json.loads((root / "job.json").read_text(encoding="utf-8"))
          video = root / "short.mp4"

          failures = []
          if quality.get("passed") is not True:
              failures.append("revision_quality_failed")
          if audio.get("provider") != "chatterbox_multilingual_v3":
              failures.append(f"provider={audio.get('provider')}")
          if audio.get("fallback") is not False:
              failures.append("fallback_voice_used")
          if audio.get("review_voice_eligible") is not True:
              failures.append("review_voice_not_eligible")
          if job.get("approval_status") != "PENDING_REVIEW":
              failures.append(f"approval={job.get('approval_status')}")
          if job.get("upload_status") != "NOT_STARTED_PENDING_APPROVAL":
              failures.append(f"upload={job.get('upload_status')}")
          if not video.is_file() or video.stat().st_size < 100_000:
              failures.append("missing_mp4")
          if failures:
              raise SystemExit(", ".join(failures))

          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=width,height:format=duration", "-of", "json", str(video)],
              capture_output=True, text=True, check=True,
          )
          print(probe.stdout)
          print(json.dumps({
              "provider": audio.get("provider"),
              "voice_duration_seconds": audio.get("voice_duration_seconds"),
              "fallback": audio.get("fallback"),
              "review_voice_gate": audio.get("review_voice_gate"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Build and publish review page
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          REVIEW_ID="${GITHUB_RUN_ID}"
          TARGET="pages-worktree/tayvoriq/runs/${REVIEW_ID}"
          mkdir -p "$TARGET"
          cp implementation/out/natural-voice-revision/short.mp4 "$TARGET/tayvoriq-review.mp4"
          cp implementation/out/natural-voice-revision/audio_report.json "$TARGET/audio_report.json"
          cp implementation/out/natural-voice-revision/quality_report.json "$TARGET/quality_report.json"
          cat > "$TARGET/index.html" <<'HTML'
          <!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAYVORIQ Natural Voice Review</title><style>body{margin:0;background:#090b10;color:#fff;font-family:system-ui,sans-serif}main{max-width:560px;margin:auto;padding:24px}video{width:100%;max-height:78vh;background:#000;border-radius:18px}h1{font-size:1.35rem}.notice{padding:14px;border:1px solid #343947;border-radius:12px;background:#121620;color:#d3d7df;line-height:1.5}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#163822;color:#baf7c9;font-weight:700}a{color:#8fc8ff}</style></head><body><main><span class="badge">Chatterbox V3 · kein Fallback</span><h1>🎬 TAYVORIQ – überarbeitete Stimme</h1><video controls playsinline preload="metadata" src="tayvoriq-review.mp4"></video><div class="notice"><strong>Noch nicht veröffentlicht.</strong><p>Diese Revision verwendet natürliche Chatterbox-Zeit statt der abgelehnten Edge-TTS-Stimme. Schau sie vollständig an und entscheide anschließend in Telegram mit „Freigeben“ oder „Ablehnen“.</p></div><p><a href="tayvoriq-review.mp4">Video direkt öffnen</a></p></main></body></html>
          HTML
          touch pages-worktree/.nojekyll
          cd pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tayvoriq/runs/${REVIEW_ID}" .nojekyll
          git commit -m "Publish natural-voice TAYVORIQ review ${REVIEW_ID}"
          git push origin main

      - name: Upload revision artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayvoriq-review-${{ github.run_id }}
          path: |
            implementation/out/natural-voice-revision/**
          if-no-files-found: error
          retention-days: 30

      - name: Wait for review page
        run: |
          set -euo pipefail
          REVIEW_URL="https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/"
          for attempt in $(seq 1 30); do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$REVIEW_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Review page ready: $REVIEW_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Review page unavailable::$REVIEW_URL"
          exit 1

      - name: Send Telegram approval review
        working-directory: implementation
        run: |
          set -euo pipefail
          python tools/tayvoriq_send_telegram.py \
            --state SUCCESS \
            --conclusion success \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --review-url "https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/${GITHUB_RUN_ID}/" \
            --review-id "${GITHUB_RUN_ID}" \
            --approval-mode manual

      - name: Confirm no platform upload
        run: |
          echo "Natural Chatterbox revision published for human review."
          echo "No YouTube, TikTok or Instagram upload was performed."
