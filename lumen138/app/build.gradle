plugins { id 'com.android.application' }

def signingValues = [
        System.getenv('LUMEN_RELEASE_KEYSTORE_PATH'),
        System.getenv('LUMEN_RELEASE_STORE_PASSWORD'),
        System.getenv('LUMEN_RELEASE_KEY_ALIAS'),
        System.getenv('LUMEN_RELEASE_KEY_PASSWORD')
]
def releaseSigningReady = signingValues.every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.projectlumen.pilot.robust'
    compileSdk 35

    defaultConfig {
        applicationId 'com.projectlumen.pilot.robust'
        minSdk 26
        targetSdk 35
        versionCode 1320001
        versionName '13.2.0-rc1-release-hardening'
        buildConfigField 'String', 'BUILD_CHANNEL', '"internal-release-candidate"'
        buildConfigField 'boolean', 'PARENTAL_PROTECTION_ENABLED', 'true'
    }

    signingConfigs {
        if (releaseSigningReady) {
            create('release') {
                storeFile file(signingValues[0])
                storePassword signingValues[1]
                keyAlias signingValues[2]
                keyPassword signingValues[3]
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            buildConfigField 'boolean', 'DIAGNOSTICS_UI_ENABLED', 'true'
        }
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.getByName('release')
            }
            minifyEnabled true
            shrinkResources true
            buildConfigField 'boolean', 'DIAGNOSTICS_UI_ENABLED', 'false'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'UnsafeOptInUsageError'
    }

    buildFeatures { buildConfig true }
    packaging { resources.excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    def media3_version = '1.9.3'
    implementation "androidx.media3:media3-exoplayer:${media3_version}"
    implementation "androidx.media3:media3-exoplayer-hls:${media3_version}"
    implementation "androidx.media3:media3-ui:${media3_version}"

    testImplementation 'junit:junit:4.13.2'
}
