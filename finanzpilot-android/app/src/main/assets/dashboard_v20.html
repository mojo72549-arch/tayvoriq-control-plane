<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071525"><title>FinanzPilot 2.3</title><style>
:root{--bg:#071525;--card:#102944;--line:#294a67;--text:#f6f9fc;--muted:#9fb2c8;--good:#39d98a;--warn:#ffb24f;--bad:#ff6874;--blue:#66a9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:86px}.app{max-width:780px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px}.brand{font-size:26px;font-weight:950}.sub,.muted,.meta{font-size:11px;color:var(--muted);line-height:1.4}.pill{font-size:10px;padding:6px 8px;border:1px solid var(--line);border-radius:999px;background:#0d2945}.hero,.card,.metric{background:var(--card);border:1px solid var(--line);border-radius:18px}.hero{margin-top:14px;padding:16px;background:linear-gradient(135deg,#143a60,#0c2743)}.eyebrow{font-size:11px;color:#bad0e2;text-transform:uppercase}.big{font-size:34px;font-weight:950;margin:4px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.metric{padding:12px}.metric .l{font-size:11px;color:var(--muted)}.metric .v{font-size:19px;font-weight:900;margin-top:4px}.sec{margin-top:18px}.sec h2{font-size:18px;margin:0 0 8px}.card{padding:13px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #203c55}.row:last-child{border-bottom:0}.name{font-size:14px;font-weight:820}.amt{font-size:15px;font-weight:900;text-align:right}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.barrow{display:grid;grid-template-columns:110px 1fr 68px;gap:8px;align-items:center;margin:10px 0}.barlabel{font-size:12px}.track{height:11px;background:#081a2c;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:99px}.barval{text-align:right;font-size:12px;font-weight:850}.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(7,21,37,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.tab{border:0;background:transparent;color:#91a6ba;padding:8px 2px 11px;font-size:10px;font-weight:800}.tab b{display:block;font-size:19px}.tab.on{color:#fff;background:#0e2944}.upload{display:block;text-align:center;background:#2d7ce6;border-radius:14px;padding:13px;font-weight:900;color:#fff;margin-top:10px}.upload input{display:none}.btn{width:100%;border:0;border-radius:14px;padding:12px;background:#2d7ce6;color:#fff;font-weight:850;margin-top:8px}.btn.secondary{background:#173b5f;border:1px solid var(--line)}.tag{font-size:9px;padding:4px 6px;border-radius:999px;border:1px solid #3b5770;margin-left:5px}.active{color:#8ce8bc;background:#14372d}.old{color:#c7d0da;background:#1c2c3a}.alert{padding:12px;border-radius:15px;border:1px solid #5c4b2c;background:#2c271a;margin-top:8px}.alert.badbox{border-color:#5a3740;background:#2c1d24}.alert.goodbox{border-color:#28604d;background:#142d25}.alert b{font-size:13px}.alert p{font-size:12px;margin:4px 0 0;line-height:1.45;color:#dbc9a9}.alert.badbox p{color:#e3c4ca}.alert.goodbox p{color:#c4ded2}.details{display:none;margin-top:8px;border-top:1px solid #203c55}.details.open{display:block}.click{cursor:pointer}.merchant{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid #203c55}.input{width:100%;background:#0a2037;color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:10px 0}.field label{display:block;font-size:11px;color:#cbd9e5;margin-bottom:5px}.empty{text-align:center;padding:36px 16px;color:var(--muted)}@media(max-width:450px){.brand{font-size:24px}.big{font-size:31px}.barrow{grid-template-columns:92px 1fr 58px}}
</style></head><body><div class="app"><div class="top"><div><div class="brand">FinanzPilot 2.3</div><div class="sub">Familien-Finanzanalyse · CSV als Quelle</div></div><div class="pill" id="fresh">keine CSV</div></div><main id="main"></main></div><nav class="tabs" id="tabs"></nav><script>
const STORE='fp23_data',PLAN='fp23_plan';let DATA=load(STORE),TAB='today';const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n||0));const eur2=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n||0));const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function load(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function med(a){if(!a.length)return 0;const x=[...a].sort((a,b)=>a-b),m=Math.floor(x.length/2);return x.length%2?x[m]:(x[m-1]+x[m])/2}function mk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function days(a,b){return Math.round((b-a)/86400000)}function dd(x){return new Date(x).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})}
function parseCSV(t){const rows=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(q){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else{if(c==='"')q=true;else if(c===';'){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}}if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.length>1)}function num(s){return Number(String(s||'0').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,''))||0}function pd(s){const m=String(s||'').match(/(\d{2})\.(\d{2})\.(\d{2,4})/);if(!m)return null;let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1])}function norm(s){return String(s||'Ohne Händler').replace(/\s+/g,' ').trim().slice(0,72)}
function fixedRule(r){const t=r.text;if(/ca auto bank/.test(t)&&/rate per/.test(t))return['CA Auto Bank','Finanzierungen','monthly'];if(/lichtblick/.test(t)&&/abschlag/.test(t)&&/strom/.test(t))return['LichtBlick · Strom','Energie','monthly'];if(/gruenwelt|grünwelt/.test(t)&&/abschlag/.test(t)&&/gas/.test(t))return['Grünwelt · Gas','Energie','monthly'];if(/enbw/.test(t)&&/abschlagsforderung/.test(t)&&/strom/.test(t))return['EnBW · Strom','Energie','monthly'];if(/rate amc finanzkauf/.test(t))return['AMC Finanzkauf','Finanzierungen','monthly'];if(/ikano/.test(t)&&/visa-abrechnung|vertrags id/.test(t))return['Ikano','Finanzierungen','monthly'];if(/telefonica germany/.test(t)&&/tarifrechnung/.test(t))return['Telefonica · Tarif','Telefon','monthly'];if(/telefonica germany/.test(t)&&/ratenplan/.test(t))return['Telefonica · Geräte-Rate','Finanzierungen','monthly'];if(/vpv allgemeine/.test(t)&&/schutz-paket/.test(t))return['VPV Schutz-Paket','Versicherung','monthly'];if(/stuttgarter strassenbahnen/.test(t)&&Math.abs(r.amount)>=30)return['ÖPNV-Abo','Mobilität','monthly'];if(/kontoführung|kontofuehrung/.test(t))return['Kontoführung','Bank','monthly'];if(/huk24/.test(t))return['HUK24 Kfz','Versicherung','annual'];return null}
function vcat(r){const t=r.text,c=r.cat.toLowerCase();if(fixedRule(r))return null;if(/bargeldauszahlung|geldautomat/.test(t)||c.includes('bargeld'))return'Bargeld';if(/aral|shell|esso|avia|jet tank|tankstelle|totalenergies|bft |eni |agip/.test(t))return'Tanken';if(/restaurant|imbiss|mcdonald|burger king|lieferando|doener|döner|pizza|kebab|cafe |café /.test(t))return'Essen unterwegs';if(c.includes('lebensmittel')||c.includes('drogerie')||/lidl|aldi|kaufland|rewe|edeka|penny|netto|rossmann|dm drogerie|müller drogerie|mueller drogerie|supermarkt|backkultur|bäck|baeck/.test(t))return'Lebensmittel & Drogerie';if(c.includes('bekleidung')||c.includes('einkäufe')||c.includes('einkaeufe')||/amazon|action |tedi|woolworth|primark|zara|deichmann|babyone|temu|otto/.test(t))return'Shopping';if(c.includes('gesundheit')||/apotheke/.test(t))return'Gesundheit';if(c.includes('freizeit')||/netflix|kino/.test(t))return'Freizeit';if(c.includes('wohnen')||c.includes('garten'))return'Haushalt/Wohnen';if(/rückgabe lastschrift|rueckgabe lastschrift|rücklast|ruecklast/.test(t))return'Rücklastschrift';return'Sonstiges'}
function analyze(text){const rr=parseCSV(text);if(rr.length<2)throw Error('CSV leer');const h=rr.shift().map(x=>x.trim().toLowerCase()),ix=(...n)=>{for(const z of n){const i=h.indexOf(z.toLowerCase());if(i>=0)return i}return-1};const di=ix('buchungstag','valutadatum'),ai=ix('betrag'),ci=ix('kategorie'),pi=ix('verwendungszweck'),mi=ix('beguenstigter/zahlungspflichtiger','begünstigter/zahlungspflichtiger'),bi=ix('buchungstext');if(di<0||ai<0)throw Error('BW-Bank-Spalten nicht erkannt');const rows=[];for(const a of rr){const date=pd(a[di]);if(!date)continue;const amount=num(a[ai]),merchant=norm(a[mi]||''),purpose=a[pi]||'',cat=a[ci]||'',bt=a[bi]||'',text=(merchant+' '+purpose+' '+cat+' '+bt).toLowerCase();rows.push({date,amount,merchant,purpose,cat,bt,text})}rows.sort((a,b)=>a.date-b.date);const max=rows.at(-1).date,min=rows[0].date;const salaries=rows.filter(r=>r.amount>1000&&/vpv|gehalt|lohn/.test(r.text));const cycleStart=salaries.length?salaries.at(-1).date:new Date(max.getFullYear(),max.getMonth(),24);if(cycleStart>max)cycleStart.setMonth(cycleStart.getMonth()-1);const cycle=rows.filter(r=>r.date>=cycleStart&&r.date<=max),income=cycle.filter(r=>r.amount>0).reduce((s,r)=>s+r.amount,0),out=-cycle.filter(r=>r.amount<0).reduce((s,r)=>s+r.amount,0),net=income-out;
 const buckets={};for(const r of rows){if(r.amount>=0)continue;const q=fixedRule(r);if(!q)continue;const [name,category,interval]=q;(buckets[name]=buckets[name]||{name,category,interval,items:[]}).items.push(r)}const active=[],history=[];for(const b of Object.values(buckets)){const by={};for(const r of b.items){const k=mk(r.date);if(!by[k]||r.date>by[k].date)by[k]=r}const vals=Object.values(by).sort((a,b)=>a.date-b.date),last=vals.at(-1),age=days(last.date,max),amount=b.interval==='annual'?(-last.amount)/12:med(vals.slice(-3).map(r=>-r.amount)),o={name:b.name,category:b.category,interval:b.interval,amount,last:last.date.toISOString(),months:vals.length};(b.interval==='annual'?age<=400:age<=75?active:history).push(o)}active.sort((a,b)=>b.amount-a.amount);history.sort((a,b)=>b.last.localeCompare(a.last));const fixedMonthly=active.reduce((s,x)=>s+x.amount,0),financeMonthly=active.filter(x=>x.category==='Finanzierungen').reduce((s,x)=>s+x.amount,0);
 const cat={},merchants={};for(const r of cycle){if(r.amount>=0)continue;const c=vcat(r);if(!c)continue;cat[c]=(cat[c]||0)-r.amount;(merchants[c]=merchants[c]||{});const n=(c==='Sonstiges'||c==='Rücklastschrift')?'Weitere Ausgabe':r.merchant;merchants[c][n]=(merchants[c][n]||0)-r.amount}const top=cycle.filter(r=>r.amount<0).map(r=>({name:vcat(r)||fixedRule(r)?.[0]||'Ausgabe',merchant:(vcat(r)==='Sonstiges'?'Weitere Ausgabe':r.merchant),amount:-r.amount,date:r.date.toISOString()})).sort((a,b)=>b.amount-a.amount).slice(0,12);const returns=cycle.filter(r=>/rückgabe lastschrift|rueckgabe lastschrift|rücklast|ruecklast/.test(r.text)).length;return{min:min.toISOString(),max:max.toISOString(),cycleStart:cycleStart.toISOString(),elapsed:Math.max(1,days(cycleStart,max)+1),cycleDays:Math.max(28,Math.min(35,days(cycleStart,new Date(cycleStart.getFullYear(),cycleStart.getMonth()+1,cycleStart.getDate())))),income,out,net,fixedMonthly,financeMonthly,active,history,cat,merchants,top,returns}}
function plan(){return Object.assign({food:1250,shopping:600,fuel:220,cash:200,futurePlus:900},load(PLAN)||{})}function bars(obj,n=10){const a=Object.entries(obj).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,n),mx=Math.max(1,...a.map(x=>x[1]));return a.map(([k,v])=>`<div class="barrow"><div class="barlabel">${esc(k)}</div><div class="track"><div class="fill" style="width:${Math.max(2,v/mx*100)}%"></div></div><div class="barval">${eur(v)}</div></div>`).join('')||'<div class="empty">Keine Daten.</div>'}
function tabs(){const t=[['today','⌂','Heute'],['spend','▥','Ausgaben'],['fixed','◈','Fix'],['family','⌁','Familie'],['data','⇩','Daten']];document.getElementById('tabs').innerHTML=t.map(x=>`<button class="tab ${TAB===x[0]?'on':''}" data-t="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render()})}
function today(){const p=plan(),food=(DATA.cat['Lebensmittel & Drogerie']||0)+(DATA.cat['Essen unterwegs']||0),shop=DATA.cat.Shopping||0,fuel=DATA.cat.Tanken||0,cash=DATA.cat.Bargeld||0,strong={};for(const [k,v] of Object.entries(DATA.cat))strong[k]=v;for(const x of DATA.active)strong[x.category]=(strong[x.category]||0)+x.amount;const killers=[['Essen',food,p.food],['Shopping',shop,p.shopping],['Tanken',fuel,p.fuel],['Bargeld',cash,p.cash]].sort((a,b)=>(b[1]-b[2])-(a[1]-a[2]));return `<section><div class="hero"><div class="eyebrow">Seit letztem Gehalt ${dd(DATA.cycleStart)}</div><div class="big ${DATA.net>=0?'good':'bad'}">${DATA.net>=0?'+':'−'}${eur(Math.abs(DATA.net))}</div><div class="muted">Einnahmen ${eur(DATA.income)} · Abgänge ${eur(DATA.out)} · CSV bis ${dd(DATA.max)}</div></div><div class="grid"><div class="metric"><div class="l">Aktive Fixkosten</div><div class="v">${eur(DATA.fixedMonthly)}</div></div><div class="metric"><div class="l">Finanzierungen</div><div class="v warn">${eur(DATA.financeMonthly)}</div></div><div class="metric"><div class="l">Essen bisher</div><div class="v">${eur(food)}</div></div><div class="metric"><div class="l">Shopping bisher</div><div class="v">${eur(shop)}</div></div></div><div class="sec"><h2>Wo geht das Geld hin?</h2><div class="card">${bars(strong,9)}</div></div><div class="sec"><h2>Was macht uns gerade Druck?</h2>${killers.slice(0,3).map((x,i)=>{const over=x[1]-x[2];return `<div class="alert ${over>0?'badbox':'goodbox'}"><b>${i+1}. ${x[0]}: ${eur(x[1])} von ${eur(x[2])}</b><p>${over>0?'Bereits '+eur(over)+' über Familienziel. Hier sofort bremsen.':'Noch '+eur(Math.max(0,-over))+' bis zum Ziel verfügbar.'}</p></div>`}).join('')}${DATA.returns?`<div class="alert badbox"><b>Rücklastschriften: ${DATA.returns}</b><p>Kontopuffer priorisieren und ungeplante Abbuchungen vermeiden.</p></div>`:''}</div><div class="sec"><h2>Größte Einzelabbuchungen</h2><div class="card">${DATA.top.slice(0,8).map(x=>`<div class="row"><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.merchant)} · ${dd(x.date)}</div></div><div class="amt">${eur(x.amount)}</div></div>`).join('')}</div></div></section>`}
function catCard(c,target){const v=DATA.cat[c]||0,m=DATA.merchants[c]||{},id='d'+Math.random().toString(36).slice(2);return `<div class="card click" style="margin-bottom:8px" onclick="document.getElementById('${id}').classList.toggle('open')"><div class="row"><div><div class="name">${esc(c)}</div><div class="meta">Tippen für Händler${target?' · Ziel '+eur(target):''}</div></div><div class="amt">${eur(v)}</div></div><div class="details" id="${id}">${Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([n,a])=>`<div class="merchant"><div>${esc(n)}</div><b>${eur(a)}</b></div>`).join('')||'<div class="muted">Keine Händlerdetails.</div>'}</div></div>`}
function spend(){const p=plan();return `<section><div class="hero"><div class="eyebrow">Starke Ausgaben · aktueller Gehaltszyklus</div><div class="big">${eur(DATA.out)}</div><div class="muted">Alles aus der CSV seit ${dd(DATA.cycleStart)}.</div></div><div class="sec"><h2>Steuerbare Bereiche</h2>${catCard('Lebensmittel & Drogerie',p.food)}${catCard('Essen unterwegs',0)}${catCard('Shopping',p.shopping)}${catCard('Tanken',p.fuel)}${catCard('Bargeld',p.cash)}${['Haushalt/Wohnen','Freizeit','Gesundheit','Sonstiges'].filter(c=>(DATA.cat[c]||0)>0).map(c=>catCard(c,0)).join('')}</div></section>`}
function fixed(){const cats={};for(const x of DATA.active)cats[x.category]=(cats[x.category]||0)+x.amount;return `<section><div class="hero"><div class="eyebrow">Aktive Verpflichtungen aus CSV</div><div class="big">${eur(DATA.fixedMonthly)}/Mon.</div><div class="muted">Alte Anbieter zählen nicht in die aktuelle Summe.</div></div><div class="sec"><h2>Nach Bereich</h2><div class="card">${bars(cats)}</div></div><div class="sec"><h2>Aktiv</h2><div class="card">${DATA.active.map(x=>`<div class="row"><div><div class="name">${esc(x.name)} <span class="tag active">AKTIV</span></div><div class="meta">${esc(x.category)} · zuletzt ${dd(x.last)}</div></div><div class="amt">${eur2(x.amount)}</div></div>`).join('')}</div></div><div class="sec"><h2>Historisch</h2><div class="card">${DATA.history.map(x=>`<div class="row"><div><div class="name">${esc(x.name)} <span class="tag old">ALT</span></div><div class="meta">zuletzt ${dd(x.last)}</div></div><div class="amt muted">${eur2(x.amount)}</div></div>`).join('')||'<div class="muted">Keine.</div>'}</div></div></section>`}
function family(){const p=plan(),food=(DATA.cat['Lebensmittel & Drogerie']||0)+(DATA.cat['Essen unterwegs']||0),spent={food,shopping:DATA.cat.Shopping||0,fuel:DATA.cat.Tanken||0,cash:DATA.cat.Bargeld||0},leftDays=Math.max(1,DATA.cycleDays-DATA.elapsed+1),stat=(v,t)=>{const proj=v/DATA.elapsed*DATA.cycleDays;return{proj,left:Math.max(0,t-v),traffic:proj<=t?'🟢':proj<=t*1.1?'🟡':'🔴'}};const a=stat(spent.food,p.food),b=stat(spent.shopping,p.shopping),c=stat(spent.fuel,p.fuel),d=stat(spent.cash,p.cash),safe=Math.max(0,p.food-spent.food)+Math.max(0,p.shopping-spent.shopping)+Math.max(0,p.fuel-spent.fuel);return `<section><div class="hero"><div class="eyebrow">Unser Familienplan</div><div class="big">${leftDays} Tage bis ca. Gehalt</div><div class="muted">Gemeinsam: Fixkosten zuerst, dann Wochenbudget, dann sparen.</div></div><div class="sec"><h2>Ampel</h2><div class="card">${[['Essen',spent.food,p.food,a],['Shopping',spent.shopping,p.shopping,b],['Tanken',spent.fuel,p.fuel,c],['Bargeld',spent.cash,p.cash,d]].map(x=>`<div class="row"><div><div class="name">${x[3].traffic} ${x[0]}</div><div class="meta">Hochrechnung ${eur(x[3].proj)} · noch ca. ${eur(x[3].left/leftDays*7)}/Woche</div></div><div class="amt">${eur(x[1])} / ${eur(x[2])}</div></div>`).join('')}</div></div><div class="sec"><h2>So stehen wir dagegen</h2>${a.proj>p.food?'<div class="alert badbox"><b>Essen bremsen</b><p>Nur geplante Einkäufe, Wochenbetrag oben einhalten.</p></div>':'<div class="alert goodbox"><b>Essen im Rahmen</b><p>Wochenbudget weiter einhalten.</p></div>'}${b.proj>p.shopping?'<div class="alert badbox"><b>Shopping-Pause</b><p>Bis zum nächsten Gehalt nur notwendige Käufe.</p></div>':'<div class="alert goodbox"><b>Shopping im Rahmen</b><p>Kleine Einzelkäufe nicht unterschätzen.</p></div>'}<div class="alert"><b>Finanzierungen: ${eur(DATA.financeMonthly)}/Mon.</b><p>Jede erledigte Rate wird später Sparrate. Keine neuen Ratenkäufe.</p></div></div><div class="sec"><h2>Freier Hebel</h2><div class="card"><div class="row"><div><div class="name">Noch in Limits verfügbar</div><div class="meta">Essen + Shopping + Tanken</div></div><div class="amt good">${eur(safe)}</div></div><div class="row"><div><div class="name">Geplantes Netto-Plus künftig</div><div class="meta">PLAN, nicht CSV</div></div><div class="amt good">+${eur(p.futurePlus)}</div></div></div></div><div class="sec"><h2>Limits ändern</h2><div class="card"><div class="twocol"><div class="field"><label>Essen</label><input class="input" id="pf" value="${p.food}"></div><div class="field"><label>Shopping</label><input class="input" id="ps" value="${p.shopping}"></div><div class="field"><label>Tanken</label><input class="input" id="pt" value="${p.fuel}"></div><div class="field"><label>Bargeld</label><input class="input" id="pc" value="${p.cash}"></div></div><div class="field"><label>Geplantes Netto-Plus</label><input class="input" id="pp" value="${p.futurePlus}"></div><button class="btn" id="savePlan">Speichern</button></div></div></section>`}
function dataView(){return `<section><div class="hero"><div class="eyebrow">Quelle der Wahrheit</div><div class="big">CSV → Analyse</div><div class="muted">IST kommt aus Buchungen. PLAN bleibt separat.</div></div><div class="sec"><h2>CSV aktualisieren</h2><div class="card"><label class="upload">BW-Bank CSV auswählen<input id="file" type="file" accept=".csv,text/csv,text/plain"></label><div class="muted" style="margin-top:8px">Datenstand ${DATA?dd(DATA.max):'–'}</div></div></div><button class="btn secondary" id="clear">Lokale Analyse löschen</button></section>`}
function render(){tabs();document.getElementById('fresh').textContent=DATA?'CSV bis '+dd(DATA.max):'keine CSV';const m=document.getElementById('main');if(!DATA){m.innerHTML=`<div class="empty"><div style="font-size:44px">📊</div><h2>Familienanalyse starten</h2><p>BW-Bank-CSV importieren. Danach siehst du starke Ausgaben, Diagramme, Händler, Fixkosten und Familienregeln.</p><label class="upload">CSV auswählen<input id="file" type="file" accept=".csv,text/csv,text/plain"></label></div>`;wire();return}m.innerHTML=TAB==='today'?today():TAB==='spend'?spend():TAB==='fixed'?fixed():TAB==='family'?family():dataView();wire()}
function wire(){const f=document.getElementById('file');if(f)f.onchange=async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const b=await file.arrayBuffer();let t;try{t=new TextDecoder('windows-1252').decode(b)}catch(_){t=new TextDecoder().decode(b)}DATA=analyze(t);save(STORE,DATA);TAB='today';render()}catch(err){alert('CSV konnte nicht ausgewertet werden: '+err.message)}};const sp=document.getElementById('savePlan');if(sp)sp.onclick=()=>{save(PLAN,{food:num(document.getElementById('pf').value),shopping:num(document.getElementById('ps').value),fuel:num(document.getElementById('pt').value),cash:num(document.getElementById('pc').value),futurePlus:num(document.getElementById('pp').value)});render()};const cl=document.getElementById('clear');if(cl)cl.onclick=()=>{localStorage.removeItem(STORE);DATA=null;TAB='data';render()}}
render();</script></body></html>
