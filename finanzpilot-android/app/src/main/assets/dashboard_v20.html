<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FinanzPilot</title>
<style>
:root{--bg:#071525;--card:#0f2943;--card2:#12324f;--line:#294a67;--text:#f5f8fb;--muted:#9fb2c8;--good:#39d98a;--warn:#ffb24f;--bad:#ff6874;--blue:#66a9ff;--purple:#a58cff;--cyan:#55d3d8;--pink:#ef8ab8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:760px;margin:auto;padding:16px 14px 92px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:28px;font-weight:950;letter-spacing:-.6px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.btn{border:1px solid var(--line);background:#173b5f;color:white;border-radius:12px;padding:9px 11px;font-weight:800}.hero{margin-top:15px;background:linear-gradient(135deg,#143a60,#0c2743);border:1px solid #315a7e;border-radius:22px;padding:16px}.hero .label{font-size:12px;color:#bfd0df}.hero .big{font-size:36px;font-weight:950;margin:4px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px}.metric .l{font-size:11px;color:var(--muted)}.metric .v{font-size:20px;font-weight:900;margin-top:4px}.sec{margin-top:18px}.sec h2{font-size:18px;margin:0 0 9px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #203c55}.row:last-child{border-bottom:0}.name{font-size:14px;font-weight:820}.meta{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.38}.amt{font-size:16px;font-weight:900;text-align:right}.pill{font-size:10px;padding:5px 7px;border-radius:999px;border:1px solid #3b5770;display:inline-block;margin-left:6px}.active{color:#8ce8bc;background:#14372d}.old{color:#c6d0da;background:#1d2b37}.warn{color:#ffd08a;background:#352b1c}.good{color:var(--good)}.bad{color:var(--bad)}.muted{color:var(--muted)}.chartRow{display:grid;grid-template-columns:110px 1fr 70px;gap:9px;align-items:center;margin:9px 0}.chartLabel{font-size:12px;color:#d6e0e9}.bar{height:11px;background:#081a2c;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--blue)}.chartVal{text-align:right;font-size:12px;font-weight:850}.donutWrap{display:grid;grid-template-columns:145px 1fr;gap:14px;align-items:center}.donut{width:140px;height:140px;border-radius:50%;position:relative;background:#18344e}.donut:after{content:"";position:absolute;inset:24px;background:var(--card);border-radius:50%}.donutCenter{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;font-weight:900;font-size:18px}.legend{display:grid;gap:7px}.leg{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center;font-size:11px}.dot{width:10px;height:10px;border-radius:3px}.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(7,21,37,.98);border-top:1px solid #294a67;display:grid;grid-template-columns:repeat(5,1fr);z-index:30}.tab{border:0;background:transparent;color:#9fb2c8;padding:10px 4px 12px;font-size:10px;font-weight:800}.tab b{display:block;font-size:19px;margin-bottom:2px}.tab.on{color:white;background:#0f2943}.view{display:none}.view.on{display:block}.upload{display:block;text-align:center;background:#2d7ce6;border-radius:14px;padding:13px;font-weight:900;color:white;margin-top:12px}.upload input{display:none}.empty{text-align:center;padding:40px 18px}.empty .icon{font-size:44px}.click{cursor:pointer}.details{display:none;margin-top:9px;border-top:1px solid #203c55}.details.open{display:block}.shopRow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid #203c55}.shopRow:last-child{border-bottom:0}.advisor{border-radius:16px;padding:12px;margin-top:8px;background:#142d25;border:1px solid #28604d}.advisor.warnbox{background:#2c271a;border-color:#5c4b2c}.advisor.badbox{background:#2c1d24;border-color:#5a3740}.advisor b{font-size:13px}.advisor p{font-size:12px;line-height:1.45;color:#c6ddd3;margin:4px 0 0}.advisor.warnbox p{color:#dbc9a9}.advisor.badbox p{color:#e2c4c9}.monthbar{display:flex;align-items:end;gap:5px;height:120px;padding-top:8px}.mb{flex:1;background:var(--blue);border-radius:5px 5px 2px 2px;min-height:2px;position:relative}.mlabels{display:flex;gap:5px;margin-top:5px}.mlabels span{flex:1;text-align:center;font-size:9px;color:var(--muted)}.historyCard{opacity:.78}.note{font-size:11px;line-height:1.45;color:var(--muted);margin-top:8px}@media(max-width:430px){.title{font-size:25px}.donutWrap{grid-template-columns:120px 1fr}.donut{width:116px;height:116px}.donut:after{inset:20px}.hero .big{font-size:32px}.chartRow{grid-template-columns:94px 1fr 58px}}
</style></head><body><div class="app" id="app"></div><div class="tabs" id="tabs"></div><script>
const STORE='fp_v20_summary';let DATA=load();let TAB='overview';const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n||0));const eur0=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n||0));const dstr=s=>{if(!s)return'–';const d=new Date(s);return d.toLocaleDateString('de-DE')};function load(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}function save(){localStorage.setItem(STORE,JSON.stringify(DATA))}function parseCSV(t){const rows=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(q){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else{if(c==='"')q=true;else if(c===';'){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}}if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.length>1)}function num(s){return Number(String(s||'0').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,''))||0}function pd(s){const m=String(s||'').match(/(\d{2})\.(\d{2})\.(\d{2,4})/);if(!m)return null;let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1])}function mk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function med(a){if(!a.length)return 0;const x=[...a].sort((a,b)=>a-b),m=Math.floor(x.length/2);return x.length%2?x[m]:(x[m-1]+x[m])/2}function days(a,b){return Math.abs((b-a)/86400000)}function normalizeMerchant(s){return String(s||'Ohne Händler').replace(/\s+/g,' ').trim().slice(0,70)}function isReturnFee(t){return /rückgabe lastschrift|rueckgabe lastschrift|rücklast|ruecklast/.test(t)}
function fixedRule(r){const t=r.text;if(/ca auto bank/.test(t)&&/rate per/.test(t))return ['CA Auto Bank','Finanzierung','monthly'];if(/lichtblick/.test(t)&&/abschlag/.test(t)&&/strom/.test(t))return ['LichtBlick · Strom','Energie','monthly'];if(/gruenwelt/.test(t)&&/abschlag gas/.test(t))return ['Grünwelt · Gas','Energie','monthly'];if(/enbw/.test(t)&&/abschlagsforderung/.test(t)&&/strom/.test(t))return ['EnBW · Strom','Energie','monthly'];if(/rate amc finanzkauf/.test(t))return ['AMC Finanzkauf','Finanzierung','monthly'];if(/telefonica germany/.test(t)&&/tarifrechnung/.test(t))return ['Telefonica · Tarif','Telekommunikation','monthly'];if(/telefonica germany/.test(t)&&/ratenplan/.test(t))return ['Telefonica · Geräte-Rate','Finanzierung','monthly'];if(/vpv allgemeine/.test(t)&&/schutz-paket/.test(t))return ['VPV Schutz-Paket','Versicherung','monthly'];if(/stuttgarter strassenbahnen/.test(t)&&/tayar,mirac/.test(t))return ['Schülerticket','Mobilität','monthly'];if(/kontoführung/.test(t))return ['Kontoführung','Bank','monthly'];if(/ditib/.test(t)&&/mitgliedsbeitrag/.test(t))return ['Mitgliedsbeitrag','Optional','monthly'];if(/ikano/.test(t)&&!isReturnFee(t))return ['Ikano','Finanzierung','monthly'];if(/huk24/.test(t))return ['HUK24 Kfz','Versicherung','annual'];return null}
function ottoStreams(rows,maxDate){const map={};for(const r of rows){if(r.amount>=0||!/otto/.test(r.text)||isReturnFee(r.text))continue;let key=null;if(/rate\s+\d+\s+von\s+\d+/.test(r.text)){const m=r.purpose.match(/Rechnung\s+R-DE-[^-]+-\d+-(\d+)/i);key=m?'rate-'+m[1]:'rate-'+Math.round(-r.amount*100)}else{const p=r.purpose.trim();if(/^CR[A-Z]-[A-Z0-9-]+/i.test(p))key='code-'+p.split(/\s+/)[0]}if(!key)continue;(map[key]=map[key]||[]).push(r)}const out=[];for(const [key,xs] of Object.entries(map)){const by={};for(const r of xs){const k=mk(r.date);if(!by[k]||r.date>by[k].date)by[k]=r}const vals=Object.values(by).sort((a,b)=>a.date-b.date);const last=vals.at(-1),active=days(last.date,maxDate)<=70,amount=med(vals.slice(-3).map(r=>-r.amount));if(active&&(vals.length>=2||/rate-/.test(key)))out.push({name:'OTTO Rate',category:'Finanzierung',interval:'monthly',amount,last:last.date.toISOString(),months:vals.length,key})}return out}
function analyze(text){const rr=parseCSV(text);if(rr.length<2)throw new Error('CSV leer');const h=rr.shift().map(x=>x.trim().toLowerCase());const ix=(...names)=>{for(const n of names){const i=h.indexOf(n.toLowerCase());if(i>=0)return i}return-1};const di=ix('buchungstag','valutadatum'),ai=ix('betrag'),ci=ix('kategorie'),pi=ix('verwendungszweck'),mi=ix('beguenstigter/zahlungspflichtiger','begünstigter/zahlungspflichtiger');if(di<0||ai<0)throw new Error('BW-Bank-Spalten nicht erkannt');const rows=[];for(const a of rr){const date=pd(a[di]),amount=num(a[ai]);if(!date)continue;const merchant=normalizeMerchant(a[mi]||''),purpose=a[pi]||'',cat=a[ci]||'',text=(merchant+' '+purpose+' '+cat).toLowerCase();rows.push({date,amount,merchant,purpose,cat,text})}rows.sort((a,b)=>a.date-b.date);const maxDate=rows.at(-1).date,minDate=rows[0].date;const fixedBuckets={};for(const r of rows){if(r.amount>=0||isReturnFee(r.text))continue;const rule=fixedRule(r);if(!rule)continue;const [name,category,interval]=rule;(fixedBuckets[name]=fixedBuckets[name]||{name,category,interval,items:[]}).items.push(r)}const fixed=[],history=[];for(const b of Object.values(fixedBuckets)){const by={};for(const r of b.items){const k=mk(r.date);if(!by[k]||r.date>by[k].date)by[k]=r}const vals=Object.values(by).sort((a,b)=>a.date-b.date),last=vals.at(-1);let amount=b.interval==='annual'?(-last.amount)/12:med(vals.slice(-3).map(r=>-r.amount));const age=days(last.date,maxDate),active=b.interval==='annual'?age<=400:age<=75,obj={name:b.name,category:b.category,interval:b.interval,amount,last:last.date.toISOString(),months:vals.length,sourceAmount:-last.amount};(active?fixed:history).push(obj)}for(const o of ottoStreams(rows,maxDate))fixed.push(o);fixed.sort((a,b)=>b.amount-a.amount);history.sort((a,b)=>b.last.localeCompare(a.last));const fixedTotal=fixed.reduce((s,x)=>s+x.amount,0),fixedCat={};for(const x of fixed)fixedCat[x.category]=(fixedCat[x.category]||0)+x.amount;const isFixedTx=r=>!!fixedRule(r)||(/otto/.test(r.text)&&(/rate\s+\d+\s+von\s+\d+/.test(r.text)||/^CR[A-Z]-[A-Z0-9-]+/i.test(r.purpose.trim())));
function vcat(r){const t=r.text,c=r.cat.toLowerCase();if(/ca auto bank|lichtblick|gruenwelt|enbw|ikano|telefonica germany|vpv allgemeine|huk24|rate amc finanzkauf|stuttgarter strassenbahnen|ditib/.test(t))return null;if(/tobaccoland|tabak|zigarr|cigarette|iqos/.test(t))return'Tabak';if(/jet |shell|esso|avia|aral|hem tank|agip|eni |tankstelle|totalenergies|bft |sprint.*rotweg/.test(t))return'Tanken';if(c.includes('lebensmittel')||c.includes('drogerie')||/lidl|aldi|kaufland|rewe|edeka|penny|netto|rossmann|mg supermarkt|oezlem|özlem|baeck|bäck|backkultur/.test(t))return'Lebensmittel & Drogerie';if(c.includes('bekleidung')||c.includes('einkäufe')||c.includes('einkaeufe')||/amazon|action |tedi|woolworth|primark|zara|deichmann|babyone|temu/.test(t))return'Shopping';if(c.includes('freizeit'))return'Freizeit';if(c.includes('gesundheit'))return'Gesundheit';if(c.includes('bargeld')||/bargeldauszahlung|geldautomat/.test(t))return'Bargeld';if(c.includes('wohnen')||c.includes('garten'))return'Haushalt & Wohnen';if(c.includes('mobilität')||c.includes('mobilitaet'))return'Mobilität sonstig';return null}
const fullMonths=[];let cur=new Date(minDate.getFullYear(),minDate.getMonth()+1,1),lastFull=new Date(maxDate.getFullYear(),maxDate.getMonth(),1);while(cur<lastFull){fullMonths.push(mk(cur));cur=new Date(cur.getFullYear(),cur.getMonth()+1,1)}const monthly={};for(const k of fullMonths)monthly[k]={};const merchants={};for(const r of rows){if(isFixedTx(r)||isReturnFee(r.text))continue;const vc=vcat(r);if(!vc)continue;if(r.amount>0&&!/rückzahlung|rueckzahlung|erstattung|retoure|gutschrift/.test(r.text))continue;const k=mk(r.date);if(!monthly[k]&&k!==mk(maxDate))continue;const delta=-r.amount;if(monthly[k])monthly[k][vc]=(monthly[k][vc]||0)+delta;if(r.amount<0){merchants[vc]=merchants[vc]||{};const q=merchants[vc][r.merchant]||{sum:0,n:0};q.sum+=-r.amount;q.n++;merchants[vc][r.merchant]=q}}const varCats={};for(const k of fullMonths){for(const [c,v] of Object.entries(monthly[k]))varCats[c]=(varCats[c]||0)+v}for(const c of Object.keys(varCats))varCats[c]/=Math.max(1,fullMonths.length);const monthVar=fullMonths.map(k=>({month:k,total:Object.values(monthly[k]).reduce((a,b)=>a+b,0)}));return{imported:new Date().toISOString(),range:{min:minDate.toISOString(),max:maxDate.toISOString()},fixed,history,fixedTotal,fixedCat,varCats,merchants,monthVar,fullMonths}}
function fileInput(){return '<label class="upload">BW-Bank CSV einlesen<input id="csv" type="file" accept=".csv,text/csv,text/plain"></label>'}function bindFile(){const f=document.getElementById('csv');if(f)f.onchange=async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const buf=await file.arrayBuffer();let txt;try{txt=new TextDecoder('windows-1252').decode(buf)}catch(_){txt=new TextDecoder().decode(buf)}DATA=analyze(txt);save();render()}catch(err){alert('CSV konnte nicht ausgewertet werden: '+err.message)}}}function header(){return `<div class="top"><div><div class="title">FinanzPilot</div><div class="sub">klar · aktuell · nachvollziehbar</div></div><button class="btn" onclick="document.getElementById('csv')?.click()">CSV aktualisieren</button></div>`}
function providerRows(){const names=['CA Auto Bank','LichtBlick · Strom','Grünwelt · Gas','EnBW · Strom'],all=[...DATA.fixed.map(x=>({...x,status:'active'})),...DATA.history.map(x=>({...x,status:'old'}))];return names.map(n=>{const x=all.find(a=>a.name===n);if(!x)return'';return `<div class="row"><div><div class="name">${x.name}<span class="pill ${x.status==='active'?'active':'old'}">${x.status==='active'?'AKTIV':'HISTORISCH'}</span></div><div class="meta">letzte passende Buchung ${dstr(x.last)} · ${x.months} Monat(e) erkannt</div></div><div class="amt">${x.interval==='annual'?eur(x.sourceAmount)+'/Jahr':eur(x.amount)+'/Mon.'}</div></div>`}).join('')}
function overview(){if(!DATA)return header()+`<div class="empty"><div class="icon">📊</div><h2>Erst die echte Kontodatei</h2><p class="muted">Keine Schätzungen und keine alten Anbieter. FinanzPilot liest eure aktuelle BW-Bank-CSV und trennt aktiv, historisch und variabel.</p>${fileInput()}</div>`;const fc=DATA.fixedCat,seg=[['Finanzierung',fc.Finanzierung||0,'#66a9ff'],['Energie',fc.Energie||0,'#55d3d8'],['Versicherung',fc.Versicherung||0,'#a58cff'],['Telekommunikation',fc.Telekommunikation||0,'#ef8ab8'],['Mobilität',fc.Mobilität||0,'#ffb24f'],['Sonstiges',(fc.Bank||0)+(fc.Optional||0),'#8fb1c8']].filter(x=>x[1]>0);let start=0,parts=[];for(const x of seg){const p=x[1]/DATA.fixedTotal*100;parts.push(`${x[2]} ${start}% ${start+p}%`);start+=p}const donut=parts.length?`conic-gradient(${parts.join(',')})`:'#18344e',top=Object.entries(DATA.varCats).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...top.map(x=>x[1]));return header()+`<div class="hero"><div class="label">Aktuelle erkannte Fixkosten</div><div class="big">${eur0(DATA.fixedTotal)} / Monat</div><div class="meta">Nur aktuell laufende Posten. Alte Anbieter werden nicht mitgerechnet.</div></div><div class="grid"><div class="metric"><div class="l">Finanzierungen</div><div class="v">${eur0(fc.Finanzierung||0)}</div></div><div class="metric"><div class="l">Energie</div><div class="v">${eur0(fc.Energie||0)}</div></div></div><div class="sec"><h2>Wo gehen die Fixkosten hin?</h2><div class="card donutWrap"><div class="donut" style="background:${donut}"><div class="donutCenter">${eur0(DATA.fixedTotal)}</div></div><div class="legend">${seg.map(x=>`<div class="leg"><span class="dot" style="background:${x[2]}"></span><span>${x[0]}</span><b>${eur0(x[1])}</b></div>`).join('')}</div></div></div><div class="sec"><h2>Variable Ausgaben · Ø pro Monat</h2><div class="card">${top.map(([n,v],i)=>`<div class="chartRow"><div class="chartLabel">${n}</div><div class="bar"><div class="fill" style="width:${Math.max(2,v/max*100)}%;background:${['#66a9ff','#a58cff','#55d3d8','#ffb24f','#ef8ab8','#8fb1c8'][i%6]}"></div></div><div class="chartVal">${eur0(v)}</div></div>`).join('')}</div></div><div class="sec"><h2>Aktuelle Anbieter</h2><div class="card">${providerRows()}</div></div><div class="note">Auswertung: ${dstr(DATA.range.min)} bis ${dstr(DATA.range.max)} · variable Monatswerte nur aus vollständigen Monaten.</div>${fileInput()}`}
function fixedView(){if(!DATA)return overview();const groups={};for(const x of DATA.fixed)(groups[x.category]=groups[x.category]||[]).push(x);return header()+`<div class="sec"><h2>Aktuelle Fixkosten</h2>${Object.entries(groups).map(([g,xs])=>`<div class="card" style="margin-bottom:9px"><div class="name">${g}</div>${xs.map(x=>`<div class="row"><div><div class="name">${x.name}<span class="pill active">AKTIV</span></div><div class="meta">letzte Buchung ${dstr(x.last)} · ${x.interval==='annual'?'Jahreszahlung, monatlich zurückgelegt':x.months+' Monat(e) erkannt'}</div></div><div class="amt">${eur(x.amount)}</div></div>`).join('')}</div>`).join('')}</div><div class="sec"><h2>Historisch / nicht mehr laufend</h2><div class="card historyCard">${DATA.history.length?DATA.history.map(x=>`<div class="row"><div><div class="name">${x.name}<span class="pill old">NICHT AKTUELL</span></div><div class="meta">letzte passende Buchung ${dstr(x.last)} · wird NICHT in aktuelle Fixkosten gerechnet</div></div><div class="amt muted">${eur(x.amount)}</div></div>`).join(''):'Keine alten Fixkosten erkannt.'}</div></div>${fileInput()}`}
function varView(){if(!DATA)return overview();const cats=Object.entries(DATA.varCats).sort((a,b)=>b[1]-a[1]);return header()+`<div class="sec"><h2>Variable Ausgaben</h2><div class="card"><div class="meta" style="margin-bottom:8px">Kategorie antippen → alle Läden sehen.</div>${cats.map(([c,v],i)=>{const ms=Object.entries(DATA.merchants[c]||{}).sort((a,b)=>b[1].sum-a[1].sum);return `<div class="row click" onclick="toggleD(${i})"><div><div class="name">${c}</div><div class="meta">${ms.length} Händler · Ø vollständige Monate</div></div><div class="amt">${eur0(v)}</div></div><div class="details" id="d${i}">${ms.map(([n,q])=>`<div class="shopRow"><div><div class="name">${n}</div><div class="meta">${q.n} Buchung${q.n===1?'':'en'}</div></div><div class="amt">${eur(q.sum)}</div></div>`).join('')}</div>`}).join('')}</div></div>${fileInput()}`}function toggleD(i){document.getElementById('d'+i)?.classList.toggle('open')}
function historyView(){if(!DATA)return overview();const m=DATA.monthVar,max=Math.max(1,...m.map(x=>x.total));return header()+`<div class="sec"><h2>Variable Ausgaben im Verlauf</h2><div class="card"><div class="monthbar">${m.map(x=>`<div class="mb" title="${x.month}: ${eur(x.total)}" style="height:${Math.max(3,x.total/max*100)}%"></div>`).join('')}</div><div class="mlabels">${m.map(x=>`<span>${x.month.slice(5)}</span>`).join('')}</div><div class="note">Nur vollständige Monate; Fixkosten sind hier bewusst herausgerechnet.</div></div></div><div class="sec"><h2>Monate im Detail</h2><div class="card">${m.map(x=>`<div class="row"><div class="name">${x.month}</div><div class="amt">${eur0(x.total)}</div></div>`).join('')}</div></div>${fileInput()}`}
function advisorView(){if(!DATA)return overview();const v=DATA.varCats,food=v['Lebensmittel & Drogerie']||0,shop=v.Shopping||0,fuel=v.Tanken||0,foodTarget=1250,shopTarget=600,fuelTarget=220,pot=Math.max(0,food-foodTarget)+Math.max(0,shop-shopTarget)+Math.max(0,fuel-fuelTarget),finance=DATA.fixedCat.Finanzierung||0,energy=DATA.fixedCat.Energie||0;return header()+`<div class="hero"><div class="label">Realistischer monatlicher Sparhebel</div><div class="big good">${eur0(pot)}</div><div class="meta">Nur aus Einkauf + Shopping + Tanken gegenüber den Zielwerten. Keine Doppelzählung.</div></div><div class="sec"><h2>Was ich euch rate</h2><div class="advisor ${shop>shopTarget?'badbox':''}"><b>1 · Shopping</b><p>Ø ${eur0(shop)} / Monat. Ziel ${eur0(shopTarget)}. Hier steckt ${eur0(Math.max(0,shop-shopTarget))} Potenzial.</p></div><div class="advisor ${food>foodTarget?'warnbox':''}"><b>2 · Lebensmittel & Drogerie</b><p>Ø ${eur0(food)} / Monat. Ziel ${eur0(foodTarget)}. Potenzial ${eur0(Math.max(0,food-foodTarget))}.</p></div><div class="advisor ${fuel>fuelTarget?'warnbox':''}"><b>3 · Tanken</b><p>Ø ${eur0(fuel)} / Monat. Ziel ${eur0(fuelTarget)}. Potenzial ${eur0(Math.max(0,fuel-fuelTarget))}.</p></div><div class="advisor badbox"><b>4 · Finanzierungen vor Hauskauf</b><p>Aktuell erkannt: ca. ${eur0(finance)} pro Monat. Jede erledigte Rate erhöht später euren freien Haus-Spielraum.</p></div><div class="advisor ${energy>0?'warnbox':''}"><b>5 · Strom & Gas getrennt prüfen</b><p>Aktuell ${eur0(energy)} pro Monat. LichtBlick und Grünwelt werden als aktiv erkannt; EnBW wird als historisch angezeigt. Ob 399 € zu hoch sind, lässt sich erst mit kWh + Tarif bewerten.</p></div></div><div class="sec"><h2>Wichtig: Datenqualität</h2><div class="card"><div class="meta">Ein monatlicher Anbieter gilt nur als aktuell, wenn passende wiederkehrende Buchungen in den letzten ca. 75 Tagen vorhanden sind. Jahreszahlungen haben ein eigenes Fenster. So tauchen alte Anbieter nicht mehr in den aktuellen Fixkosten auf.</div></div></div>${fileInput()}`}
function render(){document.getElementById('app').innerHTML=TAB==='overview'?overview():TAB==='fixed'?fixedView():TAB==='var'?varView():TAB==='history'?historyView():advisorView();bindFile();const tabs=[['overview','⌂','Übersicht'],['fixed','▣','Fixkosten'],['var','▤','Variabel'],['history','▥','Verlauf'],['advisor','◈','Berater']];document.getElementById('tabs').innerHTML=tabs.map(x=>`<button class="tab ${TAB===x[0]?'on':''}" onclick="TAB='${x[0]}';render();window.scrollTo(0,0)"><b>${x[1]}</b>${x[2]}</button>`).join('')}render();
</script></body></html>
