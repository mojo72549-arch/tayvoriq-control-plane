plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mofit.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.mofit.v4"
        minSdk 26
        targetSdk 35
        versionCode 400
        versionName "4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
